оцдог вэ?\",\"answer\":\"TFP growth = Growth in potential GDP – [WL (Growth in labor) + WC (Growth in capital)]. TFP-ийн өсөлтийг боломжит ДНБ-ийн өсөлтийн хурд болон хөдөлмөр, капиталын жигнэсэн дундаж өсөлтийн хурдны зөрүү (үлдэгдэл, residual) болгон тооцдог.  ## Эдийн засгийн өсөлтийн эх үүсвэрүүд (Sources of Economic Growth)\"},{\"id\":61,\"question\":\"Эдийн засгийн өсөлтийн тав чухал эх үүсвэр юу вэ?\",\"answer\":\"1) Хөдөлмөрийн нөөц (labor supply); 2) Хүний капитал (human capital); 3) Физик капитал (physical capital); 4) Технологи (technology); 5) Байгалийн нөөц (natural resources).\"},{\"id\":62,\"question\":\"Нийт ажилласан цагийг (total hours worked) хэрхэн тооцдог вэ?\",\"answer\":\"Total hours worked = Labor force × Average hours worked per worker. Хөдөлмөрийн хүчин (labor force) нь ажил эрхлэлттэй эсвэл ажил хайж байгаа боловч ажиллаагүй (16-аас дээш насны) хүн амын хувийг хэлнэ.\"},{\"id\":63,\"question\":\"Хүний капитал (human capital) гэж юу вэ, өсөлтөд хэрхэн нөлөөлдөг вэ?\",\"answer\":\"Хүний капитал нь боловсрол, сургалт, амьдралын туршлагаас олсон мэдлэг, ур чадварын хуримтлал бөгөөд ажилчдын чанарыг хэмждэг. Илүү сайн боловсон хүчин бүтээмжийнхээ улмаас илүү их бий болгодог бас технологийн өөрчлөлтөд илүү уян хатан дасан зохицдог. Боловсрол нь мөн хажуугийн нөлөөлөл (spillover/externality эффект)-той — нэг хүний боловсрол нэмэгдэхэд түүний эргэн тойрныхны гарц ч нэмэгддэг.\"},{\"id\":64,\"question\":\"Физик капиталын нөөц (physical capital stock)-ийн өсөлт юунаас хамаардаг вэ?\",\"answer\":\"Физик капиталын нөөц жил бүр нэмэгддэг, хэрвээ цэвэр хөрөнгө оруулалт (net investment = нийт хөрөнгө оруулалт хасах элэгдэл) эерэг байвал. Иймд өндөр хөрөнгө оруулалтын хувьтай орнуудад (жишээ нь, Хятад, Хойд Солонгос) капиталын нөөц өсч, ДНБ-ийн өсөлтийн хурд хурдан байдаг — хөрөнгө оруулалт, эдийн засгийн өсөлтийн хооронд өндөр хамаарал ажиглагддаг.\"},{\"id\":65,\"question\":\"Технологи (technology) яагаад хөгжингүй орнуудын эдийн засгийн өсөлтийн гол хүчин зүйл вэ?\",\"answer\":\"Технологийн дэвшил нь үйлдвэрлэгчдэд капиталын хязгаарын бууралттай бүтээмжийн хязгаарыг давж гарах боломж олгодог. Хэрвээ зөвхөн оруулга (хөдөлмөр, капитал)-аа өсгөхөд тулгуурлавал өсөлт хязгаарлагдана. Технологийн дэвшил нь судалгаа, хөгжүүлэлт (research and development, R\u0026D)-ийн зардал, патент, импортлох, хуулбарлах замаар бий болдог. TFP нь технологийн дэвшлийг тусгадаг тул үлдэгдэл (residual) байдлаар тооцогддог.\"},{\"id\":66,\"question\":\"Сэргээгдэх (renewable) ба сэргээгдэх боломжгуй (non-renewable) байгалийн нөөцийн ялгаа юу вэ?\",\"answer\":\"Сэргээгдэх нөөц нь хэрэглэснийхээ дараа дахин нөхөж болох нөөц (жишээ нь ой — цавчсаны дараа дахин тарьж болно). Сэргээгдэх боломжгуй нөөц нь хязгаарлагдмал бөгөөд хэрэглэсний дараа бэлтгэл нь дуусдаг (жишээ нь газрын тос, нүүрс).\"},{\"id\":67,\"question\":\"Малтусын онол (Malthusian growth theory) юу гэж таамаглаж байсан бэ, яагаад бодитой болгоогүй вэ?\",\"answer\":\"Томас Малтус 1798 онд хөдөлмөрийг цорын ганц хувьсах оруулга гэж үзэж, хүн ам, хөдөлмөрийн хүчин өсөх тусам хөдөлмөрийн хязгаарын бүтээмж тэг рүү дөхнө, тиймээс урт хугацааны эдийн засгийн өсөлт боломжгуй болно гэж таамаглаж байсан. Энэ бодит болоогүй шалтгаан бол эдийн засагчид анализыг хөдөлмөрөөс капиталруу, мөн чухал нь технологийн дэвшилд (TFP-ийн өсөлтөд) шилжүүлсэнд оршдог — технологи хязгаарын бууралттай бүтээмжийг давж гарах боломж олгодог.  ## Тогтвортой өсөлтийн хэмжүүрүүд (Measures of Sustainable Growth)\"},{\"id\":68,\"question\":\"Хөдөлмөрийн бүтээмж (labor productivity) гэж юу вэ, томъёо юу вэ?\",\"answer\":\"Хөдөлмөрийн бүтээмж нь ажилчин нэг цагийн ажлаар үйлдвэрлэх бараа, үйлчилгээний хэмжээ (real GDP) юм. Labor productivity = Real GDP/Aggregate hours. Хөдөлмөрийн бүтээмж нэмэгдвэл амьдралын стандарт сайжирна.\"},{\"id\":69,\"question\":\"Боломжит ДНБ-ийг (potential GDP) ажилласан цаг ба бүтээмжийн үржвэрээр хэрхэн илэрхийлдэг вэ?\",\"answer\":\"Potential GDP = Aggregate hours worked × Labor productivity. Өсөлтийн хурдаар илэрхийлбэл: Potential growth rate = Long-term growth rate of labor force + Long-term labor productivity growth rate.\"},{\"id\":70,\"question\":\"Эдийн засгийн тогтвортой өсөлтийн түвшинг (sustainable growth rate) хамгийн практик байдлаар хэрхэн тооцдог вэ?\",\"answer\":\"Тогтвортой өсөлтийн түвшин нь хөдөлмөрийн хүчний урт хугацааны өсөлтийн хурд болон хөдөлмөрийн бүтээмжийн урт хугацааны өсөлтийн хурдны нийлбэртэй тэнцдэг. Энэ нь TFP, боломжит ДНБ шууд ажиглагдаагүй (\\\"unobserved\\\") тул хөдөлмөрийн бүтээмж ба хөдөлмөрийн хэмжээ шууд ажиглагддаг тул илүү практик арга юм.\"},{\"id\":71,\"question\":\"Хөгжингүй ба хөгжиж буй орнуудад хөдөлмөрийн бүтээмжийн түвшин ба өсөлтийн хурд хэрхэн ялгаатай ажиглагддаг вэ?\",\"answer\":\"Хөдөлмөрийн бүтээмжийн түвшин (level) нь хуримтлагдсан хүний, физик капиталаас хамаардаг тул хөгжингүй орнуудад (жишээ нь Германд, Ирландад) илүү өндөр байдаг. Харин бүтээмжийн өсөлтийн хурд (growth rate) нь ихэвчлэн хөгжиж буй орнуудад (хүний, физик капитал цорхоюг хэмжээгээр хурдан өсдөг орнуудад) илүү өндөр ажиглагддаг.\"},{\"id\":72,\"question\":\"Бодит ДНБ-ийн өсөлт боломжит ДНБ-ийн өсөлтөөс хурдан, эсвэл удаан явахад эдийн засаг, хөрөнгийн зах зээлд ямар дүгнэлт хийж болох вэ?\",\"answer\":\"Бодит ДНБ боломжит ДНБ-ээс хурдан өсч байвал энэ нь эдийн засагт инфляцийн дарамт нэмэгдэж, төв банк хүүгийн түвшинг нэмэгдүүлэх магадлал өндөрсдөг гэсэн дохио юм. Бодит ДНБ боломжит ДНБ-ээс удаан өсч байвал энэ нь нөөцийн сулралт (slack) нэмэгдэж, инфляцийн дарамт багасан, төв банк хүүгийн түвшинг бууруулах, эсвэл хэвээр хадгалах магадлал нэмэгддэг гэсэн дохио юм.\"}]},{\"id\":\"business-cycles\",\"title\":\"Бизнес мөчлөгийг ойлгох нь\",\"cards\":[{\"id\":1,\"question\":\"Burns, Mitchell (1946)-ын тодорхойлолтоор бизнес мөчлөг (business cycle) гэж юу вэ, мөн энэ тодорхойлолтын гол шинж чанарууд юу вэ?\",\"answer\":\"Бизнес мөчлөг бол бизнес аж ахуйн нэгжүүдээр зохион байгуулагддаг улс орнуудын нийт эдийн засгийн үйл ажиллагаанд (aggregate economic activity) ажиглагддаг хэлбэлзэл бөгөөд өсөлт (expansion), бууралт (contraction/recession), сэргэлт зэрэг үе шатуудаас бүрддэг. Энэ нь давтагддаг (recurrent), гэвч тогтмол биш (not periodic) үзэгдэл бөгөөд ердийн хугацаа нь 1-ээс 12 жил хүртэл үргэлжилдэг.\"},{\"id\":2,\"question\":\"Бизнес мөчлөгийн дөрвөн үе шат (four phases) юу вэ?\",\"answer\":\"Доод цэг (trough), өсөлт/тэлэлт (expansion), оргил (peak), бууралт (contraction). Оргил ба доод цэг нь мөчлөгийн эргэлтийн цэгүүд (turning points) юм.\"},{\"id\":3,\"question\":\"\\\"Contraction\\\" буюу \\\"recession\\\" гэж юу вэ, мөн \\\"depression\\\" гэж хэзээ нэрлэдэг вэ?\",\"answer\":\"Contraction (бууралт) бол оргилын дараа, доод цэгээс өмнөх үе бөгөөд энэ үед нийт эдийн засгийн үйл ажиллагаа буурдаг. Энэ үзэгдлийг ихэвчлэн рецесс (recession) гэж нэрлэдэг ба маш хүнд, гүнзгий тохиолдолд депресс (depression) гэнэ.\"},{\"id\":4,\"question\":\"Рецесс эхэлсэн эсэхийг тодорхойлох түгээмэл дүрэм (rule of thumb) юу вэ, мөн энэ дүрмийн сул тал юу вэ?\",\"answer\":\"Хэрэв улс орны бодит ДНБ-ийн (real GDP) өсөлт хоёр улиран дараалан сөрөг байвал рецесс эхэлсэн гэж үзнэ. Гэхдээ энэ дүрэм алдаатай байж болно: жишээ нь, бодит ДНБ нэг улиралд сөрөг, дараагийн улиралд бага зэрэг эерэг, дараа нь дахин сөрөг байвал энэ энгийн дүрэм рецессийг зөв илрүүлэхгүй.\"},{\"id\":5,\"question\":\"АНУ-д бизнес мөчлөгийн оргил ба доод цэгийг тодорхойлдог байгууллага ямар бөгөөд ямар хувьсагчдыг шинжилдэг вэ?\",\"answer\":\"Үндэсний Эдийн Засгийн Судалгааны Товчоо (National Bureau of Economic Research, NBER) нь АНУ-ын бизнес мөчлөгийг тодорхойлдог бөгөөд зөвхөн бодит ДНБ-аар хязгаарлагдахгүй, хөдөлмөр эрхлэлт (employment), аж үйлдвэрийн үйлдвэрлэл (industrial production), борлуулалт (sales) зэрэг олон цаг хугацааны мэдээллийг шинжилдэг.\"},{\"id\":6,\"question\":\"Эдийн засгийн тэлэлтийн сүүл үе дэх \\\"бум\\\" (boom) гэж юу вэ, мөн энэ үед эдийн засаг \\\"хэт халах\\\" (overheating) нь юугаар илэрдэг вэ?\",\"answer\":\"Бум бол тэлэлтийн сүүл үе, эдийн засаг өсөлтийнхөө \\\"хязгаарыг шалгадаг\\\" үе юм. Энэ үед компаниуд ур чадвартай ажилчин олоход бэрхшээлтэй тулгардаг, цалин хөлс нэмэгдэж, зээлжилт (borrowing) ихэсдэг бөгөөд үүний үр дүнд инфляцийн эрсдэл нэмэгддэг — үүнийг хэт халалт гэнэ.\"},{\"id\":7,\"question\":\"Рецессийн үед хөрөнгийн зах зээлд хөрөнгө оруулагчдын зан төлөв хэрхэн өөрчлөгддөг вэ, мөн хувьцааны зах зээл яагаад урьдлагын үзүүлэлт (leading indicator) гэж тооцогддог вэ?\",\"answer\":\"Рецессийн үед хөрөнгө оруулагчид засгийн газрын бонд, тогтвортой мөнгөн урсгалтай компанийн хувьцаа зэрэг аюулгүй хөрөнгийг илүүд үздэг. Хувьцааны зах зээл ихэвчлэн эдийн засгийн доод цэгээс 3-6 сарын өмнө доод цэгтээ хүрдэг тул эдийн засгийн урьдлагын үзүүлэлт гэж тооцогддог.\"},{\"id\":8,\"question\":\"Бизнес мөчлөгийн үе шат бүрт ажилгүйдэл, инфляци, хөрөнгийн зарлагын өөрчлөлт ямар ерөнхий чиг хандлагатай байдаг вэ?\",\"answer\":\"Эрт тэлэлтэд ажилгүйдлийн түвшин өндөр хэвээр, бага бага буурч эхлэнэ; инфляци тогтвортой. Хожуу тэлэлтэд ажилгүйдэл буурч, инфляци бага зэрэг хурдасна. Оргилд хөрөнгийн зарлага хурдан тэлэх хэдий ч өсөлтийн хурд саарна, инфляци улам хурдасна. Бууралтад ажилгүйдэл өсч, бусад бүх үзүүлэлт тодорхой буурна.  ## Нөөцийн ашиглалт, орон сууц, гадаад худалдааны салбарын зан төлөв (Resource Use, Housing, and External Trade Sector Behavior)\"},{\"id\":9,\"question\":\"Эдийн засгийн уналт эхлэхэд компаниуд яагаад ажилчдаа шууд халдаггүй, харин юу хийдэг вэ?\",\"answer\":\"Шинэ ажилчин олж сургах зардал өндөр тул компаниуд эхлээд илүү цагийн ажлыг (overtime) зогсоож, зардлаа багасгадаг бөгөөд уналт нь зөвхөн түр зуурынх байж болзошгүй тул ажилчдаа халах нь үр ашиггүй гэж үздэг.\"},{\"id\":10,\"question\":\"Боломжит бүтээгдэхүүний (potential output, GDPP) ба рецессийн бүтээгдэхүүний (recession output, GDPR) хоорондох зай юуг илэрхийлдэг вэ?\",\"answer\":\"Энэ зай нь нөөцийн чөлөөт байдлыг (slack resources) харуулдаг — хөдөлмөрийн хувьд ажилгүйдэл, бодит хөрөнгийн хувьд идэлхийг (idleness) илэрхийлнэ.\"},{\"id\":11,\"question\":\"Хөрөнгийн зарлага (capital spending) бизнес мөчлөгийн явцад гурван үе шатаар хэрхэн хэлбэлзэх вэ?\",\"answer\":\"Бууралтын эхэн үед хөнгөн тоног төхөөрөмжийн захиалга хурдан буурдаг; тэлэлтийн эхэн үед технологи, програм хангамж зэрэг үр ашиг нэмэгдүүлэх захиалга сэргэдэг; тэлэлтийн сүүл үед хүчин чадал нэмэгдүүлэх зориулалттай хүнд тоног төхөөрөмж, байгууламжийн захиалга нэмэгддэг.\"},{\"id\":12,\"question\":\"Нөөц–борлуулалтын харьцаа (inventory–sales ratio) бизнес мөчлөгийн явцад хэрхэн өөрчлөгддөг вэ?\",\"answer\":\"Мөчлөгийн оргилд борлуулалт удааширч, нөөц хуримтлагддагаас харьцаа өснө. Уналтын дунд үед компаниуд үйлдвэрлэлийг цомхотгож харьцаа буурна. Сэргэлтийн эхэнд борлуулалт үйлдвэрлэлээс түрүүлж харьцаа цааш буурна.\"},{\"id\":13,\"question\":\"Өрхийн хэрэглээний гурван үндсэн ангилал юу вэ, мөн эдийн засгийн уналтад эдгээр нь ямар эрэмбээр буурдаг вэ?\",\"answer\":\"(1) Уртхугацаатай хэрэглээний бараа (durable goods), (2) богино хугацаатай хэрэглээний бараа (non-durable goods), (3) үйлчилгээ (services). Уртхугацаатай барааны худалдан авалтыг хойшлуулах боломж өндөр тул эдийн засгийн уналтад эхлээд урт хугацаатай барааны хэрэглээ хамгийн тодоор буурдаг.\"},{\"id\":14,\"question\":\"\\\"Байнгын орлого\\\" (permanent income) гэсэн ойлголт юу вэ, мөн энэ нь ямар хэрэглээг тайлбарлахад илүү тохиромжтой вэ?\",\"answer\":\"Байнгын орлого нь түр зуурын орлого, алдагдал, олзыг хассан, өрх тогтвортой найдаж болох орлогын урсгалыг илэрхийлдэг. Энэ ойлголт нь үйлчилгээ болон суурь хэрэглээг тайлбарлахад илүү тохиромжтой; харин урт хугацаатай барааны хэрэглээ нь ашиглах боломжтой орлого (disposable income)-той илүү уялдаатай байдаг.\"},{\"id\":15,\"question\":\"Хадгаламжийн түвшин (saving rate) өсөхөд энэ нь юуг илэрхийлж болох вэ?\",\"answer\":\"Хадгаламжийн түвшний өсөлт нь ирээдүйн орлогын тодорхойгүй байдлаас урьдчилан хадгалах (precautionary savings) зан төлөвийг илэрхийлж, өрхүүдийн зарцуулалтаа хязгаарлах хүсэлтэй байгааг илтгэнэ — энэ нь богино хугацаанд эдийн засгийн сулралтын шинж тэмдэг байж болох ч урт хугацаанд сэргэлтийн нөөц боломжийг нэмэгдүүлдэг.\"},{\"id\":16,\"question\":\"Орон сууцны салбар (housing sector) яагаад хүүгийн түвшинд (interest rates) маш мэдрэмтгий байдаг вэ?\",\"answer\":\"Ихэнх орон сууц худалдан авагч моргейж зээлээр санхүүжүүлдэг тул моргейжийн хүү буурахад орон сууц худалдан авалт, барилгын үйл ажиллагаа тэлж, хүү өсөхөд агшдаг.\"},{\"id\":17,\"question\":\"Гэр бүл үүсэх хурц (family/household formation) хандлага орон сууцны мөчлөгт ямар үүрэг гүйцэтгэдэг вэ?\",\"answer\":\"Энэ нь орон сууцны урт хугацааны, бүтцийн (secular) эрэлтийг тодорхойлдог бөгөөд 25-40 насны хүн амын өсөлт зэргээр үнэлж болно. Энэ хүчин зүйл нь бизнес мөчлөгтэй шууд холбоогүй ч зах зээлийн хэт зорилтыг (overbuilding) хэр хурдан засч залруулж болохыг тодорхойлоход тустай.\"},{\"id\":18,\"question\":\"Импорт (imports) ба экспорт (exports) тус тус юунаас хамааралтай вэ?\",\"answer\":\"Импорт голчлон дотоодын ДНБ-ийн өсөлтийн хурдаас хамаардаг, харин экспорт гол худалдааны түнш орнуудын дэлхийн эдийн засгийн мөчлөгөөс хамаардаг.\"},{\"id\":19,\"question\":\"Улсын мөнгөн тэмдэгтийн ханш нэмэгдэх (currency appreciation) нь худалдааны урсгалд ямар нөлөө үзүүлдэг вэ?\",\"answer\":\"Мөнгөн тэмдэгтийн ханш нэмэгдэхэд гадаад бараа харьцангуй хямд болж импорт нэмэгддэг, харин дотоодын экспорт гадаад зах зээлд үнэтэй болж буурдаг. Мөнгөн тэмдэгтийн ханш уналт (depreciation) эсрэг нөлөө үзүүлдэг.  ## Бизнес мөчлөгийн онолууд (Theories of the Business Cycle)\"},{\"id\":20,\"question\":\"Неоклассик сургуулийн (Neoclassical school) \\\"нийтийн тэнцвэр\\\" (general equilibrium) үзэл баримтлал юу вэ, мөн энэ нь бизнес мөчлөгийг хэрхэн тайлбарладаг вэ?\",\"answer\":\"Неоклассик онолын үзэж байгаагаар \\\"үл үзэгдэх гар\\\" (invisible hand) бүх зах зээлийг тэнцвэртэй болгоно — үнэ, хүү, цалин уян хатан бол аливаа шок хурдан шингэж тэнцвэр сэргэнэ. Тиймээс энэ сургуулийд хүчтэй бизнес мөчлөгийн онол байхгүй, хэлбэлзлийг зөвхөн түр зуурын тэнцвэргүй байдал (temporary disequilibria) гэж үзнэ.\"},{\"id\":21,\"question\":\"Say-н хууль (Say's law) гэж юу вэ?\",\"answer\":\"\\\"Нийлүүлэлт өөрийн эрэлтийг бүрдүүлдэг\\\" (supply creates its own demand) хууль бөгөөд үйлдвэрлэсэн бараа бүр зарагдана гэж үздэг — учир нь үйлдвэрлэлд ашигласан хөдөлмөр, капиталд хийсэн төлбөр (цалин, хүү) нь худалдан авах чадварыг бий болгоно.\"},{\"id\":22,\"question\":\"Шумпетерийн \\\"бүтээлч эвдрэл\\\" (creative destruction) онол юу вэ?\",\"answer\":\"Энэ онол технологийн дэвшлээс үүдэн тодорхой салбарт мөчлөг үүсдэг гэж тайлбарлана — шинэ бүтээгч бизнес эрхлэгч хуучин үйлдвэрлэгчдийг зах зээлээс шахан гаргах боловч энэ нь эдийн засгийн хэмжээний (economy-wide) хэлбэлзэл биш, зөвхөн тухайн салбарын хэлбэлзэл юм.\"},{\"id\":23,\"question\":\"Австрийн сургуулийн (Austrian school) бизнес мөчлөгийн гол тайлбар юу вэ?\",\"answer\":\"Австрийн сургуулийн үзэж байгаагаар бага хүүгийн түвшин хэт их зээлийн өсөлтийг (excessive credit growth) дагуулж, ашиг багатай төсөлд хэт их хөрөнгө оруулалт хийгдэнэ. Хүү өсөхөд эдгээр хөрөнгө оруулалт бүтэлгүйтэж эдийн засаг рецессд орно. Тиймээс тэд засгийн газар/төв банкны хязгаарлагдмал оролцоог дэмждэг.\"},{\"id\":24,\"question\":\"Кейнсийн сургуулийн (Keynesian school) үзэж байгаагаар рецессийн үед цалин, үнэ буулгах нь яагаад тэнцвэрт эдийн засагт хурдан буцааж чадахгүй вэ?\",\"answer\":\"Кейнс ажилчдын цалин буурахад тэдний зарцуулалт буурч, нийт эрэлт (aggregate demand) зүүн тийш шилжиж, хямралыг улам хурцатгана гэж тайлбарлав. Тиймээс засгийн газрын бодлого (фискал бодлого) оролцоход шаардлагатай гэж үзсэн.\"},{\"id\":25,\"question\":\"Кейнсийн \\\"in the long run, we are all dead\\\" гэсэн алдартай хэллэг ямар утгатай вэ?\",\"answer\":\"Зах зээл урт хугацаанд тэнцвэртэйлж болох хэдий ч, рецессийн хохирол, хүний зовлон хэт их байдаг тул засгийн газар богино хугацаанд шийдвэртэй арга хэмжээ авах ёстой гэдгийг онцолсон хэллэг юм.\"},{\"id\":26,\"question\":\"Кейнсийн фискал бодлогод тулгуурласан арга барилын гол шүүмжлэл юу вэ?\",\"answer\":\"(1) Фискал алдагдал засгийн газрын өрийг нэмэгдүүлнэ, (2) бодлого хэт сунжирвал эдийн засаг \\\"хэт халах\\\" (overheat) эрсдэлтэй, (3) фискал бодлого хэрэгжихэд хугацаа шаарддаг тул нэмэлт өдөөлт хэрэгжих үед эдийн засаг аль хэдийн сэргэсэн байх магадлалтай.\"},{\"id\":27,\"question\":\"Хайман Минскийн (Hyman Minsky) \\\"Minsky moment\\\" гэж юу вэ?\",\"answer\":\"Энэ нь тэлэлтийн сүүл үед хэт их зээлээр санхүүжсэн спекулятив хөрөнгө оруулалтын дараа хүмүүс эрсдэлийг таньж, цочирдож, хөрөнгөө түргэн зарж борлуулдаг (asset sell-offs) агшин юм. Санхүүгийн зах зээлийн хэт их итгэл (complacency) нь эдийн засгийн хэлбэлзлийг улам хурцатгадаг гэж Минский үзсэн.\"},{\"id\":28,\"question\":\"Монетарист сургуул (Monetarist school) Кейнсийн оролцоог ямар дөрвөн шалтгаанаар шүүмжилдэг вэ?\",\"answer\":\"(1) Кейнсийн загвар мөнгний нийлүүлэлтийн (money supply) ач холбогдлыг үл тооцдог, (2) ашиг дээд зэргийн зарцагч (utility-maximizing) агентуудыг бүрэн дүрсэлдэггүй, (3) засгийн газрын оролцооны урт хугацааны зардлыг (өр, хүү) тооцдоггүй, (4) бодлогын хэрэгжих хугацаа тодорхойгүй байдаг.\"},{\"id\":29,\"question\":\"Монетаристуудын санал болгодог бодлого юу вэ?\",\"answer\":\"Мөнгний нийлүүлэлтийг тогтвортой, тэгшитгэсэн хурдтай (steady, moderate rate) өсгөх, засгийн газрын эдийн засагт оролцоог хязгаарлах, фискал ба мөнгний бодлогыг тодорхой, тогтвортой байлгах.\"},{\"id\":30,\"question\":\"Шинэ Классик сургуулийн (New Classical school) бодит бизнес мөчлөгийн онол (Real Business Cycle, RBC) мөнгийг хэрхэн авч үздэг вэ?\",\"answer\":\"RBC загварт мөнгө байдаггүй — эдийн засгийн хэлбэлзэл нь технологи, амт, дэлхийн үнийн өөрчлөлт зэрэг бодит шок (real shocks)-оос үүсдэг гэж үзнэ. Инфляци зэрэг мөнгөн хувьсагчид бодит ДНБ, ажилгүйдэлд нөлөөгүй гэж тооцдог.\"},{\"id\":31,\"question\":\"Нео-Кейнсийн (Neo-Keynesian) загвар Шинэ Классик загвараас ямар гол ялгаатай вэ?\",\"answer\":\"Нео-Кейнсийн загвар үнэ, цалин аажим зохицдог (\\\"sticky\\\" prices/wages) гэж тооцдог тул зах зээл тэнцвэрт байдалд шууд хурдан шилжихгүй — энэ нь засгийн газрын оролцоог зарим тохиолдолд зайлшгүй болгодог. Харин Шинэ Классик загвар үнэ, цалин хурдан зохицдог гэж тооцож, засгийн газрын оролцоог шаардлагагүй гэж үздэг.  ## Ажилгүйдэл (Unemployment)\"},{\"id\":32,\"question\":\"\\\"Хөдөлмөрийн хүчин\\\" (labor force) гэж хэн бэ, мөн үүнд хэн хамрагддаггүй вэ?\",\"answer\":\"Хөдөлмөрийн хүчин бол ажилтай эсвэл ажил хайж байгаа хүмүүсийн тоо. Тэтгэвэрт гарагсад, хүүхдүүд, гэрийн эзэгтэй, оюутан зэрэг ажил хайхгүй хүмүүс хамрагддаггүй.\"},{\"id\":33,\"question\":\"Ажилгүйдлийн түвшин (unemployment rate) ямар томъёогоор тооцогддог вэ?\",\"answer\":\"Ажилгүйдлийн түвшин = ажилгүйчүүдийн тоо / хөдөлмөрийн хүчний тоо (unemployment rate = unemployed / labor force).\"},{\"id\":34,\"question\":\"Хөдөлмөр эрхлэлтийн оролцооны харьцаа (activity ratio буюу participation ratio) ямар томъёогоор тооцогддог вэ?\",\"answer\":\"Оролцооны харьцаа = хөдөлмөрийн хүчин / хөдөлмөрийн насны (16-64 нас) нийт хүн ам (activity ratio = labor force / working-age population).\"},{\"id\":35,\"question\":\"\\\"Discouraged worker\\\" (ажил хайхаа больсон хүн) гэж хэн бэ, мөн тэд ажилгүйдлийн статистикт хэрхэн нөлөөлдөг вэ?\",\"answer\":\"Discouraged worker бол ажил олдохгүй гэдэгт итгэж ажил хайхаа больсон хүн бөгөөд албан ёсны хөдөлмөрийн хүчнээс гадуур тооцогддог тул ажилгүйдлийн түвшинд (unemployment rate) тооцогддоггүй — энэ нь \\\"далд ажилгүйдэл\\\" (hidden unemployment)-ийн нэг хэлбэр юм.\"},{\"id\":36,\"question\":\"\\\"Underemployed\\\" (дутуу хөдөлмөр эрхлэгч) гэж хэн бэ?\",\"answer\":\"Underemployed бол ажилтай хэдий ч илүү өндөр цалинтай, өөрийн ур чадварт тохирсон ажил эрхлэх боломжтой хүн. Тэд ажилгүйдлийн түвшинг тооцоход \\\"ажилтай\\\" гэж тооцогддог.\"},{\"id\":37,\"question\":\"Фрикцийн ажилгүйдэл (frictional unemployment) гэж юу вэ, мөн энэ нь яагаад богино хугацаатай вэ?\",\"answer\":\"Фрикцийн ажилгүйдэл бол хүмүүс ажлаасаа гарсан эсвэл шинэ ажил хайж байгаа, өөрийн ур чадвар, сонирхолд илүү тохирсон ажлыг олох хугацаа шаардсанаас үүдсэн ажилгүйдэл. Үүнд ажлаасаа сайн дураараа гарсан, шинээр хөдөлмөрийн хүчинд орж буй хүмүүс хамрагддаг бөгөөд ердөө богино хугацаатай, шилжилтийн шинж чанартай байдаг.\"},{\"id\":38,\"question\":\"Ажилгүйдлийн түвшин яагаад хоцрогдолтой үзүүлэлт (lagging indicator) гэж тооцогддог вэ?\",\"answer\":\"Нэгдүгээрт, хүнд үед discouraged workers ажил хайхаа больж хөдөлмөрийн хүчнээс гарах тул ажилгүйдлийн түвшинг хиймэл бага болгодог бол сэргэлтийн үед ажил хайх хүн буцаж орж ирэхэд түвшинг дээшлүүлнэ. Хоёрдугаарт, бизнесүүд ажилтныг халах, авахад сарвагай тул хариу үзүүлэх нь мөчлөгөөс хоцорддог.\"},{\"id\":39,\"question\":\"NAIRU (non-accelerating inflation rate of unemployment) буюу NARU (natural rate of unemployment) гэж юу вэ?\",\"answer\":\"Энэ бол ажилгүйдлийн түвшин үүнээс доош орвол хөдөлмөрийн зах зээлд хомсдол, цалин-үнийн спираль (wage-price spiral) үүсгэдэг \\\"байгалийн\\\" түвшин юм. Энэ түвшин эдийн засаг бүрт, цаг хугацаанд өөр өөр байдаг бөгөөд шууд ажиглах боломжгүй.\"},{\"id\":40,\"question\":\"Нэгж хөдөлмөрийн зардал (unit labor cost, ULC) ямар томъёогоор тооцогддог вэ?\",\"answer\":\"ULC = W / O. Энд ULC = нэгж хөдөлмөрийн зардал, O = ажилчин бүрийн цагийн гарц (output per hour per worker), W = ажилчин бүрийн цагийн нийт хөдөлмөрийн шагнал (total labor compensation per hour per worker).  ## Инфляци (Inflation)\"},{\"id\":41,\"question\":\"Дефляци (deflation), хэт их инфляци (hyperinflation), дисинфляци (disinflation) гэсэн гурван нэр томъёог ялгаарай.\",\"answer\":\"Deflation — нийт үнийн түвшин байнга буурч, инфляцийн түвшин 0%-иас доош байх; hyperinflation — инфляцийн түвшин маш хурдан, жилд 500-1000% хүртэл өсдөг түвшинд хүрэх; disinflation — инфляцийн түвшин буурч байгаа хэдий ч эерэг хэвээр байх (жишээ нь 15-20%-аас 5-6% болох).\"},{\"id\":42,\"question\":\"Дефляци рецессийг яагаад улам хурцатгаж болох вэ?\",\"answer\":\"Дефляцийн үед компаниудын орлого буурдаг хэдий ч өрийн нэрлэсэн дүн тогтмол тул өрийн бодит дарамт (real debt burden) нэмэгддэг. Энэ нь компаниудыг зарлага, хөрөнгө оруулалт, ажлын байраа хурцаар бууруулахад хүргэж, эдийн засгийн агшилтыг улам хурцатгадаг.\"},{\"id\":43,\"question\":\"Хэт их инфляцийн (hyperinflation) ердийн шалтгаан юу вэ?\",\"answer\":\"Засгийн газрын зарлагыг татварын орлогоор хангаж чадахгүй болоход мөнгний эрх бүхий байгууллага (төв банк) мөнгний нийлүүлэлтийг нэмэгдүүлж засгийн газрын зарлагыг дэмждэг — энэ нь мөнгний хурдацтай эргэлт, үнийн хурдацтай өсөлтийг үүсгэдэг.\"},{\"id\":44,\"question\":\"Хэрэглээний сагсны январь сарын нийт үнэ ¥458, февраль сарын нийт үнэ ¥515 бол (январь сарын индекс = 100) февраль сарын үнийн индекс, инфляцийн түвшин хэд байх вэ?\",\"answer\":\"Үнийн индекс (февраль) = (515/458) × 100 = ¥112.45. Инфляцийн түвшин = (112.45/100) − 1 = 0.1245 = 12.45%.\"},{\"id\":45,\"question\":\"Ласпейрес индекс (Laspeyres index) гэж юу вэ, мөн энэ нь ямар гурван хазайлттай (bias) вэ?\",\"answer\":\"Ласпейрес индекс нь хэрэглээний сагсны бүрдэлийг (суурь үеийн) тогтмол хэвээр хадгалж тооцдог үнийн индекс. Үүний гурван хазайлт нь: орлуулалтын хазайлт (substitution bias), чанарын хазайлт (quality bias), шинэ бүтээгдэхүүний хазайлт (new product bias) — эдгээр нь бүгд инфляцийн түвшинг дэндэв гарах (upward bias) шалтгаан болдог.\"},{\"id\":46,\"question\":\"Пааше индекс (Paasche index) Ласпейрес индексээс юугаар ялгаатай вэ, мөн 2019 оны 2-р сарын жишээнд Пааше индексийн утга хэд байх вэ (70 литр × ¥4 + 60 литр × ¥4.5 vs 70 × ¥3 + 60 × ¥4.4)?\",\"answer\":\"Пааше индекс нь тухайн үеийн хэрэглээний сагсны бүрдэлийг ашиглан тооцдог индекс (Ласпейрес нь суурь үеийн сагс ашигладаг). Жишээн дэд: Paasche Index = [(70×4)+(60×4.5)] / [(70×3)+(60×4.4)] × 100 = 550/474 × 100 = 116.03.\"},{\"id\":47,\"question\":\"Фишер индекс (Fisher index) ямар томъёогоор тооцогддог вэ, мөн энэ нь ямар хазайлтыг шийдвэрлэхэд тустай вэ?\",\"answer\":\"Fisher Index = √(IP × IL), өөрөөр хэлбэл Пааше индекс (IP) ба Ласпейрес индексийн (IL) геометр дундаж. Жишээн дэд: √(116.03 × 112.45) = 114.23. Энэ нь орлуулалтын хазайлтыг (substitution bias) багасгахад тустай.\"},{\"id\":48,\"question\":\"Хэрэглээний үнийн индекс (consumer price index, CPI) ба бараа үйлдвэрлэгчийн үнийн индекс (producer price index, PPI) хоёрын гол ялгаа юу вэ?\",\"answer\":\"CPI нь өрхийн хэрэглэдэг барааны сагсны үнийг хэмждэг, харин PPI нь дотоодын үйлдвэрлэгчдийн тулгардаг түүхий эд/бүтээгдэхүүний үнийн өөрчлөлтийг хэмждэг. PPI-ийн өсөлт ирээдүйд CPI-д дамжин нөлөөлж болдог. Зарим орон PPI-г \\\"бараа бэлдэц борлуулалтын үнийн индекс (wholesale price index, WPI)\\\" гэж нэрлэдэг.\"},{\"id\":49,\"question\":\"Гарчгийн инфляци (headline inflation) ба цөм инфляци (core inflation) хоёрын ялгаа юу вэ, мөн бодлого боловсруулагчид яагаад цөм инфляцид анхаарал хандуулдаг вэ?\",\"answer\":\"Гарчгийн инфляци хүнс, эрчим хүчийг хамарсан бүх бараа, үйлчилгээний үнийн индексийг тооцдог; цөм инфляци хүнс, эрчим хүчийг хасч тооцдог. Бодлого боловсруулагчид богино хугацаатай хүнс/эрчим хүчний хэлбэлзэлд хэт хариу үзүүлэхээс сэргийлж цөм инфляцид анхаарал хандуулдаг.\"},{\"id\":50,\"question\":\"ДНБ-ийн дефлятор (GDP deflator) гэж юу вэ, мөн энэ нь CPI-ээс юугаар ялгаатай вэ?\",\"answer\":\"ДНБ-ийн дефлятор нь тухайн эдийн засагт дотооддоо үйлдвэрлэсэн бүх бараа, үйлчилгээний сагсны үнийг хэмждэг индекс бөгөөд нэрлэсэн ДНБ-ийг (nominal GDP) \\\"дефляцилж\\\" бодит ДНБ-ийн өсөлтийн чиг хандлагыг тодорхойлоход ашиглагддаг. CPI нь өрхийн хэрэглээний сагсыг хэмждэг бол ДНБ-ийн дефлятор нь дотоодод үйлдвэрлэсэн бүх бүтээгдэхүүнийг хамардаг.\"},{\"id\":51,\"question\":\"Зардал шалтгаалсан инфляци (cost-push inflation) ба эрэлт татсан инфляци (demand-pull inflation) хоёрын гол ялгаа юу вэ?\",\"answer\":\"Cost-push inflation — зардал (ихэвчлэн цалин) нэмэгдсэнээс бизнесүүд үнээ өсгөхөд хүрдэг инфляци. Demand-pull inflation — нийт эрэлт нэмэгдсэнээс үнэ өсдөг, дараа нь ажилчдын цалингийн шаардлагад тусгагддаг инфляци. Хоёулаа эрэлт нийлүүлэлтээс давсан хэт их шаардлагаас үүдэлтэй.\"},{\"id\":52,\"question\":\"Монетаристуудын инфляцийн тухай үзэл бодол юу вэ (\\\"inflation is always and everywhere a monetary phenomenon\\\")?\",\"answer\":\"Монетаристууд (Milton Friedman тэргүүтэй) инфляци үндсэндээ мөнгний үзэгдэл гэж үздэг — мөнгний илүүдэл нь мөнгний үнэ цэнийг бууруулж, энэ нь нийт үнэ өсөхөд хүргэнэ (\\\"хэт их мөнгө хэт цөөн барааг хайдаг\\\" гэсэн зарчим).\"},{\"id\":53,\"question\":\"Инфляцийн хүлээлт (inflation expectations)-ийг хэмжихэд Treasury Inflation-Protected Securities (TIPS) ашиглах жишээг тайлбарлаарай.\",\"answer\":\"10 жилийн энгийн бондын өгөөж 3.5%, инфляциас хамгаалагдсан (TIPS) бондын өгөөж 1.5% бол зах зээл дунджаар жилд 3.5% − 1.5% = 2% инфляци хүлээж байна гэж дүгнэж болно (breakeven inflation rate).  ## Эдийн засгийн үзүүлэлтүүд (Economic Indicators)\"},{\"id\":54,\"question\":\"Урьдлагын (leading), давхцах (coincident), хоцрогдолтой (lagging) эдийн засгийн үзүүлэлтүүдийн ялгаа юу вэ?\",\"answer\":\"Leading indicators — эргэлтийн цэг нь нийт эдийн засгийнхаас өмнө ирдэг, ирээдүйг төсөөлөхөд ашигтай. Coincident indicators — эргэлтийн цэг нь нийт эдийн засгийнхтай ойролцоо цаг хугацаанд ирдэг, одоогийн байдлыг тусгана. Lagging indicators — эргэлтийн цэг нь нийт эдийн засгийнхаас хоцрож ирдэг, өнгөрсэн нөхцлийг тусгана.\"},{\"id\":55,\"question\":\"АНУ-д Conference Board байгууллагын тооцдог Урьдлагын Эдийн Засгийн Үзүүлэлтүүдийн Индекс (Index of Leading Economic Indicators, LEI)-д багтах жишээ үзүүлэлтээс гурвыг нэрлэ.\",\"answer\":\"Жишээ нь: үйлдвэрийн дундаж долоо хоногийн ажлын цаг (average weekly hours, manufacturing), S\u0026P 500 индекс, орон сууцны барилгын зөвшөөрөл (building permits for new private housing units), мөн 10 жилийн засгийн газрын бондын өгөөж ба хоногийн зээлийн хүүний зөрүү (interest rate spread) зэрэг.\"},{\"id\":56,\"question\":\"Диффүзийн индекс (diffusion index) юу хэмждэг вэ?\",\"answer\":\"Диффүзийн индекс нь нэгдсэн үзүүлэлтийн бүрэлдэхүүн хэсгүүдийн хэдэн хувь нь өсч байгааг хэмждэг — энэ нь нэг индексийн хэлбэлзлийн \\\"өргөн хүрээг\\\" (breadth) харуулдаг бөгөөд нийт индексийн өөрчлөлт хэр өргөн тархацтай вэ гэдгийг илтгэнэ.\"},{\"id\":57,\"question\":\"Ажилгүйдлийн дундаж хугацаа (average duration of unemployment) ба үйлчилгээний CPI-ийн өөрчлөлт ямар ангиллын эдийн засгийн үзүүлэлт вэ, мөн яагаад вэ?\",\"answer\":\"Хоёулаа хоцрогдолтой үзүүлэлт (lagging indicator). Ажилгүйдлийн дундаж хугацаа нь ажил авах/халах шийдвэр мөчлөгөөс хойшлогддогоос хоцордог, харин үйлчилгээний CPI инфляци нь мөчлөгт хожуу зохицдог.\"},{\"id\":58,\"question\":\"Долоо хоногийн анхны ажилгүйдлийн даатгалын горилогчдын тоо (average weekly initial claims for unemployment insurance) яагаад урьдлагын үзүүлэлт вэ?\",\"answer\":\"Энэ нь компаниудын ажилчин халах, авах шийдвэрийг маш мэдрэмтгий хэмждэг тул эдийн засгийн эргэлтийн цэгээс өмнө хурдан өөрчлөгддөг.\"},{\"id\":59,\"question\":\"Нэг үзүүлэлтэд дангаар тулгуурлан бизнес мөчлөгийн чиглэлийг тодорхойлох нь яагаад хангалтгүй вэ?\",\"answer\":\"Учир нь ямар нэг үзүүлэлт зарим мөчлөгт сайн төсөөлдөг ч бусад үед алдаатай байж болно; бүтцийн өөрчлөлт, эдийн засгийн тусгай нөхцөл байдал нь үзүүлэлт ба эдийн засгийн хоорондын харилцан хамаарлыг өөрчлөх тул практикт шинжээчид хэд хэдэн урьдлагын, давхцах, хоцрогдолтой үзүүлэлтийг хослуулан ашигладаг.\"}]},{\"id\":\"monetary-fiscal-policy\",\"title\":\"Мөнгөний ба төсвийн бодлого\",\"cards\":[{\"id\":1,\"question\":\"Бартерийн эдийн засаг (barter economy) ямар сул талуудтай вэ?\",\"answer\":\"Хүсэл сонирхлын давхар давхцал (double coincidence of wants) шаардагддаг, хуваагдах боломжгүй барааг худалдах боломжгүй байдаг, зарим бараа муудах шинжтэй тул үнэ цэнээ хадгалж чадахгүй, нийтлэг үнэ цэнийн хэмжүүр (common measure of value) байхгүй — эдгээр нь бартерийн эдийн засгийн гол сул талууд.\"},{\"id\":2,\"question\":\"Мөнгө (money) ямар таван шинж чанартай байх ёстой вэ?\",\"answer\":\"(i) хялбар хүлээн зөвшөөрөгдөх, (ii) мэдэгдэж байгаа үнэ цэнэтэй байх, (iii) хялбар хуваагдах, (iv) жинтэйгээ харьцуулахад өндөр үнэ цэнэтэй байх, (v) хуурамчаар хийхэд хэцүү байх.\"},{\"id\":3,\"question\":\"Мөнгө ямар гурван үндсэн үүрэг гүйцэтгэдэг вэ?\",\"answer\":\"(1) солилцооны хэрэгсэл (medium of exchange), (2) баялаг хадгалах хэрэгсэл (store of wealth/value), (3) үнэ цэнийн тооллын нэгж (unit of account).\"},{\"id\":4,\"question\":\"Хэсэгчилсэн нөөцийн банкны систем (fractional reserve banking) гэж юу вэ?\",\"answer\":\"Банкууд харилцагчдын хадгаламжийн зөвхөн тодорхой хувийг нөөц (reserve) хэлбэрээр хадгалж, үлдсэн хэсгийг зээлдүүлдэг практик бөгөөд энэ нь бүх харилцагч нэг зэрэг мөнгөө татан авахгүй гэсэн таамаглал дээр суурилдаг.\"},{\"id\":5,\"question\":\"Нөөцийн шаардлага (reserve requirement) 10%, анхны €100 хадгаламжтай тохиолдолд банкны систем нийтдээ хэдий хэмжээний мөнгө бүтээх вэ? Томьёог бич.\",\"answer\":\"Шинэ хадгаламж/Нөөцийн шаардлага = €100/0.10 = €1,000 (New deposit/Reserve requirement = €100/0.10 = €1,000).\"},{\"id\":6,\"question\":\"Мөнгөний үржүүлэгч (money multiplier) ямар томьёогоор тодорхойлогддог бэ?\",\"answer\":\"Мөнгөний үржүүлэгч = 1/Нөөцийн шаардлага (money multiplier = 1/reserve requirement, аравтын бутархай хэлбэрээр). Нөөцийн шаардлага бага байх тусам үржүүлэгч өндөр болдог.\"},{\"id\":7,\"question\":\"Нарийн мөнгө (narrow money) ба өргөн мөнгө (broad money) хоёрын ялгаа юу вэ?\",\"answer\":\"Нарийн мөнгө нь эргэлтэд буй бэлэн мөнгө болон маш өндөр түргэн борлогдох чадвартай хадгаламжийг хэлнэ; өргөн мөнгө нь нарийн мөнгийг багтаасан бөгөөд худалдан авалтад ашиглаж болох бүх түргэн борлогдох хөрөнгийг нэмж агуулдаг.\"},{\"id\":8,\"question\":\"Мөнгөний тоон онол (quantity theory of money)-ийн сольбицооны тэгшитгэл (quantity equation of exchange)-ийг бич, хувьсагчдыг тодорхойл.\",\"answer\":\"M×V=P×Y, бөгөөд M — мөнгөний хэмжээ, V — мөнгөний эргэлтийн хурд (velocity of circulation), P — дундаж үнийн түвшин, Y — бодит гарц (real output).\"},{\"id\":9,\"question\":\"Мөнгөний нейтралчлал (money neutrality) гэж юу вэ?\",\"answer\":\"Урт хугацаанд мөнгөний нийлүүлэлтийн өсөлт зөвхөн нийт үнийн түвшинг (P) өсгөж, бодит гарц (Y) болон мөнгөний эргэлтийн хурдад (V) нөлөөлдөггүй гэсэн онол.\"},{\"id\":10,\"question\":\"Фишерийн нөлөө (Fisher effect)-ийн томьёог бич.\",\"answer\":\"Rnom = Rreal + πe, өөрөөр хэлбэл нэрлэсэн хүү (nominal interest rate, Rnom) нь шаардагдах бодит хүү (real rate, Rreal) болон хүлээгдэж буй инфляцийн (expected inflation, πe) нийлбэртэй тэнцүү.\"},{\"id\":11,\"question\":\"Мөнгөний эрэлтийн гурван үндсэн шалтгаан юу вэ?\",\"answer\":\"Гүйлгээний (transactions-related), урьдчилан сэргийлэх (precautionary), спекулятив/хөрөнгийн багцын (speculative) эрэлт.  ## Төв банкны үүрэг (The Roles of Central Banks)\"},{\"id\":12,\"question\":\"Орчин үеийн эдийн засагт төв банк ямар үндсэн үүрэг гүйцэтгэдэг вэ?\",\"answer\":\"Валютын монополь нийлүүлэгч, засгийн газар болон банкуудын банкир, сүүлчийн ээлжийн зээлдүүлэгч (lender of last resort), төлбөр тооцооны системийн зохицуулагч, мөнгөний бодлогын удирдагч, банкны системийн хянагч.\"},{\"id\":13,\"question\":\"Фиат мөнгө (fiat money) гэж юу вэ?\",\"answer\":\"Биет бараагаар (жишээ нь алт) хувиргах боломжгүй, харин засгийн газрын тогтоолоор хүчин төгөлдөр хууль ёсны төлбөрийн хэрэгсэл (legal tender) гэж тооцогддог мөнгө.\"},{\"id\":14,\"question\":\"\\\"Сүүлчийн ээлжийн зээлдүүлэгч\\\" (lender of last resort) гэдэг нь юу гэсэн үг вэ?\",\"answer\":\"Төв банк мөнгөн дэвсгэрт хэвлэх эрхтэй учраас хөрвөх чадварын хүндрэлд орсон банкуудад шаардлагатай хөрвөх чадварыг (liquidity) нийлүүлж чадна гэсэн үг.\"},{\"id\":15,\"question\":\"Нортерн Рокийн (Northern Rock) жишээ юу харуулдаг вэ?\",\"answer\":\"2007 онд дэлхийн хөрвөх чадварын хямралын улмаас банкинд ажил (bank run) тулгарсан явдал; төв банкны дэмжлэг байсан ч олон нийтийн итгэл алдагдах нь банкны ажлыг зогсоохгүй байж болзошгүйг харуулсан.\"},{\"id\":16,\"question\":\"Банкны хяналт (banking supervision) нь төв банкны үүрэгт үргэлж хамаардаг уу?\",\"answer\":\"Үгүй — зарим орны хувьд бусад байгууллага хариуцна (жишээ нь Их Британид FSA), харин бусад улсад төв банк эсвэл хамтарсан хариуцлага байдаг.\"},{\"id\":17,\"question\":\"Төв банкны мөнгөний бодлогын хамгийн давалгаатай зорилго (overarching objective) юу вэ?\",\"answer\":\"Үнийн тогтвортой байдал (price stability), өөрөөр хэлбэл инфляцийг хянах.  ## Мөнгөний бодлогын зорилго ба хэрэгслүүд (Objectives and Tools of Monetary Policy)\"},{\"id\":18,\"question\":\"Хүлээгдэж байсан инфляц (expected inflation) ямар зардлуудыг үүсгэдэг вэ?\",\"answer\":\"Үнийн шошго зардал (menu costs — бараа үнийн шошгыг тасралтгүй өөрчлөх зардал) болон \\\"шаахайн арьсны\\\" зардал (shoe leather costs — бэлэн мөнгийг бага хадгалж, банкинд олон удаа явах зардал).\"},{\"id\":19,\"question\":\"Хүлээгдээгүй инфляц (unexpected inflation) ямар нэмэлт зардал үүсгэдэг вэ?\",\"answer\":\"Зээлдэгч ба зээлдүүлэгчийн хооронд баялгийн шударга бус шилжилт үүсгэдэг, зээлийн хүүнд эрсдэлийн урамшуулал (risk premium) нэмэгддэг, зах зээлийн үнийн мэдээллийн агуулга (information content) буурдаг.\"},{\"id\":20,\"question\":\"Төв банкны үндсэн гурван мөнгөний бодлогын хэрэгсэл юу вэ?\",\"answer\":\"(1) нээлттэй захын үйл ажиллагаа (open market operations), (2) бодлогын хүү/дахин санхүүжилтийн хүү (policy rate), (3) нөөцийн шаардлага (reserve requirement).\"},{\"id\":21,\"question\":\"Нээлттэй захын үйл ажиллагаа (open market operations) гэж юу вэ, тэлэх эсвэл агшин нөлөөг хэрхэн үзүүлдэг вэ?\",\"answer\":\"Төв банк засгийн газрын бонд худалдаж авах, зарах үйл ажиллагаа; бонд худалдаж авах нь арилжааны банкуудын нөөцийг нэмэгдүүлж мөнгөний үржүүлэгчийн механизмаар өргөн мөнгийн өсөлтийг түлхэж, зарах нь эсрэгээр агшдаг.\"},{\"id\":22,\"question\":\"АНУ-ын холбооны нөөцийн хүү (federal funds rate) гэж юу вэ?\",\"answer\":\"Нөөцийн шөнийн (overnight) зээлийн банк хоорондын хүү бөгөөд Холбооны нээлттэй захын хороо (FOMC) нээлттэй захын үйл ажиллагаагаар зорилтот түвшинд хүргэхийг зорьдог.\"},{\"id\":23,\"question\":\"Репо хэлцэл (repurchase agreement, repo) гэж юу вэ?\",\"answer\":\"Төв банк банкуудаас бонд худалдаж аван, ирээдүйд тодорхой хугацаанд (ихэвчлэн шөнөөс хоёр долоо хоног хүртэл) буцаан зарах тохиролцоо; энэ нь банкуудад олгосон барьцаалсан зээл болдог бөгөөд төв банк репо хүүг (repo rate) олж авдаг.\"},{\"id\":24,\"question\":\"Нөөцийн шаардлагыг (reserve requirement) өсгөх нь ямар нөлөөтэй вэ, яагаад хөгжингүй орнуудад бага хэрэглэгддэг вэ?\",\"answer\":\"Нөөцийн шаардлагыг өсгөх нь мөнгөний бүтээлтийг хязгаарлаж мөнгөний нийлүүлэлтийг агшдаг; гэвч банкуудад тасралтгүй бэрхшээл үүсгэдэг тул хөгжингүй орнуудад ховор хэрэглэгддэг (зарим нь шаардлага тогтоохоо больсон).\"},{\"id\":25,\"question\":\"Мөнгөний дамжуулах механизм (monetary transmission mechanism)-ийн дөрвөн гол сувгийг нэрлэ.\",\"answer\":\"(1) банкны зээлийн хүү (bank lending rates), (2) хөрөнгийн үнэ (asset prices), (3) эдийн засгийн агентуудын хүлээлт (expectations), (4) гадаад валютын ханш (exchange rate).\"},{\"id\":26,\"question\":\"Инфляцийн зорилтлог систем (inflation targeting)-ийн амжилтын гол гурван тулгуур бүрэлдэхүүн юу вэ?\",\"answer\":\"Төв банкны бие даасан байдал (central bank independence), итгэл үнэмшил (credibility), ил тод байдал (transparency).\"},{\"id\":27,\"question\":\"Шинэ Зеланд (New Zealand) яагаад инфляцийн зорилтлог системийг анх нэвтрүүлсэн орон гэж тооцогддог вэ?\",\"answer\":\"1989 оны Reserve Bank of New Zealand Act хуулиар Шинэ Зеландын төв банк инфляцийг 0–2%-ийн хязгаарт барих эрх мэдэл ба үйл ажиллагааны бие даасан байдлыг (operational independence) хүлээн авсан анхны орон байсан бөгөөд энэ загвар дараа нь өргөнөөр хуулбарлагдсан.\"},{\"id\":28,\"question\":\"Зорилтот бие даасан байдал (target independence) ба үйл ажиллагааны бие даасан байдал (operational independence)-ийн ялгаа юу вэ?\",\"answer\":\"Зорилтот бие даасан банк (жишээ нь ЕХБ/ECB) өөрөө инфляцийн зорилтыг тодорхойлдог; зөвхөн үйл ажиллагааны бие даасан банк (жишээ нь Шинэ Зеланд, Британи) засгийн газраас тогтоосон зорилтыг хэрэгжүүлэх хүүгийн түвшингээ л өөрөө шийддэг.\"},{\"id\":29,\"question\":\"Ихэнх хөгжингүй орны төв банкууд яагаад инфляцийн зорилтыг 0%-ийн оронд ойролцоогоор 2% байхаар тогтоодог вэ?\",\"answer\":\"0%-ийг зорилт болгосон нь дефляцийн (deflation) эрсдлийг нэмэгдүүлдэг тул, дефляцаас хангалттай хол, мөн тогтворгүй инфляцийн цочролоос зайлсхийхийн тулд ойролцоогоор 2% байхаар тогтоодог.\"},{\"id\":30,\"question\":\"Гадаад валютын ханшийн зорилтлог систем (exchange rate targeting) гэж юу вэ, ямар давуу/сул талтай вэ?\",\"answer\":\"Орон өөрийн валютыг гол валюттай (жишээ нь ам.доллар) тогтмол түвшинд барих зорилт тавих бодлого; энэ нь бага инфляцтай орны инфляцийн туршлагыг \\\"импортлох\\\" боломж олгодог, гэхдээ дотоод хүүг валютын зорилтод захируулахаас болж дотоод эдийн засгийн нөхцөл тогтворгүй болж болзошгүй.\"},{\"id\":31,\"question\":\"Хөгжиж буй орнуудад мөнгөний бодлогыг хэрэгжүүлэхэд тулгардаг бэрхшээлүүдийг нэрлэ.\",\"answer\":\"Хангалттай хөрвөх чадвартай засгийн газрын бондын зах зээл байхгүй, төвийг сахисан хүүг (neutral rate) тодорхойлоход хэцүү болдог хурдацтай эдийн засгийн өөрчлөлт, санхүүгийн хурдацтай шинэчлэл, инфляцийг хянах сайн түүх дутмаг, засгийн газар төв банкад жинхэнэ бие даасан эрх олгохоос татгалзах.  ## Агшин, тэлэх мөнгөний бодлого, төвийг сахисан хүү ба хязгаарлалт (Contractionary/Expansionary Policy, the Neutral Rate, and Limitations)\"},{\"id\":32,\"question\":\"Мөнгөний бодлого хэзээ \\\"агшин\\\" (contractionary), хэзээ \\\"тэлэх\\\" (expansionary) гэж тооцогддог вэ?\",\"answer\":\"Бодлогын хүү төвийг сахисан хүү (neutral rate)-нээс дээр байвал агшин; доогуур байвал тэлэх бодлого гэж тооцогддог.\"},{\"id\":33,\"question\":\"Төвийг сахисан хүү (neutral rate)-г тодорхойлох томьёог бич.\",\"answer\":\"Төвийг сахисан хүү = Хандлагын өсөлт + Инфляцийн зорилт (Neutral rate = Trend growth + Inflation target). Жишээ: 2.5% + 2% = 4.5%.\"},{\"id\":34,\"question\":\"Төвийг сахисан бодлогын хүү (neutral policy rate) ямар хоёр бүрэлдэхүүн хэсгээс бүрддэг вэ?\",\"answer\":\"(1) эдийн засгийн бодит хандлагын өсөлтийн түвшин (real trend rate of growth), (2) урт хугацааны хүлээгдэж буй инфляц (long-run expected inflation).\"},{\"id\":35,\"question\":\"Эрэлтийн цочрол (demand shock) ба нийлүүлэлтийн цочрол (supply shock)-ын улмаас үүссэн инфляцид төв банк ижил арга хэмжээ авах ёстой юу?\",\"answer\":\"Үгүй. Эрэлтийн цочролын улмаас инфляц өссөн тохиолдолд хүүг нэмэх нь зохистой; харин нийлүүлэлтийн цочрол (жишээ нь газрын тосны үнэ өсөх)-ын улмаас инфляц өссөн тохиолдолд хүүг нэмэх нь уналтыг улам хурцатгаж болзошгүй.\"},{\"id\":36,\"question\":\"Бондын захын \\\"харуул нохой\\\" (bond market vigilantes) гэж хэн бэ?\",\"answer\":\"Төв банк инфляцийг хянах чадвараа алдаж байна гэж үзвэл урт хугацаатай бондын эрэлтийг бууруулж, өгөөжийг (yield) өсгөдөг бондын захын оролцогчид; энэ үйлдэл нь сул мөнгөний бодлогод \\\"хазаар\\\" тавих нөлөөтэй.\"},{\"id\":37,\"question\":\"Хөрвөх чадварын урхи (liquidity trap) гэж юу вэ?\",\"answer\":\"Мөнгөний эрэлтийн муруй хэвтээ (infinitely elastic) болж, хүүг өөрчлөхгүйгээр хүн ам нэмэлт мөнгийг барихад бэлэн байдаг үзэгдэл; энэ нөхцөлд мөнгө нэмж шахах нь хүү буулгах, бодит үйл ажиллагаанд нөлөөлөхгүй болж мөнгөний бодлого үр дүнгүй болдог.\"},{\"id\":38,\"question\":\"Дефляц (deflation) яагаад уламжлалт мөнгөний бодлогоор шийдвэрлэхэд хэцүү вэ?\",\"answer\":\"Нэрлэсэн хүүг тэгээс мэдэгдэхүйц доогуур бууруулах нь хэцүү (хүүгийн доод хязгаар, zero lower bound), мөн дефляц зээлийн бодит үнэ цэнийг нэмэгдүүлж, хэрэглэгчдийг хэрэглээгээ хойшлуулахад хүргэж, дефляцийн нөхцөлийг улам хурцатгадаг.\"},{\"id\":39,\"question\":\"Тоон тэлэлт (quantitative easing, QE) гэж юу вэ?\",\"answer\":\"Төв банк мөнгөн дэвсгэрт шинээр \\\"хэвлэж\\\", засгийн газар эсвэл хувийн секторын хөрөнгийг (бонд, ипотекийн бонд гэх мэт) томоохон хэмжээгээр худалдаж авах — уламжлалт нээлттэй захын үйл ажиллагаатай ажиллагаа нэгэн төрлийн боловч хэмжээ хамаагүй том \\\"уламжлалт бус\\\" (unconventional) мөнгөний бодлого.\"},{\"id\":40,\"question\":\"Мөнгөний бодлогын хязгаарлалтын (limitations of monetary policy) гол шалтгаан юу вэ?\",\"answer\":\"Төв банкууд өрхүүд, корпорациуд банкинд хэдий хэмжээний мөнгө хадгалахыг, мөн банкууд зээл олгох хүсэл эрмэлзлийг шууд хянаж чадахгүй тул мөнгөний нийлүүлэлтийг бүрэн хянаж чадахгүй.\"},{\"id\":41,\"question\":\"Японы жишээ (Example 11) мөнгөний бодлогын ямар хязгаарлалтыг харуулдаг вэ?\",\"answer\":\"1990-ээд оноос хойш Япон бодлогын хүүгээ тэг хүртэл бууруулж тоон тэлэлт (QE) хэрэгжүүлсэн ч дефляцийг тогтвортой арилгаж чадаагүй нь хэт их мөнгө \\\"хэвлэсэн\\\" ч гэсэн мөнгөний бодлого үргэлж үр дүнтэй биш болохыг харуулсан.  ## Төсвийн бодлогын үүрэг ба зорилго (Roles and Objectives of Fiscal Policy)\"},{\"id\":42,\"question\":\"Төсвийн бодлого (fiscal policy) ямар гурван гол талбарт нөлөөлдөг вэ?\",\"answer\":\"(1) нийт эдийн засгийн нийт эрэлт (aggregate demand), (2) орлого ба баялгийн хуваарилалт, (3) салбар хоорондын нөөцийн хуваарилалт.\"},{\"id\":43,\"question\":\"Кейнсчид (Keynesians) ба монетаристчид (monetarists) төсвийн бодлогын үр нөлөөг хэрхэн ялгаатай үзэх вэ?\",\"answer\":\"Кейнсчид эдийн засагт идэвхгүй хүчин чадал байх тохиолдолд төсвийн бодлого нийт эрэлт, гарц, ажил эрхлэлтэд хүчирхэг нөлөөтэй гэж үзнэ; монетаристчид төсвийн өөрчлөлт зөвхөн түр зуурын нөлөөтэй бөгөөд мөнгөний бодлого илүү үр дүнтэй гэж үзнэ.\"},{\"id\":44,\"question\":\"Төсвийн алдагдал/илүүдэл (budget surplus/deficit) гэж юу вэ?\",\"answer\":\"Засгийн газрын орлого (татвар) ба зарлагын хоорондох зөрүү; орлого зарлагаас их байвал илүүдэл (surplus), зарлага орлогоос их байвал алдагдал (deficit) гэнэ.\"},{\"id\":45,\"question\":\"Автомат тогтворжуулагч (automatic stabilizer) гэж юу вэ, жишээ өг.\",\"answer\":\"Эдийн засгийн мөчлөгийн хариу урвал хэлбэрээр, бодлого шийдвэр гаргагчийн тусгай оролцоогүйгээр ажилладаг механизм; жишээ нь уналтын үед ажилгүйдлийн тэтгэмж автоматаар өсч нийт эрэлтэнд хувь нэмэр оруулдаг, эсвэл бумын үед дэвшилтэт орлогын татвар автоматаар нэмэгдэж илүүдлийг нэмэгдүүлдэг.\"},{\"id\":46,\"question\":\"Автомат тогтворжуулагч (automatic stabilizer) ба дискрецийн/идэвхтэй төсвийн бодлого (discretionary fiscal policy)-ийн ялгаа юу вэ?\",\"answer\":\"Автомат тогтворжуулагч шийдвэр гаргагчийн шууд оролцоогүйгээр эдийн засгийн мөчлөгт автоматаар хариу өгдөг; харин дискрецийн бодлого бол зорилтот нийт эрэлтийг тогтворжуулахын тулд санаатайгаар хийгдэх татвар/зарлагын өөрчлөлт.\"},{\"id\":47,\"question\":\"Засгийн газрын өр (government/national debt) гэж юу вэ?\",\"answer\":\"Цаг хугацааны туршид хуримтлагдсан төсвийн алдагдлуудын нийлбэр.  ## Төсвийн бодлогын хэрэгслүүд ба хэрэгжилт (Fiscal Policy Tools and Implementation)\"},{\"id\":48,\"question\":\"Засгийн газрын зарлагын гурван үндсэн төрлийг нэрлэ.\",\"answer\":\"(1) шилжүүлгийн төлбөр (transfer payments — тэтгэвэр, тэтгэмж), (2) одоогийн зарлага (current government spending — эрүүл мэнд, боловсрол зэрэг тогтмол үзүүлдэг үйлчилгээ), (3) хөрөнгийн зарлага (capital expenditure — дэд бүтэц).\"},{\"id\":49,\"question\":\"Шилжүүлгийн төлбөр (transfer payments) яагаад ДНБ (GDP)-д тооцогддоггүй вэ?\",\"answer\":\"Учир нь энэ нь үйлдвэрлэлийн хүчин зүйлийн (factor of production) бодит эдийн засгийн үйл ажиллагаанд оруулсан хувь нэмэрийн шан харамж биш, зөвхөн орлогыг дахин хуваарилах хэрэгсэл юм.\"},{\"id\":50,\"question\":\"Шууд татвар (direct taxes) ба шууд бус татвар (indirect taxes)-ын ялгаа юу вэ, тус бүрээс жишээ дурд.\",\"answer\":\"Шууд татвар орлого, баялаг, корпорацийн ашигт ногддог (жишээ: хөрөнгийн өсөлтийн татвар, корпорацийн татвар); шууд бус татвар бараа, үйлчилгээний зарлагад ногддог (жишээ: онцгой албан татвар, нэмэгдсэн өртгийн татвар/VAT).\"},{\"id\":51,\"question\":\"Татварын бодлогын дөрвөн зорилтой шинж чанарыг нэрлэ.\",\"answer\":\"(1) энгийн байдал (simplicity), (2) үр ашигтай байдал (efficiency), (3) шударга байдал (fairness — хэвтээ ба босоо шударга байдал), (4) орлогын хангамж (revenue sufficiency).\"},{\"id\":52,\"question\":\"\\\"Хэвтээ шударга байдал\\\" (horizontal equity) ба \\\"босоо шударга байдал\\\" (vertical equity)-ын ялгаа юу вэ?\",\"answer\":\"Хэвтээ шударга байдал — ижил нөхцөлтэй хүмүүс ижил татвар төлөх ёстой; босоо шударга байдал — илүү баян хүмүүс илүү татвар төлөх ёстой (дэвшилтэт татвар, progressive tax).\"},{\"id\":53,\"question\":\"Шууд бус татвар (indirect taxes) ба хөрөнгийн зарлага (capital spending)-ийн аль нь илүү хурдан тохируулагддаг вэ, яагаад?\",\"answer\":\"Шууд бус татвар (жишээ нь онцгой албан татвар) зарлагдсан даруйдаа бараг шууд хэрэгждэг; харин хөрөнгийн зарлагын төлөвлөлт, зөвшөөрөл авах, хэрэгжүүлэх нь олон жил шаарддаг тул маш хоцрогдолтой.\"},{\"id\":54,\"question\":\"Төсвийн үржүүлэгч (fiscal multiplier)-ийн томьёог бич, жишээгээр бодоод харуулна уу.\",\"answer\":\"Төсвийн үржүүлэгч = 1/[1 – c(1 – t)], бөгөөд c нь нэмэгдэл хэрэглэх хандлага (marginal propensity to consume, MPC), t нь татварын түвшин. Жишээ: t=20%, c=90% бол үржүүлэгч = 1/[1 – 0.9(1 – 0.2)] = 1/0.28 = 3.57.\"},{\"id\":55,\"question\":\"Нэмэгдэл хэрэглэх хандлага (MPC) ба нэмэгдэл хадгаламжийн хандлага (MPS)-ын хоорондын хамаарлыг бич.\",\"answer\":\"c + s = 1, өөрөөр хэлбэл MPC + MPS = 1 (жишээ нь MPC=0.9 бол MPS=0.1).\"},{\"id\":56,\"question\":\"Тэнцвэртэй төсвийн үржүүлэгч (balanced budget multiplier) ямар утгатай байдаг вэ?\",\"answer\":\"Үргэлж 1 (нэгдэл) байдаг — засгийн газар зарлагаа татвартай тэнцүү хэмжээгээр нэмэгдүүлбэл гарц нэмэгдэнэ, учир нь MPC нь 1-ээс бага тул татвар нэмэгдсэнээр хэрэглээ бүрэн буурахгүй.\"},{\"id\":57,\"question\":\"Рикардогийн эквивалентжилт (Ricardian equivalence) гэж юу вэ?\",\"answer\":\"Засгийн газар татвараа бууруулж, зээлжилтээр нөхвөл иргэд ирээдүйд татвар нэмэгдэхийг урьдчилан тооцон хэрэглээгээ нэмэгдүүлэхгүй, харин хадгаламжаа нэмэгдүүлнэ гэсэн онол (эдийн засагч Дэвид Рикардогийн нэрэмжит).\"},{\"id\":58,\"question\":\"Бүтцийн буюу мөчлөгийн нөлөөллөөс тохируулсан төсвийн алдагдал (structural / cyclically adjusted budget deficit) гэж юу вэ?\",\"answer\":\"Эдийн засаг бүрэн ажил эрхлэлт (full employment)-ийн түвшинд байсан бол байх байсан төсвийн алдагдал; энэ нь төсвийн чиг хандлага (fiscal stance)-ийг бодит төсвийн алдагдлаас илүү зөв илэрхийлдэг үзүүлэлт гэж тооцогддог.\"},{\"id\":59,\"question\":\"Төсвийн бодлогыг хэрэгжүүлэхэд тулгардаг гурван цаг хугацааны хоцрогдол (policy lags) юу вэ?\",\"answer\":\"(1) танин мэдэхүйн хоцрогдол (recognition lag — эдийн засгийн нөхцлийг танин мэдэхэд шаардагдах хугацаа), (2) үйлдлийн хоцрогдол (action lag — бодлого хэрэгжихэд шаардагдах хугацаа), (3) нөлөөллийн хоцрогдол (impact lag — үр дүн илрэхэд шаардагдах хугацаа).\"},{\"id\":60,\"question\":\"\\\"Шахалт\\\" эффект (crowding out) гэж юу вэ?\",\"answer\":\"Засгийн газрын зээлжилт хязгаарлагдмал хадгаламжийн сангаас өсч, хувийн секторын хөрөнгө оруулалтад зориулагдах мөнгийг \\\"шахан хасдаг\\\" үзэгдэл бөгөөд энэ нь хүүг нэмэгдүүлж, хувийн хөрөнгө оруулалтыг бууруулдаг.  ## Мөнгөний ба төсвийн бодлогын харилцан хамаарал (The Relationship between Monetary and Fiscal Policy)\"},{\"id\":61,\"question\":\"Сул төсвийн бодлого/хатуу мөнгөний бодлого (easy fiscal / tight monetary) хослолын үр нөлөө юу вэ?\",\"answer\":\"Гарц өсөх боловч хүү өсч хувийн секторын эрэлтэнд сөрөг нөлөө үзүүлнэ; засгийн газрын сектор нийт орлогод эзлэх хувь нэмэгдэнэ.\"},{\"id\":62,\"question\":\"Сул мөнгөний бодлого/сул төсвийн бодлого (easy monetary / easy fiscal) хослолын үр нөлөө юу вэ?\",\"answer\":\"Хоёр бодлого хоёулаа сул байвал нийлбэр нөлөө хүчтэй тэлэх шинжтэй болж, нийт эрэлт нэмэгдэж, хүү буурч (мөнгөний нөлөө давамгайлсан тохиолдолд), хувийн ба нийтийн сектор хоёулаа өсдөг.\"},{\"id\":63,\"question\":\"IMF-ийн судалгаагаар мөнгөний бодлогын орогшуулалт (monetary accommodation) байхгүй тохиолдолд ямар төсвийн хэрэгсэл нийт ДНБ-д хамгийн их нөлөө үзүүлдэг вэ?\",\"answer\":\"Шууд засгийн газрын зарлага (government spending) нь зорилтот бус нийгмийн шилжүүлгээс (social transfers) зургаа дахин их нөлөөтэй байдаг, учир нь шилжүүлгийг иргэд түр зуурынх гэж тооцдог.\"},{\"id\":64,\"question\":\"Тоон тэлэлт (QE) яагаад мөнгөний бодлогын бие даасан байдлыг (independence) эрсдэлд оруулж болзошгүй вэ?\",\"answer\":\"Төв банк засгийн газрын бонд томоохон хэмжээгээр худалдаж авах нь төсвийн алдагдлыг үнэндээ санхүүжүүлж (\\\"мөнгөн дэвсгэрт хэвлэх\\\" буюу monetization of government deficit) байгаа хэрэг болж, мөнгөний бодлогын бие даасан байдал хуурмаг болж болзошгүй.\"},{\"id\":65,\"question\":\"Итгэл үнэмшил ба амлалт (credibility and commitment) яагаад төсвийн бодлогод чухал вэ?\",\"answer\":\"Засгийн газрын өндөр түвшний төсвийн алдагдал тогтвортой үргэлжлэх болов уу гэж иргэд үзвэл, инфляцийн хүлээлт ба урт хугацааны хүү өсч, төсвийн өдөөлтийн үр нөлөөг тэн хагасаар бууруулж болзошгүй.\"}]},{\"id\":\"international-trade\",\"title\":\"Олон улсын худалдаа, капиталын урсгал\",\"cards\":[{\"id\":1,\"question\":\"Дотоодын нийт бүтээгдэхүүн (gross domestic product, GDP) ба үндэсний нийт бүтээгдэхүүн (gross national product, GNP) хэрхэн ялгаатай вэ?\",\"answer\":\"GDP нь тухайн улсын нутаг дэвсгэр дээр үйлдвэрлэсэн бүх эцсийн бараа, үйлчилгээний зах зээлийн үнийн дүнг хэмждэг бол GNP нь тухайн улсын иргэдийн (эсвэл тэдний эзэмшдэг хүчин зүйлийн) хаана ч байсан үйлдвэрлэсэн бүтээгдэхүүний үнийн дүнг хэмждэг. GDP нь гадаадынхны дотор дэвсгэр дээрх үйлдвэрлэлийг оруулдаг бол GNP түүнийг хассан, харин гадаадад байгаа иргэдийн үйлдвэрлэлийг оруулдаг. Эдийн засгийн үйл ажиллагаа, ажил эрхлэлтийг хэмжихэд GDP-ийг илүү өргөн ашигладаг.\"},{\"id\":2,\"question\":\"Импорт (import) ба экспорт (export) гэж юуг хэлэх вэ? Үйлчилгээг хэрхэн импорт/экспорт болгож ангилах вэ?\",\"answer\":\"Импорт нь дотоодын эдийн засаг (өрх, фирм, засгийн газар) гадаад орноос худалдан авсан бараа, үйлчилгээ; экспорт нь дотоодын эдийн засгаас гадаадад зарагдсан бараа, үйлчилгээ. Үйлчилгээг ч мөн адил ангилна: жишээлбэл Грекийн тээвэрлэлтийн компани АНУ-д Францаас импортлосон дарс тээвэрлэвэл энэ нь АНУ-ын Грекээс импортлосон үйлчилгээ гэж тооцогдоно.\"},{\"id\":3,\"question\":\"Худалдааны нөхцөл (terms of trade) гэж юу вэ, яаж тодорхойлогддог вэ?\",\"answer\":\"Худалдааны нөхцөл нь экспортын үнийн индексийг импортын үнийн индекст харьцуулсан харьцаа (экспортын үнэ ÷ импортын үнэ) бөгөөд нэг нэгж экспортоор хэдэн нэгж импорт худалдан авч чадахыг илэрхийлнэ. Хэрэв экспортын үнэ импортын үнээс илүү их нэмэгдвэл худалдааны нөхцөл сайжирсан (improved) гэж үзнэ, учир нь улс орон ижил хэмжээний экспортоор илүү их импорт худалдан авч чадна; эсрэгээр бол муудсан (deteriorated) гэнэ.\"},{\"id\":4,\"question\":\"Цэвэр экспорт (net exports), худалдааны ашиг/алдагдал (trade surplus/deficit) гэж юу вэ, тэдгээр нь улс орныг гадаадтай хэрхэн холбодог вэ?\",\"answer\":\"Цэвэр экспорт нь экспортын үнийн дүн хасах импортын үнийн дүн. Экспорт импорттойгоо тэнцвэл худалдаа тэнцвэртэй; экспорт их бол худалдааны ашиг (surplus), импорт их бол худалдааны алдагдал (deficit) гэнэ. Худалдааны ашигтай улс гадаадынханд зээл олгож, актив худалдан авдаг бол худалдааны алдагдалтай улс гадаадаас зээллэх эсвэл активаа зарах шаардлагатай болдог.\"},{\"id\":5,\"question\":\"Автаркия (autarky), хаалттай эдийн засаг (closed economy), нээлттэй эдийн засаг (open economy), дэлхийн үнэ (world price) гэсэн ойлголтуудыг тайлбарла.\",\"answer\":\"Автаркия (хаалттай эдийн засаг) гэдэг нь улс орон бусад оронтой худалдаа хийдэггүй, бүх бараа, үйлчилгээг дотооддоо үйлдвэрлэж, хэрэглэдэг байдал; энэ үеийн үнийг автаркийн үнэ (autarkic price) гэнэ. Нээлттэй эдийн засаг нь бусад оронтой худалдаа хийдэг эдийн засаг бөгөөд худалдааны хязгаарлалт байхгүй тохиолдолд гишүүд дэлхийн зах зээлд тогтсон дэлхийн үнээр (world price) бараа, үйлчилгээг худалдан авч, зарж чадна.\"},{\"id\":6,\"question\":\"Чөлөөт худалдаа (free trade) ба худалдааны хамгаалалт (trade protection) хоёрыг хэрхэн ялгах вэ?\",\"answer\":\"Чөлөөт худалдаа гэдэг нь улс орны худалдаа хийх чадварт засгийн газрын хязгаарлалт байхгүй байдал бөгөөд эрэлт, нийлүүлэлт (дэлхийн аггрегат) импорт, экспортын тэнцвэрийн үнэ, тоо хэмжээг тодорхойлдог. Гаалийн татвар (tariff), импортын хязгаарлалт (import quota) зэрэг хязгаарлалтыг тавьдаг засгийн газрын бодлогыг худалдааны хамгаалалт (trade protection) гэж нэрлэдэг бөгөөд энэ нь зах зээлийн хүчний үйлчлэлийг хязгаарладаг.\"},{\"id\":7,\"question\":\"Даяаршил (globalization) гэж юуг хэлэх вэ?\",\"answer\":\"Даяаршил гэдэг нь бараа, үйлчилгээ, капиталын зах зээлийн дэлхийн хэмжээний нэгдлийн нэмэгдэл бөгөөд үүнд олон улсын корпорациудын (multinational corporations) үүрэг нэмэгдэх, ОУВС (IMF), ДХБ (WTO), Дэлхийн банк (World Bank) зэрэг олон улсын байгууллагуудын дотоод бодлогод оролцоо нэмэгдэх зэрэг үзэгдлүүд ч хамаарна.\"},{\"id\":8,\"question\":\"Гадаадын шууд хөрөнгө оруулалт (foreign direct investment, FDI) ба гадаадын портфелийн хөрөнгө оруулалт (foreign portfolio investment, FPI) хэрхэн ялгаатай вэ?\",\"answer\":\"FDI гэдэг нь нэг улсын (эх орон) фирм гадаад оронд (хост орон) бүтээмжийн активт хийх шууд хөрөнгө оруулалт бөгөөд үүний үр дүнд фирм олон улсын корпораци (MNC) болдог. FPI нь хувь хүн, фирм, институцийн хөрөнгө оруулагчдын (тэтгэврийн сан гэх мэт) гадаад хувьцаа, засгийн газрын бонд зэрэг санхүүгийн хэрэгсэлд хийдэг богино хугацааны хөрөнгө оруулалт.\"},{\"id\":9,\"question\":\"Үнэмлэхүй давуу тал (absolute advantage) гэж юу вэ?\",\"answer\":\"Улс орон тодорхой бараа (эсвэл үйлчилгээ) үйлдвэрлэхдээ худалдааны хамтрагчаасаа бага зардлаар эсвэл цаашилбал бага нөөц ашиглан үйлдвэрлэх чадвартай байвал тухайн бараанд үнэмлэхүй давуу тал эзэмшиж байна гэнэ.\"},{\"id\":10,\"question\":\"Харьцуулсан давуу тал (comparative advantage) гэж юу вэ, боломжийн зардал (opportunity cost)-той хэрхэн холбоотой вэ?\",\"answer\":\"Улс орон тодорхой бараа үйлдвэрлэхдээ боломжийн зардал нь худалдааны хамтрагчийнхаас бага байвал тухайн бараанд харьцуулсан давуу тал эзэмшиж байна гэнэ. Боломжийн зардал гэдэг нь нэг нэгж нэмж үйлдвэрлэхийн тулд өгөх ёстой өөр бараагийн хэмжээ (өөрөөр хэлбэл, орхигдсон боломж) юм.\"},{\"id\":11,\"question\":\"Бразил улсын ажилчин өдөрт 20 бал үзэг эсвэл 40 харандаа үйлдвэрлэж чадна; Вьетнамын ажилчин өдөрт 10 бал үзэг эсвэл 60 харандаа үйлдвэрлэж чадна. Хэн нь бал үзэгт харьцуулсан давуу тал эзэмшдэг вэ?\",\"answer\":\"Вьетнамд бал үзгийн боломжийн зардал 6 харандаа (60÷10), Бразилд 2 харандаа (40÷20). Бразил бага боломжийн зардалтай тул бал үзэгт харьцуулсан давуу тал эзэмшинэ. Харандаанд Вьетнамын боломжийн зардал 1/6 бал үзэг, Бразилийн 1/2 бал үзэг тул Вьетнам харандаанд харьцуулсан давуу тал эзэмшинэ. Бразил хоёр бараанд ч үнэмлэхүй давуу талгүй байсан ч харьцуулсан давуу талаасаа болж худалдаанаас ашиг хүртэж болно.\"},{\"id\":12,\"question\":\"Их Британи өдөрт ажилчин бүрээр 4 машин механизм эсвэл 8 ярд даавуу, Энэтхэг 2 машин механизм эсвэл 16 ярд даавуу үйлдвэрлэж чадна. Хэн нь аль бараанд үнэмлэхүй ба харьцуулсан давуу тал эзэмшдэг вэ?\",\"answer\":\"Их Британи машин механизмд, Энэтхэг даавууд үнэмлэхүй давуу талтай (ажилчин тутамд илүү үйлдвэрлэдэг). Машин механизмын боломжийн зардал Их Британид 2 ярд даавуу (8÷4), Энэтхэгт 8 ярд даавуу (16÷2) тул Их Британи машинд харьцуулсан давуу тал эзэмшинэ. Даавуугийн боломжийн зардал Их Британид 1/2 машин, Энэтхэгт 1/8 машин тул Энэтхэг даавуунд харьцуулсан давуу тал эзэмшинэ.\"},{\"id\":13,\"question\":\"Худалдаанаас хоёр улс хоёулаа ашиг хүртэхийн тулд дэлхийн үнэ (world price) ямар хязгаарт байх ёстой вэ?\",\"answer\":\"Дэлхийн үнэ нь худалдааны хоёр хамтрагчийн автаркийн үнийн хооронд байх ёстой. Жишээ нь, Их Британи-Энэтхэгийн машин механизмын тохиолдолд автаркийн үнэ 2-8 ярд даавуу хооронд байвал (1 машин = 2-8 ярд даавуу) хоёр улс хоёулаа худалдаанаас ашиг хүртэнэ. Дэлхийн үнэ тухайн улсын автаркийн үнээс хэчнээн их зөрөх тусам тэр улс худалдаанаас илүү их ашиг хүртнэ.\"},{\"id\":14,\"question\":\"Рикардогийн загвар (Ricardian model)-д харьцуулсан давуу талын эх үүсвэр юу вэ?\",\"answer\":\"Рикардогийн загварт хөдөлмөр нь цорын ганц (хувьсах) үйлдвэрлэлийн хүчин зүйл бөгөөд улс орнуудын технологийн ялгаанаас үүдэлтэй хөдөлмөрийн бүтээмжийн ялгаа нь харьцуулсан давуу талын эх үүсвэр юм. Бага боломжийн зардалтай улс тухайн бараанд харьцуулсан давуу тал эзэмшиж, тэрхүү бараан дээр мэргэшдэг.\"},{\"id\":15,\"question\":\"Хекшер-Олины загвар (Heckscher–Ohlin model, factor-proportions theory)-д харьцуулсан давуу талын эх үүсвэр юу вэ?\",\"answer\":\"Хекшер-Олины загварт (хүчин зүйлийн харьцааны онол) хөдөлмөр, капитал хоёулаа хувьсах үйлдвэрлэлийн хүчин зүйл бөгөөд улс орнуудын хүчин зүйлийн харьцангуй нөөцийн (factor endowment) ялгаа нь харьцуулсан давуу талын эх үүсвэр юм. Улс орон харьцангуй элбэг хүчин зүйлийг эрчимтэй ашигладаг бараанд харьцуулсан давуу тал эзэмшинэ (жишээ нь, капитал элбэгтэй орон капитал-эрчимтэй бараа экспортлоно).\"},{\"id\":16,\"question\":\"Хекшер-Олины загварт худалдаа нээгдэхэд улс орны дотоод орлогын хуваарилалтад ямар нөлөө үзүүлдэг вэ?\",\"answer\":\"Худалдаа нээгдэхэд элбэг хүчин зүйлд таатай, хомс хүчин зүйлд сөрөг нөлөө үзүүлдэг, учир нь экспортын барааны үнэ нэмэгдэж, импортын барааны үнэ буурдаг нь тухайн бараанд эрчимтэй ашиглагддаг хүчин зүйлийн эрэлтийг (derived demand) өөрчилдөг. Онолын хувьд хэрэв зах зээл нэг төрлийн бараа, нэг төрлийн хүчин зүйл, адил технологитой байвал чөлөөт худалдаа хүчин зүйлийн үнийг улс хоорондод тэнцүүлдэг (factor price equalization), гэхдээ бодит байдалд бодит нийцэл дутагдлаас хэлбэлздэг.  ## Худалдааны үр ашиг, зардал (Benefits and Costs of International Trade)\"},{\"id\":17,\"question\":\"\\\"Солилцооноос олсон ашиг\\\" (gains from exchange) гэж юуг хэлэх вэ?\",\"answer\":\"Худалдаа нь улс орон экспортдоо илүү өндөр үнэ авах, импортод бага үнэ төлөх боломж олгодог бол энэ нь солилцооноос олсон ашиг юм. Энэ нь экспортын барааны үйлдвэрлэлийг нэмэгдүүлж, импортын барааны үйлдвэрлэлийг бууруулж, нөөцийн хуваарилалтыг илүү үр ашигтай болгож, нийт тус тусын хэрэглэгч/үйлдвэрлэгч илүү сайн болохгүй байж болох ч ялагчид ялагдагчдыг нөхөн, бүгдээрээ илүү сайн болох боломжтой.\"},{\"id\":18,\"question\":\"Худалдааны үндсэн ашиг тусыг нэрлэ.\",\"answer\":\"(1) Солилцоо, мэргэшлээс олсон ашиг (харьцуулсан давуу тал дээр үндэслэсэн); (2) үйлдвэрүүдийн масштабын үр ашиг (economies of scale) нэмэгдэх; (3) өрх, фирмд бүтээгдэхүүний төрөл илүү их байх; (4) өрсөлдөөн нэмэгдэх; (5) нөөцийн хуваарилалт илүү үр ашигтай болох.\"},{\"id\":19,\"question\":\"Салбар доторх худалдаа (intra-industry trade) гэж юу вэ, монополит өрсөлдөөн (monopolistically competitive) загвартай хэрхэн холбоотой вэ?\",\"answer\":\"Улс орон нэг бүтээгдэхүүний ангилалд хамрагддаг бараагаа экспортлож, бас импортлож байвал салбар доторх худалдаа гэнэ (жишээ нь, ЕХ дотор автомашин экспорт-импортлох). Монополит өрсөлдөөнтэй загварт улс орнууд ижил төстэй байсан ч тус бүр өөр хувилбарт мэргэшиж, бусад хувилбарыг импортлож, хэрэглэгчид бүтээгдэхүүний илүү өргөн сортоос ашиг хүртэж, фирмүүд зах зээлийн масштаб нэмэгдсэнээр дундаж зардал буурдаг.\"},{\"id\":20,\"question\":\"\\\"Learning by doing\\\" ба мэдлэгийн тархалт (knowledge spillovers) нь худалдаагаар дамжуулан яаж эдийн засгийн өсөлтөд нөлөөлдөг вэ?\",\"answer\":\"\\\"Learning by doing\\\" гэдэг нь семикондуктор зэрэг салбарт үйлдвэрлэл нэмэгдэх тусам, туршлага хуримтлагдсаны улмаас нэгж үйлдвэрлэлийн зардал буурах үзэгдэл. Мэдлэгийн тархалт гэдэг нь мэдлэг бий болгоход хийсэн хөрөнгө оруулалт нь хийсэн байгууллагаас цаашлан бусад фирм, байгууллагын суралцал, инновацид ашиг тусыг бий болгодог үзэгдэл; Coe, Helpman (1995)-ийн судалгаагаар G–7 орны R\u0026D хөрөнгө оруулалтын ашгийн дөрөвний нэг орчим худалдааны хамтрагч оронд хуваарилагддаг.\"},{\"id\":21,\"question\":\"Чөлөөт худалдааны эсэргүүцэгчид ямар зардлыг онцолж байдаг вэ?\",\"answer\":\"Тэд орлогын тэгш бус байдал нэмэгдэх, импортын өрсөлдөөнөөс хойшилж хөгжсөн орнуудад ажлын байр алдагдах эрсдэлийг онцолдог. Худалдаа чөлөөлөгдөхөд нөөц (хөрөнгө оруулалт) экспортлогч салбарт шилжиж, импортын өрсөлдөөнтэй салбараас гарах шаардлагатай болж, бага үр ашигтай фирм зах зээлээс гарч, цаг хугацааны хувьд ажилгүйдэл нэмэгдэж, хойшлогдсон ажилчдыг дахин бэлтгэх шаардлагатай болдог.\"},{\"id\":22,\"question\":\"\\\"Худалдаанаас олсон ашиг\\\" (gains from trade) гэсэн илэрхийллийн утга юу вэ?\",\"answer\":\"Худалдаанаас олсон ашиг гэдэг нь худалдааны нийт ашиг тус, худалдааны алдагдлаас (зардал) давж байгаа гэсэн утгатай. Энэ нь бүх оролцогчид (үйлдвэрлэгч, хэрэглэгч, засгийн газар) тэнцүү (эсвэл ямар ч) ашиг хүртсэн гэсэн үг биш — зөвхөн нийт ашиг ялагдлаас их байна гэсэн үг бөгөөд онолын хувьд ялагчид ялагдагчдад нөхөн төлж, бүгдээрээ илүү сайн байх боломжтой.  ## Худалдаа, капиталын урсгалын хязгаарлалт (Trade and Capital Flow Restrictions)\"},{\"id\":23,\"question\":\"Гаалийн татвар (tariff) гэж юу вэ, түүний үндсэн зорилго юу вэ?\",\"answer\":\"Гаалийн татвар гэдэг нь засгийн газраас импортын бараанд ногдуулдаг татвар. Түүний үндсэн зорилго дотоодын адил төрлийн бараа үйлдвэрлэдэг салбарыг хамгаалах, импортын барааны үнийг чөлөөт худалдааны үнээс дээш өсгөж, импортын эрэлтийг бууруулах явдал; заримдаа худалдааны алдагдлыг багасгах зорилготой ч байж болно.\"},{\"id\":24,\"question\":\"Худалдааны бодлогын хувьд \\\"бага улс\\\" (small country) ба \\\"их улс\\\" (large country) гэсэн ангиллыг хэрхэн ялгах вэ?\",\"answer\":\"Хэмжээ, хүн ам, GDP-тэй холбоогүйгээр, \\\"бага улс\\\" гэдэг нь дэлхийн зах зээлийн тухайн барааны үнэд нөлөөлж чадахгүй үнэ хүлээн авагч (price taker) улсыг хэлнэ (жишээ нь, Бразил машины зах зээлд бага улс). \\\"Их улс\\\" нь тухайн бараанд том импортлогч бөгөөд дэлхийн зах зээлийн үнэд нөлөөлж чадна. Их улс гаалийн татвар тавихад экспортлогч үнээ бууруулж, зах зээлийн хувиасаа алдахгүй байхыг хичээдэг тул энэ нь худалдааны нөхцлийг (terms of trade) өөрчилж, орлогыг экспортлогч улсаас импортлогч улс руу дахин хуваарилдаг.\"},{\"id\":25,\"question\":\"Импортлогч улсад гаалийн татвар (эсвэл квотагийн)-ын эдийн засгийн нөлөөллийг хэрхэн хураангуйлж болох вэ?\",\"answer\":\"Хэрэглэгчийн илүүдэл ашиг: – (A + B + C + D); Үйлдвэрлэгчийн илүүдэл ашиг: +A; Гаалийн татварын орлого (эсвэл квотагийн рент): +C; Үндэсний ашиг тус (national welfare): –B – D. Хэрэглэгчийн илүүдэл ашгийн алдагдал нь үйлдвэрлэгчийн ашиг, засгийн газрын орлогын нийлбэрээс их тул цэвэр ашиг алдагдал (deadweight loss) B + D үүсдэг.\"},{\"id\":26,\"question\":\"Өмнөд Африк хоолойн цаасны жилийн дотоод үйлдвэрлэл 110,000 тонн, дотоод эрэлт 200,000 тонн, дэлхийн үнэ $5/тонн байв. 20%-ийн гаалийн татвар тавихад үнэ $6 болж, дотоод үйлдвэрлэл 130,000 тонн болж, эрэлт 170,000 тонн болов. Хэрэглэгчийн илүүдэл ашгийн алдагдал хэд вэ?\",\"answer\":\"Хэрэглэгчийн илүүдэл ашгийн алдагдал = $1 × 170,000 + 1/2 × $1 × 30,000 = $185,000 (энэ нь A + B + C + D талбайг төлөөлнө). Үйлдвэрлэгчийн илүүдэл ашгийн өсөлт = $1 × 110,000 + 1/2 × ($1 × 20,000) = $120,000 (A талбай). Засгийн газрын орлогын өсөлт = $1 × 40,000 = $40,000 (C талбай). Цэвэр ашиг алдагдал (deadweight loss) = 1/2 × $1 × 20,000 + 1/2 × $1 × 30,000 = $25,000 (B + D талбай).\"},{\"id\":27,\"question\":\"Квота (import quota) гэж юу вэ, гаалийн татвараас юугаараа ялгаатай вэ?\",\"answer\":\"Квота гэдэг нь тодорхой хугацаанд импортлох боломжтой барааны тоо хэмжээг хязгаарлах зохицуулалт. Гаалийн татвараас ялгарах гол зүйл нь засгийн газар гаалийн татварын орлогыг цуглуулж чадах атлаа квотагийн тохиолдолд гадаадын үйлдвэрлэгч ихэвчлэн үнээ өсгөж, квотагийн рент (quota rent) гэж нэрлэгддэг нэмэлт ашгийг олдог бөгөөд үүнийг импортлогч улс олж авах эсвэл (лиценз дуудлага худалдаагаар) засгийн газар авч болно.\"},{\"id\":28,\"question\":\"Сайн дурын экспортын хязгаарлалт (voluntary export restraint, VER) гэж юу вэ, импортын квотагоос юугаараа ялгаатай вэ?\",\"answer\":\"VER гэдэг нь экспортлогч улсын тодорхой тоо хэмжээгээр экспортоо хязгаарлахаа зөвшөөрсөн худалдааны хориг арга хэмжээ. Импортын квотагоос ялгарах гол зүйл нь квотагийн эх үүсвэрт (хэн тавьсан) байгаа: квотаг импортлогч тавьдаг бол VER-ийг экспортлогч тавьдаг. VER-ийн тохиолдолд квотагийн рент бүхэлдээ экспортлогч (эсвэл экспортлогч улс) рүү очдог тул импортлогч улсад илүү их ашиг алдагдал үүсгэдэг.\"},{\"id\":29,\"question\":\"Экспортын татаас (export subsidy) гэж юу вэ, цэвэр ашигт ямар нөлөөтэй вэ? Эсрэг арга хэмжээний татвар (countervailing duty) гэж юу вэ?\",\"answer\":\"Экспортын татаас гэдэг нь засгийн газар тухайн барааны нэгж экспортлох тутамд фирмд өгдөг төлбөр бөгөөд экспортыг дэмжих зорилготой, гэвч чөлөөт зах зээлийн ажиллагаанд саад болж, харьцуулсан давуу талаас гажуудсан худалдааг бий болгож, ашиг тусыг бууруулдаг. Эсрэг арга хэмжээний татвар бол татаастай экспортод импортлогч улсаас ногдуулдаг татвар юм.\"},{\"id\":30,\"question\":\"Гаалийн татвар, квота, экспортын татаас, VER дөрвийн улсын ашиг тусад үзүүлэх нөлөөг хураангуйлж харьцуул.\",\"answer\":\"Дөрвийнх нь бараг адилхан нөлөөтэй: үнэ өсдөг (татаасын тохиолдолд экспортлогч орны дотоод үнэ), дотоод хэрэглээ буурдаг, дотоод үйлдвэрлэл нэмэгддэг, худалдаа буурдаг (импорт буурна, татаасын тохиолдолд экспорт нэмэгдэнэ). Үндэсний ашиг тус бага улсад бүгдэд буурдаг бол их улсад гаалийн татвар, (онолын хувьд) квотаг л нэмэгдүүлж болно. Засгийн газрын орлого гаалийн татвараар нэмэгддэг, квотагоор тодорхойгүй (хэн рентийг эзэмшихээс хамаарна), татаасаар буурдаг (засгийн зардал нэмэгддэг), VER-ээр өөрчлөгддөггүй (рент гадаадынхнаас очдог).\"},{\"id\":31,\"question\":\"Капиталын хязгаарлалт (capital restriction) гэж юу вэ, худалдааны хязгаарлалтаас юугаараа ялгаатай вэ?\",\"answer\":\"Капиталын хязгаарлалт гэдэг нь гадаадынхны дотоод актив эзэмших, дотоодынхны гадаад актив эзэмших чадварт тавьсан хяналт. Худалдааны хязгаарлалт бараа, үйлчилгээний зах зээлийн нээлттэй байдлыг хязгаарладаг бол капиталын хязгаарлалт санхүүгийн зах зээлийн нээлттэй байдлыг хязгаарладаг.\"},{\"id\":32,\"question\":\"Капиталын хязгаарлалт ямар хэлбэрээр хэрэгжиж болох вэ?\",\"answer\":\"Татвар (жишээ нь, олон улсын хөрөнгө оруулалтын орлогод тусгай татвар), үнийн/тоо хэмжээний хяналт (жишээ нь, заавал нөөцийн шаардлага — гадаад хөрөнгийг дотоод банкинд байршуулахдаа тодорхой хувийг төв банкинд хадгалах шаардлага), шууд хориг (цаад этгээдийн зээллэгт зориулсан хязгаарлалт, лимит), эсвэл захиргаадлын хяналт (тодорхой актив хэлцлийг засгийн газрын байгууллагаар батлуулах шаардлага) зэрэг хэлбэртэй байж болно.\"},{\"id\":33,\"question\":\"Малайз улс 1998 онд ямар шалтгаанаар, ямар зорилгоор капиталын хязгаарлалт тогтоосон бэ?\",\"answer\":\"Тайландын бат давхаргын (baht) ам.доллартай тогтсон ханшаас татгалзсанаас үүдэлтэй Зүүн Өмнөд Азийн санхүүгийн хямралын үед Малайз богино хугацаат капиталын гадагш урсгалд өртсөн. 1998 оны 9-р сарын 1-нд Малайз дотоод-гадаад дансны хооронд шилжүүлгийг хориглож, рингитийн ханшийг ам.доллартай 3.8-д бэхжүүлж, хөрөнгийн эх орондоо эргэн нэвтрэхийг хязгаарлаж, монетарын бие даасан байдлыг сэргээж, хүүгийн түвшинг бууруулахыг зорьсон; үр дүнд эдийн засаг тогтворжсон ч MSCI хөгжсөн зах зээлийн индексээс хасагдах зэрэг урт хугацааны зардалтай болсон.\"},{\"id\":34,\"question\":\"Худалдааны блок (trading bloc) буюу бүсийн худалдааны хэлэлцээр (regional trade agreement, RTA) гэж юу вэ?\",\"answer\":\"Худалдааны блок нь гишүүн орнуудынхаа хооронд худалдаа, үйлдвэрлэлийн хүчин зүйлийн хөдөлгөөнд тулгарч буй саад бэрхшээлийг багасгах, шатлан арилгахаар хэлэлцээрт гарын үсэг зурсан орнуудын бүлэг бөгөөд гишүүн бус орны эсрэг нийтлэг худалдааны хязгаарлалттай байж ч, байхгүй байж ч болно.\"},{\"id\":35,\"question\":\"Чөлөөт худалдааны бүс (free trade area, FTA) гэж юу вэ?\",\"answer\":\"FTA гэдэг нь гишүүн орнуудын хооронд бараа, үйлчилгээний урсгалд тавьсан бүх саадыг арилгасан, бүсийн интеграцийн нэг хамгийн түгээмэл хэлбэр; гэхдээ улс орон бүр гишүүн бус орнуудын эсрэг өөрийн худалдааны бодлогыг хадгалдаг (жишээ нь, NAFTA).\"},{\"id\":36,\"question\":\"Гаалийн холбоо (customs union) гэж юу вэ?\",\"answer\":\"Гаалийн холбоо нь FTA-г өргөтгөж, гишүүн орнуудын хооронд бараа, үйлчилгээний чөлөөт хөдөлгөөнийг зөвшөөрөхөөс гадна гишүүн бус орны эсрэг нийтлэг худалдааны бодлого бий болгодог (жишээ нь, Benelux гаалийн холбоо 1947 он).\"},{\"id\":37,\"question\":\"Нийтлэг зах зээл (common market) гэж юу вэ?\",\"answer\":\"Нийтлэг зах зээл нь гаалийн холбооны бүх шинж чанарыг агуулж, гишүүн орнуудын хооронд үйлдвэрлэлийн хүчин зүйлийн (хөдөлмөр, капитал) чөлөөт хөдөлгөөнийг нэмж зөвшөөрсөн эдийн засгийн интеграцийн дараагийн шат (жишээ нь, MERCOSUR).\"},{\"id\":38,\"question\":\"Эдийн засгийн холбоо (economic union) ба мөнгөний холбоо (monetary union) хоёрыг тайлбарла.\",\"answer\":\"Эдийн засгийн холбоо нь нийтлэг зах зээлийн бүх шинж чанарыг агуулж, гадна нийтлэг эдийн засгийн институц, бодлогын зохицуулалтыг шаарддаг (жишээ нь, Европын Холбоо 1993 оноос хойш). Хэрэв гишүүд нийтлэг мөнгөн тэмдэгт нэвтрүүлбэл (жишээ нь, еврог нэвтрүүлсэн ЕХ-ны 19 гишүүн орон) тэр нэгэн зэрэг мөнгөний холбоо болно.\"},{\"id\":39,\"question\":\"Худалдаа бий болгох (trade creation) ба худалдаа шилжих (trade diversion)-ийн ялгааг тайлбарла.\",\"answer\":\"Худалдаа бий болгох гэдэг нь бүсийн интеграцийн үр дүнд өндөр зардалтай дотоод үйлдвэрлэлийг гишүүн орныхны бага зардалтай импортоор орлуулах явдал — нөөцийн хуваарилалтыг үр ашигтай болгоно. Худалдаа шилжих гэдэг нь гишүүн бус орны бага зардалтай импортыг гаалийн татвараас шалтгаалан гишүүн орны өндөр зардалтай импортоор орлуулах явдал — нөөцийн хуваарилалтыг бага үр ашигтай болгож болзошгүй. Хэрэв худалдаа бий болгох эффект худалдаа шилжихээс илүү бол нийт ашиг тусын нөлөө эерэг байна.  ## Төлбөрийн тэнцэл: дансууд ба давхар бичилтийн тооллого (BOP Accounts and Double-Entry Bookkeeping)\"},{\"id\":40,\"question\":\"Төлбөрийн тэнцэл (balance of payments, BOP) гэж юу вэ?\",\"answer\":\"Төлбөрийн тэнцэл нь тодорхой хугацаанд (ихэвчлэн улирал эсвэл жил) улс орны дэлхийн бусад орнуудтай хийсэн эдийн засгийн гүйлгээг хураангуйлсан давхар бичилтийн нягтлан бодох бүртгэлийн систем (double-entry bookkeeping system) юм. BOP нь экспорт, импортын төлбөр, мөн санхүүгийн гүйлгээ, санхүүгийн шилжүүлгийг тусгадаг.\"},{\"id\":41,\"question\":\"BOP-д дебит (debit) ба кредит (credit) гэдэг гүйлгээний бичилт юуг илэрхийлдэг вэ?\",\"answer\":\"Дебит нь импортын барааны үнэ, гадаад санхүүгийн активын худалдан авалт, экспортоос авсан төлбөр, өртнөөсөөс (debtor) хүлээн авсан төлбөрийг бичдэг — үнэндээ активын өсөлт эсвэл өр төлбөрийн бууралтыг илэрхийлнэ. Кредит нь импортын барааны төлбөр, худалдан авсан гадаад активын төлбөр, зээлдэгчдэд (creditors) хийсэн төлбөрийг бичдэг — активын бууралт эсвэл өр төлбөрийн өсөлтийг илэрхийлнэ. Онолын хувьд бүх дебитийн нийлбэр нь бүх кредитийн нийлбэртэй тэнцэж, нийт тэнцэл 0 байх ёстой.\"},{\"id\":42,\"question\":\"Урсгал данс (current account)-ыг ямар дэд-дансанд хуваадаг вэ?\",\"answer\":\"Урсгал данс дөрөв дэд-данстай: (1) бараа худалдаа (merchandise trade) — худалдан авсан, зарагдсан эсвэл бэлэглэсэн бүх түүхий эд, үйлдвэрлэсэн бараа; (2) үйлчилгээ (services) — жуулчлал, тээвэр, инженерчлэл, зөвлөгч үйлчилгээ зэрэг; (3) орлогын хүлээн авалт (income receipts) — активын эзэмшилтээс олсон дивиденд, хүү зэрэг орлого; (4) нэг талын шилжүүлэг (unilateral transfers) — гадаадаас ажилчдын мөнгөн гуйвуулга, гадаадын шууд тусламж, бэлэг зэрэг нэг чиглэлийн шилжүүлэг.\"},{\"id\":43,\"question\":\"Капиталын данс (capital account)-ыг ямар дэд-дансанд хуваадаг вэ?\",\"answer\":\"Капиталын данс хоёр дэд-данстай: (1) капиталын шилжүүлэг (capital transfers) — өрийг хуулах (debt forgiveness), цагаачдын шилжүүлэг (цагаачид улс орноосоо гарах/орохдоо авч явдаг бараа, санхүүгийн актив), бэлэг/өвийн татвар зэрэг; (2) үйлдвэрлэгдэгдээгүй, санхүүгийн бус активын худалдан авалт/худалдаа (жишээ нь, байгалийн нөөцийн эрх, патент, зохиогчийн эрх зэрэг биет бус активын худалдаа).\"},{\"id\":44,\"question\":\"Санхүүгийн данс (financial account)-ыг ямар дэд-дансанд хуваадаг вэ?\",\"answer\":\"Санхүүгийн данс хоёр дэд-данстай: (1) улсын гадаад актив (assets abroad) — цаашид албан нөөцийн актив (official reserve assets), засгийн газрын актив, хувийн актив болон хуваагдана (алт, гадаад валют, гадаад үнэт цаас, ОУВС-д байх нөөцийн байр суурь, шууд хөрөнгө оруулалт зэрэг); (2) мэдэгдэгч улсад байрлах гадаадын эзэмшлийн актив — албан бус болон бусад гадаад актив болж хуваагдана (тайлагнагч улсын засгийн газар/хувийн секторын гаргасан үнэт цаас, шууд хөрөнгө оруулалт зэрэг).\"},{\"id\":45,\"question\":\"BOP-ийн давхар бичилтийн зарчим гэж юу вэ, ямар тодорхойлох тэгшитгэл (BOP identity) хэрэглэдэг вэ?\",\"answer\":\"BOP-ийн давхар бичилтийн системд (double-entry bookkeeping) бүх гүйлгээ дебит, кредит хоёулаа агуулдаг. Онолын хувьд бүх дебитийн нийлбэр кредитийн нийлбэртэй тэнцэж, BOP-ийн статементын нийт тэнцэл 0 байх ёстой: урсгал данс + капиталын данс + санхүүгийн данс ≈ 0. Бодит байдалд, гүйлгээний мэдээллийг өөр эх сурвалжаас авдаг тул энэ нь яг тэнцдэггүй (\\\"статистикийн зөрүү\\\" гарч ирнэ).\"},{\"id\":46,\"question\":\"1 сарын 9-нд Улс А Улс Б-гаас $1 сая бараа худалдан авч, 12-р сарын 1-нд төлбөрөө хийхээр тохирлов. Улс А 9 сарын 1 ба 12 сарын 1-нд өөрийн BOP-д хэрхэн дебит, кредит бичлэг хийх вэ?\",\"answer\":\"9-р сарын 1-нд Улс А худалдан авсан барааны үнийн дүнг (активын өсөлт) $1 сая дебит, Улс Б-д төлбөл зохих мөнгийг (өр төлбөрийн өсөлт) $1 сая кредит болгон бичнэ. 12-р сарын 1-нд Улс А өрийн бууралтыг (liability-ийн бууралт) $1 сая дебит, бодит төлбөрийг (активын бууралт) $1 сая кредит болгон бичнэ. Нийт дебит, кредитийн нийлбэр тус бүр $2 сая байж, тэнцэл 0 болно.\"},{\"id\":47,\"question\":\"Инвестийн мэргэжилтнүүд BOP-ыг практикт хэрхэн илүү энгийн байдлаар авч үздэг вэ?\",\"answer\":\"Инвестийн мэргэжилтнүүд ихэвчлэн урсгал дансыг худалдааны тэнцэлтэй (бараа худалдаа + үйлчилгээ) ойролцоо гэж авч үзэж, бүх санхүүжилтийн урсгалыг (санхүүгийн данс + капиталын данс) нэг ангилалд нэгтгэж, үүнийг энгийнээр \\\"капиталын данс\\\" гэж нэрлэдэг. Үүнийгээ дараа нь хоёр төрлийн урсгал — портфелийн хөрөнгө оруулалт (богино хугацаат) ба FDI (урт хугацаат, бүтээмжийн активт)-д хуваан авч үзнэ.  ## Үндэсний эдийн засгийн тооцоо (National Economic Accounts and the Balance of Payments)\"},{\"id\":48,\"question\":\"Хаалттай эдийн засаг (closed economy)-ийн үндэсний орлогын таних тэгшитгэлийг (national income identity) бич.\",\"answer\":\"Хаалттай эдийн засаг дотор бүх продукт Y хувийн секторт (хэрэглээ C, хөрөнгө оруулалт I) эсвэл засгийн газраар (G) худалдан авагддаг тул: Y = C + I + G (1), энд Y — GDP, C — хувийн хэрэглээ, I — хөрөнгө оруулалт, G — засгийн газрын худалдан авалт.\"},{\"id\":49,\"question\":\"Нээлттэй эдийн засаг (open economy)-ийн үндэсний орлогын таних тэгшитгэл, мөн урсгал дансны тэнцлийн (CA) тодорхойлолтыг бич.\",\"answer\":\"Нээлттэй эдийн засагт: Y = C + I + G + X – M (2), энд X — экспорт, M — импорт. Тэгшитгэл 2-ийг хувираар, урсгал дансны тэнцлийг: CA = X – M = Y – (C + I + G) (3) гэж тодорхойлж болно, өөрөөр хэлбэл цэвэр экспорт нь BOP-ийн үүднээс урсгал дансны тэнцэлтэй тэнцүү.\"},{\"id\":50,\"question\":\"Захиран зарцуулах орлого (disposable income, Yd)-ыг тодорхойлох тэгшитгэлүүдийг бич.\",\"answer\":\"Yd = Y + R – T (4), энд R — цэвэр шилжүүлэг, T — татвар. Захиран зарцуулах орлого нь хэрэглээ (C) болон хувийн хуримтлал (private saving, Sp)-д хуваарилагдана: Yd = C + Sp (5). Үүнээс хэрэглээг дараах байдлаар бичиж болно: C = Yd – Sp = Y + R – T – Sp (6).\"},{\"id\":51,\"question\":\"Хувийн хуримтлал (Sp), засгийн газрын хуримтлал (Sg), хөрөнгө оруулалт (I) ба урсгал дансны тэнцэл (CA)-ийг холбосон таних тэгшитгэлийг бич.\",\"answer\":\"Тэгшитгэл 3, 6-ийг хослуулж, (T – G – R)-ийг засгийн газрын хуримтлал Sg гэж тэмдэглэвэл: CA = Sp – I + (T – G – R) (7), үүнийг дараах байдлаар дахин бичиж болно: Sp + Sg = I + CA (8). Энэ нь нээлттэй эдийн засаг хуримтлалаа дотоод хөрөнгө оруулалт эсвэл гадаад хөрөнгө оруулалтад (гадаад актив худалдан авах замаар) ашиглаж болдог гэдгийг харуулдаг бол хаалттай эдийн засагт хуримтлал зөвхөн дотоод хөрөнгө оруулалтад зарцуулагддаг.\"},{\"id\":52,\"question\":\"Тэгшитгэл 8-г дахин зохицуулж, урсгал дансны тэнцвэрийн эх үүсвэрийг (macroeconomic sources of a current account imbalance) харуулах тэгшитгэлийг бич, мөн урсгал дансны алдагдал ямар нөхцөлд гарах вэ?\",\"answer\":\"Тэгшитгэл 8-г дахин зохицуулахад: CA = Sp + Sg – I (10). Урсгал дансны алдагдал ихэвчлэн бага хувийн хуримтлал, өндөр хувийн хөрөнгө оруулалт, засгийн газрын алдагдал (Sg \u003c 0), эсвэл эдгээрийн хослолоос үүдэлтэй байдаг. Харин урсгал дансны ашиг нь өндөр хувийн хуримтлал, бага хувийн хөрөнгө оруулалт, эсвэл засгийн газрын илүүдлийг тусгадаг.  ## Олон улсын худалдааны байгууллагууд (Trade Organizations: IMF, World Bank, WTO)\"},{\"id\":53,\"question\":\"Бреттон Вудс (Bretton Woods) хуралдаанаас ямар байгууллагууд бий болсон бэ, яагаад бий болсон бэ?\",\"answer\":\"1930-аад оны Их хямралын үед орнууд худалдааны хориг тавих, мөнгөн тэмдэгтээ хямдруулах зэрэг арга хэмжээ авсан нь эдийн засгийг улам доройтуулсан. 1944 оны 7-р сард Бреттон Вудс (АНУ)-д болсон хуралдаанаар олон улсын эдийн засгийн хамтын ажиллагааны тогтолцоог тохиролцсон бөгөөд үүнээс Дэлхийн банк (World Bank) ба Олон улсын валютын сан (International Monetary Fund, IMF) бий болсон (IMF 1945 оны 12-р сард албан ёсоор байгуулагдсан). Гурав дахь байгууллага — Олон улсын худалдааны байгууллага (ITO)-г байгуулахаар төлөвлөсөн ч АНУ-ын Конгресс соёрхон баталгаажуулаагүйн улмаас бий болоогүй, оронд нь GATT нь 1995 он хүртэл олон улсын худалдааг зохицуулдаг цорын ганц үйлчилгээ хэвээр үлдсэн.\"},{\"id\":54,\"question\":\"Олон улсын валютын сан (IMF)-ийн үндсэн зорилго, функцийг нэрлэ.\",\"answer\":\"IMF-ийн үндсэн зорилго бол олон улсын мөнгөн тогтолцооны тогтвортой байдлыг (валютын ханш, олон улсын төлбөрийн тогтолцоо) хангах явдал юм. Тодруулбал IMF: (1) олон улсын мөнгөний асуудлаар хамтын ажиллагааны талбар бий болгодог; (2) олон улсын худалдааны өсөлт, ажил эрхлэлт, эдийн засгийн өсөлт, ядуурлы
