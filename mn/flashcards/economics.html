г бууруулахыг дэмждэг; (3) валютын ханшийн тогтвортой байдал, олон улсын төлбөрийн нээлттэй тогтолцоог дэмждэг; (4) гишүүн орнуудад BOP-ийн асуудлыг шийдвэрлэхэд хугацаатай, баталгаатай гадаад валютын зээл олгодог.\"},{\"id\":55,\"question\":\"Дэлхийн банкны зорилго юу вэ, IBRD ба IDA хоёр юугаараа ялгаатай вэ?\",\"answer\":\"Дэлхийн банкны үндсэн зорилго хөгжиж буй орнуудад ядуурлыг эсэргүүцэх, байгаль орчинд ээлтэй эдийн засгийн өсөлтийг дэмжих явдал юм. Үүнд хамаарах хоёр байгууллага: Олон улсын сэргээн босголт, хөгжлийн банк (IBRD) зах зээлийн суртал (бонд гарган зээл авдаг) дээр суурилж, нэр хүндтэй орнуудад бага хүүтэй зээл олгоно; Олон улсын хөгжлийн нийгэмлэг (IDA) нь хамгийн ядуу орнуудад хүүгийн хувь хэмжээгээр, тэтгэмжийн хэлбэрээр зээл олгодог дэлхийн хамгийн том эх сурвалж юм. Хоёулаа ашгийн төлөө ажиллахгүй.\"},{\"id\":56,\"question\":\"Дэлхийн худалдааны байгууллага (WTO)-ийн зорилго юу вэ, GATT-аас хэрхэн үүссэн бэ?\",\"answer\":\"WTO нь дэлхийн хэмжээнд улс хоорондын хил дамжсан худалдааны харилцааг зохицуулдаг цорын ганц олон улсын байгууллага бөгөөд 1995 оны 1-р сарын 1-нд 1947 оноос хойш үйлчилж байсан \\\"Гаалийн татвар, худалдааны ерөнхий хэлэлцээр\\\" (General Agreement on Tariffs and Trade, GATT)-ийг орлож байгуулагдсан. WTO-ийн үндсэн функцүүд нь хэлэлцээрийг хэрэгжилт, удирдлага; хэлэлцээрийн платформ болж ажиллах; худалдааны маргааныг шийдвэрлэх зэрэг юм. 2001 оноос Доха (Doha, Катар)-д хэлэлцээний эгнээ эхлэгдсэн бөгөөд одоо хүртэл бүрэн гэрээ хэлэлцэгдээгүй байна.\"},{\"id\":57,\"question\":\"GATT (General Agreement on Tariffs and Trade) гэж юу вэ, түүний түүхэн үүрэг юу байсан бэ?\",\"answer\":\"GATT нь 1947 оны 10-р сарын 30-нд 23 орны байгуулсан гаалийн татварыг бууруулах, зохицуулах хэлэлцээр юм. ITO (Олон улсын худалдааны байгууллага) АНУ-ын Конгрессоор соёрхон батлагдаагүйгээс GATT 1948-1995 он хүртэл олон улсын худалдааг зохицуулдаг цорын ганц олон талт байгуулал байсан. Токио (Tokyo) ба Уругвайн (Uruguay) эгнээнд ялангуяа чухал хэлэлцээрүүд хийгдсэн бөгөөд 1995 онд GATT-ийг WTO-гоор орлуулсан.\"},{\"id\":58,\"question\":\"IMF, World Bank, WTO гурвыг тус бүрийнх нь үндсэн үүрэгт тулгуурлан хэрхэн ялгаж болох вэ?\",\"answer\":\"IMF — олон улсын мөнгөний тогтолцооны тогтвортой байдлыг (ханш, төлбөрийн тогтолцоо) хангаж, BOP-ийн асуудал үүсэхэд гишүүн орнуудад гадаад валютын зээл олгодог (жишээ нь, 2010 оны Грекийн хямралд туслалцаа үзүүлсэн); World Bank — хөгжиж буй орнуудад ядуурлыг бууруулах, эдийн засгийн суурь дэд бүтцийг хөгжүүлэхэд зээл, зөвлөгөө өгдөг; WTO — олон улсын худалдааны эрх зүйн, байгууллагын суурийг тавьж, худалдааны хэлэлцээрийг зохицуулж, маргааныг шийдвэрлэдэг.\"}]},{\"id\":\"exchange-rates\",\"title\":\"Валютын ханш\",\"cards\":[{\"id\":1,\"question\":\"Валютын ханш (exchange rate) гэж юу вэ, мөн \\\"суурь валют\\\" (base currency) ба \\\"үнийн валют\\\" (price currency) гэдгийг хэрхэн тодорхойлдог вэ?\",\"answer\":\"Валютын ханш нь нэг валютын үнийг нөгөө валютаар илэрхийлсэн утга юм — ямагт хоёр валют оролцдог. \\\"A/B\\\" гэж тэмдэглэхэд энэ нь валют B-ийн 1 нэгжийг худалдан авахад шаардагдах валют A-ийн нэгжийн тоог илэрхийлнэ. Энд A нь үнийн валют (price currency, тоологч), B нь суурь валют (base currency, хуваагч ба ямагт 1 нэгж гэж тооцогддог) юм.\"},{\"id\":2,\"question\":\"Номинал валютын ханш (nominal exchange rate) ба бодит валютын ханш (real exchange rate) хоёрын ялгаа юу вэ?\",\"answer\":\"Номинал ханш нь зах зээлд шууд ханшлагддаг, бидний өдөр тутамд сонсдог ханш юм. Бодит ханш нь номинал ханшийг хоёр улсын үнийн түвшнээр тохируулж, худалдан авах чадварын (purchasing power) харьцангуй өөрчлөлтийг хэмждэг индекс бөгөөд зах зээлд шууд арилжаалагдахгүй — зөвхөн шинжээчдийн бүтээсэн индекс.\"},{\"id\":3,\"question\":\"Бодит валютын ханшийг (d/f конвенц, өөрөөр хэлбэл дотоод валют нь үнийн валют) ямар томьёогоор илэрхийлдэг вэ?\",\"answer\":\"Real exchange rate(d/f) = (S_d/f × P_f)/P_d = S_d/f × (P_f/P_d), энд S_d/f нь гадаадын нэг нэгж валютад ногдох дотоод валютын нэгжийн тоогоор илэрхийлсэн спот ханш, P_f нь гадаад үнийн түвшин (гадаад валютаар), P_d нь дотоод үнийн түвшин (дотоод валютаар).\"},{\"id\":4,\"question\":\"Худалдан авах чадварын паритет (purchasing power parity, PPP) онол юу гэж үздэг вэ, мөн бодит байдал дээр яагаад алдагддаг вэ?\",\"answer\":\"PPP онол нь номинал валютын ханш уртын хугацаанд тохируулагдаж, ижил бараа (эсвэл барааны сагс) өөр зах зээлд ижил үнэтэй байх ёстой гэж үздэг. Гэвч бодит байдал дээр бараа/үйлчилгээ улс орнуудад ижил биш, худалдааны хаалт (trade barriers), тээвэрлэлтийн зардал, импортын татвар байдаг тул номинал ханш PPP түвшнээс байнга хазайдаг.\"},{\"id\":5,\"question\":\"Гадаад валютын зах зээлийн өдөр тутмын арилжааны эзлэхүүнд олон улсын худалдаа (international trade) болон хөрөнгийн зах зээлийн гүйлгээ (capital market transactions) хэд хэдийн нь давамгайлдаг вэ?\",\"answer\":\"Хөрөнгийн зах зээлийн гүйлгээ (шууд хөрөнгө оруулалт, багцын хөрөнгө оруулалт зэрэг) өдөр тутмын FX арилжааны илүү их хэсгийг эзэлдэг — олон улсын худалдааны барааг тооцоолоход шаардагдах гүйлгээнээс хамаагүй их. Энэ нь хөрөнгийн маш өндөр хөрвөх чадвартай (capital mobility) байдлаас шалтгаалдаг.\"},{\"id\":6,\"question\":\"Хедж хийх (hedging) ба спекуляц хийх (speculation) хоёрын зааг яагаад тодорхой биш байдаг вэ, компанийн санхүүгийн алба хедж хийх үр дүнгээ хэрхэн үнэлдэг вэ?\",\"answer\":\"Экспортлогч компани гадаад валютын орлогоо хэдий хэмжээгээр, хэзээ хэдий хэмжээгээр хийхээ тодорхой мэддэггүй тул хедж хийх шийдвэрт үнэлэмж (discretion) оролцдог; хэт хедж хийх эсвэл дутуу хедж хийх боломж байдаг нь спекуляцтай нийлдэг. Санхүүгийн алба ихэвчлэн тогтмол хэмжээгээр (жишээ нь 100%) бүрэн хедж хийсэн \\\"benchmark\\\"-тэй харьцуулан, бодит гүйцэтгэлийн ашиг алдагдлыг хэмжиж үнэлдэг.\"},{\"id\":7,\"question\":\"Спот гүйлгээ (spot transaction) гэж юу вэ, мөн стандарт тооцооллын хугацаа хэд вэ?\",\"answer\":\"Спот гүйлгээ нь валютыг шууд (ойрын хугацаанд) солилцох гүйлгээ бөгөөд ихэнх валютад \\\"T+2\\\" (арилжаа хийснээс хойш 2 ажлын өдөр) тооцоологддог. Онцгой тохиолдол бол канад доллар (CAD), үүнийг ам.доллартай \\\"T+1\\\"-ээр тооцдог.\"},{\"id\":8,\"question\":\"Шууд форвард гэрээ (outright forward contract) ба FX свап (FX swap) хоёр хоорондын ялгаа юу вэ?\",\"answer\":\"Форвард гэрээ нь өнөөдөр тохиролцсон ханшаар ирээдүйд (T+2-оос илүү хугацаагаар) валют солилцох гэрээ юм. FX свап нь нэгэн зэрэг хийгдэх спот гүйлгээ + форвард гэрээний хослол бөгөөд голчлон хуучин форвард байрлалыг шинэ хугацаанд \\\"сунгах\\\" (roll) эсвэл свап санхүүжилт (swap funding) хийхэд ашиглагддаг.\"},{\"id\":9,\"question\":\"Валютын фьючерс гэрээ (currency futures contract) нь OTC форвард гэрээнээс юугаараа ялгаатай вэ?\",\"answer\":\"Фьючерс нь бирж дээр (жишээ нь CME-ийн IMM хэсэг) арилжаалагддаг, тогтмол стандартжуулсан гэрээний хэмжээ болон тооцооллын огноотой, барьцаа хөрөнгийг (collateral) өдөр тутам зах зээлийн үнэ дээр үнэлж (mark-to-market) тохируулдаг. OTC форвард нь уян хатан хэмжээ, огноо, харин харилцагч талын эрсдэл (counterparty risk) өндөртэй.\"},{\"id\":10,\"question\":\"FX опцион (FX option) гэж юу вэ?\",\"answer\":\"FX опцион нь урьдчилсан хураамж (premium) төлж, тодорхой ирээдүйн огноонд тохиролцсон ханшаар FX гүйлгээ хийх эрхийг (боловч үүрэг биш) олгодог гэрээ. Эзэмшигч нь зөвхөн ашигтай тохиолдолд опционыг хэрэгжүүлдэг.\"},{\"id\":11,\"question\":\"FX зах зээлийн \\\"buy side\\\"-ын оролцогчдыг ямар ангилалд хуваадаг вэ?\",\"answer\":\"Корпорацийн данс (corporate accounts), бодит мөнгөний данс (real money accounts — даатгал, пенш, ETF зэрэг, хязгаарлагдмал leverage-тэй), leveraged данс (hedge fund, CTA, proprietary trading, алгоритм арилжаачид), жижиглэнгийн данс (retail accounts), засгийн газрууд (governments), төв банкууд (central banks), мөн тусгай хөрөнгийн сан (sovereign wealth funds, SWF).\"},{\"id\":12,\"question\":\"FX зах зээлийн \\\"sell side\\\"-ыг хэрхэн давхаргажуулдаг вэ?\",\"answer\":\"Хамгийн том, цар хүрээтэй дилингийн банкууд (Deutsche Bank, Citigroup, UBS, HSBC зэрэг) өдөр тутмын арилжааны ихэнх хэсгийг эзэлж, олон хэрэглэгчийн гүйлгээг дотооддоо нийлүүлж (internally crossed) чаддаг. Бусад бүс нутгийн/орон нутгийн банкууд арилжаагаа тэргүүлэх зэрэглэлийн банкуудаар гүйцэтгүүлдэг — ихэвчлэн дэлхийн хэмжээний клиент баазгүй тул.\"},{\"id\":13,\"question\":\"BIS-ийн 2016 оны гурван жилийн тутмын судалгаагаар (BIS Triennial Survey) өдөр тутмын дэлхийн FX арилжааны нийт эзлэхүүн болон бүтэц ямар байв?\",\"answer\":\"2016 оны 4-р сард дундаж өдрийн арилжаа ойролцоогоор USD5.1 триллион байсан. Бүтээгдэхүүнээр: спот 33%, форвард 14%, свап 49%, опцион 5%. Харилцагчаар: интербанк 42%, санхүүгийн харилцагч 51%, санхүүгийн бус харилцагч зөвхөн 8%. Хамгийн их арилжаалагдсан таван валютын хос бүгд USD агуулдаг байв, Лондон хамгийн их арилжааны төв, дараа нь Нью-Йорк, Токио.  ## Валютын ханшийн зарлал ба хөрвөх ханшийн тооцоолол (Exchange Rate Quotations \u0026 Cross-Rate Calculations)\"},{\"id\":14,\"question\":\"Шууд квот (direct quote) ба шууд бус квот (indirect quote) хоёрын ялгаа юу вэ?\",\"answer\":\"Шууд квот нь дотоод валютыг үнийн валют, гадаад валютыг суурь валют болгодог (S_d/f). Шууд бус квот нь дотоод валютыг суурь валют болгодог (S_f/d). Эдгээр хоёр нь зөвхөн урвуу тоо (inverse/reciprocal) хоорондоо.\"},{\"id\":15,\"question\":\"Банк хоёр талт ханш (two-sided price, bid-offer) өгөхдөө \\\"bid\\\" ба \\\"offer\\\" гэдгийг хэрхэн тодорхойлдог вэ?\",\"answer\":\"Bid нь дилер суурь валютыг худалдан авахад бэлэн байгаа үнэ (бага утга), offer нь дилер суурь валютыг худалдахад бэлэн байгаа үнэ (өндөр утга). Банк бага үнээр худалдан авч, өндөр үнээр худалдах тул ямагт bid \u003c offer.\"},{\"id\":16,\"question\":\"Мэргэжлийн FX зах зээлд спот ханшийг хэдэн аравтын бутархайн нарийвчлалтайгаар ихэвчлэн зарладаг вэ, ямар онцгой тохиолдол байдаг вэ?\",\"answer\":\"Ихэнх мэргэжлийн спот ханшийг 4 аравтын бутархайгаар зарладаг. Иенийн (JPY) хувьд онцгой — үүнийг 2 аравтын бутархайгаар зарладаг, учир нь иен бусад валютуудтай харьцуулахад нэгжийн тоо хэдийнээ харьцангуй том байдаг.\"},{\"id\":17,\"question\":\"USD/EUR ханш 1.1500-аас 1.2000 болж өсвөл, евро ам.доллартай харьцуулахад хэдэн хувиар өссэн бэ, мөн ам.доллар еврогийн эсрэг ижил хувиар буурсан гэж хэлж болох уу?\",\"answer\":\"(1.2000/1.1500) − 1 = 4.35% — энэ бол еврогийн ам.доллартай харьцуулсан өсөлт (appreciation). Үгүй, тэнцүү биш: ханшийг урвуулж (EUR/USD) тооцвол (1/1.2000)/(1/1.1500) − 1 = −4.17%, учир нь урвуу тоо тэгш хэмтэй биш.\"},{\"id\":18,\"question\":\"Гурван валюттай холбоотой хоёр ханшийг ашиглан хөрвөх ханш (cross-rate) тооцоолох ерөнхий зарчим юу вэ? Жишээ үзүүл.\",\"answer\":\"Завсрын валют цуцлагдахаар ханшнуудыг үржих хэрэгтэй: CAD/USD × USD/EUR = CAD/EUR. Жишээ нь, CAD/USD = 1.3020, USD/EUR = 1.1701 бол: 1.3020 × 1.1701 = 1.5235 CAD per EUR.\"},{\"id\":19,\"question\":\"Хэрэв хөрвөх ханшийг тооцоход завсрын валют цуцлахын тулд нэг ханшийг урвуулах шаардлагатай бол яаж тооцдог вэ? Жишээ үзүүл.\",\"answer\":\"CAD/USD-ийг JPY/USD-тэй үржихдээ эхлээд CAD/USD-ийг урвуулж USD/CAD болгоно: (CAD/USD)^(-1) × JPY/USD = USD/CAD × JPY/USD = JPY/CAD. Жишээ нь, CAD/USD = 1.3020 → урвуу нь 0.7680; 0.7680 × 111.94 = 85.97 JPY per CAD.\"},{\"id\":20,\"question\":\"Гурвалсан арбитраж (triangular arbitrage) гэж юу вэ?\",\"answer\":\"Хэрэв дилерийн зарлаж буй хөрвөх ханш (cross-rate) суурь ханшнуудаас тооцоологдох онолын ханшнаас зөрвөл, арилжаачин нэг валютыг хямд үнээр худалдан авч, нөгөөгөөр үнэтэй худалддаг тул эрсдэлгүй ашиг олох боломж гарна. Ийм зөрүү (гурван валют оролцдог тул \\\"три-\\\") зах зээлд хэт их тохиолддоггүй, учир нь арилжаачин, алгоритм систем нар байнга хянадаг.\"},{\"id\":21,\"question\":\"USD/GBP квот нь ямар валютыг үнийн валют, ямар валютыг суурь валют болгодог вэ, мөн энэ нь шууд эсвэл шууд бус квот мөн болохыг хэрхэн тодорхойлох вэ?\",\"answer\":\"USD/GBP квотод USD нь үнийн валют, GBP нь суурь валют. Хэрэв квот ашиглаж буй хэрэглэгч Их Британид байгаа бол энэ нь шууд бус квот (GBP-дотоод валют нь суурь валют), харин АНУ-д байгаа хэрэглэгчид энэ нь шууд квот (USD-дотоод валют нь үнийн валют) болно — энэ нь зөвхөн байршлаас хамаарч өөрчлөгддөг.\"},{\"id\":22,\"question\":\"Квотын мэргэжлийн зах зээлийн уламжлалт зэрэглэл (hierarchy) ямар байдаг вэ — EUR, GBP, USD, AUD/NZD хоорондоо хэн суурь валют болдог вэ?\",\"answer\":\"EUR оролцсон квотод EUR нь ямагт суурь валют (жишээ нь GBP/EUR). GBP оролцсон (EUR биш) квотод GBP нь суурь валют (жишээ нь USD/GBP). USD оролцсон (GBP, EUR биш) квотод USD нь суурь валют (жишээ нь CAD/USD). Онцгой тохиолдол — AUD болон NZD нь USD-тэй хослоход суурь валют болдог (USD/AUD, USD/NZD).\"},{\"id\":23,\"question\":\"18.8590 MXN/USD спот квотыг Мексикийн харилцагчийн хувьд хэрхэн \\\"шууд квот\\\" (direct quote) гэж тодорхойлох вэ?\",\"answer\":\"Шууд квот нь дотоод валютыг үнийн валют, гадаад валютыг суурь валют болгодог. MXN/USD квотод MXN нь үнийн валют тул Мексикийн харилцагчид энэ бол шууд квот (1 ам.доллар худалдан авахад 18.8590 песо зарцуулна гэсэн утгатай).  ## Форвард ханшийн тооцоолол (Forward Calculations)\"},{\"id\":24,\"question\":\"Форвард ханшийн \\\"пойнт\\\" (forward points, pips) гэж юу вэ, мөн хэрхэн тооцдог вэ?\",\"answer\":\"Форвард ханшийн пойнт нь форвард ханш болон спот ханшийн зөрүү бөгөөд спот квотын сүүлийн аравтын оронтой холбогддог масштабаар илэрхийлэгдэнэ. Жишээ нь, USD/EUR спот = 1.15885, 1 жилийн форвард = 1.19532 бол: 1.19532 − 1.15885 = +0.03647, ×10,000 = +364.7 пойнт (иенд ×100 хэрэглэнэ).\"},{\"id\":25,\"question\":\"Форвард прем (forward premium) ба форвард дисконт (forward discount) гэдгийг хэрхэн тодорхойлдог вэ?\",\"answer\":\"Хэрэв форвард ханш спот ханшаас өндөр бол (пойнт эерэг) суурь валют форвард премтэй арилжаалагдана гэнэ. Хэрэв форвард ханш спот ханшаас бага бол (пойнт сөрөг) суурь валют форвард дисконттой арилжаалагдана гэнэ. Хэрэв суурь валют прем бол үнийн валют нь автоматаар дисконттой.\"},{\"id\":26,\"question\":\"Форвард пойнтыг спот ханштай нэгтгэн форвард ханш гаргах томьёо юу вэ? Жишээ үзүүл.\",\"answer\":\"Спот ханш + (пойнт/10,000) = форвард ханш (иенд /100). Жишээ нь, 3 сарын пойнт +80.9 бол: 1.15885 + (80.9/10,000) = 1.15885 + 0.00809 = 1.16694.\"},{\"id\":27,\"question\":\"Хамгаалагдсан хүүгийн паритетийн нөхцөл (covered interest rate parity) гэж юу вэ, мөн арбитражийн тэгшитгэлийг хэрхэн бичдэг вэ (f/d квот)?\",\"answer\":\"Энэ нь хоёр аргын (дотоод хүүтэй хөрөнгө оруулах vs гадаад руу хөрвүүлж, гадаад хүүтэй хөрөнгө оруулаад форвардаар буцаан хөрвүүлэх) эрсдэлгүй өгөөж тэнцүү байх ёстойг заасан арбитражийн харьцаа: (1 + i_d) = S_f/d(1 + i_f)(1/F_f/d).\"},{\"id\":28,\"question\":\"Дээрх арбитражийн тэгшитгэлийг форвард ханшийг олохын тулд хэрхэн өөрчлөн бичдэг вэ?\",\"answer\":\"F_f/d = S_f/d × [(1 + i_f)/(1 + i_d)]. Жишээ нь, S_f/d = 1.6535, i_d = 3.50%, i_f = 5.00% бол: F_f/d = 1.6535 × (1.0500/1.0350) = 1.6775.\"},{\"id\":29,\"question\":\"Форвард ханшийг спот ханшийн хувиар (хувийн прем/дисконт) хэрхэн илэрхийлдэг вэ?\",\"answer\":\"F_f/d / S_f/d = (1 + i_f)/(1 + i_d). Энэ нь f/d квотоор илэрхийлбэл, гадаад хүүгийн түвшин дотоодоос өндөр байвал форвард ханш спотоос прем байна гэсэн үг.\"},{\"id\":30,\"question\":\"Аль валютын хүүгийн түвшин өндөр байхад тэр валют форвард прем эсвэл дисконттой арилжаалагддаг вэ?\",\"answer\":\"Квотын хэлбэрээс үл хамааран, хүүгийн түвшин өндөр валют форвард зах зээлд ДИСКОНТтой, хүүгийн түвшин бага валют ПРЕМтэй арилжаалагддаг.\"},{\"id\":31,\"question\":\"Форвард ханшийг ирээдүйн хүлээгдэж буй спот ханш (expected future spot rate) гэж тайлбарлаж болох уу, мөн ямар томьёо гарч ирдэг вэ?\",\"answer\":\"Хэрэв F_t = S_t+1 гэж үзвэл: (S_t+1/S_t) − 1 = %ΔS_t+1 = (i_f − i_d)/(1 + i_d). Гэхдээ энэ тайлбарыг болгоомжтой хэрэглэх хэрэгтэй — түүхэн өгөгдлөөр форвард ханш ирээдүйн спот ханшийг муу таамаглагчид тооцогддог, учир нь зөрүүтэй таамаглалын хэмжээ маш өндөр.\"},{\"id\":32,\"question\":\"Хугацааны хэсэгчилсэн коэффициент τ-г оруулсан илүү ерөнхий своп пойнт (swap points) томьёо юу вэ?\",\"answer\":\"F_f/d − S_f/d = S_f/d × [(i_f − i_d)/(1 + i_d·τ)] × τ, энд τ нь хүүгийн түвшинг зарлаж буй үечлэлийн хэсэг (жишээ нь, 30 хоногийн хувьд τ = 30/360).\"},{\"id\":33,\"question\":\"Форвард пойнтын хэмжээ хугацаа (maturity) болон хүүгийн зөрүүтэй (interest rate differential) хэрхэн хамааралтай вэ?\",\"answer\":\"Форвард пойнтууд спот ханш болон хүүгийн зөрүүтэй (i_f − i_d) шууд пропорциональ, мөн форвард гэрээний хугацаатай (τ) ойролцоогоор (гэхдээ яг тэгш хэмжээгээр биш) пропорциональ байна. Хугацаа уртасвал эсвэл хүүгийн зөрүү өргөсвөл абсолют пойнтын тоо нэмэгддэг.\"},{\"id\":34,\"question\":\"Libor-ийн хадгаламжийн хувьд ашигладаг хоногийн тооллын конвенц (day count convention) юу вэ?\",\"answer\":\"Actual/360 — жилд 360 хоног байгаа гэж тооцож хүүг тооцдог, харин бодит хоногийн тоог хадгаламж байлгасан хугацаанд ашигладаг.  ## Валютын ханшийн дэглэм (Exchange Rate Regimes)\"},{\"id\":35,\"question\":\"Үзэл баримтлалын хувьд \\\"идеал валютын дэглэм\\\" (ideal currency regime) ямар гурван шинж чанартай байх ёстой вэ, мөн яагаад ийм дэглэм бодит байдал дээр байх боломжгүй вэ?\",\"answer\":\"1) Хоёр валютын хоорондын ханш итгэл үнэмшилтэй тогтсон (credibly fixed) байх; 2) бүх валют бүрэн хөрвөх боломжтой (fully convertible) байх; 3) улс орон бүр үндэсний мөнгөний бодлого бүрэн бие даан явуулах чадвартай байх. Эдгээр гурав нийцдэггүй — хэрэв ханш тогтсон бол, хөрвөх чадвартай бол, тусгаар мөнгөний бодлого явуулах боломжгүй болдог (бодлогын \\\"гурвалжин зөвшилцэл\\\" - impossible trinity).\"},{\"id\":36,\"question\":\"Тогтвортой (credibly fixed) ханш, бүрэн хөрвөх чадвартай нөхцөлд, дотоод мөнгөний бодлогыг тэлэх (expansionary) гэж оролдоход яагаад боломжгүй болдог вэ?\",\"answer\":\"Хэрэв дотоод хүүг нөгөө улсаас бага болгож бэлдвэл, тэнцвэртэй хүү сэргээгдэх хүртэл хязгаарлагдмал бус хэмжээний хөрөнгө гадагш урссах болно. Төв банк ханшаа хамгаалахын тулд гадаад валютаа зарж, дотоод валютаа худалдан авах шаардлагатай болж, мөнгөний нөөц алдагдан, мөнгөний нийлүүлэлт багасаж, дотоод хүү дахин өсөж, анхны тэлэх бодлого бүтэлгүйтдэг.\"},{\"id\":37,\"question\":\"Хөвөгч ханшийн (floating exchange rate) дэглэмд дотоод хүүгийн бууралт хэрхэн мөнгөний бодлогыг бэхжүүлдэг вэ?\",\"answer\":\"Хүү буурахад дотоод валютын татах чадвар буурч валют нь төлбөрт тодорхой хэмжээгээр хямдардаг — энэ нь дотоодын барааны эрэлтийг нэмэгдүүлнэ (экспорт өсч, импорт буурна), ийнхүү анхны хүүгийн бууралтаас гарах тэлэх үр нөлөөг бэхжүүлдэг.\"},{\"id\":38,\"question\":\"Классик алтны стандарт (classical gold standard) ямар механизмаар ажилладаг байсан бэ?\",\"answer\":\"Үнэ-мөнгөн урсгалын механизм (price-specie-flow mechanism) — худалдааны илүүдэлтэй улс алт (gold) хуримтлуулж, мөнгөний нийлүүлэлт нэмэгдэж, үнэ өсч, экспорт буурдаг; худалдааны алдагдалтай улсад алт гадагш урсаж, мөнгөний нийлүүлэлт багасч, үнэ буурч, экспорт нэмэгддэг.\"},{\"id\":39,\"question\":\"Bretton Woods систем юу байсан бэ, мөн яагаад задарсан бэ?\",\"answer\":\"Дэлхийн 2-р дайны үед Keynes болон Harry Dexter White нарын боловсруулсан, 44 улс 1944 онд баталсан тогтмол, захиран дахин зохицуулалттай (periodic realignments) ханшийн систем. 1970-аад оны эхээр хурдацтай, тогтворгүй инфляцийн нөхцөлд уг систем задрав.\"},{\"id\":40,\"question\":\"1992 оны Европын Валютын Механизм (ERM)-д фунт стерлингийн эсрэг хийгдсэн спекулятив дайралт яаж болсон бэ?\",\"answer\":\"Их Британи рецессийн үед хүүгээ бууруулахыг хүссэн бол Герман нэгдлийнхээ зардлыг санхүүжүүлэхийн тулд хүүгээ нэмэгдүүлсэн. Үүний улмаас хөрөнгө стерлингээс марк руу шилжиж, Их Британи стерлингийн ханшаа хамгаалж чадахгүй болсон тул ERM-ээс гарч, стерлингээ хямдруулахаас (девальваци хийхээс) аргагүй болсон (1992 оны 9-р сар).\"},{\"id\":41,\"question\":\"2008 оны байдлаар ОУВС (IMF) валютын дэглэмийг хэдэн ангилалд хуваасан бэ, тэдгээрийн нэрс юу вэ?\",\"answer\":\"Найм: тусдаа хууль ёсны мөнгөгүй дэглэм (долларжилт, мөнгөний холбоо), валютын зөвлөл (currency board), тогтмол паритет (fixed parity), зорилтын бүс (target zone), шилжих жишиг (crawling peg), шилжих мужтай тогтмол паритет (crawling bands), удирдлагатай хөвөлт (managed float), бие даан хөвөх ханш (independent float).\"},{\"id\":42,\"question\":\"Долларжилт (dollarization) гэж юу вэ, мөн ямар сул талтай вэ?\",\"answer\":\"Улс орон бусад орны (ихэвчлэн АНУ-ын доллар) валютыг өөрийн арилжааны хэрэгсэл, тооллын нэгж болгон хэрэглэх явдал. Улс нь гадаад валютын итгэл үнэмшлийг \\\"өмсдөг\\\" боловч тухайн гадаад валютыг гаргасан улсын зээлжих чадвар (creditworthiness) биш. Улс мөнгөний бодлого явуулах чадвараа (seigniorage орлого хамт) алддаг.\"},{\"id\":43,\"question\":\"Мөнгөний холбоо (monetary union, жишээ нь EMU)-ны гишүүн улс орнуудын мөнгөний бодлого хэрхэн тодорхойлогддог вэ?\",\"answer\":\"Гишүүн улс орон бие даасан мөнгөний бодлого явуулах боломжгүй, харин төв банк (жишээ нь Европын Төв Банк, ECB)-нд өөрсдийн төлөөллөөр нийтлэг мөнгөний бодлогыг хамтран тодорхойлдог. 2010 оны EMU улсуудын өрийн хямрал нь мөнгөний холбоо нэгэндээ зээлжих чадварыг баталгаажуулж чаддаггүйг харуулсан.\"},{\"id\":44,\"question\":\"Валютын зөвлөлийн систем (currency board system, CBS) гэж юу вэ, мөн Hong Kong SAR-ийн жишээ хэрхэн ажилладаг вэ?\",\"answer\":\"CBS нь хууль ёсны баталгаажсан, дотоод валютыг тогтсон ханшаар гадаад валютад хөрвүүлэх үүрэг бөгөөд дотоод валют нь зөвхөн гадаад нөөцийг хамарсан хэмжээгээр гаргагддаг. Hong Kong SAR нь 1983 оноос хойш USD нөөцөөр HKD/USD = 7.80 паритетыг хадгалж, HKMA дундах бүсэд спекулятив хэлбэлзлийг хязгаарладаг.\"},{\"id\":45,\"question\":\"Сеньораж (seigniorage) гэж юу вэ, мөн валютын зөвлөлийн систем долларжилттай харьцуулахад яагаад давуу талтай вэ?\",\"answer\":\"Сеньораж нь мөнгө гаргах зардалаас их орлого олох ашиг. Валютын зөвлөлийн систем доор монетарийн эрх бүхий байгууллага бага хүүтэй мөнгөн суваг (монетар суулбар) эмчилж, өндөр хүүтэй гадаад нөөцдөө ашигтай байхын хувьд сеньораж олдог; долларжилтад энэ ашиг гадаад валютыг хэвлэдэг улсад очдог.\"},{\"id\":46,\"question\":\"Энгийн тогтмол ханшийн систем (fixed parity) нь валютын зөвлөлийн системээс (CBS) яагаад тэдний найдвартай байдлаар бага юм бэ?\",\"answer\":\"Тогтмол паритет дэглэмд хууль ёсны баталгаа байдаггүй (улс паритетаа цуцалж болно) мөн гадаад нөөцийн зорилтот түвшин нь дотоод мөнгөний нийт хэмжээтэй тодорхой холбоогүй, discretionary байдаг. Паритет нь ±1% хүртэл бүстэй, мөнгөний эрх бүхий байгууллага энэ бүс дотор ханшийг хадгалахын тулд нөөцөөр оролцдог.\"},{\"id\":47,\"question\":\"Зорилтот бүс (target zone) дэглэм нь энгийн тогтмол паритетаас юугаар ялгаатай вэ?\",\"answer\":\"Зорилтот бүс нь өргөн бүстэй (±2% хүртэл) тогтмол паритет бөгөөд энэ нь мөнгөний эрх бүхий байгууллагад discretionary бодлого явуулах илүүтэй зай олгодог.\"},{\"id\":48,\"question\":\"Шилжих жишиг (crawling peg)-ийн идэвхтэй (active) болон идэвхгүй (passive) хэлбэрүүдийн ялгаа юу вэ?\",\"answer\":\"Идэвхгүй шилжих жишиг нь инфляцийн дагуу ханшийг ойр ойрхон (долоо хоногтоогоор, өдөр тутмаар) тохируулдаг (жишээ нь Бразил 1980-аад онд). Идэвхтэй шилжих жишиг нь ирэх хэд хоногийн ханшийн замыг урьдчилан зарлаж, жижиг алхмаар өөрчилж, инфляцийн хүлээлтийг удирдах зорилготой (жишээ нь Аргентин, Чили, Уругвай).\"},{\"id\":49,\"question\":\"Шилжих мужтай тогтмол паритет (fixed parity with crawling bands) дэглэмийн зорилго юу вэ?\",\"answer\":\"Эхлээд ирээдүйн инфляцийн хүлээлтийг тогтоохоор гадаад валютад паритет тогтоож, аажмаар төв паритетийн эргэн тойронд урьдчилан зарлагдсан өргөсдөг мужтай илүү уян хатан байдал нэвтрүүлж, тогтмол дэглэмээс аажмаар гарах стратеги бэлдэх боломж олгодог.\"},{\"id\":50,\"question\":\"Удирдлагатай хөвөлт (managed float, \\\"dirty floating\\\") дэглэм юу вэ?\",\"answer\":\"Улс орон тодорхой дотоод эсвэл гадаад зорилтот (худалдааны баланс, үнийн тогтвортой байдал, ажил эрхлэлт) биелэлтэд ханшийн бодлогоо тулгуурлаж, оролцох эсэхээ шийддэг — ямар нэгэн тодорхой ханшийн зорилт (level or rate of change) зарладаг нь ховор.\"},{\"id\":51,\"question\":\"Бие даан хөвөх ханш (independently floating rate) дэглэм юу вэ, мөн яагаад бодит байдал дээр \\\"цэвэр\\\" бие даан хөвөлт үгүй гэж хэлж болдог вэ?\",\"answer\":\"Ханшийг зах зээлийн хүчинд тодорхойлуулж, монетарийн эрх бүхий байгууллага тусгаар мөнгөний бодлого явуулж чаддаг дэглэм. Бодит байдал дээр төв банкууд заримдаа дэглэмийн шилжилт хийдэг — жишээ нь 1985 оны Plaza Accord, 2000 оны евро дэмжих \\\"concerted intervention\\\" зэрэг.  ## Валютын ханш, олон улсын худалдаа, хөрөнгийн урсгал (Exchange Rates, Trade Balance \u0026 Capital Flows: Elasticities \u0026 Absorption Approaches)\"},{\"id\":52,\"question\":\"Худалдааны баланс (trade balance) болон хөрөнгийн данс (capital account) хоорондын зарчмын харилцааг тодорхойл.\",\"answer\":\"Худалдааны алдагдал (баланс) яг тэнцүү хэмжээний хөрөнгийн дансны илүүдэлтэй (алдагдалтай) тэнцдэг. Худалдааны балансад нөлөөлсөн ямар ч хүчин зүйл хөрөнгийн данс дээр яг эсрэг тэмдэгтэй, тэнцүү хэмжээний нөлөө үзүүлдэг байх ёстой.\"},{\"id\":53,\"question\":\"Худалдааны баланс хэмнэлт/зарлагын макро тодорхойломжоор хэрхэн илэрхийлэгдэх вэ (X-M томьёо)?\",\"answer\":\"X – M = (S – I) + (T – G), энд X экспорт, M импорт, S хувийн хэмнэлт, I хөрөнгө оруулалт, T-G нь төрийн фискал баланс (татвар хасах зарлага). Худалдааны илүүдэл гэдэг нь улс хөрөнгө оруулалтаа санхүүжүүлэхээс илүүгээр хэмнэлттэй байна гэсэн үг.\"},{\"id\":54,\"question\":\"Валютын ханш ба худалдааны балансыг шинжлэх хоёр гол арга юу вэ (elasticities approach vs absorption approach)?\",\"answer\":\"\\\"Эластик хандлага\\\" (elasticities approach) нь дотоод/гадаад барааны харьцангуй үнийн өөрчлөлтийг хэмждэг, микроэдийн засгийн тал нь зардлын бүрэлдэхүүнийг (expenditure-switching) харуулдаг. \\\"Шингээлтийн хандлага\\\" (absorption approach) нь валютын ханшийн нийт зарлага/хэмнэлтийн шийдвэрт нөлөөлөх макро талыг авч үздэг.\"},{\"id\":55,\"question\":\"Үнийн эластикизм (price elasticity of demand) гэдгийг ямар томьёогоор тодорхойлдог вэ?\",\"answer\":\"ε = −(%ΔQ)/(%ΔP). ε \u003e 1 бол эрэлт \\\"эластик\\\" (elastic), ε \u003c 1 бол \\\"инэластик\\\" (inelastic). Зарлага %ΔR = (1−ε)%ΔP учраас, эластик эрэлтэд үнийн өсөлт зарлагыг бууруулдаг, инэластик эрэлтэд зарлагыг нэмэгдүүлдэг.\"},{\"id\":56,\"question\":\"Ерөнхийлсөн Марашалл–Лернерийн нөхцөл (generalized Marshall-Lerner condition) юу вэ, мөн энэ нь юу заадаг вэ?\",\"answer\":\"ωXεX + ωM(εM – 1) \u003e 0, энд ωX, ωM нь нийт худалдаанд (импорт+экспорт) экспорт болон импортын эзлэх хувь, εX, εM нь экспорт болон импортын үнийн эластикизм. Хэрэв энэ нөхцөл хангагддаг бол дотоод валютын девальвация/хямдралт нь худалдааны балансыг илүүдэл талруу шилжүүлдэг.\"},{\"id\":57,\"question\":\"Худалдаа анхнаа тэнцвэртэй байх тохиолдолд (ωX = ωM) Марашалл–Лернерийн ерөнхий нөхцөл ямар \\\"классик\\\" хэлбэртэй болдог вэ?\",\"answer\":\"εX + εM \u003e 1 — энэ бол классик Марашалл–Лернерийн нөхцөл. Валютын хямдралт нь экспорт ба импортын эластикизмийн нийлбэр нэгээс их байх үед худалдааны балансыг сайжруулдаг.\"},{\"id\":58,\"question\":\"Бараа/үйлчилгээний эрэлтийн эластикизмд нөлөөлдөг дөрвөн хүчин зүйл юу вэ?\",\"answer\":\"1) ойрын орлуулагч бараа (close substitutes) байгаа эсэх; 2) зах зээлийн бүтэц (монополь эсвэл чиглэсэн конкуренц); 3) хэрэглэгчийн төсөвт эзлэх хувь (share of budget); 4) бараа/үйлчилгээний шинж чанар (жишээ нь зайлшгүй хэрэгцээ (necessity) эсвэл тансаг зэрэглэлийн бараа (luxury)).\"},{\"id\":59,\"question\":\"Орлуулах нөлөөлөл (substitution effect) ба орлогын нөлөөлөл (income effect) хоёрын ялгаа юу вэ?\",\"answer\":\"Орлуулах нөлөөлөл нь үнэ өсч/буурахад эрэлт ижил ангиллын бусад бараанд шилждэг зардлын бүтцийн өөрчлөлт. Орлогын нөлөөлөл нь үнийн өөрчлөлт бодит худалдан авах чадварт шууд нөлөөлж, дотоод орлогод нөлөөлсөн шиг эрэлтийн хэмжээг өөрчилдэг (тансаг зэрэглэлийн барааны орлогын нөлөөлөл их, зайлшгүй хэрэгцээтэй барааны бага).\"},{\"id\":60,\"question\":\"Марашалл–Лернерийн нөхцөл хангагдсан ч \\\"J-муруй\\\" (J-curve) эффект яагаад тохиолдож болдог вэ?\",\"answer\":\"Хэрэглэгч/экспортлогчийн захиалга-хүргэлтийн хугацааны хоцрогдол (delivery lags)-ийн улмаас, хямдралтын дараа эхлээд импортын зардал (өмнө тохиролцсон гэрээгээр) нэмэгддэг тул худалдааны баланс эхлээд МУУДДАГ, дараа нь (эрэлт шинэ үнэнд дасан зохицож) АЖИЛДАГ — бас богино хугацааны эластикизм Марашалл–Лернерийн нөхцөлийг хангадаггүй, харин урт хугацааны эластикизм хангадаг тохиолдолд ч гарч болно.\"},{\"id\":61,\"question\":\"Шингээлтийн хандлага (absorption approach) худалдааны балансыг хэрхэн тодорхойлдог вэ?\",\"answer\":\"Худалдааны баланс = орлого (GDP) − дотоод зарлага (absorption). Валютын хямдралт нь орлогыг зарлагаас илүү өсгөх (эсвэл хэмнэлтийг хөрөнгө оруулалтаас илүү өсгөх) замаар худалдааны балансыг илүүдэл тал руу шилжүүлж болно.\"},{\"id\":62,\"question\":\"Эдийн засаг бүрэн ажил эрхлэлттэй (full employment) байх тохиолдолд, валютын хямдралт яагаад худалдааны балансыг улам сайжруулж чаддаггүй вэ?\",\"answer\":\"Хэрэв дотоод зарлага буураагүй бол хямдралт нь дотоод үнийн түвшинг дээшлүүлж (upward pressure), ханшийн өөрчлөлтийн стимулив нөлөөг арилгаж, худалдааны баланс анхны түвшиндээ буцаж ирдэг. Зарлагыг бууруулах гол механизм нь \\\"баялгийн нөлөөлөл\\\" (wealth effect) — валют нь сулхан болоход дотоод валютаар илэрхийлсэн хөрөнгийн худалдан авах чадвар буурна, өрх гэр зарлагаа бууруулж, хэмнэлтээ нэмнэ.\"},{\"id\":63,\"question\":\"Шингээлтийн хандлагаар валютын хямдралт нь худалдааны балансыг хэрхэн, ямар нөхцөлд үргэлжилсэн шийдвэрлэх боломжтой вэ?\",\"answer\":\"Эдийн засагт илүүдэл чадавхи (excess capacity) байгаа тохиолдолд, хямдралт нь эрэлтийг дотоодын бараа/үйлчилгээ рүү шилжүүлж орлого/гаралтыг нэмэгдүүлнэ; орлогын зарим хэсэг хэмнэгддэг тул орлого зарлагаас их болж худалдааны баланс сайжирна. Гэхдээ зайлшгүй шалтгаан (chronic imbalance) засахын тулд зарлага/хэмнэлтийн зан байдлыг бодитойгоор өөрчлөх (фискал бодлого, бодит хүүгийн өсөлт зэрэг) шаардлагатай.\"}]}]}]\n"])</script><script>self.__next_f.push([1,"12:I[75181,[\"/learning-v18/_next/sta
