/learning-v18/_next/static/chunks/03~mczye1-91u.js\",\"/learning-v18/_next/static/chunks/0_it-5lolw3n7.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L11\",null,{\"subject\":\"Эдийн засаг\",\"topics\":[{\"id\":\"demand-and-supply\",\"title\":\"Эрэлт, нийлүүлэлтийн шинжилгээ\",\"cards\":[{\"id\":1,\"question\":\"Эрэлтийн функц (demand function) гэж юу вэ? Жишээ тэгшитгэл Qxd = f(Px, I, Py)-ийг тайлбарла.\",\"answer\":\"Эрэлтийн функц нь X барааны эрэлтийн тоо хэмжээ (Qxd)-ийг тухайн барааны өөрийн үнэ (Px), хэрэглэгчийн орлого (I), бусад барааны үнэ (Py) гэх мэт хэд хэдэн хувьсагчаас хамааруулан илэрхийлдэг хамаарал юм: Qxd = f(Px, I, Py). Энэ нь X барааны эрэлтийн тоо хэмжээ нь дээрх хувьсагчуудаас хамаарна гэсэн үг.\"},{\"id\":2,\"question\":\"Эрэлтийн хууль (law of demand) гэж юу вэ?\",\"answer\":\"Барааны үнэ өсөхөд худалдан авагчид тухайн барааг бага хэмжээгээр худалдан авч, үнэ буурахад илүү их хэмжээгээр худалдан авдаг гэсэн нийтээр хүлээн зөвшөөрөгдсөн зарчим юм. Энэ нь эрэлтийн муруйг сөрөг налуутай болгодог.\"},{\"id\":3,\"question\":\"Бензиний эрэлтийн шугаман функц Qxd = 84.5 – 6.39Px + 0.25I – 2Py дотор коэффициентуудын тэмдэг (сөрөг/эерэг) юу илэрхийлдэг вэ?\",\"answer\":\"Px (өөрийн үнэ)-ийн коэффициент −6.39 сөрөг тэмдэгтэй тул үнэ 1 нэгжээр өсөхөд эрэлтийн тоо хэмжээ буурна (эрэлтийн хууль). Орлого (I)-ийн коэффициент +0.25 эерэг тул орлого өсөхөд эрэлт ч өснө (хэвийн бараа). Автомашины үнэ (Py)-ийн коэффициент −2 сөрөг тул бензин, автомашиныг харилцан нөхөгч (complement) бараа гэж үзнэ.\"},{\"id\":4,\"question\":\"\\\"Өөрийн үнэ\\\" (own price) гэдэг нэр томьёог яагаад тусгайлан ашигладаг вэ?\",\"answer\":\"Эдийн засагчид \\\"өөрийн үнэ\\\" гэж барааны (X) өөрийнх нь үнийг тодотгон хэлж, бусад барааны (Y) үнээс ялгахын тулд ашигладаг. Энэ нь эрэлтийн функц дотор өөрийн үнэ болон бусад барааны үнийн нөлөөг ялгаж ойлгоход тусалдаг.\"},{\"id\":5,\"question\":\"Урвуу эрэлтийн функц (inverse demand function) гэж юу вэ? Жишээгээр тайлбарла.\",\"answer\":\"Урвуу эрэлтийн функц нь үнийг эрэлтийн тоо хэмжээний функц байдлаар илэрхийлнэ: Px = 8.92 − 0.156Qxd. Энэ функцийн график нь эрэлтийн муруй (demand curve) бөгөөд Qx нь 57-оос их байж болохгүй (эс тэгвээс үнэ сөрөг болно).\"},{\"id\":6,\"question\":\"Эрэлтийн муруйн налуу (slope of the demand curve)-г хэрхэн тооцдог вэ?\",\"answer\":\"Эрэлтийн муруйн налуу нь үнийн өөрчлөлт (ΔP)-ийг тоо хэмжээний өөрчлөлт (ΔQ)-д харьцуулсан харьцаа: ΔP/ΔQ. Жишээ эрэлтийн функцэд (Qxd = 57 – 6.39Px) налуу нь 1/(−6.39) = −0.156.\"},{\"id\":7,\"question\":\"Уян хатан чанар (elasticity) гэдгийг ерөнхийд нь хэрхэн тодорхойлдог вэ, яагаад хэрэгтэй вэ?\",\"answer\":\"Уян хатан чанар нь нэг хувьсагч нөгөө хувьсагчийн өөрчлөлтөд хэр мэдрэмтгий байдгийг хувийн өөрчлөлтүүдийн харьцаагаар илэрхийлнэ: %Δy/%Δx. Энэ арга хэмжих нэгжээс (литр/галлон, доллар/евро гэх мэт) хамааралгүй тул өөр өөр нэгжтэй харьцуулалт хийхэд тохиромжтой.  ## Эрэлтийн уян хатан чанарын төрлүүд (Types of Elasticity of Demand)\"},{\"id\":8,\"question\":\"Өөрийн үнийн уян хатан чанар (own-price elasticity of demand, Ep) ямар томъёогоор тодорхойлогддог вэ (Тэгшитгэл 5)?\",\"answer\":\"Edp_x = (%ΔQxd)/(%ΔPx) — энэ нь эрэлтийн тоо хэмжээний хувийн өөрчлөлтийг үнийн хувийн өөрчлөлтөд харьцуулсан харьцаа.\"},{\"id\":9,\"question\":\"Тэгшитгэл 5-ыг алгебрийн аргаар дэлгэж бичвэл ямар хэлбэртэй болох вэ (Тэгшитгэл 6)?\",\"answer\":\"Edp_x = (ΔQxd/ΔPx) × (Px/Qxd). Энд (ΔQxd/ΔPx) нь шугаман эрэлтийн функцийн хувьд налуугийн коэффициенттэй тэнцүү, харин (Px/Qxd) нь эрэлтийн муруй дээрх тухайн цэгээс хамаарна.\"},{\"id\":10,\"question\":\"Бензиний жишээн дээр Px = €1.48 үед Qxd = 47.54 бол уян хатан чанар хэд байх вэ, хэрхэн тайлбарлах вэ?\",\"answer\":\"E = −6.39 × (1.48/47.54) = −0.2. Энэ нь үнэ 1%-иар өсөхөд эрэлтийн тоо хэмжээ ердөө 0.2%-иар буурна гэсэн үг бөгөөд |E| \u003c 1 тул эрэлт уян хатан бус (inelastic) гэж тооцно.\"},{\"id\":11,\"question\":\"Бензиний үнэ €5 болоход (Qxd = 25.05) уян хатан чанар хэд болох вэ — уян хатан уу, уян хатан биш үү?\",\"answer\":\"E = −6.39 × (5/25.05) = −1.28. |E| \u003e 1 тул энэ үед эрэлт уян хатан (elastic) болно.\"},{\"id\":12,\"question\":\"Эрэлт уян хатан (elastic), уян хатан бус (inelastic), нэгдмэл уян хатан (unit/unitary elastic) гэж ямар шалгуураар ялгадаг вэ?\",\"answer\":\"Уян хатан чанарын коэффициентийн абсолют утга (|E|) 1-ээс бага бол \\\"уян хатан бус\\\", 1-ээс их бол \\\"уян хатан\\\", харин яг −1-тэй тэнцүү бол \\\"нэгдмэл уян хатан\\\" гэнэ.\"},{\"id\":13,\"question\":\"Өөрийн үнийн уян хатан чанарын тэмдэг ямар байдаг вэ, яагаад?\",\"answer\":\"Эрэлтийн хууль үйлчилж байгаа тохиолдолд өөрийн үнийн уян хатан чанар бараг үргэлж сөрөг байна, учир нь үнэ өсөхөд эрэлтийн тоо хэмжээ буурдаг (сөрөг хамаарал).\"},{\"id\":14,\"question\":\"Шугаман эрэлтийн муруй дээр уян хатан чанар хэрхэн өөрчлөгддөг вэ (дундаж цэгийн дүрэм)?\",\"answer\":\"Шугаман, сөрөг налуутай эрэлтийн муруйн дундаж цэгээс дээш (өндөр үнэ, бага тоо хэмжээ) эрэлт уян хатан, дундаж цэгээс доош (бага үнэ, их тоо хэмжээ) эрэлт уян хатан бус, дундаж цэг дээр нэгдмэл уян хатан байна. Учир нь ΔQ/ΔP тогтмол хэдий ч P/Q харьцаа эрэлтийн муруй дээрх байрлалаас хамааран өөрчлөгддөг.\"},{\"id\":15,\"question\":\"Бүрэн уян хатан бус эрэлт (perfectly inelastic demand) гэж юу вэ, графикаар хэрхэн харагддаг вэ?\",\"answer\":\"Үнийн түвшин ямар ч байсан эрэлтийн тоо хэмжээ өөрчлөгдөхгүй байхыг бүрэн уян хатан бус эрэлт гэнэ (E = 0). Графикт энэ нь босоо эрэлтийн муруй байдлаар илэрхийлэгдэнэ.\"},{\"id\":16,\"question\":\"Бүрэн уян хатан эрэлт (perfectly elastic demand) гэж юу вэ, ямар тохиолдолд харагддаг вэ?\",\"answer\":\"Эрэлтийн муруй хэвтээ, өөрөөр хэлбэл үнэ бага зэрэг ч өсвөл эрэлт тэгд хүрдэг, тухайн түвшинд хязгаарлагдмал бус хэмжээгээр худалдан авч болох тохиолдлыг бүрэн уян хатан эрэлт гэнэ (E = ∞). Энэ нь төгс өрсөлдөөнтэй (perfect competition) зах зээл дэх нэг тодорхой зарагчийн эрэлтийн муруйг тодорхойлдог жишээ юм (улаан буудайн зах зээл).\"},{\"id\":17,\"question\":\"Барааны үнийн уян хатан чанарт нөлөөлдөг гол хүчин зүйлс юу вэ?\",\"answer\":\"Ойрын орлуулагч барааны тоо (олон бол илүү уян хатан), нийт төсөвт эзлэх хувь хэмжээ (их бол илүү уян хатан), худалдан авагчдад үнийн өөрчлөлтөд дасан зохицох хугацааны урт (урт хугацаанд илүү уян хатан), мөн бараа шаардлагатай (non-discretionary) эсэх, шаардлагагүй (discretionary) эсэх нь тус тус нөлөөлнэ.\"},{\"id\":18,\"question\":\"Уян хатан чанар, нийт зарлага (total expenditure) хоёрын хамаарал ямар вэ?\",\"answer\":\"Эрэлт уян хатан үед үнэ, нийт зарлага эсрэг чиглэлд хөдөлнө (үнэ буурахад нийт зарлага өснө). Эрэлт уян хатан бус үед үнэ, нийт зарлага нэг чиглэлд хөдөлнө (үнэ буурахад нийт зарлага ч буурна). Нэгдмэл уян хатан цэг дээр нийт зарлага хамгийн их байна.\"},{\"id\":19,\"question\":\"Хэрэв зарагчийн эрэлт одоогийн үнэд уян хатан бус байвал үнээ нэмэгдүүлэх нь яагаад ашиг нэмэгдүүлэх вэ?\",\"answer\":\"Уян хатан бус эрэлттэй үед үнэ өсөхөд нийт орлого (revenue) өсдөг, нэгэн зэрэг борлуулалтын тоо хэмжээ буурсанаар нийт зардал буурдаг. Орлого өсөж, зардал буурах нь хоёулаа ашгийг нэмэгдүүлдэг тул ашиг горилогч нэг барааны зарагч эрэлт уян хатан болох хүртэл үнээ үргэлжлүүлэн нэмэгдүүлнэ.\"},{\"id\":20,\"question\":\"Орлогын уян хатан чанар (income elasticity of demand, EId) ямар томъёогоор тодорхойлогддог вэ (Тэгшитгэл 7)?\",\"answer\":\"EId = (%ΔQxd)/(%ΔI) — эрэлтийн тоо хэмжээний хувийн өөрчлөлтийг орлогын хувийн өөрчлөлтөд харьцуулсан харьцаа, бусад хүчин зүйлийг тогтмол гэж үзнэ.\"},{\"id\":21,\"question\":\"Орлогын уян хатан чанарын тэмдгээс хамааран барааг \\\"хэвийн\\\" (normal) эсвэл \\\"доод зэргийн\\\" (inferior) гэж хэрхэн ангилдаг вэ?\",\"answer\":\"Орлогын уян хатан чанар эерэг (EId \u003e 0) бол \\\"хэвийн бараа\\\" гэнэ — орлого өсөхөд эрэлт ч өснө. Орлогын уян хатан чанар сөрөг (EId \u003c 0) бол \\\"доод зэргийн бараа\\\" гэнэ — орлого өсөхөд эрэлт буурна (жишээ нь: тутарга, төмс, хямд мах).\"},{\"id\":22,\"question\":\"Орлого өөрчлөгдөхөд эрэлтийн муруй хэрхэн шилждэг вэ?\",\"answer\":\"Хэвийн барааны хувьд орлого өсөхөд эрэлтийн муруй баруун дээш шилждэг. Доод зэргийн барааны хувьд орлого өсөхөд эрэлтийн муруй зүүн доош шилждэг.\"},{\"id\":23,\"question\":\"Зах зээлийн бензиний жишээн дээр (Тэгшитгэл 11) орлогын уян хатан чанар 0.26 гарсныг хэрхэн тайлбарлах вэ?\",\"answer\":\"EId = (250)(50/47,542.8) = 0.26. Орлого 1%-иар өсөхөд бензиний эрэлт 0.26%-иар өснө. Эерэг тэмдэгтэй тул бензиныг хэвийн бараа гэж үзнэ (хэдий ч утга нь бага).\"},{\"id\":24,\"question\":\"Хөрвөх үнийн уян хатан чанар (cross-price elasticity of demand) ямар томъёогоор тодорхойлогддог вэ (Тэгшитгэл 8)?\",\"answer\":\"Edp_y = (%ΔQxd)/(%ΔPy) — X барааны эрэлтийн хувийн өөрчлөлтийг Y барааны үнийн хувийн өөрчлөлтөд харьцуулсан харьцаа.\"},{\"id\":25,\"question\":\"Хөрвөх үнийн уян хатан чанар эерэг байвал хоёр бараа ямар харилцаатай байх вэ?\",\"answer\":\"Хэрэв Edp_y \u003e 0 бол X, Y хоёр барааг орлуулагч бараа (substitutes) гэнэ — Y-ийн үнэ өсөхөд X-ийн эрэлт өснө (жишээ: пивоны хоёр брэнд).\"},{\"id\":26,\"question\":\"Хөрвөх үнийн уян хатан чанар сөрөг байвал хоёр бараа ямар харилцаатай байх вэ?\",\"answer\":\"Хэрэв Edp_y \u003c 0 бол X, Y хоёр барааг харилцан нөхөгч бараа (complements) гэнэ — ихэвчлэн хамтдаа хэрэглэгддэг бараанууд (жишээ: бензин ба автомашин, байшин ба тавилга).\"},{\"id\":27,\"question\":\"Бензин-автомашины жишээн дээр (Тэгшитгэл 12) хөрвөх уян хатан чанар −0.84 гэсэн нь юу гэсэн үг вэ?\",\"answer\":\"Edp_y = (−2000)(20/47,542.8) = −0.84. Автомашины үнэ 1%-иар өсөхөд бензиний эрэлт 0.84%-иар буурна. Сөрөг тэмдэгтэй тул бензин, автомашиныг харилцан нөхөгч бараа гэж үзнэ, гэхдээ холбоо сул гэж дүгнэнэ.\"},{\"id\":28,\"question\":\"Хувь хүний эрэлтийн функцээс зах зээлийн эрэлтийн функцийг хэрхэн гаргадаг вэ?\",\"answer\":\"Зах зээлийн эрэлтийн функц нь нэг зах зээл дэх бүх хэрэглэгчдийн эрэлтийн функцийг нэгтгэж (нэмж) гаргадаг. Хэрэв 1,000 адил эрэлтийн функцтэй хэрэглэгч байвал зах зээлийн функц нь нэг хэрэглэгчийн функцийг 1,000-аар үржүүлсэнтэй тэнцүү байна: Qxd = 84,500 – 6,390Px + 250I – 2,000Py (Тэгшитгэл 9).  ## Орлуулалт ба орлогын нөлөө (Substitution and Income Effects)\"},{\"id\":29,\"question\":\"Барааны үнэ буурахад хэрэглэгч түүнээс илүү их худалдан авдаг болох хоёр шалтгаан юу вэ?\",\"answer\":\"Орлуулалтын нөлөө (substitution effect) болон орлогын нөлөө (income effect) хэмээх хоёр шалтгаан байдаг. Эдгээр хоёр хүчин зүйл хамтдаа эрэлтийн хуулийг (сөрөг налуутай эрэлтийн муруйг) бий болгодог.\"},{\"id\":30,\"question\":\"Орлуулалтын нөлөө (substitution effect) гэж юу вэ?\",\"answer\":\"Барааны үнэ буурахад тухайн бараа бусад барааны (орлуулагчийн) харьцангуй хямд болдог тул хэрэглэгч түүнийг бусад барааны оронд илүү их худалдан авдаг хандлага юм. Жишээ нь: бензиний үнэ буурахад олон нийтийн тээврийн оронд машинаар явах нь харьцангуй хямд болно.\"},{\"id\":31,\"question\":\"Орлогын нөлөө (income effect) болон бодит орлого (real income) гэж юу вэ?\",\"answer\":\"Барааны үнэ буурахад мөнгөн орлого өөрчлөгдөхгүй байсан ч худалдан авах чадвар (бодит орлого) нэмэгддэг. Ихэнх барааны хувьд бодит орлого өсөхөд хэрэглэгчид тухайн барааг илүү их худалдан авдаг — энэ нь орлогын нөлөө.\"},{\"id\":32,\"question\":\"Үхрийн махны үнэ өсөхөд орлуулалт, орлогын нөлөө хэрхэн нэгдэж ажилладаг вэ?\",\"answer\":\"Үхрийн махны үнэ өсөхөд орлуулалтын нөлөөгөөр хэрэглэгч тахианы мах зэрэг хямд орлуулагч руу шилждэг. Үүний зэрэгцээ үнийн өсөлт бодит орлогыг бууруулдаг тул, хэрэв мах хэвийн бараа бол орлогын нөлөө ч мөн махны худалдан авалтыг бууруулдаг — хоёр нөлөө нэг чиглэлд ажиллана.\"},{\"id\":33,\"question\":\"Цэвэр орлуулалтын нөлөөг (pure substitution effect) хэрхэн тусгаарлаж тооцдог вэ (кофены жишээ)?\",\"answer\":\"Үнийн бууралтаас шалтгаалсан орлогын өсөлтийг \\\"нөхөн\\\" авч, хэрэглэгчийг хуучин үнэ дэх түвшинтэйгээ яг адил байдалтай (indifferent) болгосноор орлогын нөлөөг арилгаж, цэвэр орлуулалтын нөлөөг тусгаарладаг. Энэ тохиолдолд хэрэглэгч үргэлж харьцангуй хямд болсон бараагаа илүү их худалдан авдаг.\"},{\"id\":34,\"question\":\"Моника кино театрын жишээнд (Жишээ 2) үнэ $8-аас $4 болоход нийт нэмэгдсэн 6 киноны хэдэн нь орлуулалт, хэдэн нь орлогын нөлөө вэ?\",\"answer\":\"Моника клубын гишүүнчлэлийн төлбөрийг өөрөө төлөхдөө (орлогын нөлөөг арилгасан тохиолдол) 6-аас 8 кино болж 2 нэмэгдсэн нь орлуулалтын нөлөө. Найзаасаа гишүүнчлэлийг бэлгээр авсан үед (орлогын нөлөөг арилгаагүй) 8-аас 12 болж дахин 4 нэмэгдсэн нь орлогын нөлөө. Нийт 6 киног нэмэгдсэнээс 2 нь орлуулалт, 4 нь орлогын нөлөө (Моникагийн хувьд кино хэвийн бараа).  ## Хэвийн ба доод зэргийн бараа (Normal and Inferior Goods)\"},{\"id\":35,\"question\":\"Хэвийн барааны (normal good) хувьд орлуулалт, орлогын нөлөө хэрхэн харилцан хамааралтай вэ?\",\"answer\":\"Хэвийн барааны хувьд үнэ буурахад орлуулалтын нөлөө (харьцангуй хямд болсон тул илүү их худалдан авна) болон орлогын нөлөө (бодит орлого өссөнөөр илүү их худалдан авна) хоёулаа нэг чиглэлд, өөрөөр хэлбэл бие биенээ бэхжүүлж ажилладаг. Үр дүнд нь эрэлтийн муруй сөрөг налуутай байна.\"},{\"id\":36,\"question\":\"Доод зэргийн барааны (inferior good) хувьд орлуулалт, орлогын нөлөө хэрхэн харилцан хамааралтай вэ?\",\"answer\":\"Доод зэргийн барааны хувьд үнэ буурахад орлуулалтын нөлөө илүү их худалдан авалт руу хөтөлдөг, харин орлогын нөлөө эсрэгээр бага худалдан авалт руу хөтөлдөг — хоёр нөлөө эсрэг чиглэлд ажиллаж, орлогын нөлөө орлуулалтын нөлөөг зөөлрүүлдэг (mitigate).\"},{\"id\":37,\"question\":\"Нэг бараа зарим хэрэглэгчдэд хэвийн, зарим хэрэглэгчдэд доод зэргийн бараа байж болох уу? Жишээ өг.\",\"answer\":\"Тийм ээ. Жишээ нь түргэн хоол (fast-food): орлого багатай хэрэглэгчдийн хувьд орлого өсөхөд түргэн хоолны хэрэглээ нэмэгддэг (хэвийн бараа), харин өндөр орлоготой хэрэглэгчдийн хувьд орлого өсөхөд тэд дэгжин ресторан руу шилждэг тул түргэн хоолны хэрэглээ буурдаг (доод зэргийн бараа).\"},{\"id\":38,\"question\":\"Гиффэний бараа (Giffen good) гэж юу вэ?\",\"answer\":\"Орлогын нөлөө нь орлуулалтын нөлөөг давж, маш хүчтэй сөрөг байх үед үнэ өсөхөд эрэлтийн тоо хэмжээ ч нэмэгддэг онцгой тохиолдлыг Гиффэний бараа гэнэ (Robert Giffen-ий нэрэмжит). Жишээ: туйлын ядуу орчинд амьдардаг хүмүүсийн будаа хэрэглэлт — будаа тэдний орлогын маш их хувийг эзлэх доод зэргийн бараа тул үнийн бууралт эрэлтэнд эсрэгээр нөлөөлж болно.\"},{\"id\":39,\"question\":\"Веблэний бараа (Veblen good) гэж юу вэ?\",\"answer\":\"Thorstein Veblen-ий \\\"бусдад харуулах зориулалттай хэрэглээ\\\" (conspicuous consumption) үзэл баримтлалд үндэслэн, өндөр үнэ нь өөрөө тухайн барааны нэр хүнд, статусын үнэ цэнийг нэмэгдүүлдэг барааг Веблэний бараа гэнэ (жишээ: зэрэг үнэтэй автомашин, үнэт эдлэл). Веблэний бараа доод зэргийн бараа биш бөгөөд үнэ өсөхөд эрэлт нэмэгддэг.\"},{\"id\":40,\"question\":\"Эрэлтийн хуулийн ямар хоёр онцгой зөрчил (exceptions to the law of demand) байдаг вэ?\",\"answer\":\"Гиффэний бараа (Giffen goods) ба Веблэний бараа (Veblen goods) — хоёулаа эрэлтийн муруйг эерэг налуутай болгодог ховор тохиолдлууд.\"},{\"id\":41,\"question\":\"Хэвийн ба доод зэргийн барааны хувьд үнийн бууралтын орлуулалт, орлогын нөлөөг нэгтгэн харуулах хүснэгт (Exhibit 6) ямар дүгнэлт өгдөг вэ?\",\"answer\":\"Хэвийн бараа: орлуулалтын нөлөө — илүү их худалдан авна (харьцангуй хямд тул); орлогын нөлөө — илүү их худалдан авна (худалдан авах чадвар нэмэгдсэн тул). Доод зэргийн бараа: орлуулалтын нөлөө — илүү их худалдан авна; орлогын нөлөө — бага худалдан авна (бодит орлого өссөнөөр илүүд үзсэн орлуулагч руу шилждэг).  ## Дээд хязгаарын өгөөж ба бүтээмж (Marginal Returns and Productivity)\"},{\"id\":42,\"question\":\"Нэмэгдэх дээд хязгаарын өгөөж (increasing marginal returns) гэж юу вэ?\",\"answer\":\"Нэг хүчин зүйлийн (жишээ нь хөдөлмөр) нэгж нэмэгдэх тусам дээд хязгаарын бүтээгдэхүүн (marginal product) нэмэгддэг үзэгдэл юм. Энэ нь ихэвчлэн мэргэшил, хөдөлмөрийн хуваарилалтаас (specialization, division of labor) үүсдэг.\"},{\"id\":43,\"question\":\"Буурах дээд хязгаарын өгөөжийн хууль (law of diminishing marginal returns) гэж юу вэ?\",\"answer\":\"Тогтмол (fixed) хөрөнгийн дээр хөдөлмөрийн (variable) оруулалтыг улам нэмэгдүүлэх тусам, тодорхой цэгээс хойш нэг нэгж нэмэлт хөдөлмөрөөс ирэх дээд хязгаарын бүтээгдэхүүн буурдаг хууль. Жишээ: автомашин үйлдвэрлэх үйлдвэр хүчин чадлаараа дээд цэгтэй үед нэмэлт ажилчин нэмэгдсэн ч гарц нэмэгдэхгүй.\"},{\"id\":44,\"question\":\"Нийт бүтээгдэхүүн (total product, Q) гэж юу вэ?\",\"answer\":\"Тодорхой хугацаанд бүх оруулалтаас гаргасан нийт үйлдвэрлэлийн хэмжээ. Энэ үзүүлэлт фирмийн үйлдвэрлэлийн хэмжээний тухай мэдээлэл өгдөг хэдий ч түүний үр ашгийг (бүтээмж) харуулахгүй.\"},{\"id\":45,\"question\":\"Дундаж бүтээгдэхүүн (average product of labor, APL) ямар томъёогоор тодорхойлогддог вэ?\",\"answer\":\"APL = Q/L — нийт бүтээгдэхүүнийг хөдөлмөрийн нэгжийн тоонд (жишээ нь ажлын цагт) хуваасан харьцаа. Энэ нь хөдөлмөрийн дундаж бүтээмжийг хэмждэг.\"},{\"id\":46,\"question\":\"Дээд хязгаарын бүтээгдэхүүн (marginal product of labor, MPL) ямар томъёогоор тодорхойлогддог вэ?\",\"answer\":\"MPL = ΔQ/ΔL — бусад оруулалтыг тогтмол байлгаад, хөдөлмөрийн нэг нэмэлт нэгжээс ирэх нийт бүтээгдэхүүний өөрчлөлт.\"},{\"id\":47,\"question\":\"Дээд хязгаарын бүтээгдэхүүн (MPL), дундаж бүтээгдэхүүн (APL) хоёрын хоорондын хамаарал ямар вэ?\",\"answer\":\"MPL \u003e APL үед APL өсч байна; MPL \u003c APL үед APL буурч байна. Экзибит 9-д жишээлбэл, 2 дахь хөдөлмөрийн цагт MPL (110) нь APL (105)-аас их тул APL өсч байгаа, харин 5 дахь цагт MPL (40) APL (80)-аас бага тул APL буурсан байна.\"},{\"id\":48,\"question\":\"Богино хугацаанд дээд хязгаарын зардал (short-run marginal cost, SMC) болон дээд хязгаарын бүтээгдэхүүн (MPL)-ийн хоорондын хамаарлыг ямар томъёогоор илэрхийлдэг вэ?\",\"answer\":\"SMC = w/MPL, энд w нь цалингийн хувь хэмжээ (wage rate). Хөдөлмөрийн бүтээмж (MPL) өсөхөд SMC буурна; MPL буурахад SMC өснө.\"},{\"id\":49,\"question\":\"Дундаж хувьсах зардал (average variable cost, AVC)-ыг дундаж бүтээгдэхүүн (APL)-тэй холбосон томъёо ямар вэ?\",\"answer\":\"AVC = w/APL. Цалин (w) өсөхөд AVC өснө; хөдөлмөрийн дундаж бүтээмж (APL) өсөхөд AVC буурна.\"},{\"id\":50,\"question\":\"Бүтээмжийг нэмэгдүүлэх нь фирм, ажилчин, хувьцаа эзэмшигчдэд ямар ашиг тус өгдөг вэ?\",\"answer\":\"(1) Бизнесийн зардал буурч ашиг нэмэгддэг; (2) ашгийн өсөлтөөс хувьцааны үнэ, хувьцаа эзэмшигчдийн баялаг нэмэгддэг; (3) ажилчдын шан харамж нэмэгдэж, цаашид бүтээмж нэмэгдүүлэх урам зориг өгдөг.  ## Ашиг тэнцвэржих цэг ба үйл ажиллагаа зогсоох шинжилгээ (Breakeven and Shutdown Analysis)\"},{\"id\":51,\"question\":\"Эдийн засгийн ашиг (economic profit) ба нягтлан бодох бүртгэлийн ашиг (accounting profit)-ийн ялгаа юу вэ?\",\"answer\":\"Эдийн засгийн ашиг = нийт орлого (TR) − нийт эдийн засгийн зардал (бүртгэлийн зардал + далд боломжийн зардал). Нягтлан бодох бүртгэлийн ашиг = TR − нийт бүртгэлийн зардал (зөвхөн тодорхой зарлагаар хэмжсэн). TR хоёуланд нь адил: TR = (P)(Q).\"},{\"id\":52,\"question\":\"Боломжийн зардал (opportunity cost) болон живсэн зардал (sunk cost) гэж юу вэ?\",\"answer\":\"Боломжийн зардал нь тодорхой шийдвэр гаргахдаа орхигдож буй, хамгийн сайн дараагийн хувилбарын үр ашиг юм. Живсэн зардал нь өмнө гарсан, одоо өөрчлөх боломжгүй зардал (жишээ нь өмнө худалдан авсан тоног төхөөрөмжийн түүхэн өртөг) бөгөөд ирээдүйн шийдвэрт нөлөөлөхгүй тул үл тооцдог.\"},{\"id\":53,\"question\":\"Эдийн засгийн элэгдэл (economic depreciation) ба нягтлан бодох бүртгэлийн элэгдэл (accounting depreciation)-ийн ялгаа юу вэ?\",\"answer\":\"Эдийн засгийн элэгдэл ирээдүйд чиглэсэн — хөрөнгөөр үйлдвэрлэл хийхийн оронд хөрөнгөлж, түрээслэх боломжийг алдаж буй үнийг хэмждэг (боломжийн зардал). Нягтлан бодох бүртгэлийн элэгдэл түүхэнд чиглэсэн — өмнө зарцуулсан түүхэн өртгийг үйлдвэрлэлийн нэгжүүдэд хэрхэн хуваарилахыг заадаг.\"},{\"id\":54,\"question\":\"Нийт орлого (total revenue, TR) ямар томъёогоор тодорхойлогддог вэ?\",\"answer\":\"TR = (P)(Q) — нэгжийн борлуулалтын үнийг борлуулсан тоо хэмжээгээр үржүүлсэн нь.\"},{\"id\":55,\"question\":\"Дээд хязгаарын орлого (marginal revenue, MR) ямар томъёогоор тодорхойлогддог вэ?\",\"answer\":\"MR = ΔTR/ΔQ — нийт орлогын өөрчлөлтийг тоо хэмжээний өөрчлөлтөд харьцуулсан харьцаа, нэг нэгж нэмэгдэл үйлдвэрлэхэд ирэх нэмэлт орлого.\"},{\"id\":56,\"question\":\"Төгс өрсөлдөөнтэй (perfect competition) зах зээлд MR яагаад үнэтэй (P) тэнцүү байдаг вэ?\",\"answer\":\"Төгс өрсөлдөөнтэй зах зээлд фирм үнийн хяналтгүй (price taker) бөгөөд хэвтээ (бүрэн уян хатан) эрэлтийн муруйтай тулгардаг тул нэмэлт нэгж борлуулахын тулд үнээ бууруулах шаардлагагүй. Тэгэхлээр MR = P.\"},{\"id\":57,\"question\":\"MR = P + Q(ΔP/ΔQ) томъёо юуг илэрхийлдэг вэ?\",\"answer\":\"TR = (P)(Q)-г диференциалласнаар ΔTR = (P)(ΔQ) + (Q)(ΔP) болдог бөгөөд үүнийг ΔQ-д хуваахад MR = P + Q(ΔP/ΔQ) гэж гарна. Энэ нь MR нь үнээс (ΔP/ΔQ) × Q хэмжээгээр \\\"тохируулагдсан\\\" гэсэн үг; төгс бус өрсөлдөөнтэй фирмийн хувьд эрэлтийн муруй сөрөг налуутай (ΔP/ΔQ \u003c 0) тул MR \u003c P.\"},{\"id\":58,\"question\":\"Дээд хязгаарын зардал (marginal cost, MC) ямар томъёогоор тодорхойлогддог вэ, богино ба урт хугацааны дээд хязгаарын зардлын (SMC, LMC) ялгаа юу вэ?\",\"answer\":\"MC = ΔTC/ΔQ. SMC (short-run MC) нь богино хугацаанд зөвхөн хувьсах оруулалт (хөдөлмөр)-оор нэг нэгж нэмж үйлдвэрлэхэд гарах нэмэлт зардал; LMC (long-run MC) нь урт хугацаанд бүх оруулалт (хөдөлмөр, капитал) хувьсаж болох нөхцөлд гарах нэмэлт зардал.\"},{\"id\":59,\"question\":\"Ашиг хамгийн их байх (profit-maximizing) нөхцөл юу вэ?\",\"answer\":\"(1) MR = MC байх, мөн (2) тэр цэг дээр MC буурч байгаагүй байх ёстой (хоёр дахь эрэмбийн нөхцөл — second-order condition).\"},{\"id\":60,\"question\":\"Нийт зардал (TC), нийт тогтмол зардал (TFC), нийт хувьсах зардал (TVC) хэрхэн хамааралтай вэ?\",\"answer\":\"TC = TFC + TVC. TFC нь үйлдвэрлэлийн хэмжээнээс үл хамааран тогтмол гардаг зардал (жишээ: түрээс, зээлийн үйлчилгээ). TVC нь үйлдвэрлэлийн хэмжээтэй шууд хамааралтай, үйлдвэрлэл 0 байх үед TVC ч 0 байна.\"},{\"id\":61,\"question\":\"MC, дундаж зардал (AVC, ATC)-ийн хоорондын хамаарал ямар вэ?\",\"answer\":\"Хэрэв MC \u003c дундаж зардал бол дундаж зардал буурна; хэрэв MC \u003e дундаж зардал бол дундаж зардал өснө. Тиймээс MC муруй AVC, ATC муруйг тэдгээрийн хамгийн доод цэг дээр (тус тус S, T цэг) гаталдаг.\"},{\"id\":62,\"question\":\"Ашиг тэнцвэржих цэг (breakeven point) гэж юу вэ?\",\"answer\":\"Фирмийн нийт орлого (TR) нийт зардал (TC)-тай тэнцэх, өөрөөр хэлбэл үнэ (P, AR) нь дундаж нийт зардал (ATC)-тай тэнцэх цэг. Энэ нь ATC-ийн хамгийн доод цэг дээр тохиодог бөгөөд энэ цэг дээр эдийн засгийн ашиг тэг (зөвхөн хэвийн ашиг — normal profit) байна.\"},{\"id\":63,\"question\":\"Үйл ажиллагаа зогсоох цэг (shutdown point) гэж юу вэ?\",\"answer\":\"Фирмийн хувьсах зардал ч нөхөгдөхгүй болсон цэг, өөрөөр хэлбэл үнэ дундаж хувьсах зардал (AVC)-ийн хамгийн доод цэгээс доогуур унасан цэг. Энэ цэгээс доош үнэ унавал фирм богино хугацаанд ч гэсэн үйл ажиллагаагаа зогсоосон нь арай дээр байдаг.\"},{\"id\":64,\"question\":\"Богино ба урт хугацааны орлого-зардлын харьцааны дүгнэлт (Exhibit 22) ямар байдаг вэ?\",\"answer\":\"TR = TC бол богино, урт хугацаанд хоёуланд нь зах зээлд үлдэнэ. TR = TVC, гэхдээ TC-ээс бага бол богино хугацаанд үлдэх ч урт хугацаанд гарах ёстой. TR \u003c TVC бол фирм богино хугацаандаа үйл ажиллагаагаа зогсоож, зах зээлээс гарах ёстой.\"},{\"id\":65,\"question\":\"Төгс өрсөлдөөнтэй (perfect competition) ба төгс бус өрсөлдөөнтэй (imperfect competition) фирмийн орлогын хамаарал хэрхэн ялгаатай вэ?\",\"answer\":\"Төгс өрсөлдөөний үед эрэлтийн муруй хэвтээ тул MR = AR = P, нэгж нэмэгдэхэд TR шулуун шугамаар (үнэ тогтмол налуутай) өсдөг. Төгс бус өрсөлдөөний үед (жишээ монополи) эрэлтийн муруй сөрөг налуутай тул MR \u003c P; TR муруй эхлээд өсөж (эрэлт уян хатан үед), дараа нь буурдаг (эрэлт уян хатан бус болсон хойно).\"},{\"id\":66,\"question\":\"Жишээ: фирм 100 нэгж бараа P = €4-р зарж, ATC = €7 (AVC = €3.75, AFC = €3.25). Фирм яагаад үйл ажиллагаагаа зогсоохгүй байх нь зөв вэ?\",\"answer\":\"TR = €400, TC = €700, эдийн засгийн алдагдал €300. Хэрэв зогсоовол алдагдал нь зайлшгүй TFC-тэйгээ тэнцэх буюу €325 болно. Харин үйл ажиллагаагаа үргэлжлүүлбэл P(€4) \u003e AVC(€3.75) тул TVC-гээ бүрэн нөхөж, TFC-дээ €25 нэмж нөхөх боломжтой тул алдагдал зөвхөн €300 болж буурна — тиймээс зогсоохоос илүү ажиллах нь ашигтай.  ## Цар хүрээний хэмнэлт ба алдагдал (Economies and Diseconomies of Scale)\"},{\"id\":67,\"question\":\"Богино хугацаа (short run) болон урт хугацаа (long run)-ыг эдийн засгийн хувьд хэрхэн тодорхойлдог вэ?\",\"answer\":\"Богино хугацаа гэдэг нь үйлдвэрлэлийн хамгийн багадаа нэг хүчин зүйл (жишээ нь технологи, тоног төхөөрөмж, үйлдвэрийн хэмжээ) тогтмол байх хугацаа юм. Урт хугацаа гэдэг нь бүх хүчин зүйл хувьсах, мөн фирмүүд зах зээлд нэвтрэх эсвэл гарах боломжтой хугацаа (\\\"төлөвлөлтийн хугацаа\\\" — planning horizon).\"},{\"id\":68,\"question\":\"Хучлага муруй (envelope curve) буюу урт хугацааны дундаж нийт зардлын муруй (LRAC) гэж юу вэ?\",\"answer\":\"Өөр өөр үйлдвэрийн хэмжээ (plant size) тус бүрийн богино хугацааны дундаж нийт зардлын (SATC) муруйнуудаас хамгийн доод түвшний цэгүүдийг нэгтгэсэн муруйг урт хугацааны дундаж нийт зардлын муруй (LRAC) буюу \\\"хучлага муруй\\\" гэнэ, учир нь энэ нь бүх боломжит технологи, үйлдвэрийн хэмжээ, капиталын хослолыг багтаадаг.\"},{\"id\":69,\"question\":\"Цар хүрээний хэмнэлт (economies of scale) гэж юу вэ, графикаар хэрхэн илэрдэг вэ?\",\"answer\":\"Фирм гарцаа нэмэгдүүлэхэд нэгж зардал буурахыг цар хүрээний хэмнэлт гэнэ. Графикт энэ нь LRAC муруйн сөрөг налуутай хэсгээр илэрдэг.\"},{\"id\":70,\"question\":\"Цар хүрээний алдагдал (diseconomies of scale) гэж юу вэ, графикаар хэрхэн илэрдэг вэ?\",\"answer\":\"Фирм гарцаа нэмэгдүүлэхэд нэгж зардал нэмэгдэхийг цар хүрээний алдагдал гэнэ. Графикт энэ нь LRAC муруйн эерэг налуутай хэсгээр илэрдэг.\"},{\"id\":71,\"question\":\"Цар хүрээний хэмнэлтэд хүргэдэг ямар хүчин зүйлс байдаг вэ?\",\"answer\":\"Нэмэгдэх өгөөжтэй цар хүрээ (increasing returns to scale — гарц, оруулалтаас илүү хувь хэмжээгээр нэмэгддэг), хөдөлмөрийн хуваарилалт ба мэргэшил, илүү үр ашигтай (хэдий ч өртөг өндөртэй) тоног төхөөрөмж ашиглах чадвар, хог хаягдал бууруулах, зах зээлийн мэдээллийг илүү сайн ашиглах, бөөнөөр худалдан авалт хийж хямдруулсан үнэ авах зэрэг.\"},{\"id\":72,\"question\":\"Цар хүрээний алдагдалд хүргэдэг ямар хүчин зүйлс байдаг вэ?\",\"answer\":\"Буурах өгөөжтэй цар хүрээ (decreasing returns to scale), байгууллага хэт том болж зохицуулахад бэрхшээлтэй болох, бизнесийн чиг үүрэг, бүтээгдэхүүний шугамын давхардал, бөөнөөр худалдан авалт хийхэд нөөцийн хязгаарлалтаас шалтгаалж үнэ өсөх зэрэг (жишээ нь: General Motors компанийн брэндүүдийн давхардал).\"},{\"id\":73,\"question\":\"Хамгийн үр ашигтай цар хүрээ (minimum efficient scale) гэж юу вэ?\",\"answer\":\"LRAC муруйн хамгийн доод цэг дэх гарцын түвшин. Төгс өрсөлдөөнтэй зах зээлд урт хугацаанд фирмүүд энэ цэг дээр ажиллахад хүрдэг, учир нь зах зээлийн үнэ эцэстээ энэ түвшинд тогтдог.\"}]},{\"id\":\"market-structures\",\"title\":\"Фирм ба зах зээлийн бүтэц\",\"cards\":[{\"id\":1,\"question\":\"Эдийн засагчид зах зээлийг уламжлалт байдлаар хэдэн бүтэц (market structure) болгон ангилдаг вэ, тэдгээр нь юу вэ?\",\"answer\":\"Дөрөв: төгс өрсөлдөөн (perfect competition), монополь өрсөлдөөнтэй бүтэц (monopolistic competition), олигополь (oligopoly), монополь (monopoly).\"},{\"id\":2,\"question\":\"Эдийн засагчдын тодорхойлолтоор \\\"зах зээл\\\" гэж юу вэ?\",\"answer\":\"Зах зээл бол бие биенийгээ мэддэг, бараа, үйлчилгээг солилцох үнийн талаар тохиролцож чадах худалдан авагчид болон худалдагчдын бүлэг юм.\"},{\"id\":3,\"question\":\"Зах зээлийн бүтцийг тодорхойлдог 5 хүчин зүйл юу вэ?\",\"answer\":\"1) Нийлүүлж буй фирмүүдийн тоо болон харьцангуй хэмжээ; 2) Бүтээгдэхүүний ялгаварлалын зэрэг (degree of product differentiation); 3) Худалдагчийн үнэ тогтоох эрх мэдэл (pricing power); 4) Зах зээлд нэвтрэх/гарах саад бэрхшээлийн харьцангуй хүч (barriers to entry and exit); 5) Үнийн бус өрсөлдөөний (non-price competition) зэрэг.\"},{\"id\":4,\"question\":\"Exhibit 1-ийн дагуу дөрвөн зах зээлийн бүтцийн худалдагчдын тоо, бүтээгдэхүүний ялгаварлал ямар байдаг вэ?\",\"answer\":\"Цул дан өрсөлдөөн — олон худалдагч, нэгэн төрлийн/стандарт бүтээгдэхүүн; Монополь өрсөлдөөнтэй бүтэц — олон худалдагч, ялгаварлагдсан бүтээгдэхүүн; Олигополь — цөөн худалдагч, нэгэн төрлийн эсвэл ялгаварлагдсан бүтээгдэхүүн; Монополь — ганц худалдагч, өвөрмөц (unique) бүтээгдэхүүн.\"},{\"id\":5,\"question\":\"Exhibit 1-ийн дагуу дөрвөн зах зээлийн бүтцийн нэвтрэх саад (barriers to entry) ба үнэ тогтоох эрх мэдлийн (pricing power) харьцуулалт ямар байдаг вэ?\",\"answer\":\"Цул дан өрсөлдөөн — маш бага саад, үнэ тогтоох эрх мэдэл байхгүй; Монополь өрсөлдөөнтэй бүтэц — бага саад, бага зэргийн эрх мэдэл; Олигополь — өндөр саад, зарим эсвэл мэдэгдэхүйц эрх мэдэл; Монополь — маш өндөр саад, мэдэгдэхүйц эрх мэдэл.\"},{\"id\":6,\"question\":\"Цул дан өрсөлдөөнийг (perfect competition) тодорхойлох 5 нөхцөл юу вэ?\",\"answer\":\"1) Худалдан авагч, худалдагчийн тоо маш их; 2) Худалдагчдын санал болгож буй бүтээгдэхүүн бараг ялгаагүй адил; 3) Нэвтрэх, гарахад саад бага буурай; 4) Худалдагчид зах зээлийн үнэд нөлөөлөх эрх мэдэлгүй; 5) Үнийн бус өрсөлдөөн байхгүй.\"},{\"id\":7,\"question\":\"Монополь өрсөлдөөнтэй бүтэц (monopolistic competition) гэсэн ойлголтыг хэн нэр хүндтэй болгосон бэ, мөн энэ нь ямар шинж чанартай вэ?\",\"answer\":\"Эдвард Чэмберлин (АНУ) болон Жоан Робинсон (Их Британи) нэр хүндтэй болгосон. Энэ бол эрлийз (hybrid) зах зээл: өрсөлдөөний хүчтэй элемент (олон фирм) ба бүтээгдэхүүний ялгаварлалаас шалтгаалсан монополь шинж хоёулаа байдаг.\"},{\"id\":8,\"question\":\"Олигополь (oligopoly) зах зээлийн хамгийн тод шинж юу вэ?\",\"answer\":\"Зах зээлд ноёрхдог фирмүүдийн тоо цөөн байх; тэдгээрийн үнэ тогтоох шийдвэр харилцан хамааралтай (interdependent) байдаг тул нэг фирмийн шийдвэр нөгөөдийнхөө хариу арга хэмжээг тооцдог.\"},{\"id\":9,\"question\":\"Монополь (monopoly) зах зээлийн тодорхойлогч шинжүүд юу вэ?\",\"answer\":\"Ганц худалдагч, өвөрмөц бүтээгдэхүүн, ойрын орлогч бараа байхгүй, нэвтрэхэд маш өндөр саад, худалдагч үнэ, гарц дээр мэдэгдэхүйц эрх мэдэлтэй.\"},{\"id\":10,\"question\":\"Майкл Портерын (Michael Porter) \\\"таван хүчний\\\" (five forces) загварт ямар хүчнүүд байдаг вэ?\",\"answer\":\"1) Нэвтрэх аюул (threat of entry); 2) Нийлүүлэгчдийн хүч (power of suppliers); 3) Худалдан авагчдын хүч (power of buyers); 4) Орлуулагч бүтээгдэхүүний аюул (threat of substitutes); 5) Одоо байгаа өрсөлдөгчдийн хоорондын өрсөлдөөн (rivalry among existing competitors).\"},{\"id\":11,\"question\":\"\\\"Эдийн засгийн ус хуур\\\" (economic moat) гэдэг нь юуг илэрхийлдэг вэ?\",\"answer\":\"Дундад зууны шилтгээнийг хамгаалдаг ус хуур шиг, фирмийн ашигт ажиллагааг нэвтрэх аюул (threat of entry)-аас хамгаалдаг хүчин зүйлсийг илэрхийлдэг нэр томьёо; гүн ус хуур нь нэвтрэх аюул бага, хэрэглэгчийн сэлгэх өртөг (switching cost) өндөр байхыг илэрхийлнэ.\"},{\"id\":12,\"question\":\"Цул дан өрсөлдөөн ба инновацийн хоорондын сэлгэц (trade-off) юу вэ?\",\"answer\":\"Цул дан өрсөлдөөн нь хамгийн бага үнээр хамгийн их бараа олгодог ч, оношлогооны/эмийн судалгаа зэрэг өндөр өртөгтэй инновацийг санхүүжүүлэх хөшүүрэг олигополь зэрэг өрсөлдөөн багатай бүтцэд илүү байдаг тул хэрэглэгч заримдаа төгс бус өрсөлдөөнөөс ашиг хүртэж болно.  ## Цул дан өрсөлдөөн (Perfect Competition)\"},{\"id\":13,\"question\":\"Цул дан өрсөлдөөнтэй зах зээлийн эрэлтийн функц QD = 50 – 2P гэвэл, үнийг тоо хэмжээгээр илэрхийлсэн урвуу (inverse) функц юу болох вэ?\",\"answer\":\"P = 25 – 0.5QD\"},{\"id\":14,\"question\":\"Нийт орлого (TR) ба дундаж орлого (AR)-ийг QD = 50 – 2P (өөрөөр P = 25 – 0.5QD) эрэлтийн функцээс хэрхэн гаргах вэ?\",\"answer\":\"TR = P×QD = 25QD – 0.5QD²; AR = TR/QD = 25 – 0.5QD, өөрөөр хэлбэл AR функц нь зах зээлийн эрэлтийн функцтэй яг адил байна.\"},{\"id\":15,\"question\":\"Дээрх эрэлтийн функцэд (P = 25 – 0.5QD) ΔQD маш бага байхад маргинал орлого (MR) ямар томьёогоор илэрхийлэгдэх вэ?\",\"answer\":\"MR = 25 – QD (ΔQD → 0 үед).\"},{\"id\":16,\"question\":\"Эрэлтийн үнийн уян хатан чанарыг (price elasticity of demand, εP) хэрхэн тодорхойлдог вэ?\",\"answer\":\"εP = –(% change in QD) ÷ (% change in P). Ердийн дагавраар эерэг тоогоор илэрхийлдэг.\"},{\"id\":17,\"question\":\"Эрэлтийн үнийн уян хатан чанарын гурван ангилал юу вэ?\",\"answer\":\"εP \u003e 1 бол эрэлт уян хатан (elastic); εP = 1 бол нэгдмэл уян хатан (unitary elastic); εP \u003c 1 бол уян хатан бус (inelastic).\"},{\"id\":18,\"question\":\"Эрэлтийн үнийн уян хатан чанарт нөлөөлдөг гол хүчин зүйлс юу вэ?\",\"answer\":\"1) Ойрын орлогч барааны тоо (олон байх тусам уян хатан); 2) Хэрэглэгчийн төсөвт эзлэх хувь хэмжээ (өндөр байх тусам уян хатан); 3) Хугацааны урт (урт хугацаанд илүү уян хатан байдаг, учир нь хэрэглэгч дасан зохицох цаг олддог).\"},{\"id\":19,\"question\":\"Эрэлтийн үнийн уян хатан чанарын хоёр хязгаарлагдмал тохиолдол юу вэ?\",\"answer\":\"Хэвтээ эрэлтийн муруй (төгс өрсөлдөгч фирмийн тохиолдол) — εP = ∞ (perfectly elastic); босоо эрэлтийн муруй (жишээ нь: инсулин) — εP = 0 (perfectly inelastic).\"},{\"id\":20,\"question\":\"Орлогын уян хатан чанар (income elasticity of demand, εY) гэж юу вэ, мөн хэрхэн тооцдог вэ?\",\"answer\":\"εY = (% change in QD) ÷ (% change in Y). Энгийн бараанд εY эерэг; тансаг бараанд (luxury goods) εY \u003e 1; доод зэргийн бараанд (inferior goods) εY сөрөг байна.\"},{\"id\":21,\"question\":\"Харилцан үнийн уян хатан чанар (cross-price elasticity of demand, εX) гэж юу вэ?\",\"answer\":\"εX = (% change in QDA) ÷ (% change in PB). Эерэг утга = орлуулагч бараа (substitutes); сөрөг утга = нэмэлт бараа (complements).\"},{\"id\":22,\"question\":\"Эрэлтийн үнийн уян хатан чанар ба нийт орлого (TR)-ийн хоорондын хамаарал юу вэ?\",\"answer\":\"εP \u003e 1 (уян хатан): ↑P → TR↓, ↓P → TR↑. εP = 1 (нэгдмэл уян хатан): P өөрчлөгдсөн ч TR өөрчлөгдөхгүй. 0 \u003c εP \u003c 1 (уян хатан бус): ↑P → TR↑, ↓P → TR↓.\"},{\"id\":23,\"question\":\"Маргинал орлого (MR) ба эрэлтийн үнийн уян хатан чанарын (εP) хоорондын хамаарлыг илэрхийлэх томьёо юу вэ?\",\"answer\":\"MR = P[1 – (1/εP)]\"},{\"id\":24,\"question\":\"Хэрэглэгчийн илүүдэл үнэ цэнэ (consumer surplus) гэж юу вэ, графикаар хэрхэн илэрхийлэгдэх вэ?\",\"answer\":\"Хэрэглэгчийн худалдан авсан нэгжийн төлөөх үнэлгээ ба түүнд төлсөн мөнгөний зөрүү; графикт эрэлтийн муруйн доод, худалдан авсан үнийн дээд хэсэгт байрлах талбай (гурвалжин хэлбэртэй) байна.\"},{\"id\":25,\"question\":\"Боломжийн өртөг (opportunity cost) гэж юу вэ, мөн эдийн засгийн ашиг (economic profit) нягтлан бодох бүртгэлийн ашигтай (accounting profit) яагаад ялгаатай вэ?\",\"answer\":\"Боломжийн өртөг бол нөөцийг одоогийн ашиглалтад байлгах буюу шинээр авахад шаардагдах хамгийн сайн хувилбарын орлого юм. Эдийн засгийн ашиг = TR – TC, бөгөөд TC нь боломжийн өртгийг багтаадаг; нягтлан бодох бүртгэлийн ашиг нь зөвхөн гадны нөөц нийлүүлэгчдэд хийсэн тодорхой төлбөрүүдийг (ажилчин, нийлүүлэгч, зээлдүүлэгч) харгалзах тул боломжийн өртгийг оруулахгүй.\"},{\"id\":26,\"question\":\"Цул дан өрсөлдөөнт фирм яагаад хэвтээ (horizontal) эрэлтийн муруйтай тулгардаг вэ, мөн энэ нь юуг илэрхийлдэг вэ?\",\"answer\":\"Нэг фирм зах зээлийн тэнцвэрийн үнэд ямар ч нөлөө үзүүлж чадахгүй тул, тухайн тэнцвэрийн үнэ дээр хэд хэдэн нэгж нийлүүлэх боломжтой. Энэ үед: Үнэ (Price) = Дундаж орлого (Average revenue) = Маргинал орлого (Marginal revenue).\"},{\"id\":27,\"question\":\"Цул дан өрсөлдөгч фирм ямар дүрэмээр ашгаа хамгийн ихэсгэх гарцыг сонгодог вэ, мөн зардлын томьёонууд юу вэ?\",\"answer\":\"Фирм MR = MC байх түвшинд гарцаа тогтоодог. Дундаж өртөг AC = TC/Q; Маргинал өртөг MC = ΔTC/ΔQ; AC хамгийн бага байх түвшинд MC = AC байна.\"},{\"id\":28,\"question\":\"Буурах өгөөжийн хууль (law of diminishing returns) юу вэ, мөн энэ нь AC, MC муруйн хэлбэрт хэрхэн нөлөөлдөг вэ?\",\"answer\":\"Технологи тогтвортой тохиолдолд нийлүүлэлтийн нэмэлт нэгж бүр гарцад улам багасдаг нэмэгдлийг өгдөг хууль юм. Үр дүнд нь AC ба MC муруй U-хэлбэртэй болдог: эхлээд буурч, дараа нь нэмэгддэг.\"},{\"id\":29,\"question\":\"Урт хугацаанд төгс өрсөлдөгч фирм ямар тэнцвэрт байдалд хүрдэг вэ?\",\"answer\":\"P = MC = min AC (хамгийн бага дундаж өртөг) байх түвшинд; эдийн засгийн ашиг тэг (zero economic profit) болно, учир нь TR = TC. Фирмийн урт хугацааны нийлүүлэлтийн муруй нь түүний урт хугацааны маргинал өртгийн муруй (long-run marginal cost curve) юм.\"},{\"id\":30,\"question\":\"Шумпетерийн (Schumpeter) инновацийн хоёр төрөл юу вэ, мөн \\\"swarming\\\" (бөөгнөрөл) гэсэн 3 үе шат нь юуг илэрхийлдэг вэ?\",\"answer\":\"1) Процессын инноваци (innovation of process) — илүү үр ашигтай үйлдвэрлэх арга; 2) Бүтээгдэхүүний инноваци (innovation of product) — шинэ бүтээгдэхүүн. 3 үе шат: эхний компани инновацлаад өндөр ашиг олно → бусад компаниуд дуурайж \\\"бөөгнөрнө\\\" (swarming) → эцэст нь бүгд дуурайсны үр дүнд эдийн засгийн ашиг алга болж, төгс өрсөлдөөний урт хугацаат тэнцвэр тогтоно.  ## Монополь өрсөлдөөнтэй бүтэц (Monopolistic Competition)\"},{\"id\":31,\"question\":\"Монополь өрсөлдөөнтэй бүтцийн тодорхойлогч 5 шинж юу вэ?\",\"answer\":\"1) Худалдан авагч, худалдагчийн тоо их; 2) Фирмүүдийн бүтээгдэхүүн ойрын орлогч боловч харагдах хэлбэрээрээ ялгаатай; 3) Нэвтрэх, гарах өртөг харьцангуй бага; 4) Фирмүүд үнэ тогтоох бага зэргийн эрх мэдэлтэй; 5) Фирмүүд сурталчилгаа, үнийн бус стратегиар бүтээгдэхүүнээ ялгаварладаг.\"},{\"id\":32,\"question\":\"Монополь өрсөлдөөнтэй бүтцийн фирмийн эрэлтийн муруй төгс өрсөлдөгч фирмийнхээс юугаар ялгаатай вэ?\",\"answer\":\"Бүтээгдэхүүн ялгаварлагдсан учир эрэлтийн муруй баруун тийш доошоо хэвтсэн (downward sloping) байдаг; хэвтээ бус, учир нь фирм үнээ бага зэрэг өөрчилж болно.\"},{\"id\":33,\"question\":\"Богино хугацаанд монополь өрсөлдөөнтэй фирм хэрхэн ашгаа хамгийн ихэсгэх вэ?\",\"answer\":\"MR = MC байх Q1 гарцыг сонгоно; эрэлтийн муруйгаас тухайн гарцад харгалзах P1 үнийг тогтооно; нийт орлого (TR) нь P1 × Q1 талбай юм (Exhibit 11).\"},{\"id\":34,\"question\":\"Монополь өрсөлдөөнтэй бүтэцд тодорхой тодорхойлогдсон нийлүүлэлтийн функц (well-defined supply function) байдаг уу?\",\"answer\":\"Үгүй. Гарц MC ба MR-ийн огтлолцлоор тодорхойлогддог, харин үнэ эрэлтийн муруйгаар тогтдог тул нийлүүлэлтийн функц байдаггүй.\"},{\"id\":35,\"question\":\"Фирмийн ашгийг (π) хэрхэн тодорхойлдог вэ?\",\"answer\":\"π = TR – TC, бөгөөд TR = P1×Q1 (нийт орлого), TC = C1×Q1 (нийт өртөг, C1 нь Q1 нэгж үйлдвэрлэх дундаж өртөг).\"},{\"id\":36,\"question\":\"Урт хугацаанд монополь өрсөлдөөнтэй фирм ямар тэнцвэрт байдалд хүрдэг вэ?\",\"answer\":\"Шинэ фирмүүд нэвтэрч, эрэлт буурсны үр дүнд эдийн засгийн ашиг тэг болно (TR = TC), гэхдээ төгс өрсөлдөөнөөс ялгаатай нь, тэнцвэр нь дундаж өртгийг хамгийн багасгах түвшнээс (Q2) доогуур гарцад (Q1 \u003c Q2) тохиолддог — өөрөөр хэлбэл илүүдэл хүчин чадал (excess capacity) үлддэг.\"},{\"id\":37,\"question\":\"Монополь өрсөлдөөнтэй бүтэц нь \\\"хэт үр ашиггүй\\\" гэж үзэгдэх хэдий ч яагаад нийгэмд ашигтай байж болох вэ?\",\"answer\":\"Бүтээгдэхүүний ялгаварлал нь инноваци хийх хөшүүрэг өгдөг (Шумпетерийн санаа), хэрэглэгчийн өөр өөр хэрэгцээ, амт, сонирхолд нийцсэн бараа бүтээгдэхүүн олгодог бөгөөд хэрэглэгчид төрөл зүйлийг (variety) эрхэмлэдэг (жишээ: Герман-Японы хоорондын машины худалдаа).  ## Олигополь (Oligopoly)\"},{\"id\":38,\"question\":\"Олигополийг тодорхойлох 5 шинж юу вэ?\",\"answer\":\"1) Худалдагчдын тоо цөөн; 2) Бүтээгдэхүүн ойрын орлогч бөгөөд бренд эсвэл нэгэн төрлийн байж болно; 3) Зах зээлд нэвтрэхэд өндөр саад; 4) Фирмүүд мэдэгдэхүйц үнэ тогтоох эрх мэдэлтэй; 5) Бүтээгдэхүүнийг сурталчилгаа, онцлог зэрэг үнийн бус стратегиар ихэвчлэн ялгаварладаг.\"},{\"id\":39,\"question\":\"Олигополь зах зээлд үнэ тогтоох гурван үндсэн стратеги юу вэ?\",\"answer\":\"1) Үнийн харилцан хамаарал (pricing interdependence); 2) Курногийн таамаглал (the Cournot assumption); 3) Нэшийн тэнцвэр (the Nash equilibrium).\"},{\"id\":40,\"question\":\"Эгц хугарсан эрэлтийн муруй (kinked demand curve) гэж юу вэ, мөн яагаад үүсдэг вэ?\",\"answer\":\"Өрсөлдөгчид үнийн бууралтыг давтан хийдэг (match) харин үнийн нэмэгдлийг дагадаггүй гэж үзвэл, фирмийн эрэлт нь үнэ нэмэгдэх үед илүү уян хатан (DP↑), үнэ буурах үед илүү уян хатан бус (DP↓) болж, тэнцвэрийн үнэ дээр \\\"хугардаг\\\". Үр дүнд MR муруй тасалдалтай болдог.\"},{\"id\":41,\"question\":\"Эгц хугарсан эрэлтийн муруйн загварын гол сул тал юу вэ?\",\"answer\":\"Эхний тэнцвэрт (prevailing) үнэ хэрхэн тогтсоныг тайлбарлаж чадахгүй; гэхдээ олигополь зах зээлд үнэ тогтвортой байдлыг тайлбарлахад тустай.\"},{\"id\":42,\"question\":\"Курногийн таамаглал (Cournot assumption) юу вэ?\",\"answer\":\"Дуополи (duopoly) зах зээлд фирм бүр өөрийн ашгаа хамгийн ихэсгэх гарцаа сонгохдоо нөгөө фирм гарцаа өөрчлөхгүй гэж таамаглан шийдвэр гаргадаг.\"},{\"id\":43,\"question\":\"QD = 450 – P эрэлттэй, MC = 30 байх дуополи зах зээлд Курногийн тэнцвэр ямар байх вэ?\",\"answer\":\"q1 = q2 = 140, Q = 280, P = 450 – 280 = 170. (MR1 = 450 – 2q1 – q2 = 30, MR2 = 450 – q1 – 2q2 = 30 тэгшитгэлүүдийг хамтад нь бодсон.)\"},{\"id\":44,\"question\":\"Курногийн тэнцвэр (Cournot equilibrium) төгс өрсөлдөөн, монополийн тэнцвэртэй харьцуулахад хаана байрлах вэ?\",\"answer\":\"Дунд нь: PC (төгс өрсөлдөөний үнэ) \u003c PCournot \u003c PM (монополийн үнэ); харгалзах гарц нь QM \u003c QCournot \u003c QC. Тухайн жишээнд PC=30, PCournot=170, PM=240; Q(competitive)=420, Q(Cournot)=280, Q(monopoly)=210.\"},{\"id\":45,\"question\":\"Нэшийн тэнцвэр (Nash equilibrium) гэж юу вэ?\",\"answer\":\"Хамтын ажиллагаагүй (non-cooperative) тоглоомд оролцогч хоёр буюу түүнээс дээш фирм нөгөөгийнхөөрөө оновчтой хариу үйлдлийг тооцсоны дараа өөрийнхөө стратегиас хазайх урам зоригтой байхгүй тэнцвэр.\"},{\"id\":46,\"question\":\"Нэшийн тэнцвэрийн ArcCo/BatCo жишээнд хамгийн их нийт ашиг олгох хувилбар болон бодит Нэшийн тэнцвэр хоёр яагаад ялгаатай байдаг вэ?\",\"answer\":\"Хоёр фирм өндөр үнэ тогтоох нь нийт ашгийг (800) хамгийн ихэсгэдэг ч, BatCo-д ArcCo өндөр үнэ тогтоож байхад бага үнэ тогтоож илүү ашиг (350) олох урам зориг байдаг тул, хамтын ажиллагаагүй тэнцвэр нь нийт ашгийг хамгийн ихэсгэдэг хувилбараас өөр байдаг — зөвхөн тохиролцоо (collusion) хийвэл хоёулаа өндөр үнэ тогтоох боломжтой.\"},{\"id\":47,\"question\":\"Картель (cartel) гэж юу вэ, мөн энэ нь илэрхий (explicit) эсвэл далд (implicit) байж болдог уу?\",\"answer\":\"Картель бол тохиролцоо (collusion)-ыг нээлттэй, албан ёсоор хийсэн фирмүүдийн нэгдэл. Илэрхий (гэрээн дээр үндэслэсэн) эсвэл далд (дохио зангаа дээр үндэслэсэн, жишээ нь: нэг фирм үнээ бууруулахгүй байх нь үнэ нэмэгдүүлэх \\\"санал\\\" гэж тайлагддаг) байж болно.\"},{\"id\":48,\"question\":\"Амжилттай тохиролцоо (successful collusion)-д нөлөөлдөг 6 хүчин зүйл юу вэ?\",\"answer\":\"1) Худалдагчдын тоо, хэмжээний тархалт (цөөн буюу ноёрхогч фирмтэй бол амжилттай); 2) Бүтээгдэхүүний адил төрөлжилт (нэгэн төрлийн бол амжилттай); 3) Зардлын бүтцийн адил төрөлжилт; 4) Захиалгын хэмжээ, давтамж (бага, байнгын захиалга бол амжилттай); 5) Хариу арга хэмжээний хүч, хатуу байдал; 6) Гадны өрсөлдөөний зэрэг (OPEC-ийн жишээ).\"},{\"id\":49,\"question\":\"Штакельбергийн загвар (Stackelberg model) Курногийн загвараас юугаар ялгаатай вэ?\",\"answer\":\"Курного загварт шийдвэр нэгэн зэрэг гардаг (simultaneous), харин Штакельбергт тэргүүлэгч (leader) фирм эхлээд гарцаа тогтоож, дагалдагч (follower) фирм түүнийг ажигласны дараа шийддэг (sequential). Тэргүүлэгч фирм \\\"top dog\\\" стратегийг ашиглан илүүдэл үйлдвэрлэж дагалдагчийг гарцаа багасгахад хүргэж, илүү өндөр ашиг олдог.\"},{\"id\":50,\"question\":\"Зонхилогч фирмийн үнийн тэргүүлэл (dominant firm price leadership)-ийн загварт зонхилогч фирм гарц, үнээ хэрхэн тогтоодог вэ?\",\"answer\":\"Зонхилогч фирм (бага өртөгтэй, ихэвчлэн ≥40% зах зээлийн эзлэхүүнтэй) MRL = MCL байх QL гарцыг сонгодог; тухайн гарцад харгалзах үнэ (PL) өөрийнх нь эрэлтийн хэсэг DL-ээс тогтдог. Дагалдагч фирмүүд зөрүү (QT – QL) = QF хэмжээг нийлүүлдэг.\"},{\"id\":51,\"question\":\"Урт хугацаанд олигополь зах зээлд ноёрхогч фирмийн зах зээлийн эзлэхүүн ямар чиг хандлагатай байдаг вэ?\",\"answer\":\"Ихэнх тохиолдолд буурдаг, учир нь ашиг нь шинэ фирмүүдийг татдаг бөгөөд эдгээр нь илүү үр ашигтай арга техник нэвтрүүлэн зонхилогч фирмийн эрэлт, маргинал орлогыг багасгадаг (жишээ: US Steel компани 1901 онд 66%, 1920 онд 46%, 1925 онд 42% зах зээл эзэлсэн).  ## Монополь (Monopoly), үүнд үнийн ялгаварлал (Price Discrimination)\"},{\"id\":52,\"question\":\"Монополийн 5 тодорхойлогч шинж юу вэ?\",\"answer\":\"1) Өвөрмөц ялгаварлагдсан бүтээгдэхүүний ганц худалдагч; 2) Ойрын орлогч бараа байхгүй; 3) Нэвтрэхэд маш өндөр саад; 4) Фирм мэдэгдэхүйц үнэ тогтоох эрх мэдэлтэй; 5) Бүтээгдэхүүн сурталчилгаа зэрэг үнийн бус стратегиар ялгаварлагдана.\"},{\"id\":53,\"question\":\"Монополь хүч (monopoly power)-ийн эх үүсвэрүүд юу вэ?\",\"answer\":\"1) Патент, зохиогчийн эрх; 2) Чухал нөөцийг хянах (жишээ: De Beers-ийн алмазны уурхай); 3) Засгийн газрын зөвшөөрөл/байгалийн монополь (natural monopoly, масштабын өгөөж — economies of scale, жишээ: цахилгаан, усны шугам); 4) Брэндийн үнэнч байдал (жишээ: Rolex); 5) Сүлжээний нөлөөлөл (network effects, жишээ: Microsoft Word).\"},{\"id\":54,\"question\":\"Монополийн эрэлт, нийт орлого, маргинал орлогыг ерөнхий хэлбэрээр хэрхэн илэрхийлдэг вэ (QD = a – bP)?\",\"answer\":\"P = a/b – (1/b)QD; TR = (a/b)QD – (1/b)QD²; MR = ΔTR/ΔQ = (a/b) – (2/b)QD. Шугаман эрэлттэй тохиолдолд MR муруйн налуу эрэлтийн муруйнхаас хоёр дахин эгц байна.\"},{\"id\":55,\"question\":\"Монополь зах зээлд тодорхой нийлүүлэлтийн функц байдаг уу, мөн ашгаа хамгийн ихэсгэх дүрэм юу вэ?\",\"answer\":\"Үгүй, тодорхойлогдсон нийлүүлэлтийн функц байдаггүй; гарц, үнийг зардлын бүтэц (cost structure)-аар тодорхойлно. Ашгийг хамгийн ихэсгэх гарц нь MR = MC байх түвшин.\"},{\"id\":56,\"question\":\"Монополь, маргинал орлого ба эрэлтийн үнийн уян хатан чанарын хамаарлыг ашиглан үнэ тогтоох томьёо юу вэ, мөн жишээ бодож харуул?\",\"answer\":\"MR = MC тул P[1 – 1/EP] = MC. Жишээ: MC тогтмол 75, EP=1.5 бол P[1 – 1/1.5] = 75 → P = 225.\"},{\"id\":57,\"question\":\"Монополийн ашгаа хамгийн ихэсгэх үнэ, гарц нь эрэлтийн муруйн уян хатан (elastic) эсвэл уян хатан бус (inelastic) хэсэгт байрладаг вэ?\",\"answer\":\"Үргэлж уян хатан (elastic) хэсэгт, учир нь MR ба MC нь зөвхөн MR эерэг байх үед огтлолцдог бөгөөд энэ нь эрэлт уян хатан байхыг шаарддаг.\"},{\"id\":58,\"question\":\"Байгалийн монополь (natural monopoly)-ийг зохицуулах гурван боломжит шийдэл юу вэ, мөн үүссэн үнийг хэрхэн харьцуулдаг вэ?\",\"answer\":\"1) Зохицуулалтгүй монополь: LRMC=MR дээр тогтоох, PM (хамгийн өндөр); 2) Зохицуулсан монополь: PR = LRAC дээр тогтоох (дундаж); 3) Өрсөлдөөнт үнэ: PC = LRMC дээр (хамгийн бага, гэхдээ дундаж өртгийг нөхөхгүй байж болно). Эрэмбэ: PM \u003e PR \u003e PC.\"},{\"id\":59,\"question\":\"Нэгдүгээр зэргийн үнийн ялгаварлал (first-degree price discrimination) гэж юу вэ?\",\"answer\":\"Монополист хэрэглэгч бүрээс тэдний төлж болох хамгийн өндөр үнийг авдаг хувилбар; энэ нь хэрэглэгчийн бүхэл илүүдэл үнэ цэнийг (entire consumer surplus) булаан авдаг.\"},{\"id\":60,\"question\":\"Хоёрдугаар зэргийн үнийн ялгаварлал (second-degree price discrimination) гэж юу вэ, мөн ямар аргуудаар хэрэгждэг вэ?\",\"answer\":\"Хэрэглэгчдийг хэрэглэх хэмжээгээрээ өөрсдийгөө ялгаварлан сонгуулахаар хэмжээнд суурилсан үнийн сонголтуудыг (menu of quantity-based pricing options) санал болгох; жишээ нь: хэмжээний хямдрал, хэмжээний нэмэгдэл, купон, багцлал (bundling), ашиглалтын хязгаарлалт.\"},{\"id\":61,\"question\":\"Гуравдугаар зэргийн үнийн ялгаварлал (third-degree price discrimination) гэж юу вэ?\",\"answer\":\"Хэрэглэгчдийг хүн ам зүй, бусад шинж чанараар ангилан өөр үнэ тогтоох; жишээ: эконометрик программ хангамжийн оюутны хувилбар vs мэргэжлийн хувилбар; агаарын тийзний нэг өдрийн эргэх аяллын тийз vs долоо хоногийн амралтаар эргэх тийз.\"},{\"id\":62,\"question\":\"Хоёр хэсэгтэй үнэ тогтоолт (two-part tariff pricing) гэж юу вэ?\",\"answer\":\"Нэг нэгжийн үнэ дээр нэмж сарын/гишүүнчлэлийн тогтмол төлбөр (entry fee) авдаг аргачлал; тогтмол төлбөр нь тухайн нэгжийн үнэд харгалзах хэрэглэгчийн илүүдэл үнэ цэнэ (consumer surplus)-тэй тэнцдэг.\"},{\"id\":63,\"question\":\"Николь сарын фитнес клубийн эрэлт QD = 20 – 4P (P — евро/удаа), маргинал өртөг €2/удаа бол, клуб хэдэн евроны гишүүнчлэлийн төлбөр авч болох вэ?\",\"answer\":\"P=2 үед QD=20–4(2)=12 удаа; хэрэглэгчийн илүүдэл үнэ цэнэ = (0.5)(12)(3) = 18 евро. Клуб сард €18 гишүүнчлэлийн төлбөр нэмж €2/удаа авч Николийн бүх илүүдэл үнэ цэнийг булаан авч чадна (хоёр хэсэгтэй үнэ тогтоолт).\"},{\"id\":64,\"question\":\"Урт хугацаанд монополь зах зээлийн тэнцвэрт байдлыг хадгалахын тулд ямар нөхцөл шаардлагатай вэ, мөн зохицуулалттай монополийн урт хугацааны шийдлүүд юу вэ?\",\"answer\":\"Монополь хэвээр үлдэхийн тулд тасралтгүй, бат бэх зах зээлд нэвтрэх саад (жишээ нь: шинэ патентууд) хадгалагдах шаардлагатай. Зохицуулалттай монополийн шийдлүүд: 1) Татаас (subsidy) олгож P=MC тогтоох; 2) Үндэсний өмчлөл (nationalization); 3) Зохицуулах байгууллага P=LRAC тогтоох; 4) Франчайз тендер (franchise bidding) замаар P=LRAC тогтоох.\"},{\"id\":65,\"question\":\"Монополистууд яагаад чанар, судалгаа-хөгжилд (R\u0026D) бага хөрөнгө оруулдаг вэ?\",\"answer\":\"Шинэ өрсөлдөгч нэвтрэх аюул байхгүй бол, эсвэл ийм зардал ашгийг тодорхой нэмэгдүүлэхгүй бол, монополист чанарын хяналт, судалгаа-хөгжил, харилцагчийн үйлчилгээнд нөөц зарцуулах хөшүүрэг багатай байдаг (жишээ: өрсөлдөөн нэвтрэхээс өмнөх дотоодын машин үйлдвэрлэгчид, зохицуулалттай утасны компаниуд).\"},{\"id\":66,\"question\":\"Монополь үргэлж үр ашиггүй гэж үзэх үү?\",\"answer\":\"Үгүй, байнга биш. Масштабын өгөөж (economies of scale) ба зохицуулалт (эсвэл нэвтрэх аюулын) нөлөөгөөр, зарим тохиолдолд монополь нь төгс өрсөлдөөнөөс илүү сайн үр дүн (жишээ: нэг цахилгаан станц бага дундаж өртөгтэй байх) худалдан авагчдад өгч чадна.  ## Зах зээлийн бүтцийг тодорхойлох арга (Identification of Market Structure)\"},{\"id\":67,\"question\":\"Зах зээлийн хүчийг хэмжих онолын арга юу вэ?\",\"answer\":\"Эрэлт, нийлүүлэлтийн уян хатан чанарыг тооцох (econometric estimation). Эрэлт маш уян хатан бол зах зээл төгс өрсөлдөөнд ойр; эрэлт хатуу (уян хатан бус) бол компаниуд зах зээлийн хүчтэй байж болзошгүй.\"},{\"id\":68,\"question\":\"Эндогенийн асуудал (problem of endogeneity) эрэлт, нийлүүлэлтийг econometric аргаар тооцоход яагаад саад болдог вэ?\",\"answer\":\"Ажиглагдсан үнэ, тоо хэмжээ нь эрэлт, нийлүүлэлтийн хоёулангийнх нь харилцан үйлчлэлээр хамтад нь тодорхойлогддог тэнцвэрийн утгууд тул, тус тусдаа функцийг гаргаж авахын тулд хоёр тэгшитгэлтэй загвар (эрэлтийн тэгшитгэл, нийлүүлэлтийн тэгшитгэл) ашиглах шаардлагатай.\"},{\"id\":69,\"question\":\"Цаг хугацааны цуваа (time-series) ба хөндлөн таслал (cross-sectional) regression хоёр аргын гол ялгаа, сул тал юу вэ?\",\"answer\":\"Цаг хугацааны цуваа нь нэг зах зээлийн нийт борлуулалт, дундаж үнийг хугацаанд ажиглана — гэхдээ зах зээлийн бүтэц өөрчлөгдсөн бол түүхэн уян хатан чанар одоогийн нөхцөлд тохиромжгүй байж болно. Хөндлөн таслалын арга нь нэг жилийн дотор өөр компаниудын борлуулалтыг ажигладаг — илүү их мэдээлэл цуглуулах шаардлагатай ба тайлбарлагч хувьсагчийн тодорхойлолтоос шалтгаалж үр дүн ихээхэн ялгаатай гарч болно.\"},{\"id\":70,\"question\":\"Төвлөрлийн харьцаа (concentration ratio) гэж юу вэ, мөн ямар утгатай байдаг вэ?\",\"answer\":\"Хамгийн том N фирмийн зах зээлийн эзлэхүүний нийлбэр; 0% (төгс өрсөлдөөн) -ээс 100% (монополь) хооронд хэлбэлзэнэ.\"},{\"id\":71,\"question\":\"8 нийлүүлэгчтэй зах зээлд хамгийн том фирм 35%, дараагийнх нь 25%, 20%, 10%, үлдсэн 4 нь тус бүр 2.5% эзэлж байхад топ-3, топ-4 фирмийн төвлөрлийн харьцаа тус тус хэд вэ?\",\"answer\":\"Топ-3: 35+25+20 = 80%; Топ-4: 35+25+20+10 = 90%.\"},{\"id\":72,\"question\":\"Төвлөрлийн харьцаа (concentration ratio)-ийн давуу, сул тал юу вэ?\",\"answer\":\"Давуу тал — тооцоход маш энгийн. Сул тал — 1) Зах зээлийн хүчийг шууд хэмжихгүй (нэвтрэх саад бага бол ганц фирм ч гэсэн төгс өрсөлдөөн шиг зан авир гаргаж болно); 2) Топ фирмүүдийн нэгдэл (merger)-д мэдрэмжгүй (хариу үйлдэл багатай) байдаг.\"},{\"id\":73,\"question\":\"Херфиндаль-Хиршманы индекс (Herfindahl-Hirschman Index, HHI) гэж юу вэ, мөн хэрхэн тооцдог вэ?\",\"answer\":\"Топ N компанийн зах зээлийн эзлэхүүнийг квадрат зэрэгт дэвшүүлж, нийлбэрийг тооцдог. Ганц фирм зах зээлийг бүхэлд нь хяналттай бол (монополь) HHI = 1. M тооны тэнцүү эзлэхүүнтэй фирм байвал HHI = 1/M.\"},{\"id\":74,\"question\":\"Топ-3 фирм (35%, 25%, 20% эзлэхүүнтэй) нэгдэлийн өмнө ба хамгийн том хоёр фирм нэгдсэний дараа HHI хэд болох вэ?\",\"answer\":\"Нэгдлийн өмнө: 0.35² + 0.25² + 0.20² = 0.225. Хамгийн том хоёр фирм нэгдсэний дараа (60%+20%+10%): 0.60² + 0.20² + 0.10² = 0.410 — мэдэгдэхүйц өссөн.\"},{\"id\":75,\"question\":\"HHI-ийн давуу, сул тал юу вэ, мөн яагаад зохицуулагчдын хувьд ашигтай байдаг вэ?\",\"answer\":\"HHI нь төвлөрлийн харьцаанаас илүү компаниудын нэгдлийг (merger) мэдрэх чадвартай (жишээ дээрх 0.225→0.410). Гэвч зах зээлд нэвтрэх саадыг, эрэлтийн уян хатан чанарыг тооцохгүй тул санхүүгийн шинжээчийн хувьд хязгаарлагдмал хэрэглэгддэг.\"}]},{\"id\":\"aggregate-output-prices-growth\",\"title\":\"Нэгдсэн бүтээгдэхүүн, үнэ, эдийн засгийн өсөлт\",\"cards\":[{\"id\":1,\"question\":\"Дотоодын нийт бүтээгдэхүүн (gross domestic product, GDP) гэж юу вэ, түүнийг хоёр ямар аргаар тодорхойлж болох вэ?\",\"answer\":\"GDP нь тодорхой хугацаанд тухайн эдийн засагт үйлдвэрлэсэн бүх эцсийн бараа, үйлчилгээний зах зээлийн үнийн дүн (output definition), эсвэл тэнцүүгээр, тухайн хугацаанд өрх гэр, компани, засгийн газрын олсон нэгдсэн орлого (income definition) юм. Тиймээс GDP-ийг орлогын арга (income approach) болон зарлагын арга (expenditure approach) хэмээх хоёр аргаар тооцож болно; тэнцвэрт байдалд эдгээр хоёр нь тэнцүү үр дүн өгдөг.\"},{\"id\":2,\"question\":\"Нэгдсэн бүтээгдэхүүн (aggregate output), нэгдсэн орлого (aggregate income) ба нэгдсэн зарлага (aggregate expenditure) яагаад тэнцүү байх ёстой вэ?\",\"answer\":\"Үйлдвэрлэсэн бүтээгдэхүүний үнэ цэнэ үргэлж үйлдвэрлэлийн хүчин зүйлсэд (хөдөлмөр, газар, капитал) орлого болж хуваарилагддаг тул нэгдсэн бүтээгдэхүүн нь нэгдсэн орлоготой тэнцүү байх ёстой. Мөн тухайн бүтээгдэхүүнийг худалдан авахад зарцуулсан нийт зарлага ч ижил хэмжээтэй байх ёстой тул гурван хэмжигдэхүүн нь зөвхөн нэг л хэмжигдэхүүнийг өөр өөр өнцгөөс харуулж байгаа юм.\"},{\"id\":3,\"question\":\"GDP-ийг тогтвортой, цаг хугацаа болон улс орны хооронд харьцуулахуйц байлгахын тулд баримталдаг гурван үндсэн шалгуур юу вэ?\",\"answer\":\"1) Зөвхөн тухайн хэмжилтийн хугацаанд үйлдвэрлэсэн бараа, үйлчилгээг тооцно (хуучин бараа, шилжүүлэг төлбөр, хөрөнгийн үнэ өсөлтийг хасна); 2) Зөвхөн зах зээлд худалдагддаг, үнийг нь объективоор тодорхойлж болох бараа, үйлчилгээг тооцно (гэрийн ажил, далд эдийн засаг, бохирдол зэргийг хасна); 3) Зөвхөн эцсийн бараа, үйлчилгээний (final goods and services) үнийг тооцож, завсрын бараа (intermediate goods)-ыг давхардуулан тооцохгүй.\"},{\"id\":4,\"question\":\"Эцсийн бараа (final goods) ба завсрын бараа (intermediate goods) ямар ялгаатай вэ, яагаад завсрын барааг GDP-д тусад нь тооцдоггүй вэ?\",\"answer\":\"Эцсийн бараа нь дахин зарагддаггүй бараа, завсрын бараа нь дахин зарагдах, эсвэл өөр бараа үйлдвэрлэхэд ашиглагддаг бараа юм. Завсрын барааны үнэ цэнийг тусад нь тооцохгүй, учир нь үйлдвэрлэлийн явцад нэмэгдсэн бүх өртгийг эцсийн борлуулалтын үнэ дотор аль хэдийн тусгасан байдаг тул давхар тооцоход хүргэнэ.\"},{\"id\":5,\"question\":\"Нэмэгдсэн өртгийн арга (sum of value added method) гэж юу вэ, GDP-тэй ямар хамааралтай вэ?\",\"answer\":\"Энэ арга бол үйлдвэрлэл, борлуулалтын процессын хэсэг бүр (мэтадаа тариачин, тээрэмчин, талхчин, худалдаачин) дээр нэмэгдсэн өртгийг (receipts – intermediate inputs) тооцож нийлбэрлэх арга юм. Бүх үе шатуудад нэмэгдсэн өртгийн нийлбэр нь эцсийн борлуулалтын үнэтэй (final sale price) тэнцүү байдаг бөгөөд энэ нь GDP-ийг хэмжих хоёр дахь арга болно.\"},{\"id\":6,\"question\":\"Эзэн нь ашигладаг орон сууц (owner-occupied housing) болон засгийн газрын үйлчилгээг GDP-д хэрхэн тооцдог вэ?\",\"answer\":\"Эдгээр нь зах зээлд шууд зарагддаггүй тул тооцогдсон (imputed) үнэ цэнийг ашигладаг. Гэрийнхээ эзэн нь өөртөө түрээс төлж байгаа мэт тооцоолж (imputed rent) GDP-д нэмдэг; засгийн газрын үйлчилгээг (цагдаа, шүүгч гэх мэт) зах зээлийн үнэгүй учир зөвхөн зардлаар (цалин хөлс) нэмэгдсэн өртгийг тооцохгүйгээр GDP-д оруулдаг.\"},{\"id\":7,\"question\":\"Далд эдийн засаг (underground economy) гэж юу вэ, энэ нь GDP-ийн статистикт ямар нөлөө үзүүлдэг вэ?\",\"answer\":\"Далд эдийн засаг нь татвараас зайлсхийх, эсвэл хууль бус байдлаасаа болж засгийн газраас нуудаг эдийн засгийн үйл ажиллагаа юм (жишээ нь, бичиг баримтгүй ажилчин, хууль бус мансууруулах бодисын худалдаа). Энэ нь албан ёсны GDP тооцооллоос гадуур байдаг тул улс орнуудын хооронд далд эдийн засгийн хувь хэмжээ эрс ялгаатай (АНУ-д 8%, Перу-д 60%) бөгөөд энэ нь албан ёсны GDP статистикийн найдвартай байдлыг улс орноор харьцуулахад анхаарах ёстой зүйл болгодог.\"},{\"id\":8,\"question\":\"Нэрлэсэн ДНБ (nominal GDP) болон бодит ДНБ (real GDP) ямар ялгаатай вэ, тэдгээрийг хэрхэн тооцдог вэ?\",\"answer\":\"Нэрлэсэн GDP нь тухайн үеийн зах зээлийн үнийг ашиглан тооцдог (Nominal GDPt = Pt × Qt), бодит GDP нь суурь жилийн тогтмол үнийг ашиглан тооцдог (Real GDPt = PB × Qt), энд Pt — тухайн жилийн үнэ, PB — суурь жилийн үнэ, Qt — тухайн жилийн хэмжээ юм. Бодит GDP зөвхөн бүтээгдэхүүний хэмжээний өөрчлөлтийг тусгадаг тул үнийн түвшний өөрчлөлтийн нөлөөг арилгасан байдаг.\"},{\"id\":9,\"question\":\"ДНБ дефлятор (GDP deflator) гэж юу вэ, түүний томъёо юу вэ?\",\"answer\":\"GDP deflator = (Value of current year output at current year prices / Value of current year output at base year prices) × 100. Энэ нь тус тус дараах байдлаар бичигддэг: GDP deflator = (Nominal GDP/Real GDP) × 100. Энэ нь эдийн засгийн бүхий л хэсгүүдийн үнийн түвшний нэгдсэн өөрчлөлтийг хэмждэг.\"},{\"id\":10,\"question\":\"Бодит ДНБ-ийг нэрлэсэн ДНБ ба дефляторын хамаарлаар хэрхэн илэрхийлдэг вэ?\",\"answer\":\"Real GDP = [Nominal GDP/(GDP deflator/100)]. Энэ харилцан хамаарал нь дефляторын нэрний үндэс бөгөөд нэрлэсэн GDP-г дефлятороор \\\"дефляцж\\\" инфляцийн нөлөөг арилгадаг гэсэн утгатай.\"},{\"id\":11,\"question\":\"Жилийн инфляцийн түвшинг GDP дефляторын тусламжтай хэрхэн тооцдог вэ?\",\"answer\":\"Инфляцийн түвшин = (тухайн жилийн дефлятор/өмнөх жилийн дефлятор) – 1. Жишээ нь, Канадын 2016 оны дефлятор 113.9, 2015 оны дефлятор 113.2 бол инфляцийн түвшин = (113.9/113.2) – 1 = 0.66%.\"},{\"id\":12,\"question\":\"Дотоодын нийт бүтээгдэхүүн (GDP) болон дотоодын нийт үндэсний бүтээгдэхүүн (gross national product, GNP) ямар ялгаатай вэ?\",\"answer\":\"GDP нь үйлдвэрлэлийн хүчин зүйлс нь хэнийх байхаас үл хамааран тухайн улсын нутаг дэвсгэр дотор үйлдвэрлэсэн бүтээгдэхүүнийг тооцдог. GNP нь харин тухайн улсынхаа иргэд, аж ахуйн нэгжийн эзэмшдэг хүчин зүйлсээр үйлдвэрлэсэн бүтээгдэхүүнийг тооцдог бөгөөд үйлдвэрлэл нь гадаад улс дотор явагддаг эсэхээс үл хамаарна.  ## ДНБ-ийн бүрдэл хэсгүүд (Components of GDP)\"},{\"id\":13,\"question\":\"Зарлагын аргаар GDP-ийг тооцох үндсэн томъёо юу вэ?\",\"answer\":\"GDP = C + I + G + (X – M) = (C + GC) + (I + GI) + (X – M), энд C — хэрэглэгчдийн зарлага, I — нийт хувийн дотоодын хөрөнгө оруулалт, G — засгийн газрын зарлага, X — экспорт, M — импорт юм.\"},{\"id\":14,\"question\":\"GDP-ийн зарлагын томъёоны C, I, G, X, M хувьсагчдыг тус тус тодорхойлно уу.\",\"answer\":\"C — эцсийн бараа, үйлчилгээнд зарцуулсан хэрэглэгчдийн зарлага; I — компаниудын капитал бараанд хийсэн хөрөнгө оруулалт (жишээ нь үл хөдлөх хөрөнгө, тоног төхөөрөмж) болон бараа материалын нөөцийн өөрчлөлт (inventory investment) зэргийг багтаасан нийт хувийн дотоодын хөрөнгө оруулалт; G — одоогийн хэрэглэл болон капитал бараанд хийх хөрөнгө оруулалтад зориулсан засгийн газрын зарлага (= GC + GI); X — экспорт; M — импорт.\"},{\"id\":15,\"question\":\"Өрхийн сектор өөрийн орлогыг хэрхэн хуваарилдаг вэ?\",\"answer\":\"Өрхүүд орлогоо хэрэглээнд (consumption, C) зарцуулах, эсвэл ирээдүйн хэрэглээнд зориулж хадгаламж (saving, S) хийх хоёр хуваарьтай хуваарилдаг. Хэрэглээний зарлага бараа, үйлчилгээний зах зээл дамжин бизнесийн сектор руу урсдаг, харин хадгаламж санхүүгийн зах зээлд орж бизнесийн зээлдэх, хувийн хөрөнгийн эх үүсвэр болдог.\"},{\"id\":16,\"question\":\"Нийт хөрөнгө оруулалт (gross investment) болон цэвэр хөрөнгө оруулалт (net investment) ямар ялгаатай вэ?\",\"answer\":\"Нийт хөрөнгө оруулалт нь элэгдсэн капиталын шинэчлэлт (replacement) болон шинэ хүчин чадал нэмэгдүүлэх хөрөнгө оруулалт хоёрыг багтаасан нийт дүн юм; цэвэр хөрөнгө оруулалт нь зөвхөн шинэ хүчин чадлын нэмэгдлийг л тусгадаг. GDP нь нийт хөрөнгө оруулалтыг (gross investment) тооцдог тул нэрэндээ \\\"нийт\\\" (gross) гэсэн үг агуулдаг.\"},{\"id\":17,\"question\":\"Засгийн газрын шилжүүлэг төлбөр (transfer payments) яагаад засгийн газрын зарлага (G)-д оруулагддаггүй вэ?\",\"answer\":\"Шилжүүлэг төлбөр нь засгийн газраас татварын орлогыг иргэдэд шууд мөнгөн хэлбэрээр буцаан шилжүүлэх бөгөөд үүний хариуд ямар нэгэн бараа, үйлчилгээ хүлээн авдаггүй тул G-д ороогүй. Гэхдээ эдгээр мөнгийг иргэд хэрэглээнд зарцуулах тул хэрэглээний зарлага (C) дотор, тэгэхдээ GDP-д тусгагдана.\"},{\"id\":18,\"question\":\"Худалдааны дефицит (trade deficit) гэж юу вэ, түүнийг хэрхэн санхүүжүүлдэг вэ?\",\"answer\":\"Худалдааны дефицит нь дотоод эдийн засаг нь гадаад бараа, үйлчилгээг гадаад улсын худалдан авалтаас илүү хэмжээгээр худалдан авч байгааг илэрхийлдэг, өөрөөр хэлбэл [(X – M) \u003c 0]. Энэ нь дотоодын хэмнэлт нь дотоодын хөрөнгө оруулалт болон засгийн газрын санхүүгийн балансыг санхүүжүүлэхэд хүрэлцэхгүй байгаа учраас гадаад улсаас зээл авч санхүүжүүлэх шаардлагатай болдог (гадаад капиталын орц, net foreign borrowing).\"},{\"id\":19,\"question\":\"Орлогын аргаар (income approach) GDP-ийг хэрхэн тооцдог вэ?\",\"answer\":\"GDP = Gross domestic income (GDI) = Net domestic income + Consumption of fixed capital (CFC) + Статистик зөрүү. Үүнд Gross domestic income = Compensation of employees + Gross operating surplus + Gross mixed income + Taxes less subsidies on production + Taxes less subsidies on products and imports гэж тооцогддог.\"},{\"id\":20,\"question\":\"Нийт үйл ажиллагааны илүүдэл (gross operating surplus) гэж юу вэ?\",\"answer\":\"Энэ бол корпорацийн ашигтай ойролцоо ойлголт бөгөөд хувийн корпораци, ашгийн төлөө бус корпораци, засгийн газрын корпорацийн орлогыг багтаадаг. Энэ нь түрээс, хүү, санхүүгийн хөрөнгийн зардлыг хасаагүй бол бизнесийн ашигласан капиталын нийт өгөөжийг хэмждэг (харин зөвхөн эзэмшигчдийн ашиг биш).\"},{\"id\":21,\"question\":\"Үл шууд бизнесийн татвар (indirect business taxes less subsidies) гэж юу вэ, хэрхэн хэмждэг вэ?\",\"answer\":\"Энэ нь эцсийн бараа, үйлчилгээний үнэд шингэсэн татвар болон татаасыг хасаж тооцсон дүн бөгөөд үндэсний орлогын шууд засгийн газарт очдог хэсгийг илэрхийлдэг. Үүнийг 1) \\\"бараа, импортын татвар, татаас\\\" (борлуулалтын татвар, түлшний татвар, импортын татаас зэрэг) болон 2) \\\"үйлдвэрлэлийн хүчин зүйлсийн татвар, татаас\\\" (хөрөнгийн татвар, цалингийн татвар зэрэг) гэж хоёр хэсэгт хуваадаг.\"},{\"id\":22,\"question\":\"Үндсэн хөрөнгийн элэгдэл (consumption of fixed capital, CFC) гэж юу вэ, GDI тооцоололд ямар үүрэгтэй вэ?\",\"answer\":\"CFC нь үйлдвэрлэлийн явцад капиталын нөөц элэгдэх (хуучрах) хэмжээг хэмждэг. Зарим орлого/бүтээгдэхүүн нь хуучирсан капиталыг нөхөхөд зориулагдах ёстой гэсэн баримжаа юм. GDP = Net domestic income + CFC + статистик зөрүү гэж тооцдог бөгөөд ашиг + CFC-ийг капиталаар олсон нийт илүүдэл гэж үзэж болно.  ## ДНБ, Үндэсний орлого, Хувийн орлого, Хувийн боломжит орлого (GDP, National Income, Personal Income, and Personal Disposable Income)\"},{\"id\":23,\"question\":\"Үндэсний орлого (national income, NI) гэж юу вэ, GDP-ээс хэрхэн гарган авдаг вэ?\",\"answer\":\"Үндэсний орлого нь эцсийн бүтээгдэхүүнийг үйлдвэрлэхэд оролцсон бүх хүчин зүйлийн хүлээн авсан орлого юм. Энэ нь GDP-ээс капиталын хэрэглэлийн зардал (depreciation, capital consumption allowance) болон статистик зөрүүг хассантай тэнцдэг.\"},{\"id\":24,\"question\":\"Хувийн орлого (personal income, PI) гэж юу вэ, Канадын статистикт энэ ойлголтыг юу гэж нэрлэдэг вэ?\",\"answer\":\"Хувийн орлого нь өрхийн нийт орлогын өргөн хэмжигдэхүүн бөгөөд хэрэглэгчдийн худалдан авах чадварыг хэмждэг тул хэрэглээний зарлагын гол тодорхойлогч хүчин зүйл юм. Канадын тооцоололд үүнийг \\\"Primary Household Income\\\" гэж нэрлэдэг бөгөөд цалин хөлс (compensation of employees), бие даасан бизнесийн цэвэр холимог орлого (net mixed income), цэвэр хөрөнгийн орлого (net property income)-ыг нийлбэрлэж тооцдог.\"},{\"id\":25,\"question\":\"Хувийн захиран зарцуулах орлого (personal disposable income, PDI; Канадад Household Disposable Income) гэж юу вэ?\",\"answer\":\"PDI нь хувийн орлогоос хувийн татварыг хассантай тэнцдэг (хэрэвээс практикт энэ нь хувийн нийт орлого хасах цэвэр шилжүүлэг төлбөр хэлбэрээр тооцогддог). Энэ нь өрхийнхөн хэрэглээ эсвэл хадгаламжид зарцуулж болох татвар хассан орлогын хэмжээг хэмждэг бөгөөд өрхийн зарлага, хадгаламжийн хамгийн чухал, нарийн ажиглагддаг орлогын хэмжүүр юм.\"},{\"id\":26,\"question\":\"Өрхийн цэвэр хадгаламж (household net saving) болон хадгаламжийн түвшин (saving rate)-ийг хэрхэн тооцдог вэ?\",\"answer\":\"Өрхийн цэвэр хадгаламж = PDI – Өрхийн эцсийн хэрэглээний зарлага + Тэтгэврийн эрхийн цэвэр өөрчлөлт. Хадгаламжийн түвшинг цэвэр хадгаламжийг PDI-д харьцуулсан хувиар (жишээ нь Канадын 2016 онд 40,108/1,152,542 = 3.48%) тооцдог.\"},{\"id\":27,\"question\":\"Primary household income (хувийн орлого) нь юунаас бүрддэг вэ?\",\"answer\":\"Үүнд 1) цалин хөлс (compensation of employees), 2) бие даасан бизнесийн цэвэр холимог орлого (net mixed income from unincorporated businesses), 3) цэвэр хөрөнгийн орлого (net property income) гэсэн гурван бүрдэл хэсэг багтдаг.  ## Нэгдсэн эрэлт (Aggregate Demand, AD)\"},{\"id\":28,\"question\":\"Нэгдсэн эрэлт (aggregate demand, AD) гэж юу вэ?\",\"answer\":\"Нэгдсэн эрэлт нь өрх гэр, бизнес, засгийн газар, гадаадын худалдан авагчид тухайн үнийн түвшинд худалдан авахыг хүссэн бараа, үйлчилгээний хэмжээг илэрхийлдэг. AD curve нь тэгшитгэл: 1) нэгдсэн зарлага нэгдсэн орлоготой тэнцэх (IS curve), 2) бодит мөнгөний нийлүүлэлтийг олон нийт хүсэн сэтгэлээр барьж байх (LM curve) гэсэн хоёр нөхцлийг хангасан орлого ба үнийн түвшнийг хослуулдаг.\"},{\"id\":29,\"question\":\"IS curve гэж юу вэ, түүний үндсэн тэгшитгэл юу вэ?\",\"answer\":\"IS curve нь орлого (төлөвлөгдсөн зарлага = бодит орлого)-ыг хангах орлого, бодит хүүгийн түвшний хослолуудыг илэрхийлдэг. Үндсэн тэгшитгэл: S = I + (G – T) + (X – M), энд S — нийт хувийн секторын хадгаламж, T — цэвэр татвар (= R – F). Энэ нь дотоод хувийн хадгаламж хэрхэн хөрөнгө оруулалт (I), засгийн газрын санхүүгийн алдагдал (G – T), гадаад улсад эсрэг санхүүгийн шаардлага бий болгоход (X – M) ашиглагддагийг харуулдаг.\"},{\"id\":30,\"question\":\"Хэрэглээний хязгаарын хандлага (marginal propensity to consume, MPC) болон хадгаламжийн хязгаарын хандлага (marginal propensity to save, MPS) гэж юу вэ, тэдгээрийн хамаарал юу вэ?\",\"answer\":\"MPC нь нэмэлт нэгж захиран зарцуулах орлогын хэдэн хувийг хэрэглэлд зарцуулдагийг илэрхийлдэг, MPS нь хэдэн хувийг хадгалдагийг илэрхийлдэг. MPS = 1 – MPC гэсэн хамааралтай байдаг, учир нь зарцуулагдаагүй орлого хадгаламж болдог.\"},{\"id\":31,\"question\":\"Хэрэглээний функц (consumption function) C = C(Y – T)-г хэрхэн тайлбарлах вэ?\",\"answer\":\"Хэрэглээ нь захиран зарцуулах орлого (GDP хасах цэвэр татвар)-ын функц байдаг. Иймд бодит орлогын өсөлт эсвэл татварын бууралт нь нийт хэрэглээг нэмэгдүүлнэ. Дэвшилтэт загварууд нь хэрэглээ нь одоогийн орлогоос гадна баялагаас (wealth) ч хамаардаг гэж үздэг.\"},{\"id\":32,\"question\":\"Хөрөнгө оруулалтын функц I = I(r, Y) нь ямар хоёр гол хүчин зүйлийг тусгадаг вэ?\",\"answer\":\"Хөрөнгө оруулалт нь бодит хүүгийн түвшин (r) — санхүүжилтийн зардал — бага байх үед өсдөг (буурах функц) бас нэгдсэн орлого (Y) — хөрөнгө оруулалтын хүлээгдэж буй ашигт чанарын орлуулагч — өндөр байх үед өсдөг (өсөх функц) хэмээн тодорхойлогддог.\"},{\"id\":33,\"question\":\"LM curve гэж юу вэ, мөнгөний тоо онолын тэгшитгэл (quantity theory of money equation) юу вэ?\",\"answer\":\"LM curve нь мөнгөний бодит дундаж үлдэгдлийн эрэлт, нийлүүлэлт тэнцэх (M/P = M(r,Y)) орлого ба хүүгийн түвшний хослолуудыг илэрхийлнэ. Мөнгөний тоо онолын тэгшитгэл: MV = PY, энд M — нэрлэсэн мөнгөний нийлүүлэлт, V — мөнгөний эргэлтийн хурд (velocity of money), P — үнийн түвшин, Y — бодит орлого юм.\"},{\"id\":34,\"question\":\"AD curve-ийг IS ба LM curve-ээс хэрхэн гарган авдаг вэ?\",\"answer\":\"IS ба LM curve хоёрыг нэгтгэх замаар AD curve-ийг олдог. Үнийн түвшин буурахад бодит мөнгөний нийлүүлэлт (M/P) нэмэгдэж LM curve баруун тийш шилжиж, тэгэх IS curve-тэй огтлолцох цэг нь өндөр орлого, бага хүүтэй болдог. Энэ нь үнийн түвшин ба орлогын хоорондын урвуу хамаарлыг тодорхойлдог бөгөөд энэ нь AD curve юм.\"},{\"id\":35,\"question\":\"AD curve нь яагаад буурах чиглэлтэй (доош налуу) байдаг вэ, ямар гурван сувгаар эрэлт, зарлагад нөлөөлдөг вэ?\",\"answer\":\"Үнийн түвшин нэмэгдэхэд: 1) бодит мөнгөний нийлүүлэлт багасаж хүү нэмэгддэг (хүүгийн суваг); 2) нэрлэсэн активын (мөнгөн хөрөнгө, бонд, хувьцаа) бодит үнэ цэнэ буурдаг (баялгийн нөлөө); 3) дотоодын бараа харьцангуй хямдаргаас илүү үнэтэй болж импортруу шилжих хандлага бий болдог (валютын арилжааны суваг). Эдгээр нь нэгдсэн зарлага, орлогыг бууруулдаг.\"},{\"id\":36,\"question\":\"Автомат тогтворжуулагч (automatic stabilizer) гэж юу вэ?\",\"answer\":\"Цэвэр татвар (T) нь орлогын (Y) нэмэгдэх (эсвэл буурах) функц байдаг учраас орлого нэмэгдэхэд санхүүгийн баланс (G – T) сайжирна (алдагдал багасна), орлого буурахад алдагдал нэмэгддэг. Энэ нь нэгдсэн бүтээгдэхүүний хэт хэлбэлзлийг бага зэрэг тэгшлэх, зөөлрүүлэх механизм болдог тул \\\"автомат тогтворжуулагч\\\" гэж нэрлэдэг.  ## Нэгдсэн нийлүүлэлт (Aggregate Supply, AS)\"},{\"id\":37,\"question\":\"Нэгдсэн нийлүүлэлт (aggregate supply, AS) гэж юу вэ?\",\"answer\":\"Нэгдсэн нийлүүлэлт нь үйлдвэрлэгчид тодорхой үнийн түвшинд нийлүүлэхээр бэлэн буй бараа, үйлчилгээний хэмжээг илэрхийлдэг. Энэ нь мөн өрхүүдийн бодит цалин, капиталын зардлын тодорхой түвшинд ажил хийх хөдөлмөр, капиталын хэмжээг тусгадаг.\"},{\"id\":38,\"question\":\"AS curve-ийн гурван хэвшил — маш богино хугацааны AS (VSRAS), богино хугацааны AS (SRAS), урт хугацааны AS (LRAS) ямар ялгаатай вэ?\",\"answer\":\"VSRAS нь хэвтээ (output хэлбэлзэх боловч үнэ тогтмол) — компаниуд богино хугацаанд үнээ өөрчлөхгүйгээр үйлдвэрлэлээ өсгөж/бууруулдаг. SRAS нь өсөх чиглэлтэй (upward sloping) — цалин, оруулгын үнэ хэсэгчлэн тогтмол тул үнийн өсөлт ашгийг нэмэгдүүлж үйлдвэрлэлийг өсгөдөг. LRAS нь босоо (vertical) — урт хугацаанд цалин, бусад оруулгын үнэ харьцангуйгаар тэнцвэржиж, зөвхөн ерийн үнийн түвшин өөрчлөгддөг бол бодит гарц өөрчлөгддөггүй.\"},{\"id\":39,\"question\":\"LRAS curve-ийн байрлалыг юу тодорхойлдог вэ, энэ нь ямар үйлдвэрлэлийн функцтэй холбоотой вэ?\",\"answer\":\"LRAS curve-ийн байрлалыг эдийн засгийн боломжит гарц (potential output) тодорхойлдог. Классик загвар: Y = F(K,L) = Ȳ, энд K — тогтмол капитал, L — боломжит хөдөлмөрийн нөөц. Боломжит ДНБ нь тогтмол капитал, хөдөлмөрийн нөөц, одоогийн технологиор тодорхойлогддог.\"},{\"id\":40,\"question\":\"Иж бүрэн ажил эрхлэлт (full employment, natural level of output) гэж юу вэ, байгалийн ажилгүйдлийн түвшин (natural rate of unemployment) гэж юу вэ?\",\"answer\":\"Иж бүрэн ажил эрхлэлтийн түвшин нь эдийн засаг үр ашигтай, саадгүй түвшинд ажилладаг түвшин бөгөөд компаниуд хүчин чадлын бэлэн нөөцтэй байж, ажил эрэлхийлэгч ажлын байртай тэнцүү хэмжээтэй тогтвортой, модест ажилгүйдэлтэй байдлыг илэрхийлдэг (байгалийн ажилгүйдлийн түвшин).\"},{\"id\":41,\"question\":\"Нэгж хөдөлмөрийн зардал (unit labor cost)-ийн өөрчлөлтийг хэрхэн тооцдог вэ, энэ нь SRAS-д хэрхэн нөлөөлдөг вэ?\",\"answer\":\"% Change in unit labor cost = % Change in nominal wages – % Change in productivity. Хэрэв цалин бүтээмжтэй хувь тэнцүү нэмэгдвэл нэгж хөдөлмөрийн зардал өөрчлөгдөхгүй тул SRAS шилжихгүй; цалин нь бүтээмжээс илүүтэй өсвөл нэгж зардал өсч SRAS зүүн тийш шилждэг, эсрэгээр бол баруун тийш шилждэг.  ## Нэгдсэн эрэлт, нийлүүлэлтийн шилжилт (Shifts in Aggregate Demand and Supply)\"},{\"id\":42,\"question\":\"AD curve-ийг баруун эсвэл зүүн тийш шилжүүлдэг үндсэн хүчин зүйлс юу вэ?\",\"answer\":\"Өрхийн баялаг (household wealth), хэрэглэгч ба бизнесийн хүлээлт (expectations), хүчин чадлын ашиглалт (capacity utilization), мөнгөний бодлого (monetary policy), ханшийн шилжилт (exchange rate), дэлхийн эдийн засгийн өсөлт (global growth), санхүүгийн бодлого (fiscal policy: засгийн газрын зарлага, татвар)-ын өөрчлөлт нь AD curve-ийг шилжүүлдэг.\"},{\"id\":43,\"question\":\"Баялгийн нөлөө (wealth effect) гэж юу вэ?\",\"answer\":\"Өрхийн эзэмшдэг санхүүгийн, бодит активын (жишээ нь хувьцаа, үл хөдлөх хөрөнгө) үнэ өсөхөд өрхүүд хадгаламжийн зорилтдоо хүрэхийн төлөө бага хэмжилттэй хадгалж, одоогийн орлогоосоо илүү хэмжээгээр зарцуулдаг. Энэ нь баялгийн өсөлт нь хэрэглэлийг нэмэгдүүлж AD curve-ийг баруун тийш, баялгийн бууралт — зүүн тийш шилжүүлдэг гэсэн ойлголт юм.\"},{\"id\":44,\"question\":\"Мөнгөний бодлого (monetary policy) AD curve-ийн шилжилтэд хэрхэн нөлөөлдөг вэ?\",\"answer\":\"Төв банк мөнгөний нийлүүлэлтийг (харилцан банкаас үнэт цаас худалдан авах, нөөцийн шаардлагын харьцаа бууруулах, банкуудын хоорондын зээлийн хүүгийн зорилтыг бууруулах зэргээр) нэмэгдүүлбэл, AD curve баруун тийш шилждэг (бага хүүгийн улмаас хөрөнгө оруулалт, хэрэглээ өсдөг). Мөнгөний нийлүүлэлтийг бууруулбал эсрэгээр, AD curve зүүн тийш шилждэг.\"},{\"id\":45,\"question\":\"Санхүүгийн бодлого (fiscal policy) AD curve-ийн шилжилтэд хэрхэн нөлөөлдөг вэ?\",\"answer\":\"Засгийн газрын зарлага нэмэгдвэл (G-ийн шууд өсөлт нь AD-ийн шууд бүрдэл хэсэг) AD curve баруун тийш шилждэг, зарлага буурвал зүүн тийш шилждэг. Татвар бууруулвал хэрэглэгчид, бизнесийн зарцуулж болох орлого нэмэгддэг тул AD curve баруун тийш, татвар нэмэгдвэл зүүн тийш шилждэг.\"},{\"id\":46,\"question\":\"SRAS curve-ийг шилжүүлдэг хүчин зүйлс юу вэ?\",\"answer\":\"Нэрлэсэн цалин (nominal wages), оруулгын (жишээ нь байгалийн баялгийн) үнэ (input prices), ирээдүйн гарцын үнэ, ерийн үнийн түвшнийг хэлэлцэх хүлээлт, бизнесийн татвар, татаас (business taxes and subsidies), ханшийн шилжилт (exchange rate) зэргийн өөрчлөлт SRAS curve-ийг шилжүүлдэг. Мөн LRAS-ийг шилжүүлдэг хүчин зүйлс SRAS-ийг ижил хэмжээгээр шилжүүлдэг.\"},{\"id\":47,\"question\":\"LRAS curve-ийг шилжүүлдэг хүчин зүйлс юу вэ?\",\"answer\":\"Хөдөлмөрийн нөөц ба хөдөлмөрийн чанарын (хүний капитал) өсөлт, байгалийн нөөцийн нийлүүлэлт, физик капиталын нийлүүлэлт, бүтээмж ба технологийн (productivity and technology) өсөлт зэрэг нь LRAS curve-ийг баруун тийш шилжүүлдэг. Эдгээр хүчин зүйлс нь эдийн засгийн нөөцийн баазыг нэмэгдүүлдэг.  ## Тэнцвэрт ДНБ, үнийн түвшин (Equilibrium GDP and Prices)\"},{\"id\":48,\"question\":\"Эдийн засгийн тэнцвэрийн дөрвөн боломжит хэлбэр юу вэ?\",\"answer\":\"1) Урт хугацааны иж бүрэн ажил эрхлэлт (long-run full employment); 2) Богино хугацааны уналтын цонх (short-run recessionary gap); 3) Богино хугацааны инфляцийн цонх (short-run inflationary gap); 4) Богино хугацааны стагфляци (short-run stagflation).\"},{\"id\":49,\"question\":\"Урт хугацааны тэнцвэрт (long-run equilibrium) ДНБ-ийн түвшин юунтай тэнцдэг вэ?\",\"answer\":\"AD curve ба SRAS curve LRAS curve дээр нэг цэгт огтлолцдог тохиолдолд эдийн засаг боломжит ДНБ-д байдаг. Энэ тохиолдолд хөдөлмөр, капитал хоёулаа иж бүрэн эрхлэгдсэн байдаг. Урт хугацаанд тэнцвэрт ДНБ нь боломжит ДНБ-тэй тэнцдэг.\"},{\"id\":50,\"question\":\"Уналтын цонх (recessionary gap) гэж юу вэ?\",\"answer\":\"AD curve зүүн тийш шилжиж богино хугацааны SRAS curve-тэй боломжит ДНБ-ээс доогуур түвшинд огтлолцоход уналтын цонх үүсдэг. Бодит ДНБ буурч, үнийн түвшин буурч, ажилгүйдэл нэмэгддэг. Уналтын цонх нь тэнцвэрт ДНБ боломжит ДНБ-ээс хэр бага байгааг хэмждэг.\"},{\"id\":51,\"question\":\"Инфляцийн цонх (inflationary gap) гэж юу вэ?\",\"answer\":\"AD нэмэгдэж эдийн засаг нь боломжит ДНБ-ээсээ давсан түвшинд тэнцвэртэй байгаа тохиолдолд инфляцийн цонх үүсдэг. Бодит ДНБ боломжит ДНБ-ээс өндөр байх хэмжээгээр хэмжигддэг бөгөөд үүний улмаас цалин, оруулгын үнэ дээш дарамтлагддаг.\"},{\"id\":52,\"question\":\"Стагфляци (stagflation) гэж юу вэ, юунаас үүдэлтэй байдаг вэ?\",\"answer\":\"Стагфляци нь өндөр инфляци болон өндөр ажилгүйдэл хамт явагддаг нөхцөл юм. Энэ нь нэгдсэн нийлүүлэлтийн бууралт (SRAS curve зүүн тийш шилжих)-аас шалтгаалдаг, жишээлбэл түүхий эдийн (тэр дундаа газрын тосны) гэнэтийн үнийн өсөлт. ДНБ буурч, боловч үнийн түвшин бууралгүй, харин өсдөг нь ердийн эрэлтээс үүдэлтэй уналтаас ялгаатай онцлог юм.\"},{\"id\":53,\"question\":\"AD, AS хоёулаа нэмэгдэх, эсвэл хоёулаа буурах, нэг нэмэгдэж нөгөө нь буурах тохиолдолд бодит ДНБ, үнийн түвшинд үзүүлэх нөлөө яаж тодорхойлогддог вэ?\",\"answer\":\"AD, AS хоёулаа нэмэгдэхэд бодит ДНБ нэмэгдэх нь тодорхой, харин үнийн түвшинд үзүүлэх нөлөө (indeterminate) аль нь илүү их нэмэгдсэнээс хамаарна. Хоёулаа буурахад бодит ДНБ буурах нь тодорхой, үнийн түвшний нөлөө тодорхойгүй. AD нэмэгдэж AS буурахад үнийн түвшин өсөх нь тодорхой, ДНБ-ийн нөлөө тодорхойгүй. AD буурч AS нэмэгдэхэд үнийн түвшин буурах нь тодорхой, ДНБ-ийн нөлөө тодорхойгүй.  ## Үйлдвэрлэлийн функц ба боломжит ДНБ (Production Function and Potential GDP)\"},{\"id\":54,\"question\":\"Хоёр хүчин зүйлтэй үйлдвэрлэлийн функц (production function) Y = AF(L,K)-ийг тайлбарлана уу.\",\"answer\":\"Y нь эдийн засгийн нэгдсэн гарц, L нь хөдөлмөрийн тоо хэмжээ (ажилчдын тоо), K нь капиталын нөөц (тоног төхөөрөмж, байгууламж), A нь технологийн мэдлэг, эсвэл нийт хүчин зүйлийн бүтээмж (total factor productivity, TFP)-ийг илэрхийлдэг. TFP нь хөдөлмөр, капиталын оруулгаар тооцоологдоогүй өсөлтийн тэр хэсгийг харуулдаг масштабын хүчин зүйл юм.\"},{\"id\":55,\"question\":\"Тогтмол өгөөж масштаб (constant returns to scale) гэж юу вэ?\",\"answer\":\"Бүх оруулгыг адил хувиар нэмэгдүүлбэл гарц ч мөн адил хувиар нэмэгддэг гэсэн шинжийг тогтмол өгөөж масштаб гэнэ. Жишээ нь, бүх оруулгыг хоёр дахин нэмэгдүүлбэл гарц ч хоёр дахин нэмэгддэг.\"},{\"id\":56,\"question\":\"Бууралттай хязгаарын бүтээмж (diminishing marginal productivity) гэж юу вэ?\",\"answer\":\"Бие даасан оруулгын тоо хэмжээг нэмэгдүүлэх тусам бусад оруулга тогтмол байхад тэр нэг оруулгын нэмэлт нэгжээс олдог нэмэлт гарц аажмаар багасдаг. Жишээ нь, тогтмол хэмжээтэй үйлдвэрт ажилчин нэмэх тусам ажилчин бүрийн нэмэлт гарц багасдаг.\"},{\"id\":57,\"question\":\"Капиталын гүнзгийрэлт (capital deepening) гэж юу вэ, яагаад тогтвортой өсөлтийн үндэс болж чадахгүй вэ?\",\"answer\":\"Капиталын гүнзгийрэлт нь хөдөлмөрт харьцуулан капиталын нөөцийг нэмэгдүүлэх хөрөнгө оруулалтыг хэлнэ. Капиталын хязгаарын бүтээмж буурдаг (diminishing marginal productivity of capital) учраас зөвхөн капиталыг нэмэгдүүлэх нь улам бага нэмэлт гарц үзүүлдэг тул өсөлт улам хурдгүй болдог — иймд урт хугацааны тогтвортой өсөлт зөвхөн капиталын гүнзгийрэлтэд тулгуурлаж чадахгүй, технологийн дэвшил (нийт хүчин зүйлийн бүтээмжийн өсөлт) шаардлагатай.\"},{\"id\":58,\"question\":\"Өсөлтийн тооцооллын тэгшитгэл (growth accounting equation) юу вэ?\",\"answer\":\"Growth in potential GDP = Growth in technology + WL (Growth in labor) + WC (Growth in capital), энд WL, WC нь тус тус хөдөлмөр, капиталын үндэсний орлогод эзлэх харьцангуй хувь юм (АНУ-д тус тус 0.7, 0.3 орчим байдаг).\"},{\"id\":59,\"question\":\"Хүн амд тэнцүүлсэн өсөлтийн тооцооллын тэгшитгэл (per capita growth accounting equation) юу вэ?\",\"answer\":\"Growth in per capita potential GDP = Growth in technology + WC (Growth in capital-to-labor ratio). Энэ нь АНУ-д капиталын хувь 0.3 байдаг тул ажилчин бүрт ногдох капитал 1% нэмэгдэхэд хувь хүнд ногдох гарц зөвхөн 0.3% л нэмэгддэг гэсэн утгатай.\"},{\"id\":60,\"question\":\"Нийт хүчин зүйлийн бүтээмжийн (TFP) өсөлтийг хэрхэн то
