tions\":[{\"id\":1,\"type\":\"multiple-choice\",\"question\":\"X財の需要曲線上の動き(movement along the demand curve)は、何の変化によって生じるか。\",\"options\":[{\"label\":\"a\",\"text\":\"所得。\"},{\"label\":\"b\",\"text\":\"X財の価格。\"},{\"label\":\"c\",\"text\":\"X財の代替財の価格。\"}],\"correct\":\"b\",\"explanation\":\"需要曲線は、財自体の価格のみの関数として需要量を表すものである。\"},{\"id\":2,\"type\":\"multiple-choice\",\"question\":\"ある携帯電話メーカーが、高い需要と好意的な評判を呼んだ次世代機種を発表した。複数の高速生産ラインを稼働させているにもかかわらず、発売から9か月経ってもこのメーカーは需要に対応できていない。この需要と供給の不均衡を最もよく説明する記述は次のうちどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"携帯電話の価格が均衡価格より低い。\"},{\"label\":\"b\",\"text\":\"競合他社が同じ価格で次世代機種を発表した。\"},{\"label\":\"c\",\"text\":\"消費者の所得がメーカーの予想よりも速く増加した。\"}],\"correct\":\"a\",\"explanation\":\"これは超過需要(excess demand)の状態であり、市場が供給された数量で均衡するためには企業が価格を引き上げる必要がある。\\n\\n## 需要の価格弾力性の種類\"},{\"id\":3,\"type\":\"multiple-choice\",\"question\":\"鉛筆挟みの需要曲線の価格弾力性係数が−1に等しい場合、需要は:\",\"options\":[{\"label\":\"a\",\"text\":\"弾力的である。\"},{\"label\":\"b\",\"text\":\"非弾力的である。\"},{\"label\":\"c\",\"text\":\"単位弾力的である。\"}],\"correct\":\"c\",\"explanation\":\"価格弾力性係数が−1のとき、需要は単位弾力的(unit elastic、unitary elasticとも呼ばれる)であるとされる。\"},{\"id\":4,\"type\":\"multiple-choice\",\"question\":\"ある地元フィットネスクラブの会員の需要は、次の式で表される:\\n\\nQ(hm,d) = 400 − 5P(hm)\\n\\nここでQ(hm,d)はフィットネスクラブの会員数、P(hm)は会員費である。会員費が$35の場合、需要の価格弾力性は最も近い値でいくらになるか。\",\"options\":[{\"label\":\"a\",\"text\":\"−0.778。\"},{\"label\":\"b\",\"text\":\"−0.500。\"},{\"label\":\"c\",\"text\":\"−0.438。\"}],\"correct\":\"a\",\"explanation\":\"$$35を式に代入すると、需要量はQ(hm,d) = 400 − 5(35) = 225となる。弾力性 = (ΔQ(hm,d)/ΔP(hm)) × (P(hm)/Q(hm,d)) = −5 × (35/225) = −0.778。\"},{\"id\":5,\"type\":\"multiple-choice\",\"question\":\"ある財の需要の価格弾力性が最も大きくなる可能性が高いのは、次のうちどの場合か。\",\"options\":[{\"label\":\"a\",\"text\":\"その財に代替財が存在しない。\"},{\"label\":\"b\",\"text\":\"消費者がその財を裁量的(discretionary)なものとみなしている。\"},{\"label\":\"c\",\"text\":\"消費者がその財に総予算のごく小さい割合しか費やしていない。\"}],\"correct\":\"b\",\"explanation\":\"消費者が裁量的とみなす財は、需要の弾力性が概して高くなる。\"},{\"id\":6,\"type\":\"multiple-choice\",\"question\":\"ある製品の所得需要の弾力性が−0.6である場合:\",\"options\":[{\"label\":\"a\",\"text\":\"所得が1%増加すると需要は0.6%増加する。\"},{\"label\":\"b\",\"text\":\"所得が1%増加すると需要は0.6%減少する。\"},{\"label\":\"c\",\"text\":\"所得が0.6%増加すると需要は1%減少する。\"}],\"correct\":\"b\",\"explanation\":\"所得需要の弾力性は、需要量が所得の変化にどの程度敏感であるかを測るものである。ある製品の所得需要の弾力性が−0.6であれば、所得が1%増加するごとに、その価格水準における需要量は0.6%減少する。したがって所得が増加するにつれて、消費者はその製品の購入量を減らすことになる。\"},{\"id\":7,\"type\":\"multiple-choice\",\"question\":\"ある消費者のタマネギの需要は次の式で表される:\\n\\nQ(o,d) = 3 − 0.05P(o) + 0.009I − 0.16P(t)\\n\\nここでQ(o,d)は需要されるタマネギの量、P(o)はタマネギ1キログラムあたりの価格、Iは家計所得、P(t)はトマト1キログラムあたりの価格である。タマネギの価格が$1.25、家計所得が$2,500、トマトの価格が$3.75の場合、タマネギの需要の交差価格弾力性(トマトの価格に対する)は最も近い値でいくらになるか。\",\"options\":[{\"label\":\"a\",\"text\":\"−1.0597。\"},{\"label\":\"b\",\"text\":\"−0.0242。\"},{\"label\":\"c\",\"text\":\"−0.0081。\"}],\"correct\":\"b\",\"explanation\":\"交差価格弾力性は、トマトの価格の変化に対してタマネギの需要がどのように反応するかを測るものである。式より:Q(o,d) = 3 − 0.05(1.25) + 0.009(2,500) − 0.16(3.75) = 24.8375。タマネギの価格$1.25、トマトの価格$3.75のとき、交差価格弾力性 = (ΔQ(o,d)/ΔP(t)) × (P(t)/Q(o,d)) = −0.16 × (3.75/24.8375) = −0.0242。\"},{\"id\":8,\"type\":\"multiple-choice\",\"question\":\"次の情報は問題8~11に関するものである。4年制私立大学の市場需要関数は次の式で与えられている:\\n\\nQ(pr,d) = 84 − 3.1P(pr) + 0.8I + 0.9P(pu)\\n\\nここでQ(pr,d)は年間の私立大学への出願者数(千人単位)、P(pr)は私立大学の平均学費(千ドル単位)、Iは家計の月収(千ドル単位)、P(pu)は公立(政府資金による)大学の平均学費(千ドル単位)である。P(pr) = 38、I = 100、P(pu) = 18とする。\\n\\n私立大学の需要の価格弾力性は最も近い値でいくらになるか。\",\"options\":[{\"label\":\"a\",\"text\":\"−3.1。\"},{\"label\":\"b\",\"text\":\"−1.9。\"},{\"label\":\"c\",\"text\":\"0.6。\"}],\"correct\":\"b\",\"explanation\":\"需要関数からQ(pr,d)を求めると:ΔQ(pr,d)/ΔP(pr) = −3.1(自己価格の係数)。Q(pr,d) = 84 − 3.1(38) + 0.8(100) + 0.9(18) = 62.4。P(pr) = 38のとき、価格弾力性 = (ΔQ(pr,d)/ΔP(pr)) × (P(pr)/Q(pr,d)) = (−3.1)(38/62.4) = −1.9。\"},{\"id\":9,\"type\":\"multiple-choice\",\"question\":\"私立大学の需要の所得弾力性は最も近い値でいくらになるか。\",\"options\":[{\"label\":\"a\",\"text\":\"0.5。\"},{\"label\":\"b\",\"text\":\"0.8。\"},{\"label\":\"c\",\"text\":\"1.3。\"}],\"correct\":\"c\",\"explanation\":\"需要関数より:ΔQ(pr,d)/ΔI = 0.8(所得変数の係数)。Q(pr,d) = 84 − 3.1(38) + 0.8(100) + 0.9(18) = 62.4。I = 100のとき、所得弾力性 = (ΔQ(pr,d)/ΔI)(I/Q(pr,d)) = (0.8)(100/62.4) = 1.3。\"},{\"id\":10,\"type\":\"multiple-choice\",\"question\":\"私立大学の需要の交差価格弾力性(公立大学の学費に対する)は最も近い値でいくらになるか。\",\"options\":[{\"label\":\"a\",\"text\":\"0.3。\"},{\"label\":\"b\",\"text\":\"3.1。\"},{\"label\":\"c\",\"text\":\"3.9。\"}],\"correct\":\"a\",\"explanation\":\"需要関数より:ΔQ(pr,d)/ΔP(pu) = 0.9(P(pu)の係数)。Q(pr,d) = 84 − 3.1(38) + 0.8(100) + 0.9(18) = 62.4。P(pr) = 38、P(pu) = 18のとき、交差価格弾力性 = (ΔQ(pr,d)/ΔP(pu))(P(pu)/Q(pr,d)) = (0.9)(18/62.4) = 0.3。\"},{\"id\":11,\"type\":\"multiple-choice\",\"question\":\"2つの財の交差価格弾力性が負である場合、この2つの財はどのような分類に属するか。\",\"options\":[{\"label\":\"a\",\"text\":\"正常財。\"},{\"label\":\"b\",\"text\":\"代替財。\"},{\"label\":\"c\",\"text\":\"補完財。\"}],\"correct\":\"c\",\"explanation\":\"補完財は、消費量が互いに同じ方向に増減する財である。交差価格弾力性が負である場合、一方の財の価格が上昇するともう一方の財の需要も減少するため、この2つの財は補完財に分類される。\\n\\n## 代替効果と所得効果\"},{\"id\":12,\"type\":\"multiple-choice\",\"question\":\"正常財の自己価格が下落する場合、次の記述のうち最も真実である可能性が高いのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"代替効果と所得効果はどちらも購入量を増加させる。\"},{\"label\":\"b\",\"text\":\"代替効果は購入量を増加させるが、所得効果は影響を与えない。\"},{\"label\":\"c\",\"text\":\"代替効果は購入量を増加させるが、所得効果は購入量を減少させる。\"}],\"correct\":\"a\",\"explanation\":\"正常財の場合、代替効果と所得効果はどちらも同じ方向に働き、互いを強め合う。そのため価格が下落すると購入量が増加する。\\n\\n## 正常財と劣等財\"},{\"id\":13,\"type\":\"multiple-choice\",\"question\":\"ギッフェン財(Giffen good)に当てはまるのは次のうちどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"需要曲線の傾きが正である。\"},{\"label\":\"b\",\"text\":\"代替効果が所得効果を上回る。\"},{\"label\":\"c\",\"text\":\"所得効果と代替効果がどちらも同じ方向に働く。\"}],\"correct\":\"a\",\"explanation\":\"ギッフェン財の場合、所得効果が代替効果を上回るため、財の価格が上昇すると需要も増加する。その結果、需要曲線の傾きが正になる。\\n\\n## 限界生産性と生産性\"},{\"id\":14,\"type\":\"multiple-choice\",\"question\":\"ある企業が追加の工場作業員を雇用する計画を立てている。短期において、次のうちどの場合に限界生産性の減少が最も起こりやすいか。\",\"options\":[{\"label\":\"a\",\"text\":\"工場が生産能力の上限で稼働している。\"},{\"label\":\"b\",\"text\":\"工場が労働力不足に直面している。\"},{\"label\":\"c\",\"text\":\"作業員が複数の役割を兼任する必要がある。\"}],\"correct\":\"a\",\"explanation\":\"限界生産性減少の法則は、一定量の資本に対して労働の投入を増やし続ける場合に、短期において現れる。工場が生産能力の上限で稼働している場合、追加の作業員を雇っても生産は増加しない。なぜなら物理的な設備がすでに完全に利用されているからである。追加の労働時間はコストを増やすだけで生産量を増やさず、その結果限界生産性が減少する。\"},{\"id\":15,\"type\":\"multiple-choice\",\"question\":\"ある企業の機械稼働時間と総生産量の生産関係は以下の通りである。\\n\\n機械稼働時間 · 総生産量 · 平均生産量\\n1 · 3 · 3.00\\n2 · 8 · 4.00\\n3 · 14 · 4.67\\n4 · 19 · 4.75\\n5 · 21 · 4.20\\n\\n限界生産性の減少はどの機械稼働時間から現れ始めるか。\",\"options\":[{\"label\":\"a\",\"text\":\"3。\"},{\"label\":\"b\",\"text\":\"4。\"},{\"label\":\"c\",\"text\":\"5。\"}],\"correct\":\"a\",\"explanation\":\"限界生産性の減少とは、投入の単位が増えるにつれて限界生産物が減少していくことを指す。限界生産物(追加1単位の投入から得られる追加の生産量)は次の通りである:\\n\\n機械稼働時間 · 総生産量 · 平均生産量 · 限界生産物\\n1 · 3 · 3.00 · 3\\n2 · 8 · 4.00 · 5\\n3 · 14 · 4.67 · 6\\n4 · 19 · 4.75 · 5\\n5 · 21 · 4.20 · 2\\n\\n3番目の機械稼働時間の限界生産物は6であり、これ以降減少していく。したがって限界生産性の減少は3番目の機械稼働時間以降に最初に現れる。\"},{\"id\":16,\"type\":\"multiple-choice\",\"question\":\"次の情報は問題16、17に関するものである。小規模製造企業のマネージャーが、企業の労働利用と生産に関する次の情報を収集した。\\n\\n表2\\n\\n労働(L) · 総生産量(TP)\\n0 · 0\\n1 · 150\\n2 · 320\\n3 · 510\\n4 · 660\\n5 · 800\\n\\n表2のデータを踏まえると、労働の平均生産物が最大となる作業員数は最も近い値でいくつか。\",\"options\":[{\"label\":\"a\",\"text\":\"3。\"},{\"label\":\"b\",\"text\":\"4。\"},{\"label\":\"c\",\"text\":\"5。\"}],\"correct\":\"a\",\"explanation\":\"3人の作業員のとき平均生産物は最大の170となる:AP = 510/3 = 170。\"},{\"id\":17,\"type\":\"multiple-choice\",\"question\":\"表2のデータを踏まえると、労働の限界生産物が増加する生産性(increasing returns)を示しているのは、作業員数が最も近い値でいくつのとき(ただし次の数を超えない)か。\",\"options\":[{\"label\":\"a\",\"text\":\"2。\"},{\"label\":\"b\",\"text\":\"3。\"},{\"label\":\"c\",\"text\":\"4。\"}],\"correct\":\"b\",\"explanation\":\"限界生産物とは、総生産量の変化を労働の変化に対して比で表したものである。作業員数が2人から3人に増えるとき、限界生産物は190である:MP = ΔTP/ΔL = (510 − 320)/(3 − 2) = 190/1 = 190。\\n\\n## 損益分岐点と操業停止点の分析\"},{\"id\":18,\"type\":\"multiple-choice\",\"question\":\"正常利益(normal profit)を最も正確に定義すると:\",\"options\":[{\"label\":\"a\",\"text\":\"経済的利益がゼロである状態。\"},{\"label\":\"b\",\"text\":\"総収入からすべての明示的(explicit)コストを差し引いた額。\"},{\"label\":\"c\",\"text\":\"会計上の利益と経済的利益の合計。\"}],\"correct\":\"a\",\"explanation\":\"正常利益とは、暗黙の機会コストがちょうど回収される水準の会計上の利益のことである。つまり、この水準では経済的利益がゼロに等しい。\"},{\"id\":19,\"type\":\"multiple-choice\",\"question\":\"スイスの特殊装置メーカーのマーケティング担当役員は、200単位の製品を販売すれば総収入CHF500,000を得られると見積もっている。一方、250単位を販売すれば総収入はCHF600,000になる。200単位ではなく250単位をマーケティングすることに関連する、1単位あたりの限界収入は最も近い値でいくらか。\",\"options\":[{\"label\":\"a\",\"text\":\"CHF 2,000。\"},{\"label\":\"b\",\"text\":\"CHF 2,400。\"},{\"label\":\"c\",\"text\":\"CHF 2,500。\"}],\"correct\":\"a\",\"explanation\":\"1単位あたりの限界収入は、総収入の変化を販売数量の変化に対して比で表したものである:MR = ΔTR ÷ ΔQ。この場合、総収入の変化はCHF100,000、販売単位の変化は50である。CHF100,000 ÷ 50 = CHF2,000。\"},{\"id\":20,\"type\":\"multiple-choice\",\"question\":\"完全競争市場で事業を行う農業企業が、食品メーカーおよび飼料メーカーに小麦を供給している。この企業が生産・販売を10%増加させた場合、最も明らかな結果は何か。\",\"options\":[{\"label\":\"a\",\"text\":\"総収入が10%増加する。\"},{\"label\":\"b\",\"text\":\"平均収入が10%増加する。\"},{\"label\":\"c\",\"text\":\"総収入が10%未満の割合で増加する。\"}],\"correct\":\"a\",\"explanation\":\"完全競争市場では、1社の供給の増加が市場価格に影響を与えない。したがって企業の販売数量の増加は、それに等しい割合の総収入の増加として表れる。\"},{\"id\":21,\"type\":\"multiple-choice\",\"question\":\"あるスキーリゾートの運営者が、平日のスキーパスの価格を下げる計画を立てている。通常価格€50では1日あたり300人の顧客がパスを購入すると予測されている。割引価格€40では1日あたり450人の顧客がパスを購入すると予測されている。割引価格を提示することによる、1人の顧客あたりの限界収入は最も近い値でいくらか。\",\"options\":[{\"label\":\"a\",\"text\":\"€20。\"},{\"label\":\"b\",\"text\":\"€40。\"},{\"label\":\"c\",\"text\":\"€50。\"}],\"correct\":\"a\",\"explanation\":\"1人の顧客あたりの限界収入は、総収入の変化を販売数量の変化に対して比で表したものである:MR = ΔTR ÷ ΔQ。この場合、1日あたりの総収入の変化は€3,000 [(450 × €40) − (300 × €50)]、販売数量の変化は150(450 − 300)である。€3,000 ÷ 150 = €20。\"},{\"id\":22,\"type\":\"multiple-choice\",\"question\":\"完全競争の条件下で事業を行う企業にとって、1単位あたりの限界収入は最も典型的には:\",\"options\":[{\"label\":\"a\",\"text\":\"平均収入と等しい。\"},{\"label\":\"b\",\"text\":\"平均収入より小さい。\"},{\"label\":\"c\",\"text\":\"平均収入より大きい。\"}],\"correct\":\"a\",\"explanation\":\"完全競争の条件下では、企業はどの販売数量においても価格支配力を持たない(プライステイカー)存在であるため、AR = MR = 価格となる。\"},{\"id\":23,\"type\":\"multiple-choice\",\"question\":\"次の情報は問題23~25に関するものである。ある企業の事業運営責任者が、生産量の異なる水準における企業のコスト構造について、次の情報を収集した。\\n\\n表1\\n\\n数量(Q) · 総固定費用(TFC) · 総可変費用(TVC)\\n0 · 200 · 0\\n1 · 200 · 100\\n2 · 200 · 150\\n3 · 200 · 200\\n4 · 200 · 240\\n5 · 200 · 320\\n\\n表1のデータを踏まえると、生産量が4単位のとき、平均固定費用(AFC)は最も近い値でいくらか。\",\"options\":[{\"label\":\"a\",\"text\":\"50。\"},{\"label\":\"b\",\"text\":\"60。\"},{\"label\":\"c\",\"text\":\"110。\"}],\"correct\":\"a\",\"explanation\":\"平均固定費用は、総固定費用を生産量で割ったものに等しい:AFC = TFC/Q = 200/4 = 50。\"},{\"id\":24,\"type\":\"multiple-choice\",\"question\":\"表1のデータを踏まえると、企業が生産を4単位から5単位に増やすとき、限界費用(MC)は最も近い値でいくらか。\",\"options\":[{\"label\":\"a\",\"text\":\"40。\"},{\"label\":\"b\",\"text\":\"64。\"},{\"label\":\"c\",\"text\":\"80。\"}],\"correct\":\"c\",\"explanation\":\"限界費用は、総費用の変化を生産量の変化に対して比で表したものである。MC = ΔTC/ΔQ = 80/1 = 80。\"},{\"id\":25,\"type\":\"multiple-choice\",\"question\":\"表1のデータを踏まえると、平均総費用(ATC)を最小にする生産量の水準は最も近い値でいくつか。\",\"options\":[{\"label\":\"a\",\"text\":\"3。\"},{\"label\":\"b\",\"text\":\"4。\"},{\"label\":\"c\",\"text\":\"5。\"}],\"correct\":\"c\",\"explanation\":\"平均総費用は、総費用を生産量で割ったものに等しい。5単位を生産するとき、平均総費用は104である:ATC = TC/Q = 520/5 = 104。\"},{\"id\":26,\"type\":\"multiple-choice\",\"question\":\"完全競争の条件下で事業を行う企業の短期生産における損益分岐点は、最も典型的には次のうちどの場合に発生するか。\",\"options\":[{\"label\":\"a\",\"text\":\"価格が平均総費用と等しいとき。\"},{\"label\":\"b\",\"text\":\"限界収入が限界費用と等しいとき。\"},{\"label\":\"c\",\"text\":\"限界収入が平均可変費用と等しいとき。\"}],\"correct\":\"a\",\"explanation\":\"完全競争の条件下では、価格は限界収入と等しい。企業は限界収入が平均総費用と等しくなるときに損益分岐する。\"},{\"id\":27,\"type\":\"multiple-choice\",\"question\":\"完全競争の条件下で事業を行う企業の短期操業停止点は、最も典型的には次のうちどの場合に発生するか。\",\"options\":[{\"label\":\"a\",\"text\":\"価格が平均総費用と等しいとき。\"},{\"label\":\"b\",\"text\":\"限界収入が限界費用と等しいとき。\"},{\"label\":\"c\",\"text\":\"限界収入が平均可変費用と等しいとき。\"}],\"correct\":\"c\",\"explanation\":\"限界収入が平均可変費用を下回る場合、企業は操業を停止すべきである。\"},{\"id\":28,\"type\":\"multiple-choice\",\"question\":\"完全競争の条件下では、企業の市場価格が次の曲線の最低点と等しいときに損益分岐する。\",\"options\":[{\"label\":\"a\",\"text\":\"平均総費用曲線。\"},{\"label\":\"b\",\"text\":\"平均可変費用曲線。\"},{\"label\":\"c\",\"text\":\"短期限界費用曲線。\"}],\"correct\":\"a\",\"explanation\":\"総収入と総費用が等しいとき、企業は損益分岐したとみなされる。完全競争の条件下では、企業の市場価格が平均総費用曲線の最低点と等しいときに損益分岐する。\"},{\"id\":29,\"type\":\"multiple-choice\",\"question\":\"総収入が次の総コストを下回る場合、企業は短期的に操業を停止する。\",\"options\":[{\"label\":\"a\",\"text\":\"固定費用。\"},{\"label\":\"b\",\"text\":\"可変費用。\"},{\"label\":\"c\",\"text\":\"機会コスト。\"}],\"correct\":\"b\",\"explanation\":\"総収入が総可変費用を下回るとき、企業は短期的に操業を停止する。\"},{\"id\":30,\"type\":\"multiple-choice\",\"question\":\"ある企業の総可変費用が$400万、固定費用が$300万である。この情報を踏まえると、企業が長期的に市場に留まるために総収入は最低限いくらである必要があるか。\",\"options\":[{\"label\":\"a\",\"text\":\"$$300万。\"},{\"label\":\"b\",\"text\":\"$$450万。\"},{\"label\":\"c\",\"text\":\"$$700万。\"}],\"correct\":\"c\",\"explanation\":\"企業は長期的に、総収入が総費用と等しいかそれを上回るときに市場に留まる。総費用は$700万($400万の可変費用、$300万の固定費用)であるため、企業が長期的に市場に留まるためには総収入が最低$700万である必要がある。\"},{\"id\":31,\"type\":\"multiple-choice\",\"question\":\"総収入が総可変費用より多く、総費用より少ない場合、短期的に企業が最も行う可能性が高い行動は何か。\",\"options\":[{\"label\":\"a\",\"text\":\"市場から退出する。\"},{\"label\":\"b\",\"text\":\"市場に留まる。\"},{\"label\":\"c\",\"text\":\"操業を停止する。\"}],\"correct\":\"b\",\"explanation\":\"総収入が可変費用を回収するのに十分であるが、固定費用全体を完全に回収するには不十分な場合、企業は短期的には存続できるが、長期的には財務的な健全性を維持できなくなる。\"},{\"id\":32,\"type\":\"multiple-choice\",\"question\":\"利益最大化の条件が最も当てはまらない可能性が高いのは次のうちどの場合か。\",\"options\":[{\"label\":\"a\",\"text\":\"平均総費用が最小のとき。\"},{\"label\":\"b\",\"text\":\"限界収入が限界費用と等しいとき。\"},{\"label\":\"c\",\"text\":\"総収入と総費用の差が最大のとき。\"}],\"correct\":\"a\",\"explanation\":\"平均総費用を最小にする数量は、利益を最大化する数量と必ずしも一致しない。\\n\\n## 規模の経済と規模の不経済\"},{\"id\":33,\"type\":\"multiple-choice\",\"question\":\"単位コストに変化がないまま生産量を増やした企業は、次のどの状況を示しているか。\",\"options\":[{\"label\":\"a\",\"text\":\"規模の経済。\"},{\"label\":\"b\",\"text\":\"規模の不経済。\"},{\"label\":\"c\",\"text\":\"規模に関して収穫一定。\"}],\"correct\":\"c\",\"explanation\":\"投入と同じ割合で生産量が増加することは、規模に関して収穫一定(constant returns to scale)のときに生じる。\"},{\"id\":34,\"type\":\"multiple-choice\",\"question\":\"企業は次のどの場合に規模の経済が働いているといえるか。\",\"options\":[{\"label\":\"a\",\"text\":\"生産量が増えるにつれて単位コストが上昇する。\"},{\"label\":\"b\",\"text\":\"長期平均総費用曲線の傾きが負である点で操業している。\"},{\"label\":\"c\",\"text\":\"長期平均総費用曲線の最低点を超えた位置で操業している。\"}],\"correct\":\"b\",\"explanation\":\"企業が生産量を増やすにつれて単位生産コストが低下する場合、規模の経済が生じる。グラフ上では、これは長期平均総費用曲線(LRAC)が負の傾きを持つことに相当する。\"},{\"id\":35,\"type\":\"multiple-choice\",\"question\":\"規模の不経済は最も典型的には次の原因から生じる。\",\"options\":[{\"label\":\"a\",\"text\":\"労働力の専門化。\"},{\"label\":\"b\",\"text\":\"事業機能や製品ラインの重複。\"},{\"label\":\"c\",\"text\":\"大量購入による資源価格の低下。\"}],\"correct\":\"b\",\"explanation\":\"企業が生産量を増やすと、事業機能や製品ラインの重複、あるいは煩雑化が生じることがあり、これが規模の不経済と平均総費用の上昇を引き起こす可能性がある。\"},{\"id\":36,\"type\":\"multiple-choice\",\"question\":\"完全競争産業において、最小効率規模(minimum efficient scale)を超える規模で操業している企業が、長期的に存続するために最も取るべき措置は何か。\",\"options\":[{\"label\":\"a\",\"text\":\"現在の生産水準を維持する。\"},{\"label\":\"b\",\"text\":\"規模の経済を得るために生産水準を増やす。\"},{\"label\":\"c\",\"text\":\"長期平均総費用曲線の最低点まで生産水準を減らす。\"}],\"correct\":\"c\",\"explanation\":\"長期的な最小効率規模を超える水準で操業する企業は、規模の不経済に陥っている。したがって生産水準を減らす計画を立てるべきである。\"},{\"id\":37,\"type\":\"multiple-choice\",\"question\":\"完全競争の条件下では、長期的に企業が最も典型的に得る利益は何か。\",\"options\":[{\"label\":\"a\",\"text\":\"正常利益。\"},{\"label\":\"b\",\"text\":\"正の経済的利益。\"},{\"label\":\"c\",\"text\":\"負の経済的利益。\"}],\"correct\":\"a\",\"explanation\":\"競争によって価格が長期限界費用まで押し下げられ、その結果、企業は正常利益のみを得ることになる。\\n\\n---\"}]},{\"id\":\"market-structures\",\"title\":\"企業と市場構造\",\"questions\":[{\"id\":1,\"type\":\"multiple-choice\",\"question\":\"売り手が多数存在し、各売り手がわずかな価格設定力を持ち、製品が差別化されている市場構造を最もよく表すものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"寡占\"},{\"label\":\"b\",\"text\":\"完全競争\"},{\"label\":\"c\",\"text\":\"独占的競争\"}],\"correct\":\"c\",\"explanation\":\"独占的競争は、多数の売り手、差別化された製品、そしてわずかな価格設定力によって特徴づけられる。\"},{\"id\":2,\"type\":\"multiple-choice\",\"question\":\"比較的少数の売り手が同質的、すなわち標準化された製品を取引する市場構造を最もよく表すものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"寡占\"},{\"label\":\"b\",\"text\":\"独占\"},{\"label\":\"c\",\"text\":\"完全競争\"}],\"correct\":\"a\",\"explanation\":\"同質的・標準化された製品を取引する少数の売り手は、寡占の特徴である。\"},{\"id\":3,\"type\":\"multiple-choice\",\"question\":\"次の市場構造のうち、競争企業が広告を差別化の手段として用いる可能性が最も低いのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"独占\"},{\"label\":\"b\",\"text\":\"完全競争\"},{\"label\":\"c\",\"text\":\"独占的競争\"}],\"correct\":\"b\",\"explanation\":\"完全競争市場では、生産される製品を広告やその他いかなる方法によっても差別化することができない。\\n\\n## 完全競争\"},{\"id\":4,\"type\":\"multiple-choice\",\"question\":\"完全競争市場の需要関数がP = 93 – 1.5Q(Q ≤ 62のとき)であり、この市場における各企業の長期コスト構造が以下のように与えられているとする。\\n\\n総コスト(Total cost): 256 + 2Q + 4Q²\\n平均コスト(Average cost): 256/Q + 2 + 4Q\\nマージナルコスト(Marginal cost): 2 + 8Q\\n\\n新規企業は、価格が次のうちどの水準を上回ったときに市場に参入する可能性が最も高いか。\",\"options\":[{\"label\":\"a\",\"text\":\"8\"},{\"label\":\"b\",\"text\":\"66\"},{\"label\":\"c\",\"text\":\"81\"}],\"correct\":\"b\",\"explanation\":\"長期の競争的均衡は、各企業においてMC = AC = Pとなるときに成立する。MCをACと等しいとすると、2 + 8Q = 256/Q + 2 + 4Qとなる。これをQについて解くとQ = 8。マージナルコストを価格と等しいとすると、P = 2 + 8Q = 66となる。66を上回る価格では必ず経済的利益が発生する(P = MC \u003e ACとなるため)ので、新規企業が市場に参入する。\"},{\"id\":5,\"type\":\"multiple-choice\",\"question\":\"企業が明確に定義された供給関数を持つ可能性が最も高い市場構造はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"寡占\"},{\"label\":\"b\",\"text\":\"完全競争\"},{\"label\":\"c\",\"text\":\"独占的競争\"}],\"correct\":\"b\",\"explanation\":\"完全競争市場で事業を行う企業は、市場が決定する価格を受け入れるしかない(プライステイカー)。このような企業では、マージナルコスト曲線がそのまま供給関数を表す。\"},{\"id\":6,\"type\":\"multiple-choice\",\"question\":\"完全競争市場で企業が経済的利益を得ている場合、長期的に供給曲線が最も起こりやすいのはどの動きか。\",\"options\":[{\"label\":\"a\",\"text\":\"左方向へ移動する\"},{\"label\":\"b\",\"text\":\"右方向へ移動する\"},{\"label\":\"c\",\"text\":\"変化せずそのままである\"}],\"correct\":\"b\",\"explanation\":\"経済的利益は新規参入者を市場に呼び込み、既存の企業には生産能力を拡大する動機を与える。\\n\\n## 独占的競争\"},{\"id\":7,\"type\":\"multiple-choice\",\"question\":\"独占的競争市場で事業を行う企業が利益を最大化する可能性が最も高い生産量の水準はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"平均コストを最小化する水準\"},{\"label\":\"b\",\"text\":\"マージナル収入が平均コストに等しい水準\"},{\"label\":\"c\",\"text\":\"マージナル収入がマージナルコストに等しい水準\"}],\"correct\":\"c\",\"explanation\":\"利益を最大化する生産量の水準は、マージナル収入がマージナルコストに等しくなる水準である。\\n\\n## 寡占\"},{\"id\":8,\"type\":\"multiple-choice\",\"question\":\"Aquarius社は自社市場における支配的企業であり、価格先導者(price leader)である。市場内の別の企業が、Aquarius社の設定した価格より低い価格を設定し、市場シェアを拡大しようとしている。この結果、Aquarius社の市場シェアは最も高い確率でどうなるか。\",\"options\":[{\"label\":\"a\",\"text\":\"増加する\"},{\"label\":\"b\",\"text\":\"減少する\"},{\"label\":\"c\",\"text\":\"変化せずそのままである\"}],\"correct\":\"a\",\"explanation\":\"価格が下がるにつれて、小規模な企業はコストを下回る価格で販売することを嫌がり市場から退出するため、価格先導者であるAquarius社の市場シェアは増加する。\"},{\"id\":9,\"type\":\"multiple-choice\",\"question\":\"SigmaSoft社とThetaTech社は、コンピュータシステム用ソフトウェアを製造する大手企業である。この市場は2つのセグメントから構成されている。すなわち、価格に非常に敏感な需要を持つ大規模なマスマーケットのセグメントと、価格に比較的敏感でないパフォーマンス重視の小規模なセグメントである。SigmaSoft社の製品は技術的により先進的であると評価されている。各社は次の2つの戦略のうち一つを選択できる。\\n\\n- オープンアーキテクチャ(Open): マスマーケットをターゲットにし、他のソフトウェア供給業者が自社のプラットフォーム上で製品を開発できるようにする。\\n- 専有(Proprietary、Prop): 自社のソフトウェアのみが自社のプラットフォーム上で動作することを許可する。\\n\\n各社が選択する戦略に応じて、利益は次のように決まる。\\n\\n · ThetaTech — オープン(Open) · ThetaTech — 専有(Prop)\\nSigmaSoft — オープン(Open) · SigmaSoft: 400 / ThetaTech: 600 · SigmaSoft: 800 / ThetaTech: 300\\nSigmaSoft — 専有(Prop) · SigmaSoft: 650 / ThetaTech: 700 · SigmaSoft: 600 / ThetaTech: 400\\n\\nこれらの企業のナッシュ均衡(Nash equilibrium)は何か。\",\"options\":[{\"label\":\"a\",\"text\":\"SigmaSoftは専有戦略、ThetaTechは専有戦略\"},{\"label\":\"b\",\"text\":\"SigmaSoftはオープンアーキテクチャ、ThetaTechは専有戦略\"},{\"label\":\"c\",\"text\":\"SigmaSoftは専有戦略、ThetaTechはオープンアーキテクチャ\"}],\"correct\":\"c\",\"explanation\":\"ナッシュモデルでは、各企業は戦略を選択する際に相手企業の反応を考慮に入れる。均衡状態では、どの企業も単独で戦略を変える動機を持たない。ThetaTechにとっては、SigmaSoftがどちらを選んでも、オープンアーキテクチャを選ぶ方が有利である。この選択を踏まえると、SigmaSoftにとっては専有プラットフォームを選ぶ方が有利になる。したがって、どちらの企業も一方的に決定を変えることはない。\"},{\"id\":10,\"type\":\"multiple-choice\",\"question\":\"寡占の価格設定戦略は、最も高い確率でどのような需要曲線をもたらすか。\",\"options\":[{\"label\":\"a\",\"text\":\"屈折した(kinked)需要曲線\"},{\"label\":\"b\",\"text\":\"垂直な(vertical)需要曲線\"},{\"label\":\"c\",\"text\":\"水平な(horizontal)需要曲線\"}],\"correct\":\"a\",\"explanation\":\"寡占企業は2つの異なる需要構造に直面する。一つは価格が上昇する場合、もう一つは価格が下落する場合である。競争企業は価格の下落には追随する傾向があるが、価格の上昇には追随しない。その結果、屈折した需要曲線が生じる。\"},{\"id\":11,\"type\":\"multiple-choice\",\"question\":\"次のうち、市場で談合(collusion)が行われる可能性が最も低いのはどの場合か。\",\"options\":[{\"label\":\"a\",\"text\":\"製品が同質的である場合\"},{\"label\":\"b\",\"text\":\"企業が同程度の市場シェアを持つ場合\"},{\"label\":\"c\",\"text\":\"企業のコスト構造が同一である場合\"}],\"correct\":\"b\",\"explanation\":\"企業が同程度の市場シェアを持つ場合、競争の力が談合によって得られる利益を上回ってしまう。\"},{\"id\":12,\"type\":\"multiple-choice\",\"question\":\"時間の経過とともに、寡占市場の支配的企業の市場シェアは最も高い確率でどうなるか。\",\"options\":[{\"label\":\"a\",\"text\":\"増加する\"},{\"label\":\"b\",\"text\":\"減少する\"},{\"label\":\"c\",\"text\":\"変化せずそのままである\"}],\"correct\":\"b\",\"explanation\":\"支配的企業が得る利益は他社の市場参入を促すため、支配的企業の市場シェアは減少する傾向がある。\\n\\n## 独占と価格差別\"},{\"id\":13,\"type\":\"multiple-choice\",\"question\":\"Upsilon Natural Gas社は非常に高い参入障壁を持つ独占企業である。同社のマージナルコストは$40、平均コストは$70である。実施された市場調査により、需要の価格弾力性は1.5と判明した。同社は最も高い確率で価格をいくらに設定するか。\",\"options\":[{\"label\":\"a\",\"text\":\"$$40\"},{\"label\":\"b\",\"text\":\"$$70\"},{\"label\":\"c\",\"text\":\"$$120\"}],\"correct\":\"c\",\"explanation\":\"利益が最大化するのはMR = MCのときである。独占企業の場合、MR = P[1 – 1/Ep]である。これをMCと等しいとしてPを求めると、$40 = P[1 – (1/1.5)] = P × 0.333となり、したがってP = $120となる。\"},{\"id\":14,\"type\":\"multiple-choice\",\"question\":\"許認可を受けた独占企業を規制する政府機関は、最も高い確率でどの指標に基づいて規制価格を設定するか。\",\"options\":[{\"label\":\"a\",\"text\":\"マージナルコスト\"},{\"label\":\"b\",\"text\":\"長期平均コスト\"},{\"label\":\"c\",\"text\":\"第一種価格差別\"}],\"correct\":\"b\",\"explanation\":\"これにより、投資家は自らが負うリスクの大きさに見合った正常な収益(normal return)を得ることができる。\\n\\n## 市場構造の識別方法\"},{\"id\":15,\"type\":\"multiple-choice\",\"question\":\"あるアナリストが、ある産業について次の市場シェアに関するデータを収集した。\\n\\n企業 · 売上(百万ユーロ)\\nABC · 300\\nBrown · 250\\nCoral · 200\\nDelta · 150\\nErie · 100\\nその他すべて · 50\\n\\nこの産業における上位4社の集中率(four-company concentration ratio)はおおよそいくらか。\",\"options\":[{\"label\":\"a\",\"text\":\"71%\"},{\"label\":\"b\",\"text\":\"86%\"},{\"label\":\"c\",\"text\":\"95%\"}],\"correct\":\"b\",\"explanation\":\"産業内の上位4社が総売上の86%を占めている。(300 + 250 + 200 + 150)/(300 + 250 + 200 + 150 + 100 + 50) = 900/1050 = 86%。\"},{\"id\":16,\"type\":\"multiple-choice\",\"question\":\"あるアナリストが、5社から構成される産業について次の市場シェアに関するデータを収集した。\\n\\n企業 · 市場シェア(%)\\nZeta · 35\\nYusef · 25\\nXenon · 20\\nWaters · 10\\nVlastos · 10\\n\\nこの産業における上位3社のハーフィンダール・ハーシュマン指数(Herfindahl–Hirschmann Index)はおおよそいくらか。\",\"options\":[{\"label\":\"a\",\"text\":\"0.185\"},{\"label\":\"b\",\"text\":\"0.225\"},{\"label\":\"c\",\"text\":\"0.235\"}],\"correct\":\"b\",\"explanation\":\"上位3社のハーフィンダール・ハーシュマン指数は、0.35² + 0.25² + 0.20² = 0.225である。\"},{\"id\":17,\"type\":\"multiple-choice\",\"question\":\"ハーフィンダール・ハーシュマン指数の欠点の一つは、この指数が何を反映していないことか。\",\"options\":[{\"label\":\"a\",\"text\":\"計算が難しいこと\"},{\"label\":\"b\",\"text\":\"低い参入障壁を反映していないこと\"},{\"label\":\"c\",\"text\":\"産業内の合併(mergers)の影響を反映していないこと\"}],\"correct\":\"b\",\"explanation\":\"ハーフィンダール・ハーシュマン指数は、現在市場に存在する企業の市場力を制約しうる低い参入障壁を反映していない。\"},{\"id\":18,\"type\":\"multiple-choice\",\"question\":\"3社から構成され、ブランドの認知度や特許による保護を持たず、容易に模倣できる製品を生産する小規模な生産者からなる産業において、企業行動を最もよく説明するモデルは次のうちどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"寡占\"},{\"label\":\"b\",\"text\":\"完全競争\"},{\"label\":\"c\",\"text\":\"独占的競争\"}],\"correct\":\"b\",\"explanation\":\"参入の信頼できる脅威(credible threat of entry)が価格を低い水準に保ち、現存する多数の企業は差別化されていない製品を提供している。\"},{\"id\":19,\"type\":\"multiple-choice\",\"question\":\"Deep River Manufacturing社は、食品を生産する産業に存在する多数の企業の一つである。Deep River社の製品は、ラベルを貼る段階まではすべて同一である。Deep River社は、自社ブランドを1単位あたり$2.20で生産し、さらに7つの異なる食品スーパーチェーン向けの「ハウスブランド」を1単位あたり$2.00で生産している。各食品スーパーチェーンは、Deep River社のブランドと自社のハウスブランドの両方を販売している。Deep River社の市場を最もよく表すものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"寡占\"},{\"label\":\"b\",\"text\":\"完全競争\"},{\"label\":\"c\",\"text\":\"独占的競争\"}],\"correct\":\"c\",\"explanation\":\"市場には多数の競争企業が存在するものの、Deep River社のブランドとハウスブランドの価格差から見て、ある程度の製品差別化が存在する。\\n\\n---\"}]},{\"id\":\"aggregate-output-prices-growth\",\"title\":\"総生産、物価、経済成長\",\"questions\":[{\"id\":1,\"type\":\"multiple-choice\",\"question\":\"国内総生産(GDP)を定義した次の説明のうち、最も適切なものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"価値を検証できるすべての家計、企業、政府が受け取った総所得。\"},{\"label\":\"b\",\"text\":\"一定期間にその経済で生産されたすべての最終財・サービスに支出された総額。\"},{\"label\":\"c\",\"text\":\"一定期間にその経済で生産された、再販売可能な財および最終財・サービスの総市場価値。\"}],\"correct\":\"b\",\"explanation\":\"GDPを定義する2つの等価な方法は所得アプローチと支出アプローチであり、Bの回答は支出アプローチ(最終財・サービスへの総支出)によってGDPを正しく定義している。Aは誤り。所得は「検証される」必要はなく、GDPには自己所有住宅の推定賃貸料のように市場で間接的にしか決まらない所得も含まれるからである。Cは誤り。GDPは最終財・サービスのみを計上するため、「再販売可能な」(中間)財を含めると二重計算になってしまう。\"},{\"id\":2,\"type\":\"multiple-choice\",\"question\":\"国内総生産(GDP)の測定に含まれる可能性が最も低い構成要素はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"自己所有住宅の推定(imputed)賃貸料の価値。\"},{\"label\":\"b\",\"text\":\"地方警察官の年間給与。\"},{\"label\":\"c\",\"text\":\"生産に伴って生じた環境被害。\"}],\"correct\":\"c\",\"explanation\":\"GDPは市場で取引される、つまり客観的に評価できる財・サービスのみを計上するため、環境被害のような外部性(externality)は除外される。Aは市場で直接売買されないものの、推定(imputed)賃貸料としてGDPに計上される。Bは政府サービスの費用(人件費)としてGDPに計上される。\"},{\"id\":3,\"type\":\"multiple-choice\",\"question\":\"次のうち、どれが当年のカナダのGDPに計上されるか。計上される市場価格は次の通り:\",\"options\":[{\"label\":\"a\",\"text\":\"アメリカ国民がカナダ国内で栽培したブドウの市場価格。\"},{\"label\":\"b\",\"text\":\"日本で生産され、カナダで販売された電子消費財の市場価格。\"},{\"label\":\"c\",\"text\":\"カナダの映画監督がカナダ国外で製作した映画の市場価格。\"}],\"correct\":\"a\",\"explanation\":\"GDPは生産要素が誰のものであるかにかかわらず、その国の領土内で行われた生産のみを計上する(どこで生産されたかに依存し、誰が所有しているかには依存しない)。したがって、アメリカ国民がカナダ国内で生産したブドウはカナダのGDPに計上される。Bは日本の領土内で生産されたため日本のGDPに計上される(カナダには輸入となる)。Cはカナダ国外で生産されたため、カナダのGDPではなくカナダのGNPに計上される。\"},{\"id\":4,\"type\":\"multiple-choice\",\"question\":\"2018年に絵画を描き、5,000ポンドで売却したとする。その絵を描くのにかかった費用は2,000ポンドであった。付加価値合計法(sum-of-value-added method)でGDPを計算する場合、絵画を完成させる最終段階で付加された価値はいくらになるか。\",\"options\":[{\"label\":\"a\",\"text\":\"2,000ポンド。\"},{\"label\":\"b\",\"text\":\"3,000ポンド。\"},{\"label\":\"c\",\"text\":\"5,000ポンド。\"}],\"correct\":\"b\",\"explanation\":\"付加価値法による最終段階の付加価値 = 販売価格 − 中間投入(intermediate inputs)の費用 = 5,000ポンド − 2,000ポンド = 3,000ポンド。\"},{\"id\":5,\"type\":\"multiple-choice\",\"question\":\"GDPデフレーターが1より小さいことは、経済がどのような状態にあることを示すか。\",\"options\":[{\"label\":\"a\",\"text\":\"インフレ。\"},{\"label\":\"b\",\"text\":\"デフレ。\"},{\"label\":\"c\",\"text\":\"スタグフレーション。\"}],\"correct\":\"b\",\"explanation\":\"GDPデフレーター = 名目GDP/実質GDP。この比率が1より小さい場合、名目GDPが実質GDPより小さい、つまり現在の価格が基準年の価格より低いことを意味する——これはデフレ(価格水準の低下)を示す指標である。\"},{\"id\":6,\"type\":\"multiple-choice\",\"question\":\"名目GDP(nominal GDP)の最も適切な定義はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"現在の価格で表した総支出の尺度。\"},{\"label\":\"b\",\"text\":\"一定の価格で表した財・サービスの価値。\"},{\"label\":\"c\",\"text\":\"ある国の経済を他国と比較するための尺度。\"}],\"correct\":\"a\",\"explanation\":\"名目GDPはその時点の市場価格で計算される(Nominal GDPt = Pt × Qt)ため、これは現在の価格で表した総支出の尺度である。Bは実質GDPの定義(一定/基準年の価格による)である。Cは誤り。国家間の比較には通常、追加的な調整(為替レート、購買力パリティ)が必要であり、名目GDP自体はそのまま比較の尺度にはならない。\"},{\"id\":7,\"type\":\"multiple-choice\",\"question\":\"10年間の初めと終わりの間で、X国の最終財・サービスの年間価値は1,000億ユーロから3,000億ユーロに増加した。この期間にGDPデフレーターは111から200に上昇した。この10年間でX国の実質GDPはおよそ何パーセント増加したか。\",\"options\":[{\"label\":\"a\",\"text\":\"50%。\"},{\"label\":\"b\",\"text\":\"67%。\"},{\"label\":\"c\",\"text\":\"200%。\"}],\"correct\":\"b\",\"explanation\":\"実質GDP = (名目GDP/デフレーター)×100。初め: (100/111)×100 ≈ 90.1; 終わり: (300/200)×100 = 150。増加率 = (150−90.1)/90.1 ≈ 66.5%、つまりおよそ67%。\"},{\"id\":8,\"type\":\"multiple-choice\",\"question\":\"1年目と2年目のGDPデフレーターの値がそれぞれ190、212.8であった場合、物価全体の水準の年間上昇率を最もよく表しているのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"5.8%。\"},{\"label\":\"b\",\"text\":\"6%。\"},{\"label\":\"c\",\"text\":\"12%。\"}],\"correct\":\"c\",\"explanation\":\"インフレ率 = (当年のデフレーター/前年のデフレーター) − 1 = (212.8/190) − 1 = 1.12 − 1 = 0.12 = 12%。\"},{\"id\":9,\"type\":\"multiple-choice\",\"question\":\"GDP価格デフレーターの計算式における分子(numerator)の部分は何を表すか。\",\"options\":[{\"label\":\"a\",\"text\":\"基準年の生産物を現在の価格で表した価値。\"},{\"label\":\"b\",\"text\":\"当年の生産物を現在の価格で表した価値。\"},{\"label\":\"c\",\"text\":\"当年の生産物を基準年の価格で表した価値。\"}],\"correct\":\"b\",\"explanation\":\"GDPデフレーター = (当年の生産物を現在の価格で表した価値 / 当年の生産物を基準年の価格で表した価値) × 100。分子(numerator)の部分は当年の生産物を現在(当年)の価格で表した値、つまり名目GDPである。\\n\\n## GDPの構成要素\"},{\"id\":10,\"type\":\"multiple-choice\",\"question\":\"次の条件のうち、ある国のGDPを増加させる可能性が最も低いものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"純輸出の増加。\"},{\"label\":\"b\",\"text\":\"資本財への投資の増加。\"},{\"label\":\"c\",\"text\":\"政府の移転支払いの増加。\"}],\"correct\":\"c\",\"explanation\":\"移転支払い(例えば年金、給付金)は財・サービスの購入の対価として支払われるものではないため、GDPの支出式(G)に直接反映されない。したがって移転支払いの増加自体が直接GDPを増加させることはない。一方、A(純輸出)とB(投資)はいずれもGDP = C+I+G+(X−M)という式の直接の構成要素であるため、その増加は直接GDPを増加させる。\\n\\n## GDP・国民所得・個人所得・個人可処分所得\"},{\"id\":11,\"type\":\"multiple-choice\",\"question\":\"以下のある国のおおよそのデータを考えてみよう。\\n\\n項目 · 金額(兆ドル)\\n消費(Consumption) · 15.0\\n資本消耗費(Capital consumption allowance) · 1.5\\n政府支出(Government spending) · 3.8\\n輸入(Imports) · 1.7\\n総民間国内投資(Gross private domestic investment) · 4.0\\n輸出(Exports) · 1.5\\n\\n上記の情報のみに基づくと、国内総生産(GDP)と国民所得(NI)それぞれに最も近い数値はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"21.1 と 20.6。\"},{\"label\":\"b\",\"text\":\"22.6 と 21.1。\"},{\"label\":\"c\",\"text\":\"22.8 と 20.8。\"}],\"correct\":\"b\",\"explanation\":\"GDP = C + I + G + (X−M) = 15.0 + 4.0 + 3.8 + (1.5−1.7) = 22.6。国民所得 = GDP − 資本消耗費 = 22.6 − 1.5 = 21.1。したがってGDP=22.6、NI=21.1がBの回答に合致する。\"},{\"id\":12,\"type\":\"multiple-choice\",\"question\":\"当年の個人所得(personal income)を計算する際、次のうち国民所得から差し引かれないのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"間接事業税。\"},{\"label\":\"b\",\"text\":\"未分配の法人利益。\"},{\"label\":\"c\",\"text\":\"個人事業の純所得。\"}],\"correct\":\"c\",\"explanation\":\"個人事業(unincorporated business、すなわち自営業者)の純所得は、直接個人に分配される所得であるため、個人所得の計算にすでに含まれており、差し引く必要がない。一方、A(間接事業税)は政府に渡る部分であるため差し引かれ、B(未分配の法人利益)は個人にまだ渡っていない所得であるため、これも差し引かれる。\\n\\n## 総需要(AD)\"},{\"id\":13,\"type\":\"multiple-choice\",\"question\":\"総支出と総生産が等しいことは、政府の財政赤字が何に等しいことを意味するか。\",\"options\":[{\"label\":\"a\",\"text\":\"民間貯蓄 − 投資 − 純輸出。\"},{\"label\":\"b\",\"text\":\"民間貯蓄 − 投資 + 純輸出。\"},{\"label\":\"c\",\"text\":\"投資 − 民間貯蓄 + 純輸出。\"}],\"correct\":\"a\",\"explanation\":\"IS曲線の基本方程式: S = I + (G−T) + (X−M)。ここで(G−T)は政府の財政赤字である。これを(G−T)について解くと: (G−T) = S − I − (X−M) = 民間貯蓄 − 投資 − 純輸出。\"},{\"id\":14,\"type\":\"multiple-choice\",\"question\":\"不動産価格が急落したことにより、家計部門は可処分所得のうち貯蓄に回す割合を増やした。生産量と投資支出が変化しないと仮定すると、次のうち最も起こりやすいのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"政府の財政赤字が減少する。\"},{\"label\":\"b\",\"text\":\"純輸出が減少し、資本の流入が増加する。\"},{\"label\":\"c\",\"text\":\"純輸出が増加し、資本の流出が増加する。\"}],\"correct\":\"c\",\"explanation\":\"S = I + (G−T) + (X−M)という関係から、生産量(Y)、投資(I)、政府の財政バランス(G−T)が変化しない場合、民間貯蓄(S)の増加は純輸出(X−M)の増加によってのみ均衡する。貿易収支の黒字が増加することは、その国が海外に対して純貸付を行っている(資本の流出が増加している)ことを意味する。\"},{\"id\":15,\"type\":\"multiple-choice\",\"question\":\"所得と実質金利の水準の組み合わせのうち、計画支出が所得と等しくなる組み合わせを表すのはどの曲線か。\",\"options\":[{\"label\":\"a\",\"text\":\"IS曲線。\"},{\"label\":\"b\",\"text\":\"LM曲線。\"},{\"label\":\"c\",\"text\":\"総需要曲線(AD曲線)。\"}],\"correct\":\"a\",\"explanation\":\"IS曲線は定義上、「計画支出 = 所得」という条件を満たす所得と実質金利の組み合わせを表す。LM曲線は貨幣市場の均衡を表し、AD曲線はISとLMを統合した所得と価格水準の関係を表す。\"},{\"id\":16,\"type\":\"multiple-choice\",\"question\":\"政府支出の増加は次のうちどの曲線をシフトさせるか。\",\"options\":[{\"label\":\"a\",\"text\":\"IS曲線とLM曲線。\"},{\"label\":\"b\",\"text\":\"IS曲線と総需要曲線(AD曲線)。\"},{\"label\":\"c\",\"text\":\"LM曲線と総需要曲線(AD曲線)。\"}],\"correct\":\"b\",\"explanation\":\"政府支出(G)はIS曲線を規定する方程式の直接の変数であるため、Gが増加するとIS曲線は右にシフトする。IS曲線がシフトすると、LM曲線が一定の場合、AD曲線(ISとLMの統合)もシフトする。一方、LM曲線は貨幣供給量や価格水準に依存するため、Gが変化してもシフトしない。\"},{\"id\":17,\"type\":\"multiple-choice\",\"question\":\"名目マネーサプライの増加は次のうちどの曲線をシフトさせるか。\",\"options\":[{\"label\":\"a\",\"text\":\"IS曲線とLM曲線。\"},{\"label\":\"b\",\"text\":\"IS曲線と総需要曲線(AD曲線)。\"},{\"label\":\"c\",\"text\":\"LM曲線と総需要曲線(AD曲線)。\"}],\"correct\":\"c\",\"explanation\":\"マネーサプライ(M)はLM曲線を規定する(M/P = M(r,Y))ため、マネーサプライが増加するとLM曲線は右にシフトする。LM曲線がシフトすると、IS曲線が一定の場合、AD曲線もシフトする。IS曲線はマネーサプライに直接依存しないためシフトしない。\"},{\"id\":18,\"type\":\"multiple-choice\",\"question\":\"価格水準の上昇は次のうちどの曲線をシフトさせるか。\",\"options\":[{\"label\":\"a\",\"text\":\"IS曲線。\"},{\"label\":\"b\",\"text\":\"LM曲線。\"},{\"label\":\"c\",\"text\":\"総需要曲線(AD曲線)。\"}],\"correct\":\"b\",\"explanation\":\"LM曲線は実質マネーサプライ(M/P)に基づいているため、名目マネーサプライ(M)が一定のまま価格水準(P)が上昇すると実質マネーサプライが減少し、LM曲線は左にシフトする。IS曲線は価格水準に直接依存しない。AD曲線自体は価格水準を軸にとっているため、価格水準の変化はAD曲線上の移動として表れ、曲線自体はシフトしない。\"},{\"id\":19,\"type\":\"multiple-choice\",\"question\":\"総需要曲線に沿って価格水準が低下する場合、金利はどのように動く可能性が最も高いか。\",\"options\":[{\"label\":\"a\",\"text\":\"低下する。\"},{\"label\":\"b\",\"text\":\"上昇する。\"},{\"label\":\"c\",\"text\":\"変化しない。\"}],\"correct\":\"a\",\"explanation\":\"価格水準が低下すると実質マネーサプライ(M/P)が増加してLM曲線が右にシフトし、これにより均衡金利が低下し、所得が増加する。したがって、AD曲線に沿って価格水準が低下することは金利の低下を伴って起こる。\\n\\n## 総供給(AS)\"},{\"id\":20,\"type\":\"multiple-choice\",\"question\":\"完全雇用、すなわち自然生産水準を最もよく表しているのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"現在の資源で到達可能な最大限の水準。\"},{\"label\":\"b\",\"text\":\"利用可能なすべての労働者が自分の技能に合った仕事を持っている水準。\"},{\"label\":\"c\",\"text\":\"新しい職へ移動する、緩やかで安定した規模の失業者を含む水準。\"}],\"correct\":\"c\",\"explanation\":\"完全雇用とは「失業率ゼロ」を意味するのではなく、新しい職を求めて移動している(摩擦的・構造的)、緩やかで安定した規模の失業者を含む自然失業率の水準を指す。Aは誤り。これは上限のない最大水準を表し、安定的ではない。Bは誤り。実際には、利用可能な労働者全員が常に自分の技能に見合った仕事を持っているわけではない。\"},{\"id\":21,\"type\":\"multiple-choice\",\"question\":\"短期(1〜2年)の総供給曲線(SRAS)を最もよく表しているのはどれか。短期総供給曲線は:\",\"options\":[{\"label\":\"a\",\"text\":\"水平であり、短期では生産量が価格より弾力的だから。\"},{\"label\":\"b\",\"text\":\"垂直であり、賃金やその他の投入価格が価格水準に完全に調整されるから。\"},{\"label\":\"c\",\"text\":\"右上がりであり、短期では投入価格が価格水準に完全には調整されないから。\"}],\"correct\":\"c\",\"explanation\":\"短期では賃金やその他の投入価格が部分的に固定(sticky)されているため、価格水準が上昇すると実質投入コストが相対的に低下し、これが利益を増やし生産を増加させる動機となる。そのためSRASは右上がりになる。Bは長期AS(LRAS)の特徴であり、Aは理由付けが誤っている。\"},{\"id\":22,\"type\":\"multiple-choice\",\"question\":\"賃金が価格水準の変化に自動的に調整される場合、短期総供給曲線(SRAS)はどのようになる可能性が最も高いか。\",\"options\":[{\"label\":\"a\",\"text\":\"より緩やかになる(フラットになる)。\"},{\"label\":\"b\",\"text\":\"より急になる(steeper)。\"},{\"label\":\"c\",\"text\":\"変化しない。\"}],\"correct\":\"b\",\"explanation\":\"SRASが右上がりになる理由は、賃金や投入価格が短期では価格水準に完全には調整されないことにある。賃金が自動的に完全調整されるのであれば、SRASはLRASと同様に垂直(より急)になる。なぜなら、価格水準の変化は実質賃金や実質投入コストに影響を与えず、名目値のみを変化させるため、生産量は変化しないからである。\\n\\n## 総需要と総供給の変化\"},{\"id\":23,\"type\":\"multiple-choice\",\"question\":\"総需要の減少を引き起こす可能性が最も低い要因はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"税の増加。\"},{\"label\":\"b\",\"text\":\"自国通貨の下落(為替レートの下落)。\"},{\"label\":\"c\",\"text\":\"生産能力の利用率の低下。\"}],\"correct\":\"b\",\"explanation\":\"自国通貨が下落すると、国内財が海外から見て相対的に安くなり輸出が増加し、輸入はより割高になり減少するため、純輸出(X−M)が増加する——これは総需要を減少させるのではなく、むしろ増加させる傾向がある。A(税の増加)は可処分所得を減らし消費を減少させ、C(生産能力の利用率の低下)は企業の投資意欲を減退させる——この2つはいずれも総需要を実際に減少させる。\"},{\"id\":24,\"type\":\"multiple-choice\",\"question\":\"長期総供給曲線(LRAS)を左にシフトさせる可能性が最も高い要因はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"名目賃金の上昇。\"},{\"label\":\"b\",\"text\":\"生産性の低下。\"},{\"label\":\"c\",\"text\":\"法人税の増加。\"}],\"correct\":\"b\",\"explanation\":\"LRASの位置は潜在GDP(労働、資本、技術/生産性の資源)によって決まる。生産性の低下は潜在的な生産量を直接減少させ、LRASを左にシフトさせる。A(名目賃金)は短期の投入コストにすぎないためSRASをシフトさせるが、LRASはシフトさせない。C(法人税)も主にSRASをシフトさせる要因(事業税・補助金)であるため、LRASを直接シフトさせる最も直接的な要因は生産性の変化である。\"},{\"id\":25,\"type\":\"multiple-choice\",\"question\":\"家計の富の増加は何を増加させる可能性が最も高いか。\",\"options\":[{\"label\":\"a\",\"text\":\"家計の貯蓄。\"},{\"label\":\"b\",\"text\":\"投資支出。\"},{\"label\":\"c\",\"text\":\"消費支出。\"}],\"correct\":\"c\",\"explanation\":\"富の効果(wealth effect)によると、家計が保有する金融資産・実物資産(株式、不動産など)の価値が上昇すると、家計は貯蓄目標にすでに近づいていると感じ、現在の所得以上に消費に支出する傾向が強まる。したがって富が増加すると消費支出が増加し、一方で貯蓄は減少する。\\n\\n## 均衡GDPと物価水準\"},{\"id\":26,\"type\":\"multiple-choice\",\"question\":\"総供給と総需要の両方が増加する場合、起こる可能性が最も高い結果はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"インフレの上昇。\"},{\"label\":\"b\",\"text\":\"雇用の増加。\"},{\"label\":\"c\",\"text\":\"名目GDPの増加。\"}],\"correct\":\"b\",\"explanation\":\"ADとASの両方が増加する場合、実質GDPの増加は確実(両方の効果が生産量を増加させる方向に働く)であるが、価格水準への影響(どちらがより大きく増加するかに依存する)は不確定(indeterminate)である。実質生産量の増加には雇用全体の増加が伴う——より多くの財・サービスを生産するためには追加の労働力が必要になるからである。一方、インフレ(A)と名目GDP(C)はいずれも価格水準の方向が不確定であることから、不確定なままである。\"},{\"id\":27,\"type\":\"multiple-choice\",\"question\":\"総需要のシフトから生じる可能性が最も低い結果はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"スタグフレーション。\"},{\"label\":\"b\",\"text\":\"景気後退ギャップ。\"},{\"label\":\"c\",\"text\":\"インフレギャップ。\"}],\"correct\":\"a\",\"explanation\":\"スタグフレーション(高インフレと高失業が同時に発生すること)は、通常、総供給の減少(例えば原材料価格の急激な上昇によるSRAS曲線の左シフト)から生じるものであり、総需要のシフトから生じるものではない。一方、景気後退ギャップ(B、ADの左シフト)とインフレギャップ(C、ADの右シフト)は、いずれも総需要のシフトの直接的かつ一般的な結果である。\"},{\"id\":28,\"type\":\"multiple-choice\",\"question\":\"エネルギー価格が急激に上昇した後、物価の全体水準が短期的に上昇する可能性が最も高く、かつ:\",\"options\":[{\"label\":\"a\",\"text\":\"中央銀行が強い政策を実施しない限り、自律的に、かつ不確定な期間にわたって高いままとどまる。\"},{\"label\":\"b\",\"text\":\"マネーサプライが増加しない限り、長期的には変化せず元の水準に戻る。\"},{\"label\":\"c\",\"text\":\"すべての価格が同じ割合で上昇するまで上昇を続ける。\"}],\"correct\":\"b\",\"explanation\":\"エネルギー価格の上昇ショックは(SRAS曲線の左シフトを通じて)短期的に価格水準を一時的に上昇させるが、マネーサプライを増加させてその高い価格水準を「後押し」しない限り、貨幣数量説(MV=PY)に従って価格水準は長期的には元の水準に戻る——実質マネーサプライの減少が需要を圧縮し、経済が徐々に潜在GDPに戻るのと同時に、価格が下落する圧力にさらされるからである。マネーサプライを増加させる場合にのみ、高い価格水準が持続することになる。\\n\\n## 生産関数と潜在GDP\"},{\"id\":29,\"type\":\"multiple-choice\",\"question\":\"新古典派(ソロー)成長モデルにおいて、全要素生産性(TFP)の成長は何の増加を表すか。\",\"options\":[{\"label\":\"a\",\"text\":\"規模の収穫(returns to scale)。\"},{\"label\":\"b\",\"text\":\"一定量の投入から得られる生産量。\"},{\"label\":\"c\",\"text\":\"持続可能な成長率。\"}],\"correct\":\"b\",\"explanation\":\"生産関数 Y = AF(K,L)において、A(TFP)は労働・資本の投入では直接説明できない技術水準を表す規模要因である。TFPの増加は、一定量の労働・資本の投入からより多くの生産量が得られることを意味する、つまり一定の投入から得られる生産量が増加するということである。\"},{\"id\":30,\"type\":\"multiple-choice\",\"question\":\"ある経済研究機関が、新古典派成長モデルに基づき、過去データから次の方程式を推定した:\\n\\n潜在生産量の成長率 = 1.5 + 0.72 × 労働の成長率 + 0.28 × 資本の成長率\\n\\nこの方程式の定数項(1.5)を最も適切に解釈すると:\",\"options\":[{\"label\":\"a\",\"text\":\"長期の持続可能な成長率。\"},{\"label\":\"b\",\"text\":\"全要素生産性の成長率。\"},{\"label\":\"c\",\"text\":\"継続する可能性が低い、トレンドを上回る過去の成長。\"}],\"correct\":\"b\",\"explanation\":\"成長会計方程式(growth accounting equation)では: 潜在GDPの成長 = 技術の成長(TFP) + WL×労働の成長 + WC×資本の成長。労働・資本の成長率に係数を掛けた項を除いた定数項(intercept)は、まさにTFPの成長率を表す——なぜなら、労働・資本の成長がゼロであっても、定数項によって表される成長が残り、それは技術/生産性の成長のみに起因するはずだからである。\"},{\"id\":31,\"type\":\"multiple-choice\",\"question\":\"上記の方程式における労働の成長率の係数(0.72)を最も適切に解釈すると:\",\"options\":[{\"label\":\"a\",\"text\":\"労働力参加率。\"},{\"label\":\"b\",\"text\":\"労働の限界生産性。\"},{\"label\":\"c\",\"text\":\"労働の取り分(労働に帰属する所得の割合)。\"}],\"correct\":\"c\",\"explanation\":\"成長会計方程式における労働・資本の成長率の係数(WL、WC)は、それぞれ労働・資本が国民所得に占める相対的な取り分を表す(例えば米国ではおよそ0.7、0.3)。したがって0.72は労働の取り分(ウェイト)を表す。\\n\\n## 経済成長の源泉\"},{\"id\":32,\"type\":\"multiple-choice\",\"question\":\"先進国の間で、経済成長の源泉のうち、多くの場合その優れた成長実績を説明する可能性が最も高いのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"技術。\"},{\"label\":\"b\",\"text\":\"資本ストック。\"},{\"label\":\"c\",\"text\":\"労働力。\"}],\"correct\":\"a\",\"explanation\":\"先進国では資本の深化が限界生産性の減少に直面するため、資本ストックの増加だけでは長期的に優れた成長を獲得することはできない。したがって技術進歩(TFPの成長)が、限界生産性の減少を乗り越える唯一の手段であり、先進国の成長実績の差を説明する主要な要因となる。\"},{\"id\":33,\"type\":\"multiple-choice\",\"question\":\"発展途上国と先進国の所得が時間とともに収束(convergence)する現象は、何によって生じる可能性が最も高いか。\",\"options\":[{\"label\":\"a\",\"text\":\"全要素生産性。\"},{\"label\":\"b\",\"text\":\"資本の限界生産性の減少。\"},{\"label\":\"c\",\"text\":\"再生不可能な資源の枯渇。\"}],\"correct\":\"b\",\"explanation\":\"資本ストックが相対的に少ない発展途上国では資本の限界生産性(収益性)が高くなる(資本の限界生産性の減少の原理による)ため、資本(海外からの投資)がそうした国々に流入する動機が生まれ、これが発展途上国の成長速度を先進国よりも速め、時間の経過とともに所得差が縮小する(収束する)現象を引き起こす。\\n\\n## 持続可能な成長の指標\"},{\"id\":34,\"type\":\"multiple-choice\",\"question\":\"次のうち、直接測定できる量はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"潜在GDP。\"},{\"label\":\"b\",\"text\":\"労働生産性。\"},{\"label\":\"c\",\"text\":\"全要素生産性。\"}],\"correct\":\"b\",\"explanation\":\"労働生産性 = 実質GDP/総労働時間という式により、いずれも直接観察可能な(observable)データから直接計算できるため、直接測定が可能である。一方、潜在GDPと全要素生産性(TFP)はいずれも直接観察できず(unobserved)、複数の仮定に基づいて残差(residual)として計算されるため、直接測定することはできない。\"},{\"id\":35,\"type\":\"multiple-choice\",\"question\":\"持続可能な成長率(sustainable growth rate)を最もよく計算する方法はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"資本と労働の成長率の加重平均。\"},{\"label\":\"b\",\"text\":\"労働力の成長率 + 労働生産性の成長率。\"},{\"label\":\"c\",\"text\":\"全要素生産性の成長率 + 資本・労働比率の成長率。\"}],\"correct\":\"b\",\"explanation\":\"潜在GDPとTFPは直接観察できないため、それらに基づく方法(A、C)は実務上直接計算することが難しい。一方、労働力と労働生産性はいずれも直接観察可能であるため、労働力の長期成長率と労働生産性の長期成長率の合計によって持続可能な成長率を計算するのが、実務上最も現実的な方法である。\\n\\n---\"}]},{\"id\":\"business-cycles\",\"title\":\"景気循環の理解\",\"questions\":[{\"id\":1,\"type\":\"multiple-choice\",\"question\":\"景気循環の谷、拡張、山、縮小といった局面に共通する特徴は何か。\",\"options\":[{\"label\":\"a\",\"text\":\"周期的(periodic)である。\"},{\"label\":\"b\",\"text\":\"繰り返し発生する(recurrent)。\"},{\"label\":\"c\",\"text\":\"同程度の期間を持つ傾向がある。\"}],\"correct\":\"b\",\"explanation\":\"景気循環の局面は時間の経過とともに繰り返し発生する。\"},{\"id\":2,\"type\":\"multiple-choice\",\"question\":\"景気循環の縮小(contraction)局面において、最も生じやすいのは次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"インフレ指標は安定している。\"},{\"label\":\"b\",\"text\":\"経済全体の活動が低下する。\"},{\"label\":\"c\",\"text\":\"投資家の政府証券への需要が低下する。\"}],\"correct\":\"b\",\"explanation\":\"縮小期には経済全体の動向が総じて悪化する。\"},{\"id\":3,\"type\":\"multiple-choice\",\"question\":\"経済の山(peak)と最も密接に関連するのは次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"加速するインフレ。\"},{\"label\":\"b\",\"text\":\"安定した失業率。\"},{\"label\":\"c\",\"text\":\"減少する資本支出。\"}],\"correct\":\"a\",\"explanation\":\"山の時点ではインフレが上昇する。\"},{\"id\":4,\"type\":\"multiple-choice\",\"question\":\"景気循環における労働力活用の典型的なパターンに基づくと、生産性(1時間当たりの生産量)が最も高くなりやすいのはどの時期か。\",\"options\":[{\"label\":\"a\",\"text\":\"ブームの絶頂期。\"},{\"label\":\"b\",\"text\":\"拡張が進んだ時期。\"},{\"label\":\"c\",\"text\":\"後退の谷の時点。\"}],\"correct\":\"c\",\"explanation\":\"後退の終わり頃には、企業は最小限の人員で最大の生産量を上げる「リーン生産(lean production)」体制で稼働しているためである。\"},{\"id\":5,\"type\":\"multiple-choice\",\"question\":\"景気循環の拡張局面が初期から後期に進むにつれ、企業が最も感じやすくなる不足は次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"労働コスト。\"},{\"label\":\"b\",\"text\":\"資本投資。\"},{\"label\":\"c\",\"text\":\"熟練労働者の確保。\"}],\"correct\":\"c\",\"explanation\":\"拡張が十分に進んだ時期には、企業は熟練労働者を見つけることが難しくなる。\"},{\"id\":6,\"type\":\"multiple-choice\",\"question\":\"あるアナリストが経済レポートに、現在の景気循環の局面は加速するインフレ圧力と企業の債務依存(leveraging)によって特徴づけられると記した。このアナリストが指している可能性が最も高いのは次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"景気循環の山。\"},{\"label\":\"b\",\"text\":\"景気循環の縮小局面。\"},{\"label\":\"c\",\"text\":\"景気循環の拡張初期局面。\"}],\"correct\":\"a\",\"explanation\":\"加速するインフレ圧力と企業の債務依存の高まりは、通常、景気循環の山を特徴づける現象である。この時期には、企業は生産能力を拡大するために資本支出を負債によって資金調達する傾向がある。\\n\\n## 資源利用・住宅・対外貿易部門の動向\"},{\"id\":7,\"type\":\"multiple-choice\",\"question\":\"後退期において、企業が実物資本の在庫を調整する際に最も可能性が高い方法は次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"投げ売り(fire sale)価格での売却。\"},{\"label\":\"b\",\"text\":\"設備の保守・修理を行わずに放置すること。\"},{\"label\":\"c\",\"text\":\"新規建設用機器の注文を即座に取り消すこと。\"}],\"correct\":\"b\",\"explanation\":\"縮小期における実物資本の調整は、設備の老朽化が進んでも修理・保守を行わないという形で現れることが多い。\"},{\"id\":8,\"type\":\"multiple-choice\",\"question\":\"在庫・売上高比率(inventory/sales ratio)が最も上昇しやすいのはどの時期か。\",\"options\":[{\"label\":\"a\",\"text\":\"縮小が続いている間。\"},{\"label\":\"b\",\"text\":\"回復の中盤。\"},{\"label\":\"c\",\"text\":\"景気循環の山の前後。\"}],\"correct\":\"c\",\"explanation\":\"山の前後では売上が生産に先行して鈍化し始めるため、在庫が売上に対して相対的に増加する。\"},{\"id\":9,\"type\":\"multiple-choice\",\"question\":\"ある国の総輸入が減少する最も大きな原因は何か。\",\"options\":[{\"label\":\"a\",\"text\":\"国内GDP成長率の上昇。\"},{\"label\":\"b\",\"text\":\"主要な貿易相手国の経済に循環的な下降が生じること。\"},{\"label\":\"c\",\"text\":\"主要な貿易相手国に対して自国通貨が持続的に減価していること。\"}],\"correct\":\"b\",\"explanation\":\"自国通貨が減価すると国内製品が外国製品より相対的に安くなり、輸入需要が低下する。この減価が続けば、その国の総輸入は減少しやすくなる。\\n\\n## 景気循環理論\"},{\"id\":10,\"type\":\"multiple-choice\",\"question\":\"オーストリア学派は景気循環の根本的な原因を何に結び付けているか。\",\"options\":[{\"label\":\"a\",\"text\":\"政府の誤った介入。\"},{\"label\":\"b\",\"text\":\"技術進歩による創造的破壊。\"},{\"label\":\"c\",\"text\":\"期待を過度に反映し、調整が緩やかな価格・賃金。\"}],\"correct\":\"a\",\"explanation\":\"オーストリア学派の経済学者は、金融政策の誤りがブームと後退を引き起こすと考える。\"},{\"id\":11,\"type\":\"multiple-choice\",\"question\":\"マネタリストが政府の介入を限定的にすべきだと主張する理由として、彼らが重視するのは次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"政府の政策対応が後手に回る可能性があること。\"},{\"label\":\"b\",\"text\":\"企業がシステム全体のショックに適応するには時間がかかること。\"},{\"label\":\"c\",\"text\":\"限界収入と限界費用が等しいときに資源利用が効率的になること。\"}],\"correct\":\"a\",\"explanation\":\"マネタリストは、政策の効果がその必要性がなくなった後も続いてしまうリスクを警告する。\"},{\"id\":12,\"type\":\"multiple-choice\",\"question\":\"オーストリア学派の見解では、経済の後退に対する政府の最も適切な対応は何か。\",\"options\":[{\"label\":\"a\",\"text\":\"市場を自然な調整に委ねること。\"},{\"label\":\"b\",\"text\":\"貨幣供給の安定的な成長を維持すること。\"},{\"label\":\"c\",\"text\":\"市場金利を自然水準より引き下げること。\"}],\"correct\":\"a\",\"explanation\":\"オーストリア学派の経済学者は、経済に対する政府の介入を限定的にすべきだと主張する。後退期には必要な市場調整を妨げずに進行させるべきだと考える。\"},{\"id\":13,\"type\":\"multiple-choice\",\"question\":\"ある国の政府が深刻な後退への対応として、赤字支出(deficit spending)によって複数の社会基盤(インフラ)事業に資金を投じた。この対応と最も整合的な経済学説は次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"ケインズ学派。\"},{\"label\":\"b\",\"text\":\"マネタリスト学派。\"},{\"label\":\"c\",\"text\":\"新古典派。\"}],\"correct\":\"a\",\"explanation\":\"ケインズ経済学は財政政策という形での政府の介入に依拠する。この政府はインフラ事業を赤字支出によって資金調達し、後退に対応している。\"},{\"id\":14,\"type\":\"multiple-choice\",\"question\":\"実物的景気循環(Real Business Cycle, RBC)モデルの見解では、経済の縮小が生じる最も可能性の高い原因は次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"調整が緩やかな(sticky)賃金。\"},{\"label\":\"b\",\"text\":\"上昇するエネルギー価格。\"},{\"label\":\"c\",\"text\":\"貨幣供給の縮小。\"}],\"correct\":\"b\",\"explanation\":\"RBCモデルは、経済の拡張・縮小は技術進歩や構成要素の相対価格変化(例えばエネルギー価格)といった実物的ショックへの反応であるとみなす。エネルギー価格が上昇すると短期的な総供給が左方向にシフトし、物価は上昇し、GDPは減少する。\\n\\n## 失業\"},{\"id\":15,\"type\":\"multiple-choice\",\"question\":\"求職意欲喪失者(discouraged worker)に分類されるのは次のどの人々か。\",\"options\":[{\"label\":\"a\",\"text\":\"自分の職より資格が高い人々。\"},{\"label\":\"b\",\"text\":\"職を探すことができるにもかかわらず、探さないことを選んだ人々。\"},{\"label\":\"c\",\"text\":\"現在職を探しているが見つかっていない人々。\"}],\"correct\":\"b\",\"explanation\":\"求職意欲喪失者とは、職探しをやめ、労働力の外にあるとみなされる人々である。\"},{\"id\":16,\"type\":\"multiple-choice\",\"question\":\"失業率が遅行指標(lagging indicator)とされる理由は何か。\",\"options\":[{\"label\":\"a\",\"text\":\"新しい種類の職を数えるには、まずそれを定義する必要があるため。\"},{\"label\":\"b\",\"text\":\"複数の収入源を持つ世帯は職を変えるまでに時間がかかるため。\"},{\"label\":\"c\",\"text\":\"企業は雇用・解雇に伴うコストのため、その判断に慎重になるため。\"}],\"correct\":\"c\",\"explanation\":\"この慎重さのために、後退が始まっても失業率はゆっくりと上昇し、回復が始まっても失業率はゆっくりとしか低下しない。\"},{\"id\":17,\"type\":\"multiple-choice\",\"question\":\"労働力参加率(labor force participation ratio)と失業率が同時に低下する最も大きな原因は何か。\",\"options\":[{\"label\":\"a\",\"text\":\"求職意欲喪失者の増加。\"},{\"label\":\"b\",\"text\":\"不完全就業者の増加。\"},{\"label\":\"c\",\"text\":\"自発的に失業した人々の減少。\"}],\"correct\":\"a\",\"explanation\":\"求職意欲喪失者は職探しをやめ、統計上労働力の外にあるとみなされる。したがって彼らの数が増えると、労働力、そして労働年齢人口に対する労働力の比率である参加率が低下する。さらに、求職意欲喪失者は公式の失業率には含まれないため、その増加は失業率の低下にもつながる。\"},{\"id\":18,\"type\":\"multiple-choice\",\"question\":\"経済の回復期に失業率の低下が遅れる最も大きな原因は何か。\",\"options\":[{\"label\":\"a\",\"text\":\"企業が従業員を急速に再雇用しているため。\"},{\"label\":\"b\",\"text\":\"新たな求職者が労働力に加わってくるため。\"},{\"label\":\"c\",\"text\":\"不完全就業者がより高賃金の職へ移行しているため。\"}],\"correct\":\"b\",\"explanation\":\"経済が回復すると新たな求職者が労働力に戻ってくるが、彼らはすぐには職を見つけられないため、その復帰が一時的に失業率を押し上げることがある。\"},{\"id\":19,\"type\":\"multiple-choice\",\"question\":\"大企業の財務マネージャー(treasury manager)が最近自分の職を辞め、競合企業でのより上位の職に6か月後に就くことで合意している。現在実施される雇用統計調査では、この人の状況はどのように分類されるべきか。\",\"options\":[{\"label\":\"a\",\"text\":\"不完全就業者。\"},{\"label\":\"b\",\"text\":\"自発的失業者。\"},{\"label\":\"c\",\"text\":\"摩擦的失業者。\"}],\"correct\":\"c\",\"explanation\":\"摩擦的失業者とは、調査時点では職がないものの、最近一つの職を離れ、別の職に就くことが既に決まっている人々を指す。彼らを待つ職が既に存在するため、完全に失業しているとはみなされず、単に新しい職をまだ開始していないだけとみなされる。この財務マネージャーは現在の職を離れたものの、6か月後に始まる新しい職への採用は既に確定している。\\n\\n## インフレーション\"},{\"id\":20,\"type\":\"multiple-choice\",\"question\":\"インフレ率が上昇した際に最も損失を受けやすい人々の分類は次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"30年固定金利モーゲージを持つ住宅所有者。\"},{\"label\":\"b\",\"text\":\"固定額の年金給付に依存する退職者。\"},{\"label\":\"c\",\"text\":\"インフレスライド条項(escalator clause)付きの契約で働く労働者。\"}],\"correct\":\"b\",\"explanation\":\"インフレ期には一定の金額の購買力が低下するため、固定額に依存する人々の購買力は減少する。\"},{\"id\":21,\"type\":\"multiple-choice\",\"question\":\"インフレ率が低下しているものの依然プラスの水準にあることを表す用語は何か。\",\"options\":[{\"label\":\"a\",\"text\":\"デフレーション。\"},{\"label\":\"b\",\"text\":\"スタグフレーション。\"},{\"label\":\"c\",\"text\":\"ディスインフレーション。\"}],\"correct\":\"c\",\"explanation\":\"ディスインフレーションとは、インフレ率が以前より低下しているものの、依然ゼロより高い状態を表す。\"},{\"id\":22,\"type\":\"multiple-choice\",\"question\":\"デフレーションと最も関連が深いのは次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"政府の収入不足。\"},{\"label\":\"b\",\"text\":\"経済の大規模な縮小。\"},{\"label\":\"c\",\"text\":\"インフレ対策としての明確な金融政策。\"}],\"correct\":\"b\",\"explanation\":\"デフレーションは支出の減少と失業の増加という循環と結び付いている。\"},{\"id\":23,\"type\":\"multiple-choice\",\"question\":\"ハイパーインフレーション(hyperinflation)の結果として最も生じにくいものは次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"貨幣の流通速度の低下。\"},{\"label\":\"b\",\"text\":\"貨幣供給の増加。\"},{\"label\":\"c\",\"text\":\"社会不安が生じる可能性。\"}],\"correct\":\"a\",\"explanation\":\"ハイパーインフレーション下では、消費者は物価が上がる前に支出しようとするため、貨幣はより速く流通するようになる。\"},{\"id\":24,\"type\":\"multiple-choice\",\"question\":\"以下の「表1」は2010年の2か月間の消費バスケットと価格を示している。\\n\\n表1:2か月間の消費バスケットと価格\\n\\n商品 · 2010年11月の数量 · 2010年11月の価格 · 2010年12月の数量 · 2010年12月の価格\\n砂糖 · 70kg · €0.90/kg · 120kg · €1.00/kg\\n綿花 · 60kg · €0.60/kg · 50kg · €0.80/kg\\n\\n2010年11月を基準期とし、初期の価格指数を100とした場合、12月の価格指数をラスパイレス指数で計算して得られるインフレ率に最も近い値はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"19.2%。\"},{\"label\":\"b\",\"text\":\"36.4%。\"},{\"label\":\"c\",\"text\":\"61.6%。\"}],\"correct\":\"a\",\"explanation\":\"ラスパイレス指数は次のデータで計算される。11月の消費バスケット:70 × 0.9 + 60 × 0.6 = 99。基準期(11月)の数量で計算した12月のバスケット:70 × 1 + 60 × 0.8 = 118。12月の価格指数:(118/99) × 100 = 119.19。インフレ率:(119.19/100) − 1 = 0.1919 = 19.19%。\"},{\"id\":25,\"type\":\"multiple-choice\",\"question\":\"表1に示された12月の消費バスケットに基づくと、パーシェ指数の値に最も近いのは次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"116。\"},{\"label\":\"b\",\"text\":\"148。\"},{\"label\":\"c\",\"text\":\"160。\"}],\"correct\":\"a\",\"explanation\":\"パーシェ指数は、当該期(現在)の消費バスケットの構成を価格変化と組み合わせて用いる。したがって12月では次のようになる:(120 × 1 + 50 × 0.8)/(120 × 0.9 + 50 × 0.6) = (160/138) × 100 = 115.9。\"},{\"id\":26,\"type\":\"multiple-choice\",\"question\":\"中央銀行が経済を自己調整(self-correct)に委ねる可能性が最も高いのはどのような状況か。\",\"options\":[{\"label\":\"a\",\"text\":\"高インフレ、急速な経済成長、低失業率。\"},{\"label\":\"b\",\"text\":\"低インフレ、緩やかな経済成長、高失業率。\"},{\"label\":\"c\",\"text\":\"高インフレ、緩やかな経済成長、高失業率。\"}],\"correct\":\"c\",\"explanation\":\"この状況は通常スタグフレーションと呼ばれる。この場合、短期的な経済政策が効果を発揮する可能性は低いと考えられるため、経済を自己調整に委ねる可能性が高くなる。\"},{\"id\":27,\"type\":\"multiple-choice\",\"question\":\"ディスインフレーションを最もよく表しているのは次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"物価水準の下落。\"},{\"label\":\"b\",\"text\":\"負のインフレ率。\"},{\"label\":\"c\",\"text\":\"インフレ率の低下。\"}],\"correct\":\"c\",\"explanation\":\"ディスインフレーションとはインフレ率の低下を指す――例えば7%から4%への低下である。\"},{\"id\":28,\"type\":\"multiple-choice\",\"question\":\"世界の主要経済における消費者物価指数の間で最も共通してみられる特徴は何か。\",\"options\":[{\"label\":\"a\",\"text\":\"調査対象となる地理的地域。\"},{\"label\":\"b\",\"text\":\"対象となる財・サービスに付与される重み。\"},{\"label\":\"c\",\"text\":\"マクロ経済政策の決定に用いられていること。\"}],\"correct\":\"c\",\"explanation\":\"中央銀行はインフレを監視し、金融政策を評価するために消費者物価指数を用いることが多い。\"},{\"id\":29,\"type\":\"multiple-choice\",\"question\":\"生産者物価指数(PPI)に関する次の記述のうち、最も当てはまらない可能性が高いのはどれか。PPIは:\",\"options\":[{\"label\":\"a\",\"text\":\"将来のCPIに影響を与える可能性がある。\"},{\"label\":\"b\",\"text\":\"カテゴリーの重みがCPIよりも大きく変動する可能性がある。\"},{\"label\":\"c\",\"text\":\"労働契約の支払額を調整する基準として、CPIよりも広く用いられている。\"}],\"correct\":\"c\",\"explanation\":\"この目的には通常CPIが用いられるのに対し、PPIは企業間の契約との関連がより強い。\"},{\"id\":30,\"type\":\"multiple-choice\",\"question\":\"以下の「表2」は2015年7〜8月における特定の商品の数量と価格のデータを示している。\\n\\n表2:2015年7〜8月の消費バスケットと価格\\n\\n商品 · 2015年7月の数量 · 2015年7月の価格 · 2015年8月の数量 · 2015年8月の価格\\n牛乳 · 18 · €1.00/L · 17 · €1.00/L\\nオレンジジュース · 6 · €2.00/L · 4 · €2.50/L\\n\\n与えられた消費バスケットと価格データに基づくと、この2か月間において、どの種類の価格指数が最も高いインフレ率を算出するか。\",\"options\":[{\"label\":\"a\",\"text\":\"当該期(現在)の消費バスケットを用いる指数。\"},{\"label\":\"b\",\"text\":\"固定された消費バスケットを用いる指数。\"},{\"label\":\"c\",\"text\":\"消費者の時間を通じた代替行動を反映した指数。\"}],\"correct\":\"b\",\"explanation\":\"固定された消費バスケットを用いる指数(ラスパイレス指数)で計算したインフレ率は10%である。計算は次の通り:2015年7月の消費バスケット = (18 × €1) + (6 × €2) = €30;2015年8月の消費バスケット = (18 × €1) + (6 × €2.5) = €33;ラスパイレス指数の値(I(L)) = (€33/€30) × 100 = €110;インフレ率 = (110/100) − 1 = 0.10 = 10%。当該期(現在)の消費バスケットを用いる指数(パーシェ指数)で計算したインフレ率は8%である:2015年7月の消費バスケット = (17 × €1) + (4 × €2) = €25;2015年8月の消費バスケット = (17 × €1) + (4 × €2.5) = €27;パーシェ指数の値(I(P)) = (€27/€25) × 100 = €108;インフレ率 = (108/100) − 1 = 0.08 = 8%。月々の消費バスケットの価格変化を時間を通じて「連鎖(chaining)」させて計算する指数(フィッシャー指数)のインフレ率は次の通り:フィッシャー指数の値 = √(I(P) × I(L)) = √(€110 × €108) = €108.99;インフレ率 = (108.99/100) − 1 = 0.0899 = 8.99%。\"},{\"id\":31,\"type\":\"multiple-choice\",\"question\":\"公共の経済政策を決定する際に最も多く依拠されるインフレ率は次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"コアインフレーション。\"},{\"label\":\"b\",\"text\":\"ヘッドラインインフレーション。\"},{\"label\":\"c\",\"text\":\"食品・エネルギー価格指数。\"}],\"correct\":\"a\",\"explanation\":\"コアインフレーションは食品・エネルギー価格を除いているため変動が小さく、これを目標指標として用いても政策の過剰反応を招く可能性が低い。\"},{\"id\":32,\"type\":\"multiple-choice\",\"question\":\"コストプッシュインフレーション(cost-push inflation)の状況下で、労働生産性が持つ最も重要な影響は何か。\",\"options\":[{\"label\":\"a\",\"text\":\"生産性の向上は、強い経済とインフレへの傾向を示す。\"},{\"label\":\"b\",\"text\":\"生産性の水準は、経済の「自然失業率」との比較を規定する。\"},{\"label\":\"c\",\"text\":\"生産性の向上が賃金の上昇を相対的に上回る場合、製品価格が上昇する可能性は低くなる。\"}],\"correct\":\"c\",\"explanation\":\"生産性、すなわち1時間当たりの生産量が十分速く上昇すれば、賃金が上昇しても企業の単位コストに圧力をかけずに済むことができる。\"},{\"id\":33,\"type\":\"multiple-choice\",\"question\":\"固定された消費バスケットに基づく価格指数の構成品目である商品の品質が時間とともに向上し、価格は変わらないままである場合、測定されるインフレ率はどうなる可能性が最も高いか。\",\"options\":[{\"label\":\"a\",\"text\":\"影響を受けない。\"},{\"label\":\"b\",\"text\":\"実際より高く出る傾向がある。\"},{\"label\":\"c\",\"text\":\"実際より低く出る傾向がある。\"}],\"correct\":\"b\",\"explanation\":\"商品の品質が向上すると、その商品は需要や要求をより良く満たせるようになる。品質向上に対する調整が行われない場合、測定されるインフレ率は実際の値より高く出る。たとえ商品の価格が時間とともに実際に上昇したとしても、品質の向上は測定されるインフレ率を押し上げる傾向を持つ。\"},{\"id\":34,\"type\":\"multiple-choice\",\"question\":\"食品・エネルギーを除いた財・サービスの価格指数は、通常何を計算するために用いられるか。\",\"options\":[{\"label\":\"a\",\"text\":\"コアインフレーション。\"},{\"label\":\"b\",\"text\":\"GDPデフレーター。\"},{\"label\":\"c\",\"text\":\"ヘッドラインインフレーション。\"}],\"correct\":\"a\",\"explanation\":\"食品・エネルギーを除いた財・サービスの価格指数はコアインフレーションを計算するために用いられる。政策担当者は経済の傾向を把握し政策を立案する際にコアインフレーションを用いることが多い。これは、需要・供給の短期的な変動によって生じる価格の短期的な変動に過剰に反応することを避けようとするためである。\"},{\"id\":35,\"type\":\"multiple-choice\",\"question\":\"次の経済現象のうち、コストプッシュインフレーション(cost-push inflation)を引き起こす可能性が最も高いのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"産業の生産能力利用率が極めて高い水準に達すること。\"},{\"label\":\"b\",\"text\":\"労働生産性が時間当たりの労働コストよりも速く上昇すること。\"},{\"label\":\"c\",\"text\":\"熟練労働者の不足が経済全体で生じること。\"}],\"correct\":\"c\",\"explanation\":\"コストプッシュインフレーションは、上昇するコストが企業に価格の引き上げを迫るときに生じる。熟練労働者の不足は賃金への上昇圧力を生み、たとえその不足が経済の特定部門にのみ影響するものであっても、経済全体がインフレ圧力を感じる可能性がある。\"},{\"id\":36,\"type\":\"multiple-choice\",\"question\":\"あるエコノミストは次のように予測している。失業率が下がると住宅関連商品を扱う業者の収入が増加する。労働市場が引き締まると賃金上昇圧力が生じ、これが住宅関連商品の業者に価格の引き上げを促す。このエコノミストの予測と最も整合的なインフレのタイプは次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"スタグフレーション。\"},{\"label\":\"b\",\"text\":\"コストプッシュインフレーション。\"},{\"label\":\"c\",\"text\":\"ディマンドプルインフレーション。\"}],\"correct\":\"b\",\"explanation\":\"コストプッシュインフレーションとは、上昇するコスト(主に賃金)が企業に価格の引き上げを迫る状況を指す。\\n\\n## 経済指標\"},{\"id\":37,\"type\":\"multiple-choice\",\"question\":\"経済指標の特性を最もよく表している記述は次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"先行指標の重要性は、経済全体を監視することにある。\"},{\"label\":\"b\",\"text\":\"遅行指標は過去の状況を測定するため、修正を加える必要がない。\"},{\"label\":\"c\",\"text\":\"先行指標と一致指標を組み合わせることで、効果的な予測情報が得られる。\"}],\"correct\":\"c\",\"explanation\":\"単一の指標だけでは確実な根拠とはならないが、複数の指標(経済の様々な要因の影響を受ける)を組み合わせることで、最も確度の高い状況把握が可能になる。\"},{\"id\":38,\"type\":\"multiple-choice\",\"question\":\"米国の10年物政府債券利回りとフェデラルファンドレート(federal funds rate)の差が縮小し、同時にプライムレート(prime rate)が変化しない場合、これらの指標の組み合わせは将来の経済状況について何を予測しているか。\",\"options\":[{\"label\":\"a\",\"text\":\"成長。\"},{\"label\":\"b\",\"text\":\"下降。\"},{\"label\":\"c\",\"text\":\"安定。\"}],\"correct\":\"b\",\"explanation\":\"この先行指標であるスプレッドの縮小は、短期金利の低下、ひいては経済活動の低下を予告する。プライムレートは遅行指標であり、通常は経済が転換した後に変化する。\"},{\"id\":39,\"type\":\"multiple-choice\",\"question\":\"前回の値と比較して、在庫・売上高比率が上昇し、単位労働コストが安定しており、実質個人所得が低下している場合、景気循環の山は最も可能性が高くどの時点にあるか。\",\"options\":[{\"label\":\"a\",\"text\":\"既に発生している。\"},{\"label\":\"b\",\"text\":\"今まさに発生しつつある。\"},{\"label\":\"c\",\"text\":\"将来発生する。\"}],\"correct\":\"a\",\"explanation\":\"在庫・売上高比率と単位労働コストはいずれも遅行指標であり、山の後しばらくしてから上昇する。実質個人所得は一致指標であり、その低下は経済活動が既に弱まっていることを示している。\"},{\"id\":40,\"type\":\"multiple-choice\",\"question\":\"現在の経済統計に見られる、サービスインフレのわずかな変化、増加する住宅建築許可件数、長期化する失業の平均期間を最もよく説明するものは次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"経済の方向性について矛盾した根拠。\"},{\"label\":\"b\",\"text\":\"将来の循環的な上昇を示す根拠。\"},{\"label\":\"c\",\"text\":\"将来の循環的な下降を示す根拠。\"}],\"correct\":\"b\",\"explanation\":\"増加する住宅建築許可件数――先行指標――は、将来成長が始まる、あるいは続くことを示す。長期化する失業の平均期間――遅行指標――は下降が既に発生したことを示し、サービスインフレに変化がないこと――これも遅行指標――は経済の方向性について肯定的でも否定的でもない兆候である。これらを合わせて考えると、循環的な上昇が発生する可能性が高いと結論できる。\"},{\"id\":41,\"type\":\"multiple-choice\",\"question\":\"ある期間において、総実質個人所得、鉱工業生産、S\u0026P 500指数がすべて同時に上昇している場合、循環的な上昇について最も正確に下せる結論は次のどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"現在進行中である。\"},{\"label\":\"b\",\"text\":\"終わりに近づいている。\"},{\"label\":\"c\",\"text\":\"まさに始まろうとしている。\"}],\"correct\":\"a\",\"explanation\":\"総実質個人所得と鉱工業生産は一致指標であり、S\u0026P 500は先行指標である。個人所得と鉱工業生産の増加は拡張が進行中であることを示し、S\u0026P 500の上昇は拡張が始まる、あるいは続くという期待を示す。これらを合わせて考えると、循環的な上昇は現在進行中であると判断できる。\"},{\"id\":42,\"type\":\"multiple-choice\",\"question\":\"総実質個人所得が上昇した後、次のうちどれが上昇する可能性が最も高いか。\",\"options\":[{\"label\":\"a\",\"text\":\"株価。\"},{\"label\":\"b\",\"text\":\"新規民間住宅の建築許可件数。\"},{\"label\":\"c\",\"text\":\"消費者分割信用の残高の所得に対する比率。\"}],\"correct\":\"c\",\"explanation\":\"総実質個人所得は景気循環の一致指標であり、消費者分割信用の残高比率は遅行指標である。典型的な景気循環では、消費者分割信用の残高比率は平均所得の増加に続いて上昇する。\"},{\"id\":43,\"type\":\"multiple-choice\",\"question\":\"経済の転換点を予測するのに最も適した指標は次のうちどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"鉱工業生産指数。\"},{\"label\":\"b\",\"text\":\"銀行の平均プライムレート。\"},{\"label\":\"c\",\"text\":\"製造業の週当たり平均労働時間。\"}],\"correct\":\"c\",\"explanation\":\"先行経済指標の転換点は、通常経済全体の転換点よりも先に現れる。製造業の週当たり平均労働時間は先行経済指標である。鉱工業生産指数は一致経済指標であり、銀行の平均プライムレートは遅行経済指標である。\\n\\n---\"}]},{\"id\":\"monetary-fiscal-policy\",\"title\":\"金融政策と財政政策\",\"questions\":[{\"id\":1,\"type\":\"multiple-choice\",\"question\":\"準備要件(reserve requirement)が上昇すると、貨幣乗数(money multiplier)はどうなるか。\",\"options\":[{\"label\":\"a\",\"text\":\"増加する。\"},{\"label\":\"b\",\"text\":\"減少する。\"},{\"label\":\"c\",\"text\":\"変化せず、そのままである。\"}],\"correct\":\"b\",\"explanation\":\"貨幣乗数と準備要件の間には逆の関係がある。貨幣乗数は1を準備要件で割った値に等しい(money multiplier = 1/reserve requirement)。\"},{\"id\":2,\"type\":\"multiple-choice\",\"question\":\"貨幣需要(demand for money)に関する次の記述のうち、最も正しいものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"予備的動機による貨幣需要(precautionary money demand)はGDPと正の相関がある。\"},{\"label\":\"b\",\"text\":\"取引的動機による貨幣需要(transactions money demand)は債券利回りと負の相関がある。\"},{\"label\":\"c\",\"text\":\"投機的需要(speculative demand)は他の資産のリスクに対する認識と負の相関がある。\"}],\"correct\":\"a\",\"explanation\":\"予備的動機による貨幣需要はGDPと正の相関がある。予備的な貨幣保有は、予期しない支出の必要性に備えるための緩衝として保有される。この保有額は、経済における取引量や価値の増大に伴って増える傾向があるため、GDPとともに増加する。\"},{\"id\":3,\"type\":\"multiple-choice\",\"question\":\"次のグラフは貨幣の需要と供給を示している。縦軸は名目金利の水準、横軸は貨幣量を表す。貨幣需要曲線(MD)は右下がりであり、貨幣供給曲線(MS)は垂直な直線であって、両曲線はM0の貨幣量、I0の金利水準で交わる。グラフにはさらに2つの水準が示されている。I1(I0より高く、対応する需要量はM1で少ない)とI2(I0より低く、対応する需要量はM2で多い)である。I0では供給量(M0)と需要量(M0)が等しい。\\n\\n名目金利がどの水準にあるとき、貨幣の過剰供給(excess supply of money)が生じるか。\",\"options\":[{\"label\":\"a\",\"text\":\"I0。\"},{\"label\":\"b\",\"text\":\"I1。\"},{\"label\":\"c\",\"text\":\"I2。\"}],\"correct\":\"b\",\"explanation\":\"金利水準がI1のとき、貨幣の過剰供給(M0 − M1 \u003e 0)が生じる。経済主体は余剰の貨幣残高で債券を購入しようとするため、債券価格が上昇し、金利はI0まで低下する。\"},{\"id\":4,\"type\":\"multiple-choice\",\"question\":\"貨幣の中立性(theory of money neutrality)の理論によれば、貨幣供給量の増加が実質生産(real output)や雇用(employment)などの変数に影響を与えないのはどのような場合か。\",\"options\":[{\"label\":\"a\",\"text\":\"長期において。\"},{\"label\":\"b\",\"text\":\"短期において。\"},{\"label\":\"c\",\"text\":\"長期と短期の両方において。\"}],\"correct\":\"a\",\"explanation\":\"貨幣の中立性の理論によれば、貨幣供給量の増加は最終的に物価水準を上昇させるのみであり、長期的には実質変数に影響を与えない。\"},{\"id\":5,\"type\":\"multiple-choice\",\"question\":\"金融政策が経済に影響を及ぼすために前提としている基本的な仮定(fundamental assumption)を最も正しく表しているものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"金融市場は効率的(efficient)である。\"},{\"label\":\"b\",\"text\":\"短期においては貨幣は中立ではない(money is not neutral in the short run)。\"},{\"label\":\"c\",\"text\":\"政策金利は外国為替レートに影響を与えない。\"}],\"correct\":\"b\",\"explanation\":\"貨幣が短期において中立であったなら、金融政策は経済に影響を及ぼす上で無効であったはずである。\"},{\"id\":6,\"type\":\"multiple-choice\",\"question\":\"マネタリスト(monetarists)が最も強く信じている見解はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"インフレから貨幣供給量への因果関係(causal relationship)が存在する。\"},{\"label\":\"b\",\"text\":\"貨幣供給量の成長率を変化させることでインフレに影響を与えることができる。\"},{\"label\":\"c\",\"text\":\"市場における急速な金融イノベーション(financial innovation)は金融政策の効果を高める。\"}],\"correct\":\"b\",\"explanation\":\"マネタリストの定義によれば、物価は貨幣供給量を管理することによって制御されると考えられている。\"},{\"id\":7,\"type\":\"multiple-choice\",\"question\":\"実質金利(real interest rate)が比較的安定しているという考え方は、次のどれと最も密接に関連しているか。\",\"options\":[{\"label\":\"a\",\"text\":\"フィッシャー効果(Fisher effect)。\"},{\"label\":\"b\",\"text\":\"貨幣の中立性(money neutrality)。\"},{\"label\":\"c\",\"text\":\"貨幣数量説(quantity theory of money)。\"}],\"correct\":\"a\",\"explanation\":\"フィッシャー効果は、実質金利が比較的安定しているという考え方に基づいている。名目金利の変化は、期待インフレ率の変化によって生じる。\"},{\"id\":8,\"type\":\"multiple-choice\",\"question\":\"次の式のうち、フィッシャー効果の帰結を表しているものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"名目金利 = 実質金利 + 期待インフレ率。\"},{\"label\":\"b\",\"text\":\"実質金利 = 名目金利 + 期待インフレ率。\"},{\"label\":\"c\",\"text\":\"名目金利 = 実質金利 + 市場リスクプレミアム。\"}],\"correct\":\"a\",\"explanation\":\"フィッシャー効果によれば、名目金利の変化は期待インフレ率の変化を反映すると考えられ、これは「名目金利 = 実質金利 + 期待インフレ率」という式と整合的である。\\n\\n## 中央銀行の役割\"},{\"id\":9,\"type\":\"multiple-choice\",\"question\":\"中央銀行が担う可能性が最も低い役割は次のうちどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"最後の貸し手(lender of last resort)。\"},{\"label\":\"b\",\"text\":\"銀行監督の唯一の担い手。\"},{\"label\":\"c\",\"text\":\"自国通貨の発行者。\"}],\"correct\":\"b\",\"explanation\":\"銀行監督はすべての中央銀行が担う役割ではない。中央銀行がその役割を担う場合でも、1つまたは複数の他機関と責任を分担する場合がある。\"},{\"id\":10,\"type\":\"multiple-choice\",\"question\":\"中央銀行と金融政策に関する次の記述のうち、最も正しいものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"中央銀行の活動は主として物価の安定を維持することに向けられている。\"},{\"label\":\"b\",\"text\":\"金融政策は4つの独立した経路を通じて経済に影響を与える。\"},{\"label\":\"c\",\"text\":\"商業銀行の金利と銀行間金利は、政策金利と反対方向に動く。\"}],\"correct\":\"a\",\"explanation\":\"中央銀行の活動は主として物価の安定を維持することに向けられている。選択肢Bについては、金融政策の伝達経路は互いに独立したものではないことに留意すべきである。\\n\\n## 金融政策の目的と手段\"},{\"id\":11,\"type\":\"multiple-choice\",\"question\":\"中央銀行が最も注意を払うのは、どのコストに対してか。\",\"options\":[{\"label\":\"a\",\"text\":\"予想された低水準のインフレ。\"},{\"label\":\"b\",\"text\":\"予想された中程度の水準のインフレ。\"},{\"label\":\"c\",\"text\":\"予想されなかった中程度の水準のインフレ。\"}],\"correct\":\"c\",\"explanation\":\"他の条件が同じであれば、低インフレは中程度のインフレよりも経済的コストが高く、予想されなかったインフレは予想されたインフレよりも大きなコストを生じさせる。\"},{\"id\":12,\"type\":\"multiple-choice\",\"question\":\"金融政策に含まれる可能性が最も低い行動は次のうちどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"インフレ目標を設定する。\"},{\"label\":\"b\",\"text\":\"政策金利を変更する。\"},{\"label\":\"c\",\"text\":\"移転支払いプログラム(transfer payment program)を実施する。\"}],\"correct\":\"c\",\"explanation\":\"移転支払いプログラムは金融政策の手段ではなく、財政政策の手段である。\"},{\"id\":13,\"type\":\"multiple-choice\",\"question\":\"中央銀行が政策金利の引き下げを発表する際に望んでいる効果は、次のうちどれが増加することか。\",\"options\":[{\"label\":\"a\",\"text\":\"投資。\"},{\"label\":\"b\",\"text\":\"銀行間貸出金利。\"},{\"label\":\"c\",\"text\":\"自国通貨の他通貨に対する価値。\"}],\"correct\":\"a\",\"explanation\":\"投資は政策金利と反対方向に動くことが期待されている。\"},{\"id\":14,\"type\":\"multiple-choice\",\"question\":\"中央銀行が企業・家計に投資や消費のための借入を促したいと考えている場合、行う可能性が最も低い行動は次のうちどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"政府の長期債券を売却する。\"},{\"label\":\"b\",\"text\":\"政府の長期債券を購入する。\"},{\"label\":\"c\",\"text\":\"モーゲージ債またはその他の有価証券を購入する。\"}],\"correct\":\"a\",\"explanation\":\"このような行動は、他の条件が同じであれば貨幣供給量を縮小させ、金利を上昇させる傾向がある。\"},{\"id\":15,\"type\":\"multiple-choice\",\"question\":\"金利、望ましいインフレ水準、そしてインフレ目標に到達するまでの期間を自ら決定する中央銀行を最も正しく表すものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"目標の独立性(target independent)かつ業務の独立性(operationally independent)を持つ。\"},{\"label\":\"b\",\"text\":\"目標の独立性は持つが、業務の独立性は持たない。\"},{\"label\":\"c\",\"text\":\"業務の独立性は持つが、目標の独立性は持たない。\"}],\"correct\":\"a\",\"explanation\":\"この中央銀行は、自らインフレ目標などの目標を設定するため目標の独立性を持ち、また目標への到達方法(例えば期間)を自ら決定するため業務の独立性も持つ。\"},{\"id\":16,\"type\":\"multiple-choice\",\"question\":\"為替レート目標政策を採用している国のインフレ率が、目標とする国のインフレ率を上回った場合、その国が最も直面する結果はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"短期金利が上昇する。\"},{\"label\":\"b\",\"text\":\"国内の貨幣供給量が増加する。\"},{\"label\":\"c\",\"text\":\"外貨準備が増加する。\"}],\"correct\":\"a\",\"explanation\":\"為替レート目標を維持するためには、金利の上昇が見込まれる。\"},{\"id\":17,\"type\":\"multiple-choice\",\"question\":\"中央銀行が政府債券を繰り返し公開市場で購入する操作(open market purchases)は:\",\"options\":[{\"label\":\"a\",\"text\":\"貨幣供給量を減少させる。\"},{\"label\":\"b\",\"text\":\"ほとんどの国で禁止されている。\"},{\"label\":\"c\",\"text\":\"拡張的金融政策と整合的である。\"}],\"correct\":\"c\",\"explanation\":\"公開市場操作による政府債券の購入は銀行の準備金を増加させ、その結果貨幣供給量を増加させる。これは拡張的金融政策と整合的である。\\n\\n## 緊縮的・拡張的金融政策、中立金利とその限界\"},{\"id\":18,\"type\":\"multiple-choice\",\"question\":\"理論上、政策金利を中立金利(neutral interest rate)に等しく設定することは、何を支えるべきものか。\",\"options\":[{\"label\":\"a\",\"text\":\"安定したインフレ。\"},{\"label\":\"b\",\"text\":\"均衡予算。\"},{\"label\":\"c\",\"text\":\"より高い雇用。\"}],\"correct\":\"a\",\"explanation\":\"中立金利とは、経済を刺激することも減速させることもない金利水準である。中立金利は、長期的に安定したインフレと整合的であるべきものである。\"},{\"id\":19,\"type\":\"multiple-choice\",\"question\":\"政策金利がゼロに極めて近い水準で、経済成長を何ら示すことなく長期間にわたって維持されることは、何を最もよく示しているか。\",\"options\":[{\"label\":\"a\",\"text\":\"量的緩和(quantitative easing)を限定的にすべきであること。\"},{\"label\":\"b\",\"text\":\"金融政策の効果には限界があり得ること。\"},{\"label\":\"c\",\"text\":\"金利水準を目標とするより、準備金水準を目標とすることの方が重要であること。\"}],\"correct\":\"b\",\"explanation\":\"中央銀行は経済を刺激するために政策金利を引き下げる。政策金利をゼロ(あるいはそれをわずかに下回る水準)まで引き下げてもなお経済成長を刺激できない状況は、金融政策に限界があることを示している。\"},{\"id\":20,\"type\":\"multiple-choice\",\"question\":\"準備要件を引き上げることは、どの種類の金融政策の例である可能性が最も高いか。\",\"options\":[{\"label\":\"a\",\"text\":\"中立的。\"},{\"label\":\"b\",\"text\":\"拡張的。\"},{\"label\":\"c\",\"text\":\"緊縮的。\"}],\"correct\":\"c\",\"explanation\":\"準備要件の引き上げは、貨幣供給量の成長を抑えるはずである。\"},{\"id\":21,\"type\":\"multiple-choice\",\"question\":\"デフレ期において、経済成長を刺激する中央銀行の能力にはどのような制約が生じるか。\",\"options\":[{\"label\":\"a\",\"text\":\"リカードの等価命題(Ricardian equivalence)。\"},{\"label\":\"b\",\"text\":\"金融政策と財政政策の相互関係。\"},{\"label\":\"c\",\"text\":\"金利をゼロより大幅に下げることができないこと。\"}],\"correct\":\"c\",\"explanation\":\"デフレは従来型の金融政策にとって課題となる。なぜなら、中央銀行が経済を刺激するために名目金利をゼロ(あるいはそれをわずかに下回る水準)まで下げた後は、それ以上引き下げることができなくなるためである。\"},{\"id\":22,\"type\":\"multiple-choice\",\"question\":\"金融政策の効果に生じる制約のうち、可能性が最も低いものはどれか——中央銀行ができないことは何か。\",\"options\":[{\"label\":\"a\",\"text\":\"中立金利を正確に特定すること。\"},{\"label\":\"b\",\"text\":\"金融機関の貸出意欲を統制すること。\"},{\"label\":\"c\",\"text\":\"経済主体が銀行に保有させる貨幣量を統制すること。\"}],\"correct\":\"a\",\"explanation\":\"中立金利を正確に特定できないことは、必ずしも金融政策の有効性を制約するわけではない。\"},{\"id\":23,\"type\":\"multiple-choice\",\"question\":\"量的緩和(quantitative easing)——中央銀行が個人や機関から政府または民間セクターの有価証券を購入する行為——は、どのような金融政策のスタンスの例であるか。\",\"options\":[{\"label\":\"a\",\"text\":\"中立的。\"},{\"label\":\"b\",\"text\":\"拡張的。\"},{\"label\":\"c\",\"text\":\"緊縮的。\"}],\"correct\":\"b\",\"explanation\":\"量的緩和は拡張的な金融政策スタンスの例である。これは貨幣供給量を急激に増加させることによって総需要を刺激しようとするものである。\\n\\n## 財政政策の役割と目的\"},{\"id\":24,\"type\":\"multiple-choice\",\"question\":\"政府の財政政策の目的である可能性が最も低いものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"所得と富を再分配すること。\"},{\"label\":\"b\",\"text\":\"国全体の生産に影響を与えること。\"},{\"label\":\"c\",\"text\":\"自国通貨の購買力の安定を確保すること。\"}],\"correct\":\"c\",\"explanation\":\"自国通貨の購買力の安定を確保することは財政政策の目的ではなく、金融政策の目的である。財政政策は、政府の支出と税収を用いて総需要の水準、ひいては経済活動に影響を与えるものである。\"},{\"id\":25,\"type\":\"multiple-choice\",\"question\":\"中央銀行が独立している場合、金融政策による措置は財政政策による措置と比べて、次のうちどの特性を持つ可能性が高いか。\",\"options\":[{\"label\":\"a\",\"text\":\"迅速に実施できる。\"},{\"label\":\"b\",\"text\":\"特定の集団を対象とする上で効果的である。\"},{\"label\":\"c\",\"text\":\"デフレに陥った経済と闘う上で効果的である。\"}],\"correct\":\"a\",\"explanation\":\"特に中央銀行が独立している場合、金融政策による措置は財政政策よりも実施までの時間差(タイムラグ)が小さい傾向がある。\"},{\"id\":26,\"type\":\"multiple-choice\",\"question\":\"次のうち、緊縮的財政政策を最もよく表しているものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"高速鉄道への政府支出。\"},{\"label\":\"b\",\"text\":\"給与税の一時的な停止。\"},{\"label\":\"c\",\"text\":\"裁量的な政府支出の凍結。\"}],\"correct\":\"c\",\"explanation\":\"裁量的な政府支出を凍結することは、緊縮的財政政策の例である。\"},{\"id\":27,\"type\":\"multiple-choice\",\"question\":\"減税や社会保障支出の増加を行う際には、必ず他の増税または他の社会保障支出の削減で相殺することを求める「ペイ・アズ・ユー・ゴー」原則(\\\"pay-as-you-go\\\" rule)は、どのような財政政策のスタンスの例であるか。\",\"options\":[{\"label\":\"a\",\"text\":\"中立的。\"},{\"label\":\"b\",\"text\":\"拡張的。\"},{\"label\":\"c\",\"text\":\"緊縮的。\"}],\"correct\":\"a\",\"explanation\":\"「ペイ・アズ・ユー・ゴー」原則は中立的な政策である。支出の増加や収入の減少は必ず相殺されるため、結果として財政赤字・余剰に対する純効果が生じないからである。\\n\\n## 財政政策の手段と実施\"},{\"id\":28,\"type\":\"multiple-choice\",\"question\":\"次のうち、財政政策の手段の例である可能性が最も高いものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"発電所を国費で建設すること。\"},{\"label\":\"b\",\"text\":\"決済システムの規制。\"},{\"label\":\"c\",\"text\":\"中央銀行による政府債券の購入。\"}],\"correct\":\"a\",\"explanation\":\"発電所を国費で建設することは、投資を刺激することを目的とした財政政策の手段とみなされる。\"},{\"id\":29,\"type\":\"multiple-choice\",\"question\":\"財政政策に関する次の記述のうち、最も正しいものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"企業の資本支出を増加させるためには、個人所得税を引き下げる必要がある。\"},{\"label\":\"b\",\"text\":\"循環調整後財政赤字(cyclically adjusted budget deficit)は、財政政策のスタンスを表す適切な指標である。\"},{\"label\":\"c\",\"text\":\"財政余剰の増加は拡張的財政政策と関連している。\"}],\"correct\":\"b\",\"explanation\":\"循環調整後財政赤字は、財政政策のスタンスを表す適切な指標である。これは、経済が完全雇用(すなわち完全な潜在生産量)の水準にあった場合に生じるであろう赤字として定義される。\"},{\"id\":30,\"type\":\"multiple-choice\",\"question\":\"財政政策が総需要を完全には安定化できないことの説明として、可能性が最も低いものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"民間セクターの行動が時間とともに変化すること。\"},{\"label\":\"b\",\"text\":\"政策の変更が非常に速やかに実施されること。\"},{\"label\":\"c\",\"text\":\"財政政策が失業よりもインフレに注意を向けていること。\"}],\"correct\":\"b\",\"explanation\":\"財政政策は、認識ラグ(recognition lag)、行動ラグ(action lag)、影響ラグ(impact lag)の影響を受ける。\"},{\"id\":31,\"type\":\"multiple-choice\",\"question\":\"高水準の政府債務に反対する論拠として、可能性が最も高いものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"債務は国内の国民に対して負っているものである。\"},{\"label\":\"b\",\"text\":\"経済活動に対して阻害的な影響(disincentive)を生じさせる。\"},{\"label\":\"c\",\"text\":\"物的資本・人的資本への投資の資金源となり得る。\"}],\"correct\":\"b\",\"explanation\":\"政府債務/GDP比率が高いことは、将来の税率の上昇につながり、それが経済活動に阻害的な影響を及ぼすという見解がある。\"},{\"id\":32,\"type\":\"multiple-choice\",\"question\":\"財政赤字に関する次の記述のうち、最も正しいものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"政府支出の増加は金利を上昇させ、民間セクターの投資を減少させる可能性がある。\"},{\"label\":\"b\",\"text\":\"デフレ下で貨幣供給量を増加させる中央銀行の活動は、財政赤字を減少させる。\"},{\"label\":\"c\",\"text\":\"リカードの等価命題によれば、赤字は消費者支出に対して乗数効果を持つ。\"}],\"correct\":\"a\",\"explanation\":\"政府の借入は、民間セクターの投資のための借入と競合する可能性がある(クラウディングアウト)。\\n\\n## 金融政策と財政政策の関係\"},{\"id\":33,\"type\":\"multiple-choice\",\"question\":\"公的セクターと民間セクターの両方を成長させる上で、最も効果的である可能性が高い政策の組み合わせはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"緩和的財政政策/緩和的金融政策。\"},{\"label\":\"b\",\"text\":\"緩和的財政政策/緊縮的金融政策。\"},{\"label\":\"c\",\"text\":\"緊縮的財政政策/緊縮的金融政策。\"}],\"correct\":\"a\",\"explanation\":\"財政政策と金融政策の両方が「緩和的」である場合、全体としての効果は強力な拡張的性質を持つことになり、総需要が増加し、金利が低下し、その結果民間・公的セクターの両方が成長する。\\n\\n---\"}]},{\"id\":\"international-trade\",\"title\":\"国際貿易と資本移動\",\"questions\":[{\"id\":1,\"type\":\"multiple-choice\",\"question\":\"茶を銅と比較した場合、Tealand国の相対的な生産コストはCopperland国より低いとする。貿易が開放されると、Copperland国の銅産業はどうなる可能性が高いか。\",\"options\":[{\"label\":\"a\",\"text\":\"拡大する(expand)\"},{\"label\":\"b\",\"text\":\"縮小する(contract)\"},{\"label\":\"c\",\"text\":\"変化せず、安定したままである\"}],\"correct\":\"a\",\"explanation\":\"Tealand国は茶に比較優位を持つ(茶の相対コストが低い)ため、Copperland国は自動的に銅に比較優位を持つことになる。貿易が開放されると、国は比較優位を持つ財に特化し、その産業に資源を移動させるため、Copperland国の銅産業は拡大する。\"},{\"id\":2,\"type\":\"multiple-choice\",\"question\":\"ある国が特定の財の生産において比較優位を持つと言えるのは、次のどの場合か。\",\"options\":[{\"label\":\"a\",\"text\":\"その財を貿易相手国よりも低いコストで生産できる場合\"},{\"label\":\"b\",\"text\":\"その財を生産する機会費用が貿易相手国よりも低い場合\"},{\"label\":\"c\",\"text\":\"その財を生産する機会費用が貿易相手国よりも高い場合\"}],\"correct\":\"b\",\"explanation\":\"比較優位は絶対コストではなく(これは絶対優位であり、選択肢Aに該当する)、機会費用によって決まる。機会費用が低いことは、その財について比較優位を持つことを意味し、一方Cはその逆で、高い機会費用は比較劣位を意味する。\"},{\"id\":3,\"type\":\"multiple-choice\",\"question\":\"メキシコはブラジルへ野菜を輸出し、鉱山用の懐中電灯(フラッシュライト)を輸入しているとする。両国の労働者1人当たりの1日の生産量は次の通りである。\\n\\n · フラッシュライト (Flashlights) · 野菜 (Vegetables)\\nメキシコ · 20 · 60\\nブラジル · 40 · 80\\n\\n野菜の生産において比較優位を持つのはどちらの国か、また最も重要な機会費用はいくらか。\",\"options\":[{\"label\":\"a\",\"text\":\"ブラジル:1本のフラッシュライトに対して野菜2単位\"},{\"label\":\"b\",\"text\":\"メキシコ:1本のフラッシュライトに対して野菜1.5単位\"},{\"label\":\"c\",\"text\":\"メキシコ:1単位の野菜に対してフラッシュライト1/3本\"}],\"correct\":\"c\",\"explanation\":\"野菜生産の機会費用をフラッシュライトで表すと、メキシコでは20÷60 = 1/3本のフラッシュライト/野菜、ブラジルでは40÷80 = 1/2本のフラッシュライト/野菜である。メキシコの機会費用が低い(1/3 \u003c 1/2)ため、メキシコが野菜について比較優位を持ち、その費用は1/3本のフラッシュライト/野菜である。選択肢A、Bは単位または国を誤って示している。\"},{\"id\":4,\"type\":\"multiple-choice\",\"question\":\"3か国がバナナと鉛筆を生産しているとする。労働者1人当たりの1日の生産量は次の通りである。\\n\\n · バナナ (Bananas) · 鉛筆 (Pencils)\\nメキシコ · 20 · 40\\nブラジル · 30 · 90\\nカナダ · 40 · 160\\n\\nバナナの生産において、最も大きな比較優位を持つのはどの国か。\",\"options\":[{\"label\":\"a\",\"text\":\"カナダ\"},{\"label\":\"b\",\"text\":\"ブラジル\"},{\"label\":\"c\",\"text\":\"メキシコ\"}],\"correct\":\"c\",\"explanation\":\"バナナの機会費用を鉛筆で表すと、メキシコでは40÷20 = 2本の鉛筆/バナナ、ブラジルでは90÷30 = 3本の鉛筆/バナナ、カナダでは160÷40 = 4本の鉛筆/バナナである。メキシコの機会費用が最も低いため、メキシコがバナナについて最も大きな比較優位を持つ。\"},{\"id\":5,\"type\":\"multiple-choice\",\"question\":\"リカードの貿易モデルにおいて、一国が貿易からより大きな利益を得るのは、次のどの場合か。\",\"options\":[{\"label\":\"a\",\"text\":\"その国がすべての財を生産し、貿易相手国が1つの財のみに特化している場合\"},{\"label\":\"b\",\"text\":\"貿易の条件が、相手国の自給自足価格よりも自国の自給自足価格に近い場合\"},{\"label\":\"c\",\"text\":\"貿易の条件が、自国の自給自足価格よりも相手国の自給自足価格に近い場合\"}],\"correct\":\"c\",\"explanation\":\"世界価格(貿易の条件)が自国の自給自足価格から大きく離れ、相手国の自給自足価格に近づくほど、その国は貿易からより大きな利益を得る。貿易の条件が自国の自給自足価格に近い場合(選択肢B)、貿易から得る利益は小さい。\"},{\"id\":6,\"type\":\"multiple-choice\",\"question\":\"ドイツはポルトガルよりも労働者1人当たりの資本が顕著に多い。自給自足の状態では、両国ともに工作機械(machine tools)とワインの両方を生産・消費している。工作機械の生産は相対的に資本集約的であり、ワインの生産は労働集約的である。ヘクシャー・オリーンモデルに従うと、貿易が開放された場合:\",\"options\":[{\"label\":\"a\",\"text\":\"ドイツは工作機械を輸出すべきであり、ポルトガルはワインを輸出すべきである\"},{\"label\":\"b\",\"text\":\"ドイツはワインを輸出すべきであり、ポルトガルは工作機械を輸出すべきである\"},{\"label\":\"c\",\"text\":\"ドイツは工作機械のみを、ポルトガルはワインのみを生産すべきである\"}],\"correct\":\"a\",\"explanation\":\"ヘクシャー・オリーンモデルによれば、一国は相対的に豊富な生産要素を集約的に用いる財について比較優位を持つ。ドイツは資本が豊富であるため資本集約的な工作機械を輸出し、ポルトガル(相対的に労働が豊富)は労働集約的なワインを輸出する。選択肢Cは誤りで、このモデルは完全な特化(一つの財のみを生産すること)を要求しない。\"},{\"id\":7,\"type\":\"multiple-choice\",\"question\":\"ヘクシャー・オリーンモデルに従うと、貿易が開放された場合:\",\"options\":[{\"label\":\"a\",\"text\":\"各国で希少な要素が豊富な要素と比較して利益を得る\"},{\"label\":\"b\",\"text\":\"各国で豊富な要素が希少な要素と比較して利益を得る\"},{\"label\":\"c\",\"text\":\"所得は国家間で再分配されるが、国内では再分配されない\"}],\"correct\":\"b\",\"explanation\":\"貿易が開放されると、輸出財(相対的に豊富な要素を集約的に用いる)の価格が上昇するため、その豊富な要素への需要と所得が増加する。一方、輸入財(希少な要素を用いる)の価格は下落するため、希少な要素は相対的に不利になる。したがって、豊富な要素は希少な要素と比較して利益を得る。選択肢Cは誤り — 所得の再分配は国内でも生じる。\\n\\n## 国際貿易の利益と費用\"},{\"id\":8,\"type\":\"multiple-choice\",\"question\":\"次の記述のうち、国際貿易の利益を最もよく表しているのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"国々は交換と特化から利益を得る\"},{\"label\":\"b\",\"text\":\"国々は輸出においてより低い価格を受け取り、輸入においてより高い価格を支払う\"},{\"label\":\"c\",\"text\":\"国が貿易から長期的に利益を得るためには、絶対優位を持っていなければならない\"}],\"correct\":\"a\",\"explanation\":\"貿易の基本的な利益は、交換(輸出でより高い価格を得て、輸入でより低い価格を支払うこと)および比較優位に基づく特化から得られる利益である。選択肢Bは方向が逆に(誤って)記述されている(実際には価格関係は逆に働く)。選択肢Cは誤り — 貿易から利益を得るために絶対優位は必要なく、比較優位で十分である。\"},{\"id\":9,\"type\":\"multiple-choice\",\"question\":\"次の記述のうち、国際貿易の費用を最もよく表しているのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"絶対優位を持たない国は国際貿易から有意な利益を得ることができない\"},{\"label\":\"b\",\"text\":\"資源(労働・資本)を産業間で再配分する必要が生じ、効率性の低い企業が市場から退出することで失業が増加する可能性がある\"},{\"label\":\"c\",\"text\":\"先進国における輸入品との競争による製造業の雇用喪失は、先進国が発展途上国よりもはるかに少ない利益しか得ていないことを示している\"}],\"correct\":\"b\",\"explanation\":\"貿易の費用とは、資源(労働・資本)を産業間で再配分する必要が生じ、輸入競争にさらされた効率性の低い企業が市場から退出し、その結果短期・中期的に失業が増加するといった移行コストを指す。選択肢Aは誤り — 絶対優位は必要なく、比較優位からも利益を得られる。選択肢Cは誤った結論である — 雇用の喪失は費用の一つだが、それだけで先進国が貿易から得る利益が少ないという一般的な結論を導くには不十分である。\\n\\n## 貿易と資本移動の制限\"},{\"id\":10,\"type\":\"multiple-choice\",\"question\":\"次のうち、国内政府の収入を最も増加させる可能性が高い貿易制限の種類はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"関税(tariff)\"},{\"label\":\"b\",\"text\":\"輸入割当(import quota)\"},{\"label\":\"c\",\"text\":\"輸出補助金(export subsidy)\"}],\"correct\":\"a\",\"explanation\":\"関税は輸入品に課される税金であるため、政府に直接的な税収をもたらす。輸入割当の場合、追加的な利益(割当レント)は通常、外国の生産者または輸入業者に渡り、政府には収入をもたらさない(ライセンスの競売入札が行われない場合)。輸出補助金は政府の支出であり、収入ではない。\"},{\"id\":11,\"type\":\"multiple-choice\",\"question\":\"次の貿易制限のうち、輸入国に最も大きな福祉損失(welfare loss)をもたらす可能性が高いのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"関税\"},{\"label\":\"b\",\"text\":\"輸入割当\"},{\"label\":\"c\",\"text\":\"輸出自主規制(voluntary export restraint, VER)\"}],\"correct\":\"c\",\"explanation\":\"VERの場合、割当レントはすべて外国の輸出業者に渡るため、輸入国はこの価格上昇から収入やレントを一切得ることができない。一方、関税では政府が収入を得られ、輸入割当では輸入国内の輸入業者がレントを獲得できる可能性があるため、これらのケースでは輸入国全体の福祉損失はVERよりも小さい。\"},{\"id\":12,\"type\":\"multiple-choice\",\"question\":\"大国(large country)は:\",\"options\":[{\"label\":\"a\",\"text\":\"関税を課すことで利益を得られる可能性がある\"},{\"label\":\"b\",\"text\":\"輸出補助金を課すことで利益を得られる可能性がある\"},{\"label\":\"c\",\"text\":\"いかなる貿易制限からも利益を得ることはできない\"}],\"correct\":\"a\",\"explanation\":\"大国は世界市場価格に影響を与えることができるため、関税を課すと外国の輸出業者は市場シェアを失わないよう価格を引き下げようとする。これによって貿易の条件が大国に有利に変化し、場合によっては純粋な福祉損失を相殺し、国家全体の福祉を増大させることがある(貿易の条件効果)。輸出補助金は、小国・大国いずれにおいても国内価格を低下させるコストであり、利益をもたらさない。\"},{\"id\":13,\"type\":\"multiple-choice\",\"question\":\"ブラジルと南アフリカが互いの間で自由貿易を行い、他のすべての国に対して共通の貿易政策を実施しているが、両国間で生産要素の自由な移動がない場合、ブラジルと南アフリカはどの種類のグループの一員か。\",\"options\":[{\"label\":\"a\",\"text\":\"関税同盟(customs union)\"},{\"label\":\"b\",\"text\":\"共同市場(common market)\"},{\"label\":\"c\",\"text\":\"自由貿易地域(free trade area)\"}],\"correct\":\"a\",\"explanation\":\"加盟国間で自由貿易が行われ、非加盟国に対して共通の貿易政策が実施されていることは、FTAを超える段階にあることを示しており、これは関税同盟の定義に該当する。これに加えて要素の自由な移動があれば、共同市場となる。\"},{\"id\":14,\"type\":\"multiple-choice\",\"question\":\"次の要因のうち、地域貿易協定(regional trade agreements)がより大規模な多角的貿易協定(multilateral trade agreements)よりも普及してきた理由を最もよく説明するのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"移行コスト(displacement costs)が低い\"},{\"label\":\"b\",\"text\":\"貿易転換(trade diversion)が加盟国にとって有利である\"},{\"label\":\"c\",\"text\":\"政策協調を行うのがより速く、容易である\"}],\"correct\":\"c\",\"explanation\":\"少数の、しばしば似通った経済構造を持つ国々の間で協定・政策協調を行うことは、多様な利害関係を持つ多数の国々が参加する多角的な交渉(例えばWTOのドーハラウンド)よりもはるかに迅速かつ容易であるため、地域協定がより普及している。選択肢Bは誤り — 貿易転換は全体の福祉を低下させる負の現象であり、利点ではない。\\n\\n## 国際収支と複式簿記\"},{\"id\":15,\"type\":\"multiple-choice\",\"question\":\"鉱物資源の権利(mineral rights)を売却することは、国際収支のどの項目に記録されるか。\",\"options\":[{\"label\":\"a\",\"text\":\"資本収支(capital account)\"},{\"label\":\"b\",\"text\":\"経常収支(current account)\"},{\"label\":\"c\",\"text\":\"金融収支(financial account)\"}],\"correct\":\"a\",\"explanation\":\"鉱物資源の権利のような、生産されていない非金融の無形資産(特許、著作権なども同様)の取引は、資本収支の小区分に記録される。一方、財・サービスの貿易は経常収支に、金融商品の取引は金融収支に記録される。\"},{\"id\":16,\"type\":\"multiple-choice\",\"question\":\"特許使用料(patent fees)と法律顧問サービス(legal services)は、国際収支のどの項目に記録されるか。\",\"options\":[{\"label\":\"a\",\"text\":\"資本収支\"},{\"label\":\"b\",\"text\":\"経常収支\"},{\"label\":\"c\",\"text\":\"金融収支\"}],\"correct\":\"b\",\"explanation\":\"特許使用料は知的財産の使用に対して定期的に支払われるロイヤルティであり、サービス(services)の小区分に分類される。法律顧問サービスも同様にサービスであるため、両方とも経常収支に記録される(これは特許そのものを売却する取引とは異なり、そのような取引は資本収支に記録される)。\"},{\"id\":17,\"type\":\"multiple-choice\",\"question\":\"韓国の製鋼会社が今四半期に次の取引を行ったとする:オーストラリアから鉄鉱石をAUD5,000万で購入;アメリカで完成した鋼材をUSD6,500万で販売;シドニーの銀行からAUD5,000万の融資を受けた;アメリカの子会社からUSD1,000万の配当を受け取った;韓国の運送会社にKRW5億5,000万を支払った。これらのうち、韓国の経常収支に記録されるのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"融資\"},{\"label\":\"b\",\"text\":\"運送\"},{\"label\":\"c\",\"text\":\"配当\"}],\"correct\":\"c\",\"explanation\":\"子会社から受け取った配当は所得受取(income receipts)であり、経常収支の小区分に記録される。融資は金融収支(負債の増加)に記録され、運送費の支払いは韓国国内の二者間の取引であるため、そもそも国際収支上の取引(国境を越えた取引)には該当しない。\\n\\n## 国民経済計算と国際収支\"},{\"id\":18,\"type\":\"multiple-choice\",\"question\":\"次の記述のうち、経常収支の赤字に最も大きく影響するのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"高い税金\"},{\"label\":\"b\",\"text\":\"低い民間貯蓄\"},{\"label\":\"c\",\"text\":\"低い民間投資\"}],\"correct\":\"b\",\"explanation\":\"恒等式 CA = Sp + Sg – I から分かるように、他の要因が一定であれば、民間貯蓄(Sp)が低下すると経常収支は悪化し赤字になる。低い民間投資(Iの低下)はむしろCAを増加させる(選択肢Cは誤り);高い税金は、他が一定であれば政府貯蓄Sgを増加させCAを増加させる傾向にある(選択肢Aは誤り)。\"},{\"id\":19,\"type\":\"multiple-choice\",\"question\":\"次の慢性的な(chronic)赤字の条件のうち、赤字国の貸し手(lenders)に最も小さな懸念を引き起こすのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"高い消費\"},{\"label\":\"b\",\"text\":\"高い民間投資\"},{\"label\":\"c\",\"text\":\"高い政府支出\"}],\"correct\":\"b\",\"explanation\":\"経常収支の赤字が高い民間投資から生じている場合、これは将来の生産能力と債務返済のための所得を増加させる可能性が高いため、貸し手にとって相対的に懸念が小さい。一方、高い消費や政府支出から生じる赤字は将来の所得を生み出すものではなく、単に現在の消費を資金調達しているに過ぎない
