ため、債務返済能力についてより大きな懸念を引き起こす。\\n\\n## 国際機関:IMF・世界銀行・WTO\"},{\"id\":20,\"type\":\"multiple-choice\",\"question\":\"次の国際貿易機関のうち、世界規模で国家間の国境を越えた貿易関係を規律しているのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"世界銀行グループ(World Bank)\"},{\"label\":\"b\",\"text\":\"世界貿易機関(WTO)\"},{\"label\":\"c\",\"text\":\"国際通貨基金(IMF)\"}],\"correct\":\"b\",\"explanation\":\"WTOは加盟国間の貿易関係を規律する唯一の世界規模の国際機関であり、貿易協定の実施・管理、紛争解決などの役割を担う。世界銀行は開発融資に、IMFは通貨システムの安定性に重点を置いているため、この役割には該当しない。\"},{\"id\":21,\"type\":\"multiple-choice\",\"question\":\"次の国際貿易機関のうち、発展途上国における貧困の削減と環境に配慮した経済成長の促進を使命としているのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"世界銀行グループ(World Bank)\"},{\"label\":\"b\",\"text\":\"世界貿易機関(WTO)\"},{\"label\":\"c\",\"text\":\"国際通貨基金(IMF)\"}],\"correct\":\"a\",\"explanation\":\"世界銀行の主な目的はまさにこれであり、発展途上国における貧困の削減、環境に配慮した持続可能な経済成長の促進を目的とした融資・助言を行うことである。WTOは貿易を規律し、IMFは通貨システムの安定性に重点を置いているため、この目的には該当しない。\"},{\"id\":22,\"type\":\"multiple-choice\",\"question\":\"次の機関のうち、2010年のギリシャ国債危機のような状況において、危機の伝播(contagion)を未然に防ぎ、世界的な体系的リスクを監視するのに役立っているのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"世界銀行グループ(World Bank)\"},{\"label\":\"b\",\"text\":\"世界貿易機関(WTO)\"},{\"label\":\"c\",\"text\":\"国際通貨基金(IMF)\"}],\"correct\":\"c\",\"explanation\":\"IMFの主な役割は、国際通貨システムの安定性を確保し、国際収支の危機に陥った加盟国に対して期限付きの外国為替融資を行い、危機が他国へ伝播すること(contagion)を防ぐことである——2010年のギリシャ危機への支援はその代表例である。\"},{\"id\":23,\"type\":\"multiple-choice\",\"question\":\"次の国際貿易機関のうち、1948年から1995年まで国際貿易を規律する唯一の多角的な取り決めであったのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"世界貿易機関(WTO)\"},{\"label\":\"b\",\"text\":\"国際貿易機関(ITO)\"},{\"label\":\"c\",\"text\":\"関税及び貿易に関する一般協定(GATT)\"}],\"correct\":\"c\",\"explanation\":\"ブレトンウッズ会議で計画された3つ目の機関であるITOは、アメリカ議会で承認されなかったため実現しなかった。代わりに1947年に設立されたGATTが、1995年にWTOに引き継がれるまで、国際貿易を規律する唯一の多角的な取り決めとして残った。\\n\\n---\"}]},{\"id\":\"exchange-rates\",\"title\":\"外国為替レート\",\"questions\":[{\"id\":1,\"type\":\"multiple-choice\",\"question\":\"為替レートについて、最も正しい説明は次のうちどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"通常、実質(real)ベースで公表される。\"},{\"label\":\"b\",\"text\":\"ある通貨の価値を別の通貨で表したものである。\"},{\"label\":\"c\",\"text\":\"2つの通貨の間に為替レートが存在することは、それらが完全に転換可能(fully convertible)であることを意味する。\"}],\"correct\":\"b\",\"explanation\":\"為替レートとは、基準通貨1単位を購入するのに必要な価格通貨の単位数である。同じことだが、基準通貨1単位を買うために必要な価格通貨の単位数、と言うこともできる。\"},{\"id\":2,\"type\":\"multiple-choice\",\"question\":\"実質為替レート(自国通貨単位で、外国通貨1単位あたりの金額として表示)が下落する場合、次のうちどの変化と最も関連が強いか。\",\"options\":[{\"label\":\"a\",\"text\":\"外国の価格水準の上昇。\"},{\"label\":\"b\",\"text\":\"自国の価格水準の上昇。\"},{\"label\":\"c\",\"text\":\"名目為替レートの上昇。\"}],\"correct\":\"b\",\"explanation\":\"実質為替レート(自国通貨/外国通貨で表示)は次の式で表される:実質レート(d/f) = S(d/f) × (Pf/Pd)。自国の価格水準(Pd)が上昇すると実質レートは低下する。これは自国通貨の相対的な購買力が高まることを意味するためである。\"},{\"id\":3,\"type\":\"multiple-choice\",\"question\":\"ドイツの企業から100日後に受け取る予定のユーロ建ての受取勘定(receivable)について、英国企業が外国為替エクスポージャー(foreign exchange exposure)を減らすために最も取りそうな行動は次のうちどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"スポット取引を行う。\"},{\"label\":\"b\",\"text\":\"フォワード契約を締結する。\"},{\"label\":\"c\",\"text\":\"実質為替レート契約を締結する。\"}],\"correct\":\"b\",\"explanation\":\"受取金は100日後に支払われる。為替リスクを減らすため、英国企業は今日合意したレートでユーロを売り、ポンドを買うフォワード契約を結ぶことになる。この合意されたレートをフォワード為替レートと呼ぶ。\"},{\"id\":4,\"type\":\"multiple-choice\",\"question\":\"次の市場参加者のうち、FX市場の「セルサイド」(sell side)参加者とみなされる可能性が最も高いのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"外国通貨で借入を行う大企業。\"},{\"label\":\"b\",\"text\":\"国境を越える資本フローに影響を与えるソブリン・ウェルス・ファンド(sovereign wealth fund)。\"},{\"label\":\"c\",\"text\":\"多様な顧客と通貨を取引する国際的な銀行。\"}],\"correct\":\"c\",\"explanation\":\"セルサイドは主に、バイサイドの顧客に外国通貨およびその関連商品を売る大手銀行から構成される。これらの銀行はマーケットメーカー(market maker)として、基準通貨を買う(ビッド)価格と売る(オファー)価格を提示する。\\n\\n## 為替レートの表示と交差レート計算\"},{\"id\":5,\"type\":\"multiple-choice\",\"question\":\"自国通貨が増価(appreciate)した場合、ダイレクト・クオート(direct exchange rate quote)にはどのような影響があるか。\",\"options\":[{\"label\":\"a\",\"text\":\"上昇する。\"},{\"label\":\"b\",\"text\":\"下落する。\"},{\"label\":\"c\",\"text\":\"変化しない。\"}],\"correct\":\"b\",\"explanation\":\"ダイレクト・クオートでは、自国通貨が価格通貨(分子)、外国通貨が基準通貨(分母)となる。自国通貨が増価すると、外国通貨1単位を買うのに必要な自国通貨が少なくなるため、レート(自国/外国)は下落する。例えば、英ポンド(GBP)がユーロ(EUR)に対して増価すると、ユーロ・スターリング(GBP/EUR)は0.8650から0.8590へ下落する可能性がある。\"},{\"id\":6,\"type\":\"multiple-choice\",\"question\":\"スイスのある経営幹部がスペインのホテルにチェックインした際、ホテルのマネージャーから「1ユーロで1.2983スイスフラン(CHF)が買える」と聞いた。この幹部の立場から見ると、インダイレクト・クオート(indirect quote)は次のうちどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"CHF1単位につき0.7702EUR。\"},{\"label\":\"b\",\"text\":\"EUR1単位につき0.7702CHF。\"},{\"label\":\"c\",\"text\":\"CHF1単位につき1.2983EUR。\"}],\"correct\":\"a\",\"explanation\":\"インダイレクト・クオートは、外国を価格通貨、自国を基準通貨とする。CHF(この幹部の自国通貨)を基準通貨にするには、クオートをEUR/CHFの形で表す必要がある。ホテルのマネージャーの情報を使うと、インダイレクト・クオートは(1/1.2983) = 0.7702となる。\"},{\"id\":7,\"type\":\"multiple-choice\",\"question\":\"過去1カ月間、スイスフラン(CHF)は英ポンド(GBP)に対して12%下落(depreciate)した。英ポンドはスイスフランに対して何パーセント上昇(appreciate)したか。\",\"options\":[{\"label\":\"a\",\"text\":\"12%\"},{\"label\":\"b\",\"text\":\"12%未満\"},{\"label\":\"c\",\"text\":\"12%超\"}],\"correct\":\"c\",\"explanation\":\"スターリングのスイスフランに対する上昇率は、スイスフランのスターリングに対する12%の下落の逆数にすぎない:[1/(1 − 0.12)] − 1 = (1/0.88) − 1 = 0.1364、すなわち13.64%である。\"},{\"id\":8,\"type\":\"multiple-choice\",\"question\":\"2つの通貨間のレートが1.4500まで上昇した。基準通貨が価格通貨に対して8%上昇(appreciate)した場合、2つの通貨間の当初のレートはおおよそいくらであったか。\",\"options\":[{\"label\":\"a\",\"text\":\"1.3340\"},{\"label\":\"b\",\"text\":\"1.3426\"},{\"label\":\"c\",\"text\":\"1.5660\"}],\"correct\":\"b\",\"explanation\":\"基準通貨のパーセンテージの上昇は、上昇後のレートを当初のレートで割ることで計算できる。この場合、未知数は当初のレートである。当初のレートは次の式を満たすXの値である:1.4500/X = 1.08。Xを求めると:1.45/1.08 = 1.3426となる。\"},{\"id\":9,\"type\":\"multiple-choice\",\"question\":\"問9〜10は次の情報に関するものである。ディーラーが次のレートを提示している:CNY/HKD = 0.8422、CNY/ZAR = 0.9149、CNY/SEK = 1.0218。スポットのZAR/HKD交差レート(cross-rate)はおおよそいくらか。\",\"options\":[{\"label\":\"a\",\"text\":\"0.9205\"},{\"label\":\"b\",\"text\":\"1.0864\"},{\"label\":\"c\",\"text\":\"1.2978\"}],\"correct\":\"a\",\"explanation\":\"ZAR/HKDの交差レートを求めるには、CNY/ZARスポットレートの逆数をとり、それにCNY/HKDレートを掛ける必要がある:ZAR/HKD = (CNY/ZAR)^(−1) × (CNY/HKD) = (1/0.9149) × 0.8422 = 0.9205。\"},{\"id\":10,\"type\":\"multiple-choice\",\"question\":\"問9〜10は次の情報に関するものである。ディーラーが次のレートを提示している:CNY/HKD = 0.8422、CNY/ZAR = 0.9149、CNY/SEK = 1.0218。別のディーラーがZAR/SEK交差レートを1.1210と提示している。獲得可能なアービトラージ利益はおおよそいくらか。\",\"options\":[{\"label\":\"a\",\"text\":\"SEK100万を取引するごとにZAR3671。\"},{\"label\":\"b\",\"text\":\"ZAR100万を取引するごとにSEK4200。\"},{\"label\":\"c\",\"text\":\"SEK100万を取引するごとにZAR4200。\"}],\"correct\":\"c\",\"explanation\":\"最初のディーラーのZAR/SEK交差レートは(1.0218/0.9149) = 1.1168であり、これは2番目のディーラーのレートより低い。アービトラージ利益を得るには、トレーダーは最初のディーラーからSEKを買い(ZARを売り)、2番目のディーラーにSEKを売る(ZARを買う)ことで利益を得る。SEK100万あたりの利益は:SEK1,000,000 × (1.1210 − 1.1168) = ZAR4200となる。\\n\\n## フォワード計算\"},{\"id\":11,\"type\":\"multiple-choice\",\"question\":\"ディーラーがBRL/MXNスポットレートを0.1378と提示している。6カ月物フォワードレートは0.14193である。6カ月物フォワードポイントはおおよそいくらか。\",\"options\":[{\"label\":\"a\",\"text\":\"−41.3\"},{\"label\":\"b\",\"text\":\"+41.3\"},{\"label\":\"c\",\"text\":\"+299.7\"}],\"correct\":\"b\",\"explanation\":\"フォワードポイントの数は、フォワードレートからスポットレートを引き、10,000を掛けたものに等しい:0.14193 − 0.1378 = 0.00413、×10,000 = 41.3ポイント。慣例として、フォワードポイントはスポットレートの最後の小数点位に±1の変化が対応するようスケーリングされる。\"},{\"id\":12,\"type\":\"multiple-choice\",\"question\":\"ディーラーが3カ月物CAD/USDフォワードレートを1.0123と提示している。また、このディーラーは3カ月物フォワードポイントをパーセンテージで6.8%と提示している。CAD/USDスポットレートはおおよそいくらか。\",\"options\":[{\"label\":\"a\",\"text\":\"0.9478\"},{\"label\":\"b\",\"text\":\"1.0550\"},{\"label\":\"c\",\"text\":\"1.0862\"}],\"correct\":\"a\",\"explanation\":\"フォワードレートとフォワードポイント(パーセンテージ)が分かっている場合、未知数はスポットレートである。計算は次のとおり:スポットレート × (1 + フォワードポイントのパーセンテージ) = フォワードレート;スポットレート × (1 + 0.068) = 1.0123;スポット = 1.0123/1.068 = 0.9478。\"},{\"id\":13,\"type\":\"multiple-choice\",\"question\":\"フォワード為替レートのクオートにおいて、基準通貨がフォワードディスカウント(forward discount)で取引されている場合、次のうち最も正しい記述はどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"フォワードポイントは正である。\"},{\"label\":\"b\",\"text\":\"フォワードのパーセンテージは負である。\"},{\"label\":\"c\",\"text\":\"基準通貨は価格通貨に対して上昇すると期待されている。\"}],\"correct\":\"b\",\"explanation\":\"基準通貨がフォワードディスカウントで取引されているとは、基準通貨1単位のフォワード受渡し価格がスポット受渡し価格より低いこと、すなわちフォワード為替レートがスポットレートより低いことを意味する。フォワードポイントは絶対値で表してもパーセンテージで表しても、負の値となる。\"},{\"id\":14,\"type\":\"multiple-choice\",\"question\":\"フォワードプレミアム(forward premium)は何を示しているか。\",\"options\":[{\"label\":\"a\",\"text\":\"基準通貨の需要が増加すると期待されている。\"},{\"label\":\"b\",\"text\":\"金利水準が基準通貨の方が価格通貨より高い。\"},{\"label\":\"c\",\"text\":\"金利水準が価格通貨の方が基準通貨より高い。\"}],\"correct\":\"c\",\"explanation\":\"アービトラージの機会を排除するには、スポット為替レート(S)、フォワード為替レート(F)、基準通貨の金利(i_b)、価格通貨の金利(i_p)が次の関係を満たさなければならない:F/S = (1 + i_p)/(1 + i_b)。この式から、基準通貨がフォワードプレミアム(F \u003e S)で取引されるのは、価格通貨の金利が基準通貨の金利より高い(i_p \u003e i_b)場合に限られる。\"},{\"id\":15,\"type\":\"multiple-choice\",\"question\":\"JPY/AUDスポット為替レートが82.42、JPYの金利が0.15%、AUDの金利が4.95%である。金利が360日ベースの年率で提示されている場合、90日物JPY/AUDフォワードポイントはおおよそいくらか。\",\"options\":[{\"label\":\"a\",\"text\":\"−377.0\"},{\"label\":\"b\",\"text\":\"−97.7\"},{\"label\":\"c\",\"text\":\"98.9\"}],\"correct\":\"b\",\"explanation\":\"フォワード為替レートは次の式で表される:F(JPY/AUD) = S(JPY/AUD) × [(1 + i(JPY) × τ)/(1 + i(AUD) × τ)] = 82.42 × {[1 + 0.0015 × (90/360)]/[1 + 0.0495 × (90/360)]} = 82.42 × 0.98815 = 81.443。フォワードポイントは100 × (F − S) = 100 × (81.443 − 82.42) = 100 × (−0.977) = −97.7となる。なお、スポット為替レートが小数点以下2桁で提示されているため、フォワードポイントは100倍でスケーリングする。\\n\\n## 為替レート制度\"},{\"id\":16,\"type\":\"multiple-choice\",\"question\":\"次のうち、理想的な為替制度(ideal currency regime)の条件に当たらないものはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"完全に転換可能な通貨。\"},{\"label\":\"b\",\"text\":\"完全に自律的(独立)な金融政策。\"},{\"label\":\"c\",\"text\":\"独立してフロートする為替レート。\"}],\"correct\":\"c\",\"explanation\":\"理想的な為替制度では、すべての通貨間のレートが信頼できる形で固定(credibly fixed)されていなければならない。これにより、財・サービスおよび実物・金融資産の価格に関する通貨に起因する不確実性が解消される。\"},{\"id\":17,\"type\":\"multiple-choice\",\"question\":\"実際には、固定パリティ制度(fixed parity regime)とターゲットゾーン制度(target zone regime)はいずれも、パリティ水準の周辺の一定のバンド内でレートが変動することを認めている。このバンドが存在する最も可能性の高い理由は、金融当局に次のどれを可能にするためか。\",\"options\":[{\"label\":\"a\",\"text\":\"外国為替市場への参加をより消極的にする。\"},{\"label\":\"b\",\"text\":\"自らの外国為替取引でスプレッドを得る。\"},{\"label\":\"c\",\"text\":\"金融政策においてより大きな裁量(discretion)を行使する。\"}],\"correct\":\"c\",\"explanation\":\"固定為替レートは自律的な金融政策を行う上で大きな制約となる。厳格に固定されたレートのもとでは、自国の金利、マネーサプライ(例えばマネーストック)、信用条件は、パリティで通貨を厳格に買う/売る必要性によって決定される。パリティ水準の周辺の狭いバンドであっても、金融当局はこれらの条件に一定の裁量を持つことができる。一般に、バンドが広いほど、金融当局はより自律的な管理を行うことができる。\"},{\"id\":18,\"type\":\"multiple-choice\",\"question\":\"発行した自国通貨の100%を外貨準備で裏付けることが法的に義務付けられている固定為替レート制度を最も正確に表しているのは次のうちどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"ドル化(dollarization)。\"},{\"label\":\"b\",\"text\":\"カレンシーボード制(currency board)。\"},{\"label\":\"c\",\"text\":\"通貨同盟(monetary union)。\"}],\"correct\":\"b\",\"explanation\":\"カレンシーボード制のもとでは、金融当局は自国通貨を特定の外国通貨と固定レートで交換することを法的に義務付けられる。この当局は外国通貨を受け取らなければ自国通貨を発行できず、発行した自国通貨に対して100%の準備として当該外国通貨を保有しなければならない。したがって、その国のマネタリーベース(銀行準備とベースマネー)は全額が外貨準備によって裏付けられていることになる。\\n\\n## 為替レートと貿易収支:弾力性アプローチと吸収アプローチ\"},{\"id\":19,\"type\":\"multiple-choice\",\"question\":\"貿易赤字(trade deficit)を抱える国について、最も可能性が高いのは次のうちどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"それとちょうど同額の資本収支の黒字(capital account surplus)を持つことになる。\"},{\"label\":\"b\",\"text\":\"投資支出をファイナンスするのに十分な貯蓄を行うことになる。\"},{\"label\":\"c\",\"text\":\"赤字をファイナンスするために外国人から資産を買うことになる。\"}],\"correct\":\"a\",\"explanation\":\"貿易赤字は、それをファイナンスするためにちょうど同額の資本収支の黒字と釣り合わなければならない。資本収支の黒字は、外国人からの借入(自国の負債の増加)および/または外国人への資産の売却(自国資産の減少)を表す。資本収支の黒字は一般に「資本流入(capital inflow)」と呼ばれる。これは結果として自国経済への外国からの投資が増加することを意味するためである。\"},{\"id\":20,\"type\":\"multiple-choice\",\"question\":\"ある大規模な製造業国が、持続的な貿易赤字を是正するために自国通貨をデバリュエーション(devalue)した。次の国内セクターのうち、このデバリュエーションから最も大きな恩恵を受けると考えられるのはどれか。\",\"options\":[{\"label\":\"a\",\"text\":\"高級車(luxury cars)。\"},{\"label\":\"b\",\"text\":\"ブランド処方薬(branded prescription drugs)。\"},{\"label\":\"c\",\"text\":\"レストランおよび実演型の娯楽施設。\"}],\"correct\":\"a\",\"explanation\":\"自国通貨をデバリュエーションすることは、自国の生産者が外国の顧客に提示する価格を引き下げることを意味する。売上・収入への影響は需要の価格弾力性に依存する。価格の高い高級品/贅沢品(luxury good)は価格弾力性が高い傾向がある。したがって、高級車の生産者はデバリュエーションによって売上・収入が急激に増加する可能性が高い。\"},{\"id\":21,\"type\":\"multiple-choice\",\"question\":\"持続的な貿易黒字(trade surplus)を抱える国が、自国の為替レートを上昇させるよう求められている。為替レートの上昇が貿易黒字を縮小させる効果を持つために、次の調整のうちどれが最も適合するか。\",\"options\":[{\"label\":\"a\",\"text\":\"国内投資が貯蓄に対して相対的に減少しなければならない。\"},{\"label\":\"b\",\"text\":\"外国人は自国の貯蓄に対して相対的に投資を増やさなければならない。\"},{\"label\":\"c\",\"text\":\"世界の資本フローが自国市場へ向かうよう転換しなければならない。\"}],\"correct\":\"c\",\"explanation\":\"貿易黒字は、それに対応する資本収支の赤字を伴わずには縮小できない。購入・売却される資産の組み合わせにかかわらず、外国人は自国の発行者・投資家から購入する資産を減らす(あるいは売却する資産を増やす)必要がある。\"}]}]}]\n"])</script><script>self.__next_f.push([1,"12:I[75181,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"],\"default\"]\n13:I[14677,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"],\"default\"]\n14:I[2971,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"10:[\"$\",\"$L12\",null,{\"formats\":\"$undefined\",\"locale\":\"ja\",\"messages\":{\"nav\":{\"home\":\"ホーム\",\"features\":\"機能\",\"subjects\":\"科目\",\"contact\":\"お問い合わせ\"},\"hero\":{\"tagline\":\"学生のために\",\"title\":\"より短時間で\\nより多く学ぶ\",\"subtitle\":\"忙しい学生向けのフラッシュカードとクイズ。一つずつ概念を学び、即座にフィードバックを得て、進捗を追跡。\",\"ctaStart\":\"無料で始める\",\"flashcardsLink\":\"フラッシュカードを試す\",\"ctaBrowse\":\"科目を見る\"},\"features\":{\"title\":\"試験対策に必要なすべて\",\"subtitle\":\"早く結果を出したい学生のためのツール。\",\"flashcardsTitle\":\"フラッシュカード\",\"flashcardsDesc\":\"一枚に一つの概念。いつでもどこでも復習できます。\",\"flashcardsLink\":\"学習を始める\",\"quizTitle\":\
