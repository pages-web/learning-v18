answer\":\"一国の経済において貨幣資金を創出・配分・利用することに関わる、機関・市場・規制・手段の総合的な構造のことです。\"},{\"id\":7,\"question\":\"金融市場とは何ですか?\",\"answer\":\"資金余剰部門から資金不足部門へ、直接的または間接的に資金を移転する仕組みを持つ市場のことです(例:債券や株式が取引される市場)。\"},{\"id\":8,\"question\":\"金融機関はどのような基本的役割を果たしますか?\",\"answer\":\"資金を蓄積する主体(預金者)と資金を必要とする主体(借り手)との間で金融仲介の役割を果たし、資源を効率的に配分します。\"},{\"id\":9,\"question\":\"家計の財務計画における主な段階は何ですか?\",\"answer\":\"収入・支出の予算編成、貯蓄・資産形成、借入・負債の管理、リスクからの保護(保険)、投資計画の立案です。\"},{\"id\":10,\"question\":\"金融規制の主な目的は何ですか?\",\"answer\":\"金融システムの安定性を確保し、預金者・投資家の権利と利益を保護し、市場の透明性と公正性を確立することです。\"},{\"id\":11,\"question\":\"中央銀行の金融政策の主な目的は何ですか?\",\"answer\":\"物価の安定(インフレを目標水準に維持すること)、金融システムの安定性の確保、経済成長の支援です。\"},{\"id\":12,\"question\":\"投資信託(ミューチュアルファンド)とは何ですか?\",\"answer\":\"多数の投資家から資金を集め、専門の運用会社の管理のもとで様々な有価証券に投資する金融ファンド・機関のことです。\"},{\"id\":13,\"question\":\"投資銀行(investment bank)は商業銀行とどう違いますか?\",\"answer\":\"投資銀行は預金を受け入れず、企業の証券発行、M\u0026A(合併・買収)の助言、引受(アンダーライティング)などのサービスを提供します。商業銀行は預金を受け入れ、融資を行います。\"},{\"id\":14,\"question\":\"短期金融市場(マネーマーケット)とは何ですか?\",\"answer\":\"満期1年以内で流動性の高い金融商品(短期債券、コマーシャルペーパー、レポなど)が取引される市場のことです。\"},{\"id\":15,\"question\":\"債券とは何ですか?\",\"answer\":\"発行体(国、企業)が一定期間にわたり確定利息を支払い、満期時に元本を返済することを約束する債務証券です。\"},{\"id\":16,\"question\":\"株主(shareholder)は債券保有者(bondholder)とどう違いますか?\",\"answer\":\"株主は会社の共同所有者であり配当を受け取る権利を持ちますがリスクが高い一方、債券保有者は会社への貸し手であり固定利息収入を得て、会社清算時には株主より先に弁済を受けます。\"},{\"id\":17,\"question\":\"外国為替市場(forex)はどのような役割を果たす市場ですか?\",\"answer\":\"各国の通貨を相互に売買し、為替相場を決定する、世界最大の金融市場です。\"},{\"id\":18,\"question\":\"政府予算の歳入の主な財源は何ですか?\",\"answer\":\"租税収入(所得税、付加価値税、関税など)、非租税収入(国有財産収益、罰金、手数料)、援助、借入金です。\"},{\"id\":19,\"question\":\"財政赤字とは何ですか?\",\"answer\":\"政府の歳出が歳入を上回る状態、すなわち財政のマイナス残高のことで、通常は国内外からの借入によって賄われます。\"},{\"id\":20,\"question\":\"社会保険制度の目的は何ですか?\",\"answer\":\"老齢、労働能力の喪失、失業、疾病などの将来のリスクから国民を守るため、年金・給付・医療保険を通じて所得の平準化を図る社会保障制度です。  ---  ## 追加フラッシュカード50枚(21〜70)\"},{\"id\":21,\"question\":\"金融市場を取引対象(商品)によって分類すると、どのような種類がありますか?\",\"answer\":\"商品市場、保険市場、有価証券市場(短期金融市場と資本市場を含む)、外国為替市場、デリバティブ(派生商品)市場です。\"},{\"id\":22,\"question\":\"発行市場(プライマリーマーケット)と流通市場(セカンダリーマーケット)の違いは何ですか?\",\"answer\":\"発行市場では新規に発行された有価証券が初めて取引され、流通市場では既発行の有価証券を投資家同士が売買します。\"},{\"id\":23,\"question\":\"取引所市場と店頭市場(OTC)の違いは何ですか?\",\"answer\":\"取引所市場は証券取引所を通じて組織的に取引される市場であり、店頭市場は取引所を介さず、広範な情報network を通じて非組織的に取引される市場です。\"},{\"id\":24,\"question\":\"金融市場に参加する3つの主要な当事者は誰ですか?\",\"answer\":\"投資家(個人、企業、政府 — 資金余剰側)、資金調達者(企業、地方自治体など — 資金不足側)、仲介者(銀行、ブローカー、ディーラー、引受業者、証券取引所)です。\"},{\"id\":25,\"question\":\"金融市場が果たす5つの主要機能(目的)は何ですか?\",\"answer\":\"リスクの軽減、仲介機能の遂行、富の増大、資金調達の創出、支払能力(流動性)の確保です。\"},{\"id\":26,\"question\":\"貯蓄信用組合(ХЗХ)とは何ですか?\",\"answer\":\"特別な許可のもと、自らの組合員のみに貯蓄・貸付サービスを提供する、組合員所有の非営利金融機関です。\"},{\"id\":27,\"question\":\"信用保証基金(ЗБДС)はどのような役割を果たしますか?\",\"answer\":\"担保が不足する中小生産者に対して融資保証を提供し、その対価として保証手数料を受け取る非営利機関です。\"},{\"id\":28,\"question\":\"投資ファンド(ХОС)は誰が運用しますか?\",\"answer\":\"金融規制委員会(СЗХ)の許可を受けた投資運用会社(ХОМК)が、契約に基づき投資ファンドの資産を運用します。\"},{\"id\":29,\"question\":\"農産物取引所(ХААБ)はどのような役割を果たしますか?\",\"answer\":\"原産地・品質証明を備え基準を満たした農畜産物の原材料を、統合情報システムを通じて市場価格で販売できるようにする一元化された拠点です。\"},{\"id\":30,\"question\":\"商業銀行の3つの中核機能は何ですか?\",\"answer\":\"貯蓄(預金)を集める機能、信用創造(貸付)機能、決済(サービス)機能です。\"},{\"id\":31,\"question\":\"2025年時点で、モンゴルには何行の商業銀行が営業していますか?\",\"answer\":\"合計12行の商業銀行(国営1行「ステートバンク」、民間11行)が、1,400を超える支店・営業拠点を有しています。\"},{\"id\":32,\"question\":\"モンゴルで銀行に義務付けられている自己資本比率(CAR)の最低基準はいくらですか?\",\"answer\":\"リスク加重資産に対する総自己資本の比率は12%以上でなければならず(基本的自己資本(Tier 1)比率は9%以上)。\"},{\"id\":33,\"question\":\"ノンバンク金融機関(ББСБ)はどのような業務を行いますか?\",\"answer\":\"金融規制委員会の許可を受け、自己所有者の資金による融資、外国為替取引、決済、送金、ファクタリング、ファイナンスリースなどの業務を行う営利機関です。\"},{\"id\":34,\"question\":\"家計所得は頻度によってどの2種類に分類されますか?\",\"answer\":\"毎月同じ金額が入る固定所得(給与など)と、毎月金額が変動する変動所得(賞与、報奨金など)です。\"},{\"id\":35,\"question\":\"個人(家計)の貸借対照表における資産項目と負債項目はそれぞれ何を示しますか?\",\"answer\":\"資産項目はお金がどこにどのような形で保有されているか(預金、不動産、株式など)を示し、負債項目はその資金の出所、すなわち債務(借入金、その他未払金)を示します。資産 − 負債 = 純資産です。\"},{\"id\":36,\"question\":\"モンゴル銀行がモンゴル人民共和国の国立銀行となり、中央銀行の機能を果たし始めたのはいつですか?\",\"answer\":\"1954年です。\"},{\"id\":37,\"question\":\"モンゴルの二段階銀行制度はいつ確立されましたか?\",\"answer\":\"1990年の「商業銀行の設立及び運営に関する一般規則」と1991年の「銀行法」の制定により、1990〜1991年に確立されました。\"},{\"id\":38,\"question\":\"中央銀行と商業銀行の最も根本的な違いは何ですか?\",\"answer\":\"モンゴル銀行は国家が設立した非営利機関であり、通貨を発行し金融政策を策定・実施します。一方、商業銀行は株主に対して責任を負う営利機関であり、金融政策を策定しません。\"},{\"id\":39,\"question\":\"モンゴル銀行の主要な目標は何ですか?\",\"answer\":\"自国通貨トゥグルグの安定、すなわち持続的に低いインフレ率を維持することです。\"},{\"id\":40,\"question\":\"モンゴル銀行の金融政策における3つの主要な手段は何ですか?\",\"answer\":\"短期(政策)金利の変更、預金準備率の変更、公開市場操作の実施です。\"},{\"id\":41,\"question\":\"「政策金利」とは何ですか?\",\"answer\":\"商業銀行が7日満期でモンゴル銀行に資金を預けて得る金利(政府証券・中央銀行証券の金利)であり、銀行間市場金利や預金・貸出金利を決定づける中心的な指標金利です。\"},{\"id\":42,\"question\":\"政策金利が引き上げられるとどのような結果が生じますか?\",\"answer\":\"商業銀行は貸出よりもモンゴル銀行への安全な預入を選好するようになり貸出が減少し、その結果インフレ率が低下する傾向が生じます。\"},{\"id\":43,\"question\":\"モンゴル銀行の機能を少なくとも4つ挙げてください。\",\"answer\":\"通貨の発行、金融政策の策定・実施、政府の財政代理人としての機能、銀行業務の監督、銀行間決済の運営、外貨準備の保有・管理、預金者の権利保護、マクロプルーデンス政策の実施です。\"},{\"id\":44,\"question\":\"投資信託(ミューチュアルファンド)が投資家を惹きつける5つの主な利点は何ですか?\",\"answer\":\"流動性の仲介、少額投資の仲介(小口資金で高額な証券を購入できること)、分散投資、コスト面での優位性、専門的な運用能力へのアクセスです。\"},{\"id\":45,\"question\":\"オープンエンド型ファンドとクローズドエンド型ファンドの違いは何ですか?\",\"answer\":\"オープンエンド型ファンドは投資家が望む時にいつでも持分を買い戻すため無制限に拡大できますが、クローズドエンド型ファンドは当初の募集時に一定数の持分のみを発行し、その後は流通市場でのみ取引されます。\"},{\"id\":46,\"question\":\"投資信託の純資産価値(NAV)とは何ですか?\",\"answer\":\"ファンドが保有する総資産(株式、債券、現金)の価値から負債を差し引いた金額を、発行済み口数で割った数値です。\"},{\"id\":47,\"question\":\"保険会社はなぜ利益を得るのですか?\",\"answer\":\"予想される保険金支払い(claims)と会社の利益を賄うのに十分な水準の保険料(premium)を徴収しているためです。\"},{\"id\":48,\"question\":\"再保険(reinsurance)とは何ですか?\",\"answer\":\"保険会社が引き受けたリスクの一部を、保険料の一部とともに他の保険会社に移転する方法で、これによりより大規模な保険契約を引き受けることが可能になります。\"},{\"id\":49,\"question\":\"年金制度の2つの主要な種類は何ですか?\",\"answer\":\"確定給付型(defined-benefit)— 雇用主が年金支給額を確定的に約束する方式と、確定拠出型(defined-contribution)— 拠出額のみが定められ、最終的な年金額はファンドの運用実績に依存する方式です。\"},{\"id\":50,\"question\":\"生命保険はどのような役割を果たしますか?\",\"answer\":\"被保険者が死亡した場合に、その者に扶養されていた受取人(beneficiary)に所得を提供し、経済的な保護を行います。\"},{\"id\":51,\"question\":\"短期金融市場で取引される金融商品の例を挙げてください。\",\"answer\":\"国庫短期証券・商業手形、譲渡性預金証書(CD)、銀行間預け金、コマーシャルペーパー(CP)、銀行引受手形、短期国債、ユーロダラーなどです。\"},{\"id\":52,\"question\":\"裁定取引(アービトラージ)とは何ですか?\",\"answer\":\"異なる2つの市場、商品、あるいは時点の間に生じた価格差や金利差を利用して(通常はリスクを抑えて)利益を得る取引行為のことです。\"},{\"id\":53,\"question\":\"ヘッジ(hedging)とは何ですか?\",\"answer\":\"資産・負債の価値やキャッシュフローを将来の不利な変動から守るために、デリバティブ商品を用いてリスクを軽減する方法です。\"},{\"id\":54,\"question\":\"固定為替相場制と自由変動為替相場制の主な違いは何ですか?\",\"answer\":\"固定為替相場制では中央銀行が相場を一定水準に維持するために積極的に介入する必要があり、多額の外貨準備が必要です。自由変動為替相場制では相場が市場で自由に変動し、中央銀行は介入しないため、独自に金融政策を実施できます。\"},{\"id\":55,\"question\":\"直接介入と間接介入の違いは何ですか?\",\"answer\":\"直接介入とは中央銀行自らが外貨の売買を行い相場に即座かつ迅速に影響を与える方法であり、間接介入とは政策金利や準備率などの政策手段を用いて相場に間接的・段階的に影響を与える方法です。\"},{\"id\":56,\"question\":\"先渡し(フォワード)契約と先物(フューチャーズ)契約の主な違いは何ですか?\",\"answer\":\"フォワード契約は取引所を介さず、当事者間で合意した標準化されていない条件で締結されます。先物契約は取引所で取引される標準化された契約であり、取引所が決済不履行のリスクを保証します。\"},{\"id\":57,\"question\":\"オプション契約とは何ですか?\",\"answer\":\"特定の資産を将来、合意した価格で買う権利(コールオプション)、または売る権利(プットオプション)を — 義務ではなく権利として — 保有者に与える契約です。\"},{\"id\":58,\"question\":\"スワップ取引とは何ですか?\",\"answer\":\"今日の相場で通貨・貴金属を売却(または購入)すると同時に、合意した相場で将来それを買い戻す(または売り戻す)という2つの取引を同時に実行する契約です。\"},{\"id\":59,\"question\":\"モンゴルの統合予算はどの4つの予算から構成されますか?\",\"answer\":\"国家予算、社会保険基金予算、医療保険基金予算、地方予算です。\"},{\"id\":60,\"question\":\"統合予算のうち国家予算が占めるおおよその割合はどのくらいですか?\",\"answer\":\"約80%です。\"},{\"id\":61,\"question\":\"財政安定化基金の目的は何ですか?\",\"answer\":\"世界市場における鉱物資源価格の変動による予算収入の変動を緩和するために2011年に設立された基金です。\"},{\"id\":62,\"question\":\"未来遺産基金(Future Heritage Fund)の目的は何ですか?\",\"answer\":\"再生不可能な鉱物資源から得られる収入を、現世代と将来世代の間で公平に配分するために2017年に設立された基金です。\"},{\"id\":63,\"question\":\"租税、負担金、手数料の違いは何ですか?\",\"answer\":\"租税は所得・財産・物品・サービスに対して直接的な対価なしに課されるもの、負担金は国有の天然資源の利用や汚染に対して課されるもの、手数料は国の機関が提供するサービスの対価として課されるものです。\"},{\"id\":64,\"question\":\"直接税と間接税の違いは何ですか?\",\"answer\":\"直接税は所得に対して課されます(例:所得税)。間接税はサービス・販売に対して課されます(例:付加価値税)。\"},{\"id\":65,\"question\":\"経常支出と資本支出の違いは何ですか?\",\"answer\":\"経常支出は毎年繰り返し発生し、恒久的な資産を形成しません(給与、年金、補助金など)。資本支出は一度限りで金額が大きく、国の資産を増加させ、長年にわたって使用されます(建物、設備など)。\"},{\"id\":66,\"question\":\"社会保険の5つの種類を挙げてください。\",\"answer\":\"年金保険、給付(手当)保険、医療保険、労働災害及び職業病保険、失業保険です。\"},{\"id\":67,\"question\":\"普通株主が持つ権利は何ですか?\",\"answer\":\"会社の持分の共同所有者であること、配当を受け取る権利、会社の意思決定に対する議決権、株価上昇による売却益、いつでも売買できる権利です。\"},{\"id\":68,\"question\":\"優先株(preferred stock)は普通株とどう違いますか?\",\"answer\":\"優先株主は固定配当を優先的に受け取る権利を持ち、会社清算時には普通株主より先に弁済を受けますが、通常は議決権を持ちません。\"},{\"id\":69,\"question\":\"株式評価における「割高(overvalued)」とはどういう意味ですか?\",\"answer\":\"株式の本源的価値(適正価値)が現在の市場価格よりも低い状態、すなわち市場価格が本源的価値を上回っている状態のことです。\"},{\"id\":70,\"question\":\"コーラブル債(callable bond)とパッタブル債(putable bond)の違いは何ですか?\",\"answer\":\"コーラブル債は発行体が早期償還(買い戻し)できる権利を持つ債券で(通常は割安であり、金利低下リスクから発行体を守る)、パッタブル債は保有者が早期に売り戻せる権利を持つ債券です(通常はプレミアムが付いて割高であり、市場下落から保有者を守る)。\"}]}]\n"])</script><script>self.__next_f.push([1,"12:I[75181,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"],\"default\"]\n13:I[14677,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"],\"default\"]\n14:I[2971,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"10:[\"$\",\"$L12\",null,{\"formats\":\"$undefined\",\"locale\":\"ja\",\"messages\":{\"nav\":{\"home\":\"ホーム\",\"features\":\"機能\",\"subjects\":\"科目\",\"contact\":\"お問い合わせ\"},\"hero\":{\"tagline\":\"学生のために\",\"title\":\"より短時間で\\nより多く学ぶ\",\"subtitle\":\"忙しい学生向けのフラッシュカードとクイズ。一つずつ概念を学び、即座にフィードバックを得て、
