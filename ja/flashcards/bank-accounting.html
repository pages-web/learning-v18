業の資金を一時的に保有している、すなわち当事業に債務がある法人。\"},{\"id\":5,\"question\":\"銀行会計の勘定は基本的にどのような種類に分けられるか。\",\"answer\":\"バランス勘定(資産勘定、負債勘定、資本勘定)、損益勘定(収益勘定、費用勘定)、及び簿外勘定に分けられる。\"},{\"id\":6,\"question\":\"銀行は(キャッシュフロー計算書を除く)財務諸表をどのような基準に基づいて報告するか。\",\"answer\":\"権責発生主義(アクルーアル、累積主義)に基づき、継続性、安定性、重要性と統合性、独立性、客観性、金額測定可能性、比較可能性、適時性の原則を遵守して報告する。\"},{\"id\":7,\"question\":\"銀行の財務諸表の4つの基本構成要素を挙げなさい。\",\"answer\":\"財務諸表1号(ST-1)バランスシート(財務状態表)、財務諸表2号(ST-2)損益計算書、財務諸表3号(ST-3)資本変動計算書、財務諸表4号(ST-4)キャッシュフロー計算書(さらに注記、附属資料、簿外報告書が添付される)。  ## 二. 勘定計画、記帳文書及び管理\"},{\"id\":8,\"question\":\"勘定番号の桁構成を、勘定120110を例に説明しなさい。\",\"answer\":\"第1桁 — 勘定の基本種類(1 = 資産);第2桁 — グループ(12 = モンゴル銀行に預けた資金);第3~4桁 — サブグループ(1201 = モンゴル銀行における決済用預金口座);第5~6桁 — 所有・通貨区分(120110 = トゥグルグ決済用預金口座);第7~10桁 — 当該勘定の個別(名称)コード。\"},{\"id\":9,\"question\":\"会計文書に求められる3つの基本要件を挙げなさい。\",\"answer\":\"承認された統一の様式(フォーム)を備えていること、修正なく完全に記入されていること、承認(確認)されていること。\"},{\"id\":10,\"question\":\"事前管理と事後管理の違いを説明しなさい。\",\"answer\":\"事前管理 — 取引を行う前、すなわち顧客の文書を受け取る際に行う記帳、署名、口座の資金の十分性などに対する管理。事後管理 — 取引が発生した後にその記録を追って行う管理であり、主任テラー、会計担当者、内部管理・検査担当者が実施する。\"},{\"id\":11,\"question\":\"銀行会計の勘定をコード化する2つの基本目的は何か。\",\"answer\":\"銀行システムのバランスを整理すること、取引を簡便化すること。\"},{\"id\":12,\"question\":\"取引文書は会計への反映方法によってどのように分類されるか。\",\"answer\":\"バランス勘定の文書、簿外勘定の文書という2種類に分類される;また出所別に顧客作成文書と内部文書、作成形式別に出納文書とメモリアル(振替)文書に区分される。  ## 三. 現金資産の会計\"},{\"id\":13,\"question\":\"「現金及び現金同等物」の区分には何が含まれるか。\",\"answer\":\"金庫内現金、チェック、送金中の現金、未検査(未確認)の現金、ATM内の現金、銀行・金融機関に預けた3か月以内の資金、現金同等物、未収利息の見積り。\"},{\"id\":14,\"question\":\"顧客がトゥグルグで現金の受入取引を行った場合、どのような仕訳が行われるか。\",\"answer\":\"借方 金庫内現金 / 貸方 決済用預金・預金の該当口座。\"},{\"id\":15,\"question\":\"袋で集金した現金を検査・確認する際の記帳の順序を例を用いて説明しなさい(3,000,000₮を集金し、検査の結果100₮の不足が生じた場合)。\",\"answer\":\"まず借方 未検査現金 3,000,000 / 貸方 決済用預金口座 3,000,000。検査後、借方 金庫内現金 2,999,900 / 貸方 未検査現金 2,999,900、さらに不足分の100につき借方 決済用預金口座 100 / 貸方 未検査現金 100とする。\"},{\"id\":16,\"question\":\"出納の過剰・不足が生じた場合、どのような仲介勘定を用いるか。\",\"answer\":\"過剰・不足・損耗勘定 — 過剰分はこの勘定を経由して収益に、不足分も同じくこの勘定を経由して責任者への未収金/罰金収益に計上する。\"},{\"id\":17,\"question\":\"銀行出納の1日の終業残高を求める計算式を書きなさい。\",\"answer\":\"日初残高 + 当日の現金受入文書の合計 − 当日の現金支払文書の合計 = 当日終業残高。\"},{\"id\":18,\"question\":\"現金輸送の発送と受領とは何か。\",\"answer\":\"発送 — 他行・他支店へ現金を輸送すること(借方 送金中現金 / 貸方 金庫内現金)。受領 — 受取側が到着した現金を必要に応じて検査・確認すること(借方 未検査現金 / 貸方 行内相互決済)。\"},{\"id\":19,\"question\":\"銀行の出納文書は保管所へ移管してから何年間保存するか。\",\"answer\":\"15年間。  ## 四. 有価証券投資の会計\"},{\"id\":20,\"question\":\"銀行は有価証券にどのような3つの目的で投資を行うか。\",\"answer\":\"流動性を確保するため、投資による利益を得るため、分散投資(多様化)を行うため。\"},{\"id\":21,\"question\":\"銀行は有価証券をいくつの区分に分類するか、挙げなさい。\",\"answer\":\"4区分:「売買目的、すなわち損益を通じて公正価値で表示する」、「満期保有目的」(HTM)、「売却可能」(AFS)、「貸出金及び受取勘定として分類した有価証券」。\"},{\"id\":22,\"question\":\"短期のディスカウント方式の有価証券の割引率(d)を求める計算式を書きなさい。\",\"answer\":\"d = (F − P) / P × 360/t、ここでFは有価証券の額面価額、Pは割引価格、tは償還までの残存期間である。\"},{\"id\":23,\"question\":\"有価証券を額面価格、割高(プレミアム)価格、割安(ディスカウント)価格で購入するとはどういうことか説明しなさい。\",\"answer\":\"額面価格で:額面価額 = 購入価額。割高価格で:額面価額 \u003c 購入価額(プレミアム付き)。割安価格で:額面価額 \u003e 購入価額(ディスカウント付き)。\"},{\"id\":24,\"question\":\"「売買目的、すなわち損益を通じて公正価値で表示する」区分の有価証券はどのように評価されるか。\",\"answer\":\"当初の購入原価と市場価格のいずれか低い方で記帳し、毎月市場相場の変動差額により評価調整を行い、発生した収益・費用を当該報告期間の純利益に直接反映させる。\"},{\"id\":25,\"question\":\"プレミアム付きの満期保有目的証券を購入する際の仕訳を書きなさい。\",\"answer\":\"借方 満期保有目的証券(HTM)— 該当有価証券 / 借方 有価証券未償却プレミアム / 貸方 モンゴル銀行決済用預金口座(または現金資産)。\"},{\"id\":26,\"question\":\"ディスカウントで購入した「貸出金及び受取勘定」区分の有価証券の割引額を期間にわたって償却する際、どのような仕訳を行うか。\",\"answer\":\"借方 有価証券未償却ディスカウント / 貸方 受取利息。\"},{\"id\":27,\"question\":\"「売却可能」区分の有価証券を毎月再評価した際に生じる正の差額はどこに記帳されるか。\",\"answer\":\"売却可能証券(AFS)再評価積立金という自己資本の勘定に記帳する(借方 AFS(未償却プレミアム)/ 貸方 AFS再評価積立金)。\"},{\"id\":28,\"question\":\"満期保有目的証券の質的分類とそれに対応する準備金設定率を挙げなさい。\",\"answer\":\"正常0%、要注意5%、不良25%、懸念50%、損失100%。  ## 五. 商業銀行の貸出金及び貸出金の会計\"},{\"id\":29,\"question\":\"「貸出(ゼール)」という言葉はどのような語源を持つか。\",\"answer\":\"ラテン語の「kreditium」、すなわち貸付・債務を意味する言葉に由来する。\"},{\"id\":30,\"question\":\"貸出の7つの基本原則を挙げなさい。\",\"answer\":\"使途性、期限性、有利子性、返済性、限度性、担保性、相互利益性。\"},{\"id\":31,\"question\":\"貸出金は期間によってどのように分類されるか。\",\"answer\":\"短期(12か月以内)、中期(13~60か月)、長期(61か月以上)。\"},{\"id\":32,\"question\":\"貸出金の返済の2つの基本形式を挙げなさい。\",\"answer\":\"一括返済(期限末に元本を一度に返済する)、分割返済(元本と利息を段階的に返済する)。\"},{\"id\":33,\"question\":\"名目利率、実質利率、実効利率、適用可能利率の違いを説明しなさい。\",\"answer\":\"名目利率 — 銀行が当該貸出に設定した利率。実質利率 — 名目利率からインフレ率を除いた利率。実効利率 — 貸出に伴って発生した費用を組み込んだ利率。適用可能利率 — 貸出の下限(最低)利率水準。\"},{\"id\":34,\"question\":\"貸出を実行する際の基本的な仕訳を書きなさい。\",\"answer\":\"借方 貸出金の該当勘定 / 貸方 借入人の決済用預金口座(または現金資産の該当勘定)。\"},{\"id\":35,\"question\":\"貸出金の質的5区分とそれに対応するリスク準備金の割合を挙げなさい。\",\"answer\":\"正常貸出1%、要注意貸出5%、不良貸出25%、懸念貸出50%、損失貸出100%。\"},{\"id\":36,\"question\":\"正常貸出と要注意貸出を、延滞日数によって区別して説明しなさい。\",\"answer\":\"正常貸出 — 契約で定めた期限内、または15日以内の延滞。要注意貸出 — 返済が行われず90日以内の延滞。(以降、不良は91~180日、懸念は181~360日、損失は361日以上の延滞となる。)\"},{\"id\":37,\"question\":\"貸出金の偶発リスク準備金を設定する際の仕訳を書きなさい。\",\"answer\":\"借方 貸出金偶発リスク費用 / 貸方 貸出金偶発リスク準備金。  ## 六. 銀行間(為替)決済\"},{\"id\":38,\"question\":\"銀行間決済とは何か。\",\"answer\":\"銀行間の取引関係から生じる資金の流れであり、モンゴル銀行(中央銀行)及び決済センターを通じて、その管理の下で行われる決済である。\"},{\"id\":39,\"question\":\"クレジット通知書とデビット通知書とは何か。\",\"answer\":\"クレジット通知書 — 自らの発意により支払を実行する通知書(借方 該当勘定 / 貸方 銀行間決済仮勘定)。デビット通知書 — 支払を受け取る通知書(借方 銀行間決済仮勘定 / 貸方 該当勘定)。\"},{\"id\":40,\"question\":\"銀行間決済仮勘定(БХТТД)が資産残高または負債残高を持つ場合、クリアリングセンターから届いた照合書をどのように締めるか。\",\"answer\":\"資産残高の場合:借方 モンゴル銀行決済用預金口座 / 貸方 銀行間決済仮勘定。負債残高の場合:借方 銀行間決済仮勘定 / 貸方 決済用預金口座(未達・振替中)。\"},{\"id\":41,\"question\":\"支店間決済(СХТ)と銀行間決済(БХТ)のセンターはそれぞれ何か。\",\"answer\":\"支店間決済のセンターは当該商業銀行の本店(中央支店);銀行間決済のセンターはモンゴル銀行(クリアリングセンター)である。\"},{\"id\":42,\"question\":\"支店間決済が一致しない場合に生じる差異の例を挙げなさい。\",\"answer\":\"金額の不一致、取引の二重入力、A/B両銀行の口座番号の不一致、勘定の性質(借方/貸方)の誤入力、通知書の種類の誤指定、取引ファイルの二重取得・二重送信。\"},{\"id\":43,\"question\":\"決済用預金口座の残高が不足する場合、銀行はどのような資金源を利用するか、また借入を行った銀行側ではどのような仕訳が行われるか。\",\"answer\":\"銀行間市場からの借入を行う;借入を行った銀行側では借方 銀行間決済仮勘定(借入人)/ 貸方 銀行間市場借入金(БХЗАЗ)となる。  ## 七. その他の金融資産及び非金融資産の会計\"},{\"id\":44,\"question\":\"不良債権の準備金を設定する際の区分期間と割合を書きなさい。\",\"answer\":\"正常(30日以内)0%、延滞(31~60日)5%、不良(61~90日)40%、懸念(91~120日)75%、損失(121日以上)100%。\"},{\"id\":45,\"question\":\"不良債権をリスク準備金で償却し、帳簿から除去する際の仕訳を書きなさい。\",\"answer\":\"借方 債権リスク準備金 / 貸方 受取勘定(債権)。\"},{\"id\":46,\"question\":\"前払計算と前払費用の違いを説明しなさい。\",\"answer\":\"前払計算 — 財・サービスを受け取るまでの前払金(例:社会保険料の前払);受け取った時点で資産・費用に振り替わる。前払費用 — 各報告期間に徐々に配分される費用(例:保険料、賃借料)。\"},{\"id\":47,\"question\":\"代物弁済により取得したその他の資産(ӨБҮХХ、OREO)とは何か。\",\"answer\":\"借入人の貸出返済に関する決済として担保に供されていた資産を、他者から所有権を取得することとなった資産であり、売却を目的とし、銀行の本業とは無関係な資産である。\"},{\"id\":48,\"question\":\"OREOの分類及び準備金設定率を(所有権取得後の日数により)書きなさい。\",\"answer\":\"正常(30日以内)1%、延滞(31~60日)5%、不良(61~90日)25%、懸念(91~120日)50%、損失(121日以上)100%。\"},{\"id\":49,\"question\":\"OREOを当初取得・記帳する際の仕訳を書きなさい。\",\"answer\":\"借方 代物弁済により取得したその他の資産 / 貸方 貸出金、該当する受取勘定・計算勘定。\"},{\"id\":50,\"question\":\"後日報告計算(ДТТооцоо)は何を記帳するか、例を挙げなさい。\",\"answer\":\"将来報告される費用の前払いを記帳する仲介勘定である;例として出張前払金の支給(借方 後日報告計算 / 貸方 現金資産)があり、後に報告書が提出された時点で該当費用に締める。\"},{\"id\":51,\"question\":\"OREOを当初の記帳価額よりも高い価格で売却した場合、売却益はどのように記帳されるか。\",\"answer\":\"借方 現金資産の該当勘定(売却価額で)/ 貸方 代物弁済により取得したその他の資産(当初原価で)/ 貸方 OREO売却益(価格差額で)。  ## 八. 固定資産の会計\"},{\"id\":52,\"question\":\"固定資産には何が含まれるか。\",\"answer\":\"土地、建物(建屋、暖房、空調、電気設備を含む)、備品、コンピュータ・機器、未完成の建設工事すなわち固定資産の資金投入。\"},{\"id\":53,\"question\":\"資本的修繕と経常的修繕の違いを説明しなさい。\",\"answer\":\"資本的修繕 — 当該固定資産の購入・調達に関連して発生したすべての費用(資産の原価に資本化する)。経常的修繕 — 資本化対象以外のすべての費用(当該期間の費用として記帳する)。\"},{\"id\":54,\"question\":\"減価償却を計算する3つの基本的な方法を挙げなさい。\",\"answer\":\"直線法、加速法(残存価額倍額減少法、級数法)、生産量比例法。\"},{\"id\":55,\"question\":\"直線法により年間の減価償却費を計算する式を書きなさい。\",\"answer\":\"年間減価償却費 = (取得原価 − 残存価額) / 耐用年数。\"},{\"id\":56,\"question\":\"残存価額倍額減少(加速)法の償却率はどのように計算するか。\",\"answer\":\"償却率 = (100 / n) × 2(nは耐用年数)であり、この率を前年度の帳簿価額に乗じて当年度の減価償却費を求める。\"},{\"id\":57,\"question\":\"固定資産を除却する際、及び利益を伴って売却する際の仕訳を書きなさい。\",\"answer\":\"除却:借方 減価償却累計額 / 貸方 固定資産。利益を伴う売却:借方 現金資産(売却価額で)/ 貸方 固定資産(帳簿価額で)/ 貸方 固定資産売却益(差額で)。  ## 九. 決済用預金及び預金の会計\"},{\"id\":58,\"question\":\"決済用預金口座を銀行及び顧客の観点から定義しなさい。\",\"answer\":\"銀行の観点から — 支払決済を行うために現金及びそれに準じる資産を預け入れたことにより生じた金融負債。顧客の観点から — 支払決済を目的として預け入れた主要な支払手段。\"},{\"id\":59,\"question\":\"預金を銀行及び顧客の観点から定義しなさい。\",\"answer\":\"銀行の観点から — 収益を得る目的で一定の条件のもとに資金を預け入れたことにより生じた金融負債。顧客の観点から — 将来の利用を目的として契約に基づき預け入れた資産。\"},{\"id\":60,\"question\":\"決済用預金口座は保有主体の種類によってどのように分類されるか。\",\"answer\":\"国家機関、民間セクター、居住者・非居住者、金融機関、個人、その他の機関、国庫・地方予算機関のものに分類される。\"},{\"id\":61,\"question\":\"単利を計算する式を書きなさい。\",\"answer\":\"利息 = 預金額 × 年利率% × 期間 / 365。\"},{\"id\":62,\"question\":\"複利を計算する方法の特徴を説明しなさい。\",\"answer\":\"未払利息の前回の計算額を預金の元本に加算し、その上で再び利息を計算する方法(「利息の利息」すなわちcompound interest)。\"},{\"id\":63,\"question\":\"顧客が現金で預金に入金した場合、どのような仕訳が行われるか。\",\"answer\":\"借方 現金の該当勘定 / 貸方 預金の該当勘定。\"},{\"id\":64,\"question\":\"預金の未払計上利息を支払う際の仕訳を書きなさい。\",\"answer\":\"借方 未払計上利息 / 貸方 預金勘定。  ## 十. 銀行・金融機関からの非預金性資金調達の会計\"},{\"id\":65,\"question\":\"非預金性資金源には何が含まれるか。\",\"answer\":\"モンゴル銀行からの借入金、海外銀行からの借入金、国内銀行からの借入金、他行が決済用預金・預金の形で預け入れた金融負債。\"},{\"id\":66,\"question\":\"銀行間借入の利点を挙げなさい。\",\"answer\":\"利率の上限・下限及び金額を自由に協議できること、期間が短いこと、銀行の流動性を迅速に調整できること。\"},{\"id\":67,\"question\":\"借入資金を調達する際に発生した手数料(繰延費用)はどのように記帳されるか。\",\"answer\":\"資金の当初価額に組み込み、負債を減額する「資金調達繰延費用」勘定に記帳し、借入期間にわたって実効利率法により徐々に償却する。\"},{\"id\":68,\"question\":\"繰延費用を期間にわたって償却する仕訳を書きなさい。\",\"answer\":\"借方 貸出利息費用 / 貸方 資金調達繰延費用(費用)。\"},{\"id\":69,\"question\":\"非預金性資金源はなぜ銀行の負債において主要な地位を占めないのか。\",\"answer\":\"借入としての性質を持ち、コストが高いためである。  ## 十一. その他の資金源の会計\"},{\"id\":70,\"question\":\"その他の資金源には何が含まれるか。\",\"answer\":\"貸出の担保として分離された資金源、非現金決済の資金源として顧客から分離された資金(信用状(アクレディティブ)など)、銀行が発行した債券・有価証券、協調融資(シンジケート)の資金源。\"},{\"id\":71,\"question\":\"信用状(アクレディティブ)の資金源に資産を分離して記帳する際の当初仕訳を書きなさい。\",\"answer\":\"借方 顧客の決済用預金口座、現金資産の該当勘定 / 貸方 信用状資金源。\"},{\"id\":72,\"question\":\"協調融資(シンジケート資金源)とは何か。\",\"answer\":\"複数の銀行が共同で単一の借入人に貸出を行う際に、資金源を統合して形成する貸出形式であり、当該銀行は国際機関のプロジェクト貸出を取り次ぐ側、またはシンジケート貸出の参加銀行の一つとして関与する。\"},{\"id\":73,\"question\":\"振込未払金とは何か。\",\"answer\":\"顧客に対して、異なる県・市・国の間で行われる資金移転を、受取人に交付するまでの間、一時的に記帳する未払金勘定である。\"},{\"id\":74,\"question\":\"銀行が発行した債券を割高/割安価格で販売した場合、何を減額(償却)して記帳するか。\",\"answer\":\"割高価格で販売した場合はプレミアムを、割安価格で販売した場合はディスカウントを、債券の期間にわたり各報告期間ごとに減額(償却)して記帳する。  ## 十二. 年度決算処理\"},{\"id\":75,\"question\":\"年度決算とは何か、その基本目的は何か。\",\"answer\":\"当該会計年度中に行われたすべての取引を集計して締め、結果を計算し、利益・損失を確定し、翌年度の開始へ引き継ぐ業務である。目的:収益・費用を完全に記帳すること、利益・損失を確定すること、財務諸表を正確に作成すること。\"},{\"id\":76,\"question\":\"年度決算の4つの基本段階を挙げなさい。\",\"answer\":\"事前集計(収益・費用勘定の残高を集計する)、決算仕訳(収益・費用を累積利益・損失勘定へ締める)、利益配分の記帳、バランス調整(仮勘定をゼロにし、新年度の勘定へ引き継ぐ)。\"},{\"id\":77,\"question\":\"収益及び費用の勘定を会計年度末に締める基本的な仕訳を書きなさい。\",\"answer\":\"借方 収益の全勘定 / 貸方 当期利益;また借方 当期損失 / 貸方 費用の全勘定。\"},{\"id\":78,\"question\":\"簿外勘定にはどのような項目が記帳されるか。\",\"answer\":\"貸出及び貸出に準ずる資産に関連する偶発債務(保証、連帯保証、信用状)、担保資産、バランスから除却した資産、デリバティブ金融商品、顧客に代わって保証した資産、担保として提供された資産。  ## 十三. 自己資本の会計\"},{\"id\":79,\"question\":\"定款資本(法定資本金)とは何か。\",\"answer\":\"普通株式及び優先株式に出資者が出資した資金であり、自己資本の大部分を占める;中央銀行が商業銀行の定款資本の最低額を定める。\"},{\"id\":80,\"question\":\"第一次(基本的)及び第二次(補完的)階層の自己資本には何が含まれるか。\",\"answer\":\"第一次階層 — 出資資本、利益から配分して設立した準備金、過年度及び当年度の利益など、比較的安定した資金源。第二次階層 — 劣後債務、固定資産再評価剰余金、偶発リスク準備金、社会開発基金など、比較的不安定で負債的性質を持つ資金源。\"}]}]\n"])</script><script>self.__next_f.push([1,"12:I[75181,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"],\"default\"]\n13:I[14677,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"],\"default\"]\n14:I[2971,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"10:[\"$\",\"$L12\",null,{\"formats\":\"$undefined\",\"locale\":\"ja\",\"messages\":{\"nav\":{\"home\":\"ホーム\",\"features\":\"機能\",\"subjects\
