y\",\"title\":\"수요와 공급 분석\",\"cards\":[{\"id\":1,\"question\":\"수요함수(demand function)란 무엇인가? 예시 방정식 Qxd = f(Px, I, Py)를 설명하라.\",\"answer\":\"수요함수는 X재의 수요량(Qxd)을 해당 재화 자체의 가격(Px), 소비자의 소득(I), 다른 재화의 가격(Py) 등 여러 변수와 연계하여 나타내는 관계식이다: Qxd = f(Px, I, Py). 이는 X재의 수요량이 위 변수들에 의해 결정된다는 의미이다.\"},{\"id\":2,\"question\":\"수요의 법칙(law of demand)이란 무엇인가?\",\"answer\":\"재화의 가격이 오르면 구매자는 해당 재화를 더 적게 구매하고, 가격이 내리면 더 많이 구매한다는 일반적으로 받아들여지는 원칙이다. 이로 인해 수요곡선은 우하향(음의 기울기)하게 된다.\"},{\"id\":3,\"question\":\"휘발유 수요의 선형함수 Qxd = 84.5 – 6.39Px + 0.25I – 2Py에서 각 계수의 부호(음/양)는 무엇을 의미하는가?\",\"answer\":\"Px(자기가격)의 계수 −6.39는 음(-)의 부호를 가지므로 가격이 1단위 오르면 수요량이 감소한다(수요의 법칙). 소득(I)의 계수 +0.25는 양(+)의 부호이므로 소득이 늘면 수요도 증가한다(정상재). 자동차 가격(Py)의 계수 −2는 음(-)의 부호이므로 휘발유와 자동차는 서로 보완재(complement) 관계에 있다고 본다.\"},{\"id\":4,\"question\":\"\\\"자기가격\\\"(own price)이라는 용어를 왜 별도로 사용하는가?\",\"answer\":\"경제학자들은 \\\"자기가격\\\"이라는 표현으로 해당 재화(X) 자체의 가격임을 명확히 하여 다른 재화(Y)의 가격과 구분한다. 이는 수요함수 안에서 자기가격의 영향과 다른 재화 가격의 영향을 구분하여 이해하는 데 도움이 된다.\"},{\"id\":5,\"question\":\"역수요함수(inverse demand function)란 무엇인가? 예를 들어 설명하라.\",\"answer\":\"역수요함수는 가격을 수요량의 함수로 나타낸 것이다: Px = 8.92 − 0.156Qxd. 이 함수의 그래프가 수요곡선(demand curve)이며, Qx는 57을 넘을 수 없다(그렇지 않으면 가격이 음수가 되기 때문이다).\"},{\"id\":6,\"question\":\"수요곡선의 기울기(slope of the demand curve)는 어떻게 계산하는가?\",\"answer\":\"수요곡선의 기울기는 가격의 변화(ΔP)를 수량의 변화(ΔQ)로 나눈 비율, 즉 ΔP/ΔQ이다. 예시 수요함수(Qxd = 57 – 6.39Px)에서 기울기는 1/(−6.39) = −0.156이다.\"},{\"id\":7,\"question\":\"탄력성(elasticity)은 일반적으로 어떻게 정의되며, 왜 필요한가?\",\"answer\":\"탄력성은 한 변수가 다른 변수의 변화에 얼마나 민감하게 반응하는지를 각각의 변화율(백분율 변화)의 비율로 나타낸 것이다: %Δy/%Δx. 이 방법은 측정 단위(리터/갈론, 달러/유로 등)에 영향을 받지 않으므로 서로 다른 단위를 가진 대상끼리도 비교할 수 있다는 장점이 있다.  ## 수요의 가격탄력성 유형\"},{\"id\":8,\"question\":\"자기가격수요탄력성(own-price elasticity of demand, Ep)은 어떤 공식으로 정의되는가(식 5)?\",\"answer\":\"Edp_x = (%ΔQxd)/(%ΔPx) — 이는 수요량의 변화율을 가격의 변화율로 나눈 비율이다.\"},{\"id\":9,\"question\":\"식 5를 대수적으로 풀어 쓰면 어떤 형태가 되는가(식 6)?\",\"answer\":\"Edp_x = (ΔQxd/ΔPx) × (Px/Qxd). 여기서 (ΔQxd/ΔPx)는 선형 수요함수의 경우 기울기 계수와 같고, (Px/Qxd)는 수요곡선 위의 해당 지점에 따라 달라진다.\"},{\"id\":10,\"question\":\"휘발유 사례에서 Px = €1.48이고 Qxd = 47.54일 때 탄력성은 얼마이며, 이를 어떻게 해석하는가?\",\"answer\":\"E = −6.39 × (1.48/47.54) = −0.2. 이는 가격이 1% 오를 때 수요량은 겨우 0.2%만 감소한다는 의미이며, |E| \u003c 1이므로 수요가 비탄력적(inelastic)이라고 본다.\"},{\"id\":11,\"question\":\"휘발유 가격이 €5가 되었을 때(Qxd = 25.05) 탄력성은 얼마가 되며, 탄력적인가 비탄력적인가?\",\"answer\":\"E = −6.39 × (5/25.05) = −1.28. |E| \u003e 1이므로 이 경우 수요는 탄력적(elastic)이다.\"},{\"id\":12,\"question\":\"수요가 탄력적(elastic), 비탄력적(inelastic), 단위탄력적(unit/unitary elastic)인지는 어떤 기준으로 구분하는가?\",\"answer\":\"탄력성 계수의 절댓값(|E|)이 1보다 작으면 \\\"비탄력적\\\", 1보다 크면 \\\"탄력적\\\", 정확히 −1과 같으면 \\\"단위탄력적\\\"이라고 한다.\"},{\"id\":13,\"question\":\"자기가격수요탄력성의 부호는 어떠하며, 그 이유는 무엇인가?\",\"answer\":\"수요의 법칙이 성립하는 한 자기가격수요탄력성은 거의 항상 음(-)의 값을 가진다. 가격이 오르면 수요량이 감소하는 음의 관계에 있기 때문이다.\"},{\"id\":14,\"question\":\"선형 수요곡선 위에서 탄력성은 어떻게 변하는가(중점의 법칙)?\",\"answer\":\"기울기가 일정하고 우하향하는 선형 수요곡선에서, 중점보다 위쪽(가격이 높고 수량이 적은 구간)에서는 수요가 탄력적이고, 중점보다 아래쪽(가격이 낮고 수량이 많은 구간)에서는 수요가 비탄력적이며, 중점에서는 단위탄력적이다. ΔQ/ΔP는 일정하지만 P/Q 비율은 수요곡선 위의 위치에 따라 달라지기 때문이다.\"},{\"id\":15,\"question\":\"완전비탄력적 수요(perfectly inelastic demand)란 무엇이며, 그래프상 어떻게 나타나는가?\",\"answer\":\"가격 수준과 무관하게 수요량이 전혀 변하지 않는 경우를 완전비탄력적 수요라고 한다(E = 0). 그래프에서는 수직인 수요곡선으로 나타난다.\"},{\"id\":16,\"question\":\"완전탄력적 수요(perfectly elastic demand)란 무엇이며, 어떤 경우에 나타나는가?\",\"answer\":\"수요곡선이 수평이어서, 가격이 조금만 올라도 수요량이 0으로 떨어지고, 해당 가격에서는 제한 없이 구매할 수 있는 경우를 완전탄력적 수요라고 한다(E = ∞). 이는 완전경쟁(perfect competition) 시장에서 개별 판매자가 마주하는 수요곡선을 설명하는 대표적인 예이다(밀 시장).\"},{\"id\":17,\"question\":\"재화의 가격탄력성에 영향을 미치는 주요 요인은 무엇인가?\",\"answer\":\"밀접한 대체재의 수(많을수록 더 탄력적), 전체 예산에서 차지하는 비중(클수록 더 탄력적), 소비자가 가격 변화에 적응할 수 있는 시간의 길이(장기일수록 더 탄력적), 그리고 그 재화가 필수재(non-discretionary)인지 선택재(discretionary)인지 여부 등이 각각 영향을 미친다.\"},{\"id\":18,\"question\":\"탄력성과 총지출(total expenditure)의 관계는 어떠한가?\",\"answer\":\"수요가 탄력적일 때는 가격과 총지출이 반대 방향으로 움직인다(가격이 내리면 총지출이 증가). 수요가 비탄력적일 때는 가격과 총지출이 같은 방향으로 움직인다(가격이 내리면 총지출도 감소). 단위탄력적인 지점에서 총지출은 최대가 된다.\"},{\"id\":19,\"question\":\"판매자의 수요가 현재 가격에서 비탄력적이라면, 가격을 올리는 것이 왜 이익을 증가시키는가?\",\"answer\":\"비탄력적인 수요 상황에서 가격이 오르면 총수입(revenue)이 증가하고, 동시에 판매량이 줄어들어 총비용도 감소한다. 수입이 늘고 비용이 줄어드는 것은 둘 다 이익을 증가시키므로, 이익을 추구하는 단일 판매자는 수요가 탄력적으로 바뀔 때까지 계속 가격을 올리게 된다.\"},{\"id\":20,\"question\":\"소득수요탄력성(income elasticity of demand, EId)은 어떤 공식으로 정의되는가(식 7)?\",\"answer\":\"EId = (%ΔQxd)/(%ΔI) — 다른 요인들을 일정하다고 가정할 때, 수요량의 변화율을 소득의 변화율로 나눈 비율이다.\"},{\"id\":21,\"question\":\"소득수요탄력성의 부호에 따라 재화를 \\\"정상재\\\"(normal) 또는 \\\"열등재\\\"(inferior)로 어떻게 분류하는가?\",\"answer\":\"소득수요탄력성이 양(EId \u003e 0)이면 \\\"정상재\\\"라고 한다 — 소득이 늘면 수요도 증가한다. 소득수요탄력성이 음(EId \u003c 0)이면 \\\"열등재\\\"라고 한다 — 소득이 늘면 수요가 감소한다(예: 메밀가루, 감자, 저가 육류).\"},{\"id\":22,\"question\":\"소득이 변할 때 수요곡선은 어떻게 이동하는가?\",\"answer\":\"정상재의 경우 소득이 늘면 수요곡선이 오른쪽 위로 이동한다. 열등재의 경우 소득이 늘면 수요곡선이 왼쪽 아래로 이동한다.\"},{\"id\":23,\"question\":\"시장 휘발유 사례(식 11)에서 소득수요탄력성이 0.26으로 나온 것을 어떻게 해석하는가?\",\"answer\":\"EId = (250)(50/47,542.8) = 0.26. 소득이 1% 늘면 휘발유 수요는 0.26% 증가한다. 양의 부호를 가지므로 휘발유를 정상재로 본다(다만 그 값은 작다).\"},{\"id\":24,\"question\":\"교차가격수요탄력성(cross-price elasticity of demand)은 어떤 공식으로 정의되는가(식 8)?\",\"answer\":\"Edp_y = (%ΔQxd)/(%ΔPy) — X재 수요의 변화율을 Y재 가격의 변화율로 나눈 비율이다.\"},{\"id\":25,\"question\":\"교차가격수요탄력성이 양(+)이면 두 재화는 어떤 관계에 있는가?\",\"answer\":\"Edp_y \u003e 0이면 X재와 Y재를 대체재(substitutes)라고 한다 — Y재의 가격이 오르면 X재의 수요가 증가한다(예: 맥주의 두 브랜드).\"},{\"id\":26,\"question\":\"교차가격수요탄력성이 음(-)이면 두 재화는 어떤 관계에 있는가?\",\"answer\":\"Edp_y \u003c 0이면 X재와 Y재를 보완재(complements)라고 한다 — 대개 함께 소비되는 재화들이다(예: 휘발유와 자동차, 주택과 가구).\"},{\"id\":27,\"question\":\"휘발유-자동차 사례(식 12)에서 교차탄력성이 −0.84로 나온 것은 무엇을 의미하는가?\",\"answer\":\"Edp_y = (−2000)(20/47,542.8) = −0.84. 자동차 가격이 1% 오르면 휘발유 수요는 0.84% 감소한다. 음의 부호를 가지므로 휘발유와 자동차를 보완재로 보지만, 그 관계는 약한 것으로 판단한다.\"},{\"id\":28,\"question\":\"개별 수요함수로부터 시장수요함수는 어떻게 도출하는가?\",\"answer\":\"시장수요함수는 한 시장 내 모든 소비자의 수요함수를 합산하여 도출한다. 만약 동일한 수요함수를 가진 소비자가 1,000명 있다면, 시장수요함수는 개별 소비자의 함수에 1,000을 곱한 것과 같다: Qxd = 84,500 – 6,390Px + 250I – 2,000Py (식 9).  ## 대체효과와 소득효과\"},{\"id\":29,\"question\":\"재화의 가격이 내릴 때 소비자가 그 재화를 더 많이 구매하게 되는 두 가지 이유는 무엇인가?\",\"answer\":\"대체효과(substitution effect)와 소득효과(income effect)라는 두 가지 이유가 있다. 이 두 요인이 함께 작용하여 수요의 법칙(우하향하는 수요곡선)을 만들어 낸다.\"},{\"id\":30,\"question\":\"대체효과(substitution effect)란 무엇인가?\",\"answer\":\"재화의 가격이 내리면 그 재화가 다른 재화(대체재)에 비해 상대적으로 저렴해지므로, 소비자가 다른 재화 대신 이 재화를 더 많이 구매하게 되는 경향이다. 예를 들어 휘발유 가격이 내리면 대중교통 대신 자동차를 이용하는 것이 상대적으로 저렴해진다.\"},{\"id\":31,\"question\":\"소득효과(income effect)와 실질소득(real income)이란 무엇인가?\",\"answer\":\"재화의 가격이 내리면 화폐소득은 변하지 않더라도 구매력(실질소득)이 증가한다. 대부분의 재화의 경우 실질소득이 늘면 소비자는 그 재화를 더 많이 구매한다 — 이것이 소득효과이다.\"},{\"id\":32,\"question\":\"소고기 가격이 오를 때 대체효과와 소득효과는 어떻게 함께 작용하는가?\",\"answer\":\"소고기 가격이 오르면 대체효과로 인해 소비자는 닭고기와 같은 더 싼 대체재로 옮겨간다. 동시에 가격 상승은 실질소득을 감소시키므로, 소고기가 정상재라면 소득효과 역시 소고기 구매를 줄이는 방향으로 작용한다 — 즉 두 효과가 같은 방향으로 작용한다.\"},{\"id\":33,\"question\":\"순수대체효과(pure substitution effect)는 어떻게 분리하여 측정하는가(커피 사례)?\",\"answer\":\"가격 하락으로 발생한 소득 증가분을 다시 \\\"회수\\\"하여 소비자를 이전 가격에서와 동일한 만족 수준(indifferent)으로 되돌려 놓음으로써 소득효과를 제거하고, 순수대체효과만을 분리해낸다. 이 경우 소비자는 항상 상대적으로 더 저렴해진 재화를 더 많이 구매하게 된다.\"},{\"id\":34,\"question\":\"모니카의 영화관 사례(예시 2)에서 가격이 $8에서 $4로 내렸을 때 총 늘어난 영화 6편 중 몇 편이 대체효과이고 몇 편이 소득효과인가?\",\"answer\":\"모니카가 클럽 회원권을 직접 비용을 들여 구매한 경우(소득효과가 제거된 상태)에는 6편에서 8편으로 2편이 늘었는데, 이것이 대체효과이다. 친구에게 회원권을 선물로 받은 경우(소득효과가 제거되지 않은 상태)에는 8편에서 12편으로 다시 4편이 늘었는데, 이것이 소득효과이다. 총 6편이 늘어난 것 중 2편은 대체효과, 4편은 소득효과이다(모니카에게 영화는 정상재이다).  ## 정상재와 열등재\"},{\"id\":35,\"question\":\"정상재(normal good)의 경우 대체효과와 소득효과는 서로 어떤 관계에 있는가?\",\"answer\":\"정상재의 경우 가격이 내리면 대체효과(상대적으로 저렴해졌으므로 더 많이 구매)와 소득효과(실질소득이 늘었으므로 더 많이 구매) 둘 다 같은 방향으로 작용하며, 즉 서로를 강화한다. 그 결과 수요곡선은 우하향한다.\"},{\"id\":36,\"question\":\"열등재(inferior good)의 경우 대체효과와 소득효과는 서로 어떤 관계에 있는가?\",\"answer\":\"열등재의 경우 가격이 내리면 대체효과는 더 많은 구매로 이어지지만, 소득효과는 반대로 더 적은 구매로 이어진다 — 두 효과가 서로 반대 방향으로 작용하며, 소득효과가 대체효과를 완화(mitigate)한다.\"},{\"id\":37,\"question\":\"하나의 재화가 일부 소비자에게는 정상재이고 다른 소비자에게는 열등재일 수 있는가? 예를 들어 설명하라.\",\"answer\":\"그렇다. 예를 들어 패스트푸드(fast-food)의 경우, 소득이 낮은 소비자는 소득이 늘면 패스트푸드 소비가 증가한다(정상재). 반면 소득이 높은 소비자는 소득이 늘면 고급 레스토랑으로 옮겨가므로 패스트푸드 소비가 감소한다(열등재).\"},{\"id\":38,\"question\":\"기펜재(Giffen good)란 무엇인가?\",\"answer\":\"소득효과가 대체효과를 압도할 만큼 매우 강한 음의 방향으로 작용하여, 가격이 오를 때 수요량도 함께 증가하는 특이한 경우를 기펜재라고 한다(Robert Giffen의 이름에서 유래). 예를 들어 극심한 빈곤 환경에서 사는 사람들의 쌀 소비를 들 수 있다 — 쌀은 그들의 소득 중 매우 큰 비중을 차지하는 열등재이므로 가격 하락이 수요에 반대로 작용할 수 있다.\"},{\"id\":39,\"question\":\"베블렌재(Veblen good)란 무엇인가?\",\"answer\":\"Thorstein Veblen의 \\\"과시적 소비\\\"(conspicuous consumption) 개념에 근거하여, 높은 가격 자체가 그 재화의 명성과 지위로서의 가치를 높여주는 재화를 베블렌재라고 한다(예: 고가의 명품 자동차, 보석류). 베블렌재는 열등재가 아니며, 가격이 오를 때 수요도 함께 증가한다.\"},{\"id\":40,\"question\":\"수요의 법칙에는 어떤 두 가지 예외(exceptions to the law of demand)가 있는가?\",\"answer\":\"기펜재(Giffen goods)와 베블렌재(Veblen goods) — 둘 다 수요곡선이 양의 기울기를 갖게 되는 드문 경우들이다.\"},{\"id\":41,\"question\":\"정상재와 열등재에 대한 가격 하락의 대체효과·소득효과를 정리한 표(예시 6)는 어떤 결론을 보여주는가?\",\"answer\":\"정상재: 대체효과 — 구매량 증가(상대적으로 저렴해졌으므로); 소득효과 — 구매량 증가(구매력이 늘었으므로). 열등재: 대체효과 — 구매량 증가; 소득효과 — 구매량 감소(실질소득이 늘어남에 따라 더 선호하는 대체재로 옮겨가므로).  ## 한계수확과 생산성\"},{\"id\":42,\"question\":\"수확 증가(increasing marginal returns)란 무엇인가?\",\"answer\":\"하나의 생산요소(예: 노동)의 투입량이 늘어날 때마다 한계생산물(marginal product)이 증가하는 현상이다. 이는 대개 전문화와 분업(specialization, division of labor)에서 비롯된다.\"},{\"id\":43,\"question\":\"한계수확체감의 법칙(law of diminishing marginal returns)이란 무엇인가?\",\"answer\":\"고정된(fixed) 자본 위에 노동(가변 투입요소)의 투입을 계속 늘려갈 때, 어느 지점을 지나면 추가로 투입되는 노동 1단위당 한계생산물이 감소하게 되는 법칙이다. 예를 들어 자동차 생산 공장이 생산능력의 한계에 다다른 상태에서는 작업자를 추가해도 생산량이 더 늘지 않는다.\"},{\"id\":44,\"question\":\"총생산물(total product, Q)이란 무엇인가?\",\"answer\":\"일정 기간 동안 모든 투입요소로부터 생산된 총생산량이다. 이 지표는 기업의 생산 규모에 대한 정보를 알려주지만, 그 효율성(생산성)은 보여주지 않는다.\"},{\"id\":45,\"question\":\"노동의 평균생산물(average product of labor, APL)은 어떤 공식으로 정의되는가?\",\"answer\":\"APL = Q/L — 총생산물을 투입된 노동 단위 수(예: 근무시간)로 나눈 비율이다. 이는 노동의 평균적인 생산성을 측정한다.\"},{\"id\":46,\"question\":\"노동의 한계생산물(marginal product of labor, MPL)은 어떤 공식으로 정의되는가?\",\"answer\":\"MPL = ΔQ/ΔL — 다른 투입요소를 일정하게 유지한 상태에서 노동 1단위 추가 투입으로 인한 총생산물의 변화량이다.\"},{\"id\":47,\"question\":\"노동의 한계생산물(MPL)과 평균생산물(APL) 사이의 관계는 어떠한가?\",\"answer\":\"MPL \u003e APL이면 APL은 증가하고 있고, MPL \u003c APL이면 APL은 감소하고 있다. 예시 9를 보면, 노동 2시간 지점에서 MPL(110)이 APL(105)보다 크므로 APL이 증가하고 있지만, 5시간 지점에서는 MPL(40)이 APL(80)보다 작으므로 APL이 감소한 상태이다.\"},{\"id\":48,\"question\":\"단기 한계비용(short-run marginal cost, SMC)과 노동의 한계생산물(MPL) 사이의 관계는 어떤 공식으로 표현되는가?\",\"answer\":\"SMC = w/MPL, 여기서 w는 임금률(wage rate)이다. 노동생산성(MPL)이 높아지면 SMC는 낮아지고, MPL이 낮아지면 SMC는 높아진다.\"},{\"id\":49,\"question\":\"평균가변비용(average variable cost, AVC)을 평균생산물(APL)과 연결하는 공식은 무엇인가?\",\"answer\":\"AVC = w/APL. 임금(w)이 오르면 AVC가 오르고, 노동의 평균생산성(APL)이 높아지면 AVC는 낮아진다.\"},{\"id\":50,\"question\":\"생산성을 높이는 것은 기업, 근로자, 주주에게 각각 어떤 혜택을 주는가?\",\"answer\":\"(1) 사업 비용이 줄어 이익이 증가한다; (2) 이익 증가로 주가와 주주의 부가 늘어난다; (3) 근로자의 보상이 늘어나 향후 생산성을 더 높이려는 동기를 부여한다.  ## 손익분기점과 조업중단점 분석\"},{\"id\":51,\"question\":\"경제적 이익(economic profit)과 회계적 이익(accounting profit)의 차이는 무엇인가?\",\"answer\":\"경제적 이익 = 총수입(TR) − 총경제적 비용(회계상 비용 + 암묵적 기회비용). 회계적 이익 = TR − 총회계적 비용(명시적으로 지출된 비용만 측정). 두 경우 모두 TR은 동일하다: TR = (P)(Q).\"},{\"id\":52,\"question\":\"기회비용(opportunity cost)과 매몰비용(sunk cost)이란 무엇인가?\",\"answer\":\"기회비용은 특정 결정을 내릴 때 포기하게 되는, 차선의 대안이 제공할 수 있었던 가치이다. 매몰비용은 과거에 발생하여 이제는 되돌릴 수 없는 비용(예: 이전에 구매한 장비의 역사적 원가)으로, 미래의 의사결정에 영향을 주지 않으므로 고려하지 않는다.\"},{\"id\":53,\"question\":\"경제적 감가상각(economic depreciation)과 회계적 감가상각(accounting depreciation)의 차이는 무엇인가?\",\"answer\":\"경제적 감가상각은 미래를 지향하는 개념으로, 자산으로 생산을 하는 대신 그것을 매각하거나 임대할 수 있었던 기회를 잃는 데서 오는 가치(기회비용)를 측정한다. 회계적 감가상각은 과거를 지향하는 개념으로, 과거에 지출된 역사적 원가를 생산 단위들에 어떻게 배분할지를 정한다.\"},{\"id\":54,\"question\":\"총수입(total revenue, TR)은 어떤 공식으로 정의되는가?\",\"answer\":\"TR = (P)(Q) — 단위당 판매가격에 판매된 수량을 곱한 값이다.\"},{\"id\":55,\"question\":\"한계수입(marginal revenue, MR)은 어떤 공식으로 정의되는가?\",\"answer\":\"MR = ΔTR/ΔQ — 총수입의 변화를 수량의 변화로 나눈 비율로, 1단위를 추가로 생산할 때 얻는 추가 수입이다.\"},{\"id\":56,\"question\":\"완전경쟁(perfect competition) 시장에서는 왜 MR이 가격(P)과 같아지는가?\",\"answer\":\"완전경쟁 시장에서는 기업이 가격수용자(price taker)이며 수평(완전탄력적)인 수요곡선에 직면하므로, 추가 단위를 판매하기 위해 가격을 내릴 필요가 없다. 따라서 MR = P이다.\"},{\"id\":57,\"question\":\"MR = P + Q(ΔP/ΔQ) 공식은 무엇을 나타내는가?\",\"answer\":\"TR = (P)(Q)를 미분하면 ΔTR = (P)(ΔQ) + (Q)(ΔP)가 되고, 이를 ΔQ로 나누면 MR = P + Q(ΔP/ΔQ)가 된다. 이는 MR이 가격에서 (ΔP/ΔQ) × Q만큼 \\\"조정\\\"된 값이라는 의미이다. 불완전경쟁 기업의 경우 수요곡선이 우하향(ΔP/ΔQ \u003c 0)하므로 MR \u003c P이다.\"},{\"id\":58,\"question\":\"한계비용(marginal cost, MC)은 어떤 공식으로 정의되며, 단기 한계비용(SMC)과 장기 한계비용(LMC)의 차이는 무엇인가?\",\"answer\":\"MC = ΔTC/ΔQ. SMC(short-run MC)는 단기적으로 가변 투입요소(노동)만을 이용하여 1단위를 추가로 생산하는 데 드는 추가 비용이며, LMC(long-run MC)는 장기적으로 모든 투입요소(노동, 자본)가 변할 수 있는 상태에서 발생하는 추가 비용이다.\"},{\"id\":59,\"question\":\"이익이 최대가 되는(profit-maximizing) 조건은 무엇인가?\",\"answer\":\"(1) MR = MC이어야 하며, (2) 그 지점에서 MC가 감소하고 있지 않아야 한다(2차 조건 — second-order condition).\"},{\"id\":60,\"question\":\"총비용(TC), 총고정비용(TFC), 총가변비용(TVC)은 어떻게 연관되는가?\",\"answer\":\"TC = TFC + TVC. TFC는 생산량과 무관하게 일정하게 발생하는 비용이다(예: 임대료, 대출 이자). TVC는 생산량에 직접 비례하며, 생산량이 0이면 TVC도 0이 된다.\"},{\"id\":61,\"question\":\"MC와 평균비용(AVC, ATC) 사이의 관계는 어떠한가?\",\"answer\":\"MC \u003c 평균비용이면 평균비용은 감소하고, MC \u003e 평균비용이면 평균비용은 증가한다. 따라서 MC 곡선은 AVC와 ATC 곡선을 각각의 최저점(각각 S점, T점)에서 교차한다.\"},{\"id\":62,\"question\":\"손익분기점(breakeven point)이란 무엇인가?\",\"answer\":\"기업의 총수입(TR)이 총비용(TC)과 같아지는 지점, 즉 가격(P, AR)이 평균총비용(ATC)과 같아지는 지점이다. 이는 ATC의 최저점에서 발생하며, 이 지점에서 경제적 이익은 0이다(정상이익(normal profit)만 존재).\"},{\"id\":63,\"question\":\"조업중단점(shutdown point)이란 무엇인가?\",\"answer\":\"기업이 가변비용조차 회수하지 못하게 되는 지점, 즉 가격이 평균가변비용(AVC)의 최저점보다 낮아진 지점이다. 이 지점 아래로 가격이 떨어지면 기업은 단기적으로라도 생산을 중단하는 것이 더 나은 선택이 된다.\"},{\"id\":64,\"question\":\"단기 및 장기의 수입-비용 관계에 대한 결론(예시 22)은 어떠한가?\",\"answer\":\"TR = TC이면 단기와 장기 모두 시장에 남는다. TR = TVC이지만 TC보다 작으면 단기적으로는 남지만 장기적으로는 퇴출해야 한다. TR \u003c TVC이면 기업은 단기에도 생산을 중단하고 시장에서 퇴출해야 한다.\"},{\"id\":65,\"question\":\"완전경쟁(perfect competition)과 불완전경쟁(imperfect competition) 기업의 수입 관계는 어떻게 다른가?\",\"answer\":\"완전경쟁에서는 수요곡선이 수평이므로 MR = AR = P이고, 생산량이 늘어날수록 TR은 (기울기가 일정한) 직선으로 증가한다. 불완전경쟁(예: 독점)에서는 수요곡선이 우하향하므로 MR \u003c P이며, TR 곡선은 처음에는 증가하다가(수요가 탄력적인 구간) 이후 감소한다(수요가 비탄력적으로 바뀐 이후).\"},{\"id\":66,\"question\":\"예시: 어떤 기업이 100단위의 제품을 P = €4에 판매하고, ATC = €7(AVC = €3.75, AFC = €3.25)이다. 이 기업이 생산을 중단하지 않는 것이 옳은 이유는 무엇인가?\",\"answer\":\"TR = €400, TC = €700이므로 경제적 손실은 €300이다. 생산을 중단하면 손실은 어쩔 수 없이 TFC와 같은 €325가 된다. 반면 생산을 계속하면 P(€4) \u003e AVC(€3.75)이므로 TVC를 전부 회수하고 TFC에 대해서도 €25를 추가로 회수할 수 있어 손실이 €300으로 줄어든다 — 따라서 중단하기보다 계속 운영하는 것이 더 유리하다.  ## 규모의 경제와 규모의 비경제\"},{\"id\":67,\"question\":\"경제학적으로 단기(short run)와 장기(long run)는 어떻게 구분되는가?\",\"answer\":\"단기란 생산에 필요한 요소 중 적어도 하나(예: 기술, 설비, 공장 규모)가 고정되어 있는 기간을 의미한다. 장기란 모든 요소가 가변적이며, 기업이 시장에 진입하거나 퇴출할 수 있는 기간(\\\"계획기간\\\" — planning horizon)을 의미한다.\"},{\"id\":68,\"question\":\"포락선(envelope curve), 즉 장기평균총비용곡선(LRAC)이란 무엇인가?\",\"answer\":\"서로 다른 공장 규모(plant size)별 단기평균총비용(SATC) 곡선들에서 각각의 최저점을 모두 연결한 곡선을 장기평균총비용곡선(LRAC), 즉 \\\"포락선\\\"이라고 한다. 이는 가능한 모든 기술, 공장 규모, 자본의 조합을 포괄하기 때문이다.\"},{\"id\":69,\"question\":\"규모의 경제(economies of scale)란 무엇이며, 그래프상 어떻게 나타나는가?\",\"answer\":\"기업이 생산량을 늘릴 때 단위당 비용이 감소하는 것을 규모의 경제라고 한다. 그래프에서는 LRAC 곡선이 우하향하는 구간으로 나타난다.\"},{\"id\":70,\"question\":\"규모의 비경제(diseconomies of scale)란 무엇이며, 그래프상 어떻게 나타나는가?\",\"answer\":\"기업이 생산량을 늘릴 때 단위당 비용이 증가하는 것을 규모의 비경제라고 한다. 그래프에서는 LRAC 곡선이 우상향하는 구간으로 나타난다.\"},{\"id\":71,\"question\":\"규모의 경제를 가져오는 요인에는 어떤 것들이 있는가?\",\"answer\":\"규모에 대한 수익 증가(increasing returns to scale — 산출이 투입보다 더 큰 비율로 증가), 분업과 전문화, 효율성은 높지만 비용이 큰 설비를 사용할 수 있는 능력, 낭비 감소, 시장 정보를 더 잘 활용하는 능력, 대량구매를 통한 가격 할인 등이 있다.\"},{\"id\":72,\"question\":\"규모의 비경제를 가져오는 요인에는 어떤 것들이 있는가?\",\"answer\":\"규모에 대한 수익 감소(decreasing returns to scale), 조직이 지나치게 커져 관리하기 어려워지는 문제, 사업 기능과 제품군의 중복, 대량구매 시 자원의 한계로 인한 가격 상승 등이 있다(예: General Motors의 브랜드 중복).\"},{\"id\":73,\"question\":\"최소효율규모(minimum efficient scale)란 무엇인가?\",\"answer\":\"LRAC 곡선의 최저점에 해당하는 생산량 수준이다. 완전경쟁 시장에서는 장기적으로 기업들이 결국 이 지점에서 생산하게 되는데, 이는 시장 가격이 결국 이 수준으로 수렴하기 때문이다.  ---\"}]},{\"id\":\"market-structures\",\"title\":\"기업과 시장구조\",\"cards\":[{\"id\":1,\"question\":\"경제학자들은 전통적으로 시장을 몇 가지 시장구조(market structure)로 분류하며, 그것들은 무엇인가?\",\"answer\":\"네 가지로, 완전경쟁(perfect competition), 독점적경쟁(monopolistic competition), 과점(oligopoly), 독점(monopoly)이다.\"},{\"id\":2,\"question\":\"경제학자들이 정의하는 \\\"시장\\\"이란 무엇인가?\",\"answer\":\"시장이란 서로를 알고 있고 재화나 서비스를 교환할 가격에 대해 합의할 수 있는 구매자와 판매자의 집단이다.\"},{\"id\":3,\"question\":\"시장구조를 결정하는 5가지 요인은 무엇인가?\",\"answer\":\"1) 공급하는 기업의 수와 상대적 규모; 2) 제품차별화의 정도(degree of product differentiation); 3) 판매자의 가격결정력(pricing power); 4) 시장 진입·퇴출 장벽(barriers to entry and exit)의 상대적 강도; 5) 비가격경쟁(non-price competition)의 정도.\"},{\"id\":4,\"question\":\"Exhibit 1에 따르면 네 가지 시장구조별 판매자 수와 제품차별화는 어떻게 다른가?\",\"answer\":\"완전경쟁 — 다수의 판매자, 동질적/표준화된 제품; 독점적경쟁 — 다수의 판매자, 차별화된 제품; 과점 — 소수의 판매자, 동질적이거나 차별화된 제품; 독점 — 단일 판매자, 독특한(unique) 제품.\"},{\"id\":5,\"question\":\"Exhibit 1에 따르면 네 가지 시장구조별 진입장벽(barriers to entry)과 가격결정력(pricing power)은 어떻게 비교되는가?\",\"answer\":\"완전경쟁 — 진입장벽 매우 낮음, 가격결정력 없음; 독점적경쟁 — 진입장벽 낮음, 가격결정력 약간 있음; 과점 — 진입장벽 높음, 일부 또는 상당한 가격결정력; 독점 — 진입장벽 매우 높음, 상당한 가격결정력.\"},{\"id\":6,\"question\":\"완전경쟁(perfect competition)을 정의하는 5가지 조건은 무엇인가?\",\"answer\":\"1) 구매자와 판매자의 수가 매우 많음; 2) 판매자들이 제공하는 제품이 거의 동일함; 3) 진입과 퇴출 장벽이 매우 낮음; 4) 판매자가 시장가격에 영향을 줄 수 있는 능력이 없음; 5) 비가격경쟁이 없음.\"},{\"id\":7,\"question\":\"독점적경쟁(monopolistic competition)이라는 개념을 누가 정립했으며, 그 특징은 무엇인가?\",\"answer\":\"에드워드 체임벌린(미국)과 조앤 로빈슨(영국)이 정립했다. 이는 강한 경쟁적 요소(다수의 기업)와 제품차별화에서 비롯된 독점적 요소가 공존하는 혼합(hybrid) 시장이다.\"},{\"id\":8,\"question\":\"과점(oligopoly) 시장의 가장 두드러진 특징은 무엇인가?\",\"answer\":\"시장을 지배하는 기업의 수가 적다는 것이며, 이들의 가격결정은 상호의존적(interdependent)이어서 한 기업의 결정은 다른 기업의 대응을 고려해야 한다.\"},{\"id\":9,\"question\":\"독점(monopoly) 시장을 규정하는 특징은 무엇인가?\",\"answer\":\"단일 판매자, 독특한 제품, 가까운 대체재 없음, 매우 높은 진입장벽, 판매자가 가격과 생산량에 상당한 결정력을 가짐.\"},{\"id\":10,\"question\":\"마이클 포터(Michael Porter)의 \\\"다섯 가지 힘(five forces)\\\" 모형에는 어떤 요소들이 있는가?\",\"answer\":\"1) 진입위협(threat of entry); 2) 공급자의 힘(power of suppliers); 3) 구매자의 힘(power of buyers); 4) 대체품의 위협(threat of substitutes); 5) 기존 경쟁자 간의 경쟁(rivalry among existing competitors).\"},{\"id\":11,\"question\":\"\\\"경제적 해자(economic moat)\\\"란 무엇을 의미하는가?\",\"answer\":\"중세 성을 지키는 외호(moat)처럼, 기업의 수익성을 진입위협(threat of entry)으로부터 보호해주는 요인을 가리키는 용어이며, 해자가 깊을수록 진입위협이 낮고 소비자의 전환비용(switching cost)이 높다는 것을 의미한다.\"},{\"id\":12,\"question\":\"완전경쟁과 혁신 사이의 상충관계(trade-off)는 무엇인가?\",\"answer\":\"완전경쟁은 최저가로 최대량의 재화를 공급하지만, 신약 연구개발처럼 비용이 많이 드는 혁신에 자금을 투입할 유인은 경쟁이 적은 과점 같은 구조에서 더 크게 나타나므로, 소비자는 때로 불완전경쟁으로부터도 혜택을 얻을 수 있다.  ## 완전경쟁\"},{\"id\":13,\"question\":\"완전경쟁시장의 수요함수가 QD = 50 – 2P일 때, 가격을 수량으로 나타낸 역함수(inverse function)는 무엇인가?\",\"answer\":\"P = 25 – 0.5QD\"},{\"id\":14,\"question\":\"QD = 50 – 2P(즉 P = 25 – 0.5QD)라는 수요함수로부터 총수입(TR)과 평균수입(AR)은 어떻게 구하는가?\",\"answer\":\"TR = P×QD = 25QD – 0.5QD²; AR = TR/QD = 25 – 0.5QD, 즉 AR 함수는 시장수요함수와 정확히 동일하다.\"},{\"id\":15,\"question\":\"위 수요함수(P = 25 – 0.5QD)에서 ΔQD가 매우 작을 때 한계수입(MR)은 어떤 식으로 표현되는가?\",\"answer\":\"MR = 25 – QD (ΔQD → 0일 때).\"},{\"id\":16,\"question\":\"수요의 가격탄력성(price elasticity of demand, εP)은 어떻게 정의되는가?\",\"answer\":\"εP = –(% change in QD) ÷ (% change in P). 관례적으로 양수로 표시한다.\"},{\"id\":17,\"question\":\"수요의 가격탄력성의 세 가지 구분은 무엇인가?\",\"answer\":\"εP \u003e 1이면 탄력적(elastic); εP = 1이면 단위탄력적(unitary elastic); εP \u003c 1이면 비탄력적(inelastic).\"},{\"id\":18,\"question\":\"수요의 가격탄력성에 영향을 미치는 주요 요인은 무엇인가?\",\"answer\":\"1) 가까운 대체재의 수(많을수록 탄력적); 2) 소비자 예산에서 차지하는 비중(높을수록 탄력적); 3) 기간의 길이(장기일수록 소비자가 적응할 시간이 있어 더 탄력적).\"},{\"id\":19,\"question\":\"수요의 가격탄력성의 두 극단적인 경우는 무엇인가?\",\"answer\":\"수평인 수요곡선(완전경쟁 기업의 경우) — εP = ∞ (완전탄력적); 수직인 수요곡선(예: 인슐린) — εP = 0 (완전비탄력적).\"},{\"id\":20,\"question\":\"수요의 소득탄력성(income elasticity of demand, εY)이란 무엇이며, 어떻게 계산하는가?\",\"answer\":\"εY = (% change in QD) ÷ (% change in Y). 정상재는 εY가 양수이며, 사치재(luxury goods)는 εY \u003e 1, 열등재(inferior goods)는 εY가 음수이다.\"},{\"id\":21,\"question\":\"수요의 교차가격탄력성(cross-price elasticity of demand, εX)이란 무엇인가?\",\"answer\":\"εX = (% change in QDA) ÷ (% change in PB). 양수이면 대체재(substitutes), 음수이면 보완재(complements)를 의미한다.\"},{\"id\":22,\"question\":\"수요의 가격탄력성과 총수입(TR)의 관계는 무엇인가?\",\"answer\":\"εP \u003e 1(탄력적): ↑P → TR↓, ↓P → TR↑. εP = 1(단위탄력적): P가 변해도 TR은 불변. 0 \u003c εP \u003c 1(비탄력적): ↑P → TR↑, ↓P → TR↓.\"},{\"id\":23,\"question\":\"한계수입(MR)과 수요의 가격탄력성(εP)의 관계를 나타내는 공식은 무엇인가?\",\"answer\":\"MR = P[1 – (1/εP)]\"},{\"id\":24,\"question\":\"소비자잉여(consumer surplus)란 무엇이며, 그래프상으로 어떻게 표현되는가?\",\"answer\":\"소비자가 구매한 단위에 대해 부여하는 가치와 실제로 지불한 금액의 차이이며, 그래프에서는 수요곡선 아래쪽과 실제 지불가격 위쪽 사이에 위치하는 영역(삼각형 형태)으로 나타난다.\"},{\"id\":25,\"question\":\"기회비용(opportunity cost)이란 무엇이며, 경제적 이익(economic profit)이 회계적 이익(accounting profit)과 다른 이유는 무엇인가?\",\"answer\":\"기회비용이란 자원을 현재 용도로 유지하거나 새로 취득하는 데 필요한 최선의 대안이 가져다줄 수익이다. 경제적 이익 = TR – TC이며, 이때 TC는 기회비용을 포함한다. 반면 회계적 이익은 외부 자원 제공자(근로자, 공급자, 대출자)에게 실제로 지급한 비용만 고려하므로 기회비용을 포함하지 않는다.\"},{\"id\":26,\"question\":\"완전경쟁기업은 왜 수평(horizontal)의 수요곡선에 직면하며, 이는 무엇을 의미하는가?\",\"answer\":\"개별 기업이 시장의 균형가격에 아무런 영향을 미칠 수 없기 때문에, 그 균형가격에서 얼마든지 판매할 수 있다. 이때 가격(Price) = 평균수입(average revenue) = 한계수입(marginal revenue)이 성립한다.\"},{\"id\":27,\"question\":\"완전경쟁기업은 어떤 규칙으로 이윤을 극대화하는 생산량을 선택하며, 관련 비용 공식은 무엇인가?\",\"answer\":\"기업은 MR = MC가 되는 수준에서 생산량을 결정한다. 평균비용 AC = TC/Q; 한계비용 MC = ΔTC/ΔQ; AC가 최소가 되는 지점에서 MC = AC가 성립한다.\"},{\"id\":28,\"question\":\"수확감소의 법칙(law of diminishing returns)이란 무엇이며, 이는 AC, MC 곡선의 형태에 어떤 영향을 주는가?\",\"answer\":\"기술이 일정할 때 투입을 한 단위씩 추가할수록 생산량에 기여하는 증가분이 점점 줄어드는 법칙이다. 그 결과 AC와 MC 곡선은 U자형이 되어, 처음에는 하락하다가 이후 상승한다.\"},{\"id\":29,\"question\":\"장기적으로 완전경쟁기업은 어떤 균형 상태에 도달하는가?\",\"answer\":\"P = MC = 최소평균비용(min AC)이 되는 수준에서 균형을 이루며, TR = TC이므로 경제적 이익은 0(zero economic profit)이 된다. 기업의 장기공급곡선은 곧 기업의 장기한계비용곡선(long-run marginal cost curve)이다.\"},{\"id\":30,\"question\":\"슘페터(Schumpeter)가 말한 두 가지 혁신 유형은 무엇이며, \\\"떼지어 모방(swarming)\\\"의 3단계는 무엇을 의미하는가?\",\"answer\":\"1) 공정혁신(innovation of process) — 더 효율적인 생산 방법; 2) 제품혁신(innovation of product) — 새로운 제품. 3단계는: 최초의 기업이 혁신하여 높은 이익을 얻는다 → 다른 기업들이 이를 모방하며 \\\"몰려든다(swarming)\\\" → 결국 모두가 모방한 결과 경제적 이익이 사라지고 완전경쟁의 장기균형이 성립한다.  ## 독점적경쟁\"},{\"id\":31,\"question\":\"독점적경쟁을 규정하는 5가지 특징은 무엇인가?\",\"answer\":\"1) 구매자와 판매자의 수가 많음; 2) 기업들의 제품은 가까운 대체재이지만 외관상 차별화되어 있음; 3) 진입·퇴출 비용이 상대적으로 낮음; 4) 기업들은 약간의 가격결정력을 가짐; 5) 기업들은 광고와 비가격 전략으로 제품을 차별화함.\"},{\"id\":32,\"question\":\"독점적경쟁기업의 수요곡선은 완전경쟁기업의 것과 어떻게 다른가?\",\"answer\":\"제품이 차별화되어 있기 때문에 수요곡선이 우하향(downward sloping)한다. 수평이 아닌 이유는 기업이 가격을 어느 정도 스스로 조정할 수 있기 때문이다.\"},{\"id\":33,\"question\":\"단기적으로 독점적경쟁기업은 어떻게 이윤을 극대화하는가?\",\"answer\":\"MR = MC가 되는 Q1을 생산량으로 선택한다. 수요곡선에서 그 생산량에 대응하는 가격 P1을 결정한다. 총수입(TR)은 P1 × Q1의 면적이다(Exhibit 11).\"},{\"id\":34,\"question\":\"독점적경쟁시장에는 명확하게 정의된 공급함수(well-defined supply function)가 존재하는가?\",\"answer\":\"아니다. 생산량은 MC와 MR의 교차점에서 결정되지만 가격은 수요곡선에 따라 결정되므로, 명확한 공급함수가 존재하지 않는다.\"},{\"id\":35,\"question\":\"기업의 이윤(π)은 어떻게 결정되는가?\",\"answer\":\"π = TR – TC이며, TR = P1×Q1(총수입), TC = C1×Q1(총비용, C1은 Q1 단위를 생산하는 데 드는 평균비용)이다.\"},{\"id\":36,\"question\":\"장기적으로 독점적경쟁기업은 어떤 균형 상태에 도달하는가?\",\"answer\":\"신규 기업의 진입과 수요 감소의 결과 경제적 이익은 0이 된다(TR = TC). 하지만 완전경쟁과 달리, 균형은 평균비용을 최소화하는 생산량(Q2)보다 작은 생산량(Q1 \u003c Q2)에서 이루어지며, 이는 초과생산능력(excess capacity)이 남는다는 의미이다.\"},{\"id\":37,\"question\":\"독점적경쟁은 \\\"비효율적\\\"으로 보이면서도 사회적으로 이로울 수 있는 이유는 무엇인가?\",\"answer\":\"제품차별화는 혁신에 대한 유인을 제공하며(슘페터의 발상), 서로 다른 소비자의 필요·취향·선호에 맞는 다양한 제품을 제공하고, 소비자들은 이러한 다양성(variety)을 중시하기 때문이다(예: 독일-일본 간 자동차 교역).  ## 과점\"},{\"id\":38,\"question\":\"과점을 규정하는 5가지 특징은 무엇인가?\",\"answer\":\"1) 판매자의 수가 적음; 2) 제품은 가까운 대체재이며 브랜드화되었거나 동질적일 수 있음; 3) 시장 진입장벽이 높음; 4) 기업들은 상당한 가격결정력을 가짐; 5) 제품은 주로 광고, 특징 등 비가격 전략으로 차별화됨.\"},{\"id\":39,\"question\":\"과점시장에서 가격을 결정하는 세 가지 기본 전략은 무엇인가?\",\"answer\":\"1) 가격의 상호의존성(pricing interdependence); 2) 쿠르노 가정(the Cournot assumption); 3) 나쉬균형(the Nash equilibrium).\"},{\"id\":40,\"question\":\"굴절수요곡선(kinked demand curve)이란 무엇이며, 왜 발생하는가?\",\"answer\":\"경쟁기업들이 가격 인하는 따라가지만(match) 가격 인상은 따라가지 않는다고 가정하면, 기업이 직면하는 수요는 가격 인상 시(DP↑)에는 더 탄력적이고 가격 인하 시(DP↓)에는 더 비탄력적이 되어, 현재 균형가격에서 수요곡선이 \\\"굴절\\\"된다. 그 결과 MR곡선은 불연속적인 형태가 된다.\"},{\"id\":41,\"question\":\"굴절수요곡선 모형의 주요 약점은 무엇인가?\",\"answer\":\"최초에 형성된(prevailing) 가격이 어떻게 결정되었는지를 설명하지 못한다. 다만 과점시장에서 가격이 안정적으로 유지되는 현상을 설명하는 데는 유용하다.\"},{\"id\":42,\"question\":\"쿠르노 가정(Cournot assumption)이란 무엇인가?\",\"answer\":\"복점(duopoly) 시장에서 각 기업은 자신의 이윤을 극대화하는 생산량을 결정할 때, 상대 기업이 자신의 생산량을 바꾸지 않을 것이라고 가정하고 의사결정을 한다는 것이다.\"},{\"id\":43,\"question\":\"수요가 QD = 450 – P이고 MC = 30인 복점시장에서 쿠르노균형은 어떻게 되는가?\",\"answer\":\"q1 = q2 = 140, Q = 280, P = 450 – 280 = 170. (MR1 = 450 – 2q1 – q2 = 30, MR2 = 450 – q1 – 2q2 = 30 두 방정식을 연립하여 풀었다.)\"},{\"id\":44,\"question\":\"쿠르노균형(Cournot equilibrium)은 완전경쟁균형, 독점균형과 비교할 때 어디에 위치하는가?\",\"answer\":\"그 중간에 위치한다: PC(완전경쟁 가격) \u003c PCournot \u003c PM(독점 가격); 이에 대응하는 생산량은 QM \u003c QCournot \u003c QC이다. 해당 예시에서 PC=30, PCournot=170, PM=240이며, Q(경쟁)=420, Q(쿠르노)=280, Q(독점)=210이다.\"},{\"id\":45,\"question\":\"나쉬균형(Nash equilibrium)이란 무엇인가?\",\"answer\":\"비협조적(non-cooperative) 게임에서 둘 이상의 참여 기업이 상대방의 최적 대응을 고려한 뒤에도 각자 자신의 전략에서 벗어날 유인이 없는 균형이다.\"},{\"id\":46,\"question\":\"ArcCo/BatCo 나쉬균형 예시에서 총이윤을 최대화하는 결과와 실제 나쉬균형이 서로 다른 이유는 무엇인가?\",\"answer\":\"두 기업이 모두 높은 가격을 책정하면 총이윤(800)이 최대화되지만, ArcCo가 높은 가격을 유지할 때 BatCo는 낮은 가격을 책정하여 더 높은 이윤(350)을 얻으려는 유인이 있다. 따라서 비협조적 균형은 총이윤을 최대화하는 결과와 다르게 나타나며, 담합(collusion)을 통해서만 두 기업 모두 높은 가격을 유지할 수 있다.\"},{\"id\":47,\"question\":\"카르텔(cartel)이란 무엇이며, 명시적(explicit) 또는 암묵적(implicit)으로 이루어질 수 있는가?\",\"answer\":\"카르텔은 기업들이 공개적이고 공식적으로 담합(collusion)하여 결성한 연합체이다. 명시적(계약에 기반) 또는 암묵적(신호에 기반, 예: 한 기업이 가격을 내리지 않는 것이 가격 인상에 대한 \\\"제안\\\"으로 해석되는 경우)으로 이루어질 수 있다.\"},{\"id\":48,\"question\":\"성공적인 담합(successful collusion)에 영향을 미치는 6가지 요인은 무엇인가?\",\"answer\":\"1) 판매자의 수와 규모 분포(소수이거나 지배적 기업이 있으면 성공 가능성이 높음); 2) 제품의 동질성(동질적일수록 성공 가능성이 높음); 3) 비용구조의 동질성; 4) 주문의 규모와 빈도(소규모이고 빈번한 주문일수록 성공 가능성이 높음); 5) 보복의 강도와 신속성; 6) 외부 경쟁의 정도(OPEC의 예).\"},{\"id\":49,\"question\":\"슈타켈베르그 모형(Stackelberg model)은 쿠르노 모형과 어떻게 다른가?\",\"answer\":\"쿠르노 모형에서는 의사결정이 동시에(simultaneous) 이루어지지만, 슈타켈베르그 모형에서는 선도기업(leader)이 먼저 생산량을 정하고 추종기업(follower)이 이를 관찰한 뒤 결정하는 순차적(sequential) 구조이다. 선도기업은 \\\"톱독(top dog)\\\" 전략을 사용하여 생산량을 늘려 추종기업이 생산량을 줄이도록 유도함으로써 더 높은 이윤을 얻는다.\"},{\"id\":50,\"question\":\"지배적 기업 가격선도(dominant firm price leadership) 모형에서 지배적 기업은 생산량과 가격을 어떻게 결정하는가?\",\"answer\":\"지배적 기업(비용이 낮고 보통 시장점유율이 40% 이상)은 MRL = MCL이 되는 QL을 생산량으로 선택하며, 이에 대응하는 가격(PL)은 자신의 수요 구간 DL에서 결정된다. 추종기업들은 그 차이(QT – QL) = QF만큼을 공급한다.\"},{\"id\":51,\"question\":\"장기적으로 과점시장에서 지배적 기업의 시장점유율은 어떤 경향을 보이는가?\",\"answer\":\"대부분 감소하는 경향을 보인다. 이윤이 신규 기업을 끌어들이고, 이들이 더 효율적인 기술을 도입하여 지배적 기업의 수요와 한계수입을 줄이기 때문이다(예: US Steel은 1901년 66%, 1920년 46%, 1925년 42%의 시장점유율을 기록했다).  ## 독점시장과 가격차별\"},{\"id\":52,\"question\":\"독점을 규정하는 5가지 특징은 무엇인가?\",\"answer\":\"1) 독특하고 차별화된 제품을 공급하는 단일 판매자; 2) 가까운 대체재가 없음; 3) 매우 높은 진입장벽; 4) 기업이 상당한 가격결정력을 가짐; 5) 제품이 광고 등 비가격 전략으로 차별화됨.\"},{\"id\":53,\"question\":\"독점력(monopoly power)의 원천은 무엇인가?\",\"answer\":\"1) 특허, 저작권; 2) 핵심 자원의 통제(예: De Beers의 다이아몬드 광산); 3) 정부 인허가/자연독점(natural monopoly, 규모의 경제 — economies of scale, 예: 전기·수도 공급망); 4) 브랜드 충성도(예: Rolex); 5) 네트워크 효과(network effects, 예: Microsoft Word).\"},{\"id\":54,\"question\":\"독점시장의 수요, 총수입, 한계수입은 일반형(QD = a – bP)으로 어떻게 표현되는가?\",\"answer\":\"P = a/b – (1/b)QD; TR = (a/b)QD – (1/b)QD²; MR = ΔTR/ΔQ = (a/b) – (2/b)QD. 수요가 선형일 때 MR곡선의 기울기는 수요곡선의 기울기보다 두 배 가파르다.\"},{\"id\":55,\"question\":\"독점시장에는 명확한 공급함수가 존재하는가, 그리고 이윤극대화 규칙은 무엇인가?\",\"answer\":\"아니다, 명확하게 정의된 공급함수는 존재하지 않는다. 생산량과 가격은 비용구조(cost structure)에 의해 결정된다. 이윤을 극대화하는 생산량은 MR = MC가 되는 수준이다.\"},{\"id\":56,\"question\":\"독점에서 한계수입과 수요의 가격탄력성의 관계를 이용한 가격결정 공식은 무엇이며, 예시를 들어보라.\",\"answer\":\"MR = MC이므로 P[1 – 1/EP] = MC. 예시: MC가 일정하게 75이고 EP=1.5이면 P[1 – 1/1.5] = 75 → P = 225.\"},{\"id\":57,\"question\":\"독점기업의 이윤극대화 가격과 생산량은 수요곡선의 탄력적(elastic) 구간과 비탄력적(inelastic) 구간 중 어디에 위치하는가?\",\"answer\":\"항상 탄력적(elastic) 구간에 위치한다. MR과 MC는 MR이 양수인 구간에서만 교차할 수 있는데, 이는 수요가 탄력적이어야 함을 의미하기 때문이다.\"},{\"id\":58,\"question\":\"자연독점(natural monopoly)을 규제하는 세 가지 가능한 해법은 무엇이며, 그 결과로 나타나는 가격들은 어떻게 비교되는가?\",\"answer\":\"1) 비규제 독점: LRMC=MR에서 가격을 책정, PM(가장 높음); 2) 규제된 독점: PR = LRAC에서 가격을 책정(중간); 3) 경쟁적 가격: PC = LRMC에서 책정(가장 낮지만 평균비용을 회수하지 못할 수 있음). 순서는 PM \u003e PR \u003e PC이다.\"},{\"id\":59,\"question\":\"1차 가격차별(first-degree price discrimination)이란 무엇인가?\",\"answer\":\"독점기업이 각 소비자로부터 그들이 지불할 수 있는 최고가를 받아내는 방식이며, 이는 소비자잉여 전체(entire consumer surplus)를 독점기업이 가져가는 결과를 낳는다.\"},{\"id\":60,\"question\":\"2차 가격차별(second-degree price discrimination)이란 무엇이며, 어떤 방식으로 실행되는가?\",\"answer\":\"소비자가 자신의 소비량에 따라 스스로를 구분하도록 수량 기반의 다양한 가격 선택지(menu of quantity-based pricing options)를 제시하는 방식이다. 예를 들어 수량 할인, 수량 가산, 쿠폰, 묶음판매(bundling), 사용량 제한 등이 있다.\"},{\"id\":61,\"question\":\"3차 가격차별(third-degree price discrimination)이란 무엇인가?\",\"answer\":\"소비자를 인구통계적 특성 등으로 분류하여 서로 다른 가격을 책정하는 방식이다. 예: 계량경제 소프트웨어의 학생용 버전과 전문가용 버전, 항공권의 당일 왕복 요금과 일주일 체류 왕복 요금.\"},{\"id\":62,\"question\":\"이부가격제(two-part tariff pricing)란 무엇인가?\",\"answer\":\"단위당 가격에 더해 월간/회원가입 형태의 고정요금(entry fee)을 부과하는 방식이며, 고정요금은 해당 단위가격에서 발생하는 소비자잉여(consumer surplus)와 같아지도록 설정된다.\"},{\"id\":63,\"question\":\"니콜의 월간 피트니스 클럽 수요가 QD = 20 – 4P(P는 1회 이용당 유로)이고 한계비용이 €2/회일 때, 클럽은 회원비로 몇 유로를 받을 수 있는가?\",\"answer\":\"P=2일 때 QD=20–4(2)=12회; 소비자잉여 = (0.5)(12)(3) = 18유로. 클럽은 월 €18의 회원비에 €2/회를 추가로 받으면 니콜의 소비자잉여 전부를 가져갈 수 있다(이부가격제).\"},{\"id\":64,\"question\":\"장기적으로 독점시장의 균형을 유지하기 위해 필요한 조건은 무엇이며, 규제된 독점의 장기적 해법은 무엇인가?\",\"answer\":\"독점이 유지되려면 지속적이고 견고한 시장진입 장벽(예: 새로운 특허)이 유지되어야 한다. 규제된 독점의 해법으로는: 1) 보조금(subsidy)을 지급하여 P=MC로 책정; 2) 국유화(nationalization); 3) 규제기관이 P=LRAC로 책정; 4) 프랜차이즈 입찰(franchise bidding)을 통해 P=LRAC로 책정.\"},{\"id\":65,\"question\":\"독점기업은 왜 품질과 연구개발(R\u0026D)에 투자를 적게 하는가?\",\"answer\":\"새로운 경쟁자가 진입할 위협이 없거나 그러한 지출이 이윤을 뚜렷하게 늘리지 못한다면, 독점기업은 품질 관리, 연구개발, 고객 서비스에 자원을 투입할 유인이 적다(예: 경쟁 진입 이전의 국내 자동차 제조사, 규제된 전화 회사).\"},{\"id\":66,\"question\":\"독점은 항상 비효율적이라고 볼 수 있는가?\",\"answer\":\"아니다, 항상 그런 것은 아니다. 규모의 경제(economies of scale)와 규제(또는 진입위협)의 영향으로, 일부 경우에는 독점이 완전경쟁보다 더 나은 결과(예: 하나의 발전소가 더 낮은 평균비용을 가지는 경우)를 소비자에게 제공할 수 있다.  ## 시장구조의 식별\"},{\"id\":67,\"question\":\"시장력(market power)을 측정하는 이론적 방법은 무엇인가?\",\"answer\":\"수요와 공급의 탄력성을 추정하는 것(econometric estimation)이다. 수요가 매우 탄력적이면 시장은 완전경쟁에 가깝고, 수요가 경직적(비탄력적)이면 기업들이 시장력을 가질 가능성이 있다.\"},{\"id\":68,\"question\":\"내생성 문제(problem of endogeneity)는 왜 계량경제학적 방법으로 수요와 공급을 추정하는 데 걸림돌이 되는가?\",\"answer\":\"관측된 가격과 수량은 수요와 공급의 상호작용에 의해 함께 결정되는 균형값이기 때문에, 각각의 함수를 별도로 식별하려면 두 방정식(수요 방정식과 공급 방정식)으로 구성된 모형이 필요하다.\"},{\"id\":69,\"question\":\"시계열(time-series) 회귀분석과 횡단면(cross-sectional) 회귀분석 두 방법의 주요 차이점과 약점은 무엇인가?\",\"answer\":\"시계열 방법은 한 시장의 총판매량과 평균가격을 시간에 따라 관찰하지만, 시장구조가 변화했다면 과거의 탄력성이 현재 상황에는 맞지 않을 수 있다. 횡단면 방법은 특정 한 해에 여러 기업의 판매량을 관찰하는데, 더 많은 자료 수집이 필요하고 설명변수의 정의에 따라 결과가 크게 달라질 수 있다.\"},{\"id\":70,\"question\":\"시장집중률(concentration ratio)이란 무엇이며, 어떤 값의 범위를 가지는가?\",\"answer\":\"상위 N개 기업의 시장점유율을 합한 값이며, 0%(완전경쟁)에서 100%(독점) 사이에서 변동한다.\"},{\"id\":71,\"question\":\"8개 공급자가 있는 시장에서 가장 큰 기업이 35%, 그다음이 25%, 20%, 10%, 나머지 4개 기업이 각각 2.5%를 차지할 때, 상위 3개와 상위 4개 기업의 시장집중률은 각각 얼마인가?\",\"answer\":\"상위 3개: 35+25+20 = 80%; 상위 4개: 35+25+20+10 = 90%.\"},{\"id\":72,\"question\":\"시장집중률(concentration ratio)의 장점과 단점은 무엇인가?\",\"answer\":\"장점 — 계산이 매우 간단하다. 단점 — 1) 시장력을 직접적으로 측정하지 못한다(진입장벽이 낮으면 단일 기업도 완전경쟁처럼 행동할 수 있음); 2) 상위 기업 간의 합병(merger)에 민감하지(반응이 크지) 않다.\"},{\"id\":73,\"question\":\"허핀달-허쉬만지수(Herfindahl-Hirschman Index, HHI)란 무엇이며, 어떻게 계산하는가?\",\"answer\":\"상위 N개 기업의 시장점유율을 각각 제곱한 뒤 그 값들을 합산하여 구한다. 단일 기업이 시장 전체를 지배하면(독점) HHI = 1이다. 동일한 점유율을 가진 M개의 기업이 있다면 HHI = 1/M이다.\"},{\"id\":74,\"question\":\"상위 3개 기업(점유율 35%, 25%, 20%)의 합병 전과, 가장 큰 두 기업이 합병한 후의 HHI는 각각 얼마인가?\",\"answer\":\"합병 전: 0.35² + 0.25² + 0.20² = 0.225. 가장 큰 두 기업이 합병한 후(60%+20%+10%): 0.60² + 0.20² + 0.10² = 0.410 — 눈에 띄게 상승했다.\"},{\"id\":75,\"question\":\"HHI의 장점과 단점은 무엇이며, 왜 규제당국에게 유용한가?\",\"answer\":\"HHI는 시장집중률보다 기업 간 합병(merger)의 영향을 더 잘 반영한다(위 예시에서 0.225→0.410). 그러나 시장진입 장벽이나 수요의 탄력성을 고려하지 않기 때문에, 금융분석가에게는 그 활용이 제한적이다.  ---\"}]},{\"id\":\"aggregate-output-prices-growth\",\"title\":\"총생산, 물가, 경제성장\",\"cards\":[{\"id\":1,\"question\":\"국내총생산(gross domestic product, GDP)이란 무엇이며, 어떤 두 가지 방법으로 정의할 수 있는가?\",\"answer\":\"GDP는 일정 기간 동안 한 경제에서 생산된 모든 최종 재화와 서비스의 시장가치의 합(생산 기준, output definition)이며, 동시에 같은 기간 동안 가구, 기업, 정부가 벌어들인 총소득(소득 기준, income definition)과도 같다. 따라서 GDP는 소득접근법(income approach)과 지출접근법(expenditure approach) 두 가지 방식으로 계산할 수 있으며, 균형 상태에서는 두 방법이 동일한 결과를 낸다.\"},{\"id\":2,\"question\":\"총생산(aggregate output), 총소득(aggregate income), 총지출(aggregate expenditure)은 왜 서로 같아야 하는가?\",\"answer\":\"생산된 재화의 가치는 항상 생산요소(노동, 토지, 자본)에 소득으로 분배되므로 총생산은 총소득과 같아야 한다. 또한 그 재화를 구매하는 데 들어간 총지출 역시 동일한 금액이어야 하므로, 이 세 가지는 서로 다른 각도에서 바라본 하나의 수치일 뿐이다.\"},{\"id\":3,\"question\":\"GDP를 시간과 국가 간에 안정적이고 비교 가능하게 유지하기 위해 지켜지는 세 가지 핵심 기준은 무엇인가?\",\"answer\":\"1) 해당 측정 기간에 생산된 재화와 서비스만 포함한다(중고품, 이전지급, 자산가격 상승분은 제외); 2) 시장에서 거래되어 가격을 객관적으로 매길 수 있는 재화와 서비스만 포함한다(가사노동, 지하경제, 오염 등은 제외); 3) 최종 재화와 서비스(final goods and services)의 가치만 계산하고, 중간재(intermediate goods)는 이중으로 계산하지 않는다.\"},{\"id\":4,\"question\":\"최종재(final goods)와 중간재(intermediate goods)는 어떻게 다르며, 중간재를 GDP에 별도로 포함시키지 않는 이유는 무엇인가?\",\"answer\":\"최종재는 더 이상 재판매되지 않는 재화이고, 중간재는 재판매되거나 다른 재화를 생산하는 데 투입되는 재화이다. 중간재의 가치를 따로 계산하지 않는 이유는, 생산 과정에서 더해진 모든 부가가치가 이미 최종 판매가격에 반영되어 있기 때문이며, 따로 더하면 이중계산이 된다.\"},{\"id\":5,\"question\":\"부가가치 합산법(sum of value added method)이란 무엇이며, GDP와 어떤 관계가 있는가?\",\"answer\":\"이 방법은 생산·판매 과정의 각 단계(예: 농부, 제분업자, 제빵업자, 소매업자)에서 발생한 부가가치(receipts – intermediate inputs)를 계산하여 모두 합산하는 방식이다. 모든 단계의 부가가치 합은 최종 판매가격(final sale price)과 같으며, 이는 GDP를 측정하는 두 번째 방법이 된다.\"},{\"id\":6,\"question\":\"자가 소유 주택(owner-occupied housing)과 정부 서비스는 GDP에 어떻게 포함되는가?\",\"answer\":\"이들은 시장에서 직접 거래되지 않으므로 추정가치(imputed value)를 사용한다. 자가 소유자는 자신에게 임대료를 지불한다고 가정하여 추정임대료(imputed rent)를 GDP에 더한다. 정부 서비스(경찰, 법원 등)는 시장가격이 없으므로 부가가치를 따로 계산하지 않고 비용(임금)만큼만 GDP에 포함시킨다.\"},{\"id\":7,\"question\":\"지하경제(underground economy)란 무엇이며, GDP 통계에 어떤 영향을 미치는가?\",\"answer\":\"지하경제는 세금을 회피하거나 불법적인 성격 때문에 정부로부터 숨겨지는 경제활동이다(예: 미등록 근로자, 불법 마약 거래). 이는 공식 GDP 집계에 포함되지 않으며, 국가별로 지하경제의 비중이 크게 다르다(미국 8%, 페루 60%). 따라서 국가 간 공식 GDP 통계의 신뢰도를 비교할 때 유의해야 할 요소가 된다.\"},{\"id\":8,\"question\":\"명목GDP(nominal GDP)와 실질GDP(real GDP)는 어떻게 다르며, 각각 어떻게 계산하는가?\",\"answer\":\"명목GDP는 해당 시점의 시장가격을 사용하여 계산하며(Nominal GDPt = Pt × Qt), 실질GDP는 기준연도의 고정가격을 사용하여 계산한다(Real GDPt = PB × Qt). 여기서 Pt는 해당 연도의 가격, PB는 기준연도의 가격, Qt는 해당 연도의 수량이다. 실질GDP는 생산량의 변화만을 반영하므로 물가수준 변화의 영향을 제거한 수치이다.\"},{\"id\":9,\"question\":\"GDP 디플레이터(GDP deflator)란 무엇이며, 그 공식은 무엇인가?\",\"answer\":\"GDP deflator = (Value of current year output at current year prices / Value of current year output at base year prices) × 100. 이는 다음과 같이도 표현된다: GDP deflator = (Nominal GDP/Real GDP) × 100. 이는 경제 전체에 걸친 물가수준의 종합적인 변화를 측정한다.\"},{\"id\":10,\"question\":\"실질GDP는 명목GDP와 디플레이터의 관계로 어떻게 표현되는가?\",\"answer\":\"Real GDP = [Nominal GDP/(GDP deflator/100)]. 이 관계식은 \\\"디플레이터\\\"라는 이름의 근거가 되며, 명목GDP를 디플레이터로 \\\"디플레이트(deflate)\\\"하여 인플레이션의 영향을 제거한다는 의미이다.\"},{\"id\":11,\"question\":\"GDP 디플레이터를 이용해 연간 인플레이션율을 어떻게 계산하는가?\",\"answer\":\"인플레이션율 = (해당 연도 디플레이터/전년도 디플레이터) – 1. 예를 들어 캐나다의 2016년 디플레이터가 113.9, 2015년 디플레이터가 113.2라면, 인플레이션율 = (113.9/113.2) – 1 = 0.66%이다.\"},{\"id\":12,\"question\":\"국내총생산(GDP)과 국민총생산(gross national product, GNP)은 어떻게 다른가?\",\"answer\":\"GDP는 생산요소의 소유자가 누구인지와 무관하게 해당 국가의 영토 내에서 생산된 재화를 계산한다. 반면 GNP는 생산이 어느 나라에서 이루어졌는지와 무관하게, 해당 국가의 국민과 기업이 소유한 생산요소로 생산된 재화를 계산한다.  ## GDP의 구성요소\"},{\"id\":13,\"question\":\"지출접근법으로 GDP를 계산하는 기본 공식은 무엇인가?\",\"answer\":\"GDP = C + I + G + (X – M) = (C + GC) + (I + GI) + (X – M). 여기서 C는 소비자 지출, I는 국내 민간 총투자, G는 정부지출, X는 수출, M은 수입이다.\"},{\"id\":14,\"question\":\"GDP 지출 공식의 변수 C, I, G, X, M을 각각 정의하라.\",\"answer\":\"C는 최종 재화와 서비스에 지출된 소비자 지출; I는 기업이 자본재(예: 부동산, 설비)에 투자한 금액과 재고 변화(inventory investment)를 포함한 국내 민간 총투자; G는 현재 소비 및 자본재 투자에 쓰이는 정부지출(= GC + GI); X는 수출; M은 수입이다.\"},{\"id\":15,\"question\":\"가구 부문은 자신의 소득을 어떻게 배분하는가?\",\"answer\":\"가구는 소득을 소비(consumption, C)에 쓰거나, 미래 소비를 위해 저축(saving, S)하는 두 가지 방식으로 배분한다. 소비 지출은 재화·서비스 시장을 거쳐 기업 부문으로 흘러가고, 저축은 금융시장으로 들어가 기업의 차입 및 민간 자본의 자금원이 된다.\"},{\"id\":16,\"question\":\"총투자(gross investment)와 순투자(net investment)는 어떻게 다른가?\",\"answer\":\"총투자는 마모된 자본의 대체(replacement)와 새로운 생산능력 확충을 위한 투자를 모두 합한 금액이다. 순투자는 새로운 생산능력 확충분만을 반영한다. GDP는 총투자(gross investment)를 계산 대상으로 하기 때문에 이름에 \\\"총(gross)\\\"이라는 단어가 들어간다.\"},{\"id\":17,\"question\":\"정부의 이전지급(transfer payments)이 정부지출(G)에 포함되지 않는 이유는 무엇인가?\",\"answer\":\"이전지급은 정부가 조세로 거둔 수입을 국민에게 현금 형태로 그대로 돌려주는 것으로, 그 대가로 어떤 재화나 서비스도 받지 않기 때문에 G에 포함되지 않는다. 다만 이 돈을 국민이 소비에 사용하면 그 금액은 소비지출(C)에 포함되어 GDP에 반영된다.\"},{\"id\":18,\"question\":\"무역적자(trade deficit)란 무엇이며, 어떻게 조달되는가?\",\"answer\":\"무역적자는 국내 경제가 해외로부터 구매하는 재화·서비스가 해외의 구매보다 더 많은 상태를 의미한다, 즉 [(X – M) \u003c 0]. 이는 국내 저축이 국내 투자와 정부의 재정수지를 충당하기에 부족하다는 뜻이므로, 해외로부터 차입하여 자금을 조달해야 한다(해외 자본의 유입, net foreign borrowing).\"},{\"id\":19,\"question\":\"소득접근법(income approach)으로 GDP를 어떻게 계산하는가?\",\"answer\":\"GDP = Gross domestic income (GDI) = Net domestic income + Consumption of fixed capital (CFC) + 통계적 불일치. 여기서 Gross domestic income = Compensation of employees + Gross operating surplus + Gross mixed income + Taxes less subsidies on production + Taxes less subsidies on products and imports로 계산된다.\"},{\"id\":20,\"question\":\"총영업잉여(gross operating surplus)란 무엇인가?\",\"answer\":\"이는 기업 이윤에 가까운 개념으로, 민간기업, 비영리법인, 정부법인의 소득을 모두 포함한다. 임대료, 이자, 금융자산 관련 비용을 차감하지 않은 상태에서 기업이 사용한 자본에 대한 총수익을 측정한다(소유주의 순수한 이윤만을 뜻하지는 않는다).\"},{\"id\":21,\"question\":\"간접사업세(indirect business taxes less subsidies)란 무엇이며, 어떻게 측정하는가?\",\"answer\":\"이는 최종 재화·서비스의 가격에 반영된 조세에서 보조금을 차감한 금액으로, 국민소득 중 정부로 직접 귀속되는 부분을 나타낸다. 이는 1) \\\"재화 및 수입에 대한 세금·보조금\\\"(판매세, 유류세, 수입보조금 등)과 2) \\\"생산요소에 대한 세금·보조금\\\"(자산세, 급여세 등) 두 부분으로 나뉜다.\"},{\"id\":22,\"question\":\"고정자본소모(consumption of fixed capital, CFC)란 무엇이며, GDI 계산에서 어떤 역할을 하는가?\",\"answer\":\"CFC는 생산 과정에서 자본재가 마모(노후화)되는 정도를 측정한다. 일부 소득·생산은 노후화된 자본을 대체하는 데 쓰여야 한다는 개념이다. GDP = Net domestic income + CFC + 통계적 불일치로 계산되며, 이윤 + CFC를 자본으로 얻은 총잉여로 볼 수 있다.  ## GDP·국민소득·개인소득·개인처분가능소득\"},{\"id\":23,\"question\":\"국민소득(national income, NI)이란 무엇이며, GDP로부터 어떻게 도출하는가?\",\"answer\":\"국민소득은 최종 생산에 참여한 모든 생산요소가 받은 소득이다. 이는 GDP에서 자본소모비(감가상각, capital consumption allowance)와 통계적 불일치를 차감한 값과 같다.\"},{\"id\":24,\"question\":\"개인소득(personal income, PI)이란 무엇이며, 캐나다 통계에서는 이 개념을 어떻게 부르는가?\",\"answer\":\"개인소득은 가구의 총소득을 포괄적으로 나타내는 지표로서, 소비자의 구매력을 측정하므로 소비지출을 결정하는 핵심 요인이다. 캐나다 통계에서는 이를 \\\"Primary Household Income\\\"이라 부르며, 임금(compensation of employees), 비법인 자영업의 순혼합소득(net mixed income), 순자산소득(net property income)을 합산하여 계산한다.\"},{\"id\":25,\"question\":\"개인처분가능소득(personal disposable income, PDI; 캐나다에서는 Household Disposable Income)이란 무엇인가?\",\"answer\":\"PDI는 개인소득에서 개인세금을 차감한 값과 같다(실무에서는 개인총소득에서 순이전지급을 차감하는 형태로 계산되기도 한다). 이는 가구가 소비 또는 저축에 사용할 수 있는 세후 소득의 규모를 나타내며, 가구의 지출과 저축을 설명하는 가장 중요하고 정교한 소득 지표이다.\"},{\"id\":26,\"question\":\"가구순저축(household net saving)과 저축률(saving rate)은 어떻게 계산하는가?\",\"answer\":\"가구순저축 = PDI – 가구 최종소비지출 + 연금수급권의 순변동. 저축률은 순저축을 PDI에 대한 비율로 계산한다(예: 캐나다 2016년 40,108/1,152,542 = 3.48%).\"},{\"id\":27,\"question\":\"Primary household income(개인소득)은 무엇으로 구성되는가?\",\"answer\":\"1) 임금(compensation of employees), 2) 비법인 자영업의 순혼합소득(net mixed income from unincorporated businesses), 3) 순자산소득(net property income)이라는 세 가지 구성요소로 이루어진다.  ## 총수요\"},{\"id\":28,\"question\":\"총수요(aggregate demand, AD)란 무엇인가?\",\"answer\":\"총수요는 가구, 기업, 정부, 해외 구매자가 주어진 물가수준에서 구매하고자 하는 재화와 서비스의 양을 나타낸다. AD 곡선은 1) 총지출이 총소득과 같아지는 조건(IS 곡선)과 2) 실질통화공급을 사람들이 보유하고자 하는 수준에서 균형시키는 조건(LM 곡선)을 동시에 만족시키는 소득과 물가수준의 조합을 나타낸다.\"},{\"id\":29,\"question\":\"IS 곡선이란 무엇이며, 그 기본 방정식은 무엇인가?\",\"answer\":\"IS 곡선은 소득(계획된 지출 = 실제 소득)을 만족시키는 소득과 실질이자율의 조합을 나타낸다. 기본 방정식은 S = I + (G – T) + (X – M)이며, 여기서 S는 민간부문 총저축, T는 순조세(= R – F)이다. 이는 국내 민간저축이 투자(I), 정부의 재정적자(G – T), 해외에 대한 순대여 요구(X – M)에 어떻게 사용되는지를 보여준다.\"},{\"id\":30,\"question\":\"소비의 한계성향(marginal propensity to consume, MPC)과 저축의 한계성향(marginal propensity to save, MPS)이란 무엇이며, 둘의 관계는 무엇인가?\",\"answer\":\"MPC는 처분가능소득이 한 단위 늘어날 때 그중 몇 퍼센트가 소비에 쓰이는지를 나타내고, MPS는 몇 퍼센트가 저축되는지를 나타낸다. MPS = 1 – MPC의 관계가 성립하는데, 이는 소비되지 않은 소득이 곧 저축이 되기 때문이다.\"},{\"id\":31,\"question\":\"소비함수(consumption function) C = C(Y – T)를 어떻게 해석하는가?\",\"answer\":\"소비는 처분가능소득(GDP에서 순조세를 뺀 값)의 함수이다. 따라서 실질소득의 증가나 세금의 감소는 총소비를 늘린다. 더 발전된 모형에서는 소비가 현재 소득뿐 아니라 부(wealth)에도 의존한다고 본다.\"},{\"id\":32,\"question\":\"투자함수 I = I(r, Y)는 어떤 두 가지 핵심 요인을 반영하는가?\",\"answer\":\"투자는 실질이자율(r, 자금조달 비용)이 낮을 때 증가하는 함수(감소함수)이며, 총소득(Y, 투자의 기대수익성을 대리하는 지표)이 높을 때 증가하는 함수(증가함수)로 규정된다.\"},{\"id\":33,\"question\":\"LM 곡선이란 무엇이며, 화폐수량설 방정식(quantity theory of money equation)은 무엇인가?\",\"answer\":\"LM 곡선은 실질 화폐보유에 대한 수요와 공급이 균형(M/P = M(r,Y))을 이루는 소득과 이자율의 조합을 나타낸다. 화폐수량설 방정식은 MV = PY이며, 여기서 M은 명목화폐공급, V는 화폐의 유통속도(velocity of money), P는 물가수준, Y는 실질소득이다.\"},{\"id\":34,\"question\":\"IS 곡선과 LM 곡선으로부터 AD 곡선을 어떻게 도출하는가?\",\"answer\":\"IS 곡선과 LM 곡선을 결합하여 AD 곡선을 도출한다. 물가수준이 하락하면 실질화폐공급(M/P)이 증가하여 LM 곡선이 오른쪽으로 이동하고, 이 때 IS 곡선과의 교점은 더 높은 소득과 더 낮은 이자율을 나타내게 된다. 이로써 물가수준과 소득 사이의 역의 관계가 도출되는데, 이것이 바로 AD 곡선이다.\"},{\"id\":35,\"question\":\"AD 곡선은 왜 우하향하며, 어떤 세 가지 경로를 통해 수요와 지출에 영향을 미치는가?\",\"answer\":\"물가수준이 상승하면 1) 실질화폐공급이 줄어 이자율이 오른다(이자율 경로); 2) 명목자산(화폐, 채권, 주식)의 실질가치가 하락한다(부의 효과); 3) 국내재화가 상대적으로 비싸져 수입품으로 수요가 이동한다(환율 경로). 이러한 경로들은 총지출과 총소득을 감소시킨다.\"},{\"id\":36,\"question\":\"자동안정화장치(automatic stabilizer)란 무엇인가?\",\"answer\":\"순조세(T)는 소득(Y)의 증가(또는 감소) 함수이기 때문에, 소득이 늘어나면 재정수지(G – T)가 개선되고(적자가 줄고), 소득이 줄어들면 적자가 늘어난다. 이는 총생산의 지나친 변동을 어느 정도 완화하고 매끄럽게 만드는 메커니즘이기 때문에 \\\"자동안정화장치\\\"라고 부른다.  ## 총공급\"},{\"id\":37,\"question\":\"총공급(aggregate supply, AS)이란 무엇인가?\",\"answer\":\"총공급은 생산자가 특정 물가수준에서 공급하고자 하는 재화와 서비스의 양을 나타낸다. 이는 또한 가구가 특정 수준의 실질임금과 자본비용에서 노동과 자본을 투입하려는 의사를 반영한다.\"},{\"id\":38,\"question\":\"AS 곡선의 세 가지 형태 — 극단적 단기AS(VSRAS), 단기AS(SRAS), 장기AS(LRAS) — 는 어떻게 다른가?\",\"answer\":\"VSRAS는 수평선(생산량은 변하지만 물가는 고정) 형태로, 기업이 단기간에 가격을 바꾸지 않고 생산량만 늘리거나 줄인다. SRAS는 우상향(upward sloping) 형태로, 임금과 투입재 가격이 부분적으로 고정되어 있어 물가 상승이 이윤을 늘려 생산을 늘리게 한다. LRAS는 수직(vertical) 형태로, 장기에는 임금 등 투입재 가격이 상대적으로 균형을 이루어 일반 물가수준만 변하고 실질생산량은 변하지 않는다.\"},{\"id\":39,\"question\":\"LRAS 곡선의 위치는 무엇에 의해 결정되며, 어떤 생산함수와 관련이 있는가?\",\"answer\":\"LRAS 곡선의 위치는 경제의 잠재생산량(potential output)에 의해 결정된다. 고전적 모형: Y = F(K,L) = Ȳ, 여기서 K는 고정된 자본, L은 가능한 노동력이다. 잠재GDP는 고정된 자본, 노동력, 현재의 기술수준에 의해 결정된다.\"},{\"id\":40,\"question\":\"완전고용(full employment, natural level of output)이란 무엇이며, 자연실업률(natural rate of unemployment)이란 무엇인가?\",\"answer\":\"완전고용 수준은 경제가 효율적이고 장애요인 없이 작동하는 수준으로, 기업이 여유생산능력을 보유하고 구직자 수와 일자리 수가 거의 균형을 이루는 안정적이고 완만한 실업상태(자연실업률)를 나타낸다.\"},{\"id\":41,\"question\":\"단위노동비용(unit labor cost)의 변화는 어떻게 계산하며, 이는 SRAS에 어떻게 영향을 미치는가?\",\"answer\":\"% Change in unit labor cost = % Change in nominal wages – % Change in productivity. 임금이 생산성과 같은 비율로 오르면 단위노동비용은 변하지 않아 SRAS가 이동하지 않는다. 임금이 생산성보다 더 많이 오르면 단위비용이 올라 SRAS가 왼쪽으로 이동하고, 반대의 경우에는 오른쪽으로 이동한다.  ## 총수요와 총공급의 이동\"},{\"id\":42,\"question\":\"AD 곡선을 오른쪽 또는 왼쪽으로 이동시키는 주요 요인은 무엇인가?\",\"answer\":\"가구의 부(household wealth), 소비자와 기업의 기대(expectations), 생산설비 가동률(capacity utilization), 통화정책(monetary policy), 환율 변동(exchange rate), 세계경제 성장(global growth), 재정정책(fiscal policy: 정부지출, 조세)의 변화가 AD 곡선을 이동시킨다.\"},{\"id\":43,\"question\":\"부의 효과(wealth effect)란 무엇인가?\",\"answer\":\"가구가 보유한 금융자산·실물자산(예: 주식, 부동산)의 가격이 오르면 가구는 저축 목표를 달성하기 위해 저축을 덜 해도 되므로 현재 소득보다 더 많이 지출하게 된다. 즉 부의 증가는 소비를 늘려 AD 곡선을 오른쪽으로, 부의 감소는 AD 곡선을 왼쪽으로 이동시킨다는 개념이다.\"},{\"id\":44,\"question\":\"통화정책(monetary policy)은 AD 곡선의 이동에 어떻게 영향을 미치는가?\",\"answer\":\"중앙은행이 통화공급을 늘리면(은행으로부터 채권을 매입하거나, 지급준비율을 낮추거나, 은행 간 대출금리 목표를 낮추는 방식 등으로) AD 곡선이 오른쪽으로 이동한다(낮아진 이자율로 투자와 소비가 늘어나기 때문). 통화공급을 줄이면 반대로 AD 곡선이 왼쪽으로 이동한다.\"},{\"id\":45,\"question\":\"재정정책(fiscal policy)은 AD 곡선의 이동에 어떻게 영향을 미치는가?\",\"answer\":\"정부지출이 늘어나면(G의 직접적인 증가는 AD의 직접적인 구성요소) AD 곡선이 오른쪽으로 이동하고, 지출이 줄면 왼쪽으로 이동한다. 세금을 줄이면 소비자와 기업이 쓸 수 있는 소득이 늘어 AD 곡선이 오른쪽으로, 세금을 늘리면 왼쪽으로 이동한다.\"},{\"id\":46,\"question\":\"SRAS 곡선을 이동시키는 요인은 무엇인가?\",\"answer\":\"명목임금(nominal wages), (예: 원자재 등) 투입재 가격(input prices), 미래 생산물 가격과 일반 물가수준에 대한 기대, 사업세와 보조금(business taxes and subsidies), 환율 변동(exchange rate) 등의 변화가 SRAS 곡선을 이동시킨다. 또한 LRAS를 이동시키는 요인들은 SRAS도 같은 정도로 이동시킨다.\"},{\"id\":47,\"question\":\"LRAS 곡선을 이동시키는 요인은 무엇인가?\",\"answer\":\"노동력과 노동의 질(인적자본)의 증가, 천연자원의 공급, 물적자본의 공급, 생산성과 기술(productivity and technology)의 향상 등이 LRAS 곡선을 오른쪽으로 이동시킨다. 이러한 요인들은 경제의 자원기반 자체를 확대시킨다.  ## 균형 GDP와 물가\"},{\"id\":48,\"question\":\"경제 균형의 네 가지 가능한 형태는 무엇인가?\",\"answer\":\"1) 장기 완전고용(long-run full employment); 2) 단기 경기침체격차(short-run recessionary gap); 3) 단기 인플레이션격차(short-run inflationary gap); 4) 단기 스태그플레이션(short-run stagflation).\"},{\"id\":49,\"question\":\"장기균형(long-run equilibrium) 상태의 GDP 수준은 무엇과 같은가?\",\"answer\":\"AD 곡선과 SRAS 곡선이 LRAS 곡선 위의 한 점에서 교차할 때 경제는 잠재GDP 상태에 있다. 이 경우 노동과 자본이 모두 완전고용 상태에 있다. 장기적으로 균형GDP는 잠재GDP와 같다.\"},{\"id\":50,\"question\":\"경기침체격차(recessionary gap)란 무엇인가?\",\"answer\":\"AD 곡선이 왼쪽으로 이동하여 단기 SRAS 곡선과 잠재GDP보다 낮은 수준에서 교차할 때 경기침체격차가 발생한다. 실질GDP가 감소하고, 물가수준이 하락하며, 실업이 증가한다. 경기침체격차는 균형GDP가 잠재GDP보다 얼마나 낮은지를 측정한다.\"},{\"id\":51,\"question\":\"인플레이션격차(inflationary gap)란 무엇인가?\",\"answer\":\"AD가 증가하여 경제가 잠재GDP를 초과한 수준에서 균형을 이룰 때 인플레이션격차가 발생한다. 실질GDP가 잠재GDP를 초과하는 정도로 측정되며, 이로 인해 임금과 투입재 가격에 상승압력이 가해진다.\"},{\"id\":52,\"question\":\"스태그플레이션(stagflation)이란 무엇이며, 무엇으로부터 발생하는가?\",\"answer\":\"스태그플레이션은 높은 인플레이션과 높은 실업이 동시에 나타나는 상태이다. 이는 총공급의 감소(SRAS 곡선이 왼쪽으로 이동)에서 비롯되는데, 예를 들어 원자재(특히 석유)의 급격한 가격 상승이 원인이 된다. GDP는 감소하지만 물가수준은 하락하지 않고 오히려 상승한다는 점에서 일반적인 수요 측 침체와 구별되는 특징이다.\"},{\"id\":53,\"question\":\"AD와 AS가 둘 다 증가하거나, 둘 다 감소하거나, 하나는 증가하고 다른 하나는 감소하는 경우 실질GDP와 물가수준에 대한 영향은 어떻게 결정되는가?\",\"answer\":\"AD와 AS가 둘 다 증가하면 실질GDP가 증가하는 것은 확실하지만, 물가수준에 대한 영향(indeterminate)은 어느 쪽이 더 크게 증가했는지에 따라 달라진다. 둘 다 감소하면 실질GDP 감소는 확실하지만 물가수준의 영향은 불확실하다. AD가 증가하고 AS가 감소하면 물가수준 상승은 확실하지만 GDP에 대한 영향은 불확실하다. AD가 감소하고 AS가 증가하면 물가수준 하락은 확실하지만 GDP에 대한 영향은 불확실하다.  ## 생산함수와 잠재GDP\"},{\"id\":54,\"question\":\"두 생산요소를 가진 생산함수(production function) Y = AF(L,K)를 설명하라.\",\"answer\":\"Y는 경제의 총생산, L은 노동의 양(근로자 수), K는 자본스톡(설비, 건물), A는 기술 지식 또는 총요소생산성(total factor productivity, TFP)을 나타낸다. TFP는 노동과 자본의 투입으로 설명되지 않는 성장분을 나타내는 규모 요인이다.\"},{\"id\":55,\"question\":\"규모에 대한 수익 불변(constant returns to scale)이란 무엇인가?\",\"answer\":\"모든 투입요소를 동일한 비율로 늘리면 생산량도 동일한 비율로 늘어나는 특성을 규모에 대한 수익 불변이라 한다. 예를 들어 모든 투입요소를 두 배로 늘리면 생산량도 두 배로 늘어난다.\"},{\"id\":56,\"question\":\"한계생산성 감소(diminishing marginal productivity)란 무엇인가?\",\"answer\":\"다른 투입요소를 고정한 채 하나의 투입요소의 양을 늘려갈수록, 그 투입요소를 한 단위 추가로 늘릴 때 얻는 추가 생산량이 점차 줄어드는 현상이다. 예를 들어 고정된 규모의 공장에 근로자를 추가할수록 근로자 한 명당 추가 생산량은 줄어든다.\"},{\"id\":57,\"question\":\"자본심화(capital deepening)란 무엇이며, 왜 지속가능한 성장의 원천이 될 수 없는가?\",\"answer\":\"자본심화란 노동 대비 자본스톡을 늘리는 투자를 의미한다. 자본의 한계생산성이 감소(diminishing marginal productivity of capital)하기 때문에 자본만 계속 늘리면 추가 생산량이 점점 줄어들어 성장이 점차 둔화된다. 따라서 장기적으로 지속가능한 성장은 자본심화만으로는 이루어질 수 없으며, 기술진보(총요소생산성의 성장)가 필요하다.\"},{\"id\":58,\"question\":\"성장요인분해 방정식(growth accounting equation)은 무엇인가?\",\"answer\":\"Growth in potential GDP = Growth in technology + WL (Growth in labor) + WC (Growth in capital). 여기서 WL, WC는 각각 노동과 자본이 국민소득에서 차지하는 상대적 비중이다(미국의 경우 각각 약 0.7, 0.3).\"},{\"id\":59,\"question\":\"1인당 성장요인분해 방정식(per capita growth accounting equation)은 무엇인가?\",\"answer\":\"Growth in per capita potential GDP = Growth in technology + WC (Growth in capital-to-labor ratio). 이는 미국의 경우 자본의 비중이 0.3이므로, 근로자 1인당 자본이 1% 증가할 때 1인당 생산량은 0.3%만 증가한다는 의미이다.\"},{\"id\":60,\"question\":\"총요소생산성(TFP)의 성장은 어떻게 계산하는가?\",\"answer\":\"TFP growth = Growth in potential GDP – [WL (Growth in labor) + WC (Growth in capital)]. TFP의 성장은 잠재GDP 성장률에서 노동과 자본의 가중평균 성장률을 뺀 차이(잔차, residual)로 계산된다.  ## 경제성장의 원천\"},{\"id\":61,\"question\":\"경제성장의 다섯 가지 핵심 원천은 무엇인가?\",\"answer\":\"1) 노동공급(labor supply); 2) 인적자본(human capital); 3) 물적자본(physical capital); 4) 기술(technology); 5) 천연자원(natural resources).\"},{\"id\":62,\"question\":\"총근로시간(total hours worked)은 어떻게 계산하는가?\",\"answer\":\"Total hours worked = Labor force × Average hours worked per worker. 노동력(labor force)은 취업 중이거나 구직 중이지만 실업 상태인(16세 이상) 인구의 비율을 의미한다.\"},{\"id\":63,\"question\":\"인적자본(human capital)이란 무엇이며, 성장에 어떻게 영향을 미치는가?\",\"answer\":\"인적자본은 교육, 훈련, 생활 경험을 통해 축적된 지식과 기술로, 근로자의 질을 나타낸다. 더 나은 교육을 받은 인력은 생산성이 높아 더 많은 산출물을 만들어내며, 기술 변화에도 더 유연하게 적응한다. 교육은 또한 파급효과(spillover/externality 효과)를 가져서, 한 사람의 교육 수준이 높아지면 주변 사람들의 생산량도 함께 늘어난다.\"},{\"id\":64,\"question\":\"물적자본스톡(physical capital stock)의 증가는 무엇에 좌우되는가?\",\"answer\":\"물적자본스톡은 순투자(net investment = 총투자에서 감가상각을 뺀 값)가 양(+)의 값일 때 매년 증가한다. 따라서 투자 비율이 높은 국가(예: 중국, 북한)는 자본스톡이 늘어나 GDP 성장률이 빠른 경향이 있다. 즉 투자와 경제성장 사이에는 높은 상관관계가 관찰된다.\"},{\"id\":65,\"question\":\"기술(technology)은 왜 선진국 경제성장의 핵심 요인인가?\",\"answer\":\"기술진보는 생산자가 자본의 한계생산성 감소라는 제약을 뛰어넘을 수 있게 해준다. 투입요소(노동, 자본)만 늘리는 데 의존한다면 성장은 제한된다. 기술진보는 연구개발(research and development, R\u0026D) 지출, 특허, 수입, 모방 등을 통해 이루어진다. TFP는 기술진보를 반영하기 때문에 잔차(residual)로 계산된다.\"},{\"id\":66,\"question\":\"재생가능(renewable) 자원과 재생불가능(non-renewable) 천연자원의 차이는 무엇인가?\",\"answer\":\"재생가능 자원은 사용한 후에도 다시 보충할 수 있는 자원이다(예: 숲 — 베어낸 뒤 다시 심을 수 있다). 재생불가능 자원은 양이 한정되어 있어 사용하면 매장량이 줄어드는 자원이다(예: 석유, 석탄).\"},{\"id\":67,\"question\":\"맬서스 성장이론(Malthusian growth theory)은 무엇을 예측했으며, 왜 현실화되지 않았는가?\",\"answer\":\"토머스 맬서스는 1798년에 노동을 유일한 가변 투입요소로 보고, 인구와 노동력이 늘어날수록 노동의 한계생산성이 0에 가까워져 장기적인 경제성장이 불가능해질 것이라고 예측했다. 이 예측이 현실화되지 않은 이유는 경제학자들이 분석의 초점을 노동에서 자본으로, 그리고 더 중요하게는 기술진보(TFP의 성장)로 옮겼기 때문이다 — 기술은 한계생산성 감소를 뛰어넘을 수 있게 해준다.  ## 지속가능한 성장의 척도\"},{\"id\":68,\"question\":\"노동생산성(labor productivity)이란 무엇이며, 공식은 무엇인가?\",\"answer\":\"노동생산성은 근로자가 한 시간의 노동으로 생산하는 재화와 서비스의 양(실질GDP)이다. Labor productivity = Real GDP/Aggregate hours. 노동생산성이 증가하면 생활수준이 향상된다.\"},{\"id\":69,\"question\":\"잠재GDP(potential GDP)는 근로시간과 생산성의 곱으로 어떻게 표현되는가?\",\"answer\":\"Potential GDP = Aggregate hours worked × Labor productivity. 성장률로 표현하면: Potential growth rate = Long-term growth rate of labor force + Long-term labor productivity growth rate.\"},{\"id\":70,\"question\":\"경제의 지속가능한 성장률(sustainable growth rate)을 가장 실용적으로 계산하는 방법은 무엇인가?\",\"answer\":\"지속가능한 성장률은 노동력의 장기 성장률과 노동생산성의 장기 성장률의 합과 같다. TFP와 잠재GDP는 직접 관측되지 않는(\\\"unobserved\\\") 반면 노동생산성과 노동량은 직접 관측 가능하기 때문에 이 방법이 더 실용적이다.\"},{\"id\":71,\"question\":\"선진국과 신흥국에서 노동생산성의 수준과 성장률은 어떻게 다르게 나타나는가?\",\"answer\":\"노동생산성의 수준(level)은 축적된 인적자본과 물적자본에 좌우되므로 선진국(예: 독일, 아일랜드)에서 더 높게 나타난다. 반면 생산성의 성장률(growth rate)은 인적·물적자본이 빠르게 늘어나는 신흥국에서 더 높게 나타나는 경우가 많다.\"},{\"id\":72,\"question\":\"실질GDP의 성장이 잠재GDP의 성장보다 빠르거나 느릴 때 경제와 자본시장에 대해 어떤 결론을 내릴 수 있는가?\",\"answer\":\"실질GDP가 잠재GDP보다 빠르게 성장하고 있다면 이는 경제에 인플레이션 압력이 커지고 있다는 신호로, 중앙은행이 금리를 올릴 가능성이 높아진다. 실질GDP가 잠재GDP보다 느리게 성장하고 있다면 이는 유휴자원(slack)이 늘어나고 인플레이션 압력이 줄어들고 있다는 신호로, 중앙은행이 금리를 내리거나 그대로 유지할 가능성이 높아진다.  ---\"}]},{\"id\":\"business-cycles\",\"title\":\"경기순환의 이해\",\"cards\":[{\"id\":1,\"question\":\"Burns, Mitchell(1946)의 정의에 따르면 경기순환(business cycle)이란 무엇이며, 이 정의의 핵심 특징은 무엇인가?\",\"answer\":\"경기순환은 기업들로 조직된 국가들의 총경제활동(aggregate economic activity)에서 나타나는 변동으로, 확장(expansion), 수축(contraction/recession), 회복 등의 국면으로 구성된다. 이는 반복적(recurrent)이지만 주기적이지는 않은(not periodic) 현상으로, 통상적인 지속 기간은 1년에서 12년까지이다.\"},{\"id\":2,\"question\":\"경기순환의 네 가지 국면(four phases)은 무엇인가?\",\"answer\":\"저점(trough), 확장(expansion), 정점(peak), 수축(contraction)이다. 정점과 저점은 순환의 전환점(turning points)이다.\"},{\"id\":3,\"question\":\"\\\"수축(contraction)\\\" 또는 \\\"recession\\\"이란 무엇이며, \\\"depression\\\"이라고 부르는 경우는 언제인가?\",\"answer\":\"수축(contraction)은 정점 이후부터 저점 이전까지의 국면으로, 이 시기에 총경제활동이 감소한다. 이러한 현상은 보통 불황(recession)이라 부르며, 매우 심각하고 깊은 경우에는 공황(depression)이라 한다.\"},{\"id\":4,\"question\":\"경기침체(recession)가 시작되었는지를 판단하는 일반적인 경험법칙(rule of thumb)은 무엇이며, 이 법칙의 약점은 무엇인가?\",\"answer\":\"한 국가의 실질 GDP(real GDP) 성장률이 2개 분기 연속 마이너스를 기록하면 경기침체가 시작된 것으로 본다. 그러나 이 법칙은 오류가 있을 수 있다. 예를 들어 실질 GDP가 한 분기에는 마이너스였다가 다음 분기에 소폭 플러스로 전환된 뒤 다시 마이너스로 돌아선다면, 이 단순한 법칙으로는 경기침체를 제대로 포착하지 못한다.\"},{\"id\":5,\"question\":\"미국에서 경기순환의 정점과 저점을 판정하는 기관은 어디이며, 어떤 변수들을 분석하는가?\",\"answer\":\"전미경제연구소(National Bureau of Economic Research, NBER)가 미국의 경기순환을 판정하는데, 실질 GDP에만 국한되지 않고 고용(employment), 산업생산(industrial production), 판매(sales) 등 여러 시계열 자료를 분석한다.\"},{\"id\":6,\"question\":\"경기확장의 말기에 나타나는 \\\"붐(boom)\\\"이란 무엇이며, 이 시기에 경제가 \\\"과열(overheating)\\\"되는 현상은 어떻게 나타나는가?\",\"answer\":\"붐은 확장의 말기로, 경제가 성장의 \\\"한계를 시험하는\\\" 시기이다. 이 시기에는 기업들이 숙련된 인력을 구하기 어려워지고, 임금이 상승하며, 차입(borrowing)이 늘어나면서 그 결과 인플레이션 위험이 커지는데, 이를 과열이라 한다.\"},{\"id\":7,\"question\":\"경기침체기에 자본시장에서 투자자들의 행태는 어떻게 바뀌며, 주식시장이 선행지표(leading indicator)로 여겨지는 이유는 무엇인가?\",\"answer\":\"경기침체기에 투자자들은 정부채권, 안정적인 현금흐름을 가진 기업의 주식 등 안전자산을 선호하게 된다. 주식시장은 보통 경제의 저점보다 3~6개월 앞서 바닥을 치기 때문에 경제의 선행지표로 여겨진다.\"},{\"id\":8,\"question\":\"경기순환의 각 국면에서 실업, 인플레이션, 자본지출의 변화는 어떤 일반적인 추세를 보이는가?\",\"answer\":\"확장 초기에는 실업률이 여전히 높은 수준이지만 조금씩 낮아지기 시작한다. 인플레이션은 안정적이다. 확장 후기에는 실업이 줄고 인플레이션이 다소 빨라진다. 정점에서는 자본지출이 빠르게 확대되지만 성장 속도는 둔화되고 인플레이션은 더욱 가속화된다. 수축기에는 실업이 늘고 나머지 모든 지표가 명확히 악화된다.  ## 자원이용, 주택, 대외무역부문의 변화\"},{\"id\":9,\"question\":\"경기하강이 시작될 때 기업들은 왜 곧바로 인력을 감원하지 않으며, 대신 무엇을 하는가?\",\"answer\":\"새 직원을 채용하고 훈련시키는 비용이 높기 때문에 기업들은 먼저 초과근무(overtime)를 줄이고 비용을 절감한다. 하강이 일시적인 것일 수도 있으므로 인력을 감원하는 것은 비효율적이라고 판단하기 때문이다.\"},{\"id\":10,\"question\":\"잠재생산량(potential output, GDPP)과 경기침체 생산량(recession output, GDPR) 사이의 격차는 무엇을 나타내는가?\",\"answer\":\"이 격차는 유휴자원(slack resources)의 정도를 나타낸다 — 노동의 경우 실업을, 실물자본의 경우 유휴상태(idleness)를 의미한다.\"},{\"id\":11,\"question\":\"자본지출(capital spending)은 경기순환 동안 세 단계로 어떻게 변동하는가?\",\"answer\":\"수축 초기에는 경장비 주문이 빠르게 줄어든다. 확장 초기에는 기술, 소프트웨어 등 효율성을 높이는 장비에 대한 주문이 회복된다. 확장 후기에는 생산능력을 확충하기 위한 중장비와 시설에 대한 주문이 늘어난다.\"},{\"id\":12,\"question\":\"재고-판매 비율(inventory–sales ratio)은 경기순환 동안 어떻게 변화하는가?\",\"answer\":\"순환의 정점에서는 판매가 둔화되고 재고가 누적되면서 비율이 상승한다. 하강 중반에는 기업들이 생산을 줄이면서 비율이 낮아진다. 회복 초기에는 판매가 생산을 앞서면서 비율이 더 낮아진다.\"},{\"id\":13,\"question\":\"가구소비의 세 가지 기본 범주는 무엇이며, 경기하강 시 이들은 어떤 순서로 감소하는가?\",\"answer\":\"(1) 내구재(durable goods), (2) 비내구재(non-durable goods), (3) 서비스(services)이다. 내구재 구매는 연기할 수 있는 여지가 크기 때문에 경기하강 초기에 내구재 소비가 가장 뚜렷하게 먼저 감소한다.\"},{\"id\":14,\"question\":\"\\\"영구소득(permanent income)\\\"이라는 개념은 무엇이며, 어떤 소비를 설명하는 데 더 적합한가?\",\"answer\":\"영구소득이란 일시적인 소득, 손실, 이득을 제외하고 가구가 꾸준히 기대할 수 있는 소득의 흐름을 의미한다. 이 개념은 서비스 및 기초 소비를 설명하는 데 더 적합하며, 내구재 소비는 오히려 가처분소득(disposable income)과 더 밀접하게 연관되어 있다.\"},{\"id\":15,\"question\":\"저축률(saving rate)이 상승할 때 이는 무엇을 의미할 수 있는가?\",\"answer\":\"저축률 상승은 미래 소득의 불확실성에 대비한 예비적 저축(precautionary savings) 행태를 나타내며, 가구들이 지출을 제한하려는 의사가 있음을 보여준다 — 이는 단기적으로 경기 둔화의 신호일 수 있지만, 장기적으로는 회복의 여력을 늘려준다.\"},{\"id\":16,\"question\":\"주택부문(housing sector)은 왜 금리(interest rates)에 매우 민감한가?\",\"answer\":\"대부분의 주택 구매자는 모기지(mortgage) 대출로 자금을 조달하기 때문에, 모기지 금리가 하락하면 주택 구매와 건설 활동이 확대되고, 금리가 상승하면 위축된다.\"},{\"id\":17,\"question\":\"가구형성(family/household formation) 추세는 주택순환에서 어떤 역할을 하는가?\",\"answer\":\"이는 주택에 대한 장기적·구조적(secular) 수요를 결정하며, 25~40세 인구의 증가 등으로 측정할 수 있다. 이 요인은 경기순환과 직접적인 관련은 없지만, 시장의 과잉건설(overbuilding)이 얼마나 빨리 해소될 수 있는지를 파악하는 데 도움이 된다.\"},{\"id\":18,\"question\":\"수입(imports)과 수출(exports)은 각각 무엇에 의해 결정되는가?\",\"answer\":\"수입은 주로 국내 GDP 성장 속도에 의해 결정되며, 수출은 주요 교역상대국의 세계 경기순환에 의해 결정된다.\"},{\"id\":19,\"question\":\"자국 화폐 가치의 상승(currency appreciation)은 무역흐름에 어떤 영향을 미치는가?\",\"answer\":\"화폐 가치가 상승하면 외국 상품이 상대적으로 저렴해져 수입이 늘어나고, 반대로 국내 수출품은 해외시장에서 비싸져 감소한다. 화폐 가치의 하락(depreciation)은 반대의 효과를 가져온다.  ## 경기순환이론\"},{\"id\":20,\"question\":\"신고전학파(Neoclassical school)의 \\\"일반균형(general equilibrium)\\\" 개념은 무엇이며, 이는 경기순환을 어떻게 설명하는가?\",\"answer\":\"신고전학파 이론에 따르면 \\\"보이지 않는 손(invisible hand)\\\"이 모든 시장을 균형으로 이끈다 — 가격, 금리, 임금이 유연하다면 어떤 충격이든 빠르게 흡수되어 균형이 회복된다. 따라서 이 학파에는 강력한 경기순환 이론이 없으며, 변동을 단지 일시적인 불균형(temporary disequilibria)으로 본다.\"},{\"id\":21,\"question\":\"세이의 법칙(Say's law)이란 무엇인가?\",\"answer\":\"\\\"공급이 스스로 수요를 창출한다(supply creates its own demand)\\\"는 법칙으로, 생산된 상품은 모두 판매된다고 본다 — 생산에 투입된 노동과 자본에 대한 지불(임금, 이자)이 구매력을 만들어내기 때문이다.\"},{\"id\":22,\"question\":\"슘페터의 \\\"창조적 파괴(creative destruction)\\\" 이론은 무엇인가?\",\"answer\":\"이 이론은 기술 발전으로 인해 특정 산업 내에서 순환이 발생한다고 설명한다 — 혁신적인 신규 기업이 기존 생산자를 시장에서 밀어내지만, 이는 경제 전체(economy-wide)의 변동이 아니라 해당 산업에 국한된 변동이라는 것이다.\"},{\"id\":23,\"question\":\"오스트리아학파(Austrian school)의 경기순환에 대한 핵심 설명은 무엇인가?\",\"answer\":\"오스트리아학파에 따르면 낮은 금리는 과도한 신용 증가(excessive credit growth)를 유발하여 수익성이 낮은 프로젝트에 지나치게 많은 투자가 이루어진다. 금리가 오르면 이러한 투자들이 실패하면서 경제는 경기침체에 빠진다. 따라서 이들은 정부/중앙은행의 제한적인 개입을 지지한다.\"},{\"id\":24,\"question\":\"케인즈학파(Keynesian school)에 따르면 경기침체기에 임금과 가격을 낮추는 것이 왜 경제를 빠르게 균형으로 되돌리지 못하는가?\",\"answer\":\"케인즈는 근로자의 임금이 하락하면 그들의 지출이 줄어들어 총수요(aggregate demand)가 좌측으로 이동하고, 이로 인해 위기가 더욱 심화된다고 설명했다. 따라서 정부 정책(재정정책)의 개입이 필요하다고 보았다.\"},{\"id\":25,\"question\":\"케인즈의 유명한 말 \\\"장기적으로 우리는 모두 죽는다(in the long run, we are all dead)\\\"는 어떤 의미인가?\",\"answer\":\"시장이 장기적으로는 균형을 이룰 수 있지만, 경기침체로 인한 손실과 인간의 고통이 너무 크기 때문에 정부가 단기적으로 결단력 있는 조치를 취해야 한다는 점을 강조한 말이다.\"},{\"id\":26,\"question\":\"케인즈의 재정정책 중심 접근법에 대한 주요 비판은 무엇인가?\",\"answer\":\"(1) 재정적자는 정부 부채를 증가시킨다. (2) 정책이 너무 오래 지속되면 경제가 \\\"과열(overheat)\\\"될 위험이 있다. (3) 재정정책은 시행에 시간이 걸리기 때문에, 추가 부양책이 실행될 즈음에는 경제가 이미 회복되어 있을 가능성이 크다.\"},{\"id\":27,\"question\":\"하이먼 민스키(Hyman Minsky)의 \\\"민스키 모멘트(Minsky moment)\\\"란 무엇인가?\",\"answer\":\"이는 확장 말기에 과도한 차입으로 자금을 조달한 투기적 투자가 이루어진 뒤, 사람들이 위험을 인식하고 당황하여 자산을 급히 매도(asset sell-offs)하는 순간을 말한다. 민스키는 금융시장의 과도한 자만(complacency)이 경제 변동을 더욱 심화시킨다고 보았다.\"},{\"id\":28,\"question\":\"통화주의학파(Monetarist school)는 케인즈학파의 정부 개입을 어떤 네 가지 이유로 비판하는가?\",\"answer\":\"(1) 케인즈 모형은 통화공급(money supply)의 중요성을 간과한다. (2) 효용을 극대화하는(utility-maximizing) 경제주체를 제대로 묘사하지 못한다. (3) 정부 개입의 장기적 비용(부채, 이자)을 고려하지 않는다. (4) 정책이 시행되는 데 걸리는 시간이 불확실하다.\"},{\"id\":29,\"question\":\"통화주의자들이 제안하는 정책은 무엇인가?\",\"answer\":\"통화공급을 꾸준하고 완만한 속도(steady, moderate rate)로 증가시키고, 정부의 경제 개입을 제한하며, 재정정책과 통화정책을 명확하고 일관되게 유지하는 것이다.\"},{\"id\":30,\"question\":\"신고전학파(New Classical school)의 실물경기순환이론(Real Business Cycle, RBC)은 화폐를 어떻게 취급하는가?\",\"answer\":\"RBC 모형에는 화폐가 존재하지 않는다 — 경제 변동은 기술, 선호, 세계 가격 변화 등 실물 충격(real shocks)에서 발생한다고 본다. 인플레이션 등 통화 변수는 실질 GDP나 실업에 영향을 미치지 않는다고 본다.\"},{\"id\":31,\"question\":\"신케인즈주의(Neo-Keynesian) 모형은 신고전학파 모형과 어떤 핵심적인 차이가 있는가?\",\"answer\":\"신케인즈주의 모형은 가격과 임금이 서서히 조정된다(\\\"sticky\\\" prices/wages)고 보기 때문에 시장이 균형상태로 빠르게 이동하지 않으며, 이는 일부 경우에 정부 개입을 불가피하게 만든다. 반면 신고전학파 모형은 가격과 임금이 빠르게 조정된다고 보고 정부 개입이 불필요하다고 본다.  ## 실업\"},{\"id\":32,\"question\":\"\\\"노동력(labor force)\\\"이란 누구를 말하며, 여기에 포함되지 않는 사람은 누구인가?\",\"answer\":\"노동력은 취업 중이거나 구직 중인 사람들의 수를 말한다. 은퇴자, 어린이, 전업주부, 학생 등 구직활동을 하지 않는 사람들은 포함되지 않는다.\"},{\"id\":33,\"question\":\"실업률(unemployment rate)은 어떤 공식으로 계산되는가?\",\"answer\":\"실업률 = 실업자 수 / 노동력 수(unemployment rate = unemployed / labor force).\"},{\"id\":34,\"question\":\"경제활동참가율(activity ratio 또는 participation ratio)은 어떤 공식으로 계산되는가?\",\"answer\":\"참가율 = 노동력 / 노동연령(16~64세) 총인구(activity ratio = labor force / working-age population).\"},{\"id\":35,\"question\":\"\\\"구직단념자(discouraged worker)\\\"란 누구이며, 이들은 실업 통계에 어떤 영향을 미치는가?\",\"answer\":\"구직단념자는 일을 구할 수 없다고 생각해 구직활동을 포기한 사람으로, 공식 노동력에서 제외되어 실업률(unemployment rate)에 반영되지 않는다 — 이는 \\\"숨은 실업(hidden unemployment)\\\"의 한 형태이다.\"},{\"id\":36,\"question\":\"\\\"불완전취업자(underemployed)\\\"란 누구인가?\",\"answer\":\"불완전취업자는 직업이 있지만 더 높은 임금을 받을 수 있거나 자신의 능력에 더 적합한 일을 할 수 있는 사람을 말한다. 이들은 실업률 계산에서 \\\"취업자\\\"로 분류된다.\"},{\"id\":37,\"question\":\"마찰적 실업(frictional unemployment)이란 무엇이며, 이것이 단기적인 이유는 무엇인가?\",\"answer\":\"마찰적 실업은 사람들이 직장을 그만두었거나 새 일자리를 찾고 있어서, 자신의 능력과 관심에 더 잘 맞는 일자리를 찾는 데 시간이 걸리는 데서 발생하는 실업이다. 여기에는 자발적으로 퇴사한 사람, 신규로 노동력에 진입하는 사람 등이 포함되며, 본질적으로 단기적이고 전환기적인 성격을 가진다.\"},{\"id\":38,\"question\":\"실업률은 왜 후행지표(lagging indicator)로 간주되는가?\",\"answer\":\"첫째, 어려운 시기에는 구직단념자(discouraged workers)가 구직을 포기하고 노동력에서 빠져나가 실업률을 인위적으로 낮추는 반면, 회복기에는 구직을 재개하는 사람들이 돌아와 실업률을 끌어올린다. 둘째, 기업들은 인력을 해고하거나 채용하는 데 느리게 반응하기 때문에 그 반응이 경기순환보다 늦게 나타난다.\"},{\"id\":39,\"question\":\"NAIRU(non-accelerating inflation rate of unemployment) 또는 NARU(natural rate of unemployment)란 무엇인가?\",\"answer\":\"이는 실업률이 이보다 낮아지면 노동시장에서 인력 부족과 임금-물가 악순환(wage-price spiral)이 발생하는 \\\"자연\\\" 수준의 실업률이다. 이 수준은 경제마다, 시기마다 다르며 직접 관측할 수 없다.\"},{\"id\":40,\"question\":\"단위노동비용(unit labor cost, ULC)은 어떤 공식으로 계산되는가?\",\"answer\":\"ULC = W / O. 여기서 ULC = 단위노동비용, O = 근로자 1인당 시간당 산출(output per hour per worker), W = 근로자 1인당 시간당 총노동보상(total labor compensation per hour per worker)이다.  ## 인플레이션\"},{\"id\":41,\"question\":\"디플레이션(deflation), 하이퍼인플레이션(hyperinflation), 디스인플레이션(disinflation)이라는 세 용어를 구분하라.\",\"answer\":\"Deflation(디플레이션) — 전반적인 물가수준이 지속적으로 하락하여 인플레이션율이 0% 미만인 상태. Hyperinflation(하이퍼인플레이션) — 인플레이션율이 매우 빠르게 상승하여 연간 500~1000%에 이르는 수준. Disinflation(디스인플레이션) — 인플레이션율이 낮아지고 있지만 여전히 양(+)의 값을 유지하는 상태(예: 15~20%에서 5~6%로 하락).\"},{\"id\":42,\"question\":\"디플레이션은 경기침체를 왜 더욱 심화시킬 수 있는가?\",\"answer\":\"디플레이션 시기에는 기업의 수입이 줄어드는 반면 부채의 명목 금액은 고정되어 있어 부채의 실질 부담(real debt burden)이 늘어난다. 이는 기업들로 하여금 지출, 투자, 고용을 급격히 줄이게 하여 경제 수축을 더욱 심화시킨다.\"},{\"id\":43,\"question\":\"하이퍼인플레이션(hyperinflation)의 전형적인 원인은 무엇인가?\",\"answer\":\"정부 지출을 세수로 충당할 수 없게 되면 통화당국(중앙은행)이 통화공급을 늘려 정부 지출을 지원하는데, 이는 통화의 빠른 유통과 물가의 급격한 상승을 초래한다.\"},{\"id\":44,\"question\":\"소비바스켓의 1월 총가격이 ¥458, 2월 총가격이 ¥515라면(1월 지수 = 100), 2월의 물가지수와 인플레이션율은 얼마인가?\",\"answer\":\"물가지수(2월) = (515/458) × 100 = ¥112.45. 인플레이션율 = (112.45/100) − 1 = 0.1245 = 12.45%.\"},{\"id\":45,\"question\":\"라스파이레스 지수(Laspeyres index)란 무엇이며, 이는 어떤 세 가지 편향(bias)을 갖는가?\",\"answer\":\"라스파이레스 지수는 소비바스켓의 구성(기준연도 기준)을 고정한 채 계산하는 물가지수이다. 이 지수의 세 가지 편향은 대체편향(substitution bias), 품질편향(quality bias), 신제품편향(new product bias)이며, 이들은 모두 인플레이션율을 상향편향(upward bias)시키는 원인이 된다.\"},{\"id\":46,\"question\":\"파쉐 지수(Paasche index)는 라스파이레스 지수와 어떻게 다르며, 2019년 2월의 예시(70리터 × ¥4 + 60리터 × ¥4.5 대 70 × ¥3 + 60 × ¥4.4)에서 파쉐 지수의 값은 얼마인가?\",\"answer\":\"파쉐 지수는 당해연도의 소비바스켓 구성을 사용하여 계산하는 지수이다(라스파이레스 지수는 기준연도의 바스켓을 사용한다). 예시 계산: Paasche Index = [(70×4)+(60×4.5)] / [(70×3)+(60×4.4)] × 100 = 550/474 × 100 = 116.03.\"},{\"id\":47,\"question\":\"피셔 지수(Fisher index)는 어떤 공식으로 계산되며, 이는 어떤 편향을 해결하는 데 유용한가?\",\"answer\":\"Fisher Index = √(IP × IL), 즉 파쉐 지수(IP)와 라스파이레스 지수(IL)의 기하평균이다. 예시 계산: √(116.03 × 112.45) = 114.23. 이는 대체편향(substitution bias)을 줄이는 데 유용하다.\"},{\"id\":48,\"question\":\"소비자물가지수(consumer price index, CPI)와 생산자물가지수(producer price index, PPI)의 주요 차이점은 무엇인가?\",\"answer\":\"CPI는 가구가 소비하는 상품바스켓의 가격을 측정하는 반면, PPI는 국내 생산자들이 직면하는 원자재/제품 가격의 변화를 측정한다. PPI의 상승은 이후 CPI에 전이되어 영향을 미칠 수 있다. 일부 국가에서는 PPI를 \\\"도매물가지수(wholesale price index, WPI)\\\"라고 부른다.\"},{\"id\":49,\"question\":\"헤드라인 인플레이션(headline inflation)과 근원 인플레이션(core inflation)의 차이는 무엇이며, 정책당국이 근원 인플레이션에 주목하는 이유는 무엇인가?\",\"answer\":\"헤드라인 인플레이션은 식품과 에너지를 포함한 모든 상품과 서비스의 물가지수를 계산하며, 근원 인플레이션은 식품과 에너지를 제외하고 계산한다. 정책당국은 단기적인 식품/에너지 가격 변동에 과도하게 반응하는 것을 피하기 위해 근원 인플레이션에 주목한다.\"},{\"id\":50,\"question\":\"GDP 디플레이터(GDP deflator)란 무엇이며, 이는 CPI와 어떻게 다른가?\",\"answer\":\"GDP 디플레이터는 해당 경제에서 국내에서 생산된 모든 상품과 서비스 바스켓의 가격을 측정하는 지수로, 명목 GDP(nominal GDP)를 \\\"디플레이트\\\"하여 실질 GDP의 성장 추세를 파악하는 데 사용된다. CPI는 가구의 소비바스켓을 측정하는 반면, GDP 디플레이터는 국내에서 생산된 모든 제품을 포괄한다.\"},{\"id\":51,\"question\":\"비용상승 인플레이션(cost-push inflation)과 수요견인 인플레이션(demand-pull inflation)의 주요 차이는 무엇인가?\",\"answer\":\"Cost-push inflation(비용상승 인플레이션) — 비용(주로 임금)이 상승하여 기업들이 가격을 올리게 되는 인플레이션. Demand-pull inflation(수요견인 인플레이션) — 총수요가 증가하여 가격이 오르고, 이후 근로자들의 임금 요구에 반영되는 인플레이션. 두 경우 모두 공급을 초과하는 과도한 수요에서 발생한다.\"},{\"id\":52,\"question\":\"통화주의자들의 인플레이션에 대한 견해(\\\"inflation is always and everywhere a monetary phenomenon\\\")는 무엇인가?\",\"answer\":\"통화주의자들(밀턴 프리드먼이 대표적)은 인플레이션이 본질적으로 통화적 현상이라고 본다 — 통화의 과잉공급이 통화의 가치를 떨어뜨리고, 이것이 전반적인 물가 상승으로 이어진다는 원리이다(\\\"너무 많은 돈이 너무 적은 상품을 쫓는다\\\").\"},{\"id\":53,\"question\":\"인플레이션 기대(inflation expectations)를 측정하는 데 물가연동국채(Treasury Inflation-Protected Securities, TIPS)를 활용하는 예를 설명하라.\",\"answer\":\"10년 만기 일반국채의 수익률이 3.5%, 물가로부터 보호되는(TIPS) 채권의 수익률이 1.5%라면, 시장은 연평균 3.5% − 1.5% = 2%의 인플레이션을 기대하고 있다고 추정할 수 있다(breakeven inflation rate, 손익분기 인플레이션율).  ## 경제지표\"},{\"id\":54,\"question\":\"선행(leading), 동행(coincident), 후행(lagging) 경제지표의 차이는 무엇인가?\",\"answer\":\"Leading indicators(선행지표) — 전환점이 전체 경제보다 먼저 나타나며, 미래를 예측하는 데 유용하다. Coincident indicators(동행지표) — 전환점이 전체 경제와 거의 동시에 나타나며, 현재 상태를 반영한다. Lagging indicators(후행지표) — 전환점이 전체 경제보다 뒤늦게 나타나며, 과거의 상황을 반영한다.\"},{\"id\":55,\"question\":\"미국에서 콘퍼런스보드(Conference Board)가 산출하는 선행경제지표지수(Index of Leading Economic Indicators, LEI)에 포함되는 예시 지표 중 세 가지를 들어보라.\",\"answer\":\"예를 들면 제조업 주당 평균 근로시간(average weekly hours, manufacturing), S\u0026P 500 지수, 신규 민간주택 착공 허가(building permits for new private housing units), 그리고 10년 만기 국채 수익률과 일일 대출금리의 스프레드(interest rate spread) 등이 있다.\"},{\"id\":56,\"question\":\"확산지수(diffusion index)는 무엇을 측정하는가?\",\"answer\":\"확산지수는 종합지표를 구성하는 요소들 중 몇 퍼센트가 상승하고 있는지를 측정한다 — 이는 하나의 지수 변동이 가지는 \\\"폭(breadth)\\\"을 보여주며, 전체 지수의 변화가 얼마나 광범위하게 퍼져 있는지를 나타낸다.\"},{\"id\":57,\"question\":\"평균실업기간(average duration of unemployment)과 서비스 CPI의 변화는 어떤 범주의 경제지표이며, 그 이유는 무엇인가?\",\"answer\":\"둘 다 후행지표(lagging indicator)이다. 평균실업기간은 채용/해고 결정이 경기순환보다 늦게 이루어지기 때문에 늦게 반응하며, 서비스 CPI 인플레이션은 경기순환에 늦게 적응하기 때문이다.\"},{\"id\":58,\"question\":\"주간 신규 실업보험 청구건수(average weekly initial claims for unemployment insurance)는 왜 선행지표인가?\",\"answer\":\"이는 기업들의 해고 및 채용 결정을 매우 민감하게 반영하기 때문에 경제의 전환점보다 먼저 빠르게 변화한다.\"},{\"id\":59,\"question\":\"단 하나의 지표에만 의존하여 경기순환의 방향을 판단하는 것이 왜 충분하지 않은가?\",\"answer\":\"어떤 지표든 특정 순환에서는 잘 예측하더라도 다른 시기에는 오류를 낼 수 있기 때문이다. 구조적 변화나 경제의 특수한 상황은 지표와 경제 사이의 상관관계를 바꿀 수 있으므로, 실무에서 분석가들은 여러 선행, 동행, 후행지표를 함께 활용한다.  ---\"}]},{\"id\":\"monetary-fiscal-policy\",\"title\":\"통화정책과 재정정책\",\"cards\":[{\"id\":1,\"question\":\"물물교환 경제(barter economy)는 어떤 단점을 가지고 있는가?\",\"answer\":\"욕구의 이중일치(double coincidence of wants)가 필요하고, 분할할 수 없는 재화는 거래가 어려우며, 일부 재화는 부패하는 특성 때문에 가치를 저장하기 어렵고, 공통의 가치척도(common measure of value)가 없다 — 이것이 물물교환 경제의 주요 단점이다.\"},{\"id\":2,\"question\":\"화폐(money)가 갖추어야 할 다섯 가지 특성은 무엇인가?\",\"answer\":\"(i) 쉽게 받아들여질 것, (ii) 가치가 알려져 있을 것, (iii) 쉽게 분할될 것, (iv) 무게에 비해 가치가 높을 것, (v) 위조하기 어려울 것.\"},{\"id\":3,\"question\":\"화폐는 어떤 세 가지 기본 기능을 수행하는가?\",\"answer\":\"(1) 교환의 매개수단(medium of exchange), (2) 부의 저장수단(store of wealth/value), (3) 가치의 척도 단위(unit of account).\"},{\"id\":4,\"question\":\"부분준비제도(fractional reserve banking)란 무엇인가?\",\"answer\":\"은행이 고객 예금의 일부만을 지급준비금(reserve)으로 보유하고 나머지는 대출해 주는 관행으로, 모든 고객이 동시에 예금을 인출하지 않을 것이라는 가정에 기초한다.\"},{\"id\":5,\"question\":\"지급준비율(reserve requirement)이 10%이고 최초 예금이 €100일 때, 은행 시스템 전체가 창출할 수 있는 총 화폐량은 얼마인가? 공식을 쓰시오.\",\"answer\":\"신규 예금/지급준비율 = €100/0.10 = €1,000 (New deposit/Reserve requirement = €100/0.10 = €1,000).\"},{\"id\":6,\"question\":\"화폐승수(money multiplier)는 어떤 공식으로 결정되는가?\",\"answer\":\"화폐승수 = 1/지급준비율 (money multiplier = 1/reserve requirement, 소수 형태). 지급준비율이 낮을수록 승수는 커진다.\"},{\"id\":7,\"question\":\"협의통화(narrow money)와 광의통화(broad money)의 차이는 무엇인가?\",\"answer\":\"협의통화는 유통 중인 현금과 유동성이 매우 높은 예금을 의미하며, 광의통화는 협의통화를 포함하면서 구매에 사용할 수 있는 모든 유동성 자산을 추가로 포함한다.\"},{\"id\":8,\"question\":\"화폐수량설(quantity theory of money)의 교환방정식(quantity equation of exchange)을 쓰고 각 변수를 설명하시오.\",\"answer\":\"M×V=P×Y, 여기서 M은 화폐량, V는 화폐의 유통속도(velocity of circulation), P는 평균 물가수준, Y는 실질 생산량(real output)이다.\"},{\"id\":9,\"question\":\"화폐의 중립성(money neutrality)이란 무엇인가?\",\"answer\":\"장기적으로 화폐공급의 증가는 전반적인 물가수준(P)만 상승시킬 뿐, 실질 생산량(Y)이나 화폐의 유통속도(V)에는 영향을 미치지 않는다는 이론.\"},{\"id\":10,\"question\":\"피셔효과(Fisher effect)의 공식을 쓰시오.\",\"answer\":\"Rnom = Rreal + πe, 즉 명목이자율(nominal interest rate, Rnom)은 요구되는 실질이자율(real rate, Rreal)과 기대인플레이션(expected inflation, πe)의 합과 같다.\"},{\"id\":11,\"question\":\"화폐수요를 발생시키는 세 가지 주요 이유는 무엇인가?\",\"answer\":\"거래적(transactions-related) 수요, 예비적(precautionary) 수요, 투기적/자산배분(speculative) 수요.  ## 중앙은행의 역할\"},{\"id\":12,\"question\":\"현대 경제에서 중앙은행은 어떤 핵심 역할을 수행하는가?\",\"answer\":\"화폐의 독점적 발행자, 정부와 은행의 은행, 최종대출자(lender of last resort), 지급결제 시스템의 관리자, 통화정책의 수행자, 은행 시스템의 감독자.\"},{\"id\":13,\"question\":\"법정화폐(fiat money)란 무엇인가?\",\"answer\":\"금과 같은 실물 자산으로 교환할 수 없지만 정부의 법령에 의해 법정통화(legal tender)로서 효력을 갖는 화폐.\"},{\"id\":14,\"question\":\"\\\"최종대출자(lender of last resort)\\\"란 무슨 뜻인가?\",\"answer\":\"중앙은행이 화폐를 발행할 권한을 가지고 있기 때문에, 유동성 위기에 처한 은행들에 필요한 유동성(liquidity)을 공급할 수 있다는 뜻.\"},{\"id\":15,\"question\":\"노던록(Northern Rock)의 사례는 무엇을 보여주는가?\",\"answer\":\"2007년 글로벌 유동성 위기로 인해 뱅크런(bank run)이 발생한 사례로, 중앙은행의 지원이 있었음에도 대중의 신뢰 상실만으로는 뱅크런을 막지 못할 수 있음을 보여준다.\"},{\"id\":16,\"question\":\"은행감독(banking supervision)은 항상 중앙은행의 역할에 속하는가?\",\"answer\":\"아니다 — 일부 국가에서는 다른 기관이 담당하며(예: 영국의 FSA), 다른 국가에서는 중앙은행 단독 또는 공동으로 책임을 진다.\"},{\"id\":17,\"question\":\"중앙은행 통화정책의 가장 상위에 있는 목표(overarching objective)는 무엇인가?\",\"answer\":\"물가안정(price stability), 즉 인플레이션의 통제.  ## 통화정책의 목표와 수단\"},{\"id\":18,\"question\":\"예상된 인플레이션(expected inflation)은 어떤 비용을 발생시키는가?\",\"answer\":\"메뉴비용(menu costs — 상품 가격표를 계속 바꾸는 데 드는 비용)과 신발가죽비용(shoe leather costs — 현금을 적게 보유하면서 은행을 자주 오가는 데 드는 비용).\"},{\"id\":19,\"question\":\"예상하지 못한 인플레이션(unexpected inflation)은 어떤 추가적 비용을 발생시키는가?\",\"answer\":\"채무자와 채권자 사이에 부의 불공정한 재분배를 일으키고, 대출 금리에 위험프리미엄(risk premium)이 추가되며, 시장가격의 정보함량(information content)이 떨어진다.\"},{\"id\":20,\"question\":\"중앙은행의 세 가지 핵심 통화정책 수단은 무엇인가?\",\"answer\":\"(1) 공개시장조작(open market operations), (2) 정책금리/재할인율(policy rate), (3) 지급준비율(reserve requirement).\"},{\"id\":21,\"question\":\"공개시장조작(open market operations)이란 무엇이며, 확장적 또는 긴축적 효과를 어떻게 발생시키는가?\",\"answer\":\"중앙은행이 정부채권을 매수 또는 매도하는 활동이다. 채권을 매수하면 상업은행의 준비금이 늘어나 화폐승수 메커니즘을 통해 광의통화가 증가하고, 매도하면 반대로 통화가 축소된다.\"},{\"id\":22,\"question\":\"미국의 연방기금금리(federal funds rate)란 무엇인가?\",\"answer\":\"지급준비금에 대한 은행 간 익일물(overnight) 대출금리로, 연방공개시장위원회(FOMC)가 공개시장조작을 통해 목표 수준으로 유지하고자 하는 금리.\"},{\"id\":23,\"question\":\"리포 거래(repurchase agreement, repo)란 무엇인가?\",\"answer\":\"중앙은행이 은행으로부터 채권을 매입한 뒤 향후 일정 기간(보통 익일물에서 2주 사이) 동안에 되팔기로 하는 계약으로, 은행에 대한 담보대출의 성격을 가지며 중앙은행은 리포금리(repo rate)를 받는다.\"},{\"id\":24,\"question\":\"지급준비율(reserve requirement)을 높이는 것은 어떤 효과를 가지며, 선진국에서는 왜 잘 사용되지 않는가?\",\"answer\":\"지급준비율을 높이면 화폐창조를 제한하여 통화공급을 축소시킨다. 그러나 은행에 지속적인 어려움을 야기하기 때문에 선진국에서는 드물게 사용된다(일부는 더 이상 지급준비율을 적용하지 않는다).\"},{\"id\":25,\"question\":\"통화정책 전달경로(monetary transmission mechanism)의 네 가지 주요 경로를 말하시오.\",\"answer\":\"(1) 은행 대출금리(bank lending rates), (2) 자산가격(asset prices), (3) 경제주체의 기대(expectations), (4) 환율(exchange rate).\"},{\"id\":26,\"question\":\"인플레이션 목표제(inflation targeting)가 성공하기 위한 세 가지 핵심 구성요소는 무엇인가?\",\"answer\":\"중앙은행의 독립성(central bank independence), 신뢰성(credibility), 투명성(transparency).\"},{\"id\":27,\"question\":\"뉴질랜드(New Zealand)는 왜 인플레이션 목표제를 최초로 도입한 국가로 여겨지는가?\",\"answer\":\"1989년 뉴질랜드 중앙은행법(Reserve Bank of New Zealand Act)에 따라 뉴질랜드 중앙은행이 인플레이션을 0–2%의 범위로 유지할 권한과 운영상 독립성(operational independence)을 부여받은 최초의 국가였으며, 이 모델은 이후 널리 모방되었다.\"},{\"id\":28,\"question\":\"목표독립성(target independence)과 운영독립성(operational independence)의 차이는 무엇인가?\",\"answer\":\"목표독립성을 가진 중앙은행(예: ECB)은 인플레이션 목표 자체를 스스로 정한다. 반면 운영독립성만 가진 중앙은행(예: 뉴질랜드, 영국)은 정부가 정한 목표를 달성하기 위한 금리 수준만을 스스로 결정한다.\"},{\"id\":29,\"question\":\"대부분의 선진국 중앙은행은 인플레이션 목표를 0%가 아니라 약 2%로 설정하는 이유는 무엇인가?\",\"answer\":\"0%를 목표로 삼으면 디플레이션(deflation) 위험이 커지기 때문에, 디플레이션으로부터 충분한 여유를 두는 동시에 불안정한 인플레이션 충격도 피하기 위해 약 2%로 설정한다.\"},{\"id\":30,\"question\":\"환율목표제(exchange rate targeting)란 무엇이며, 어떤 장단점이 있는가?\",\"answer\":\"자국 화폐를 주요 통화(예: 미국 달러)에 대해 고정된 수준으로 유지하는 정책목표이다. 이는 저인플레이션 국가의 인플레이션 경험을 \\\"수입\\\"할 수 있게 해주지만, 국내 금리가 환율목표에 종속되면서 국내 경제 여건이 불안정해질 수 있다.\"},{\"id\":31,\"question\":\"신흥국에서 통화정책을 시행하는 데 어려움이 되는 요인들을 말하시오.\",\"answer\":\"충분히 유동성이 있는 정부채권 시장의 부재, 급격한 경제구조 변화로 중립금리(neutral rate)를 파악하기 어려움, 급속한 금융개혁, 인플레이션 통제에 대한 양호한 실적의 부족, 정부가 중앙은행에 진정한 독립성을 부여하기를 꺼림.  ## 긴축적·확장적 통화정책, 중립금리와 그 한계\"},{\"id\":32,\"question\":\"통화정책은 언제 \\\"긴축적(contractionary)\\\"이고 언제 \\\"확장적(expansionary)\\\"이라고 간주되는가?\",\"answer\":\"정책금리가 중립금리(neutral rate)보다 높으면 긴축적 정책으로, 낮으면 확장적 정책으로 간주된다.\"},{\"id\":33,\"question\":\"중립금리(neutral rate)를 결정하는 공식을 쓰시오.\",\"answer\":\"중립금리 = 추세성장률 + 인플레이션 목표 (Neutral rate = Trend growth + Inflation target). 예: 2.5% + 2% = 4.5%.\"},{\"id\":34,\"question\":\"중립정책금리(neutral policy rate)는 어떤 두 가지 요소로 구성되는가?\",\"answer\":\"(1) 경제의 실질 추세성장률(real trend rate of growth), (2) 장기 기대인플레이션(long-run expected inflation).\"},{\"id\":35,\"question\":\"수요충격(demand shock)과 공급충격(supply shock)으로 인한 인플레이션에 대해 중앙은행은 동일한 조치를 취해야 하는가?\",\"answer\":\"아니다. 수요충격으로 인플레이션이 상승한 경우에는 금리를 인상하는 것이 적절하다. 그러나 공급충격(예: 유가 상승)으로 인플레이션이 상승한 경우에는 금리 인상이 경기침체를 더욱 악화시킬 수 있다.\"},{\"id\":36,\"question\":\"채권시장의 \\\"자경단(bond market vigilantes)\\\"이란 누구를 말하는가?\",\"answer\":\"중앙은행이 인플레이션 통제력을 잃고 있다고 판단될 때 장기채권에 대한 수요를 줄여 수익률(yield)을 끌어올리는 채권시장 참가자들로, 이러한 행동은 느슨한 통화정책에 \\\"재갈\\\"을 물리는 효과를 가진다.\"},{\"id\":37,\"question\":\"유동성함정(liquidity trap)이란 무엇인가?\",\"answer\":\"화폐수요곡선이 완전히 수평(infinitely elastic)이 되어, 금리 변화 없이도 사람들이 추가적인 화폐를 기꺼이 보유하는 현상이다. 이 상황에서는 화폐를 추가로 공급해도 금리를 낮추거나 실물경제에 영향을 미치지 못해 통화정책이 효과를 잃는다.\"},{\"id\":38,\"question\":\"디플레이션(deflation)은 왜 전통적인 통화정책으로 해결하기 어려운가?\",\"answer\":\"명목이자율을 0 이하로 크게 낮추기가 어렵고(제로금리하한, zero lower bound), 디플레이션이 대출의 실질 가치를 높여 소비자들이 소비를 미루게 함으로써 디플레이션 상황을 더욱 악화시키기 때문이다.\"},{\"id\":39,\"question\":\"양적완화(quantitative easing, QE)란 무엇인가?\",\"answer\":\"중앙은행이 새로 화폐를 \\\"발행\\\"하여 정부 또는 민간부문의 자산(채권, 모기지채권 등)을 대규모로 매입하는 것으로, 전통적인 공개시장조작과 성격은 같지만 규모가 훨씬 크다는 점에서 \\\"비전통적(unconventional)\\\" 통화정책으로 분류된다.\"},{\"id\":40,\"question\":\"통화정책의 한계(limitations of monetary policy)의 주된 원인은 무엇인가?\",\"answer\":\"중앙은행은 가계와 기업이 은행에 얼마나 많은 돈을 예치할지, 그리고 은행이 얼마나 대출하려 하는지를 직접 통제할 수 없기 때문에 통화공급을 완전히 통제할 수 없다.\"},{\"id\":41,\"question\":\"일본의 사례(Example 11)는 통화정책의 어떤 한계를 보여주는가?\",\"answer\":\"1990년대 이후 일본이 정책금리를 0까지 낮추고 양적완화(QE)를 시행했음에도 디플레이션을 지속적으로 해소하지 못했다는 사실은, 아무리 많은 화폐를 \\\"발행\\\"하더라도 통화정책이 항상 효과적이지는 않을 수 있음을 보여준다.  ## 재정정책의 역할과 목표\"},{\"id\":42,\"question\":\"재정정책(fiscal policy)은 어떤 세 가지 핵심 영역에 영향을 미치는가?\",\"answer\":\"(1) 경제 전체의 총수요(aggregate demand), (2) 소득과 부의 분배, (3) 부문 간 자원배분.\"},{\"id\":43,\"question\":\"케인스주의자(Keynesians)와 통화주의자(monetarists)는 재정정책의 효과를 어떻게 다르게 보는가?\",\"answer\":\"케인스주의자는 경제에 유휴설비가 있을 때 재정정책이 총수요, 생산, 고용에 강력한 영향을 미친다고 본다. 반면 통화주의자는 재정정책의 변화가 일시적인 효과만 있을 뿐이며 통화정책이 더 효과적이라고 본다.\"},{\"id\":44,\"question\":\"재정흑자/적자(budget surplus/deficit)란 무엇인가?\",\"answer\":\"정부의 수입(세금)과 지출 사이의 차이로, 수입이 지출보다 크면 흑자(surplus), 지출이 수입보다 크면 적자(deficit)라고 한다.\"},{\"id\":45,\"question\":\"자동안정화장치(automatic stabilizer)란 무엇인가? 예를 들어 설명하시오.\",\"answer\":\"정책결정자의 별도 개입 없이 경기순환에 반응하여 작동하는 메커니즘이다. 예를 들어 경기침체기에는 실업급여가 자동으로 늘어나 총수요에 기여하고, 경기호황기에는 누진소득세가 자동으로 늘어나 재정흑자를 증가시킨다.\"},{\"id\":46,\"question\":\"자동안정화장치(automatic stabilizer)와 재량적 재정정책(discretionary fiscal policy)의 차이는 무엇인가?\",\"answer\":\"자동안정화장치는 정책결정자의 직접적인 개입 없이 경기순환에 자동으로 반응한다. 반면 재량적 재정정책은 목표로 하는 총수요를 안정화하기 위해 의도적으로 시행하는 조세·지출 변경이다.\"},{\"id\":47,\"question\":\"정부부채(government/national debt)란 무엇인가?\",\"answer\":\"시간이 지나면서 누적된 재정적자의 총합.  ## 재정정책 수단과 집행\"},{\"id\":48,\"question\":\"정부지출의 세 가지 주요 유형을 말하시오.\",\"answer\":\"(1) 이전지출(transfer payments — 연금, 급여 등), (2) 경상지출(current government spending — 의료, 교육 등 정기적으로 제공되는 서비스), (3) 자본지출(capital expenditure — 인프라).\"},{\"id\":49,\"question\":\"이전지출(transfer payments)은 왜 GDP에 포함되지 않는가?\",\"answer\":\"이전지출은 생산요소(factor of production)가 실제 경제활동에 기여한 것에 대한 보상이 아니라, 단지 소득을 재분배하는 수단일 뿐이기 때문이다.\"},{\"id\":50,\"question\":\"직접세(direct taxes)와 간접세(indirect taxes)의 차이는 무엇인가? 각각 예를 드시오.\",\"answer\":\"직접세는 소득, 부, 법인이윤에 부과된다(예: 자본이득세, 법인세). 간접세는 재화와 서비스에 대한 지출에 부과된다(예: 소비세, 부가가치세/VAT).\"},{\"id\":51,\"question\":\"조세정책의 네 가지 목표 특성을 말하시오.\",\"answer\":\"(1) 단순성(simplicity), (2) 효율성(efficiency), (3) 공정성(fairness — 수평적·수직적 공정성), (4) 충분한 세입(revenue sufficiency).\"},{\"id\":52,\"question\":\"\\\"수평적 공정성(horizontal equity)\\\"과 \\\"수직적 공정성(vertical equity)\\\"의 차이는 무엇인가?\",\"answer\":\"수평적 공정성 — 동일한 상황에 있는 사람은 동일한 세금을 내야 한다. 수직적 공정성 — 더 부유한 사람이 더 많은 세금을 내야 한다(누진세, progressive tax).\"},{\"id\":53,\"question\":\"간접세(indirect taxes)와 자본지출(capital spending) 중 어느 쪽이 더 신속하게 조정될 수 있는가? 그 이유는?\",\"answer\":\"간접세(예: 소비세)는 발표 즉시 거의 바로 시행될 수 있다. 반면 자본지출은 계획, 승인, 집행에 수년이 걸리기 때문에 시차가 매우 크다.\"},{\"id\":54,\"question\":\"재정승수(fiscal multiplier)의 공식을 쓰고 예를 들어 계산해 보시오.\",\"answer\":\"재정승수 = 1/[1 – c(1 – t)], 여기서 c는 한계소비성향(marginal propensity to consume, MPC), t는 세율이다. 예: t=20%, c=90%일 때 승수 = 1/[1 – 0.9(1 – 0.2)] = 1/0.28 = 3.57.\"},{\"id\":55,\"question\":\"한계소비성향(MPC)과 한계저축성향(MPS) 사이의 관계를 쓰시오.\",\"answer\":\"c + s = 1, 즉 MPC + MPS = 1 (예: MPC=0.9이면 MPS=0.1).\"},{\"id\":56,\"question\":\"균형재정승수(balanced budget multiplier)는 어떤 값을 가지는가?\",\"answer\":\"항상 1이다 — 정부가 지출을 세금과 동일한 금액만큼 늘리면 생산이 증가하는데, 이는 MPC가 1보다 작아 세금 증가로 소비가 완전히 줄어들지는 않기 때문이다.\"},{\"id\":57,\"question\":\"리카도 등가(Ricardian equivalence)란 무엇인가?\",\"answer\":\"정부가 세금을 줄이고 그 대신 차입으로 재원을 조달하면, 국민들은 미래에 세금이 오를 것을 예상하여 소비를 늘리지 않고 오히려 저축을 늘린다는 이론(경제학자 데이비드 리카도의 이름을 딴 것).\"},{\"id\":58,\"question\":\"구조적 또는 경기조정 재정적자(structural / cyclically adjusted budget deficit)란 무엇인가?\",\"answer\":\"경제가 완전고용(full employment) 수준에 있었다면 존재했을 재정적자로, 실제 재정적자보다 재정정책의 방향(fiscal stance)을 더 정확하게 나타내는 지표로 평가된다.\"},{\"id\":59,\"question\":\"재정정책을 시행하는 데 있어 발생하는 세 가지 시차(policy lags)는 무엇인가?\",\"answer\":\"(1) 인식시차(recognition lag — 경제상황을 인식하는 데 걸리는 시간), (2) 행동시차(action lag — 정책이 시행되는 데 걸리는 시간), (3) 효과시차(impact lag — 효과가 나타나는 데 걸리는 시간).\"},{\"id\":60,\"question\":\"\\\"구축효과(crowding out)\\\"란 무엇인가?\",\"answer\":\"정부의 차입이 한정된 저축풀에서 자금을 끌어다 씀으로써 민간부문의 투자에 쓰일 자금을 \\\"밀어내는\\\" 현상으로, 이는 금리를 상승시키고 민간투자를 감소시킨다.  ## 통화정책과 재정정책의 관계\"},{\"id\":61,\"question\":\"완화적 재정정책/긴축적 통화정책(easy fiscal / tight monetary) 조합의 효과는 무엇인가?\",\"answer\":\"생산은 증가하지만 금리가 상승하여 민간부문 수요에 부정적인 영향을 미친다. 정부부문이 전체 소득에서 차지하는 비중은 늘어난다.\"},{\"id\":62,\"question\":\"완화적 통화정책/완화적 재정정책(easy monetary / easy fiscal) 조합의 효과는 무엇인가?\",\"answer\":\"두 정책이 모두 완화적이면 종합적인 효과는 강력한 확장적 성격을 띠게 되어 총수요가 증가하고, (통화 효과가 지배적인 경우) 금리는 하락하며, 민간부문과 공공부문 모두 성장한다.\"},{\"id\":63,\"question\":\"IMF 연구에 따르면 통화적 수용(monetary accommodation)이 없는 경우, 어떤 재정수단이 총GDP에 가장 큰 영향을 미치는가?\",\"answer\":\"정부의 직접 지출(government spending)이 목표성이 없는 사회적 이전지출(social transfers)보다 여섯 배 더 큰 효과를 가지는데, 이는 국민들이 이전지출을 일시적인 것으로 여기기 때문이다.\"},{\"id\":64,\"question\":\"양적완화(QE)는 왜 통화정책의 독립성(independence)을 위협할 수 있는가?\",\"answer\":\"중앙은행이 정부채권을 대규모로 매입하는 것은 사실상 재정적자를 화폐화(monetization of government deficit)하여 자금을 조달해 주는 것과 다름없어, 통화정책의 독립성이 명목상에 불과해질 수 있다.\"},{\"id\":65,\"question\":\"신뢰성과 공약(credibility and commitment)은 왜 재정정책에서 중요한가?\",\"answer\":\"국민들이 정부의 높은 수준의 재정적자가 지속될 것이라고 생각하면, 인플레이션 기대와 장기금리가 상승하여 재정부양책의 효과를 절반 정도로 줄일 수 있다.  ---\"}]},{\"id\":\"international-trade\",\"title\":\"국제무역과 자본이동\",\"cards\":[{\"id\":1,\"question\":\"국내총생산(GDP)과 국민총생산(GNP)은 어떻게 다른가?\",\"answer\":\"GDP는 한 국가의 영토 내에서 생산된 모든 최종 재화와 서비스의 시장가치를 측정하는 반면, GNP는 그 국가 국민(또는 그들이 소유한 생산요소)이 어디서 생산했는지와 관계없이 생산한 재화의 가치를 측정한다. GDP는 국내에 있는 외국인의 생산을 포함하지만 GNP는 이를 제외하고 해외에 있는 자국민의 생산을 포함한다. 경제활동과 고용을 측정할 때는 GDP가 더 널리 사용된다.\"},{\"id\":2,\"question\":\"수입(import)과 수출(export)이란 무엇인가? 서비스는 어떻게 수입/수출로 분류되는가?\",\"answer\":\"수입은 국내 경제주체(가계, 기업, 정부)가 외국에서 구매한 재화와 서비스이며, 수출은 국내 경제에서 해외로 판매된 재화와 서비스이다. 서비스도 동일하게 분류된다. 예를 들어 그리스의 운송회사가 프랑스산 와인을 미국으로 운송한다면, 이는 미국이 그리스로부터 수입한 서비스로 계산된다.\"},{\"id\":3,\"question\":\"무역조건(terms of trade)이란 무엇이며 어떻게 결정되는가?\",\"answer\":\"무역조건은 수출가격지수를 수입가격지수로 나눈 비율(수출가격 ÷ 수입가격)로, 한 단위의 수출로 몇 단위의 수입을 구매할 수 있는지를 나타낸다. 수출가격이 수입가격보다 더 크게 상승하면 무역조건이 개선(improved)되었다고 보는데, 이는 같은 양의 수출로 더 많은 수입을 구매할 수 있기 때문이다. 반대의 경우는 악화(deteriorated)되었다고 한다.\"},{\"id\":4,\"question\":\"순수출(net exports), 무역흑자/적자(trade surplus/deficit)란 무엇이며, 이는 한 국가를 해외와 어떻게 연결하는가?\",\"answer\":\"순수출은 수출 금액에서 수입 금액을 뺀 값이다. 수출과 수입이 같으면 무역이 균형 상태이고, 수출이 더 많으면 무역흑자(surplus), 수입이 더 많으면 무역적자(deficit)라고 한다. 무역흑자국은 외국에 대출을 해주고 자산을 매입하는 반면, 무역적자국은 외국에서 자금을 빌리거나 자산을 매각해야 한다.\"},{\"id\":5,\"question\":\"자급자족경제(autarky), 폐쇄경제(closed economy), 개방경제(open economy), 세계가격(world price)이라는 개념을 설명하라.\",\"answer\":\"자급자족경제(폐쇄경제)란 한 국가가 다른 국가와 무역을 하지 않고 모든 재화와 서비스를 국내에서 생산하고 소비하는 상태를 말하며, 이때의 가격을 자급자족가격(autarkic price)이라 한다. 개방경제는 다른 국가와 무역을 하는 경제로서, 무역 제한이 없는 경우 참가국들은 세계시장에서 형성된 세계가격(world price)으로 재화와 서비스를 사고팔 수 있다.\"},{\"id\":6,\"question\":\"자유무역(free trade)과 무역보호(trade protection)를 어떻게 구분하는가?\",\"answer\":\"자유무역이란 한 국가의 무역 능력에 정부의 제한이 없는 상태로, 수요와 공급(세계 총수요·총공급)이 수입과 수출의 균형가격과 거래량을 결정한다. 관세(tariff), 수입할당(import quota) 등의 제한을 두는 정부 정책을 무역보호(trade protection)라고 하며, 이는 시장 메커니즘의 작용을 제약한다.\"},{\"id\":7,\"question\":\"세계화(globalization)란 무엇을 의미하는가?\",\"answer\":\"세계화란 재화, 서비스, 자본 시장이 전 세계적으로 통합되는 과정의 증가를 의미하며, 여기에는 다국적기업(multinational corporations)의 역할 증대, IMF, WTO, 세계은행(World Bank) 같은 국제기구가 각국의 국내정책에 대한 개입을 늘리는 현상 등도 포함된다.\"},{\"id\":8,\"question\":\"해외직접투자(foreign direct investment, FDI)와 해외간접투자(foreign portfolio investment, FPI)는 어떻게 다른가?\",\"answer\":\"FDI는 한 국가(모국)의 기업이 외국(현지국)의 생산자산에 직접 투자하는 것으로, 그 결과 해당 기업은 다국적기업(MNC)이 된다. FPI는 개인, 기업, 기관투자자(연금기금 등)가 외국의 주식, 정부채권 등 금융상품에 하는 단기적인 투자이다.\"},{\"id\":9,\"question\":\"절대우위(absolute advantage)란 무엇인가?\",\"answer\":\"한 국가가 특정 재화(또는 서비스)를 무역 상대국보다 더 적은 비용으로, 또는 더 적은 자원을 사용하여 생산할 수 있는 능력을 가지고 있다면 그 재화에 절대우위를 보유하고 있다고 한다.\"},{\"id\":10,\
