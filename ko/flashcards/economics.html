"question\":\"비교우위(comparative advantage)란 무엇이며, 기회비용(opportunity cost)과 어떻게 연관되는가?\",\"answer\":\"한 국가가 특정 재화를 생산하는 데 드는 기회비용이 무역 상대국보다 낮다면 그 재화에 비교우위를 보유하고 있다고 한다. 기회비용이란 한 단위를 추가로 생산하기 위해 포기해야 하는 다른 재화의 양(즉, 포기한 기회)을 의미한다.\"},{\"id\":11,\"question\":\"브라질의 노동자는 하루에 볼펜 20개 또는 연필 40개를 생산할 수 있고, 베트남의 노동자는 하루에 볼펜 10개 또는 연필 60개를 생산할 수 있다. 누가 볼펜에 비교우위를 가지는가?\",\"answer\":\"베트남의 볼펜 기회비용은 연필 6개(60÷10)이고, 브라질은 연필 2개(40÷20)이다. 브라질의 기회비용이 더 낮으므로 브라질이 볼펜에 비교우위를 가진다. 연필의 경우 베트남의 기회비용은 볼펜 1/6개, 브라질은 볼펜 1/2개이므로 베트남이 연필에 비교우위를 가진다. 브라질이 두 재화 모두에서 절대우위가 없더라도 비교우위 덕분에 무역을 통해 이익을 얻을 수 있다.\"},{\"id\":12,\"question\":\"영국은 노동자 1인당 하루에 기계 4대 또는 직물 8야드를, 인도는 기계 2대 또는 직물 16야드를 생산할 수 있다. 누가 어느 재화에 절대우위와 비교우위를 가지는가?\",\"answer\":\"영국은 기계에, 인도는 직물에 절대우위를 가진다(노동자당 생산량이 더 많다). 기계의 기회비용은 영국이 직물 2야드(8÷4), 인도가 직물 8야드(16÷2)이므로 영국이 기계에 비교우위를 가진다. 직물의 기회비용은 영국이 기계 1/2대, 인도가 기계 1/8대이므로 인도가 직물에 비교우위를 가진다.\"},{\"id\":13,\"question\":\"두 국가가 무역을 통해 모두 이익을 얻기 위해서는 세계가격(world price)이 어떤 범위에 있어야 하는가?\",\"answer\":\"세계가격은 두 무역 상대국의 자급자족가격 사이에 있어야 한다. 예를 들어 영국-인도의 기계 사례에서는 자급자족가격이 2~8야드의 직물(즉 기계 1대 = 직물 2~8야드) 사이에 있으면 두 국가 모두 무역에서 이익을 얻는다. 세계가격이 한 국가의 자급자족가격에서 더 크게 벗어날수록 그 국가는 무역에서 더 큰 이익을 얻는다.\"},{\"id\":14,\"question\":\"리카도 모형(Ricardian model)에서 비교우위의 원천은 무엇인가?\",\"answer\":\"리카도 모형에서는 노동이 유일한(가변) 생산요소이며, 국가 간 기술 차이에서 비롯된 노동생산성의 차이가 비교우위의 원천이다. 기회비용이 더 낮은 국가가 해당 재화에 비교우위를 가지며 그 재화에 특화한다.\"},{\"id\":15,\"question\":\"헥셰르-올린 모형(Heckscher–Ohlin model, 요소비율이론)에서 비교우위의 원천은 무엇인가?\",\"answer\":\"헥셰르-올린 모형(요소비율이론)에서는 노동과 자본 모두 가변 생산요소이며, 국가 간 생산요소의 상대적 보유량(factor endowment) 차이가 비교우위의 원천이다. 한 국가는 상대적으로 풍부한 생산요소를 집약적으로 사용하는 재화에 비교우위를 가진다(예: 자본이 풍부한 국가는 자본집약적 재화를 수출한다).\"},{\"id\":16,\"question\":\"헥셰르-올린 모형에서 무역이 개방되면 한 국가의 국내 소득 분배에는 어떤 영향을 미치는가?\",\"answer\":\"무역이 개방되면 풍부한 생산요소에는 유리하고 희소한 생산요소에는 불리한 영향을 미치는데, 이는 수출재의 가격이 상승하고 수입재의 가격이 하락함에 따라 해당 재화에 집약적으로 사용되는 생산요소에 대한 파생수요(derived demand)가 변화하기 때문이다. 이론적으로 시장이 동질적인 재화, 동질적인 생산요소, 동일한 기술을 가진다면 자유무역은 국가 간 생산요소 가격을 균등화한다(요소가격균등화, factor price equalization)지만, 실제로는 완전한 동질성이 부족하여 그 정도가 달라진다.  ## 국제무역의 이익과 비용\"},{\"id\":17,\"question\":\"\\\"교환으로부터의 이익\\\"(gains from exchange)이란 무엇을 의미하는가?\",\"answer\":\"무역은 한 국가가 수출품에 더 높은 가격을 받고 수입품에 더 낮은 가격을 지불할 수 있게 해주는데, 이것이 교환으로부터의 이익이다. 이는 수출재의 생산을 늘리고 수입재의 생산을 줄여 자원배분을 더 효율적으로 만들며, 개별 소비자/생산자 모두가 더 나아지는 것은 아니지만 승자가 패자를 보상하면 모두가 더 나아질 수 있다.\"},{\"id\":18,\"question\":\"무역의 주요 이익을 열거하라.\",\"answer\":\"(1) 교환과 특화로부터의 이익(비교우위에 기반); (2) 산업의 규모의 경제(economies of scale) 증대; (3) 가계와 기업이 선택할 수 있는 제품 다양성 증가; (4) 경쟁 심화; (5) 더 효율적인 자원배분.\"},{\"id\":19,\"question\":\"산업내무역(intra-industry trade)이란 무엇이며, 독점적 경쟁(monopolistically competitive) 모형과 어떤 관련이 있는가?\",\"answer\":\"한 국가가 동일한 제품 분류에 속하는 재화를 수출하면서 동시에 수입하는 경우를 산업내무역이라 한다(예: EU 내에서 자동차를 서로 수출·수입). 독점적 경쟁 모형에서는 국가들이 서로 유사하더라도 각자 다른 변형(variant)에 특화하여 다른 변형을 수입하며, 소비자는 더 다양한 제품군에서 이익을 얻고 기업은 시장 규모 확대로 평균비용이 낮아진다.\"},{\"id\":20,\"question\":\"\\\"Learning by doing\\\"과 지식전파(knowledge spillovers)는 무역을 통해 경제성장에 어떻게 영향을 미치는가?\",\"answer\":\"\\\"Learning by doing\\\"이란 반도체와 같은 산업에서 생산이 증가할수록 경험이 축적되어 단위 생산비용이 낮아지는 현상이다. 지식전파란 지식을 창출하기 위한 투자가 그것을 수행한 조직뿐 아니라 다른 기업과 조직의 학습과 혁신에도 이익을 가져다주는 현상을 말한다. Coe와 Helpman(1995)의 연구에 따르면 G-7 국가의 R\u0026D 투자 이익 중 약 4분의 1이 무역 상대국들에 배분된다.\"},{\"id\":21,\"question\":\"자유무역 반대자들은 어떤 비용을 강조하는가?\",\"answer\":\"그들은 소득불평등 심화와, 수입 경쟁에서 밀린 선진국 산업에서의 일자리 상실 위험을 강조한다. 무역이 자유화되면 자원(투자)이 수출산업으로 이동하고 수입경쟁산업에서는 퇴출되어야 하며, 비효율적인 기업이 시장에서 사라지고 일시적으로 실업이 늘어나며, 실직한 노동자들을 재교육해야 할 필요가 생긴다.\"},{\"id\":22,\"question\":\"\\\"무역으로부터의 이익\\\"(gains from trade)이라는 표현의 의미는 무엇인가?\",\"answer\":\"무역으로부터의 이익은 무역의 총이익이 무역의 손실(비용)을 초과한다는 의미이다. 이는 모든 참여자(생산자, 소비자, 정부)가 동등하게(또는 전혀 손해 없이) 이익을 얻는다는 뜻이 아니라, 단지 전체 이익이 손실보다 크다는 의미이며, 이론적으로 승자가 패자에게 보상하면 모두가 더 나아질 수 있다.  ## 무역 및 자본이동 제한\"},{\"id\":23,\"question\":\"관세(tariff)란 무엇이며, 그 주된 목적은 무엇인가?\",\"answer\":\"관세는 정부가 수입품에 부과하는 세금이다. 그 주된 목적은 동일한 재화를 생산하는 국내 산업을 보호하여, 수입품의 가격을 자유무역 가격보다 높여 수입 수요를 줄이는 것이며, 때로는 무역적자를 줄이려는 목적도 있을 수 있다.\"},{\"id\":24,\"question\":\"무역정책 관점에서 \\\"소국\\\"(small country)과 \\\"대국\\\"(large country)이라는 분류는 어떻게 구분하는가?\",\"answer\":\"규모, 인구, GDP와 무관하게, \\\"소국\\\"이란 세계시장에서 해당 재화의 가격에 영향을 줄 수 없는 가격수용자(price taker)인 국가를 말한다(예: 브라질은 자동차 시장에서 소국이다). \\\"대국\\\"은 해당 재화의 주요 수입국이며 세계시장 가격에 영향을 줄 수 있는 국가이다. 대국이 관세를 부과하면 수출국이 자국의 시장점유율을 잃지 않기 위해 가격을 낮추려 하므로, 이는 무역조건(terms of trade)을 변화시켜 소득을 수출국에서 수입국으로 재분배한다.\"},{\"id\":25,\"question\":\"수입국에 대한 관세(또는 할당)의 경제적 영향은 어떻게 요약할 수 있는가?\",\"answer\":\"소비자잉여: –(A + B + C + D); 생산자잉여: +A; 관세수입(또는 할당 렌트): +C; 국민후생(national welfare): –B – D. 소비자잉여의 손실이 생산자잉여와 정부수입의 합보다 크므로 순후생손실(deadweight loss) B + D가 발생한다.\"},{\"id\":26,\"question\":\"남아프리카공화국의 파이프용지 연간 국내 생산량이 110,000톤, 국내 수요가 200,000톤, 세계가격이 $5/톤이었다. 20%의 관세를 부과하자 가격이 $6이 되고 국내 생산량이 130,000톤, 수요가 170,000톤이 되었다. 소비자잉여의 손실은 얼마인가?\",\"answer\":\"소비자잉여의 손실 = $1 × 170,000 + 1/2 × $1 × 30,000 = $185,000(이는 A + B + C + D 영역을 나타낸다). 생산자잉여의 증가 = $1 × 110,000 + 1/2 × ($1 × 20,000) = $120,000(A 영역). 정부수입의 증가 = $1 × 40,000 = $40,000(C 영역). 순후생손실(deadweight loss) = 1/2 × $1 × 20,000 + 1/2 × $1 × 30,000 = $25,000(B + D 영역).\"},{\"id\":27,\"question\":\"할당(import quota)이란 무엇이며, 관세와 어떻게 다른가?\",\"answer\":\"할당이란 특정 기간 동안 수입할 수 있는 재화의 수량을 제한하는 제도이다. 관세와의 가장 큰 차이점은, 정부가 관세수입을 거둘 수 있는 반면 할당의 경우에는 외국 생산자가 흔히 가격을 올려 할당렌트(quota rent)라 불리는 추가 이익을 얻게 되는데, 이를 수입국이 가져갈 수도 있고(라이선스 경매를 통해) 정부가 가져갈 수도 있다는 점이다.\"},{\"id\":28,\"question\":\"자율수출규제(voluntary export restraint, VER)란 무엇이며, 수입할당과 어떻게 다른가?\",\"answer\":\"VER이란 수출국이 자발적으로 특정 수량으로 수출을 제한하기로 합의한 무역제한조치이다. 수입할당과의 주된 차이는 할당의 출처(누가 부과하는가)에 있다. 할당은 수입국이 부과하지만 VER은 수출국이 부과한다. VER의 경우 할당렌트 전체가 수출국(또는 수출기업)에게 돌아가므로 수입국에는 더 큰 후생손실이 발생한다.\"},{\"id\":29,\"question\":\"수출보조금(export subsidy)이란 무엇이며, 순후생에 어떤 영향을 미치는가? 상계관세(countervailing duty)란 무엇인가?\",\"answer\":\"수출보조금은 정부가 기업이 재화를 한 단위 수출할 때마다 지급하는 보조금으로, 수출을 촉진하기 위한 목적이지만 자유시장의 작동을 방해하고 비교우위에서 왜곡된 무역을 발생시켜 후생을 감소시킨다. 상계관세는 수입국이 보조금을 받은 수출품에 부과하는 관세이다.\"},{\"id\":30,\"question\":\"관세, 할당, 수출보조금, VER 네 가지가 국가후생에 미치는 영향을 요약하여 비교하라.\",\"answer\":\"네 가지는 거의 동일한 효과를 가진다. 가격이 상승하고(보조금의 경우 수출국의 국내가격), 국내소비가 감소하며, 국내생산이 증가하고, 무역이 감소한다(수입이 감소하며, 보조금의 경우는 수출이 증가한다). 국민후생은 소국의 경우 모두 감소하지만, 대국의 경우 관세와 (이론적으로는) 할당은 후생을 증가시킬 수도 있다. 정부수입은 관세로는 증가하고, 할당은 불분명하며(누가 렌트를 가져가는가에 따라 다름), 보조금으로는 감소하고(정부지출 증가), VER로는 변화가 없다(렌트가 외국으로 돌아간다).\"},{\"id\":31,\"question\":\"자본제한(capital restriction)이란 무엇이며, 무역제한과 어떻게 다른가?\",\"answer\":\"자본제한이란 외국인이 국내자산을 보유하거나 국내인이 해외자산을 보유하는 능력에 대한 통제를 말한다. 무역제한은 재화·서비스 시장의 개방성을 제한하지만, 자본제한은 금융시장의 개방성을 제한한다.\"},{\"id\":32,\"question\":\"자본제한은 어떤 형태로 시행될 수 있는가?\",\"answer\":\"세금(예: 해외투자소득에 대한 특별세), 가격·수량 통제(예: 외국자본을 국내은행에 예치할 때 일정 비율을 중앙은행에 예치해야 하는 지급준비요건), 직접 금지(비거주자 대출에 대한 제한이나 한도), 또는 행정적 통제(특정 자산거래를 정부기관의 승인을 받도록 요구) 등의 형태를 취할 수 있다.\"},{\"id\":33,\"question\":\"말레이시아는 1998년에 어떤 이유로, 어떤 목적으로 자본제한을 도입했는가?\",\"answer\":\"태국의 바트(baht)가 미달러에 대한 고정환율을 포기한 데서 비롯된 동남아시아 금융위기 당시, 말레이시아는 단기자본의 대규모 유출에 직면했다. 1998년 9월 1일 말레이시아는 국내-해외 계좌 간 이전을 금지하고, 링깃(ringgit)의 환율을 미달러 대비 3.8로 고정하며, 자본의 본국 재진입을 제한하여 통화정책의 독자성을 회복하고 금리를 낮추고자 했다. 그 결과 경제는 안정되었으나 MSCI 선진시장지수에서 제외되는 등 장기적인 비용을 치렀다.\"},{\"id\":34,\"question\":\"무역블록(trading bloc) 또는 지역무역협정(regional trade agreement, RTA)이란 무엇인가?\",\"answer\":\"무역블록이란 회원국 간의 무역과 생산요소 이동에 대한 장벽을 단계적으로 줄이거나 철폐하기로 협정을 체결한 국가들의 집단으로, 비회원국에 대한 공동 무역제한을 둘 수도 있고 두지 않을 수도 있다.\"},{\"id\":35,\"question\":\"자유무역지역(free trade area, FTA)이란 무엇인가?\",\"answer\":\"FTA란 회원국 간 재화와 서비스의 흐름에 대한 모든 장벽을 철폐한, 지역통합의 가장 흔한 형태 중 하나이다. 다만 각국은 비회원국에 대해서는 자국의 무역정책을 그대로 유지한다(예: NAFTA).\"},{\"id\":36,\"question\":\"관세동맹(customs union)이란 무엇인가?\",\"answer\":\"관세동맹은 FTA를 확장하여 회원국 간 재화와 서비스의 자유로운 이동을 허용하는 데 더해 비회원국에 대한 공동 무역정책을 수립하는 것이다(예: 1947년 벨기에-네덜란드-룩셈부르크(Benelux) 관세동맹).\"},{\"id\":37,\"question\":\"공동시장(common market)이란 무엇인가?\",\"answer\":\"공동시장은 관세동맹의 모든 특징을 포함하면서 회원국 간 생산요소(노동, 자본)의 자유로운 이동까지 허용하는 경제통합의 다음 단계이다(예: MERCOSUR).\"},{\"id\":38,\"question\":\"경제동맹(economic union)과 통화동맹(monetary union)을 설명하라.\",\"answer\":\"경제동맹은 공동시장의 모든 특징을 포함하면서 공동 경제제도와 정책조율을 추가로 요구한다(예: 1993년 이후의 유럽연합(EU)). 회원국들이 공동 화폐를 도입하면(예: 유로를 도입한 EU 19개 회원국) 이는 동시에 통화동맹이 된다.\"},{\"id\":39,\"question\":\"무역창출(trade creation)과 무역전환(trade diversion)의 차이를 설명하라.\",\"answer\":\"무역창출이란 지역통합의 결과로 비용이 높은 국내생산이 회원국의 더 저렴한 수입으로 대체되는 것으로, 자원배분을 더 효율적으로 만든다. 무역전환이란 관세로 인해 비회원국의 저비용 수입이 회원국의 고비용 수입으로 대체되는 것으로, 자원배분을 덜 효율적으로 만들 수 있다. 무역창출 효과가 무역전환 효과보다 크면 전체 후생 효과는 긍정적이다.  ## 국제수지 계정과 복식부기\"},{\"id\":40,\"question\":\"국제수지(balance of payments, BOP)란 무엇인가?\",\"answer\":\"국제수지는 특정 기간(보통 분기 또는 연간) 동안 한 국가가 세계 다른 나라들과 수행한 경제적 거래를 요약한 복식부기 회계시스템(double-entry bookkeeping system)이다. BOP는 수출·수입 대금뿐 아니라 금융거래와 금융이전도 포함한다.\"},{\"id\":41,\"question\":\"BOP에서 차변(debit)과 대변(credit) 기록은 거래의 어떤 측면을 나타내는가?\",\"answer\":\"차변에는 수입재화의 대가, 해외 금융자산의 매입, 수출로부터 받은 대금, 채무자(debtor)로부터 받은 지급액이 기록되는데, 이는 자산의 증가 또는 부채의 감소를 의미한다. 대변에는 수입재화에 대한 지급, 매입한 해외자산에 대한 대금지급, 채권자(creditors)에게 한 지급액이 기록되며, 이는 자산의 감소 또는 부채의 증가를 의미한다. 이론적으로 모든 차변의 합은 모든 대변의 합과 같아야 하며, 전체 순합계는 0이어야 한다.\"},{\"id\":42,\"question\":\"경상계정(current account)은 어떤 하위계정으로 나뉘는가?\",\"answer\":\"경상계정은 네 개의 하위계정으로 구성된다: (1) 상품무역(merchandise trade) — 매입, 판매 또는 증여된 모든 원자재와 제조품; (2) 서비스(services) — 관광, 운송, 엔지니어링, 자문서비스 등; (3) 소득수취(income receipts) — 자산 소유로부터 얻는 배당, 이자 등의 소득; (4) 단방향이전(unilateral transfers) — 해외 근로자의 본국 송금, 해외 정부원조, 증여 등의 일방향 이전.\"},{\"id\":43,\"question\":\"자본계정(capital account)은 어떤 하위계정으로 나뉘는가?\",\"answer\":\"자본계정은 두 개의 하위계정으로 구성된다: (1) 자본이전(capital transfers) — 채무면제(debt forgiveness), 이주자 이전(이주자가 입출국 시 가지고 가는 재화·금융자산), 증여/상속세 등; (2) 비생산·비금융자산의 매매(예: 천연자원권, 특허권, 저작권 등 무형자산의 거래).\"},{\"id\":44,\"question\":\"금융계정(financial account)은 어떤 하위계정으로 나뉘는가?\",\"answer\":\"금융계정은 두 개의 하위계정으로 구성된다: (1) 해외자산(assets abroad) — 다시 공적준비자산(official reserve assets), 정부자산, 민간자산으로 나뉜다(금, 외화, 외국증권, IMF 내 준비금 포지션, 직접투자 등); (2) 보고국 내 외국인 소유 자산 — 공적자산과 기타 외국자산으로 나뉜다(보고국 정부/민간부문이 발행한 증권, 직접투자 등).\"},{\"id\":45,\"question\":\"BOP의 복식부기 원칙이란 무엇이며, 어떤 항등식(BOP identity)을 사용하는가?\",\"answer\":\"BOP의 복식부기 시스템(double-entry bookkeeping)에서는 모든 거래가 차변과 대변을 모두 포함한다. 이론적으로 모든 차변의 합이 모든 대변의 합과 같아야 하며 BOP 계정표의 전체 순합계는 0이어야 한다: 경상계정 + 자본계정 + 금융계정 ≈ 0. 실제로는 거래 정보를 서로 다른 출처에서 수집하기 때문에 정확히 일치하지 않으며(\\\"통계적 불일치\\\"가 발생한다).\"},{\"id\":46,\"question\":\"1월 9일 A국은 B국으로부터 $1백만 상당의 재화를 구매하고, 12월 1일에 대금을 지급하기로 합의하였다. A국은 9월 1일과 12월 1일에 자국 BOP에 차변·대변을 어떻게 기록하는가?\",\"answer\":\"9월 1일에 A국은 구매한 재화의 금액(자산의 증가)을 $1백만 차변으로, B국에 지급해야 할 금액(부채의 증가)을 $1백만 대변으로 기록한다. 12월 1일에 A국은 부채의 감소를 $1백만 차변으로, 실제 지급(자산의 감소)을 $1백만 대변으로 기록한다. 차변과 대변의 총합은 각각 $2백만이 되어 순합계는 0이 된다.\"},{\"id\":47,\"question\":\"투자전문가들은 실무에서 BOP를 어떻게 더 단순하게 취급하는가?\",\"answer\":\"투자전문가들은 흔히 경상계정을 무역수지(상품무역 + 서비스)와 거의 동일하게 취급하고, 모든 자금흐름(금융계정 + 자본계정)을 하나의 범주로 묶어 간단히 \\\"자본계정\\\"이라고 부른다. 이를 다시 두 가지 유형의 흐름 — 포트폴리오투자(단기) 와 FDI(장기, 생산자산에 대한 투자) — 로 나누어 살펴본다.  ## 국민경제계정과 국제수지\"},{\"id\":48,\"question\":\"폐쇄경제(closed economy)의 국민소득 항등식(national income identity)을 적으라.\",\"answer\":\"폐쇄경제 내에서는 모든 생산물 Y가 민간부문(소비 C, 투자 I) 또는 정부(G)에 의해 구매되므로: Y = C + I + G (1), 여기서 Y — GDP, C — 민간소비, I — 투자, G — 정부구매.\"},{\"id\":49,\"question\":\"개방경제(open economy)의 국민소득 항등식과 경상계정수지(CA)의 정의를 적으라.\",\"answer\":\"개방경제에서는: Y = C + I + G + X – M (2), 여기서 X — 수출, M — 수입이다. 식 2를 변형하면 경상계정수지는: CA = X – M = Y – (C + I + G) (3)로 정의할 수 있으며, 다시 말해 순수출은 BOP 관점에서 경상계정수지와 같다.\"},{\"id\":50,\"question\":\"처분가능소득(disposable income, Yd)을 정의하는 식을 적으라.\",\"answer\":\"Yd = Y + R – T (4), 여기서 R — 순이전, T — 세금. 처분가능소득은 소비(C)와 민간저축(private saving, Sp)으로 배분된다: Yd = C + Sp (5). 이로부터 소비는 다음과 같이 쓸 수 있다: C = Yd – Sp = Y + R – T – Sp (6).\"},{\"id\":51,\"question\":\"민간저축(Sp), 정부저축(Sg), 투자(I)와 경상계정수지(CA)를 연결하는 항등식을 적으라.\",\"answer\":\"식 3과 6을 결합하고 (T – G – R)을 정부저축 Sg로 표기하면: CA = Sp – I + (T – G – R) (7), 이를 다시 다음과 같이 쓸 수 있다: Sp + Sg = I + CA (8). 이는 개방경제에서는 저축을 국내투자나 해외투자(해외자산 매입을 통해)에 사용할 수 있지만, 폐쇄경제에서는 저축이 오직 국내투자에만 사용될 수 있음을 보여준다.\"},{\"id\":52,\"question\":\"식 8을 다시 정리하여 경상계정 불균형의 거시경제적 원인(macroeconomic sources of a current account imbalance)을 보여주는 식을 적고, 경상계정 적자는 어떤 조건에서 발생하는가?\",\"answer\":\"식 8을 다시 정리하면: CA = Sp + Sg – I (10). 경상계정 적자는 흔히 낮은 민간저축, 높은 민간투자, 정부재정적자(Sg \u003c 0), 또는 이들의 결합에서 비롯된다. 반면 경상계정 흑자는 높은 민간저축, 낮은 민간투자, 또는 정부재정흑자를 반영한다.  ## 국제기구: IMF·세계은행·WTO\"},{\"id\":53,\"question\":\"브레턴우즈(Bretton Woods) 회의에서 어떤 기구들이 설립되었으며, 왜 설립되었는가?\",\"answer\":\"1930년대 대공황 시기에 각국이 무역장벽을 세우고 자국 화폐를 평가절하하는 등의 조치를 취한 것이 경제를 더욱 악화시켰다. 1944년 7월 미국 브레턴우즈에서 열린 회의에서 국제경제협력체제가 합의되었고, 이로부터 세계은행(World Bank)과 국제통화기금(International Monetary Fund, IMF)이 설립되었다(IMF는 1945년 12월에 공식 설립). 세 번째 기구인 국제무역기구(ITO)도 설립이 계획되었으나 미국 의회의 비준을 받지 못하여 성립되지 못했고, 그 대신 GATT가 1995년까지 국제무역을 규율하는 유일한 체제로 남았다.\"},{\"id\":54,\"question\":\"국제통화기금(IMF)의 주요 목적과 기능을 나열하라.\",\"answer\":\"IMF의 주요 목적은 국제통화체제(환율, 국제결제제도)의 안정성을 유지하는 것이다. 구체적으로 IMF는: (1) 국제통화 문제에 관한 협력의 장을 제공한다; (2) 국제무역의 성장, 고용, 경제성장, 빈곤 감소를 촉진한다; (3) 환율의 안정성과 개방적인 국제결제제도를 지원한다; (4) 회원국이 BOP 문제를 해결하도록 일시적이고 보증된 외화대출을 제공한다.\"},{\"id\":55,\"question\":\"세계은행의 목적은 무엇이며, IBRD와 IDA는 어떻게 다른가?\",\"answer\":\"세계은행의 주요 목적은 개발도상국의 빈곤을 줄이고 환경적으로 지속가능한 경제성장을 촉진하는 것이다. 여기에 속하는 두 기구로, 국제부흥개발은행(IBRD)은 시장을 기반으로(채권을 발행하여 자금을 조달) 신용도가 양호한 국가에 낮은 금리의 대출을 제공하며, 국제개발협회(IDA)는 가장 빈곤한 국가들에게 양허적인(저금리 또는 무이자) 조건의 대출을 제공하는 세계 최대의 자금원이다. 둘 다 영리 목적으로 운영되지 않는다.\"},{\"id\":56,\"question\":\"세계무역기구(WTO)의 목적은 무엇이며, GATT로부터 어떻게 발전했는가?\",\"answer\":\"WTO는 전 세계적으로 국가 간 국경을 넘는 무역관계를 규율하는 유일한 국제기구로서, 1995년 1월 1일 1947년 이래 시행되어 온 \\\"관세 및 무역에 관한 일반협정\\\"(General Agreement on Tariffs and Trade, GATT)을 대체하여 설립되었다. WTO의 주요 기능은 협정의 이행과 관리, 협상을 위한 플랫폼 역할, 무역분쟁의 해결 등이다. 2001년부터 도하(Doha, 카타르)에서 협상라운드가 시작되었으나 아직까지 완전한 합의에 이르지 못하고 있다.\"},{\"id\":57,\"question\":\"GATT(General Agreement on Tariffs and Trade)란 무엇이며, 역사적으로 어떤 역할을 했는가?\",\"answer\":\"GATT는 1947년 10월 30일 23개국이 체결한, 관세를 낮추고 조정하기 위한 협정이다. ITO(국제무역기구)가 미국 의회의 비준을 받지 못했기 때문에 GATT는 1948년부터 1995년까지 국제무역을 규율하는 유일한 다자간 체제였다. 도쿄라운드(Tokyo Round)와 우루과이라운드(Uruguay Round)에서 특히 중요한 협상이 이루어졌으며, 1995년 GATT는 WTO로 대체되었다.\"},{\"id\":58,\"question\":\"IMF, 세계은행, WTO 세 기구를 각각의 핵심 역할에 기초하여 어떻게 구분할 수 있는가?\",\"answer\":\"IMF — 국제통화체제의 안정성(환율, 결제제도)을 유지하고, BOP 문제가 발생한 회원국에 외화대출을 제공한다(예: 2010년 그리스 위기 당시 지원). 세계은행 — 개발도상국의 빈곤 감소와 경제 기초인프라 개발을 위해 대출과 자문을 제공한다. WTO — 국제무역의 법적·제도적 기반을 마련하고, 무역협상을 조율하며, 분쟁을 해결한다.  ---\"}]},{\"id\":\"exchange-rates\",\"title\":\"환율\",\"cards\":[{\"id\":1,\"question\":\"환율(exchange rate)이란 무엇이며, \\\"기준통화\\\"(base currency)와 \\\"가격통화\\\"(price currency)는 어떻게 정의되는가?\",\"answer\":\"환율은 한 통화의 가치를 다른 통화로 표시한 값으로, 항상 두 통화가 개입된다. \\\"A/B\\\"로 표기할 때 이는 통화 B의 1단위를 매입하는 데 필요한 통화 A의 단위 수를 나타낸다. 여기서 A는 가격통화(price currency, 분자), B는 기준통화(base currency, 분모이며 항상 1단위로 취급됨)이다.\"},{\"id\":2,\"question\":\"명목환율(nominal exchange rate)과 실질환율(real exchange rate)의 차이는 무엇인가?\",\"answer\":\"명목환율은 시장에서 직접 고시되는, 우리가 일상적으로 접하는 환율이다. 실질환율은 명목환율을 두 나라의 물가수준으로 조정하여 구매력(purchasing power)의 상대적 변화를 측정하는 지수로, 시장에서 직접 거래되지 않으며 어디까지나 분석가들이 산출한 지수일 뿐이다.\"},{\"id\":3,\"question\":\"실질환율은 (d/f 표기, 즉 자국통화가 가격통화인 경우) 어떤 공식으로 표현하는가?\",\"answer\":\"Real exchange rate(d/f) = (S_d/f × P_f)/P_d = S_d/f × (P_f/P_d), 여기서 S_d/f는 외국통화 1단위당 자국통화 단위 수로 표시한 현물환율, P_f는 외국의 물가수준(외국통화 기준), P_d는 자국의 물가수준(자국통화 기준)이다.\"},{\"id\":4,\"question\":\"구매력평가(purchasing power parity, PPP) 이론은 무엇을 주장하며, 실제로는 왜 성립하지 않는가?\",\"answer\":\"PPP 이론은 명목환율이 장기적으로 조정되어, 동일한 상품(또는 상품 바스켓)이 서로 다른 시장에서 동일한 가격을 가지게 된다고 본다. 그러나 실제로는 국가 간 상품/서비스가 동일하지 않고, 무역장벽(trade barriers), 운송비, 수입관세가 존재하기 때문에 명목환율은 PPP 수준에서 지속적으로 벗어난다.\"},{\"id\":5,\"question\":\"외환시장의 일일 거래량에서 국제무역(international trade)과 자본시장 거래(capital market transactions) 중 어느 쪽이 더 큰 비중을 차지하는가?\",\"answer\":\"자본시장 거래(해외직접투자, 포트폴리오 투자 등)가 일일 FX 거래의 훨씬 더 큰 비중을 차지하며, 국제무역 상품대금을 결제하는 데 필요한 거래량을 압도적으로 넘어선다. 이는 자본의 매우 높은 이동성(capital mobility)에서 비롯된다.\"},{\"id\":6,\"question\":\"헤지(hedging)와 투기(speculation)의 경계가 왜 불분명한가, 그리고 기업의 재무부서는 헤지 성과를 어떻게 평가하는가?\",\"answer\":\"수출기업은 외화 수입이 얼마나, 언제 얼마만큼 들어올지 정확히 알지 못하기 때문에 헤지 결정에는 재량(discretion)이 개입되며, 과도한 헤지 또는 부족한 헤지의 가능성이 투기와 결합된다. 재무부서는 보통 일정 비율(예: 100%)로 완전히 헤지한 \\\"벤치마크\\\"와 비교하여 실제 성과의 손익을 측정·평가한다.\"},{\"id\":7,\"question\":\"현물거래(spot transaction)란 무엇이며, 표준 결제 기간은 며칠인가?\",\"answer\":\"현물거래는 통화를 즉시(가까운 시일 내에) 교환하는 거래로, 대부분의 통화는 \\\"T+2\\\"(거래일로부터 2영업일 후)로 결제된다. 예외는 캐나다달러(CAD)로, 미달러와는 \\\"T+1\\\"로 결제된다.\"},{\"id\":8,\"question\":\"완전선물환계약(outright forward contract)과 FX스왑(FX swap)의 차이는 무엇인가?\",\"answer\":\"선물환계약은 오늘 합의한 환율로 미래(T+2 이후)에 통화를 교환하는 계약이다. FX스왑은 동시에 이루어지는 현물거래와 선물환계약의 결합으로, 주로 기존 선물환 포지션을 새로운 만기로 \\\"롤오버\\\"(roll)하거나 스왑 자금조달(swap funding)을 위해 사용된다.\"},{\"id\":9,\"question\":\"통화선물계약(currency futures contract)은 장외(OTC) 선물환계약과 어떤 점이 다른가?\",\"answer\":\"선물은 거래소(예: CME의 IMM 부문)에서 거래되며, 표준화된 고정 계약 규모와 결제일을 가지고, 담보(collateral)를 매일 시가로 평가(mark-to-market)하여 조정한다. OTC 선물환은 규모와 만기가 유연하지만 거래상대방 위험(counterparty risk)이 높다.\"},{\"id\":10,\"question\":\"FX옵션(FX option)이란 무엇인가?\",\"answer\":\"FX옵션은 사전에 프리미엄(premium)을 지불하고, 미래의 특정 시점에 합의된 환율로 FX거래를 할 수 있는 권리(의무는 아님)를 부여하는 계약이다. 보유자는 유리한 경우에만 옵션을 행사한다.\"},{\"id\":11,\"question\":\"FX시장의 \\\"바이사이드\\\"(buy side) 참가자는 어떻게 분류되는가?\",\"answer\":\"법인계좌(corporate accounts), 실물자금계좌(real money accounts — 보험사, 연금, ETF 등 레버리지가 제한된 계좌), 레버리지계좌(leveraged accounts — 헤지펀드, CTA, 프롭트레이딩, 알고리즘 트레이더), 개인(소매)계좌(retail accounts), 정부(governments), 중앙은행(central banks), 그리고 국부펀드(sovereign wealth funds, SWF)로 분류된다.\"},{\"id\":12,\"question\":\"FX시장의 \\\"셀사이드\\\"(sell side)는 어떻게 계층화되는가?\",\"answer\":\"가장 크고 광범위한 딜링은행(Deutsche Bank, Citigroup, UBS, HSBC 등)이 일일 거래의 대부분을 차지하며, 다수 고객의 거래를 내부적으로 상쇄(internally crossed)할 수 있다. 그 외 지역/현지 은행들은 대개 전 세계적 고객기반이 없기 때문에 거래를 선도은행을 통해 처리한다.\"},{\"id\":13,\"question\":\"2016년 BIS 3년 주기 조사(BIS Triennial Survey)에 따른 전 세계 일일 FX 거래량과 구성은 어떠했는가?\",\"answer\":\"2016년 4월 일평균 거래량은 약 USD 5.1조였다. 상품별로는 현물 33%, 선물환 14%, 스왑 49%, 옵션 5%였다. 거래상대방별로는 은행간 42%, 금융 거래상대방 51%, 비금융 거래상대방은 8%에 불과했다. 가장 많이 거래된 5개 통화쌍 모두 USD를 포함했으며, 런던이 가장 큰 거래 중심지였고 그다음은 뉴욕, 도쿄였다.  ## 환율 표시와 교차환율 계산\"},{\"id\":14,\"question\":\"직접고시(direct quote)와 간접고시(indirect quote)의 차이는 무엇인가?\",\"answer\":\"직접고시는 자국통화를 가격통화로, 외국통화를 기준통화로 한다(S_d/f). 간접고시는 자국통화를 기준통화로 한다(S_f/d). 이 둘은 서로 역수(inverse/reciprocal) 관계에 있을 뿐이다.\"},{\"id\":15,\"question\":\"은행이 양방향 가격(two-sided price, bid-offer)을 제시할 때 \\\"bid\\\"와 \\\"offer\\\"는 어떻게 정의되는가?\",\"answer\":\"bid는 딜러가 기준통화를 매입할 의사가 있는 가격(낮은 값)이고, offer는 딜러가 기준통화를 매도할 의사가 있는 가격(높은 값)이다. 은행은 낮은 가격에 매입하고 높은 가격에 매도하므로 항상 bid \u003c offer이다.\"},{\"id\":16,\"question\":\"전문 FX시장에서 현물환율은 보통 소수점 몇 자리까지 고시되는가, 그리고 어떤 예외가 있는가?\",\"answer\":\"대부분의 전문 현물환율은 소수점 4자리까지 고시된다. 일본엔(JPY)은 예외로 소수점 2자리까지 고시되는데, 엔은 다른 통화에 비해 단위 수 자체가 이미 상대적으로 크기 때문이다.\"},{\"id\":17,\"question\":\"USD/EUR 환율이 1.1500에서 1.2000으로 상승했다면 유로는 달러 대비 몇 퍼센트 상승한 것인가, 그리고 달러가 유로 대비 동일한 비율로 하락했다고 말할 수 있는가?\",\"answer\":\"(1.2000/1.1500) − 1 = 4.35% — 이는 유로의 달러 대비 상승률(appreciation)이다. 아니다, 동일하지 않다. 환율을 역으로(EUR/USD) 계산하면 (1/1.2000)/(1/1.1500) − 1 = −4.17%가 되는데, 이는 역수 관계가 대칭적이지 않기 때문이다.\"},{\"id\":18,\"question\":\"세 통화와 관련된 두 환율을 이용해 교차환율(cross-rate)을 계산하는 일반 원칙은 무엇인가? 예를 들어 설명하라.\",\"answer\":\"중간에 있는 통화가 소거되도록 환율들을 곱해야 한다: CAD/USD × USD/EUR = CAD/EUR. 예를 들어 CAD/USD = 1.3020, USD/EUR = 1.1701이라면: 1.3020 × 1.1701 = 1.5235 CAD per EUR.\"},{\"id\":19,\"question\":\"교차환율을 계산할 때 중간 통화를 소거하기 위해 한 환율을 역수로 바꿔야 하는 경우, 어떻게 계산하는가? 예를 들어 설명하라.\",\"answer\":\"CAD/USD를 JPY/USD와 곱하려면 먼저 CAD/USD를 역수로 바꾸어 USD/CAD로 만든다: (CAD/USD)^(-1) × JPY/USD = USD/CAD × JPY/USD = JPY/CAD. 예를 들어 CAD/USD = 1.3020 → 역수는 0.7680; 0.7680 × 111.94 = 85.97 JPY per CAD.\"},{\"id\":20,\"question\":\"삼각차익거래(triangular arbitrage)란 무엇인가?\",\"answer\":\"딜러가 고시하는 교차환율(cross-rate)이 기초환율들로부터 계산되는 이론적 환율과 어긋나는 경우, 트레이더는 한 통화를 싸게 매입하여 다른 통화로 비싸게 매도함으로써 무위험 이익을 얻을 수 있다. 이러한 불일치(세 통화가 관련되어 \\\"삼각(tri-)\\\"이라 불림)는 트레이더와 알고리즘 시스템이 끊임없이 감시하기 때문에 시장에서 그리 오래 지속되지 않는다.\"},{\"id\":21,\"question\":\"USD/GBP 고시에서 어느 통화가 가격통화이고 어느 통화가 기준통화인가, 그리고 이것이 직접고시인지 간접고시인지는 어떻게 판단하는가?\",\"answer\":\"USD/GBP 고시에서 USD는 가격통화, GBP는 기준통화이다. 이 고시를 사용하는 사람이 영국에 있다면 이는 간접고시이고(GBP, 즉 자국통화가 기준통화), 미국에 있는 사람에게는 직접고시이다(USD, 즉 자국통화가 가격통화) — 이는 오로지 사용자의 위치에 따라 달라진다.\"},{\"id\":22,\"question\":\"전문 시장에서 고시 통화의 전통적인 서열(hierarchy)은 어떠한가 — EUR, GBP, USD, AUD/NZD 중 어느 통화가 기준통화가 되는가?\",\"answer\":\"EUR이 포함된 고시에서는 EUR이 항상 기준통화이다(예: GBP/EUR). GBP가 포함되고 EUR이 없는 고시에서는 GBP가 기준통화이다(예: USD/GBP). USD가 포함되고 GBP, EUR이 없는 고시에서는 USD가 기준통화이다(예: CAD/USD). 예외로 AUD와 NZD는 USD와 결합될 때 기준통화가 된다(USD/AUD, USD/NZD).\"},{\"id\":23,\"question\":\"18.8590 MXN/USD라는 현물 고시는 멕시코 거래상대방의 입장에서 왜 \\\"직접고시\\\"(direct quote)로 정의되는가?\",\"answer\":\"직접고시는 자국통화를 가격통화로, 외국통화를 기준통화로 한다. MXN/USD 고시에서 MXN이 가격통화이므로 멕시코 거래상대방에게는 이것이 직접고시이다(1달러를 매입하는 데 18.8590페소가 든다는 의미).  ## 선물환 계산\"},{\"id\":24,\"question\":\"선물환 포인트(forward points, pips)란 무엇이며, 어떻게 계산하는가?\",\"answer\":\"선물환 포인트는 선물환율과 현물환율의 차이를 현물 고시의 마지막 소수점 자리에 연계된 배율로 표현한 것이다. 예를 들어 USD/EUR 현물 = 1.15885, 1년 선물환 = 1.19532이면: 1.19532 − 1.15885 = +0.03647, ×10,000 = +364.7 포인트(엔의 경우 ×100을 사용).\"},{\"id\":25,\"question\":\"선물환 프리미엄(forward premium)과 선물환 디스카운트(forward discount)는 어떻게 정의되는가?\",\"answer\":\"선물환율이 현물환율보다 높으면(포인트가 양수) 기준통화는 선물환 프리미엄 상태로 거래된다고 한다. 선물환율이 현물환율보다 낮으면(포인트가 음수) 기준통화는 선물환 디스카운트 상태로 거래된다고 한다. 기준통화가 프리미엄이면 가격통화는 자동으로 디스카운트가 된다.\"},{\"id\":26,\"question\":\"선물환 포인트를 현물환율에 결합하여 선물환율을 구하는 공식은 무엇인가? 예를 들어 설명하라.\",\"answer\":\"현물환율 + (포인트/10,000) = 선물환율(엔의 경우 /100). 예를 들어 3개월 포인트가 +80.9이면: 1.15885 + (80.9/10,000) = 1.15885 + 0.00809 = 1.16694.\"},{\"id\":27,\"question\":\"커버된 금리평형(covered interest rate parity) 조건이란 무엇이며, 차익거래 방정식은 (f/d 고시로) 어떻게 쓰는가?\",\"answer\":\"이는 두 가지 방법(자국통화로 투자하는 것 vs. 해외로 환전하여 외국 금리로 투자한 뒤 선물환으로 다시 환전하는 것)의 무위험 수익이 같아야 한다는 차익거래 관계이다: (1 + i_d) = S_f/d(1 + i_f)(1/F_f/d).\"},{\"id\":28,\"question\":\"위의 차익거래 방정식을 선물환율을 구하도록 어떻게 다시 쓰는가?\",\"answer\":\"F_f/d = S_f/d × [(1 + i_f)/(1 + i_d)]. 예를 들어 S_f/d = 1.6535, i_d = 3.50%, i_f = 5.00%이면: F_f/d = 1.6535 × (1.0500/1.0350) = 1.6775.\"},{\"id\":29,\"question\":\"선물환율을 현물환율에 대한 비율(퍼센트 프리미엄/디스카운트)로는 어떻게 표현하는가?\",\"answer\":\"F_f/d / S_f/d = (1 + i_f)/(1 + i_d). 이는 f/d 고시로 표현할 때, 외국 금리가 자국보다 높으면 선물환율이 현물보다 프리미엄 상태가 됨을 의미한다.\"},{\"id\":30,\"question\":\"어느 통화의 금리가 더 높을 때 그 통화는 선물환 프리미엄 또는 디스카운트 상태로 거래되는가?\",\"answer\":\"고시 형태와 무관하게, 금리가 높은 통화는 선물환시장에서 디스카운트로, 금리가 낮은 통화는 프리미엄으로 거래된다.\"},{\"id\":31,\"question\":\"선물환율을 미래의 예상 현물환율(expected future spot rate)로 해석할 수 있는가, 그리고 어떤 공식이 도출되는가?\",\"answer\":\"F_t = S_t+1이라고 가정하면: (S_t+1/S_t) − 1 = %ΔS_t+1 = (i_f − i_d)/(1 + i_d). 그러나 이러한 해석은 주의해서 사용해야 한다. 과거 데이터를 보면 선물환율은 미래 현물환율의 예측치로서 성과가 좋지 않은 것으로 나타나는데, 예측 오차의 크기가 매우 크기 때문이다.\"},{\"id\":32,\"question\":\"기간 비율 계수 τ를 포함한 더 일반적인 스왑포인트(swap points) 공식은 무엇인가?\",\"answer\":\"F_f/d − S_f/d = S_f/d × [(i_f − i_d)/(1 + i_d·τ)] × τ, 여기서 τ는 금리가 고시되는 기간 중 해당 기간이 차지하는 비율이다(예: 30일의 경우 τ = 30/360).\"},{\"id\":33,\"question\":\"선물환 포인트의 크기는 만기(maturity) 및 금리차(interest rate differential)와 어떤 관계가 있는가?\",\"answer\":\"선물환 포인트는 현물환율 및 금리차(i_f − i_d)에 정비례하며, 선물환계약의 만기(τ)에도 (정확히 비례하지는 않지만) 대체로 비례한다. 만기가 길어지거나 금리차가 커지면 포인트의 절대적 크기도 커진다.\"},{\"id\":34,\"question\":\"Libor 예금에 사용되는 날수계산방식(day count convention)은 무엇인가?\",\"answer\":\"Actual/360 — 1년을 360일로 가정하여 이자를 계산하지만, 예금이 유지된 실제 날수를 사용한다.  ## 환율제도\"},{\"id\":35,\"question\":\"개념적으로 \\\"이상적인 환율제도\\\"(ideal currency regime)는 어떤 세 가지 특성을 가져야 하는가, 그리고 왜 이러한 제도는 실제로 존재할 수 없는가?\",\"answer\":\"1) 두 통화 간 환율이 신뢰성 있게 고정(credibly fixed)되어 있을 것; 2) 모든 통화가 완전히 전환 가능(fully convertible)할 것; 3) 각국이 독립적으로 자국의 통화정책을 완전히 자율적으로 수행할 수 있을 것. 이 세 가지는 동시에 양립할 수 없다 — 환율이 고정되어 있고 전환이 자유롭다면 독립적인 통화정책을 수행할 수 없게 된다(\\\"불가능한 삼위일체(impossible trinity)\\\"로 알려진 정책적 트릴레마).\"},{\"id\":36,\"question\":\"신뢰성 있게 고정된(credibly fixed) 환율과 완전한 전환성이 보장된 상황에서, 국내 통화정책을 확장적(expansionary)으로 운용하려는 시도가 왜 불가능해지는가?\",\"answer\":\"국내 금리를 다른 나라보다 낮추려 하면, 균형 금리가 회복될 때까지 무제한적인 규모의 자본이 해외로 유출된다. 중앙은행은 환율을 방어하기 위해 외화를 매도하고 자국통화를 매입해야 하며, 그 결과 외환보유액이 소진되고 통화량이 줄어들어 국내 금리가 다시 상승하면서 처음의 확장적 정책은 실패하게 된다.\"},{\"id\":37,\"question\":\"자유변동환율(floating exchange rate) 제도에서 국내 금리 하락은 통화정책을 어떻게 강화하는가?\",\"answer\":\"금리가 하락하면 자국통화에 대한 매력이 떨어져 환율이 어느 정도 하락(통화 가치 하락)하게 되며, 이는 국내 상품에 대한 수요를 증가시킨다(수출 증가, 수입 감소). 이로써 처음의 금리 하락이 가져오는 확장적 효과가 한층 강화된다.\"},{\"id\":38,\"question\":\"고전적 금본위제(classical gold standard)는 어떤 메커니즘으로 작동했는가?\",\"answer\":\"가격-금 유출입 메커니즘(price-specie-flow mechanism) — 무역흑자국은 금(gold)을 축적하여 통화량이 늘고 물가가 올라 수출이 줄어든다. 반면 무역적자국은 금이 유출되어 통화량이 줄고 물가가 내려 수출이 늘어난다.\"},{\"id\":39,\"question\":\"브레튼우즈 체제(Bretton Woods system)란 무엇이었으며, 왜 붕괴했는가?\",\"answer\":\"제2차 세계대전 중 케인스(Keynes)와 해리 덱스터 화이트(Harry Dexter White)가 설계하고 1944년 44개국이 채택한, 고정되어 있으나 주기적으로 재조정(periodic realignments)되는 환율 체제였다. 1970년대 초 빠르고 불안정한 인플레이션 상황에서 이 체제는 붕괴했다.\"},{\"id\":40,\"question\":\"1992년 유럽환율메커니즘(ERM)에서 영국 파운드에 대한 투기적 공격은 어떻게 일어났는가?\",\"answer\":\"영국은 경기침체 속에서 금리를 낮추고자 했으나, 독일은 통일 비용을 조달하기 위해 금리를 올렸다. 이로 인해 자본이 파운드에서 마르크로 이동했고, 영국은 파운드 환율을 방어할 수 없게 되어 ERM을 탈퇴하고 파운드를 평가절하(devaluation)할 수밖에 없었다(1992년 9월).\"},{\"id\":41,\"question\":\"2008년 기준 IMF는 환율제도를 몇 가지로 분류했으며, 그 명칭은 무엇인가?\",\"answer\":\"여덟 가지로 분류했다: 독자적인 법정화폐가 없는 제도(달러화(dollarization), 통화동맹), 통화위원회제도(currency board), 고정환율(fixed parity), 목표권역(target zone), 크롤링 페그(crawling peg), 크롤링 밴드가 있는 고정환율(crawling bands), 관리변동환율제(managed float), 자유변동환율제(independent float).\"},{\"id\":42,\"question\":\"달러화(dollarization)란 무엇이며, 어떤 단점이 있는가?\",\"answer\":\"한 나라가 다른 나라(주로 미국 달러)의 통화를 자국의 거래 수단이자 계산 단위로 사용하는 것을 말한다. 해당 국가는 외화의 신뢰성을 \\\"빌려 입는\\\" 것이지만, 그 외화를 발행한 나라의 신용도(creditworthiness)를 갖는 것은 아니다. 그 나라는 통화정책을 수행할 능력(시뇨리지(seigniorage) 수입과 함께)을 상실한다.\"},{\"id\":43,\"question\":\"통화동맹(monetary union, 예: EMU) 회원국들의 통화정책은 어떻게 결정되는가?\",\"answer\":\"회원국은 독립적인 통화정책을 수행할 수 없고, 대신 중앙은행(예: 유럽중앙은행, ECB)에서 각국의 대표를 통해 공동으로 통화정책을 결정한다. 2010년 EMU 국가들의 부채위기는 통화동맹이 그 자체로 회원국 각각의 신용도를 보장해 주지는 못한다는 것을 보여주었다.\"},{\"id\":44,\"question\":\"통화위원회제도(currency board system, CBS)란 무엇이며, 홍콩특별행정구(Hong Kong SAR)의 예는 어떻게 운영되는가?\",\"answer\":\"CBS는 자국통화를 고정된 환율로 외화로 전환해 주겠다는 법적 구속력을 갖는 약속으로, 자국통화는 오직 보유한 외환보유액만큼만 발행된다. 홍콩특별행정구는 1983년부터 USD 보유액을 바탕으로 HKD/USD = 7.80의 고정환율을 유지해 왔으며, 홍콩금융관리국(HKMA)이 일정 범위 내의 투기적 변동을 제한한다.\"},{\"id\":45,\"question\":\"시뇨리지(seigniorage)란 무엇이며, 통화위원회제도가 달러화에 비해 왜 유리한가?\",\"answer\":\"시뇨리지는 화폐 발행 비용을 초과하여 얻는 이익이다. 통화위원회제도 아래에서 통화당국은 저금리의 통화기반(monetary liabilities)을 유지하면서 고금리의 외환보유액을 운용함으로써 그 차익만큼 시뇨리지를 얻는다. 반면 달러화에서는 이 이익이 해당 외화를 발행하는 나라로 돌아간다.\"},{\"id\":46,\"question\":\"단순 고정환율제(fixed parity)는 통화위원회제도(CBS)보다 신뢰성이 왜 더 낮은가?\",\"answer\":\"고정환율제에는 법적 구속력이 없고(해당 국가가 언제든 고정환율을 폐지할 수 있음), 외환보유액의 목표 수준이 국내 통화총량과 명확히 연계되어 있지 않아 재량적(discretionary)이다. 고정환율은 보통 ±1% 범위의 밴드를 가지며, 통화당국은 이 범위 내에서 환율을 유지하기 위해 보유액으로 시장에 개입한다.\"},{\"id\":47,\"question\":\"목표권역(target zone) 제도는 단순 고정환율제와 어떻게 다른가?\",\"answer\":\"목표권역은 더 넓은 범위(±2%까지)를 갖는 고정환율제로, 통화당국에 재량적 정책을 운용할 수 있는 더 많은 여지를 준다.\"},{\"id\":48,\"question\":\"크롤링 페그(crawling peg)의 능동적(active) 형태와 수동적(passive) 형태의 차이는 무엇인가?\",\"answer\":\"수동적 크롤링 페그는 인플레이션에 맞추어 환율을 자주(주간, 일간 단위로) 조정한다(예: 1980년대 브라질). 능동적 크롤링 페그는 앞으로 몇 주간의 환율 경로를 사전에 발표하고 작은 폭으로 조정함으로써 인플레이션 기대를 관리하는 것을 목적으로 한다(예: 아르헨티나, 칠레, 우루과이).\"},{\"id\":49,\"question\":\"크롤링 밴드가 있는 고정환율(fixed parity with crawling bands) 제도의 목적은 무엇인가?\",\"answer\":\"처음에는 미래의 인플레이션 기대를 안정시키기 위해 외화에 대해 고정환율을 설정한 뒤, 중심 고정환율을 중심으로 점진적으로 확대되는 사전 발표된 밴드를 도입하여 더 큰 유연성을 부여함으로써, 고정환율제에서 점진적으로 벗어나는 전략을 준비할 수 있게 한다.\"},{\"id\":50,\"question\":\"관리변동환율제(managed float, \\\"더티 플로팅(dirty floating)\\\")란 무엇인가?\",\"answer\":\"한 나라가 특정 국내 또는 대외 목표(무역수지, 물가안정, 고용 등)의 달성 여부에 따라 환율정책에 개입할지를 결정하는 제도로, 구체적인 환율 목표(수준 또는 변화율)를 명시적으로 발표하는 경우는 드물다.\"},{\"id\":51,\"question\":\"자유변동환율제(independently floating rate)란 무엇이며, 왜 실제로는 \\\"순수한\\\" 자유변동환율제가 존재하지 않는다고 말할 수 있는가?\",\"answer\":\"환율이 시장의 힘에 의해 결정되고, 통화당국이 독립적인 통화정책을 수행할 수 있는 제도이다. 그러나 실제로는 중앙은행들이 때때로 제도적 개입을 하기도 한다 — 예를 들어 1985년 플라자 합의(Plaza Accord), 2000년 유로 지지를 위한 \\\"공조 개입(concerted intervention)\\\" 등이 그 예이다.  ## 환율과 무역수지: 탄력성 접근법과 흡수 접근법\"},{\"id\":52,\"question\":\"무역수지(trade balance)와 자본계정(capital account) 사이의 기본적인 관계를 설명하라.\",\"answer\":\"무역적자(또는 흑자)는 정확히 같은 규모의 자본계정 흑자(또는 적자)와 상쇄된다. 무역수지에 영향을 미치는 어떤 요인이든 자본계정에 정확히 반대 부호, 같은 크기의 영향을 미쳐야 한다.\"},{\"id\":53,\"question\":\"무역수지는 저축-지출의 거시적 정체성으로 어떻게 표현되는가 (X-M 공식)?\",\"answer\":\"X – M = (S – I) + (T – G), 여기서 X는 수출, M은 수입, S는 민간저축, I는 투자, T-G는 정부의 재정수지(세금에서 지출을 뺀 값)이다. 무역흑자란 한 나라가 투자를 조달하는 데 필요한 것보다 더 많이 저축한다는 것을 의미한다.\"},{\"id\":54,\"question\":\"환율과 무역수지를 분석하는 두 가지 주요 접근법은 무엇인가 (탄력성 접근법 vs. 흡수 접근법)?\",\"answer\":\"\\\"탄력성 접근법\\\"(elasticities approach)은 국내재와 외국재의 상대가격 변화를 측정하는 것으로, 미시경제적 측면에서 지출의 구성(expenditure-switching) 변화를 보여준다. \\\"흡수 접근법\\\"(absorption approach)은 환율이 총지출/저축 결정에 미치는 영향을 다루는 거시경제적 측면을 살펴본다.\"},{\"id\":55,\"question\":\"가격탄력성(price elasticity of demand)은 어떤 공식으로 정의되는가?\",\"answer\":\"ε = −(%ΔQ)/(%ΔP). ε \u003e 1이면 수요가 \\\"탄력적\\\"(elastic), ε \u003c 1이면 \\\"비탄력적\\\"(inelastic)이다. 지출은 %ΔR = (1−ε)%ΔP이므로, 탄력적 수요에서는 가격 상승이 지출을 감소시키고, 비탄력적 수요에서는 지출을 증가시킨다.\"},{\"id\":56,\"question\":\"일반화된 마샬-러너 조건(generalized Marshall-Lerner condition)은 무엇이며, 무엇을 말해주는가?\",\"answer\":\"ωXεX + ωM(εM – 1) \u003e 0, 여기서 ωX, ωM은 전체 무역(수입+수출)에서 수출과 수입이 차지하는 비중, εX, εM은 수출과 수입의 가격탄력성이다. 이 조건이 충족되면 자국통화의 평가절하/하락은 무역수지를 흑자 방향으로 이동시킨다.\"},{\"id\":57,\"question\":\"무역이 처음에 균형 상태(ωX = ωM)에 있는 경우, 일반화된 마샬-러너 조건은 어떤 \\\"고전적\\\" 형태가 되는가?\",\"answer\":\"εX + εM \u003e 1 — 이것이 고전적 마샬-러너 조건이다. 통화 가치 하락은 수출과 수입의 탄력성 합이 1보다 클 때 무역수지를 개선시킨다.\"},{\"id\":58,\"question\":\"상품/서비스에 대한 수요의 탄력성에 영향을 미치는 네 가지 요인은 무엇인가?\",\"answer\":\"1) 밀접한 대체재(close substitutes)의 존재 여부; 2) 시장 구조(독점 또는 과점적 경쟁); 3) 소비자 예산에서 차지하는 비중(share of budget); 4) 상품/서비스의 성격(예: 필수재(necessity)인지 고급재/사치재(luxury good)인지).\"},{\"id\":59,\"question\":\"대체효과(substitution effect)와 소득효과(income effect)의 차이는 무엇인가?\",\"answer\":\"대체효과는 가격이 오르거나 내릴 때 수요가 같은 범주의 다른 상품으로 이동하는 지출 구성의 변화이다. 소득효과는 가격 변화가 실질 구매력에 직접 영향을 미쳐, 마치 국내 소득이 변한 것처럼 수요량이 변하는 것이다(고급재/사치재의 소득효과는 크고, 필수재의 소득효과는 작다).\"},{\"id\":60,\"question\":\"마샬-러너 조건이 충족되더라도 \\\"J커브(J-curve) 효과\\\"는 왜 발생할 수 있는가?\",\"answer\":\"소비자/수출업체의 주문-배송 간 시차(delivery lags) 때문에, 통화 가치 하락 이후 처음에는 (이전에 합의된 계약에 따라) 수입 비용이 오히려 증가하여 무역수지가 먼저 악화되었다가, 이후(수요가 새로운 가격에 적응하면서) 개선된다 — 또한 단기 탄력성이 마샬-러너 조건을 충족하지 못하지만 장기 탄력성은 충족하는 경우에도 이런 현상이 나타날 수 있다.\"},{\"id\":61,\"question\":\"흡수 접근법(absorption approach)은 무역수지를 어떻게 결정하는가?\",\"answer\":\"무역수지 = 소득(GDP) − 국내 지출(absorption). 통화 가치 하락은 소득을 지출보다 더 많이 증가시킴으로써(또는 저축을 투자보다 더 많이 증가시킴으로써) 무역수지를 흑자 방향으로 이동시킬 수 있다.\"},{\"id\":62,\"question\":\"경제가 완전고용(full employment) 상태에 있을 때, 통화 가치 하락이 무역수지를 더 이상 개선시키지 못하는 이유는 무엇인가?\",\"answer\":\"국내 지출이 줄어들지 않는다면, 통화 가치 하락은 국내 물가수준을 끌어올려(상승 압력) 환율 변화가 가져오는 자극 효과를 상쇄시키고, 무역수지는 원래 수준으로 되돌아간다. 지출을 줄이는 핵심 메커니즘은 \\\"부(富)의 효과(wealth effect)\\\"이다 — 통화가 약세가 되면 자국통화로 표시한 자산의 구매력이 줄어들어 가계는 지출을 줄이고 저축을 늘린다.\"},{\"id\":63,\"question\":\"흡수 접근법에 따르면, 통화 가치 하락은 어떤 조건에서 무역수지를 지속적으로 해결할 수 있는가?\",\"answer\":\"경제에 유휴생산능력(excess capacity)이 있는 경우, 통화 가치 하락은 수요를 국내 상품/서비스로 이동시켜 소득/생산을 증가시킨다. 증가한 소득의 일부는 저축되므로 소득이 지출보다 더 많이 늘어나 무역수지가 개선된다. 그러나 구조적인(만성적인) 불균형을 해결하기 위해서는 지출/저축 행태를 실질적으로 변화시키는 조치(재정정책, 실질금리 상승 등)가 필요하다.\"}]}]}]\n"])</script><script>self.__next_f.push([1,"12:I[75181,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"],\"default\"]\n13:I[14677,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"],\"default\"]\n14:I[2971,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"10:[\"$\",\"$L12\",null,{\"formats\":\"$undefined\",\"locale\":\"ko\",\"messages\":{\"nav\":{\"home\":\"홈\",\"features\":\"기능\",\"subjects\":\"과목\",\"contact\":\"문의\"},\"hero\":{\"tagline\":\"학생들을 위해\",\"title\":\"더 짧은 시간에\\n더 많이 배우세요\",\"subtitle\":\"바쁜 학생을 위한 플래시카드와 퀴즈. 한 번에 하나의 개념, 즉각적인 피드백, 진도 추적.\",\"ctaStart\":\"무료로 시작하기\",\"flashcardsLink\":\"플래시카드 시작\",\"ctaBrowse\":\"과목 둘러보기\"},\"features\":{\"title\":\"시험 준비에 필요한 모든 것\",\"subtitle\":\"빠른 결과를 원하는 학생을 위한 도구.\",\"flashcardsTitle\":\"플래시카드\",\"flashcardsDesc\":\"하나의
