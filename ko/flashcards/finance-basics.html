행\\\"(몽골 무역산업은행)은 언제 설립되었나요?\",\"answer\":\"1924년 6월 2일입니다.\"},{\"id\":6,\"question\":\"금융시스템이란 무엇인가요?\",\"answer\":\"한 나라의 경제 안에서 화폐자금을 조성·배분·이용하는 것과 관련된 기관, 시장, 규제, 수단들의 총체적 구조입니다.\"},{\"id\":7,\"question\":\"금융시장이란 무엇인가요?\",\"answer\":\"여유자금이 있는 부문에서 자금이 필요한 부문으로 직접적으로 또는 간접적으로 자금을 이전시키는 메커니즘을 가진 시장(예: 채권, 주식이 거래되는 시장)입니다.\"},{\"id\":8,\"question\":\"금융기관은 어떤 핵심적인 역할을 수행하나요?\",\"answer\":\"자금을 축적하는 주체(예금자)와 자금이 필요한 주체(차입자) 사이에서 금융 중개 역할을 수행하며, 자원을 효율적으로 배분합니다.\"},{\"id\":9,\"question\":\"가계 재무설계의 주요 단계는 무엇인가요?\",\"answer\":\"수입·지출 예산 수립, 저축·자산 축적, 대출·부채 관리, 위험으로부터의 보호(보험), 투자계획 수립입니다.\"},{\"id\":10,\"question\":\"금융 규제의 주된 목적은 무엇인가요?\",\"answer\":\"금융시스템의 안정성을 확보하고, 예금자·투자자의 권익을 보호하며, 시장의 투명성과 공정성을 확립하는 것입니다.\"},{\"id\":11,\"question\":\"중앙은행 통화정책의 주된 목표는 무엇인가요?\",\"answer\":\"물가안정(인플레이션을 목표 수준으로 유지), 금융시스템의 안정성 확보, 경제성장 지원입니다.\"},{\"id\":12,\"question\":\"뮤추얼펀드(mutual fund)란 무엇인가요?\",\"answer\":\"여러 투자자의 자금을 모아 전문 운용사의 관리 하에 다양한 유가증권에 투자하는 금융기금/기관입니다.\"},{\"id\":13,\"question\":\"투자은행(investment bank)은 상업은행과 어떻게 다른가요?\",\"answer\":\"투자은행은 예금을 받지 않으며, 기업의 증권 발행, 인수합병(M\u0026A) 자문, 인수(underwriting) 등의 서비스를 제공합니다. 상업은행은 예금을 받고 대출을 실행합니다.\"},{\"id\":14,\"question\":\"단기금융시장(money market)이란 무엇인가요?\",\"answer\":\"만기 1년 이하이며 유동성이 높은 금융상품(예: 단기 채권, 기업어음, 환매조건부채권(RP) 등)이 거래되는 시장입니다.\"},{\"id\":15,\"question\":\"채권(bond)이란 무엇인가요?\",\"answer\":\"발행자(정부, 기업)가 일정 기간 동안 확정된 이자를 지급하고 만기 시 원금을 상환할 것을 약속하는 채무증권입니다.\"},{\"id\":16,\"question\":\"주주(shareholder)는 채권자(bondholder)와 어떻게 다른가요?\",\"answer\":\"주주는 회사의 공동소유주로서 배당을 받을 권리가 있지만 위험이 큽니다. 채권자는 회사에 자금을 빌려준 채권자로서 고정된 이자수익을 얻으며, 회사가 청산될 경우 주주보다 먼저 변제받습니다.\"},{\"id\":17,\"question\":\"외환시장(forex)은 어떤 역할을 하는 시장인가요?\",\"answer\":\"각국의 통화를 서로 사고팔며 환율을 결정하는, 세계에서 가장 규모가 큰 금융시장입니다.\"},{\"id\":18,\"question\":\"정부 예산 수입의 주요 원천은 무엇인가요?\",\"answer\":\"조세수입(소득세, 부가가치세, 관세 등), 비조세수입(국유재산 수익, 벌금, 수수료), 원조, 차입금입니다.\"},{\"id\":19,\"question\":\"재정적자(budget deficit)란 무엇인가요?\",\"answer\":\"정부의 지출이 수입을 초과하는 상태, 즉 국가 재정의 마이너스 잔액을 말하며 대개 국내외 차입으로 조달됩니다.\"},{\"id\":20,\"question\":\"사회보험제도의 목적은 무엇인가요?\",\"answer\":\"국민을 노령, 근로능력 상실, 실업, 질병 등 미래의 위험으로부터 연금, 급여, 건강보험 등을 통해 보호하고 소득을 평준화하는 사회보장 체계입니다.  ---  ## 추가 플래시카드 50개 (21-70)\"},{\"id\":21,\"question\":\"금융시장을 상품(거래대상)에 따라 분류하면 어떤 유형이 있나요?\",\"answer\":\"상품시장, 보험시장, 유가증권시장(단기금융시장과 자본시장 포함), 외환시장, 파생상품(선물·옵션 등)시장입니다.\"},{\"id\":22,\"question\":\"발행시장(primary market)과 유통시장(secondary market)의 차이는 무엇인가요?\",\"answer\":\"발행시장은 새로운 유가증권이 처음으로 발행·거래되는 시장이고, 유통시장은 이미 발행된 유가증권을 투자자들이 서로 다시 사고파는 시장입니다.\"},{\"id\":23,\"question\":\"거래소시장과 장외시장(OTC)의 차이는 무엇인가요?\",\"answer\":\"거래소시장은 증권거래소를 통해 조직적으로 거래되는 시장이고, 장외시장은 거래소를 거치지 않고 대규모 정보망을 통해 비조직적으로 거래되는 시장입니다.\"},{\"id\":24,\"question\":\"금융시장에 참여하는 3대 주체는 누구인가요?\",\"answer\":\"투자자(개인, 기업, 정부 — 자금 여유 측), 자금조달자(기업, 지방자치단체 등 — 자금 부족 측), 중개기관(은행, 브로커, 딜러, 인수기관, 증권거래소)입니다.\"},{\"id\":25,\"question\":\"금융시장이 수행하는 5가지 주요 기능(목적)은 무엇인가요?\",\"answer\":\"위험 감소, 중개 기능 수행, 부의 증대, 자금조달 창출, 지급능력(유동성) 확보입니다.\"},{\"id\":26,\"question\":\"저축대출조합(ХЗХ)이란 무엇인가요?\",\"answer\":\"특별 허가를 받아 오직 자신의 조합원에게만 저축·대출 서비스를 제공하는, 조합원 소유의 비영리 금융기관입니다.\"},{\"id\":27,\"question\":\"신용보증기금(ЗБДС)은 어떤 역할을 하나요?\",\"answer\":\"담보가 부족한 중소 생산업체에게 대출보증을 제공하고 그 대가로 보증수수료를 받는 비영리 기관입니다.\"},{\"id\":28,\"question\":\"투자펀드(ХОС)는 누가 운용하나요?\",\"answer\":\"금융감독위원회(СЗХ)로부터 인가를 받은 투자운용회사(ХОМК)가 계약에 따라 투자펀드의 자산을 운용합니다.\"},{\"id\":29,\"question\":\"농산물거래소(ХААБ)는 어떤 역할을 하나요?\",\"answer\":\"원산지·품질 증명서를 갖추고 기준을 충족한 농축산 원자재를 통합 정보망을 통해 시장가격으로 거래할 수 있게 해주는 통합 거래센터입니다.\"},{\"id\":30,\"question\":\"상업은행의 3대 핵심 기능은 무엇인가요?\",\"answer\":\"저축(예금) 축적 기능, 신용창조(대출) 기능, 지급결제(서비스) 기능입니다.\"},{\"id\":31,\"question\":\"2025년 기준 몽골에는 몇 개의 상업은행이 영업 중인가요?\",\"answer\":\"총 12개 상업은행(국영 1개 \\\"State Bank\\\", 민영 11개)이 1,400여 개 지점·영업점을 운영하고 있습니다.\"},{\"id\":32,\"question\":\"몽골에서 은행에 요구되는 자기자본비율(CAR)의 최저 기준은 얼마인가요?\",\"answer\":\"위험가중자산 대비 총자기자본비율이 12% 이상이어야 하며(기본자본비율은 9% 이상), 이를 충족해야 합니다.\"},{\"id\":33,\"question\":\"비은행금융기관(ББСБ)은 어떤 업무를 수행하나요?\",\"answer\":\"금융감독위원회의 인가를 받아 자기 소유주의 자금으로 대출을 실행하고, 외환거래, 지급결제, 송금, 팩토링, 금융리스 등의 업무를 수행하는 영리 기관입니다.\"},{\"id\":34,\"question\":\"가계소득은 빈도에 따라 어떤 2가지로 나뉘나요?\",\"answer\":\"매월 동일한 금액으로 들어오는 고정소득(급여 등)과 매월 금액이 달라지는 변동소득(상여금, 포상금 등)입니다.\"},{\"id\":35,\"question\":\"개인(가계) 대차대조표의 자산 항목과 부채 항목은 각각 무엇을 나타내나요?\",\"answer\":\"자산 항목은 돈이 어디에 어떤 형태로 보유되어 있는지(예금, 부동산, 주식 등)를 나타내고, 부채 항목은 그 자금의 원천, 즉 채무(대출, 기타 미지급금)를 나타냅니다. 자산 − 부채 = 순자산입니다.\"},{\"id\":36,\"question\":\"몽골은행이 몽골인민공화국의 국립은행이 되어 중앙은행 기능을 수행하기 시작한 해는 언제인가요?\",\"answer\":\"1954년입니다.\"},{\"id\":37,\"question\":\"몽골의 이원적(2단계) 은행제도는 언제 확립되었나요?\",\"answer\":\"1990년 \\\"상업은행 설립 및 운영에 관한 일반규정\\\"과 1991년 \\\"은행법\\\"이 제정되면서 1990~1991년에 확립되었습니다.\"},{\"id\":38,\"question\":\"중앙은행과 상업은행의 가장 근본적인 차이는 무엇인가요?\",\"answer\":\"몽골은행은 국가가 설립한 비영리기관으로 화폐를 발행하고 통화정책을 수립·집행합니다. 반면 상업은행은 주주에게 책임을 지는 영리기관으로 통화정책을 수립하지 않습니다.\"},{\"id\":39,\"question\":\"몽골은행의 주요 목표는 무엇인가요?\",\"answer\":\"국가 통화인 투그릭(tugrik)의 안정, 즉 지속적으로 낮은 인플레이션을 유지하는 것입니다.\"},{\"id\":40,\"question\":\"몽골은행이 사용하는 통화정책의 3대 수단은 무엇인가요?\",\"answer\":\"단기(정책) 금리 조정, 지급준비율 조정, 공개시장조작입니다.\"},{\"id\":41,\"question\":\"\\\"정책금리(기준금리)\\\"란 무엇인가요?\",\"answer\":\"상업은행이 7일 만기로 몽골은행에 자금을 예치할 때 받는 금리(정부/중앙은행 증권 금리)로서, 은행 간 시장금리와 예금·대출 금리를 결정하는 핵심 기준금리입니다.\"},{\"id\":42,\"question\":\"정책금리가 인상되면 어떤 결과가 나타나나요?\",\"answer\":\"상업은행들이 대출보다 몽골은행에 안전하게 자금을 예치하려는 유인이 커져 대출이 감소하고, 그 결과 인플레이션이 하락하는 경향이 나타납니다.\"},{\"id\":43,\"question\":\"몽골은행의 기능을 최소 4가지 이상 말해 보세요.\",\"answer\":\"화폐 발행, 통화정책 수립·집행, 정부의 재정대리인 역할 수행, 은행 감독, 은행 간 지급결제 조직, 국가 외환보유고 관리, 예금자 권익 보호, 거시건전성정책 시행입니다.\"},{\"id\":44,\"question\":\"뮤추얼펀드가 투자자를 끌어들이는 5가지 주요 장점은 무엇인가요?\",\"answer\":\"유동성 중개(환금성), 소액투자 중개(소액자금으로 고가의 증권 매수 가능), 분산투자(디버시피케이션), 비용 절감 효과, 전문 운용 능력입니다.\"},{\"id\":45,\"question\":\"개방형(open-end)펀드와 폐쇄형(closed-end)펀드의 차이는 무엇인가요?\",\"answer\":\"개방형펀드는 투자자가 원할 때 언제든지 환매(재매수)해 주므로 규모에 제한 없이 성장할 수 있고, 폐쇄형펀드는 최초 발행 시 정해진 수의 지분만 발행한 후 이후에는 유통시장에서만 거래됩니다.\"},{\"id\":46,\"question\":\"뮤추얼펀드의 순자산가치(NAV)란 무엇인가요?\",\"answer\":\"펀드가 보유한 총자산(주식, 채권, 현금)의 가치에서 부채를 뺀 금액을 발행 지분 수로 나눈 값입니다.\"},{\"id\":47,\"question\":\"보험회사는 왜 이익을 얻나요?\",\"answer\":\"예상 보험금(claims) 지급과 회사의 이익을 충당하기에 충분한 수준의 보험료(premium)를 받기 때문입니다.\"},{\"id\":48,\"question\":\"재보험(reinsurance)이란 무엇인가요?\",\"answer\":\"보험회사가 인수한 위험의 일부를 보험료의 일부와 함께 다른 보험회사에 이전하는 방식으로, 이를 통해 더 큰 규모의 보험계약을 인수할 수 있게 됩니다.\"},{\"id\":49,\"question\":\"연금제도의 2가지 주요 유형은 무엇인가요?\",\"answer\":\"확정급여형(defined-benefit) — 고용주가 연금 지급액을 확정적으로 약속하는 방식과, 확정기여형(defined-contribution) — 적립금만 정해져 있고 최종 연금액은 펀드의 운용수익에 따라 달라지는 방식입니다.\"},{\"id\":50,\"question\":\"생명보험은 어떤 역할을 하나요?\",\"answer\":\"피보험자가 사망했을 경우 그에게 의존하던 수익자(beneficiary)에게 소득을 제공하여 재정적 보호를 해줍니다.\"},{\"id\":51,\"question\":\"단기금융시장에서 거래되는 금융상품의 예를 들어 보세요.\",\"answer\":\"국고채·상업어음, 양도성예금증서(CD), 은행 간 예치금, 기업어음(CP), 은행인수어음, 단기 국채, 유로달러 등입니다.\"},{\"id\":52,\"question\":\"차익거래(arbitrage)란 무엇인가요?\",\"answer\":\"서로 다른 두 시장, 상품 또는 시점 사이에 발생한 가격 또는 금리 차이를 이용하여 (대개 위험 없이) 이익을 얻는 거래 행위입니다.\"},{\"id\":53,\"question\":\"헤징(hedging)이란 무엇인가요?\",\"answer\":\"자산·부채의 가치나 현금흐름을 미래의 부정적 변화로부터 보호하기 위해 파생상품을 이용해 위험을 줄이는 방법입니다.\"},{\"id\":54,\"question\":\"고정환율제와 자유변동환율제의 핵심 차이는 무엇인가요?\",\"answer\":\"고정환율제에서는 중앙은행이 환율을 일정하게 유지하기 위해 적극 개입해야 하며 막대한 외환보유고가 필요합니다. 자유변동환율제에서는 환율이 시장에서 자유롭게 변동하고 중앙은행이 개입하지 않으므로 통화정책을 독자적으로 운용할 수 있습니다.\"},{\"id\":55,\"question\":\"직접개입과 간접개입의 차이는 무엇인가요?\",\"answer\":\"직접개입은 중앙은행이 직접 외환을 매매하여 환율에 즉각적이고 빠르게 영향을 미치는 방식이고, 간접개입은 정책금리·지급준비율 등의 정책수단을 이용해 환율에 간접적·점진적으로 영향을 미치는 방식입니다.\"},{\"id\":56,\"question\":\"선물(futures)과 선도(forward) 계약의 주요 차이는 무엇인가요?\",\"answer\":\"선도계약은 거래소를 거치지 않고 당사자끼리 협의한 비표준화된 조건으로 체결되며, 선물계약은 거래소를 통해 거래되는 표준화된 계약으로 거래소가 결제불이행 위험을 보증합니다.\"},{\"id\":57,\"question\":\"옵션(option) 계약이란 무엇인가요?\",\"answer\":\"특정 자산을 미래에 약정된 가격으로 매수할 권리(콜옵션) 또는 매도할 권리(풋옵션)를 — 의무가 아닌 권리로서 — 보유자에게 부여하는 계약입니다.\"},{\"id\":58,\"question\":\"스왑(swap) 거래란 무엇인가요?\",\"answer\":\"오늘의 환율(또는 시세)로 통화·귀금속을 매도(또는 매수)함과 동시에, 미래의 약정된 환율로 이를 다시 매수(또는 매도)하기로 하는 두 거래를 동시에 실행하는 계약입니다.\"},{\"id\":59,\"question\":\"몽골의 통합예산은 어떤 4가지 예산으로 구성되나요?\",\"answer\":\"국가예산, 사회보험기금 예산, 건강보험기금 예산, 지방예산입니다.\"},{\"id\":60,\"question\":\"통합예산 중 국가예산이 차지하는 비중은 대략 얼마인가요?\",\"answer\":\"약 80%입니다.\"},{\"id\":61,\"question\":\"재정안정화기금의 목적은 무엇인가요?\",\"answer\":\"세계시장의 광물자원 가격 변동으로 인한 예산수입의 변동성을 완화하기 위해 2011년에 설립된 기금입니다.\"},{\"id\":62,\"question\":\"미래유산기금(Future Heritage Fund)의 목적은 무엇인가요?\",\"answer\":\"재생 불가능한 광물자원에서 얻은 소득을 현세대와 미래세대에게 균형 있게 배분하기 위해 2017년에 설립된 기금입니다.\"},{\"id\":63,\"question\":\"조세, 부담금, 수수료의 차이는 무엇인가요?\",\"answer\":\"조세는 소득·재산·재화·용역에 대해 직접적인 반대급부 없이 부과되고, 부담금은 국가 소유의 천연자원 이용이나 오염 발생에 대해 부과되며, 수수료는 국가기관이 제공하는 서비스에 대한 대가로 부과됩니다.\"},{\"id\":64,\"question\":\"직접세와 간접세의 차이는 무엇인가요?\",\"answer\":\"직접세는 소득에 대해 부과됩니다(예: 소득세). 간접세는 용역·판매에 대해 부과됩니다(예: 부가가치세).\"},{\"id\":65,\"question\":\"경상지출과 자본지출의 차이는 무엇인가요?\",\"answer\":\"경상지출은 매년 반복되며 영구적인 자산을 형성하지 않습니다(급여, 연금, 보조금 등). 자본지출은 일회성이며 금액이 크고 국가의 자산을 증대시키며 여러 해에 걸쳐 사용됩니다(건물, 장비 등).\"},{\"id\":66,\"question\":\"사회보험의 5가지 유형을 말해 보세요.\",\"answer\":\"연금보험, 급여(수당)보험, 건강보험, 산업재해 및 직업병보험, 실업보험입니다.\"},{\"id\":67,\"question\":\"보통주 주주가 갖는 권리는 무엇인가요?\",\"answer\":\"회사 지분의 공동소유자가 되는 것, 배당을 받을 권리, 회사의 의사결정에 대한 의결권, 주가 상승으로 인한 시세차익, 원할 때 언제든지 매매할 수 있는 권리입니다.\"},{\"id\":68,\"question\":\"우선주(preferred stock)는 보통주와 어떻게 다른가요?\",\"answer\":\"우선주 주주는 고정된 배당을 우선적으로 받을 권리가 있으며, 회사 청산 시 보통주 주주보다 먼저 변제받지만 대체로 의결권이 없습니다.\"},{\"id\":69,\"question\":\"주식 평가에서 \\\"고평가(overvalued)\\\"란 무슨 뜻인가요?\",\"answer\":\"주식의 내재가치(적정가치)가 현재 시장가격보다 낮은 상태, 즉 시장가격이 내재가치를 초과한 상태를 말합니다.\"},{\"id\":70,\"question\":\"콜옵션부채권(callable bond)과 풋옵션부채권(putable bond)의 차이는 무엇인가요?\",\"answer\":\"콜옵션부채권은 발행자가 조기에 상환(매수)할 수 있는 권리를 가진 채권으로(대개 저렴하며, 금리하락 위험으로부터 발행자를 보호), 풋옵션부채권은 채권보유자가 조기에 매도할 수 있는 권리를 가진 채권입니다(대개 프리미엄이 붙어 비싸며, 시장 하락으로부터 보유자를 보호).\"}]}]\n"])</script><script>self.__next_f.push([1,"12:I[75181,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"
