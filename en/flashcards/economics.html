ined?\",\"answer\":\"The bid is the price at which the dealer is willing to buy the base currency (the lower value), and the offer is the price at which the dealer is willing to sell the base currency (the higher value). Because the bank buys low and sells high, the bid is always less than the offer.\"},{\"id\":16,\"question\":\"To how many decimal places are spot rates typically quoted in the professional FX market, and what is the notable exception?\",\"answer\":\"Most professional spot rates are quoted to 4 decimal places. The yen (JPY) is a notable exception — it is quoted to 2 decimal places, because the number of yen units is already relatively large compared with other currencies.\"},{\"id\":17,\"question\":\"If the USD/EUR rate rises from 1.1500 to 1.2000, by what percentage has the euro appreciated against the US dollar, and can we say the dollar has depreciated against the euro by the same percentage?\",\"answer\":\"(1.2000/1.1500) − 1 = 4.35% — this is the euro's appreciation against the dollar. No, it is not equal: inverting the quote (EUR/USD) gives (1/1.2000)/(1/1.1500) − 1 = −4.17%, because reciprocals are not symmetric.\"},{\"id\":18,\"question\":\"What is the general principle for calculating a cross rate using two exchange rates involving three currencies? Give an example.\",\"answer\":\"The rates must be multiplied so that the intermediate currency cancels out: CAD/USD × USD/EUR = CAD/EUR. For example, if CAD/USD = 1.3020 and USD/EUR = 1.1701, then 1.3020 × 1.1701 = 1.5235 CAD per EUR.\"},{\"id\":19,\"question\":\"If calculating a cross rate requires inverting one of the rates so the intermediate currency cancels out, how is this done? Give an example.\",\"answer\":\"To multiply CAD/USD by JPY/USD, first invert CAD/USD to get USD/CAD: (CAD/USD)^(-1) × JPY/USD = USD/CAD × JPY/USD = JPY/CAD. For example, if CAD/USD = 1.3020, its inverse is 0.7680; 0.7680 × 111.94 = 85.97 JPY per CAD.\"},{\"id\":20,\"question\":\"What is triangular arbitrage?\",\"answer\":\"If a dealer's quoted cross rate deviates from the theoretical rate implied by the underlying rates, a trader can buy a currency cheaply and sell it dear through a third currency, earning a riskless profit. Such discrepancies (involving three currencies, hence \\\"tri-\\\") do not persist for long in the market because traders and algorithmic systems monitor them constantly.\"},{\"id\":21,\"question\":\"In a USD/GBP quote, which currency is the price currency and which is the base currency, and how do you determine whether this is a direct or indirect quote?\",\"answer\":\"In a USD/GBP quote, USD is the price currency and GBP is the base currency. If the user of the quote is in the United Kingdom, this is an indirect quote (GBP, the domestic currency, is the base currency); but for a user in the United States, this is a direct quote (USD, the domestic currency, is the price currency) — it depends entirely on the user's location.\"},{\"id\":22,\"question\":\"What is the conventional hierarchy for which currency serves as the base currency in professional market quotes — among EUR, GBP, USD, and AUD/NZD?\",\"answer\":\"In any quote involving EUR, EUR is always the base currency (e.g., GBP/EUR). In a quote involving GBP (but not EUR), GBP is the base currency (e.g., USD/GBP). In a quote involving USD (but not GBP or EUR), USD is the base currency (e.g., CAD/USD). The exception is that AUD and NZD serve as the base currency when paired with USD (USD/AUD, USD/NZD).\"},{\"id\":23,\"question\":\"How would a spot quote of 18.8590 MXN/USD be classified as a \\\"direct quote\\\" from the perspective of a Mexican customer?\",\"answer\":\"A direct quote makes the domestic currency the price currency and the foreign currency the base currency. In the MXN/USD quote, MXN is the price currency, so for a Mexican customer this is a direct quote (meaning it costs 18.8590 pesos to buy one US dollar).  ## Forward Calculations\"},{\"id\":24,\"question\":\"What are \\\"forward points\\\" (pips), and how are they calculated?\",\"answer\":\"Forward points are the difference between the forward rate and the spot rate, expressed on a scale tied to the last decimal place of the spot quote. For example, if the USD/EUR spot rate is 1.15885 and the 1-year forward rate is 1.19532, then: 1.19532 − 1.15885 = +0.03647, × 10,000 = +364.7 points (for the yen, multiply by 100).\"},{\"id\":25,\"question\":\"How are forward premium and forward discount defined?\",\"answer\":\"If the forward rate is higher than the spot rate (positive points), the base currency is said to trade at a forward premium. If the forward rate is lower than the spot rate (negative points), the base currency is said to trade at a forward discount. If the base currency is at a premium, the price currency is automatically at a discount.\"},{\"id\":26,\"question\":\"What is the formula for combining forward points with the spot rate to obtain the forward rate? Give an example.\",\"answer\":\"Spot rate + (points/10,000) = forward rate (divide by 100 for the yen). For example, if the 3-month points are +80.9: 1.15885 + (80.9/10,000) = 1.15885 + 0.00809 = 1.16694.\"},{\"id\":27,\"question\":\"What is covered interest rate parity, and how is the arbitrage equation written (in the f/d quote convention)?\",\"answer\":\"It is an arbitrage relationship stating that the riskless return from two approaches — investing domestically at the domestic interest rate, versus converting to the foreign currency, investing at the foreign interest rate, and converting back via a forward contract — must be equal: (1 + i_d) = S_f/d(1 + i_f)(1/F_f/d).\"},{\"id\":28,\"question\":\"How is the arbitrage equation above rearranged to solve for the forward rate?\",\"answer\":\"F_f/d = S_f/d × [(1 + i_f)/(1 + i_d)]. For example, if S_f/d = 1.6535, i_d = 3.50%, and i_f = 5.00%, then: F_f/d = 1.6535 × (1.0500/1.0350) = 1.6775.\"},{\"id\":29,\"question\":\"How is the forward rate expressed as a percentage of the spot rate (i.e., the percentage premium/discount)?\",\"answer\":\"F_f/d / S_f/d = (1 + i_f)/(1 + i_d). In the f/d quote convention, this means that when the foreign interest rate is higher than the domestic rate, the forward rate stands at a premium to the spot rate.\"},{\"id\":30,\"question\":\"When a currency's interest rate is higher, does that currency trade at a forward premium or a forward discount?\",\"answer\":\"Regardless of the quote convention, the currency with the higher interest rate trades at a DISCOUNT in the forward market, while the currency with the lower interest rate trades at a PREMIUM.\"},{\"id\":31,\"question\":\"Can the forward rate be interpreted as the expected future spot rate, and what formula results from this interpretation?\",\"answer\":\"If we assume F_t = S_t+1, then: (S_t+1/S_t) − 1 = %ΔS_t+1 = (i_f − i_d)/(1 + i_d). However, this interpretation must be used with caution — historically, the forward rate has proven to be a poor predictor of the future spot rate, because forecast errors have been quite large.\"},{\"id\":32,\"question\":\"What is the more general swap points formula that incorporates the time fraction τ?\",\"answer\":\"F_f/d − S_f/d = S_f/d × [(i_f − i_d)/(1 + i_d·τ)] × τ, where τ is the fraction of the period over which the interest rates are quoted (e.g., for 30 days, τ = 30/360).\"},{\"id\":33,\"question\":\"How does the size of forward points relate to maturity and the interest rate differential?\",\"answer\":\"Forward points are directly proportional to the spot rate and the interest rate differential (i_f − i_d), and are roughly (though not exactly) proportional to the maturity of the forward contract (τ). As maturity lengthens or the interest rate differential widens, the absolute number of points increases.\"},{\"id\":34,\"question\":\"What day count convention is used for LIBOR deposits?\",\"answer\":\"Actual/360 — interest is calculated assuming 360 days in a year, while the actual number of days the deposit is held is used in the calculation.  ## Exchange Rate Regimes\"},{\"id\":35,\"question\":\"Conceptually, what three characteristics should an \\\"ideal currency regime\\\" have, and why is such a regime impossible in practice?\",\"answer\":\"1) The exchange rate between two currencies is credibly fixed; 2) all currencies are fully convertible; 3) each country has full independence to pursue its own national monetary policy. These three are incompatible — if the exchange rate is fixed and currencies are fully convertible, independent monetary policy becomes impossible (this is the policy \\\"impossible trinity\\\").\"},{\"id\":36,\"question\":\"Under a credibly fixed exchange rate with full convertibility, why does an attempt to pursue expansionary domestic monetary policy fail?\",\"answer\":\"If policymakers try to lower the domestic interest rate below that of the other country, an essentially unlimited amount of capital will flow out until equilibrium interest rates are restored. To defend the exchange rate, the central bank must sell foreign currency and buy domestic currency, depleting its reserves, shrinking the money supply, pushing domestic interest rates back up, and ultimately defeating the original expansionary policy.\"},{\"id\":37,\"question\":\"Under a floating exchange rate regime, how does a decline in the domestic interest rate reinforce monetary policy?\",\"answer\":\"As the interest rate falls, the domestic currency becomes less attractive and depreciates to some degree in the payments market — this raises demand for domestic goods (exports rise and imports fall), thereby reinforcing the expansionary effect of the original interest rate cut.\"},{\"id\":38,\"question\":\"What mechanism did the classical gold standard operate through?\",\"answer\":\"The price-specie-flow mechanism — a country running a trade surplus accumulates gold, which increases its money supply, raises prices, and reduces exports; a country running a trade deficit sees gold flow out, its money supply shrink, prices fall, and exports rise.\"},{\"id\":39,\"question\":\"What was the Bretton Woods system, and why did it collapse?\",\"answer\":\"It was a fixed exchange rate system with periodic realignments, developed by Keynes and Harry Dexter White during World War II and adopted by 44 countries in 1944. The system collapsed in the early 1970s amid rapid and unstable inflation.\"},{\"id\":40,\"question\":\"How did the 1992 speculative attack on the British pound within the European Exchange Rate Mechanism (ERM) unfold?\",\"answer\":\"The United Kingdom wanted to lower its interest rate during a recession, while Germany raised its interest rate to help finance the costs of reunification. As a result, capital shifted from sterling into the mark, and the UK was unable to defend sterling's exchange rate, forcing it to exit the ERM and devalue the pound (September 1992).\"},{\"id\":41,\"question\":\"As of 2008, into how many categories did the IMF classify exchange rate regimes, and what were they called?\",\"answer\":\"Eight: exchange arrangements with no separate legal tender (dollarization, monetary union), currency board arrangements, fixed (conventional) parity, target zones, crawling pegs, crawling bands, managed float, and independently floating rates.\"},{\"id\":42,\"question\":\"What is dollarization, and what disadvantage does it carry?\",\"answer\":\"Dollarization is the use of another country's currency (most often the US dollar) as a country's own medium of exchange and unit of account. The country \\\"borrows\\\" the credibility of the foreign currency, but not the creditworthiness of the country that issues it. The country also loses the ability to conduct its own monetary policy, along with its seigniorage income.\"},{\"id\":43,\"question\":\"In a monetary union (such as the EMU), how is monetary policy for member countries determined?\",\"answer\":\"A member country cannot pursue independent monetary policy; instead, a common monetary policy is jointly determined through representation at a central bank (such as the European Central Bank, ECB). The 2010 EMU sovereign debt crisis showed that a monetary union does not by itself guarantee the creditworthiness of any one member.\"},{\"id\":44,\"question\":\"What is a currency board system (CBS), and how does Hong Kong SAR's example work?\",\"answer\":\"A CBS is a legally mandated commitment to convert domestic currency into a foreign currency at a fixed rate, with domestic currency issued only to the extent it is backed by foreign reserves. Hong Kong SAR has maintained an HKD/USD parity of 7.80, backed by USD reserves, since 1983, with the HKMA limiting speculative fluctuations within a band.\"},{\"id\":45,\"question\":\"What is seigniorage, and why does a currency board system have an advantage over dollarization in this respect?\",\"answer\":\"Seigniorage is the profit earned from issuing money in excess of the cost of producing it. Under a currency board system, the monetary authority earns seigniorage by maintaining a low-yielding monetary base while holding higher-yielding foreign reserves; under dollarization, this profit instead accrues to the country that issues the foreign currency.\"},{\"id\":46,\"question\":\"Why is a simple fixed parity regime less credible than a currency board system (CBS)?\",\"answer\":\"A fixed parity regime carries no legal guarantee (a country can abandon its parity), and the target level of foreign reserves is not strictly tied to the domestic money supply — it is discretionary. Parity is typically maintained within a band of up to ±1%, with the monetary authority intervening using reserves to keep the rate within that band.\"},{\"id\":47,\"question\":\"How does a target zone regime differ from a simple fixed parity?\",\"answer\":\"A target zone is a fixed parity with a wider band (up to ±2%), which gives the monetary authority greater room to pursue discretionary policy.\"},{\"id\":48,\"question\":\"What is the difference between the active and passive forms of a crawling peg?\",\"answer\":\"A passive crawling peg adjusts the exchange rate frequently (weekly or daily) in line with inflation (as Brazil did in the 1980s). An active crawling peg pre-announces the exchange rate path for the coming weeks and adjusts it in small steps, aiming to manage inflation expectations (as in Argentina, Chile, and Uruguay).\"},{\"id\":49,\"question\":\"What is the purpose of a fixed parity with crawling bands regime?\",\"answer\":\"It first sets a parity against a foreign currency to anchor future inflation expectations, then gradually introduces greater flexibility through a pre-announced, widening band around the central parity, providing a path to gradually exit a fixed regime.\"},{\"id\":50,\"question\":\"What is a managed float (\\\"dirty floating\\\") regime?\",\"answer\":\"A country decides whether and how much to intervene in its exchange rate policy based on meeting certain domestic or external targets (such as the trade balance, price stability, or employment) — it rarely announces any explicit exchange rate target (a level or rate of change).\"},{\"id\":51,\"question\":\"What is an independently floating rate regime, and why can it be said that a \\\"pure\\\" independent float does not really exist in practice?\",\"answer\":\"It is a regime in which the exchange rate is determined by market forces, and the monetary authority is able to pursue independent monetary policy. In practice, central banks sometimes undertake coordinated shifts — for example, the 1985 Plaza Accord and the 2000 concerted intervention to support the euro.  ## Exchange Rates, Trade Balance: Elasticities and Absorption Approaches\"},{\"id\":52,\"question\":\"Describe the fundamental relationship between the trade balance and the capital account.\",\"answer\":\"A trade deficit (balance) is exactly offset by an equal capital account surplus (deficit). Any factor that affects the trade balance must have an equal and opposite effect on the capital account.\"},{\"id\":53,\"question\":\"How is the trade balance expressed in terms of macroeconomic saving and spending identities (the X-M formula)?\",\"answer\":\"X – M = (S – I) + (T – G), where X is exports, M is imports, S is private saving, I is investment, and T–G is the government's fiscal balance (taxes minus government spending). A trade surplus means a country is saving more than it needs to finance its investment.\"},{\"id\":54,\"question\":\"What are the two main approaches to analyzing the exchange rate and the trade balance (the elasticities approach vs. the absorption approach)?\",\"answer\":\"The \\\"elasticities approach\\\" measures the change in the relative price of domestic versus foreign goods, a microeconomic perspective that captures the expenditure-switching component. The \\\"absorption approach\\\" takes a macroeconomic perspective, examining how the exchange rate affects a country's overall spending and saving decisions.\"},{\"id\":55,\"question\":\"What formula is used to define the price elasticity of demand?\",\"answer\":\"ε = −(%ΔQ)/(%ΔP). If ε \u003e 1, demand is \\\"elastic\\\"; if ε \u003c 1, demand is \\\"inelastic.\\\" Since expenditure %ΔR = (1−ε)%ΔP, a price increase reduces expenditure when demand is elastic, and increases expenditure when demand is inelastic.\"},{\"id\":56,\"question\":\"What is the generalized Marshall-Lerner condition, and what does it indicate?\",\"answer\":\"ωXεX + ωM(εM – 1) \u003e 0, where ωX and ωM are the shares of exports and imports in total trade (exports + imports), and εX and εM are the price elasticities of demand for exports and imports. If this condition is satisfied, a devaluation/depreciation of the domestic currency shifts the trade balance toward surplus.\"},{\"id\":57,\"question\":\"When trade is initially balanced (ωX = ωM), what \\\"classic\\\" form does the generalized Marshall-Lerner condition take?\",\"answer\":\"εX + εM \u003e 1 — this is the classic Marshall-Lerner condition. A currency depreciation improves the trade balance when the sum of export and import demand elasticities exceeds one.\"},{\"id\":58,\"question\":\"What four factors affect the elasticity of demand for a good or service?\",\"answer\":\"1) whether close substitutes are available; 2) market structure (monopoly or oriented competition); 3) the good's share of the consumer's budget; 4) the nature of the good or service (for example, whether it is a necessity or a luxury good).\"},{\"id\":59,\"question\":\"What is the difference between the substitution effect and the income effect?\",\"answer\":\"The substitution effect is a change in spending patterns in which demand shifts toward other goods in the same category as prices rise or fall. The income effect is the change in demand quantity that results because a price change directly affects real purchasing power, acting much like a change in domestic income (the income effect is larger for luxury goods and smaller for necessities).\"},{\"id\":60,\"question\":\"Even when the Marshall-Lerner condition is satisfied, why can the \\\"J-curve\\\" effect still occur?\",\"answer\":\"Because of delivery lags between orders and delivery for consumers and exporters, import costs (under previously agreed contracts) initially rise following a depreciation, so the trade balance first WORSENS before later IMPROVING (as demand adjusts to the new prices) — this can also occur when short-run elasticities fail to satisfy the Marshall-Lerner condition even though long-run elasticities do satisfy it.\"},{\"id\":61,\"question\":\"How does the absorption approach determine the trade balance?\",\"answer\":\"Trade balance = income (GDP) − domestic spending (absorption). A currency depreciation can shift the trade balance toward surplus by raising income relative to spending (or raising saving relative to investment).\"},{\"id\":62,\"question\":\"When the economy is at full employment, why can't a currency depreciation further improve the trade balance?\",\"answer\":\"If domestic spending does not fall, the depreciation puts upward pressure on domestic prices, eroding the stimulative effect of the exchange rate change, and the trade balance returns to its original level. The main mechanism for reducing spending is the \\\"wealth effect\\\" — as the currency weakens, the purchasing power of domestic-currency-denominated wealth declines, prompting households to cut spending and increase saving.\"},{\"id\":63,\"question\":\"Under the absorption approach, how and under what conditions can a currency depreciation durably resolve the trade balance?\",\"answer\":\"When the economy has excess capacity, depreciation shifts demand toward domestic goods and services, raising income/output; since part of this additional income is saved, income rises by more than spending, improving the trade balance. However, to correct a chronic imbalance, spending and saving behavior must be genuinely changed (through fiscal policy, higher real interest rates, etc.).\"}]}]}]\n"])</script><script>self.__next_f.push([1,"12:I[75181,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"],\"default\"]\n13:I[14677,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"],\"default\"]\n14:I[2971,[\"/learning-v18/_next/static/chunks/0whnu9t5k-ij7.js\",\"/learning-v18/_next/static/chunks/01as9r5n5k.xo.js\",\"/learning-v18/_next/static/chunks/016xmq79k1zi0.js\",\"/learning-v18/_next/static/chunks/0v81ed~3pmkd3.js\",\"/learning-v18/_next/static/chunks/0.k8f3pol7-2d.js\"],\"default\"]\n"]
