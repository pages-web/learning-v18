.k8f3pol7-2d.js\",\"/learning-v18/_next/static/chunks/03~mczye1-91u.js\",\"/learning-v18/_next/static/chunks/0_it-5lolw3n7.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L11\",null,{\"subject\":\"Economics\",\"topics\":[{\"id\":\"demand-and-supply\",\"title\":\"Topics in Demand and Supply Analysis\",\"cards\":[{\"id\":1,\"question\":\"What is a demand function? Explain the example equation Qxd = f(Px, I, Py).\",\"answer\":\"A demand function expresses the quantity demanded of good X (Qxd) as a relationship depending on several variables, such as the good's own price (Px), the consumer's income (I), and the prices of other goods (Py): Qxd = f(Px, I, Py). In other words, the quantity demanded of good X depends on these variables.\"},{\"id\":2,\"question\":\"What is the law of demand?\",\"answer\":\"It is the widely accepted principle that as the price of a good rises, buyers purchase less of it, and as the price falls, they purchase more. This is what gives the demand curve its negative slope.\"},{\"id\":3,\"question\":\"In the linear demand function for gasoline, Qxd = 84.5 – 6.39Px + 0.25I – 2Py, what do the signs (negative/positive) of the coefficients indicate?\",\"answer\":\"The coefficient on Px (own price), −6.39, is negative, so a one-unit increase in price reduces quantity demanded (the law of demand). The coefficient on income (I), +0.25, is positive, so an increase in income increases demand as well (a normal good). The coefficient on the price of automobiles (Py), −2, is negative, meaning gasoline and automobiles are treated as complements.\"},{\"id\":4,\"question\":\"Why do economists specifically use the term \\\"own price\\\"?\",\"answer\":\"Economists use \\\"own price\\\" to specify the price of the good itself (X), distinguishing it from the price of another good (Y). This helps separate, within the demand function, the effect of the good's own price from the effect of other goods' prices.\"},{\"id\":5,\"question\":\"What is an inverse demand function? Explain with an example.\",\"answer\":\"An inverse demand function expresses price as a function of quantity demanded: Px = 8.92 − 0.156Qxd. The graph of this function is the demand curve, and Qx cannot exceed 57 (otherwise price would become negative).\"},{\"id\":6,\"question\":\"How is the slope of the demand curve calculated?\",\"answer\":\"The slope of the demand curve is the ratio of the change in price (ΔP) to the change in quantity (ΔQ): ΔP/ΔQ. In the example demand function (Qxd = 57 – 6.39Px), the slope is 1/(−6.39) = −0.156.\"},{\"id\":7,\"question\":\"How is elasticity generally defined, and why is it useful?\",\"answer\":\"Elasticity measures how sensitive one variable is to a change in another, expressed as a ratio of percentage changes: %Δy/%Δx. Because this measure is independent of units (liters/gallons, dollars/euros, etc.), it is well suited for comparisons across different units.  ## Types of Elasticity of Demand\"},{\"id\":8,\"question\":\"What formula defines own-price elasticity of demand, Ep (Equation 5)?\",\"answer\":\"Edp_x = (%ΔQxd)/(%ΔPx) — the ratio of the percentage change in quantity demanded to the percentage change in price.\"},{\"id\":9,\"question\":\"When Equation 5 is expanded algebraically, what form does it take (Equation 6)?\",\"answer\":\"Edp_x = (ΔQxd/ΔPx) × (Px/Qxd). Here, (ΔQxd/ΔPx) equals the slope coefficient for a linear demand function, while (Px/Qxd) depends on the particular point on the demand curve.\"},{\"id\":10,\"question\":\"In the gasoline example, if Px = €1.48 and Qxd = 47.54, what is the elasticity, and how should it be interpreted?\",\"answer\":\"E = −6.39 × (1.48/47.54) = −0.2. This means that for a 1% increase in price, quantity demanded falls by only 0.2%; since |E| \u003c 1, demand is considered inelastic.\"},{\"id\":11,\"question\":\"When the price of gasoline rises to €5 (Qxd = 25.05), what is the elasticity — is demand elastic or inelastic?\",\"answer\":\"E = −6.39 × (5/25.05) = −1.28. Since |E| \u003e 1, demand is elastic at this point.\"},{\"id\":12,\"question\":\"What criterion distinguishes elastic, inelastic, and unit (unitary) elastic demand?\",\"answer\":\"If the absolute value of the elasticity coefficient (|E|) is less than 1, demand is \\\"inelastic\\\"; if greater than 1, demand is \\\"elastic\\\"; and if it equals exactly −1, demand is \\\"unit elastic.\\\"\"},{\"id\":13,\"question\":\"What sign does own-price elasticity of demand typically have, and why?\",\"answer\":\"When the law of demand holds, own-price elasticity of demand is almost always negative, because an increase in price is associated with a decrease in quantity demanded (a negative relationship).\"},{\"id\":14,\"question\":\"How does elasticity change along a linear demand curve (the midpoint rule)?\",\"answer\":\"On a linear, negatively sloped demand curve, demand is elastic above the midpoint (high price, low quantity), inelastic below the midpoint (low price, high quantity), and unit elastic at the midpoint. This occurs because, although ΔQ/ΔP is constant, the ratio P/Q changes depending on the position along the demand curve.\"},{\"id\":15,\"question\":\"What is perfectly inelastic demand, and how does it appear graphically?\",\"answer\":\"Perfectly inelastic demand occurs when quantity demanded does not change regardless of the price level (E = 0). Graphically, this is represented by a vertical demand curve.\"},{\"id\":16,\"question\":\"What is perfectly elastic demand, and under what circumstances does it occur?\",\"answer\":\"Perfectly elastic demand occurs when the demand curve is horizontal — that is, even a slight increase in price drives demand to zero, while at the given price an unlimited quantity can be purchased (E = ∞). This describes, for example, the demand curve faced by a single seller in a perfectly competitive market (such as the wheat market).\"},{\"id\":17,\"question\":\"What are the main factors that influence the price elasticity of demand for a good?\",\"answer\":\"The number of close substitute goods (more substitutes mean greater elasticity), the good's share of the total budget (a larger share means greater elasticity), the length of time buyers have to adjust to a price change (elasticity is greater over longer periods), and whether the good is a necessity (non-discretionary) or discretionary.\"},{\"id\":18,\"question\":\"What is the relationship between elasticity and total expenditure?\",\"answer\":\"When demand is elastic, price and total expenditure move in opposite directions (a price decrease raises total expenditure). When demand is inelastic, price and total expenditure move in the same direction (a price decrease also lowers total expenditure). Total expenditure is at its maximum at the point of unit elasticity.\"},{\"id\":19,\"question\":\"If a seller's demand is inelastic at the current price, why does raising the price increase profit?\",\"answer\":\"Under inelastic demand, raising price increases total revenue, and at the same time the resulting decline in quantity sold reduces total cost. Since revenue rises and cost falls, both effects increase profit, so a profit-maximizing single-good seller will keep raising price until demand becomes elastic.\"},{\"id\":20,\"question\":\"What formula defines income elasticity of demand, EId (Equation 7)?\",\"answer\":\"EId = (%ΔQxd)/(%ΔI) — the ratio of the percentage change in quantity demanded to the percentage change in income, holding other factors constant.\"},{\"id\":21,\"question\":\"Based on the sign of income elasticity of demand, how are goods classified as \\\"normal\\\" or \\\"inferior\\\"?\",\"answer\":\"If income elasticity of demand is positive (EId \u003e 0), the good is a \\\"normal good\\\" — demand rises as income rises. If income elasticity of demand is negative (EId \u003c 0), the good is an \\\"inferior good\\\" — demand falls as income rises (examples: margarine, potatoes, cheap cuts of meat).\"},{\"id\":22,\"question\":\"How does the demand curve shift when income changes?\",\"answer\":\"For a normal good, the demand curve shifts up and to the right as income rises. For an inferior good, the demand curve shifts down and to the left as income rises.\"},{\"id\":23,\"question\":\"In the market gasoline example (Equation 11), how is an income elasticity of 0.26 interpreted?\",\"answer\":\"EId = (250)(50/47,542.8) = 0.26. A 1% increase in income raises demand for gasoline by 0.26%. Since the sign is positive, gasoline is considered a normal good (although the magnitude is small).\"},{\"id\":24,\"question\":\"What formula defines cross-price elasticity of demand (Equation 8)?\",\"answer\":\"Edp_y = (%ΔQxd)/(%ΔPy) — the ratio of the percentage change in demand for good X to the percentage change in the price of good Y.\"},{\"id\":25,\"question\":\"If cross-price elasticity of demand is positive, what relationship exists between the two goods?\",\"answer\":\"If Edp_y \u003e 0, goods X and Y are substitutes — as the price of Y rises, demand for X rises (example: two brands of beer).\"},{\"id\":26,\"question\":\"If cross-price elasticity of demand is negative, what relationship exists between the two goods?\",\"answer\":\"If Edp_y \u003c 0, goods X and Y are complements — goods that are typically consumed together (examples: gasoline and automobiles, houses and furniture).\"},{\"id\":27,\"question\":\"In the gasoline–automobile example (Equation 12), what does a cross-price elasticity of −0.84 mean?\",\"answer\":\"Edp_y = (−2000)(20/47,542.8) = −0.84. A 1% increase in the price of automobiles reduces demand for gasoline by 0.84%. Since the sign is negative, gasoline and automobiles are considered complements, though the relationship is judged to be weak.\"},{\"id\":28,\"question\":\"How is the market demand function derived from individual demand functions?\",\"answer\":\"The market demand function is obtained by aggregating (summing) the demand functions of all consumers in a given market. If there are 1,000 identical consumers each with the same demand function, the market function equals one consumer's function multiplied by 1,000: Qxd = 84,500 – 6,390Px + 250I – 2,000Py (Equation 9).  ## Substitution and Income Effects\"},{\"id\":29,\"question\":\"What are the two reasons a consumer buys more of a good when its price falls?\",\"answer\":\"There are two reasons: the substitution effect and the income effect. Together, these two factors give rise to the law of demand (the negatively sloped demand curve).\"},{\"id\":30,\"question\":\"What is the substitution effect?\",\"answer\":\"When the price of a good falls, it becomes relatively cheaper than other goods (substitutes), leading the consumer to buy more of it in place of other goods. Example: when the price of gasoline falls, driving a car becomes relatively cheaper than using public transportation.\"},{\"id\":31,\"question\":\"What are the income effect and real income?\",\"answer\":\"When the price of a good falls, even though money income stays unchanged, purchasing power (real income) increases. For most goods, as real income rises, consumers buy more of that good — this is the income effect.\"},{\"id\":32,\"question\":\"When the price of beef rises, how do the substitution effect and income effect work together?\",\"answer\":\"When the price of beef rises, the substitution effect leads the consumer to switch to a cheaper substitute such as chicken. At the same time, the price increase reduces real income, so if beef is a normal good, the income effect also reduces purchases of beef — both effects work in the same direction.\"},{\"id\":33,\"question\":\"How is the pure substitution effect isolated in calculation (the coffee example)?\",\"answer\":\"The pure substitution effect is isolated by \\\"taking back\\\" the increase in income caused by the price decrease, leaving the consumer just as well off (indifferent) as at the old price, which removes the income effect. In this case, the consumer always buys more of the good that has become relatively cheaper.\"},{\"id\":34,\"question\":\"In Monica's movie theater example (Example 2), of the total 6 additional movies when the price fell from $8 to $4, how many are due to the substitution effect and how many to the income effect?\",\"answer\":\"When Monica pays for the club membership herself (the case with the income effect removed), movies increase from 6 to 8, a rise of 2 — this is the substitution effect. When she receives the membership as a gift from a friend (the income effect not removed), movies rise further from 8 to 12, an additional 4 — this is the income effect. Of the total increase of 6 movies, 2 are due to substitution and 4 to the income effect (for Monica, movies are a normal good).  ## Normal and Inferior Goods\"},{\"id\":35,\"question\":\"For a normal good, how do the substitution effect and income effect relate to each other?\",\"answer\":\"For a normal good, when price falls, the substitution effect (buying more because the good is relatively cheaper) and the income effect (buying more because real income has risen) both work in the same direction — that is, they reinforce each other. As a result, the demand curve is negatively sloped.\"},{\"id\":36,\"question\":\"For an inferior good, how do the substitution effect and income effect relate to each other?\",\"answer\":\"For an inferior good, when price falls, the substitution effect leads to greater purchases, while the income effect works in the opposite direction, leading to smaller purchases — the two effects work against each other, with the income effect mitigating the substitution effect.\"},{\"id\":37,\"question\":\"Can the same good be a normal good for some consumers and an inferior good for others? Give an example.\",\"answer\":\"Yes. Fast food is an example: for low-income consumers, as income rises, consumption of fast food increases (a normal good); but for high-income consumers, as income rises, they shift toward fine dining, so their consumption of fast food falls (an inferior good).\"},{\"id\":38,\"question\":\"What is a Giffen good?\",\"answer\":\"A Giffen good is the special case in which the income effect outweighs the substitution effect and is strongly negative, so that quantity demanded actually rises when price rises (named after Robert Giffen). Example: rice consumption among people living in extreme poverty — because rice accounts for such a large share of their income, it is an inferior good whose price decrease could have the opposite effect on demand.\"},{\"id\":39,\"question\":\"What is a Veblen good?\",\"answer\":\"Based on Thorstein Veblen's concept of \\\"conspicuous consumption,\\\" a Veblen good is one for which a higher price itself increases the good's prestige and status value (examples: luxury automobiles, jewelry). A Veblen good is not an inferior good, and demand for it rises as price rises.\"},{\"id\":40,\"question\":\"What are the two notable exceptions to the law of demand?\",\"answer\":\"Giffen goods and Veblen goods — both are rare cases in which the demand curve is positively sloped.\"},{\"id\":41,\"question\":\"What conclusions does the exhibit summarizing the substitution and income effects of a price decrease for normal and inferior goods (Exhibit 6) provide?\",\"answer\":\"For a normal good: the substitution effect leads to more purchases (because the good is relatively cheaper); the income effect also leads to more purchases (because purchasing power has risen). For an inferior good: the substitution effect leads to more purchases; the income effect leads to fewer purchases (as real income rises, the consumer shifts toward the now relatively preferred substitute).  ## Marginal Returns and Productivity\"},{\"id\":42,\"question\":\"What are increasing marginal returns?\",\"answer\":\"Increasing marginal returns is the phenomenon in which the marginal product rises as additional units of one input (for example, labor) are added. This typically arises from specialization and division of labor.\"},{\"id\":43,\"question\":\"What is the law of diminishing marginal returns?\",\"answer\":\"It is the law stating that as more of a variable input (labor) is added to a fixed amount of capital, the marginal product from each additional unit of labor eventually declines past a certain point. Example: once an automobile factory reaches its capacity limit, adding more workers does not increase output.\"},{\"id\":44,\"question\":\"What is total product (Q)?\",\"answer\":\"Total product is the total quantity of output produced from all inputs over a given period. This measure provides information about a firm's level of output but does not show its efficiency (productivity).\"},{\"id\":45,\"question\":\"What formula defines average product of labor (APL)?\",\"answer\":\"APL = Q/L — total product divided by the number of units of labor (for example, hours worked). This measures the average productivity of labor.\"},{\"id\":46,\"question\":\"What formula defines marginal product of labor (MPL)?\",\"answer\":\"MPL = ΔQ/ΔL — the change in total product resulting from one additional unit of labor, holding other inputs constant.\"},{\"id\":47,\"question\":\"What is the relationship between marginal product of labor (MPL) and average product of labor (APL)?\",\"answer\":\"When MPL \u003e APL, APL is rising; when MPL \u003c APL, APL is falling. For example, in Exhibit 9, at the 2nd hour of labor, MPL (110) exceeds APL (105), so APL is rising; at the 5th hour, MPL (40) is less than APL (80), so APL has fallen.\"},{\"id\":48,\"question\":\"What formula expresses the relationship between short-run marginal cost (SMC) and marginal product of labor (MPL)?\",\"answer\":\"SMC = w/MPL, where w is the wage rate. As labor productivity (MPL) rises, SMC falls; as MPL falls, SMC rises.\"},{\"id\":49,\"question\":\"What formula relates average variable cost (AVC) to average product of labor (APL)?\",\"answer\":\"AVC = w/APL. As the wage rate (w) rises, AVC rises; as the average productivity of labor (APL) rises, AVC falls.\"},{\"id\":50,\"question\":\"What benefits does increasing productivity provide to the firm, workers, and shareholders?\",\"answer\":\"(1) Business costs fall and profit rises; (2) the increase in profit raises the stock price and shareholder wealth; (3) worker compensation rises, which in turn provides further incentive to increase productivity.  ## Breakeven and Shutdown Analysis\"},{\"id\":51,\"question\":\"What is the difference between economic profit and accounting profit?\",\"answer\":\"Economic profit = total revenue (TR) − total economic costs (accounting costs plus implicit opportunity costs). Accounting profit = TR − total accounting costs (measured only by explicit expenses). TR is the same in both cases: TR = (P)(Q).\"},{\"id\":52,\"question\":\"What are opportunity cost and sunk cost?\",\"answer\":\"Opportunity cost is the value of the best forgone alternative when making a particular decision. Sunk cost is a cost that has already been incurred and cannot now be changed (for example, the historical cost of previously purchased equipment); because it does not affect future decisions, it is disregarded.\"},{\"id\":53,\"question\":\"What is the difference between economic depreciation and accounting depreciation?\",\"answer\":\"Economic depreciation is forward-looking — it measures the value lost from using an asset in production rather than selling or leasing it out (an opportunity cost). Accounting depreciation is backward-looking — it specifies how a previously incurred historical cost is allocated across units of production.\"},{\"id\":54,\"question\":\"What formula defines total revenue (TR)?\",\"answer\":\"TR = (P)(Q) — the per-unit selling price multiplied by the quantity sold.\"},{\"id\":55,\"question\":\"What formula defines marginal revenue (MR)?\",\"answer\":\"MR = ΔTR/ΔQ — the ratio of the change in total revenue to the change in quantity, the additional revenue earned from producing one more unit.\"},{\"id\":56,\"question\":\"Why is MR equal to price (P) in a perfectly competitive market?\",\"answer\":\"In a perfectly competitive market, the firm is a price taker and faces a horizontal (perfectly elastic) demand curve, so it does not need to lower its price to sell an additional unit. Therefore, MR = P.\"},{\"id\":57,\"question\":\"What does the formula MR = P + Q(ΔP/ΔQ) represent?\",\"answer\":\"Differentiating TR = (P)(Q) gives ΔTR = (P)(ΔQ) + (Q)(ΔP); dividing by ΔQ yields MR = P + Q(ΔP/ΔQ). This means MR is \\\"adjusted\\\" from price by the amount (ΔP/ΔQ) × Q; for a firm in imperfect competition, the demand curve is negatively sloped (ΔP/ΔQ \u003c 0), so MR \u003c P.\"},{\"id\":58,\"question\":\"What formula defines marginal cost (MC), and what is the difference between short-run marginal cost (SMC) and long-run marginal cost (LMC)?\",\"answer\":\"MC = ΔTC/ΔQ. SMC (short-run MC) is the additional cost of producing one more unit in the short run using only variable inputs (labor); LMC (long-run MC) is the additional cost of producing one more unit in the long run, when all inputs (labor and capital) can vary.\"},{\"id\":59,\"question\":\"What are the conditions for profit maximization?\",\"answer\":\"(1) MR = MC, and (2) at that point MC must not be falling (the second-order condition).\"},{\"id\":60,\"question\":\"How are total cost (TC), total fixed cost (TFC), and total variable cost (TVC) related?\",\"answer\":\"TC = TFC + TVC. TFC is the cost that remains fixed regardless of the level of output (for example, rent, debt service). TVC is directly related to the level of output; when output is zero, TVC is also zero.\"},{\"id\":61,\"question\":\"What is the relationship between MC and average cost (AVC, ATC)?\",\"answer\":\"If MC \u003c average cost, average cost is falling; if MC \u003e average cost, average cost is rising. Therefore, the MC curve crosses the AVC and ATC curves at their respective minimum points (points S and T).\"},{\"id\":62,\"question\":\"What is the breakeven point?\",\"answer\":\"It is the point at which a firm's total revenue (TR) equals total cost (TC) — equivalently, where price (P, or AR) equals average total cost (ATC). This occurs at the minimum point of the ATC curve, where economic profit is zero (only normal profit is earned).\"},{\"id\":63,\"question\":\"What is the shutdown point?\",\"answer\":\"It is the point at which a firm can no longer even cover its variable costs — that is, where price has fallen below the minimum point of average variable cost (AVC). If price falls below this point, the firm is better off shutting down operations even in the short run.\"},{\"id\":64,\"question\":\"What conclusions does the exhibit on the short-run and long-run revenue-cost relationship (Exhibit 22) provide?\",\"answer\":\"If TR = TC, the firm remains in the market in both the short run and the long run. If TR = TVC but is less than TC, the firm remains in the short run but must exit in the long run. If TR \u003c TVC, the firm must shut down operations and exit the market in the short run.\"},{\"id\":65,\"question\":\"How does the revenue relationship differ between a perfectly competitive firm and a firm in imperfect competition?\",\"answer\":\"Under perfect competition, the demand curve is horizontal, so MR = AR = P, and TR rises in a straight line (at a constant slope reflecting price) as units increase. Under imperfect competition (for example, a monopoly), the demand curve is negatively sloped, so MR \u003c P; the TR curve first rises (while demand is elastic) and then falls (once demand becomes inelastic).\"},{\"id\":66,\"question\":\"Example: a firm sells 100 units at P = €4, with ATC = €7 (AVC = €3.75, AFC = €3.25). Why is it correct for the firm not to shut down?\",\"answer\":\"TR = €400, TC = €700, giving an economic loss of €300. If the firm shut down, its loss would necessarily equal its TFC, or €325. However, by continuing to operate, since P (€4) \u003e AVC (€3.75), the firm fully covers its TVC and also recovers an additional €25 toward its TFC, so the loss shrinks to only €300 — therefore, operating is more profitable than shutting down.  ## Economies and Diseconomies of Scale\"},{\"id\":67,\"question\":\"How are the short run and the long run defined in economic terms?\",\"answer\":\"The short run is the period during which at least one factor of production (for example, technology, equipment, or plant size) remains fixed. The long run is the period during which all factors are variable and firms are free to enter or exit the market (the \\\"planning horizon\\\").\"},{\"id\":68,\"question\":\"What is the envelope curve, or the long-run average cost curve (LRAC)?\",\"answer\":\"The long-run average cost curve (LRAC), or \\\"envelope curve,\\\" is formed by connecting the minimum points of the short-run average total cost (SATC) curves for each different plant size, because it encompasses every feasible combination of technology, plant size, and capital.\"},{\"id\":69,\"question\":\"What are economies of scale, and how do they appear graphically?\",\"answer\":\"Economies of scale occur when a firm's per-unit cost falls as it increases output. Graphically, this appears as the negatively sloped portion of the LRAC curve.\"},{\"id\":70,\"question\":\"What are diseconomies of scale, and how do they appear graphically?\",\"answer\":\"Diseconomies of scale occur when a firm's per-unit cost rises as it increases output. Graphically, this appears as the positively sloped portion of the LRAC curve.\"},{\"id\":71,\"question\":\"What factors give rise to economies of scale?\",\"answer\":\"Increasing returns to scale (where output grows by a greater proportion than inputs), division of labor and specialization, the ability to use more efficient (though more costly) equipment, reduced waste, better use of market information, and discounted prices from bulk purchasing, among others.\"},{\"id\":72,\"question\":\"What factors give rise to diseconomies of scale?\",\"answer\":\"Decreasing returns to scale, difficulties in managing an organization that has grown too large, duplication of business functions and product lines, and rising prices caused by resource constraints when purchasing in bulk (for example, brand duplication at General Motors), among others.\"},{\"id\":73,\"question\":\"What is minimum efficient scale?\",\"answer\":\"It is the level of output at the minimum point of the LRAC curve. In a perfectly competitive market, firms are driven in the long run to operate at this point, because the market price ultimately settles at this level.  ---\"}]},{\"id\":\"market-structures\",\"title\":\"The Firm and Market Structures\",\"cards\":[{\"id\":1,\"question\":\"How do economists traditionally classify markets into market structures, and what are they?\",\"answer\":\"Four types: perfect competition, monopolistic competition, oligopoly, and monopoly.\"},{\"id\":2,\"question\":\"What is a \\\"market\\\" by the economists' definition?\",\"answer\":\"A market is a group of buyers and sellers who are aware of each other and can agree on a price at which to exchange a good or service.\"},{\"id\":3,\"question\":\"What are the 5 factors that determine market structure?\",\"answer\":\"1) The number of sellers and their relative size; 2) The degree of product differentiation; 3) The pricing power of sellers; 4) The relative strength of barriers to entry and exit; 5) The degree of non-price competition.\"},{\"id\":4,\"question\":\"According to Exhibit 1, how do the four market structures differ in terms of number of sellers and product differentiation?\",\"answer\":\"Perfect competition — many sellers, a homogeneous/standardized product; Monopolistic competition — many sellers, a differentiated product; Oligopoly — few sellers, a homogeneous or differentiated product; Monopoly — a single seller, a unique product.\"},{\"id\":5,\"question\":\"According to Exhibit 1, how do the four market structures compare in terms of barriers to entry and pricing power?\",\"answer\":\"Perfect competition — very low barriers, no pricing power; Monopolistic competition — low barriers, slight pricing power; Oligopoly — high barriers, some to significant pricing power; Monopoly — very high barriers, significant pricing power.\"},{\"id\":6,\"question\":\"What are the 5 conditions that define perfect competition?\",\"answer\":\"1) A very large number of buyers and sellers; 2) The products offered by sellers are virtually identical; 3) Barriers to entry and exit are very low; 4) Sellers have no power to influence the market price; 5) There is no non-price competition.\"},{\"id\":7,\"question\":\"Who popularized the concept of monopolistic competition, and what is its nature?\",\"answer\":\"Edward Chamberlin (US) and Joan Robinson (UK) popularized it. It is a hybrid market structure, combining a strong element of competition (many firms) with a monopolistic element arising from product differentiation.\"},{\"id\":8,\"question\":\"What is the most distinctive feature of an oligopoly market?\",\"answer\":\"A small number of dominant firms, whose pricing decisions are interdependent, so that each firm's decision must take into account the expected response of the others.\"},{\"id\":9,\"question\":\"What are the defining characteristics of a monopoly market?\",\"answer\":\"A single seller, a unique product with no close substitutes, very high barriers to entry, and significant pricing power for the seller over price and output.\"},{\"id\":10,\"question\":\"What forces make up Michael Porter's \\\"five forces\\\" framework?\",\"answer\":\"1) Threat of entry; 2) Power of suppliers; 3) Power of buyers; 4) Threat of substitutes; 5) Rivalry among existing competitors.\"},{\"id\":11,\"question\":\"What does the term \\\"economic moat\\\" represent?\",\"answer\":\"Like the moat that protected a medieval castle, it is a term for the factors that protect a firm's profitability from the threat of entry; a deep moat means low threat of entry and high customer switching costs.\"},{\"id\":12,\"question\":\"What is the trade-off between perfect competition and innovation?\",\"answer\":\"Perfect competition delivers the greatest quantity of goods at the lowest price, but the incentive to fund costly innovation (such as pharmaceutical/diagnostic research) is often greater in less competitive structures like oligopoly, so consumers may sometimes benefit from imperfect competition.  ## Perfect Competition\"},{\"id\":13,\"question\":\"Given a market demand function for a perfectly competitive market of QD = 50 – 2P, what is the inverse function expressing price in terms of quantity?\",\"answer\":\"P = 25 – 0.5QD\"},{\"id\":14,\"question\":\"How are total revenue (TR) and average revenue (AR) derived from the demand function QD = 50 – 2P (equivalently P = 25 – 0.5QD)?\",\"answer\":\"TR = P×QD = 25QD – 0.5QD²; AR = TR/QD = 25 – 0.5QD, meaning the AR function is identical to the market demand function.\"},{\"id\":15,\"question\":\"For the demand function above (P = 25 – 0.5QD), what formula expresses marginal revenue (MR) as ΔQD becomes very small?\",\"answer\":\"MR = 25 – QD (as ΔQD → 0).\"},{\"id\":16,\"question\":\"How is the price elasticity of demand (εP) defined?\",\"answer\":\"εP = –(% change in QD) ÷ (% change in P). By convention it is expressed as a positive number.\"},{\"id\":17,\"question\":\"What are the three classifications of price elasticity of demand?\",\"answer\":\"εP \u003e 1 means demand is elastic; εP = 1 means unitary elastic; εP \u003c 1 means demand is inelastic.\"},{\"id\":18,\"question\":\"What are the main factors that affect the price elasticity of demand?\",\"answer\":\"1) The number of close substitutes (more substitutes means more elastic); 2) The share of the consumer's budget spent on the good (a higher share means more elastic); 3) The length of time (demand is more elastic over longer periods, since consumers have more time to adjust).\"},{\"id\":19,\"question\":\"What are the two limiting cases of price elasticity of demand?\",\"answer\":\"A horizontal demand curve (the case of a perfectly competitive firm) — εP = ∞ (perfectly elastic); a vertical demand curve (e.g., insulin) — εP = 0 (perfectly inelastic).\"},{\"id\":20,\"question\":\"What is income elasticity of demand (εY), and how is it calculated?\",\"answer\":\"εY = (% change in QD) ÷ (% change in Y). For a normal good εY is positive; for a luxury good εY \u003e 1; for an inferior good εY is negative.\"},{\"id\":21,\"question\":\"What is cross-price elasticity of demand (εX)?\",\"answer\":\"εX = (% change in QDA) ÷ (% change in PB). A positive value indicates substitutes; a negative value indicates complements.\"},{\"id\":22,\"question\":\"What is the relationship between price elasticity of demand and total revenue (TR)?\",\"answer\":\"εP \u003e 1 (elastic): ↑P → TR↓, ↓P → TR↑. εP = 1 (unitary elastic): a change in P leaves TR unchanged. 0 \u003c εP \u003c 1 (inelastic): ↑P → TR↑, ↓P → TR↓.\"},{\"id\":23,\"question\":\"What formula expresses the relationship between marginal revenue (MR) and the price elasticity of demand (εP)?\",\"answer\":\"MR = P[1 – (1/εP)]\"},{\"id\":24,\"question\":\"What is consumer surplus, and how is it represented graphically?\",\"answer\":\"It is the difference between what a consumer is willing to pay for a unit purchased and what they actually pay for it; graphically it is the (triangular) area below the demand curve and above the price paid.\"},{\"id\":25,\"question\":\"What is opportunity cost, and why does economic profit differ from accounting profit?\",\"answer\":\"Opportunity cost is the income from the best alternative use of a resource, whether keeping it in its current use or acquiring it anew. Economic profit = TR – TC, where TC includes opportunity cost; accounting profit only accounts for explicit payments made to outside resource providers (employees, suppliers, lenders), so it excludes opportunity cost.\"},{\"id\":26,\"question\":\"Why does a perfectly competitive firm face a horizontal demand curve, and what does this imply?\",\"answer\":\"Because a single firm cannot affect the market equilibrium price, it can sell any number of units at that equilibrium price. As a result: Price = Average revenue = Marginal revenue.\"},{\"id\":27,\"question\":\"By what rule does a perfectly competitive firm choose the profit-maximizing output, and what are the cost formulas involved?\",\"answer\":\"The firm sets output where MR = MC. Average cost AC = TC/Q; marginal cost MC = ΔTC/ΔQ; at the output level where AC is minimized, MC = AC.\"},{\"id\":28,\"question\":\"What is the law of diminishing returns, and how does it shape the AC and MC curves?\",\"answer\":\"Holding technology constant, each additional unit of input eventually adds a smaller increment to output. As a result, the AC and MC curves are U-shaped: they first fall, then rise.\"},{\"id\":29,\"question\":\"What equilibrium does a perfectly competitive firm reach in the long run?\",\"answer\":\"P = MC = min AC (the minimum average cost); economic profit is zero, since TR = TC. The firm's long-run supply curve is its long-run marginal cost curve.\"},{\"id\":30,\"question\":\"What are Schumpeter's two types of innovation, and what do the three stages of \\\"swarming\\\" represent?\",\"answer\":\"1) Innovation of process — a more efficient method of production; 2) Innovation of product — a new product. The three stages: the first company to innovate earns high profits → other companies imitate it, \\\"swarming\\\" in → eventually, once everyone has imitated, economic profit disappears and the market settles into the long-run equilibrium of perfect competition.  ## Monopolistic Competition\"},{\"id\":31,\"question\":\"What are the 5 defining features of monopolistic competition?\",\"answer\":\"1) A large number of buyers and sellers; 2) Firms' products are close substitutes but differentiated in appearance; 3) Entry and exit costs are relatively low; 4) Firms have slight pricing power; 5) Firms differentiate their products through advertising and non-price strategies.\"},{\"id\":32,\"question\":\"How does the demand curve of a monopolistically competitive firm differ from that of a perfectly competitive firm?\",\"answer\":\"Because the product is differentiated, the demand curve is downward sloping rather than horizontal, since the firm can change its price somewhat.\"},{\"id\":33,\"question\":\"How does a monopolistically competitive firm maximize profit in the short run?\",\"answer\":\"It chooses output Q1 where MR = MC; it sets the price P1 corresponding to that output on the demand curve; total revenue (TR) is the area P1 × Q1 (Exhibit 11).\"},{\"id\":34,\"question\":\"Does monopolistic competition have a well-defined supply function?\",\"answer\":\"No. Output is determined by the intersection of MC and MR, while price is set from the demand curve, so there is no supply function.\"},{\"id\":35,\"question\":\"How is the firm's profit (π) determined?\",\"answer\":\"π = TR – TC, where TR = P1×Q1 (total revenue) and TC = C1×Q1 (total cost, where C1 is the average cost of producing Q1 units).\"},{\"id\":36,\"question\":\"What equilibrium does a monopolistically competitive firm reach in the long run?\",\"answer\":\"As new firms enter and demand falls, economic profit becomes zero (TR = TC); but unlike perfect competition, the equilibrium occurs at an output (Q1) below the output that minimizes average cost (Q2) — that is, excess capacity remains (Q1 \u003c Q2).\"},{\"id\":37,\"question\":\"Although monopolistic competition may appear \\\"excessively inefficient,\\\" why can it still benefit society?\",\"answer\":\"Product differentiation provides an incentive to innovate (Schumpeter's idea) and supplies goods that match consumers' varied needs, tastes, and preferences; consumers value variety (e.g., trade in cars between Germany and Japan).  ## Oligopoly\"},{\"id\":38,\"question\":\"What are the 5 defining features of oligopoly?\",\"answer\":\"1) A small number of sellers; 2) Products are close substitutes and may be branded or homogeneous; 3) High barriers to entry; 4) Firms have significant pricing power; 5) Products are often differentiated through non-price strategies such as advertising and features.\"},{\"id\":39,\"question\":\"What are the three main pricing strategies in oligopoly markets?\",\"answer\":\"1) Pricing interdependence; 2) The Cournot assumption; 3) The Nash equilibrium.\"},{\"id\":40,\"question\":\"What is a kinked demand curve, and why does it arise?\",\"answer\":\"If rivals are assumed to match price decreases but not follow price increases, the firm's demand becomes more elastic above the prevailing price (DP↑) and more inelastic below it (DP↓), creating a \\\"kink\\\" at the prevailing price. As a result, the MR curve has a discontinuity.\"},{\"id\":41,\"question\":\"What is the main weakness of the kinked demand curve model?\",\"answer\":\"It cannot explain how the initial prevailing price was established in the first place; however, it is useful for explaining price stability in oligopoly markets.\"},{\"id\":42,\"question\":\"What is the Cournot assumption?\",\"answer\":\"In a duopoly market, each firm chooses its profit-maximizing output assuming the other firm will not change its own output.\"},{\"id\":43,\"question\":\"Given demand QD = 450 – P and MC = 30 in a duopoly, what is the Cournot equilibrium?\",\"answer\":\"q1 = q2 = 140, Q = 280, P = 450 – 280 = 170. (Solved jointly from MR1 = 450 – 2q1 – q2 = 30 and MR2 = 450 – q1 – 2q2 = 30.)\"},{\"id\":44,\"question\":\"Where does the Cournot equilibrium fall relative to the perfect competition and monopoly equilibria?\",\"answer\":\"In between: PC (perfectly competitive price) \u003c PCournot \u003c PM (monopoly price); correspondingly QM \u003c QCournot \u003c QC. In the example above, PC=30, PCournot=170, PM=240; Q(competitive)=420, Q(Cournot)=280, Q(monopoly)=210.\"},{\"id\":45,\"question\":\"What is a Nash equilibrium?\",\"answer\":\"In a non-cooperative game, it is an equilibrium in which, after accounting for each other's optimal responses, no two or more participating firms have an incentive to deviate from their own strategy.\"},{\"id\":46,\"question\":\"In the ArcCo/BatCo Nash equilibrium example, why do the joint-profit-maximizing outcome and the actual Nash equilibrium differ?\",\"answer\":\"Although both firms setting a high price maximizes joint profit (800), BatCo has an incentive to set a lower price and earn more profit (350) when ArcCo sets a high price, so the non-cooperative equilibrium differs from the joint-profit-maximizing outcome — only through collusion can both firms set a high price.\"},{\"id\":47,\"question\":\"What is a cartel, and can it be either explicit or implicit?\",\"answer\":\"A cartel is an open, formal alliance of firms engaging in collusion. It may be explicit (based on a formal agreement) or implicit (based on signaling, e.g., one firm not lowering its price is read as a \\\"signal\\\" to raise prices).\"},{\"id\":48,\"question\":\"What are the 6 factors that affect the likelihood of successful collusion?\",\"answer\":\"1) The number of sellers and the distribution of their size (more likely to succeed with few or dominant firms); 2) Product homogeneity (more likely to succeed if homogeneous); 3) Similarity of cost structures; 4) Order size and frequency (more likely to succeed with small, frequent orders); 5) The strength and severity of retaliation; 6) The degree of outside competition (the OPEC example).\"},{\"id\":49,\"question\":\"How does the Stackelberg model differ from the Cournot model?\",\"answer\":\"In the Cournot model, decisions are made simultaneously, whereas in the Stackelberg model the leader firm sets its output first and the follower firm decides after observing it (sequential). The leader firm uses a \\\"top dog\\\" strategy, overproducing to induce the follower to reduce its output, and earns higher profit as a result.\"},{\"id\":50,\"question\":\"In the dominant firm price leadership model, how does the dominant firm set its output and price?\",\"answer\":\"The dominant firm (the lower-cost firm, typically with ≥40% market share) chooses output QL where MRL = MCL; the corresponding price (PL) is determined from its own demand segment DL. Follower firms supply the residual (QT – QL) = QF.\"},{\"id\":51,\"question\":\"In the long run, what tends to happen to the dominant firm's market share in an oligopoly?\",\"answer\":\"It usually declines, because profits attract new firms that introduce more efficient techniques, reducing the dominant firm's demand and marginal revenue (e.g., US Steel held 66% of the market in 1901, 46% in 1920, and 42% in 1925).  ## Monopoly, including Price Discrimination\"},{\"id\":52,\"question\":\"What are the 5 defining features of monopoly?\",\"answer\":\"1) A single seller of a unique, differentiated product; 2) No close substitutes exist; 3) Very high barriers to entry; 4) The firm has significant pricing power; 5) The product may be differentiated through non-price strategies such as advertising.\"},{\"id\":53,\"question\":\"What are the sources of monopoly power?\",\"answer\":\"1) Patents and copyrights; 2) Control of a critical resource (e.g., De Beers' diamond mines); 3) Government licensing/natural monopoly (economies of scale, e.g., electricity and water utilities); 4) Brand loyalty (e.g., Rolex); 5) Network effects (e.g., Microsoft Word).\"},{\"id\":54,\"question\":\"For a monopoly with demand QD = a – bP, how are demand, total revenue, and marginal revenue expressed in general form?\",\"answer\":\"P = a/b – (1/b)QD; TR = (a/b)QD – (1/b)QD²; MR = ΔTR/ΔQ = (a/b) – (2/b)QD. For linear demand, the MR curve's slope is twice as steep as the demand curve's.\"},{\"id\":55,\"question\":\"Does a monopoly have a well-defined supply function, and what is its profit-maximizing rule?\",\"answer\":\"No, there is no well-defined supply function; output and price are determined by the cost structure. The profit-maximizing output occurs where MR = MC.\"},{\"id\":56,\"question\":\"Using the relationship between monopoly, marginal revenue, and the price elasticity of demand, what is the pricing formula, and work through an example?\",\"answer\":\"Since MR = MC, P[1 – 1/EP] = MC. Example: with constant MC of 75 and EP=1.5, P[1 – 1/1.5] = 75 → P = 225.\"},{\"id\":57,\"question\":\"Does the monopoly's profit-maximizing price and output occur on the elastic or inelastic segment of the demand curve?\",\"answer\":\"Always on the elastic segment, because MR and MC only intersect where MR is positive, which requires demand to be elastic.\"},{\"id\":58,\"question\":\"What are the three possible solutions for regulating a natural monopoly, and how do the resulting prices compare?\",\"answer\":\"1) Unregulated monopoly: set output where LRMC=MR, giving PM (the highest price); 2) Regulated monopoly: set PR = LRAC (an intermediate price); 3) Competitive price: set PC = LRMC (the lowest price, though it may not cover average cost). Ranking: PM \u003e PR \u003e PC.\"},{\"id\":59,\"question\":\"What is first-degree price discrimination?\",\"answer\":\"A scenario in which the monopolist charges each customer the highest price they are willing to pay; this captures the entire consumer surplus.\"},{\"id\":60,\"question\":\"What is second-degree price discrimination, and through what methods is it implemented?\",\"answer\":\"Offering a menu of quantity-based pricing options so that customers self-select based on how much they consume; examples include quantity discounts, quantity premiums, coupons, bundling, and usage restrictions.\"},{\"id\":61,\"question\":\"What is third-degree price discrimination?\",\"answer\":\"Setting different prices by segmenting customers according to demographics or other characteristics; examples include student versus professional versions of econometrics software, or a same-day round-trip airline ticket versus a weekend round-trip ticket.\"},{\"id\":62,\"question\":\"What is two-part tariff pricing?\",\"answer\":\"A method that charges a fixed monthly/membership fee (entry fee) in addition to a per-unit price; the fixed fee is set equal to the consumer surplus the customer earns at that per-unit price.\"},{\"id\":63,\"question\":\"Nicole's monthly fitness club demand is QD = 20 – 4P (P in euros per visit), with marginal cost €2 per visit. How much can the club charge for membership?\",\"answer\":\"At P=2, QD=20–4(2)=12 visits; consumer surplus = (0.5)(12)(3) = 18 euros. The club can charge a €18 monthly membership fee on top of the €2/visit price, capturing all of Nicole's consumer surplus (two-part tariff pricing).\"},{\"id\":64,\"question\":\"What condition is needed to sustain a monopoly's long-run equilibrium, and what are the long-run solutions for a regulated monopoly?\",\"answer\":\"To remain a monopoly, continuous, durable barriers to entry (e.g., new patents) must be maintained. Solutions for a regulated monopoly: 1) Provide a subsidy to set P=MC; 2) Nationalization; 3) A regulatory agency sets P=LRAC; 4) Franchise bidding to set P=LRAC.\"},{\"id\":65,\"question\":\"Why do monopolists tend to invest little in quality and R\u0026D?\",\"answer\":\"Absent a threat of new entry, or if such spending would not clearly increase profit, a monopolist has little incentive to devote resources to quality control, research and development, or customer service (e.g., domestic auto manufacturers before competition entered, or regulated telephone companies).\"},{\"id\":66,\"question\":\"Is monopoly always inefficient?\",\"answer\":\"No, not always. Due to economies of scale and regulation (or the threat of entry), in some cases a monopoly can deliver a better outcome for buyers than perfect competition (e.g., a single power plant with lower average cost).  ## Identification of Market Structure\"},{\"id\":67,\"question\":\"What is the theoretical method for measuring market power?\",\"answer\":\"Econometric estimation of the elasticities of demand and supply. If demand is very elastic, the market is close to perfect competition; if demand is inelastic (rigid), firms may have significant market power.\"},{\"id\":68,\"question\":\"Why does the problem of endogeneity hinder econometric estimation of demand and supply?\",\"answer\":\"Observed prices and quantities are equilibrium values jointly determined by the interaction of both demand and supply, so a two-equation model (a demand equation and a supply equation) is needed to separately identify each function.\"},{\"id\":69,\"question\":\"What are the main differences and weaknesses between time-series and cross-sectional regression methods?\",\"answer\":\"Time-series regression observes total sales and average price for a single market over time — but if the market structure has changed, historical elasticity estimates may no longer fit current conditions. The cross-sectional method observes sales across different companies within a single year — it requires gathering much more data, and results can vary significantly depending on how the explanatory variables are defined.\"},{\"id\":70,\"question\":\"What is the concentration ratio, and what range of values does it take?\",\"answer\":\"The sum of the market shares of the largest N firms; it ranges from 0% (perfect competition) to 100% (monopoly).\"},{\"id\":71,\"question\":\"In a market with 8 suppliers, where the largest firm holds 35%, followed by 25%, 20%, 10%, and the remaining 4 each hold 2.5%, what are the top-3 and top-4 concentration ratios?\",\"answer\":\"Top-3: 35+25+20 = 80%; Top-4: 35+25+20+10 = 90%.\"},{\"id\":72,\"question\":\"What are the advantages and disadvantages of the concentration ratio?\",\"answer\":\"Advantage — it is very simple to calculate. Disadvantages — 1) It does not directly measure market power (if barriers to entry are low, even a single firm may behave as if in perfect competition); 2) It is insensitive (shows little response) to mergers among the top firms.\"},{\"id\":73,\"question\":\"What is the Herfindahl-Hirschman Index (HHI), and how is it calculated?\",\"answer\":\"It is the sum of the squared market shares of the top N companies. If a single firm controls the entire market (monopoly), HHI = 1. If there are M firms of equal market share, HHI = 1/M.\"},{\"id\":74,\"question\":\"For the top-3 firms (with 35%, 25%, and 20% market share), what is the HHI before a merger, and what is it after the two largest firms merge?\",\"answer\":\"Before the merger: 0.35² + 0.25² + 0.20² = 0.225. After the two largest firms merge (60%+20%+10%): 0.60² + 0.20² + 0.10² = 0.410 — a significant increase.\"},{\"id\":75,\"question\":\"What are the advantages and disadvantages of the HHI, and why is it useful to regulators?\",\"answer\":\"The HHI is more sensitive to company mergers than the concentration ratio (as shown above, 0.225→0.410). However, since it does not account for barriers to entry or the elasticity of demand, its use is limited for a financial analyst.  ---\"}]},{\"id\":\"aggregate-output-prices-growth\",\"title\":\"Aggregate Output, Prices, and Economic Growth\",\"cards\":[{\"id\":1,\"question\":\"What is gross domestic product (GDP), and what two approaches can be used to define it?\",\"answer\":\"GDP is the market value of all final goods and services produced in an economy during a given period (the output definition), or equivalently, the aggregate income earned by households, companies, and government during that period (the income definition). GDP can therefore be calculated using either the income approach or the expenditure approach; in equilibrium, both give the same result.\"},{\"id\":2,\"question\":\"Why must aggregate output, aggregate income, and aggregate expenditure be equal?\",\"answer\":\"The value of what is produced is always distributed as income to the factors of production (labor, land, and capital), so aggregate output must equal aggregate income. The total amount spent to purchase that output must also equal the same amount, so all three measures are simply the same quantity viewed from different angles.\"},{\"id\":3,\"question\":\"What three basic criteria are followed to keep GDP consistent and comparable over time and across countries?\",\"answer\":\"1) Only goods and services produced during the measurement period are counted (used goods, transfer payments, and capital gains are excluded); 2) Only goods and services sold in markets, with objectively determinable prices, are counted (household work, the underground economy, and pollution are excluded); 3) Only the value of final goods and services is counted, so intermediate goods are not double-counted.\"},{\"id\":4,\"question\":\"What is the difference between final goods and intermediate goods, and why aren't intermediate goods counted separately in GDP?\",\"answer\":\"Final goods are not resold, while intermediate goods are either resold or used to produce other goods. The value of intermediate goods is not counted separately because all the value added during production is already embedded in the final sale price, so counting it separately would result in double-counting.\"},{\"id\":5,\"question\":\"What is the sum-of-value-added method, and how does it relate to GDP?\",\"answer\":\"This method sums the value added (receipts minus intermediate inputs) at each stage of the production and sale process (for example, the farmer, the miller, the baker, and the retailer). The sum of value added across all stages equals the final sale price, which provides a second way of measuring GDP.\"},{\"id\":6,\"question\":\"How are owner-occupied housing and government services treated in GDP?\",\"answer\":\"Since these are not sold directly in markets, an imputed value is used. For owner-occupied housing, an imputed rent (as if the owner were paying rent to themselves) is added to GDP; government services (such as police and courts) have no market price, so they are added to GDP at cost (wages paid) rather than by computing value added.\"},{\"id\":7,\"question\":\"What is the underground economy, and what effect does it have on GDP statistics?\",\"answer\":\"The underground economy consists of economic activity hidden from the government, either to evade taxes or because it is illegal (for example, undocumented workers or illegal drug trafficking). Because it falls outside official GDP calculations, the size of the underground economy varies sharply across countries (about 8% in the United States versus 60% in Peru), which is something to keep in mind when comparing the reliability of official GDP statistics across countries.\"},{\"id\":8,\"question\":\"What is the difference between nominal GDP and real GDP, and how is each calculated?\",\"answer\":\"Nominal GDP is calculated using current-period market prices (Nominal GDPt = Pt × Qt), while real GDP is calculated using constant base-year prices (Real GDPt = PB × Qt), where Pt is the current year's price, PB is the base year's price, and Qt is the current year's quantity. Because real GDP reflects only changes in the quantity of output, it strips out the effect of price-level changes.\"},{\"id\":9,\"question\":\"What is the GDP deflator, and what is its formula?\",\"answer\":\"GDP deflator = (Value of current year output at current year prices / Value of current year output at base year prices) × 100. This is equivalently written as: GDP deflator = (Nominal GDP/Real GDP) × 100. It measures the aggregate change in the price level across all sectors of the economy.\"},{\"id\":10,\"question\":\"How is real GDP expressed in terms of nominal GDP and the deflator?\",\"answer\":\"Real GDP = [Nominal GDP/(GDP deflator/100)]. This relationship is the source of the deflator's name — it \\\"deflates\\\" nominal GDP to remove the effect of inflation.\"},{\"id\":11,\"question\":\"How is the annual inflation rate calculated using the GDP deflator?\",\"answer\":\"Inflation rate = (current year's deflator/previous year's deflator) – 1. For example, if Canada's 2016 deflator was 113.9 and its 2015 deflator was 113.2, the inflation rate = (113.9/113.2) – 1 = 0.66%.\"},{\"id\":12,\"question\":\"What is the difference between gross domestic product (GDP) and gross national product (GNP)?\",\"answer\":\"GDP counts output produced within a country's borders, regardless of who owns the factors of production. GNP, by contrast, counts output produced by factors owned by a country's own residents and businesses, regardless of whether production takes place domestically or abroad.  ## Components of GDP\"},{\"id\":13,\"question\":\"What is the basic formula for calculating GDP using the expenditure approach?\",\"answer\":\"GDP = C + I + G + (X – M) = (C + GC) + (I + GI) + (X – M), where C is consumer spending, I is gross private domestic investment, G is government spending, X is exports, and M is imports.\"},{\"id\":14,\"question\":\"Define the variables C, I, G, X, and M in the GDP expenditure formula.\",\"answer\":\"C is consumer spending on final goods and services; I is gross private domestic investment, consisting of companies' investment in capital goods (such as structures and equipment) and inventory investment; G is government spending on current consumption and investment in capital goods (= GC + GI); X is exports; M is imports.\"},{\"id\":15,\"question\":\"How does the household sector allocate its income?\",\"answer\":\"Households allocate their income between consumption (C) and saving (S) for future consumption. Consumption spending flows to the business sector through the market for goods and services, while saving flows into financial markets, where it becomes a source of funds for business borrowing and private investment.\"},{\"id\":16,\"question\":\"What is the difference between gross investment and net investment?\",\"answer\":\"Gross investment is the total of replacement investment (replacing depreciated capital) and investment that adds new capacity; net investment reflects only the addition to new capacity. GDP counts gross investment, which is why \\\"gross\\\" appears in its name.\"},{\"id\":17,\"question\":\"Why aren't government transfer payments included in government spending (G)?\",\"answer\":\"Transfer payments are simply tax revenue that the government redistributes directly back to individuals in cash, without receiving any good or service in return, so they are not included in G. However, since households spend this money on consumption, it is captured within consumption spending (C) and thus is reflected in GDP.\"},{\"id\":18,\"question\":\"What is a trade deficit, and how is it financed?\",\"answer\":\"A trade deficit means the domestic economy is purchasing more foreign goods and services than foreigners are purchasing from it, i.e., (X – M) \u003c 0. This occurs because domestic saving is insufficient to finance domestic investment plus the government's fiscal balance, requiring borrowing from abroad to make up the difference (net foreign borrowing).\"},{\"id\":19,\"question\":\"How is GDP calculated using the income approach?\",\"answer\":\"GDP = Gross domestic income (GDI) = Net domestic income + Consumption of fixed capital (CFC) + statistical discrepancy. Gross domestic income is calculated as: Compensation of employees + Gross operating surplus + Gross mixed income + Taxes less subsidies on production + Taxes less subsidies on products and imports.\"},{\"id\":20,\"question\":\"What is gross operating surplus?\",\"answer\":\"This is a concept similar to corporate profits, covering the income of private corporations, nonprofit corporations, and government corporations. It measures the gross return businesses earn on capital used, before deducting rent, interest, and financial capital costs (not just the profit accruing to owners).\"},{\"id\":21,\"question\":\"What is \\\"indirect business taxes less subsidies,\\\" and how is it measured?\",\"answer\":\"This is the amount of taxes embedded in the price of final goods and services, net of subsidies, representing the portion of national income that flows directly to the government. It is divided into two categories: 1) \\\"taxes and subsidies on products and imports\\\" (such as sales taxes, fuel taxes, and import subsidies), and 2) \\\"taxes and subsidies on factors of production\\\" (such as capital taxes and payroll taxes).\"},{\"id\":22,\"question\":\"What is consumption of fixed capital (CFC), and what role does it play in calculating GDI?\",\"answer\":\"CFC measures the amount by which the capital stock depreciates (wears out) during production. It represents the portion of income/output that should be set aside to replace worn-out capital. GDP is calculated as: Net domestic income + CFC + statistical discrepancy, and profit + CFC can be viewed as the gross surplus earned on capital.  ## GDP, National Income, Personal Income, and Personal Disposable Income\"},{\"id\":23,\"question\":\"What is national income (NI), and how is it derived from GDP?\",\"answer\":\"National income is the income received by all factors that participated in producing final output. It equals GDP minus the cost of capital consumption (depreciation, i.e., the capital consumption allowance) and the statistical discrepancy.\"},{\"id\":24,\"question\":\"What is personal income (PI), and what is this concept called in Canadian statistics?\",\"answer\":\"Personal income is a broad measure of household income and is the key determinant of consumer spending, since it measures households' purchasing power. In Canadian statistics this is called \\\"Primary Household Income,\\\" calculated as the sum of compensation of employees, net mixed income from unincorporated businesses, and net property income.\"},{\"id\":25,\"question\":\"What is personal disposable income (PDI; called Household Disposable Income in Canada)?\",\"answer\":\"PDI equals personal income minus personal taxes (in practice, it is calculated as personal income minus net transfer payments). It measures the after-tax income available to households for consumption or saving, and it is one of the most important and closely watched measures of income for household spending and saving.\"},{\"id\":26,\"question\":\"How are household net saving and the saving rate calculated?\",\"answer\":\"Household net saving = PDI – Household final consumption expenditure + Net change in pension entitlements. The saving rate is calculated as net saving divided by PDI, expressed as a percentage (for example, in Canada in 2016: 40,108/1,152,542 = 3.48%).\"},{\"id\":27,\"question\":\"What does primary household income (personal income) consist of?\",\"answer\":\"It consists of three components: 1) compensation of employees, 2) net mixed income from unincorporated businesses, and 3) net property income.  ## Aggregate Demand (AD)\"},{\"id\":28,\"question\":\"What is aggregate demand (AD)?\",\"answer\":\"Aggregate demand represents the quantity of goods and services that households, businesses, government, and foreign buyers are willing to purchase at a given price level. The AD curve combines the income and price-level combinations that satisfy two conditions: 1) aggregate expenditure equals aggregate income (the IS curve), and 2) the real money supply is willingly held by the public (the LM curve).\"},{\"id\":29,\"question\":\"What is the IS curve, and what is its basic equation?\",\"answer\":\"The IS curve represents the combinations of income and real interest rates for which income is in equilibrium (planned expenditure = actual income). Its basic equation is: S = I + (G – T) + (X – M), where S is aggregate private sector saving and T is net taxes (= R – F). This shows how domestic private saving is used to fund investment (I), the government's fiscal deficit (G – T), and net claims on foreign countries (X – M).\"},{\"id\":30,\"question\":\"What are the marginal propensity to consume (MPC) and the marginal propensity to save (MPS), and how are they related?\",\"answer\":\"MPC represents the proportion of an additional unit of disposable income that is spent on consumption, while MPS represents the proportion that is saved. The relationship MPS = 1 – MPC holds because any income not spent becomes saving.\"},{\"id\":31,\"question\":\"How is the consumption function C = C(Y – T) interpreted?\",\"answer\":\"Consumption is a function of disposable income (GDP minus net taxes). Therefore, an increase in real income or a reduction in taxes will raise aggregate consumption. More advanced models also treat consumption as depending on wealth, not just current income.\"},{\"id\":32,\"question\":\"What two key factors does the investment function I = I(r, Y) capture?\",\"answer\":\"Investment rises when the real interest rate (r) — the cost of financing — is lower (a decreasing function), and it rises when aggregate income (Y) — a proxy for the expected profitability of investment — is higher (an increasing function).\"},{\"id\":33,\"question\":\"What is the LM curve, and what is the quantity theory of money equation?\",\"answer\":\"The LM curve represents the combinations of income and interest rates for which the demand for and supply of real money balances are equal (M/P = M(r,Y)). The quantity theory of money equation is: MV = PY, where M is the nominal money supply, V is the velocity of money, P is the price level, and Y is real income.\"},{\"id\":34,\"question\":\"How is the AD curve derived from the IS and LM curves?\",\"answer\":\"The AD curve is obtained by combining the IS and LM curves. As the price level falls, the real money supply (M/P) rises, shifting the LM curve to the right; the new intersection with the IS curve occurs at higher income and a lower interest rate. This defines an inverse relationship between the price level and income, which is the AD curve.\"},{\"id\":35,\"question\":\"Why does the AD curve slope downward, and through what three channels does it affect demand and expenditure?\",\"answer\":\"When the price level rises: 1) the real money supply falls and interest rates rise (the interest rate channel); 2) the real value of nominal assets (cash holdings, bonds, stocks) falls (the wealth effect); 3) domestic goods become relatively more expensive than foreign goods, creating a tendency to shift toward imports (the exchange-rate channel). These effects reduce aggregate expenditure and income.\"},{\"id\":36,\"question\":\"What is an automatic stabilizer?\",\"answer\":\"Because net taxes (T) are an increasing (or decreasing) function of income (Y), the fiscal balance (G – T) improves (the deficit shrinks) as income rises, and the deficit grows as income falls. This mechanism moderates and smooths excessive swings in aggregate output, which is why it is called an \\\"automatic stabilizer.\\\"  ## Aggregate Supply (AS)\"},{\"id\":37,\"question\":\"What is aggregate supply (AS)?\",\"answer\":\"Aggregate supply represents the quantity of goods and services that producers are willing to supply at a given price level. It also reflects the amount of labor and capital employed at households' given level of real wages and the given cost of capital.\"},{\"id\":38,\"question\":\"How do the three forms of the AS curve — very short-run AS (VSRAS), short-run AS (SRAS), and long-run AS (LRAS) — differ?\",\"answer\":\"VSRAS is horizontal (output varies but prices stay fixed) — in the very short run, companies raise or lower production without changing prices. SRAS is upward sloping — because wages and input prices are partially fixed, a rise in prices boosts profits and increases output. LRAS is vertical — in the long run, wages and other input prices adjust fully, so only the general price level changes while real output does not.\"},{\"id\":39,\"question\":\"What determines the position of the LRAS curve, and what production function is it related to?\",\"answer\":\"The position of the LRAS curve is determined by the economy's potential output. In the classical model: Y = F(K,L) = Ȳ, where K is the fixed capital stock and L is the available labor supply. Potential GDP is determined by the fixed capital stock, the labor supply, and current technology.\"},{\"id\":40,\"question\":\"What is full employment (the natural level of output), and what is the natural rate of unemployment?\",\"answer\":\"Full employment is the level at which the economy operates efficiently and without bottlenecks, where companies have available spare capacity and the number of job seekers is roughly matched by available job openings, reflecting a stable, modest level of unemployment (the natural rate of unemployment).\"},{\"id\":41,\"question\":\"How is the change in unit labor cost calculated, and how does it affect SRAS?\",\"answer\":\"% Change in unit labor cost = % Change in nominal wages – % Change in productivity. If wages rise at the same rate as productivity, unit labor cost does not change and SRAS does not shift; if wages rise faster than productivity, unit labor cost rises and SRAS shifts to the left, and the opposite shifts it to the right.  ## Shifts in Aggregate Demand and Supply\"},{\"id\":42,\"question\":\"What are the main factors that shift the AD curve to the right or left?\",\"answer\":\"Changes in household wealth, consumer and business expectations, capacity utilization, monetary policy, exchange rates, global economic growth, and fiscal policy (government spending and taxes) all shift the AD curve.\"},{\"id\":43,\"question\":\"What is the wealth effect?\",\"answer\":\"When the prices of financial and real assets owned by households (such as stocks and real estate) rise, households need to save less to meet their saving goals and spend more relative to their current income. This means that an increase in wealth raises consumption and shifts the AD curve to the right, while a decrease in wealth shifts it to the left.\"},{\"id\":44,\"question\":\"How does monetary policy affect shifts in the AD curve?\",\"answer\":\"If the central bank increases the money supply (for example, by purchasing securities from commercial banks, lowering the reserve requirement ratio, or lowering its target for the interbank lending rate), the AD curve shifts to the right (lower interest rates boost investment and consumption). Decreasing the money supply has the opposite effect, shifting the AD curve to the left.\"},{\"id\":45,\"question\":\"How does fiscal policy affect shifts in the AD curve?\",\"answer\":\"An increase in government spending (since G is a direct component of AD) shifts the AD curve to the right, and a decrease in spending shifts it to the left. Lowering taxes increases the disposable income available to consumers and businesses to spend, shifting the AD curve to the right, while raising taxes shifts it to the left.\"},{\"id\":46,\"question\":\"What factors shift the SRAS curve?\",\"answer\":\"Changes in nominal wages, input prices (such as natural resource prices), expectations about future output prices and the general price level, business taxes and subsidies, and exchange rates all shift the SRAS curve. In addition, any factor that shifts LRAS shifts SRAS by the same amount.\"},{\"id\":47,\"question\":\"What factors shift the LRAS curve?\",\"answer\":\"Growth in the labor supply and the quality of labor (human capital), growth in the supply of natural resources, growth in the supply of physical capital, and growth in productivity and technology all shift the LRAS curve to the right. These factors expand the economy's resource base.  ## Equilibrium GDP and Prices\"},{\"id\":48,\"question\":\"What are the four possible forms of macroeconomic equilibrium?\",\"answer\":\"1) Long-run full employment equilibrium; 2) Short-run recessionary gap; 3) Short-run inflationary gap; 4) Short-run stagflation.\"},{\"id\":49,\"question\":\"What does the long-run equilibrium level of GDP equal?\",\"answer\":\"When the AD curve and the SRAS curve intersect at a single point on the LRAS curve, the economy is at potential GDP. In this case, both labor and capital are fully employed. In the long run, equilibrium GDP equals potential GDP.\"},{\"id\":50,\"question\":\"What is a recessionary gap?\",\"answer\":\"A recessionary gap occurs when the AD curve shifts to the left and intersects the short-run SRAS curve at a level below potential GDP. Real GDP falls, the price level falls, and unemployment rises. The recessionary gap measures how far equilibrium GDP falls short of potential GDP.\"},{\"id\":51,\"question\":\"What is an inflationary gap?\",\"answer\":\"An inflationary gap occurs when AD increases and the economy reaches equilibrium at a level above potential GDP. It is measured by how much real GDP exceeds potential GDP, which puts upward pressure on wages and input prices.\"},{\"id\":52,\"question\":\"What is stagflation, and what causes it?\",\"answer\":\"Stagflation is a condition in which high inflation and high unemployment occur together. It results from a decline in aggregate supply (the SRAS curve shifting to the left), for example from a sudden spike in commodity prices (particularly oil). GDP falls, but instead of the price level falling as well, it rises — a feature that distinguishes stagflation from a typical demand-driven recession.\"},{\"id\":53,\"question\":\"When AD and AS both increase, both decrease, or one increases while the other decreases, how is the effect on real GDP and the price level determined?\",\"answer\":\"When both AD and AS increase, real GDP is certain to rise, but the effect on the price level is indeterminate, depending on which curve shifts more. When both decrease, real GDP is certain to fall, but the price-level effect is indeterminate. When AD increases and AS decreases, the price level is certain to rise, but the GDP effect is indeterminate. When AD decreases and AS increases, the price level is certain to fall, but the GDP effect is indeterminate.  ## Production Function and Potential GDP\"},{\"id\":54,\"question\":\"Explain the two-factor production function Y = AF(L,K).\",\"answer\":\"Y is the economy's aggregate output, L is the quantity of labor (number of workers), K is the capital stock (equipment, structures), and A represents the state of technological knowledge, or total factor productivity (TFP). TFP is a scale factor that captures the portion of growth not accounted for by labor and capital inputs.\"},{\"id\":55,\"question\":\"What is constant returns to scale?\",\"answer\":\"Constant returns to scale describes the property that if all inputs are increased by the same proportion, output increases by that same proportion. For example, doubling all inputs doubles output.\"},{\"id\":56,\"question\":\"What is diminishing marginal productivity?\",\"answer\":\"As the quantity of one input is increased while other inputs are held constant, the additional output gained from each extra unit of that input gradually decreases. For example, in a factory of fixed size, as more workers are added, the additional output per worker declines.\"},{\"id\":57,\"question\":\"What is capital deepening, and why can't it be the basis for sustainable growth?\",\"answer\":\"Capital deepening refers to investment that increases the capital stock relative to labor. Because the marginal productivity of capital diminishes, increasing capital alone yields progressively smaller additions to output, so growth driven only by capital deepening eventually slows — therefore, long-run sustainable growth cannot rely on capital deepening alone and requires technological progress (growth in total factor productivity).\"},{\"id\":58,\"question\":\"What is the growth accounting equation?\",\"answer\":\"Growth in potential GDP = Growth in technology + WL (Growth in labor) + WC (Growth in capital), where WL and WC are the relative shares of labor and capital, respectively, in national income (in the United States, approximately 0.7 and 0.3, respectively).\"},{\"id\":59,\"question\":\"What is the per capita growth accounting equation?\",\"answer\":\"Growth in per capita potential GDP = Growth in technology + WC (Growth in capital-to-labor ratio). This means that, since capital's share in the United States is about 0.3, a 1% increase in capital per worker raises output per capita by only 0.3%.\"},{\"id\":60,\"question\":\"How is the growth rate of total factor productivity (TFP) calculated?\",\"answer\":\"TFP growth = Growth in potential GDP – [WL (Growth in labor) + WC (Growth in capital)]. TFP growth is calculated as the residual — the difference between the growth rate of potential GDP and the weighted average growth rate of labor and capital.  ## Sources of Economic Growth\"},{\"id\":61,\"question\":\"What are the five key sources of economic growth?\",\"answer\":\"1) Labor supply; 2) Human capital; 3) Physical capital; 4) Technology; 5) Natural resources.\"},{\"id\":62,\"question\":\"How are total hours worked calculated?\",\"answer\":\"Total hours worked = Labor force × Average hours worked per worker. The labor force is the portion of the population (age 16 and over) that is either employed or unemployed but seeking work.\"},{\"id\":63,\"question\":\"What is human capital, and how does it affect growth?\",\"answer\":\"Human capital is the accumulation of knowledge and skills gained through education, training, and life experience, and it measures the quality of the workforce. A more educated workforce is more productive and produces more, and it adapts more flexibly to technological change. Education also has a spillover (externality) effect — an increase in one person's education also raises the output of those around them.\"},{\"id\":64,\"question\":\"What determines the growth of the physical capital stock?\",\"answer\":\"The physical capital stock grows each year as long as net investment (gross investment minus depreciation) is positive. As a result, countries with high investment rates (such as China and North Korea) see their capital stock — and their GDP growth rate — grow quickly, reflecting a strong correlation between investment and economic growth.\"},{\"id\":65,\"question\":\"Why is technology the key driver of economic growth in developed countries?\",\"answer\":\"Technological progress allows producers to overcome the limits imposed by diminishing marginal productivity of capital. If growth relied solely on increasing inputs (labor and capital), it would be limited. Technological progress arises from spending on research and development (R\u0026D), patents, and importing or copying technology. Because TFP reflects technological progress, it is measured as a residual.\"},{\"id\":66,\"question\":\"What is the difference between renewable and non-renewable natural resources?\",\"answer\":\"Renewable resources can be replenished after use (for example, forests — trees can be replanted after being cut down). Non-renewable resources are finite, and their supply is depleted once used (for example, oil and coal).\"},{\"id\":67,\"question\":\"What did Malthusian growth theory predict, and why did it fail to come true?\",\"answer\":\"Thomas Malthus, in 1798, viewed labor as the only variable input and predicted that as population and the labor force grew, the marginal productivity of labor would approach zero, making long-run economic growth impossible. This did not come to pass because economists shifted their analysis from labor to capital, and — more importantly — to technological progress (growth in TFP), since technology allows producers to overcome diminishing marginal productivity.  ## Measures of Sustainable Growth\"},{\"id\":68,\"question\":\"What is labor productivity, and what is its formula?\",\"answer\":\"Labor productivity is the quantity of goods and services (real GDP) produced per hour of work. Labor productivity = Real GDP/Aggregate hours. An increase in labor productivity raises the standard of living.\"},{\"id\":69,\"question\":\"Ho
