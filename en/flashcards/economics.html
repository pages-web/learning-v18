w is potential GDP expressed as the product of hours worked and productivity?\",\"answer\":\"Potential GDP = Aggregate hours worked × Labor productivity. Expressed as a growth rate: Potential growth rate = Long-term growth rate of labor force + Long-term labor productivity growth rate.\"},{\"id\":70,\"question\":\"What is the most practical way to estimate an economy's sustainable growth rate?\",\"answer\":\"The sustainable growth rate equals the sum of the long-term growth rate of the labor force and the long-term growth rate of labor productivity. Since TFP and potential GDP are unobserved, while labor productivity and the quantity of labor are directly observable, this is a more practical approach.\"},{\"id\":71,\"question\":\"How do the level and growth rate of labor productivity typically differ between developed and developing countries?\",\"answer\":\"The level of labor productivity depends on accumulated human and physical capital, so it tends to be higher in developed countries (such as Germany and Ireland). The growth rate of productivity, however, tends to be higher in developing countries (those rapidly accumulating human and physical capital from a low base).\"},{\"id\":72,\"question\":\"What conclusions can be drawn about the economy and capital markets when real GDP growth runs faster or slower than potential GDP growth?\",\"answer\":\"If real GDP is growing faster than potential GDP, this is a signal that inflationary pressure is building in the economy and that the central bank is more likely to raise interest rates. If real GDP is growing slower than potential GDP, this is a signal that economic slack is increasing, inflationary pressure is easing, and the central bank is more likely to lower rates or hold them steady.  ---\"}]},{\"id\":\"business-cycles\",\"title\":\"Understanding Business Cycles\",\"cards\":[{\"id\":1,\"question\":\"According to Burns and Mitchell's (1946) definition, what is a business cycle, and what are the key features of this definition?\",\"answer\":\"A business cycle is the fluctuation found in the aggregate economic activity of nations organized around business enterprises, made up of phases such as expansion, contraction/recession, and recovery. It is recurrent but not periodic, and typically lasts from 1 to 12 years.\"},{\"id\":2,\"question\":\"What are the four phases of the business cycle?\",\"answer\":\"Trough, expansion, peak, and contraction. The peak and trough are the turning points of the cycle.\"},{\"id\":3,\"question\":\"What is a \\\"contraction\\\" or \\\"recession,\\\" and when is it called a \\\"depression\\\"?\",\"answer\":\"A contraction (recession) is the period after the peak and before the trough, during which aggregate economic activity declines. This is usually called a recession, and in a very severe, deep case it is called a depression.\"},{\"id\":4,\"question\":\"What is the common rule of thumb for identifying that a recession has begun, and what is the weakness of this rule?\",\"answer\":\"The rule of thumb is that a recession has begun if a country's real GDP growth is negative for two consecutive quarters. However, this rule can be flawed: for example, if real GDP is negative in one quarter, slightly positive in the next, and then negative again, this simple rule fails to correctly identify the recession.\"},{\"id\":5,\"question\":\"What organization dates the peaks and troughs of the business cycle in the United States, and what variables does it examine?\",\"answer\":\"The National Bureau of Economic Research (NBER) dates the U.S. business cycle, and it is not limited to real GDP alone — it examines many time series, including employment, industrial production, and sales.\"},{\"id\":6,\"question\":\"What is a \\\"boom\\\" in the late stage of an economic expansion, and how is the economy \\\"overheating\\\" reflected during this period?\",\"answer\":\"A boom is the late stage of an expansion, when the economy is \\\"testing the limits\\\" of its growth. During this period, companies have difficulty finding skilled workers, wages rise, and borrowing increases, which raises inflation risk — this is referred to as overheating.\"},{\"id\":7,\"question\":\"How does investor behavior in capital markets change during a recession, and why is the stock market considered a leading indicator?\",\"answer\":\"During a recession, investors favor safe assets such as government bonds and shares of companies with stable cash flows. The stock market typically reaches its own trough 3–6 months before the economy's trough, which is why it is considered a leading indicator of the economy.\"},{\"id\":8,\"question\":\"What general trends do unemployment, inflation, and capital spending follow in each phase of the business cycle?\",\"answer\":\"In early expansion, unemployment stays high but starts to fall gradually; inflation is stable. In late expansion, unemployment falls further and inflation accelerates somewhat. At the peak, capital spending expands rapidly even though growth is slowing, and inflation accelerates further. In contraction, unemployment rises and nearly every other indicator declines noticeably.  ## Resource Use, Housing, and External Trade Sector Behavior\"},{\"id\":9,\"question\":\"Why don't companies immediately lay off workers when an economic downturn begins, and what do they do instead?\",\"answer\":\"Because the cost of hiring and training new workers is high, companies first cut back on overtime and reduce costs, since the downturn might turn out to be only temporary, making layoffs inefficient.\"},{\"id\":10,\"question\":\"What does the gap between potential output (GDPP) and recessionary output (GDPR) represent?\",\"answer\":\"This gap represents slack resources — unemployment in the case of labor, and idleness in the case of physical capital.\"},{\"id\":11,\"question\":\"How does capital spending fluctuate across three stages of the business cycle?\",\"answer\":\"Orders for light equipment fall quickly in the early stage of contraction; orders aimed at improving efficiency, such as technology and software, recover in the early stage of expansion; and orders for heavy equipment and facilities meant to add capacity increase in the late stage of expansion.\"},{\"id\":12,\"question\":\"How does the inventory–sales ratio change over the course of the business cycle?\",\"answer\":\"At the cycle's peak, sales slow and inventories build up, so the ratio rises. In the middle of the downturn, companies cut back production and the ratio falls. Early in the recovery, sales outpace production and the ratio falls further.\"},{\"id\":13,\"question\":\"What are the three main categories of household consumption, and in what order do they decline during an economic downturn?\",\"answer\":\"(1) Durable goods, (2) non-durable goods, (3) services. Because purchases of durable goods can most easily be postponed, durable goods consumption is the first and most visibly to decline during an economic downturn.\"},{\"id\":14,\"question\":\"What is the concept of \\\"permanent income,\\\" and what type of consumption is it better suited to explaining?\",\"answer\":\"Permanent income represents the income stream a household can reliably count on, net of temporary gains and losses. This concept is better suited to explaining services consumption and baseline consumption, whereas durable goods consumption is more closely tied to disposable income.\"},{\"id\":15,\"question\":\"What can a rise in the saving rate indicate?\",\"answer\":\"A rise in the saving rate can reflect precautionary saving behavior driven by uncertainty about future income, and a desire by households to rein in spending — this can be a sign of near-term economic weakness, but it also builds up resources that support a stronger recovery later.\"},{\"id\":16,\"question\":\"Why is the housing sector so sensitive to interest rates?\",\"answer\":\"Because most home buyers finance their purchase with a mortgage, lower mortgage rates expand home buying and construction activity, while higher rates contract it.\"},{\"id\":17,\"question\":\"What role does the trend in family/household formation play in the housing cycle?\",\"answer\":\"It determines the long-run, secular demand for housing, and can be estimated from factors such as growth in the population aged 25–40. Although not directly tied to the business cycle, this factor is useful for gauging how quickly any overbuilding in the market can be corrected.\"},{\"id\":18,\"question\":\"What do imports and exports each depend on?\",\"answer\":\"Imports mainly depend on the pace of domestic GDP growth, while exports depend on the global business cycles of major trading-partner countries.\"},{\"id\":19,\"question\":\"What effect does currency appreciation have on trade flows?\",\"answer\":\"When a currency appreciates, foreign goods become relatively cheaper, increasing imports, while domestic exports become more expensive in foreign markets and decline. Currency depreciation has the opposite effect.  ## Theories of the Business Cycle\"},{\"id\":20,\"question\":\"What is the Neoclassical school's \\\"general equilibrium\\\" view, and how does it explain the business cycle?\",\"answer\":\"According to Neoclassical theory, the \\\"invisible hand\\\" brings all markets into equilibrium — if prices, interest rates, and wages are flexible, any shock is quickly absorbed and equilibrium is restored. Consequently this school has no strong business cycle theory of its own, viewing fluctuations merely as temporary disequilibria.\"},{\"id\":21,\"question\":\"What is Say's law?\",\"answer\":\"The law that \\\"supply creates its own demand,\\\" holding that every good produced will be sold — because the payments made to labor and capital used in production (wages, interest) generate the purchasing power to buy it.\"},{\"id\":22,\"question\":\"What is Schumpeter's theory of \\\"creative destruction\\\"?\",\"answer\":\"This theory explains that cycles arise in particular industries from technological advances — new, innovative entrepreneurs push old producers out of the market, but this is not an economy-wide fluctuation, only a fluctuation within that particular industry.\"},{\"id\":23,\"question\":\"What is the Austrian school's main explanation of the business cycle?\",\"answer\":\"According to the Austrian school, low interest rates drive excessive credit growth, causing excessive investment in low-return projects. When interest rates rise, these investments fail and the economy falls into recession. Accordingly, they favor limited government/central bank involvement.\"},{\"id\":24,\"question\":\"According to the Keynesian school, why can't falling wages and prices during a recession quickly restore the economy to equilibrium?\",\"answer\":\"Keynes explained that when workers' wages fall, their spending falls too, shifting aggregate demand leftward and deepening the downturn further. For this reason, he believed government policy (fiscal policy) intervention was necessary.\"},{\"id\":25,\"question\":\"What did Keynes mean by his famous phrase \\\"in the long run, we are all dead\\\"?\",\"answer\":\"This phrase emphasizes that even though markets may eventually reach equilibrium in the long run, the damage from a recession and the human suffering involved are too great, so the government should take decisive action in the short run.\"},{\"id\":26,\"question\":\"What are the main criticisms of the Keynesian approach based on fiscal policy?\",\"answer\":\"(1) Fiscal deficits increase government debt, (2) if the policy is maintained too long, the economy risks \\\"overheating,\\\" and (3) fiscal policy takes time to implement, so by the time additional stimulus takes effect, the economy may have already recovered on its own.\"},{\"id\":27,\"question\":\"What is Hyman Minsky's \\\"Minsky moment\\\"?\",\"answer\":\"This is the moment, late in an expansion, when people recognize the risk built up from heavily credit-financed speculative investment, panic, and rush into asset sell-offs. Minsky believed that excessive complacency in financial markets intensifies economic fluctuations.\"},{\"id\":28,\"question\":\"What four reasons does the Monetarist school give for criticizing Keynesian intervention?\",\"answer\":\"(1) The Keynesian model disregards the importance of the money supply, (2) it does not fully describe utility-maximizing agents, (3) it fails to account for the long-run costs (debt, interest) of government intervention, and (4) the timing of policy implementation is uncertain.\"},{\"id\":29,\"question\":\"What policy do Monetarists recommend?\",\"answer\":\"Growing the money supply at a steady, moderate rate, limiting government involvement in the economy, and keeping fiscal and monetary policy clear and stable.\"},{\"id\":30,\"question\":\"How does the New Classical school's Real Business Cycle (RBC) theory treat money?\",\"answer\":\"In the RBC model, money plays no role — economic fluctuations arise from real shocks such as changes in technology, tastes, and global prices. Monetary variables such as inflation are considered to have no effect on real GDP or unemployment.\"},{\"id\":31,\"question\":\"What is the key difference between the New Keynesian model and the New Classical model?\",\"answer\":\"The New Keynesian model assumes that prices and wages adjust slowly (\\\"sticky\\\" prices/wages), so markets do not move quickly to equilibrium — making government intervention necessary in some cases. The New Classical model, in contrast, assumes prices and wages adjust quickly, making government intervention unnecessary.  ## Unemployment\"},{\"id\":32,\"question\":\"Who makes up the \\\"labor force,\\\" and who is excluded from it?\",\"answer\":\"The labor force is the number of people who are either employed or looking for work. People who are not looking for work — retirees, children, homemakers, students — are excluded.\"},{\"id\":33,\"question\":\"What is the formula for the unemployment rate?\",\"answer\":\"Unemployment rate = unemployed / labor force.\"},{\"id\":34,\"question\":\"What is the formula for the labor force participation ratio (activity ratio)?\",\"answer\":\"Activity ratio = labor force / working-age population (ages 16–64).\"},{\"id\":35,\"question\":\"Who is a \\\"discouraged worker,\\\" and how do they affect unemployment statistics?\",\"answer\":\"A discouraged worker is someone who has given up looking for work because they believe no job is available, and is therefore counted outside the official labor force, so they are not counted in the unemployment rate — this is a form of \\\"hidden unemployment.\\\"\"},{\"id\":36,\"question\":\"Who is an \\\"underemployed\\\" person?\",\"answer\":\"An underemployed person is someone who has a job but could be working in a higher-paying job better suited to their skills. They are counted as \\\"employed\\\" when calculating the unemployment rate.\"},{\"id\":37,\"question\":\"What is frictional unemployment, and why is it typically short-term?\",\"answer\":\"Frictional unemployment is unemployment arising because people who have left a job or are seeking a new one need time to find a job better suited to their skills and interests. It includes people who have voluntarily left a job and people newly entering the labor force, and it is only short-term and transitional in nature.\"},{\"id\":38,\"question\":\"Why is the unemployment rate considered a lagging indicator?\",\"answer\":\"First, in hard times discouraged workers stop looking for work and leave the labor force, which artificially lowers the unemployment rate, while in a recovery people return to job-seeking and push the rate back up. Second, businesses are slow to hire and fire, so their response lags behind the cycle.\"},{\"id\":39,\"question\":\"What is NAIRU (non-accelerating inflation rate of unemployment), also called NARU (natural rate of unemployment)?\",\"answer\":\"This is the \\\"natural\\\" rate below which the unemployment rate creates labor market shortages and triggers a wage-price spiral. This rate differs across economies and over time, and cannot be observed directly.\"},{\"id\":40,\"question\":\"What is the formula for unit labor cost (ULC)?\",\"answer\":\"ULC = W / O, where ULC = unit labor cost, O = output per hour per worker, and W = total labor compensation per hour per worker.  ## Inflation\"},{\"id\":41,\"question\":\"Distinguish the three terms: deflation, hyperinflation, and disinflation.\",\"answer\":\"Deflation — the general price level persistently falls, with the inflation rate below 0%; hyperinflation — the inflation rate rises extremely fast, reaching as much as 500–1,000% per year; disinflation — the inflation rate is falling but remains positive (for example, going from 15–20% to 5–6%).\"},{\"id\":42,\"question\":\"Why can deflation make a recession even worse?\",\"answer\":\"During deflation, companies' revenues fall, but because the nominal amount of debt stays fixed, the real debt burden increases. This leads companies to cut spending, investment, and jobs sharply, which deepens the economic contraction further.\"},{\"id\":43,\"question\":\"What is the typical cause of hyperinflation?\",\"answer\":\"When the government cannot fund its spending through tax revenue, the monetary authority (the central bank) increases the money supply to support government spending — this causes rapid money turnover and rapid price increases.\"},{\"id\":44,\"question\":\"If the total price of a consumption basket is ¥458 in January and ¥515 in February (with the January index = 100), what are the February price index and inflation rate?\",\"answer\":\"Price index (February) = (515/458) × 100 = ¥112.45. Inflation rate = (112.45/100) − 1 = 0.1245 = 12.45%.\"},{\"id\":45,\"question\":\"What is the Laspeyres index, and what three biases does it have?\",\"answer\":\"The Laspeyres index is a price index that keeps the composition of the consumption basket fixed (at base-period quantities). Its three biases are: substitution bias, quality bias, and new product bias — all of which tend to cause an upward bias in the measured inflation rate.\"},{\"id\":46,\"question\":\"How does the Paasche index differ from the Laspeyres index, and what is the value of the Paasche index in the February 2019 example (70 liters × ¥4 + 60 liters × ¥4.5 vs. 70 × ¥3 + 60 × ¥4.4)?\",\"answer\":\"The Paasche index is calculated using the current-period consumption basket (the Laspeyres index uses the base-period basket). In the example: Paasche Index = [(70×4)+(60×4.5)] / [(70×3)+(60×4.4)] × 100 = 550/474 × 100 = 116.03.\"},{\"id\":47,\"question\":\"What is the formula for the Fisher index, and what bias does it help address?\",\"answer\":\"Fisher Index = √(IP × IL), that is, the geometric mean of the Paasche index (IP) and the Laspeyres index (IL). In the example: √(116.03 × 112.45) = 114.23. This helps reduce substitution bias.\"},{\"id\":48,\"question\":\"What is the main difference between the consumer price index (CPI) and the producer price index (PPI)?\",\"answer\":\"The CPI measures the price of a basket of goods consumed by households, while the PPI measures the change in prices of raw materials/products faced by domestic producers. Increases in the PPI can feed through into the CPI later on. In some countries the PPI is also called the wholesale price index (WPI).\"},{\"id\":49,\"question\":\"What is the difference between headline inflation and core inflation, and why do policymakers focus on core inflation?\",\"answer\":\"Headline inflation is the price index covering all goods and services, including food and energy; core inflation excludes food and energy. Policymakers focus on core inflation to avoid overreacting to short-term swings in food and energy prices.\"},{\"id\":50,\"question\":\"What is the GDP deflator, and how does it differ from the CPI?\",\"answer\":\"The GDP deflator is a price index covering the basket of all goods and services produced domestically in an economy, and it is used to \\\"deflate\\\" nominal GDP to determine the trend in real GDP growth. The CPI measures a household's consumption basket, while the GDP deflator covers all domestically produced output.\"},{\"id\":51,\"question\":\"What is the main difference between cost-push inflation and demand-pull inflation?\",\"answer\":\"Cost-push inflation is inflation that results when rising costs (usually wages) lead businesses to raise prices. Demand-pull inflation is inflation where prices rise because aggregate demand increases, which then feeds into workers' wage demands. Both arise from demand exceeding supply by too great a margin.\"},{\"id\":52,\"question\":\"What is the Monetarist view of inflation (\\\"inflation is always and everywhere a monetary phenomenon\\\")?\",\"answer\":\"Monetarists (led by Milton Friedman) view inflation as fundamentally a monetary phenomenon — an excess supply of money reduces the value of money, which drives up the general price level (the principle that \\\"too much money is chasing too few goods\\\").\"},{\"id\":53,\"question\":\"Explain the example of using Treasury Inflation-Protected Securities (TIPS) to measure inflation expectations.\",\"answer\":\"If the yield on a plain 10-year bond is 3.5% and the yield on an inflation-protected (TIPS) bond is 1.5%, we can conclude that the market expects average inflation of 3.5% − 1.5% = 2% per year (the breakeven inflation rate).  ## Economic Indicators\"},{\"id\":54,\"question\":\"What is the difference between leading, coincident, and lagging economic indicators?\",\"answer\":\"Leading indicators — their turning points come before those of the overall economy, useful for forecasting the future. Coincident indicators — their turning points occur at roughly the same time as the overall economy's, reflecting the current state. Lagging indicators — their turning points come after those of the overall economy, reflecting past conditions.\"},{\"id\":55,\"question\":\"Name three example indicators included in the Conference Board's Index of Leading Economic Indicators (LEI) in the United States.\",\"answer\":\"Examples include: average weekly hours in manufacturing, the S\u0026P 500 index, building permits for new private housing units, and the interest rate spread between the 10-year Treasury bond yield and overnight lending rates.\"},{\"id\":56,\"question\":\"What does the diffusion index measure?\",\"answer\":\"The diffusion index measures what percentage of the components of a composite indicator are rising — it shows the \\\"breadth\\\" of fluctuation within a single index, indicating how widely spread a change in the overall index is.\"},{\"id\":57,\"question\":\"What category of economic indicator are the average duration of unemployment and the change in services CPI, and why?\",\"answer\":\"Both are lagging indicators. The average duration of unemployment lags because hiring/firing decisions lag the cycle, while services CPI inflation adjusts to the cycle late.\"},{\"id\":58,\"question\":\"Why are average weekly initial claims for unemployment insurance a leading indicator?\",\"answer\":\"Because this measure is extremely sensitive to companies' hiring and firing decisions, it changes quickly, ahead of the economy's turning point.\"},{\"id\":59,\"question\":\"Why is it insufficient to rely on a single indicator alone to determine the direction of the business cycle?\",\"answer\":\"Because any given indicator may forecast well in some cycles but be misleading in others; structural changes and special economic conditions can alter the relationship between an indicator and the economy, so in practice analysts use a combination of several leading, coincident, and lagging indicators.  ---\"}]},{\"id\":\"monetary-fiscal-policy\",\"title\":\"Monetary and Fiscal Policy\",\"cards\":[{\"id\":1,\"question\":\"What are the drawbacks of a barter economy?\",\"answer\":\"It requires a double coincidence of wants, indivisible goods cannot be traded, some goods are perishable and so cannot store value, and there is no common measure of value — these are the main weaknesses of a barter economy.\"},{\"id\":2,\"question\":\"What five characteristics should money have?\",\"answer\":\"(i) readily acceptable, (ii) have a known value, (iii) be easily divisible, (iv) have a high value relative to its weight, (v) be difficult to counterfeit.\"},{\"id\":3,\"question\":\"What three basic functions does money serve?\",\"answer\":\"(1) medium of exchange, (2) store of wealth/value, (3) unit of account.\"},{\"id\":4,\"question\":\"What is fractional reserve banking?\",\"answer\":\"The practice whereby banks hold only a certain fraction of customer deposits as reserves and lend out the rest, relying on the assumption that not all depositors will withdraw their funds at the same time.\"},{\"id\":5,\"question\":\"With a reserve requirement of 10% and an initial deposit of €100, how much money in total will the banking system create? State the formula.\",\"answer\":\"New deposit/Reserve requirement = €100/0.10 = €1,000.\"},{\"id\":6,\"question\":\"What formula determines the money multiplier?\",\"answer\":\"Money multiplier = 1/reserve requirement (expressed as a decimal). The lower the reserve requirement, the higher the multiplier.\"},{\"id\":7,\"question\":\"What is the difference between narrow money and broad money?\",\"answer\":\"Narrow money consists of currency in circulation plus highly liquid deposits; broad money includes narrow money plus all other liquid assets that can be used for purchases.\"},{\"id\":8,\"question\":\"State the quantity equation of exchange from the quantity theory of money, and define the variables.\",\"answer\":\"M×V=P×Y, where M is the money supply, V is the velocity of circulation, P is the average price level, and Y is real output.\"},{\"id\":9,\"question\":\"What is money neutrality?\",\"answer\":\"The theory that, in the long run, an increase in the money supply raises only the overall price level (P) and has no effect on real output (Y) or the velocity of circulation (V).\"},{\"id\":10,\"question\":\"State the formula for the Fisher effect.\",\"answer\":\"Rnom = Rreal + πe — that is, the nominal interest rate (Rnom) equals the required real rate (Rreal) plus expected inflation (πe).\"},{\"id\":11,\"question\":\"What are the three main reasons for the demand for money?\",\"answer\":\"Transactions-related demand, precautionary demand, and speculative (portfolio) demand.  ## The Roles of Central Banks\"},{\"id\":12,\"question\":\"What are the main roles a central bank performs in a modern economy?\",\"answer\":\"Sole supplier of the currency, banker to the government and to banks, lender of last resort, regulator and overseer of the payments system, conductor of monetary policy, and supervisor of the banking system.\"},{\"id\":13,\"question\":\"What is fiat money?\",\"answer\":\"Money that cannot be converted into a physical commodity (such as gold) but is deemed legal tender by government decree.\"},{\"id\":14,\"question\":\"What does \\\"lender of last resort\\\" mean?\",\"answer\":\"It means that because the central bank has the authority to print currency, it can supply the liquidity that banks facing liquidity difficulties need.\"},{\"id\":15,\"question\":\"What does the Northern Rock example illustrate?\",\"answer\":\"A bank run triggered by the 2007 global liquidity crisis; even with central bank support, a loss of public confidence may not be enough to stop a bank run.\"},{\"id\":16,\"question\":\"Does banking supervision always fall under the central bank's remit?\",\"answer\":\"No — in some countries another agency is responsible (for example, the FSA in the United Kingdom), while in others the central bank holds that responsibility alone or jointly with another body.\"},{\"id\":17,\"question\":\"What is the overarching objective of a central bank's monetary policy?\",\"answer\":\"Price stability — that is, controlling inflation.  ## Objectives and Tools of Monetary Policy\"},{\"id\":18,\"question\":\"What costs does expected inflation create?\",\"answer\":\"Menu costs (the cost of continually changing posted prices) and shoe-leather costs (the cost of holding less cash and making more trips to the bank).\"},{\"id\":19,\"question\":\"What additional costs does unexpected inflation create?\",\"answer\":\"It creates an unfair transfer of wealth between borrowers and lenders, adds a risk premium to lending rates, and reduces the information content of market prices.\"},{\"id\":20,\"question\":\"What are the central bank's three main monetary policy tools?\",\"answer\":\"(1) open market operations, (2) the policy rate/refinancing rate, (3) the reserve requirement.\"},{\"id\":21,\"question\":\"What are open market operations, and how do they produce an expansionary or contractionary effect?\",\"answer\":\"The central bank's purchase or sale of government bonds; buying bonds increases commercial banks' reserves and, through the money multiplier mechanism, drives up growth in broad money, while selling bonds has the opposite, contractionary effect.\"},{\"id\":22,\"question\":\"What is the U.S. federal funds rate?\",\"answer\":\"The overnight interbank rate on reserves, which the Federal Open Market Committee (FOMC) seeks to steer to a target level through open market operations.\"},{\"id\":23,\"question\":\"What is a repurchase agreement (repo)?\",\"answer\":\"An arrangement in which the central bank buys bonds from banks and agrees to sell them back at a specified future date (typically ranging from overnight to two weeks); this amounts to a collateralized loan to the banks, on which the central bank earns the repo rate.\"},{\"id\":24,\"question\":\"What effect does raising the reserve requirement have, and why is it rarely used in developed economies?\",\"answer\":\"Raising the reserve requirement limits money creation and contracts the money supply; however, because it creates ongoing difficulties for banks, it is rarely used in developed economies (some have stopped setting a requirement altogether).\"},{\"id\":25,\"question\":\"Name the four main channels of the monetary transmission mechanism.\",\"answer\":\"(1) bank lending rates, (2) asset prices, (3) the expectations of economic agents, (4) the exchange rate.\"},{\"id\":26,\"question\":\"What are the three key pillars underlying the success of inflation targeting?\",\"answer\":\"Central bank independence, credibility, and transparency.\"},{\"id\":27,\"question\":\"Why is New Zealand considered the first country to adopt inflation targeting?\",\"answer\":\"Under the Reserve Bank of New Zealand Act of 1989, New Zealand's central bank was the first to be given the authority and operational independence to keep inflation within a 0–2% range, a model that was later widely copied.\"},{\"id\":28,\"question\":\"What is the difference between target independence and operational independence?\",\"answer\":\"A central bank with target independence (for example, the ECB) sets its own inflation target; a central bank with only operational independence (for example, New Zealand or the United Kingdom) merely decides its own interest rate path to achieve a target set by the government.\"},{\"id\":29,\"question\":\"Why do most developed-country central banks set their inflation target at around 2% rather than 0%?\",\"answer\":\"Targeting 0% would raise the risk of deflation, so a target of around 2% is set to stay a safe distance from deflation while also avoiding unstable inflation shocks.\"},{\"id\":30,\"question\":\"What is exchange rate targeting, and what are its advantages/disadvantages?\",\"answer\":\"A policy in which a country aims to keep its own currency fixed at a stable level against a major currency (for example, the U.S. dollar); this allows a country to \\\"import\\\" the inflation experience of a low-inflation country, but subordinating domestic interest rates to the exchange rate target can destabilize domestic economic conditions.\"},{\"id\":31,\"question\":\"What challenges do developing countries face in implementing monetary policy?\",\"answer\":\"A lack of a sufficiently liquid government bond market, rapid economic change that makes the neutral rate difficult to determine, rapid financial innovation, a weak track record of controlling inflation, and governments reluctant to grant the central bank genuine independence.  ## Contractionary/Expansionary Policy, the Neutral Rate, and Limitations\"},{\"id\":32,\"question\":\"When is monetary policy considered \\\"contractionary,\\\" and when is it considered \\\"expansionary\\\"?\",\"answer\":\"Policy is considered contractionary when the policy rate is above the neutral rate, and expansionary when it is below the neutral rate.\"},{\"id\":33,\"question\":\"State the formula for determining the neutral rate.\",\"answer\":\"Neutral rate = Trend growth + Inflation target. Example: 2.5% + 2% = 4.5%.\"},{\"id\":34,\"question\":\"What two components make up the neutral policy rate?\",\"answer\":\"(1) the real trend rate of growth of the economy, (2) long-run expected inflation.\"},{\"id\":35,\"question\":\"Should a central bank respond the same way to inflation caused by a demand shock as to inflation caused by a supply shock?\",\"answer\":\"No. When inflation rises because of a demand shock, raising rates is appropriate; but when inflation rises because of a supply shock (for example, a rise in oil prices), raising rates could worsen the downturn.\"},{\"id\":36,\"question\":\"Who are the \\\"bond market vigilantes\\\"?\",\"answer\":\"Bond market participants who, if they believe the central bank is losing control of inflation, reduce demand for long-term bonds and push up yields; this action puts a \\\"check\\\" on overly loose monetary policy.\"},{\"id\":37,\"question\":\"What is a liquidity trap?\",\"answer\":\"A situation in which the money demand curve becomes infinitely elastic (horizontal), so that the public is willing to hold any additional money without a change in interest rates; in this situation, pumping in more money fails to lower rates or affect real activity, rendering monetary policy ineffective.\"},{\"id\":38,\"question\":\"Why is deflation difficult to address with conventional monetary policy?\",\"answer\":\"It is difficult to lower nominal rates meaningfully below zero (the zero lower bound), and deflation raises the real value of debt, leading consumers to postpone consumption, which worsens deflationary conditions further.\"},{\"id\":39,\"question\":\"What is quantitative easing (QE)?\",\"answer\":\"The central bank newly \\\"prints\\\" currency to purchase large quantities of government or private-sector assets (such as bonds or mortgage-backed securities) — similar in kind to conventional open market operations but \\\"unconventional\\\" monetary policy because of its much larger scale.\"},{\"id\":40,\"question\":\"What is the main source of the limitations of monetary policy?\",\"answer\":\"Central banks cannot directly control how much money households and corporations choose to hold at banks, or banks' willingness to lend, and so cannot fully control the money supply.\"},{\"id\":41,\"question\":\"What limitation of monetary policy does the Japan example (Example 11) illustrate?\",\"answer\":\"Since the 1990s, Japan cut its policy rate to zero and implemented quantitative easing (QE), yet was unable to durably eliminate deflation, showing that monetary policy is not always effective even when a large amount of money is \\\"printed.\\\"  ## Roles and Objectives of Fiscal Policy\"},{\"id\":42,\"question\":\"What three main areas does fiscal policy affect?\",\"answer\":\"(1) aggregate demand in the overall economy, (2) the distribution of income and wealth, (3) the allocation of resources among sectors.\"},{\"id\":43,\"question\":\"How do Keynesians and monetarists differ in their view of the effectiveness of fiscal policy?\",\"answer\":\"Keynesians believe that when the economy has idle capacity, fiscal policy has a powerful effect on aggregate demand, output, and employment; monetarists believe that changes in fiscal policy have only a temporary effect and that monetary policy is more effective.\"},{\"id\":44,\"question\":\"What is a budget surplus/deficit?\",\"answer\":\"The difference between government revenue (taxes) and government spending; a surplus occurs when revenue exceeds spending, and a deficit occurs when spending exceeds revenue.\"},{\"id\":45,\"question\":\"What is an automatic stabilizer? Give an example.\",\"answer\":\"A mechanism that responds to the economic cycle without any specific intervention by policymakers; for example, unemployment benefits automatically rise during a downturn, contributing to aggregate demand, or progressive income taxes automatically rise during a boom, adding to the surplus.\"},{\"id\":46,\"question\":\"What is the difference between an automatic stabilizer and discretionary fiscal policy?\",\"answer\":\"An automatic stabilizer responds automatically to the economic cycle without any direct action by policymakers; discretionary policy, by contrast, consists of deliberate changes in taxes or spending aimed at stabilizing aggregate demand.\"},{\"id\":47,\"question\":\"What is government (national) debt?\",\"answer\":\"The cumulative sum of budget deficits accumulated over time.  ## Fiscal Policy Tools and Implementation\"},{\"id\":48,\"question\":\"Name the three main types of government spending.\",\"answer\":\"(1) transfer payments (pensions, benefits), (2) current government spending (ongoing services such as health and education), (3) capital expenditure (infrastructure).\"},{\"id\":49,\"question\":\"Why are transfer payments not counted in GDP?\",\"answer\":\"Because they are not a reward for a factor of production's contribution to real economic activity; they are simply a means of redistributing income.\"},{\"id\":50,\"question\":\"What is the difference between direct taxes and indirect taxes? Give an example of each.\",\"answer\":\"Direct taxes are levied on income, wealth, or corporate profit (for example, capital gains tax, corporate tax); indirect taxes are levied on spending on goods and services (for example, excise taxes, value-added tax/VAT).\"},{\"id\":51,\"question\":\"Name the four desirable characteristics of tax policy.\",\"answer\":\"(1) simplicity, (2) efficiency, (3) fairness (horizontal and vertical equity), (4) revenue sufficiency.\"},{\"id\":52,\"question\":\"What is the difference between \\\"horizontal equity\\\" and \\\"vertical equity\\\"?\",\"answer\":\"Horizontal equity means people in similar circumstances should pay the same tax; vertical equity means wealthier people should pay more tax (a progressive tax).\"},{\"id\":53,\"question\":\"Which adjusts more quickly — indirect taxes or capital spending — and why?\",\"answer\":\"Indirect taxes (for example, excise taxes) take effect almost immediately once announced; capital spending, by contrast, involves years of planning, approval, and implementation, so it is subject to substantial lags.\"},{\"id\":54,\"question\":\"State the formula for the fiscal multiplier and work through an example.\",\"answer\":\"Fiscal multiplier = 1/[1 − c(1 − t)], where c is the marginal propensity to consume (MPC) and t is the tax rate. Example: with t=20% and c=90%, the multiplier = 1/[1 − 0.9(1 − 0.2)] = 1/0.28 = 3.57.\"},{\"id\":55,\"question\":\"State the relationship between the marginal propensity to consume (MPC) and the marginal propensity to save (MPS).\",\"answer\":\"c + s = 1, that is, MPC + MPS = 1 (for example, if MPC = 0.9 then MPS = 0.1).\"},{\"id\":56,\"question\":\"What value does the balanced budget multiplier always take?\",\"answer\":\"It is always 1 — if the government increases spending by the same amount as the increase in taxes, output still rises, because MPC is less than 1, so consumption does not fall by the full amount of the tax increase.\"},{\"id\":57,\"question\":\"What is Ricardian equivalence?\",\"answer\":\"The theory that if the government cuts taxes and finances the shortfall through borrowing, citizens anticipate higher future taxes and so do not increase their consumption, but instead increase their saving (named after the economist David Ricardo).\"},{\"id\":58,\"question\":\"What is the structural (or cyclically adjusted) budget deficit?\",\"answer\":\"The budget deficit that would exist if the economy were operating at full employment; it is considered a more accurate measure of the fiscal stance than the actual budget deficit.\"},{\"id\":59,\"question\":\"What are the three policy lags encountered in implementing fiscal policy?\",\"answer\":\"(1) recognition lag (the time needed to recognize economic conditions), (2) action lag (the time needed for policy to be implemented), (3) impact lag (the time needed for results to appear).\"},{\"id\":60,\"question\":\"What is the \\\"crowding out\\\" effect?\",\"answer\":\"A phenomenon in which government borrowing draws on a limited pool of savings, \\\"crowding out\\\" funds that would otherwise go to private-sector investment; this raises interest rates and reduces private investment.  ## The Relationship between Monetary and Fiscal Policy\"},{\"id\":61,\"question\":\"What is the effect of combining easy fiscal policy with tight monetary policy?\",\"answer\":\"Output rises, but interest rates also rise, which has a negative effect on private-sector demand; the government sector's share of total income increases.\"},{\"id\":62,\"question\":\"What is the effect of combining easy monetary policy with easy fiscal policy?\",\"answer\":\"When both policies are loose, the combined effect is strongly expansionary — aggregate demand rises, interest rates fall (when the monetary effect dominates), and both the private and public sectors expand.\"},{\"id\":63,\"question\":\"According to IMF research, in the absence of monetary accommodation, which fiscal tool has the greatest impact on GDP?\",\"answer\":\"Direct government spending has up to six times the impact of untargeted social transfers, because recipients tend to view transfers as temporary.\"},{\"id\":64,\"question\":\"Why might quantitative easing (QE) put monetary policy independence at risk?\",\"answer\":\"When the central bank buys large quantities of government bonds, it effectively finances the budget deficit (monetization of the government deficit, or \\\"printing money\\\"), which can make the independence of monetary policy illusory.\"},{\"id\":65,\"question\":\"Why are credibility and commitment important for fiscal policy?\",\"answer\":\"If citizens believe that a high level of government budget deficits will persist, inflation expectations and long-term interest rates may rise, potentially offsetting as much as half of the intended effect of fiscal stimulus.  ---\"}]},{\"id\":\"international-trade\",\"title\":\"International Trade and Capital Flows\",\"cards\":[{\"id\":1,\"question\":\"How do gross domestic product (GDP) and gross national product (GNP) differ?\",\"answer\":\"GDP measures the market value of all final goods and services produced within a country's borders, while GNP measures the value of output produced by a country's citizens (or the factors of production they own), regardless of where that production takes place. GDP includes output produced domestically by foreigners but excludes output produced abroad by citizens living overseas; GNP does the opposite. GDP is more widely used to measure economic activity and employment.\"},{\"id\":2,\"question\":\"What do imports and exports mean, and how are services classified as imports or exports?\",\"answer\":\"Imports are goods and services purchased by a domestic economy (households, firms, government) from abroad; exports are goods and services sold from the domestic economy to foreign buyers. Services are classified the same way: for example, if a Greek shipping company transports wine imported into the United States from France, that transport service counts as a U.S. import from Greece.\"},{\"id\":3,\"question\":\"What is the terms of trade, and how is it defined?\",\"answer\":\"The terms of trade is the ratio of a country's export price index to its import price index (export prices ÷ import prices), representing how many units of imports can be purchased with one unit of exports. If export prices rise more than import prices, the terms of trade are said to have improved, since the country can now buy more imports with the same amount of exports; the opposite case is a deterioration.\"},{\"id\":4,\"question\":\"What are net exports and a trade surplus/deficit, and how do they link a country to the rest of the world?\",\"answer\":\"Net exports equal the value of exports minus the value of imports. If exports equal imports, trade is balanced; if exports exceed imports, there is a trade surplus, and if imports exceed exports, there is a trade deficit. A country running a trade surplus lends to and acquires assets from foreigners, while a country running a trade deficit must borrow from abroad or sell off its assets.\"},{\"id\":5,\"question\":\"Explain the concepts of autarky, a closed economy, an open economy, and the world price.\",\"answer\":\"Autarky (a closed economy) describes a country that does not trade with other nations and produces and consumes all goods and services domestically; the price prevailing under these conditions is called the autarkic price. An open economy trades with other countries, and in the absence of trade restrictions its members can buy and sell goods and services at the world price that prevails in the global market.\"},{\"id\":6,\"question\":\"How are free trade and trade protection distinguished?\",\"answer\":\"Free trade means a country's government places no restrictions on its ability to trade, so (global aggregate) supply and demand determine the equilibrium prices and quantities of imports and exports. Government policies that impose restrictions such as tariffs or import quotas are called trade protection, and they limit the operation of market forces.\"},{\"id\":7,\"question\":\"What does globalization refer to?\",\"answer\":\"Globalization refers to the increasing worldwide integration of markets for goods, services, and capital. It also encompasses related phenomena such as the growing role of multinational corporations and the increasing involvement of international institutions such as the IMF, WTO, and World Bank in domestic policy.\"},{\"id\":8,\"question\":\"How do foreign direct investment (FDI) and foreign portfolio investment (FPI) differ?\",\"answer\":\"FDI is a direct investment by a firm from one country (the home country) into productive assets in another country (the host country), which turns the firm into a multinational corporation (MNC). FPI is short-term investment by individuals, firms, or institutional investors (such as pension funds) in foreign financial instruments such as stocks and government bonds.\"},{\"id\":9,\"question\":\"What is absolute advantage?\",\"answer\":\"A country has an absolute advantage in producing a particular good (or service) if it can produce it at a lower cost, or more specifically using fewer resources, than its trading partner.\"},{\"id\":10,\"question\":\"What is comparative advantage, and how is it related to opportunity cost?\",\"answer\":\"A country has a comparative advantage in producing a particular good if its opportunity cost of producing that good is lower than its trading partner's. Opportunity cost is the amount of another good that must be given up to produce one additional unit of the good in question (in other words, the forgone opportunity).\"},{\"id\":11,\"question\":\"A worker in Brazil can produce 20 pens or 40 pencils per day; a worker in Vietnam can produce 10 pens or 60 pencils per day. Which country has a comparative advantage in pens?\",\"answer\":\"Vietnam's opportunity cost of a pen is 6 pencils (60÷10), while Brazil's is 2 pencils (40÷20). Since Brazil has the lower opportunity cost, Brazil has a comparative advantage in pens. For pencils, Vietnam's opportunity cost is 1/6 of a pen and Brazil's is 1/2 of a pen, so Vietnam has a comparative advantage in pencils. Even though Brazil has no absolute advantage in either good, it can still benefit from trade through its comparative advantage.\"},{\"id\":12,\"question\":\"A worker in the United Kingdom can produce 4 machine tools or 8 yards of cloth per day; a worker in India can produce 2 machine tools or 16 yards of cloth. Which country has an absolute advantage and a comparative advantage in each good?\",\"answer\":\"The U.K. has an absolute advantage in machine tools and India has an absolute advantage in cloth (each produces more per worker). The U.K.'s opportunity cost of a machine tool is 2 yards of cloth (8÷4), while India's is 8 yards of cloth (16÷2), so the U.K. has a comparative advantage in machine tools. India's opportunity cost of cloth is 1/8 of a machine tool versus the U.K.'s 1/2 of a machine tool, so India has a comparative advantage in cloth.\"},{\"id\":13,\"question\":\"For both countries to gain from trade, within what range must the world price lie?\",\"answer\":\"The world price must lie between the two trading partners' autarkic prices. For example, in the U.K.–India machine tools case, if the autarkic price lies between 2 and 8 yards of cloth (1 machine tool = 2 to 8 yards of cloth), both countries gain from trade. The farther the world price diverges from a country's own autarkic price, the greater that country's gains from trade.\"},{\"id\":14,\"question\":\"In the Ricardian model, what is the source of comparative advantage?\",\"answer\":\"In the Ricardian model, labor is the sole (variable) factor of production, and differences in labor productivity across countries, arising from differences in technology, are the source of comparative advantage. The country with the lower opportunity cost has a comparative advantage in that good and specializes in producing it.\"},{\"id\":15,\"question\":\"In the Heckscher–Ohlin model (factor-proportions theory), what is the source of comparative advantage?\",\"answer\":\"In the Heckscher–Ohlin model, labor and capital are both variable factors of production, and differences in countries' relative factor endowments are the source of comparative advantage. A country has a comparative advantage in the good that uses its relatively abundant factor intensively (for example, a capital-abundant country exports capital-intensive goods).\"},{\"id\":16,\"question\":\"In the Heckscher–Ohlin model, what effect does opening up to trade have on the domestic distribution of income?\",\"answer\":\"Opening to trade benefits the abundant factor and hurts the scarce factor, because rising export prices and falling import prices shift the derived demand for the factors used intensively in those goods. In theory, if markets have homogeneous goods, homogeneous factors, and identical technology, free trade equalizes factor prices across countries (factor price equalization), though in practice this is muted by real-world imperfections in these assumptions.  ## Benefits and Costs of International Trade\"},{\"id\":17,\"question\":\"What does \\\"gains from exchange\\\" mean?\",\"answer\":\"Trade allows a country to receive a higher price for its exports and pay a lower price for its imports, and this benefit is called the gains from exchange. It increases production of export goods, decreases production of import goods, makes resource allocation more efficient, and while not every individual consumer or producer necessarily ends up better off, winners can in principle compensate losers so that everyone is made better off.\"},{\"id\":18,\"question\":\"Name the main benefits of trade.\",\"answer\":\"(1) Gains from exchange and specialization (based on comparative advantage); (2) increased economies of scale for firms; (3) greater product variety for households and firms; (4) increased competition; (5) more efficient resource allocation.\"},{\"id\":19,\"question\":\"What is intra-industry trade, and how does it relate to the monopolistically competitive model?\",\"answer\":\"Intra-industry trade occurs when a country both exports and imports goods within the same product category (for example, EU countries exporting and importing automobiles among themselves). In the monopolistically competitive model, countries that are similar to one another each specialize in different varieties of a good and import other varieties; consumers benefit from a wider range of product choice, and firms benefit from lower average costs as the scale of the market increases.\"},{\"id\":20,\"question\":\"How do \\\"learning by doing\\\" and knowledge spillovers contribute to economic growth through trade?\",\"answer\":\"\\\"Learning by doing\\\" refers to the phenomenon in industries such as semiconductors where unit production costs fall as cumulative output rises because of accumulated experience. Knowledge spillovers occur when investment in creating knowledge benefits the learning and innovation of other firms and institutions beyond the one that made the investment; research by Coe and Helpman (1995) found that roughly one-quarter of the benefits of G-7 countries' R\u0026D investment spill over to their trading partners.\"},{\"id\":21,\"question\":\"What costs do opponents of free trade emphasize?\",\"answer\":\"They emphasize rising income inequality and job losses in developed countries resulting from import competition. As trade is liberalized, resources (investment) must shift into export industries and out of import-competing industries, less efficient firms exit the market, unemployment rises in the short run, and displaced workers need to be retrained.\"},{\"id\":22,\"question\":\"What does the phrase \\\"gains from trade\\\" mean?\",\"answer\":\"The gains from trade mean that the total benefits of trade exceed its total costs (losses). It does not mean that every participant (producers, consumers, government) benefits equally, or even at all — only that the total gains exceed the total losses, and in theory winners could compensate losers so that everyone ends up better off.  ## Trade and Capital Flow Restrictions\"},{\"id\":23,\"question\":\"What is a tariff, and what is its main purpose?\",\"answer\":\"A tariff is a tax a government levies on imported goods. Its main purpose is to protect the domestic industry producing a similar good by raising the price of imports above the free-trade price, thereby reducing demand for imports; it can also sometimes be intended to reduce a trade deficit.\"},{\"id\":24,\"question\":\"In trade policy, how are a \\\"small country\\\" and a \\\"large country\\\" distinguished?\",\"answer\":\"Regardless of size, population, or GDP, a \\\"small country\\\" is one that cannot influence the world price of a given good — that is, it is a price taker in the world market (for example, Brazil is a small country in the world car market). A \\\"large country\\\" is a large enough importer of a good that it can affect the world price. When a large country imposes a tariff, exporters, trying not to lose market share, lower their prices, which changes the terms of trade and redistributes income from the exporting country to the importing country.\"},{\"id\":25,\"question\":\"How can the economic effects of a tariff (or quota) on an importing country be summarized?\",\"answer\":\"Consumer surplus: – (A + B + C + D); producer surplus: +A; tariff revenue (or quota rent): +C; national welfare: –B – D. Because the loss in consumer surplus exceeds the sum of the gain in producer surplus and government revenue, a deadweight loss of B + D results.\"},{\"id\":26,\"question\":\"South Africa's domestic production of corrugated paper is 110,000 tons per year, domestic demand is 200,000 tons, and the world price is $5/ton. A 20% tariff raises the price to $6, domestic production rises to 130,000 tons, and demand falls to 170,000 tons. What is the loss in consumer surplus?\",\"answer\":\"The loss in consumer surplus = $1 × 170,000 + 1/2 × $1 × 30,000 = $185,000 (representing area A + B + C + D). The gain in producer surplus = $1 × 110,000 + 1/2 × ($1 × 20,000) = $120,000 (area A). The increase in government revenue = $1 × 40,000 = $40,000 (area C). The deadweight loss = 1/2 × $1 × 20,000 + 1/2 × $1 × 30,000 = $25,000 (area B + D).\"},{\"id\":27,\"question\":\"What is an import quota, and how does it differ from a tariff?\",\"answer\":\"An import quota is a restriction limiting the quantity of a good that may be imported over a given period. The key difference from a tariff is that while a government collects revenue from a tariff, under a quota foreign producers typically raise their prices and capture the extra benefit, known as the quota rent, which may instead be captured by the importing country (for example, through auctioning import licenses) or by the government.\"},{\"id\":28,\"question\":\"What is a voluntary export restraint (VER), and how does it differ from an import quota?\",\"answer\":\"A VER is a trade restriction under which the exporting country agrees to limit its exports to a specific quantity. The key difference from an import quota is who imposes it: a quota is imposed by the importer, while a VER is imposed by the exporter. Under a VER, the entire quota rent accrues to the exporter (or exporting country), which causes a greater welfare loss for the importing country.\"},{\"id\":29,\"question\":\"What is an export subsidy, and what effect does it have on net welfare? What is a countervailing duty?\",\"answer\":\"An export subsidy is a payment a government makes to a firm for each unit of a good it exports, intended to promote exports, but it interferes with the operation of free markets, distorts trade away from comparative advantage, and reduces overall welfare. A countervailing duty is a tariff that an importing country imposes on subsidized exports.\"},{\"id\":30,\"question\":\"Compare and summarize the welfare effects of tariffs, quotas, export subsidies, and VERs on a country.\",\"answer\":\"All four have roughly similar effects: prices rise (in the case of a subsidy, the domestic price in the exporting country), domestic consumption falls, domestic production rises, and trade falls (imports fall, or in the case of a subsidy, exports rise). National welfare falls under all four for a small country, while for a large country a tariff — and, in theory, a quota — can raise welfare. Government revenue rises with a tariff, is ambiguous with a quota (depending on who captures the rent), falls with a subsidy (since government spending rises), and is unaffected by a VER (since the rent goes to foreigners).\"},{\"id\":31,\"question\":\"What is a capital restriction, and how does it differ from a trade restriction?\",\"answer\":\"A capital restriction is a control placed on foreigners' ability to hold domestic assets or on domestic residents' ability to hold foreign assets. A trade restriction limits the openness of markets for goods and services, while a capital restriction limits the openness of financial markets.\"},{\"id\":32,\"question\":\"In what forms can capital restrictions be implemented?\",\"answer\":\"They can take the form of taxes (for example, a special tax on income from international investment), price or quantity controls (for example, a reserve requirement requiring a certain percentage of foreign funds placed with domestic banks to be held at the central bank), outright prohibitions (restrictions or limits on borrowing by a counterparty), or administrative controls (requiring certain asset transactions to be approved by a government agency).\"},{\"id\":33,\"question\":\"For what reasons and purposes did Malaysia impose capital restrictions in 1998?\",\"answer\":\"During the Asian financial crisis that followed Thailand's abandonment of the baht's fixed exchange rate against the U.S. dollar, Malaysia experienced a short-term outflow of capital. On September 1, 1998, Malaysia banned transfers between domestic and foreign accounts, fixed the ringgit's exchange rate at 3.8 to the U.S. dollar, restricted the repatriation of funds held abroad, and sought to restore monetary independence and lower interest rates; as a result, the economy stabilized, but at a long-run cost that included being dropped from the MSCI developed-market index.\"},{\"id\":34,\"question\":\"What is a trading bloc, or regional trade agreement (RTA)?\",\"answer\":\"A trading bloc is a group of countries that have signed an agreement to reduce or progressively eliminate barriers to trade and the movement of factors of production among member countries, and it may or may not maintain common trade restrictions against non-member countries.\"},{\"id\":35,\"question\":\"What is a free trade area (FTA)?\",\"answer\":\"An FTA is one of the most common forms of regional integration, in which all barriers to the flow of goods and services among member countries are eliminated; however, each country retains its own trade policy toward non-member countries (for example, NAFTA).\"},{\"id\":36,\"question\":\"What is a customs union?\",\"answer\":\"A customs union extends an FTA by allowing free movement of goods and services among member countries and also establishing a common trade policy toward non-member countries (for example, the Benelux customs union of 1947).\"},{\"id\":37,\"question\":\"What is a common market?\",\"answer\":\"A common market has all the characteristics of a customs union and additionally allows free movement of factors of production (labor, capital) among member countries, representing the next stage of economic integration (for example, MERCOSUR).\"},{\"id\":38,\"question\":\"Explain an economic union and a monetary union.\",\"answer\":\"An economic union has all the characteristics of a common market and additionally requires common economic institutions and policy coordination (for example, the European Union since 1993). If members also adopt a common currency (for example, the 19 EU member countries that have adopted the euro), it is simultaneously a monetary union.\"},{\"id\":39,\"question\":\"Explain the difference between trade creation and trade diversion.\",\"answer\":\"Trade creation occurs when regional integration causes high-cost domestic production to be replaced by lower-cost imports from a member country, making resource allocation more efficient. Trade diversion occurs when lower-cost imports from a non-member country are replaced by higher-cost imports from a member country because of tariffs, potentially making resource allocation less efficient. If the trade creation effect exceeds the trade diversion effect, the net welfare effect is positive.  ## Balance of Payments Accounts and Double-Entry Bookkeeping\"},{\"id\":40,\"question\":\"What is the balance of payments (BOP)?\",\"answer\":\"The balance of payments is a double-entry bookkeeping system that summarizes a country's economic transactions with the rest of the world over a specific period (usually a quarter or a year). The BOP captures payments for exports and imports as well as financial transactions and financial transfers.\"},{\"id\":41,\"question\":\"In the BOP, what do a debit entry and a credit entry represent for a transaction?\",\"answer\":\"A debit records the value of imported goods, the purchase of foreign financial assets, payments received for exports, and payments received from debtors — effectively representing an increase in assets or a decrease in liabilities. A credit records payments for imported goods, payments for purchased foreign assets, and payments made to creditors — representing a decrease in assets or an increase in liabilities. In theory, the sum of all debits equals the sum of all credits, so the overall balance should be zero.\"},{\"id\":42,\"question\":\"Into what sub-accounts is the current account divided?\",\"answer\":\"The current account has four sub-accounts: (1) merchandise trade — all raw materials and manufactured goods bought, sold, or given away; (2) services — such as tourism, transportation, engineering, and consulting services; (3) income receipts — income such as dividends and interest earned on asset ownership; (4) unilateral transfers — one-way transfers such as worker remittances from abroad, foreign aid, and gifts.\"},{\"id\":43,\"question\":\"Into what sub-accounts is the capital account divided?\",\"answer\":\"The capital account has two sub-accounts: (1) capital transfers — such as debt forgiveness, migrants' transfers (goods and financial assets migrants bring with them when entering or leaving a country), and gift and inheritance taxes; (2) the acquisition and disposal of non-produced, non-financial assets (for example, trade in intangible assets such as rights to natural resources, patents, and copyrights).\"},{\"id\":44,\"question\":\"Into what sub-accounts is the financial account divided?\",\"answer\":\"The financial account has two sub-accounts: (1) a country's assets abroad — further divided into official reserve assets, government assets, and private assets (such as gold, foreign currency, foreign securities, the reserve position at the IMF, and direct investment); (2) foreign-owned assets located in the reporting country — divided into official and other foreign assets (such as securities issued by the reporting country's government or private sector, and direct investment).\"},{\"id\":45,\"question\":\"What is the double-entry principle of the BOP, and what identity (the BOP identity) does it use?\",\"answer\":\"In the BOP's double-entry bookkeeping system, every transaction involves both a debit and a credit. In theory, the sum of all debits equals the sum of all credits, so the overall balance of the BOP statement should be zero: current account + capital account + financial account ≈ 0. In practice, because transaction data come from different sources, this balance does not hold exactly (giving rise to a \\\"statistical discrepancy\\\").\"},{\"id\":46,\"question\":\"On January 9, Country A purchases $1 million of goods from Country B, agreeing to pay on December 1. How does Country A record debit and credit entries in its BOP on January 9 and on December 1?\",\"answer\":\"On January 9, Country A records the value of the goods purchased (an increase in assets) as a $1 million debit and the amount owed to Country B (an increase in liabilities) as a $1 million credit. On December 1, Country A records the decrease in its liability as a $1 million debit and the actual payment (a decrease in assets) as a $1 million credit. Total debits and total credits each sum to $2 million, so the balance is zero.\"},{\"id\":47,\"question\":\"How do investment professionals typically simplify the BOP in practice?\",\"answer\":\"Investment professionals typically treat the current account as approximately equal to the trade balance (merchandise trade + services) and combine all financing flows (the financial account + the capital account) into a single category, which they informally call the \\\"capital account.\\\" This is then further broken down into two types of flows — portfolio investment (short-term) and FDI (long-term, in productive assets).  ## National Economic Accounts and the Balance of Payments\"},{\"id\":48,\"question\":\"Write the national income identity for a closed economy.\",\"answer\":\"In a closed economy, all output Y is purchased either by the private sector (consumption C, investment I) or by the government (G), so: Y = C + I + G (1), where Y is GDP, C is private consumption, I is investment, and G is government purchases.\"},{\"id\":49,\"question\":\"Write the national income identity for an open economy, and the definition of the current account balance (CA).\",\"answer\":\"In an open economy: Y = C + I + G + X – M (2), where X is exports and M is imports. Rearranging equation (2), the current account balance can be defined as: CA = X – M = Y – (C + I + G) (3), meaning net exports equal the current account balance from a BOP perspective.\"},{\"id\":50,\"question\":\"Write the equations that define disposable income (Yd).\",\"answer\":\"Yd = Y + R – T (4), where R is net transfers and T is taxes. Disposable income is allocated between consumption (C) and private saving (Sp): Yd = C + Sp (5). From this, consumption can be written as: C = Yd – Sp = Y + R – T – Sp (6).\"},{\"id\":51,\"question\":\"Write the identity linking private saving (Sp), government saving (Sg), investment (I), and the current account balance (CA).\",\"answer\":\"Combining equations (3) and (6), and denoting (T – G – R) as government saving Sg: CA = Sp – I + (T – G – R) (7), which can be rewritten as: Sp + Sg = I + CA (8). This shows that an open economy can use its saving for either domestic investment or foreign investment (by acquiring foreign assets), whereas in a closed economy saving can only be used for domestic investment.\"},{\"id\":52,\"question\":\"Rearrange equation (8) to show the macroeconomic sources of a current account imbalance, and under what conditions does a current account deficit arise?\",\"answer\":\"Rearranging equation (8): CA = Sp + Sg – I (10). A current account deficit typically arises from low private saving, high private investment, a government budget deficit (Sg \u003c 0), or some combination of these. Conversely, a current account surplus reflects high private saving, low private investment, or a government budget surplus.  ## Trade Organizations: IMF, World Bank, WTO\"},{\"id\":53,\"question\":\"What institutions emerged from the Bretton Woods conference, and why were they created?\",\"answer\":\"During the Great Depression of the 1930s, countries' use of measures such as trade barriers and currency devaluations worsened the economic downturn. At the Bretton Woods conference held in the United States in July 1944, countries agreed on a framework for international economic cooperation, out of which the World Bank and the International Monetary Fund (IMF) were created (the IMF was formally established in December 1945). A third institution — the International Trade Organization (ITO) — was also planned, but it never came into being because the U.S. Congress failed to ratify it; in its place, GATT remained the only mechanism governing international trade until 1995.\"},{\"id\":54,\"question\":\"Name the IMF's main purpose and functions.\",\"answer\":\"The IMF's main purpose is to ensure the stability of the international monetary system (exchange rates and the international payments system). Specifically, the IMF: (1) provides a forum for cooperation on international monetary issues; (2) promotes growth in international trade, employment, economic growth, and poverty reduction; (3) promotes exchange rate stability and an open system of international payments; (4) provides member countries with temporary, secured foreign currency loans to help resolve BOP problems.\"},{\"id\":55,\"question\":\"What is the World Bank's purpose, and how do the IBRD and IDA differ?\",\"answer\":\"The World Bank's main purpose is to fight poverty in developing countries and promote environmentally sustainable economic growth. It consists of two main institutions: the International Bank for Reconstruction and Development (IBRD), which operates on market principles (raising funds by issuing bonds) and lends at low interest rates to creditworthy countries; and the International Development Association (IDA), the world's largest source of concessional, grant-like, low-interest loans to the poorest countries. Neither institution operates for profit.\"},{\"id\":56,\"question\":\"What is the purpose of the World Trade Organization (WTO), and how did it emerge from GATT?\",\"answer\":\"The WTO is the only international organization that governs cross-border trade relations between countries globally; it was established on January 1, 1995, replacing the General Agreement on Tariffs and Trade (GATT), which had operated since 1947. The WTO's main functions are administering and implementing trade agreements, serving as a platform for trade negotiations, and resolving trade disputes. The Doha round of negotiations began in Doha, Qatar in 2001, and a complete agreement has still not been reached.\"},{\"id\":57,\"question\":\"What is GATT (the General Agreement on Tariffs and Trade), and what was its historical role?\",\"answer\":\"GATT was an agreement to reduce and regulate tariffs, established by 23 countries on October 30, 1947. Because the U.S. Congress never ratified the ITO (International Trade Organization), GATT remained the sole multilateral framework governing international trade from 1948 to 1995. Particularly important negotiations took place during the Tokyo and Uruguay rounds, and in 1995 GATT was replaced by the WTO.\"},{\"id\":58,\"question\":\"Based on their core responsibilities, how can the IMF, the World Bank, and the WTO be distinguished from one another?\",\"answer\":\"The IMF ensures the stability of the international monetary system (exchange rates and the payments system) and provides member countries with foreign currency loans when BOP problems arise (for example, it provided assistance during the 2010 Greek crisis); the World Bank provides loans and advice to developing countries to reduce poverty and build basic economic infrastructure; the WTO establishes the legal and institutional foundation for international trade, administers trade agreements, and resolves disputes.  ---\"}]},{\"id\":\"exchange-rates\",\"title\":\"Currency Exchange Rates\",\"cards\":[{\"id\":1,\"question\":\"What is an exchange rate, and how are the \\\"base currency\\\" and \\\"price currency\\\" defined?\",\"answer\":\"An exchange rate is the value of one currency expressed in terms of another — it always involves two currencies. When quoted as \\\"A/B,\\\" it represents the number of units of currency A required to purchase one unit of currency B. Here A is the price currency (the numerator), and B is the base currency (the denominator, always treated as 1 unit).\"},{\"id\":2,\"question\":\"What is the difference between the nominal exchange rate and the real exchange rate?\",\"answer\":\"The nominal exchange rate is the rate quoted directly in the market — the rate we hear about day to day. The real exchange rate is an index that adjusts the nominal rate for the price levels of the two countries, measuring the relative change in purchasing power; it is not directly traded in the market — it is purely an index constructed by analysts.\"},{\"id\":3,\"question\":\"What formula expresses the real exchange rate (using the d/f convention, i.e., the domestic currency is the price currency)?\",\"answer\":\"Real exchange rate(d/f) = (S_d/f × P_f)/P_d = S_d/f × (P_f/P_d), where S_d/f is the spot rate expressed as units of domestic currency per one unit of foreign currency, P_f is the foreign price level (in foreign currency), and P_d is the domestic price level (in domestic currency).\"},{\"id\":4,\"question\":\"What does purchasing power parity (PPP) theory claim, and why does it fail to hold in reality?\",\"answer\":\"PPP theory holds that, over the long run, nominal exchange rates adjust so that an identical good (or basket of goods) costs the same in different markets. In reality, however, goods and services are not identical across countries, and trade barriers, transportation costs, and import tariffs exist, so nominal rates persistently deviate from PPP levels.\"},{\"id\":5,\"question\":\"In daily FX market trading volume, which dominates more: international trade or capital market transactions?\",\"answer\":\"Capital market transactions (such as direct investment and portfolio investment) account for a much larger share of daily FX trading than the transactions needed to settle international trade in goods. This reflects the extremely high mobility of capital.\"},{\"id\":6,\"question\":\"Why is the line between hedging and speculation often unclear, and how does a corporate treasury typically evaluate the results of its hedging?\",\"answer\":\"Because an exporting company often does not know precisely how much foreign currency revenue it will receive or when, discretion enters into the hedging decision; the possibility of over-hedging or under-hedging blurs into speculation. Treasury departments typically compare actual results against a fixed-ratio benchmark (e.g., 100% hedged) to measure the gain or loss from actual performance.\"},{\"id\":7,\"question\":\"What is a spot transaction, and what is the standard settlement period?\",\"answer\":\"A spot transaction is an exchange of currencies for near-immediate delivery, and for most currencies settlement occurs on a \\\"T+2\\\" basis (two business days after the trade). An exception is the Canadian dollar (CAD), which settles against the US dollar on a \\\"T+1\\\" basis.\"},{\"id\":8,\"question\":\"What is the difference between an outright forward contract and an FX swap?\",\"answer\":\"A forward contract is an agreement today to exchange currencies at a future date (beyond T+2) at a rate agreed upon today. An FX swap is a combination of a simultaneous spot transaction and a forward contract, used mainly to roll an existing forward position forward to a new date or to achieve swap funding.\"},{\"id\":9,\"question\":\"How does a currency futures contract differ from an OTC forward contract?\",\"answer\":\"Futures trade on an exchange (e.g., the IMM division of the CME), have standardized contract sizes and settlement dates, and collateral is marked to market daily. OTC forwards offer flexible size and dates but carry higher counterparty risk.\"},{\"id\":10,\"question\":\"What is an FX option?\",\"answer\":\"An FX option is a contract that, in exchange for an upfront premium, grants the right (but not the obligation) to execute an FX transaction at an agreed rate on a specified future date. The holder exercises the option only when it is profitable to do so.\"},{\"id\":11,\"question\":\"How are the \\\"buy side\\\" participants in the FX market classified?\",\"answer\":\"Corporate accounts, real money accounts (insurers, pension funds, ETFs, etc., with limited leverage), leveraged accounts (hedge funds, CTAs, proprietary traders, algorithmic traders), retail accounts, governments, central banks, and sovereign wealth funds (SWFs).\"},{\"id\":12,\"question\":\"How is the \\\"sell side\\\" of the FX market tiered?\",\"answer\":\"The largest, most globally active dealing banks (such as Deutsche Bank, Citigroup, UBS, and HSBC) handle the majority of daily trading volume and can internally cross many client transactions. Other regional or local banks route their trades through these top-tier banks, largely because they lack a global client base.\"},{\"id\":13,\"question\":\"According to the BIS's 2016 Triennial Survey, what was the size and composition of daily global FX turnover?\",\"answer\":\"Average daily turnover in April 2016 was approximately USD 5.1 trillion. By product: spot 33%, forwards 14%, swaps 49%, options 5%. By counterparty: interbank 42%, other financial institutions 51%, and non-financial customers only 8%. All of the five most actively traded currency pairs involved the USD, with London the largest trading center, followed by New York and Tokyo.  ## Exchange Rate Quotations and Cross-Rate Calculations\"},{\"id\":14,\"question\":\"What is the difference between a direct quote and an indirect quote?\",\"answer\":\"A direct quote makes the domestic currency the price currency and the foreign currency the base currency (S_d/f). An indirect quote makes the domestic currency the base currency (S_f/d). The two are simply reciprocals (inverses) of each other.\"},{\"id\":15,\"question\":\"When a bank gives a two-sided price (bid-offer), how are \\\"bid\\\" and \\\"offer\\\" def
